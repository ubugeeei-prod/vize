packages:
  - "playground"
  - "npm/*"
  - "npm/builder/*"
  - "npm/compose/*"
  - "editors/*"
  - "npm/framework/*"
  - "npm/ui"
  - "!editors/vscode-art"
  - "!editors/vscode"
  - "npm/builder/vite/example"
  - "npm/builder/rspack/example"
  - "npm/fresco/examples/*"
  - "examples/vite-musea"
  - "examples/oxlint-vize"
  - "examples/jsx-tsx"
  - "docs"
  - "tests"
  - "tests/tooling/jsx-vapor-oracle"
  - "tools/benchmarks/scripts"
  - "crates/vize_patina/tests/fixtures/unsafe-template-binding/reports-8752-8755"

minimumReleaseAgeExclude:
  - "hono@4.13.11"
  # First-party native binaries are published by our own release; any version.
  - "@vizejs/native-*"
  - "@vue/compiler-core@3.6.0-rc.11"
  - "@vue/compiler-dom@3.6.0-rc.11"
  - "@vue/compiler-sfc@3.6.0-rc.11"
  - "@vue/compiler-ssr@3.6.0-rc.11"
  - "@vue/compiler-vapor@3.6.0-rc.11"
  - "@vue/reactivity@3.6.0-rc.11"
  - "@vue/runtime-core@3.6.0-rc.11"
  - "@vue/runtime-dom@3.6.0-rc.11"
  - "@vue/runtime-vapor@3.6.0-rc.11"
  - "@vue/server-renderer@3.6.0-rc.11"
  - "@vue/shared@3.6.0-rc.11"
  - "vue@3.6.0-rc.11"

patchedDependencies:
  "@ox-content/vite-plugin@2.88.0": "patches/@ox-content__vite-plugin@2.88.0.patch"
  "@nuxt/devtools@3.4.1": "patches/@nuxt__devtools@3.4.1.patch"
  "braces@3.0.3": "patches/braces@3.0.3.patch"
  "node-forge@1.4.0": "patches/node-forge@1.4.0.patch"

overrides:
  "@azure/msal-node>uuid": "11.1.1"
  "@hono/node-server": "2.0.11"
  "@babel/plugin-syntax-jsx": "7.29.7"
  # Must stay on the v3 line: nuxt 4.5.1 pulls unhead 3.x and its generated
  # `.nuxt/unhead-options.mjs` imports `legacyPlugins`, which only @unhead/vue
  # v3 exports. Pinning v2 here broke every Nuxt fixture build.
  "@unhead/vue": "3.3.1"
  "brace-expansion@2": "2.1.2"
  # 5.0.9 is still inside GHSA-qhr7-859c-m2p7 / GHSA-6j4f-fj2g-mc7p / GHSA-q2hr-2g5m-vwhr.
  "brace-expansion@>=5.0.0 <5.0.12": "5.0.12"
  defu: "6.1.7"
  devalue: "5.9.3"
  dompurify: "3.4.13"
  esbuild: "0.28.1"
  fast-uri: "3.1.8"
  "glob>minimatch": "10.2.5"
  h3: "1.15.11"
  hono: "4.13.11"
  ip-address: "10.7.1"
  launch-editor: "2.14.2"
  "nanoid@>=3.0.0 <3.3.17": "3.3.17"
  nanotar: "0.3.0"
  nitropack: "2.13.4"
  node-forge: "1.4.0"
  "postcss@>=8.0.0 <8.5.26": "8.5.26"
  nuxt: "4.5.1"
  qs: "6.16.0"
  "readdir-glob>minimatch": "10.2.5"
  shell-quote: "1.11.0"
  # v4 removes unsafe argument forms; Devtools' default import is patched below.
  simple-git: "4.0.1"
  "simple-git>@simple-git/argv-parser": "2.0.1"
  "seroval@<=1.6.2": "1.6.3"
  "source-map-js@>=1.0.0 <1.2.2": "1.2.2"
  "proxy-addr@>=1.1.0 <2.0.8": "2.0.8"
  "postcss-selector-parser@>=7.0.0 <7.1.6": "7.1.6"
  "tinypool@>=2.0.0 <2.1.2": "2.1.2"
  # Stable production Vue only: preserve literal beta/RC and test oracle aliases.
  "vue@3.5.41": "3.5.42"
  srvx: "0.11.15"
  svgo: "4.1.0"
  tar: "7.5.21"
  undici: "8.10.2"
  "vite@>=7.0.0 <7.3.5": "7.3.5"
  "vite@>=8.0.0 <8.1.6": "8.1.6"
  "vite@>=8.2.0 <8.2.4": "8.2.4"
  yaml: "2.9.0"

catalogs:
  # Real @vue/babel-plugin-jsx toolchain, used only as the differential oracle
  # for JSX/TSX babel-compatibility tests (crates/vize_atelier_jsx/tests/babel_compat).
  # Bump deliberately: a version change re-records the committed ground truth.
  babel-jsx-oracle:
    "@babel/core": "7.29.0"
    "@babel/plugin-syntax-typescript": "7.28.6"
    "@vue/babel-plugin-jsx": "2.0.1"

  # Real vue-jsx-vapor compiler/runtime used only by the mounted JSX semantic
  # differential oracle. Bump deliberately: a version change requires a
  # reviewed verdict-inventory update.
  jsx-vapor-oracle:
    vue: "3.6.0-rc.10"
    vue-jsx-vapor: "3.2.26"

  # Official legacy Vue compiler baselines used by the formatter's
  # dialect-aware SFC semantic-preservation oracle. These aliases must remain
  # exact so evidence can name one compiler implementation unambiguously.
  legacy-vue-oracle:
    "@babel/parser": "7.29.0"
    "vue-sfc-compiler-2-6": "npm:vue-template-compiler@2.6.14"
    "vue-sfc-compiler-2-7": "npm:@vue/compiler-sfc@2.7.16"

  # Real @nuxt/eslint toolchain, used only as the differential oracle for the
  # Nuxt lint config port (npm/framework/nuxt/test/nuxt-eslint-compat).
  # Bump deliberately: a version change re-records the committed ground truth.
  nuxt-eslint-oracle:
    "@nuxt/eslint": "1.16.0"
    "@nuxt/eslint-config": "1.16.0"

  # Independent Pug compiler used by the real-project formatter semantic
  # oracle. Bump deliberately because its generated HTML is ground truth.
  pug-oracle:
    pug: "3.0.4"

  # Shared repo and file-system utilities.
  repo-tooling:
    "@iarna/toml": "2.2.5"
    "@pkl-community/pkl": "0.30.2"
    ajv: "8.20.0"
    glob: "13.0.6"
    json-schema-to-typescript: "15.0.4"
    pkg-pr-new: "0.0.87"
    prettier: "3.8.3"
    semver: "7.8.5"
    tinyglobby: "0.2.17"
    zigpty: "0.2.1"

  # TypeScript toolchain shared across workspace packages.
  typescript:
    "@types/node": "25.9.2"
    tsx: "4.23.12"
    typescript: "6.0.3"
    vue-tsc: "3.3.11"

  # Corsa runtime shipped by the Vize CLI. Keep separate from the workspace
  # TypeScript toolchain so consumers and repo packages can stay on TS 6.
  corsa-runtime:
    "@typescript/typescript-darwin-arm64": "7.0.2"
    "@typescript/typescript-darwin-x64": "7.0.2"
    "@typescript/typescript-linux-arm64": "7.0.2"
    "@typescript/typescript-linux-x64": "7.0.2"
    "@typescript/typescript-win32-arm64": "7.0.2"
    "@typescript/typescript-win32-x64": "7.0.2"

  # Vite / Vite Plus stack and adjacent build-time plugins.
  vite-stack:
    vite: "npm:@voidzero-dev/vite-plus-core@0.1.24"
    vitest: "npm:@voidzero-dev/vite-plus-test@0.1.24"
    vite-plus: "0.1.24"
    tsdown: "0.22.14"
    "@vitejs/plugin-vue": "6.0.7"
    vite-node: "6.0.0"
    vite-plugin-inspect: "11.4.1"
    unplugin: "3.3.0"

  # Stable Vue ecosystem packages retained for independent test oracles.
  vue-stable:
    vue: "3.5.35"
    "@vue/compiler-dom": "3.5.35"
    "@vue/compiler-sfc": "3.5.35"
    "@vue/runtime-core": "3.5.35"
    "@vue/runtime-dom": "3.5.35"
    "@vue/test-utils": "2.4.10"
    vue-router: "4.5.1"

  # Shipping Vue dependencies are separate from the immutable test oracle.
  vue-production:
    vue: "3.5.42"

  # Vue beta track used by the playground and benchmark harnesses.
  vue-beta:
    vue: "3.6.0-beta.10"
    "@vue/compiler-sfc": "3.6.0-beta.10"
    "@vue/compiler-vapor": "3.6.0-beta.10"

  # Test runners and browser automation.
  testing:
    "@playwright/test": "1.62.1"
    happy-dom: "20.11.2"
    playwright: "1.62.1"

  # Lint and formatting toolchain.
  linting:
    oxfmt: "0.63.0"
    oxlint: "1.78.0"
    "@oxlint/plugins": "1.78.0"

  # Bundlers beyond the Vite stack.
  bundlers:
    "@rspack/cli": "2.1.8"
    "@rspack/core": "2.1.8"
    esbuild: "0.28.1"
    rollup: "4.62.4"
    webpack: "5.109.2"

  # External framework integrations and native build helpers.
  integrations:
    "@modelcontextprotocol/sdk": "1.32.1"
    "@napi-rs/cli": "3.6.2"
    "@nuxt/kit": "4.5.2"
    "@ox-content/vite-plugin": "2.88.0"

  # Runtime kit loaded by @vizejs/nuxt. Keep this aligned with Nuxt 2 Bridge's
  # kit line so Nuxt 2's module loader does not pull in Nuxt 4-only syntax.
  nuxt-module:
    "@nuxt/kit": "3.11.2"

  # Rendering / content tooling used by docs, playgrounds, and galleries.
  content:
    "@mdi/js": "7.4.47"
    "@tsdown/css": "0.22.14"
    "@types/pngjs": "6.0.5"
    highlight.js: "11.11.1"
    marked: "18.0.9"
    marked-highlight: "2.2.4"
    monaco-editor: "0.56.0"
    pngjs: "7.0.0"
    shiki: "4.0.2"
    three: "0.185.1"

  # JS-side OXC transform bridge.
  oxc:
    oxc-parser: "0.144.0"
    oxc-transform: "0.144.0"

  # Published native binary packages that are installed optionally at runtime.
  native-binaries:
    "@vizejs/native-darwin-arm64": "0.474.0"
    "@vizejs/native-darwin-x64": "0.474.0"
    "@vizejs/native-linux-arm64-gnu": "0.474.0"
    "@vizejs/native-linux-arm64-musl": "0.474.0"
    "@vizejs/native-linux-x64-gnu": "0.474.0"
    "@vizejs/native-linux-x64-musl": "0.474.0"
    "@vizejs/native-win32-arm64-msvc": "0.474.0"
    "@vizejs/native-win32-x64-msvc": "0.474.0"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

allowBuilds:
  "@parcel/watcher": false
  core-js: false
  esbuild: true
  puppeteer: false
  unrs-resolver: false
  vue-demi: false
