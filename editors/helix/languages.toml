[language-server.vize]
command = "vize"
args = ["lsp"]

[[language]]
name = "vue"
scope = "source.vue"
file-types = ["vue"]
roots = [
  "vite.config.ts",
  "vite.config.js",
  "vite.config.mts",
  "vite.config.mjs",
  "vite.config.cts",
  "vite.config.cjs",
  "tsconfig.json",
  "package.json",
  ".git",
]
language-servers = ["vize"]

[[language]]
name = "art-vue"
language-id = "art-vue"
scope = "source.art-vue"
file-types = [{ glob = "*.art.vue" }]
roots = [
  "vite.config.ts",
  "vite.config.js",
  "vite.config.mts",
  "vite.config.mjs",
  "vite.config.cts",
  "vite.config.cjs",
  "tsconfig.json",
  "package.json",
  ".git",
]
language-servers = ["vize"]
