<!doctype html>
<html lang="en">
  <head>
    <title>Animated preview</title>
    <style>
      body {
        margin: 0;
        background: #fff;
      }
      .musea-variant {
        min-height: 100vh;
      }
      @media (prefers-reduced-motion: reduce) {
        body {
          background: #0f0;
        }
      }
      .spinner {
        position: absolute;
        top: 48px;
        left: 48px;
        width: 100px;
        height: 100px;
        border: 12px solid #ddd;
        border-top-color: #333;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main class="musea-variant">
      <div class="spinner" role="status" aria-label="Loading"></div>
    </main>
  </body>
</html>
