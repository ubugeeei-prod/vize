name: Validate workflow syntax and contexts
description: Run the checksum-pinned workflow checker on the complete workflow inventory
inputs:
  controls:
    description: Also exercise the checker's refusal controls during scheduled qualification
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install the pinned workflow checker
      id: install
      shell: bash
      run: |
        set -euo pipefail
        directory="$(mktemp -d "${RUNNER_TEMP}/vize-actionlint-1.7.12.XXXXXX")"
        archive="$directory/actionlint.tar.gz"
        primary_status=0
        primary_http=$(
          set +e
          curl --fail --silent --show-error --location --retry 2 --max-time 30 \
            --output "$archive" --write-out '%{http_code}' \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl_status=$?
          printf '|'
          exit "$curl_status"
        ) || primary_status=$?
        primary_http="${primary_http%|}"
        case "$primary_status:$primary_http" in
          0:200) ;;
          22:500|22:502|22:503|22:504)
            curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 --speed-limit 1 --speed-time 5 \
              --header 'Accept: application/octet-stream' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --output "$archive" \
              https://api.github.com/repos/rhysd/actionlint/releases/assets/384924896
            ;;
          0:*) echo 'Pinned actionlint download returned an unsupported HTTP status' >&2; exit 1 ;;
          *) exit "$primary_status" ;;
        esac
        printf '%s  %s\n' \
          8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
          "$archive" | sha256sum --check --strict
        tar -xzf "$archive" -C "$directory" actionlint
        "$directory/actionlint" --version
        printf 'binary=%s\n' "$directory/actionlint" >> "$GITHUB_OUTPUT"

    - name: Check complete workflow syntax
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      env:
        ACTIONLINT_BINARY: ${{ steps.install.outputs.binary }}
        WORKFLOW_VALIDATOR_ACTION_PATH: ${{ github.action_path }}
        WORKFLOW_VALIDATOR_CONTROLS: ${{ inputs.controls }}
      with:
        script: |
          const script = require('node:url').pathToFileURL(`${process.env.WORKFLOW_VALIDATOR_ACTION_PATH}/check.ts`);
          await import(script.href);

    - name: Preserve workflow diagnostics on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: workflow-syntax-${{ github.sha }}-${{ github.run_attempt }}
        path: target/workflow-syntax
        retention-days: 14
        if-no-files-found: error
