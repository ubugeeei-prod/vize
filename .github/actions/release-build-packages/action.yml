name: Build release npm packages
description: Build the JS npm packages and upload them as one npm-packages artifact rooted at npm/
runs:
  using: composite
  steps:
    - name: Setup Vite+ and Node.js
      uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
      with: { node-version-file: "package.json", cache: true, run-install: false }
    - uses: ./.github/actions/setup-rust-script
    - name: Install package build dependencies
      shell: bash
      run: node tools/support/github/vp-install.ts --filter './npm/cli...' --filter './npm/builder/vite...' --filter './npm/oxlint...' --filter './npm/builder/unplugin...' --filter './npm/fresco...' --filter './npm/mcp-musea...' --filter './npm/builder/vite-musea...' --filter './npm/builder/rspack...' --filter './npm/framework/musea-nuxt...' --filter './npm/framework/nuxt-lint-config...' --filter './npm/framework/nuxt...' --filter './npm/marquette...' --filter './npm/compose/core...' --filter './npm/ui...'
    - name: Build release npm packages
      shell: bash
      run: node tools/support/github/run-many.ts vp run --filter './npm/cli' build -- vp run --filter './npm/builder/vite' build -- vp run --filter './npm/oxlint' build -- vp run --filter './npm/builder/unplugin' build -- vp run --filter './npm/fresco' build -- vp run --filter './npm/mcp-musea' build -- vp run --filter './npm/builder/vite-musea' build -- vp run --filter './npm/builder/vite-musea' build:gallery -- vp run --filter './npm/builder/rspack' build -- vp run --filter './npm/framework/musea-nuxt' build -- vp run --filter './npm/framework/nuxt-lint-config' build -- vp run --filter './npm/framework/nuxt' build -- vp run --filter './npm/marquette' build -- vp run --filter './npm/compose/core' build -- vp run --filter './npm/ui' build
    # Paths share the npm/ root, so downloading into npm/ restores every package in place.
    - name: Upload npm packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: npm-packages
        path: |
          npm/cli
          npm/builder/vite
          npm/oxlint
          npm/builder/unplugin
          npm/fresco
          npm/mcp-musea
          npm/builder/vite-musea
          npm/builder/rspack
          npm/framework/musea-nuxt
          npm/framework/nuxt-lint-config
          npm/framework/nuxt
          npm/marquette
          npm/compose/core
          npm/ui
          npm/plugin-sdk
          !npm/**/node_modules
        if-no-files-found: error
        compression-level: 1
