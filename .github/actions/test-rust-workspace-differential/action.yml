name: Test Rust workspace and differential corpora
description: Reuse the full Check Rust test recipe in manual checks and the merge queue
inputs:
  workspace-already-tested:
    description: The caller supplies completed workspace tests or a required archive-shard tier
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Test actual native Program checker backend
      shell: bash
      env: { VIZE_TEST_REQUIRE_TSGO: "1" }
      run: |
        cargo test --locked -p vize_canon --features native-program --lib native_program:: -- --nocapture
        cargo test --locked -p vize_canon --features native-program --test native_program_backend -- --nocapture
        cargo test --locked -p vize_canon --features native-program --doc
        cargo check --locked -p vize_canon --no-default-features --features native-program
        cargo clippy --locked -p vize_canon --features native-program --lib --test native_program_backend -- -D warnings
    - name: Test native Program comment projection
      shell: bash
      env: { VIZE_TEST_REQUIRE_TSGO: "1" }
      run: |
        cargo test --locked -p vize_maestro --features experimental-source-folding --lib source_folding::tests:: -- --nocapture
        cargo check --locked -p vize_maestro --no-default-features --features experimental-source-folding
        cargo clippy --locked -p vize_maestro --features experimental-source-folding --lib --tests -- -D warnings
    - name: Test actual host snapshots and native source edits
      shell: bash
      env: { VIZE_TEST_REQUIRE_TSGO: "1" }
      run: |
        cargo test --locked -p vize_maestro --lib source_project:: -- --nocapture
        cargo test --locked -p vize_maestro --features experimental-source-project --lib source_project:: -- --nocapture
        cargo check --locked -p vize_maestro --no-default-features --features experimental-source-project
        cargo clippy --locked -p vize_maestro --features experimental-source-project --all-targets -- -D warnings
    - name: Test native SFC File comment projection
      shell: bash
      env: { VIZE_TEST_REQUIRE_TSGO: "1" }
      run: |
        cargo test --locked -p vize_maestro --features experimental-sfc-folding --lib source_sfc_folding::tests:: -- --nocapture
        cargo check --locked -p vize_maestro --no-default-features --features experimental-sfc-folding
        cargo clippy --locked -p vize_maestro --features experimental-sfc-folding --lib --tests -- -D warnings
    - name: Test native SFC project query publication
      shell: bash
      env: { VIZE_TEST_REQUIRE_TSGO: "1" }
      run: |
        cargo test --locked -p vize_maestro --features experimental-source-project,experimental-sfc-folding --lib source_sfc_folding:: -- --nocapture
        cargo check --locked -p vize_maestro --no-default-features --features experimental-source-project,experimental-sfc-folding
        cargo clippy --locked -p vize_maestro --features experimental-source-project,experimental-sfc-folding --all-targets -- -D warnings
    - name: Test native JS and TS navigation responses
      shell: bash
      env: { VIZE_TEST_REQUIRE_TSGO: "1" }
      run: |
        cargo test --locked -p vize_maestro --features experimental-source-navigation --lib source_project:: -- --nocapture
        cargo test --locked -p vize_maestro --features experimental-source-navigation --lib server::native_navigation:: -- --nocapture
        cargo check --locked -p vize_maestro --no-default-features --features experimental-source-navigation
        cargo clippy --locked -p vize_maestro --features experimental-source-navigation --all-targets -- -D warnings
    - name: Test Rust workspace
      if: ${{ inputs.workspace-already-tested != 'true' }}
      shell: bash
      env: { VIZE_TEST_REQUIRE_TSGO: "1" }
      run: cargo test --workspace
    - name: Test feature-enabled differential corpora
      shell: bash
      env: { VIZE_TEST_REQUIRE_TSGO: "1" }
      run: |
        cargo test -p vize_l1_to_l2 --features legacy-differential --test davinci_lowering_corpus -- --nocapture
        cargo test -p vize_l1_to_l2 --features legacy-differential --test davinci_dom_corpus -- --nocapture
        cargo test -p vize_l1_to_l2 --features legacy-differential --test davinci_remarks_corpus -- --nocapture
        cargo test -p vize_l1_to_l2 --features legacy-differential --test davinci_pug_corpus -- --nocapture
        cargo test -p vize_atelier_sfc --features legacy-dom-differential --test davinci_production_reach -- --nocapture
        VIZE_DAVINCI_DIFFERENTIAL_CORPUS="$PWD" cargo test -p vize_atelier_ssr --features legacy-differential --test davinci_ssr_corpus -- --nocapture
        cargo test -p vize_atelier_jsx --features legacy-differential --lib vdom::l2_differential::l2_vdom_admitted_cases_match_relief_codegen -- --exact
        cargo test -p vize --features legacy --test check_nuxt_tsconfig_isolation_cli
        cargo test -p vize_atelier_core --features legacy --test davinci_l2_transform_vue2
        cargo test -p vize_vitrine --no-default-features --features wasm
        VIZE_DAVINCI_DIFFERENTIAL_CORPUS="$PWD" cargo test -p vize_patina --features legacy-differential --test davinci_markup_differential -- --nocapture
    - name: Test Vapor and SFC contracts in production
      shell: bash
      env: { VIZE_VUE_RUNTIME_PRODUCTION: "1", VIZE_TEST_REQUIRE_TSGO: "1" }
      run: |
        cargo test -p vize_atelier_vapor --test davinci_vapor_upstream_parity
        cargo test -p vize_atelier_sfc --test vapor_runtime_contracts
        cargo test -p vize_atelier_ssr --features legacy-differential --test vue_ssr_render
