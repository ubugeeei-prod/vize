name: Test Rust workspace and differential corpora
description: Run the full workspace and shared feature recipes in scheduled or manual checks
inputs:
  workspace-already-tested:
    description: The caller supplies completed workspace tests or a required archive-shard tier
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Hydrate pinned Element Plus fixture
      shell: bash
      run: git submodule update --init --depth 1 -- tests/_fixtures/_git/element-plus
    - name: Test native Program and Vue navigation responses
      uses: ./.github/actions/test-native-navigation
      env: { VIZE_TEST_REQUIRE_TSGO: "1" }
    - name: Test fresh native SSR modules
      if: ${{ github.event_name != 'merge_group' }}
      env: { VIZE_TEST_REQUIRE_TSGO: "1" }
      uses: ./.github/actions/test-native-ssr
    - name: Install full-workspace nextest
      if: ${{ inputs.workspace-already-tested != 'true' }}
      env: { VIZE_TEST_REQUIRE_TSGO: "1" }
      uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
      with:
        tool: cargo-nextest@0.9.146
    - name: Test Rust workspace
      if: ${{ inputs.workspace-already-tested != 'true' }}
      shell: bash
      env: { VIZE_TEST_REQUIRE_TSGO: "1" }
      run: node tools/support/compat/github/run-rust-workspace-tests.ts
    - name: Test feature-enabled differential corpora
      shell: bash
      env: { VIZE_TEST_REQUIRE_TSGO: "1" }
      run: node tools/support/compat/github/rust-differential-lanes.ts --all
