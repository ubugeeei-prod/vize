name: Restore release npm packages
description: Download the built npm packages and native bindings into npm/ and lay out the native platform packages
inputs:
  run-id:
    description: Prior Release run whose artifacts should be restored
    required: false
    default: ""
  github-token:
    description: Token used to restore artifacts from a prior run
    required: false
    default: ""
  release-tag:
    description: Immutable release tag whose native package metadata should be restored
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install native package tooling
      shell: bash
      run: vp install --frozen-lockfile --prefer-offline --filter './npm/native...' --filter './npm/fresco-native...'
    - if: inputs.run-id == ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with: { name: npm-packages, path: npm }
    - if: inputs.run-id != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: npm-packages
        path: npm
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}
        repository: ${{ github.repository }}
    - if: inputs.run-id == ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with: { pattern: bindings-*, path: npm/native/artifacts }
    - if: inputs.run-id != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: bindings-*
        path: npm/native/artifacts
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}
        repository: ${{ github.repository }}
    - if: inputs.run-id == ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with: { pattern: fresco-bindings-*, path: npm/fresco-native/artifacts }
    - if: inputs.run-id != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: fresco-bindings-*
        path: npm/fresco-native/artifacts
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}
        repository: ${{ github.repository }}
    - name: Restore immutable native package metadata
      if: inputs.release-tag != ''
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release-tag }}
      run: |
        git fetch --no-tags --depth=1 origin "refs/tags/$RELEASE_TAG"
        for file in pnpm-workspace.yaml npm/native/package.json npm/fresco-native/package.json; do
          git show "FETCH_HEAD:$file" > "$file"
        done
    - name: Lay out native platform packages
      shell: bash
      working-directory: npm/native
      run: |
        vp exec napi create-npm-dirs
        vp exec napi artifacts --output-dir artifacts
        vp exec napi pre-publish -t npm --no-gh-release --skip-optional-publish
    - name: Stage Fresco native binaries
      shell: bash
      run: |
        node tools/support/github/clean-node-binaries.ts npm/fresco-native
        node tools/support/github/collect-native-artifacts.ts npm/fresco-native/artifacts npm/fresco-native fresco-native
