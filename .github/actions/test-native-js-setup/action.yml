name: Native JS setup runtime
description: Check source-bound native SFC modules and preserve real Vue renders
runs:
  using: composite
  steps:
    - name: Prepare the pinned plugin isolation runtime
      if: ${{ always() }}
      shell: bash
      run: vp exec node tools/support/compat/davinci/plugin-sandbox-image.mjs
    - name: Test native JS setup modules and real Vue runtime
      shell: bash
      env:
        VIZE_NATIVE_SFC_SETUP_CAPTURE: ${{ runner.temp }}/native-sfc-js-setup-capture.json
        VIZE_NATIVE_SFC_SETUP_RUNTIME_CAPTURE: ${{ runner.temp }}/native-sfc-js-setup-runtime.json
        VIZE_NATIVE_SFC_STRICT_SETUP_CAPTURE: ${{ runner.temp }}/native-sfc-strict-setup-capture.json
        VIZE_NATIVE_SFC_STRICT_SETUP_REFUSAL_CAPTURE: ${{ runner.temp }}/native-sfc-strict-setup-refusals.json
        VIZE_NATIVE_SFC_CONST_SETUP_CAPTURE: ${{ runner.temp }}/native-sfc-const-setup-capture.json
        VIZE_NATIVE_SFC_TS_SETUP_CAPTURE: ${{ runner.temp }}/native-sfc-ts-setup-capture.json
        VIZE_NATIVE_SFC_TS_ANNOTATION_SETUP_CAPTURE: ${{ runner.temp }}/native-sfc-ts-annotation-setup-capture.json
        VIZE_NATIVE_SFC_TS_ANNOTATION_SETUP_RUNTIME_CAPTURE: ${{ runner.temp }}/native-sfc-ts-annotation-setup-runtime.json
        VIZE_NATIVE_SFC_TS_SETUP_RUNTIME_CAPTURE: ${{ runner.temp }}/native-sfc-ts-setup-runtime.json
        VIZE_NATIVE_SFC_CONST_SETUP_RUNTIME_CAPTURE: ${{ runner.temp }}/native-sfc-const-setup-runtime.json
        VIZE_NATIVE_SFC_ORDINARY_EMPTY_CAPTURE: ${{ runner.temp }}/native-sfc-ordinary-empty-capture.json
        VIZE_NATIVE_SFC_ORDINARY_EMPTY_RUNTIME_CAPTURE: ${{ runner.temp }}/native-sfc-ordinary-empty-runtime.json
      run: |
        cargo test --locked --profile ci -p vize_atelier_sfc native::setup::tests::eight_whole_setup_modules_and_maps_match_actual_source_bound_pinned_fixtures -- --exact
        cargo test --locked --profile ci -p vize_atelier_sfc native::setup::tests::constants::five_whole_const_setup_modules_and_maps_match_actual_source_bound_pinned_fixtures -- --exact
        cargo test --locked --profile ci -p vize_atelier_sfc native::setup::tests::typescript::three_whole_ts_primitive_setup_modules_and_maps_match_actual_source_bound_pinned_fixtures -- --exact
        cargo test --locked --profile ci -p vize_atelier_sfc native::setup::tests::annotations::three_source_owned_annotation_modules_and_maps_are_captured -- --exact
        cargo test --locked --profile ci -p vize_atelier_sfc native::ordinary::tests::three_whole_ordinary_empty_modules_and_maps_are_captured -- --exact
        cargo test --locked --profile ci -p vize_atelier_sfc native::setup::tests::strict --lib
        vp node --test tests/tooling/native-sfc-js-setup-reference.test.ts tests/tooling/native-sfc-primitive-setup-reference.test.ts tests/tooling/native-sfc-annotation-setup-reference.test.ts tests/tooling/native-sfc-strict-setup.test.ts tests/tooling/native-sfc-ordinary-empty-reference.test.ts
    - name: Upload native JS setup module and runtime captures
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: native-js-setup-${{ github.sha }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/native-sfc-js-setup-capture.json
          ${{ runner.temp }}/native-sfc-js-setup-runtime.json
          ${{ runner.temp }}/native-sfc-const-setup-capture.json
          ${{ runner.temp }}/native-sfc-const-setup-runtime.json
          ${{ runner.temp }}/native-sfc-ts-setup-capture.json
          ${{ runner.temp }}/native-sfc-ts-setup-runtime.json
          ${{ runner.temp }}/native-sfc-ts-annotation-setup-capture.json
          ${{ runner.temp }}/native-sfc-ts-annotation-setup-runtime.json
          ${{ runner.temp }}/native-sfc-strict-setup-capture.json
          ${{ runner.temp }}/native-sfc-strict-setup-refusals.json
          ${{ runner.temp }}/native-sfc-ordinary-empty-capture.json
          ${{ runner.temp }}/native-sfc-ordinary-empty-runtime.json
        if-no-files-found: error
        retention-days: 7
    - name: Capture whole original selected SFC components and runtime
      if: ${{ always() }}
      uses: ./.github/actions/test-native-selected-sfc-dom
    - name: Capture original block-local handler components and runtime
      uses: ./.github/actions/test-native-handler-local-sfc-dom
