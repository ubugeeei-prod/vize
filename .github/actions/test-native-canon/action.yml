name: Test native typechecker product laws
description: Require native snapshot ownership, projection ranges and syntax/semantic completion
runs:
  using: composite
  steps:
    - name: Test complete native snapshot text and owner refusals
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
        VIZE_SNAPSHOT_SOURCE_CAPTURE_DIR: ${{ runner.temp }}/native-snapshot-source
      run: |
        unset VIZE_TEST_DISABLE_TSGO
        cargo test --locked --profile ci -p vize_canon --lib lsp_client::editor_lsp::snapshot_source::tests::native::actual_native_snapshot_retains_complete_stdlib_and_overlay_text_with_owner_refusals -- --ignored --exact --nocapture
    - name: Test real compiler-kind diagnostics against complete native pull packets
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
        VIZE_SNAPSHOT_SOURCE_CAPTURE_DIR: ${{ runner.temp }}/native-snapshot-source
      run: |
        set -euo pipefail
        unset VIZE_TEST_DISABLE_TSGO
        capture="$VIZE_SNAPSHOT_SOURCE_CAPTURE_DIR/compiler-kinds"
        mkdir -p "$capture"
        set +e
        cargo test --locked --profile ci -p vize_canon --lib lsp_client::editor_lsp::snapshot_source::tests::native::actual_native_compiler_kind_reads_match_whole_ts_and_generated_vue_pull_packets -- --ignored --exact --nocapture --color never >"$capture/test.stdout" 2>"$capture/test.stderr"
        status=$?
        set -e
        printf '%s\n' "$status" >"$capture/test.status"
        cat "$capture/test.stdout"
        cat "$capture/test.stderr" >&2
        node --input-type=module - "$capture" <<'NODE'
        import { readFileSync, writeFileSync } from 'node:fs';
        import { createHash } from 'node:crypto';
        import { execFileSync } from 'node:child_process';
        import { join } from 'node:path';
        const directory = process.argv[2];
        const stdout = readFileSync(join(directory, 'test.stdout'));
        const stderr = readFileSync(join(directory, 'test.stderr'));
        const status = Number(readFileSync(join(directory, 'test.status'), 'utf8').trim());
        const name = 'lsp_client::editor_lsp::snapshot_source::tests::native::actual_native_compiler_kind_reads_match_whole_ts_and_generated_vue_pull_packets';
        const executed = stdout.toString('utf8').includes(`test ${name} ... ok`) && /^test result: ok\. 1 passed; 0 failed; 0 ignored; /m.test(stdout.toString('utf8')) ? 1 : 0;
        const digest = bytes => createHash('sha256').update(bytes).digest('hex');
        writeFileSync(join(directory, 'test-run.json'), JSON.stringify({
          source: execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim(),
          githubSha: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
          status, executed, name, stdoutSha256: digest(stdout), stderrSha256: digest(stderr)
        }, null, 2) + '\n');
        if (status !== 0) process.exit(status);
        if (executed !== 1) throw new Error('exact compiler-kind law did not execute once successfully');
        for (const file of ['provider.json', 'source.ts.json', 'View.vue.ts.json']) {
          JSON.parse(readFileSync(join(directory, file), 'utf8'));
        }
        NODE
    - name: Test legacy projection anchors and complete diagnostic ranges
      shell: bash
      env:
        VIZE_DAVINCI_DIFFERENTIAL_CORPUS: ${{ github.workspace }}
      run: cargo test --locked --profile ci -p vize_canon --features legacy-differential --test davinci_projection_differential -- --nocapture
    - name: Test declared public-instance member types with the native checker
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
        VIZE_SNAPSHOT_SOURCE_CAPTURE_DIR: ${{ runner.temp }}/native-snapshot-source
      run: |
        unset VIZE_TEST_DISABLE_TSGO
        cargo test --locked --profile ci -p vize_canon --lib batch::type_checker::tests::recent_issues::setup_custom_properties::custom_property_member_types_and_native_type_queries_remain_exact -- --exact --nocapture
    - name: Test authored Options API module augmentations with the native checker
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
        VIZE_SNAPSHOT_SOURCE_CAPTURE_DIR: ${{ runner.temp }}/native-snapshot-source
      run: |
        unset VIZE_TEST_DISABLE_TSGO
        cargo test --locked --profile ci -p vize_canon --lib batch::type_checker::tests::recent_issues::options_api_global_augmentation::authored_options_methods_keep_module_augmentations_typed -- --exact --nocapture
    - name: Test plain Options API globals and record selected dialect observations
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
        VIZE_SNAPSHOT_SOURCE_CAPTURE_DIR: ${{ runner.temp }}/native-snapshot-source
      run: |
        unset VIZE_TEST_DISABLE_TSGO
        cargo test --locked --profile ci -p vize_canon --lib batch::type_checker::tests::recent_issues::plain_options_global_augmentation::plain_options_module_augmentations_keep_modern_this_typed -- --exact --nocapture
    - name: Test repeated loop source reads and public-instance alias shadowing
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
      run: |
        unset VIZE_TEST_DISABLE_TSGO
        cargo test --locked --profile ci -p vize_canon --lib batch::type_checker::tests::recent_issues::setup_custom_properties::loop_sources_keep_authored_reads_and_parent_scope -- --exact --nocapture
    - name: Test typed legacy mixin methods without erasing native findings
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
        VIZE_SNAPSHOT_SOURCE_CAPTURE_DIR: ${{ runner.temp }}/native-snapshot-source
      run: |
        set -euo pipefail
        unset VIZE_TEST_DISABLE_TSGO
        cargo test --locked --profile ci -p vize_canon --lib batch::type_checker::tests::recent_issues::options_api_inherited_members:: -- --nocapture
        cargo test --locked --profile ci -p vize_canon --lib virtual_ts::generator::options_api_bridge::inherited::tests::native_mixin_method_laws_preserve_opaque_and_constructor_types -- --exact --nocapture
    - name: Test typed external props in the selected legacy dialect
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
        VIZE_SNAPSHOT_SOURCE_CAPTURE_DIR: ${{ runner.temp }}/native-snapshot-source
      run: |
        set -euo pipefail
        unset VIZE_TEST_DISABLE_TSGO
        cargo test --locked --profile ci -p vize_canon --lib batch::type_checker::tests::recent_issues::legacy_external_component_props:: -- --nocapture
        cargo test --locked --profile ci -p vize_canon --lib virtual_ts::legacy_vue2_vuetify_tests:: -- --nocapture --test-threads=1
        cargo test --locked --profile ci -p vize_canon --lib virtual_ts::scope::inline_callback_classifier:: -- --nocapture
    - name: Install locked Vue dependency and pinned syntax corpus
      shell: bash
      run: |
        set -euo pipefail
        node tools/support/github/vp-install.ts --filter './npm/builder/vite...' --filter './npm/cli...'
        git submodule update --init --depth 1 -- tests/_fixtures/_git/element-plus
    - name: Test inherited Options API template members keep their declared types
      if: ${{ !cancelled() }}
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
        VIZE_CACHE_CUSTODY_CAPTURE_DIR: ${{ runner.temp }}/native-snapshot-source/inherited-options-native-raw
        VIZE_SNAPSHOT_SOURCE_CAPTURE_DIR: ${{ runner.temp }}/native-snapshot-source
      run: |
        set -euo pipefail
        unset VIZE_TEST_DISABLE_TSGO
        cargo test --locked --profile ci -p vize_canon --features cache-custody --lib batch::type_checker::tests::recent_issues::options_api_inherited_template_members:: -- --nocapture
        cargo test --locked --profile ci -p vize_canon --lib virtual_ts::scope::globals::instance::tests::options_api_inherited_members_are_declared_from_the_authored_instance -- --exact --nocapture
        cargo test --locked --profile ci -p vize_canon --lib virtual_ts::tests::inherited_options::test_options_api_unresolved_extends_declares_template_refs_from_the_instance -- --exact --nocapture
        cargo test --locked --profile ci -p vize_canon --lib virtual_ts::tests::inherited_calls:: -- --nocapture
    - name: Test memberless Vue preparation against its acknowledged same-owner pull
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
        VIZE_SNAPSHOT_SOURCE_CAPTURE_DIR: ${{ runner.temp }}/native-snapshot-source
      run: |
        set -euo pipefail
        unset VIZE_TEST_DISABLE_TSGO
        capture="$VIZE_SNAPSHOT_SOURCE_CAPTURE_DIR/memberless-preparation"
        mkdir -p "$capture"
        set +e
        cargo test --locked --profile ci -p vize_canon --lib lsp_client::editor_lsp::configured_project::shared_transport::tests::native::replay::actual_memberless_vue_preparation_reattaches_same_editor_owner -- --ignored --exact --nocapture --color never >"$capture/test.stdout" 2>"$capture/test.stderr"
        status=$?
        set -e
        printf '%s\n' "$status" >"$capture/test.status"
        cat "$capture/test.stdout"
        cat "$capture/test.stderr" >&2
        node --input-type=module - "$capture" <<'NODE'
        import { readFileSync, writeFileSync } from 'node:fs';
        import { createHash } from 'node:crypto';
        import { execFileSync } from 'node:child_process';
        import { join } from 'node:path';
        const directory = process.argv[2];
        const stdout = readFileSync(join(directory, 'test.stdout'));
        const stderr = readFileSync(join(directory, 'test.stderr'));
        const status = Number(readFileSync(join(directory, 'test.status'), 'utf8').trim());
        const name = 'lsp_client::editor_lsp::configured_project::shared_transport::tests::native::replay::actual_memberless_vue_preparation_reattaches_same_editor_owner';
        const executed = stdout.toString('utf8').includes(`test ${name} ... ok`) && /^test result: ok\. 1 passed; 0 failed; 0 ignored; /m.test(stdout.toString('utf8')) ? 1 : 0;
        const digest = bytes => createHash('sha256').update(bytes).digest('hex');
        writeFileSync(join(directory, 'test-run.json'), JSON.stringify({
          source: execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim(),
          githubSha: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
          status, executed, name, stdoutSha256: digest(stdout), stderrSha256: digest(stderr)
        }, null, 2) + '\n');
        if (status !== 0) process.exit(status);
        if (executed !== 1) throw new Error('exact memberless preparation law did not execute once successfully');
        for (const file of ['without-editor/prepared-vs-native.json', 'without-editor/materialized-tsconfig.json', 'without-editor/materialized-ui-package.json', 'with-editor/prepared-vs-native.json', 'with-editor/materialized-tsconfig.json', 'with-editor/materialized-ui-package.json']) {
          JSON.parse(readFileSync(join(directory, file), 'utf8'));
        }
        for (const world of ['ordered-without-editor', 'ordered-with-editor']) {
          for (const file of ['prepared-vs-native.json', 'materialized-tsconfig.json', 'materialized-ui-package.json', 'world.json', 'other-before-app/world.json', 'other-before-app/materialized-tsconfig.json', 'other-prepared-vs-native.json']) {
            JSON.parse(readFileSync(join(directory, world, file), 'utf8'));
          }
          let observations = 0;
          for (const file of ['materialized-ui-package.json', 'materialized-ui-package.absent.json']) {
            let value;
            try { value = JSON.parse(readFileSync(join(directory, world, 'other-before-app', file), 'utf8')); }
            catch (error) { if (error.code === 'ENOENT') continue; throw error; }
            if (file === 'materialized-ui-package.absent.json' &&
                (value.status !== 'absent-after-materialization' || typeof value.path !== 'string' || value.path.length === 0)) {
              throw new Error('invalid first-world UI absence observation');
            }
            observations++;
          }
          if (observations !== 1) throw new Error('exactly one first-world UI package observation required');
        }
        NODE
    - name: Test config recovery guidance and no-config with the actual CLI
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
      run: |
        set -euo pipefail
        unset VIZE_TEST_DISABLE_TSGO
        cargo test --locked --profile ci -p vize --test integration -- check_config_recovery_cli:: --nocapture
    - name: Test nested sibling narrowing with the actual CLI
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
      run: |
        set -euo pipefail
        unset VIZE_TEST_DISABLE_TSGO
        cargo test --locked --profile ci -p vize --test integration -- check_flow_depth_isolation_cli:: --nocapture
    - name: Test mixed Vue and private imports with the actual CLI
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
      run: |
        set -euo pipefail
        unset VIZE_TEST_DISABLE_TSGO
        cargo test --locked --profile ci -p vize --test integration -- check_mixed_vue_package_imports_cli:: --nocapture
    - name: Test original imported Options API members with the actual CLI
      if: ${{ !cancelled() }}
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
        VIZE_SNAPSHOT_SOURCE_CAPTURE_DIR: ${{ runner.temp }}/native-snapshot-source
      run: |
        set -euo pipefail
        unset VIZE_TEST_DISABLE_TSGO
        cargo test --locked --profile ci -p vize --test integration -- check_options_api_inherited_members_cli:: --nocapture
    - name: Test redirected package diagnostics with the actual CLI
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
      run: |
        set -euo pipefail
        unset VIZE_TEST_DISABLE_TSGO
        cargo test --locked --profile ci -p vize --test integration -- check_package_import_redirects_cli:: --nocapture
    - name: Test complete native diagnostic profiling and source repair
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
        VIZE_MESSAGE_PROFILE_CAPTURE_DIR: ${{ runner.temp }}/native-snapshot-source/message-profile
      run: |
        set -euo pipefail
        unset VIZE_TEST_DISABLE_TSGO
        cargo test --locked --profile ci -p vize --test integration -- check_message_profile_cli::real_check_message_profile_preserves_complete_native_packets_and_repair --exact --nocapture
    - name: Test complete malformed project membership with the actual CLI
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
        VIZE_NATIVE_SYNTAX_CAPTURE_DIR: ${{ runner.temp }}/native-syntax-semantics
      run: |
        set -euo pipefail
        unset VIZE_TEST_DISABLE_TSGO
        cargo test --locked --profile ci -p vize_canon --test empty_vue_star_exports -- configured_native_refuses_erasure_at_unproved_source_boundaries --exact --nocapture
    - name: Test native syntax, semantic completion and transport refusals
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
        VIZE_TEST_REQUIRE_PIN_INPUT_FIXTURE: "1"
        VIZE_NATIVE_SYNTAX_CAPTURE_DIR: ${{ runner.temp }}/native-syntax-semantics
      run: |
        set -euo pipefail
        unset VIZE_TEST_DISABLE_TSGO
        cargo test --locked --profile ci -p vize_canon --test native_syntax_semantics -- --nocapture --test-threads=1
        cargo test --locked --profile ci -p vize_canon --lib generated_diagnostics:: -- --nocapture --test-threads=1
    - name: Test exact beta editor owner diagnostics and clean EOF shutdown
      shell: bash
      env:
        VIZE_TEST_NATIVE_BETA_TSGO: ${{ runner.temp }}/native-beta-10741/node_modules/@typescript/typescript-linux-x64/lib/tsc
        VIZE_NATIVE_BETA_CAPTURE_DIR: ${{ runner.temp }}/native-snapshot-source/beta-shutdown-10741
      run: |
        set -euo pipefail
        unset VIZE_TEST_DISABLE_TSGO
        provider="$RUNNER_TEMP/native-beta-10741"
        capture="$VIZE_NATIVE_BETA_CAPTURE_DIR"
        mkdir -p "$provider" "$capture"
        printf '%s\n' '{"private":true,"devDependencies":{"typescript":"7.1.0-beta"}}' >"$provider/package.json"
        npm install --prefix "$provider" --ignore-scripts --no-audit --no-fund
        cp "$provider/package.json" "$capture/provider-package.json"
        cp "$provider/package-lock.json" "$capture/provider-package-lock.json"
        if ! command -v strace >/dev/null; then sudo apt-get update && sudo apt-get install -y strace; fi
        cargo test --locked --profile ci -p vize_canon --lib --no-run --message-format=json >"$capture/build.jsonl"
        node tests/tooling/support/native-beta-shutdown/source.mjs
    - name: Test inherited Options API calls with the authenticated beta checker
      if: ${{ !cancelled() }}
      shell: bash
      env:
        CORSA_PATH: ${{ runner.temp }}/native-beta-10741/node_modules/@typescript/typescript-linux-x64/lib/tsc
        VIZE_TEST_REQUIRE_TSGO: "1"
        VIZE_TEST_INHERITED_PROVIDER_ROLE: "a183-ts7.1"
        VIZE_SNAPSHOT_SOURCE_CAPTURE_DIR: ${{ runner.temp }}/native-snapshot-source/inherited-options-beta
        VIZE_CACHE_CUSTODY_CAPTURE_DIR: ${{ runner.temp }}/native-snapshot-source/inherited-options-beta/native-raw
      run: |
        set -euo pipefail
        unset VIZE_TEST_DISABLE_TSGO
        capture="$VIZE_SNAPSHOT_SOURCE_CAPTURE_DIR"
        mkdir -p "$capture"
        node --input-type=module - "$CORSA_PATH" "$capture" <<'NODE'
        import assert from 'node:assert/strict';
        import fs from 'node:fs';
        import path from 'node:path';
        import { createHash } from 'node:crypto';
        import { spawnSync } from 'node:child_process';
        const program = fs.realpathSync(process.argv[2]);
        const directory = process.argv[3];
        const manifestPath = path.join(path.dirname(path.dirname(program)), 'package.json');
        const manifestBytes = fs.readFileSync(manifestPath);
        const manifest = JSON.parse(manifestBytes);
        const sha256 = createHash('sha256').update(fs.readFileSync(program)).digest('hex');
        const save = (name, value) => fs.writeFileSync(path.join(directory, name), JSON.stringify(value, null, 2) + '\n', {flag: 'wx'});
        save('identity-preflight.json', {program, sha256, providerRole: process.env.VIZE_TEST_INHERITED_PROVIDER_ROLE, expectedDiagnosticExitCode: 2, manifestPath, manifestBytes: [...manifestBytes], scope: 'Authenticated supplemental source 7.1 control; reporter binary identity is unknown'});
        assert.equal(process.env.VIZE_TEST_INHERITED_PROVIDER_ROLE, 'a183-ts7.1');
        assert.equal(manifest.name, '@typescript/typescript-linux-x64');
        assert.equal(manifest.version, '7.1.0-beta');
        assert.equal(sha256, 'a183b1956edbe7e7d98f2249858eedf2d8a9790809cc4909db1276e202faaa70');
        const result = spawnSync(program, ['--version']);
        fs.writeFileSync(path.join(directory, 'version.stdout'), result.stdout ?? Buffer.alloc(0), {flag: 'wx'});
        fs.writeFileSync(path.join(directory, 'version.stderr'), result.stderr ?? Buffer.alloc(0), {flag: 'wx'});
        save('version-result.json', {program, sha256, args: ['--version'], status: result.status, signal: result.signal, pid: result.pid ?? null, error: result.error ? String(result.error) : null, companionOnly: true});
        assert.equal(result.error, undefined);
        assert.equal(result.status, 0);
        assert.equal(result.signal, null);
        assert.equal(result.stdout.toString(), 'Version 7.1.0-beta\n');
        assert.equal(result.stderr.length, 0);
        NODE
        set +e
        cargo test --locked --profile ci -p vize_canon --features cache-custody --lib batch::type_checker::tests::recent_issues::options_api_inherited_template_members:: -- --nocapture
        api_status=$?
        cargo test --locked --profile ci -p vize --test integration -- check_options_api_inherited_members_cli:: --nocapture
        cli_status=$?
        set -e
        printf '%s\n' "$api_status" >"$capture/api.status"
        printf '%s\n' "$cli_status" >"$capture/cli.status"
        sha256sum "$CORSA_PATH" >"$capture/native.after.sha256"
        test "$(cut -d ' ' -f 1 "$capture/native.after.sha256")" = a183b1956edbe7e7d98f2249858eedf2d8a9790809cc4909db1276e202faaa70
        test "$api_status" -eq 0
        test "$cli_status" -eq 0
    - name: Preserve actual native inputs and responses
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: native-canon-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/native-snapshot-source
          ${{ runner.temp }}/native-syntax-semantics
          target/vize-tests/flow-depth-isolation
        if-no-files-found: ignore
        retention-days: 7

    - name: Require imported markRaw callback diagnostics
      id: imported-raw-callback
      shell: bash
      env:
        VIZE_TEST_REQUIRE_TSGO: "1"
        VIZE_IMPORTED_RAW_CAPTURE: ${{ runner.temp }}/imported-raw-callback
      run: |
        set -euo pipefail
        unset VIZE_TEST_DISABLE_TSGO
        mkdir -p "$VIZE_IMPORTED_RAW_CAPTURE"
        set +e
        cargo test --locked --profile ci -p vize --test integration -- check_imported_raw_callback_cli::imported_mark_raw_getter_reads_keep_direct_callback_and_authored_error_controls --exact --nocapture --color never >"$VIZE_IMPORTED_RAW_CAPTURE/test.stdout" 2>"$VIZE_IMPORTED_RAW_CAPTURE/test.stderr"
        status=$?
        set -e
        printf '%s\n' "$status" >"$VIZE_IMPORTED_RAW_CAPTURE/test.status"
        cat "$VIZE_IMPORTED_RAW_CAPTURE/test.stdout"
        cat "$VIZE_IMPORTED_RAW_CAPTURE/test.stderr" >&2
        node --input-type=module - "$VIZE_IMPORTED_RAW_CAPTURE" <<'NODE'
        import {readFileSync,writeFileSync} from 'node:fs';
        import {createHash} from 'node:crypto';
        import {execFileSync} from 'node:child_process';
        import {join} from 'node:path';
        const out=process.argv[2],stdout=readFileSync(join(out,'test.stdout')),stderr=readFileSync(join(out,'test.stderr'));
        const status=Number(readFileSync(join(out,'test.status'),'utf8').trim());
        const executed=/^test result: ok\. 1 passed; 0 failed; 0 ignored; /m.test(stdout.toString('utf8'))?1:0;
        const sha=b=>createHash('sha256').update(b).digest('hex');
        writeFileSync(join(out,'test-run.json'),JSON.stringify({source:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,name:'check_imported_raw_callback_cli::imported_mark_raw_getter_reads_keep_direct_callback_and_authored_error_controls',status,executed,stdoutSha256:sha(stdout),stderrSha256:sha(stderr),historical118Resolved:false,nativeClean:false,nativeKnownDebt:true,timingUsable:false},null,2)+'\n');
        if(status!==0)process.exit(status);
        if(executed!==1)throw Error('derived callback fixture did not execute exactly once');
        NODE
    - name: Preserve imported markRaw callback complete observations
      if: ${{ always() && steps.imported-raw-callback.outcome != 'skipped' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: imported-raw-callback-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        path: ${{ runner.temp }}/imported-raw-callback
        if-no-files-found: error
        retention-days: 7
