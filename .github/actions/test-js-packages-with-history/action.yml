name: Test JS packages with public native history
description: Preserve the existing JS package gate and all actual formatter build and call evidence.
runs:
  using: composite
  steps:
    # Composite success() scopes to this action; also retain the outer job guard.
    - name: Test JS packages
      if: ${{ success() && job.status == 'success' }}
      shell: bash
      run: vp run --workspace-root test:js
    - name: Preserve public native formatter evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: public-native-formatter-${{ github.sha }}-${{ github.run_attempt }}-${{ github.job }}
        path: npm/native/.artifacts/native/formatter-history/**
        if-no-files-found: warn
        retention-days: 14
    - name: Preserve original Oxlint bridge locations
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: oxlint-original-locations-${{ github.sha }}-${{ github.run_attempt }}-${{ github.job }}
        path: target/oxlint-original-locations-7904.json
        if-no-files-found: warn
        retention-days: 14
