name: Setup Rust Script
description: Install the pinned rust-script runner used by tools/commands

runs:
  using: composite
  steps:
    - name: Configure Windows Rust linker
      if: runner.os == 'Windows'
      shell: bash
      run: . "$GITHUB_ACTION_PATH/scripts/configure-windows-rust-linker.sh"
    - name: Install rust-script
      shell: bash
      run: . "$GITHUB_ACTION_PATH/scripts/install-rust-script.sh"
