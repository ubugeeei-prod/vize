name: Setup Rust sticky cache
description: Cache Rust builds on stable sticky disks that only trusted runs commit

inputs:
  key:
    description: Stable cache namespace for this job
    required: true
  cache-key-suffix:
    description: Stable runner suffix (os/arch) to separate incompatible disks
    required: true
  target-path:
    description: Rust target directory to mount
    required: false
    default: target
  secondary-key:
    description: Stable cache namespace for an optional second target directory
    required: false
    default: ""
  secondary-target-path:
    description: Optional second Rust target directory to mount
    required: false
    default: ""
  secondary-cache-key-suffix:
    description: Stable runner suffix (os/arch) for the optional second target directory
    required: false
    default: ""
  reuse-target:
    description: Prune non-Cargo run outputs and restore recorded source mtimes so Cargo reuses unchanged crates
    required: false
    default: "true"
  restore-trusted:
    description: Allow a validated workflow_dispatch release job to read the default-branch sticky cache. Never enables writes.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Select the Rust cache backend
      id: cache-policy
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      env:
        VIZE_CACHE_ACTION_PATH: ${{ github.action_path }}
        VIZE_CACHE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        VIZE_CACHE_RUNNER_OS: ${{ runner.os }}
        VIZE_CACHE_RUNNER_ARCH: ${{ runner.arch }}
        VIZE_CACHE_ROLE: ${{ inputs.key }}
        VIZE_CACHE_SUFFIX: ${{ inputs.cache-key-suffix }}
        VIZE_CACHE_TARGET_PATH: ${{ inputs.target-path }}
        VIZE_CACHE_SECONDARY_ROLE: ${{ inputs.secondary-key }}
        VIZE_CACHE_SECONDARY_SUFFIX: ${{ inputs.secondary-cache-key-suffix }}
        VIZE_CACHE_SECONDARY_PATH: ${{ inputs.secondary-target-path }}
        VIZE_CACHE_RESTORE_TRUSTED: ${{ inputs.restore-trusted }}
      with:
        script: |
          const script = require('node:url').pathToFileURL(`${process.env.VIZE_CACHE_ACTION_PATH}/cache-policy.ts`);
          const { runCachePolicy } = await import(script.href);
          runCachePolicy();

    - name: Mount Cargo registry sticky disk
      if: ${{ steps.cache-policy.outputs.sticky == 'true' }}
      uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
      with:
        key: ${{ steps.cache-policy.outputs.sticky-registry-key }}
        path: ~/.cargo/registry
        commit: ${{ steps.cache-policy.outputs.sticky-commit }}

    - name: Mount Cargo git sticky disk
      if: ${{ steps.cache-policy.outputs.sticky == 'true' }}
      uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
      with:
        key: ${{ steps.cache-policy.outputs.sticky-git-key }}
        path: ~/.cargo/git
        commit: ${{ steps.cache-policy.outputs.sticky-commit }}

    - name: Mount Rust target sticky disk
      if: ${{ steps.cache-policy.outputs.sticky == 'true' }}
      uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
      with:
        key: ${{ steps.cache-policy.outputs.sticky-target-key }}
        path: ${{ steps.cache-policy.outputs.target-path }}
        commit: ${{ steps.cache-policy.outputs.sticky-commit }}

    - name: Mount secondary Rust target sticky disk
      if: ${{ steps.cache-policy.outputs.sticky == 'true' && steps.cache-policy.outputs.secondary == 'true' }}
      uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
      with:
        key: ${{ steps.cache-policy.outputs.sticky-secondary-key }}
        path: ${{ steps.cache-policy.outputs.secondary-path }}
        commit: ${{ steps.cache-policy.outputs.sticky-commit }}

    - name: Check which trusted sticky paths were actually mounted
      id: cache-mounts
      if: ${{ steps.cache-policy.outputs.sticky == 'true' }}
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      env:
        VIZE_CACHE_ACTION_PATH: ${{ github.action_path }}
        VIZE_CACHE_TARGET_PATH: ${{ steps.cache-policy.outputs.target-path }}
        VIZE_CACHE_SECONDARY_PATH: ${{ steps.cache-policy.outputs.secondary-path }}
      with:
        script: |
          const script = require('node:url').pathToFileURL(`${process.env.VIZE_CACHE_ACTION_PATH}/cache-policy.ts`);
          const { runCachePolicy } = await import(script.href);
          runCachePolicy('--mounted');

    # Trusted sticky clones are already mounted. Lookup-only never extracts a
    # second cache into them. Mounted targets commit through the sticky provider;
    # compatible existing Actions seeds remain lookup-only, without another archive.
    # A failed mount or GitHub-hosted runner retains the per-checkout save key.
    - name: Cache Cargo registry or seed it from the trusted sticky clone
      if: ${{ steps.cache-policy.outputs.trusted == 'true' }}
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.cargo/registry
        key: ${{ steps.cache-policy.outputs.registry-key }}
        lookup-only: ${{ steps.cache-mounts.outputs.registry == 'true' }}
    - name: Cache Cargo git or seed it from the trusted sticky clone
      if: ${{ steps.cache-policy.outputs.trusted == 'true' }}
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.cargo/git
        key: ${{ steps.cache-policy.outputs.git-key }}
        lookup-only: ${{ steps.cache-mounts.outputs.git == 'true' }}
    - name: Cache Rust target or seed it from the trusted sticky clone
      # Every healthy mounted target already has its provider post.
      if: ${{ steps.cache-policy.outputs.target-save == 'true' && steps.cache-mounts.outputs.target != 'true' }}
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        # Nested post steps retain inputs, but not this action's step outputs.
        # The policy has already validated this path inside the workspace.
        path: ${{ inputs.target-path }}
        key: ${{ steps.cache-mounts.outputs.target == 'true' && steps.cache-policy.outputs.target-seed-key || steps.cache-policy.outputs.target-key }}
        restore-keys: ${{ steps.cache-policy.outputs.target-restore }}
        lookup-only: ${{ steps.cache-mounts.outputs.target == 'true' }}
    - name: Cache the secondary Rust target or seed its trusted clone
      if: ${{ steps.cache-policy.outputs.secondary-save == 'true' && steps.cache-policy.outputs.secondary == 'true' && steps.cache-mounts.outputs.secondary != 'true' }}
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ${{ inputs.secondary-target-path }}
        key: ${{ steps.cache-mounts.outputs.secondary == 'true' && steps.cache-policy.outputs.secondary-seed-key || steps.cache-policy.outputs.secondary-key }}
        restore-keys: ${{ steps.cache-policy.outputs.secondary-restore }}
        lookup-only: ${{ steps.cache-mounts.outputs.secondary == 'true' }}

    # Candidates normally read a never-committed clone of the trusted disks; the
    # Actions seeds only fill paths whose mount failed.
    - name: Restore trusted Cargo registry for an untrusted checkout
      if: ${{ steps.cache-policy.outputs.trusted == 'false' }}
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.cargo/registry
        key: ${{ steps.cache-policy.outputs.registry-key }}
        lookup-only: ${{ steps.cache-mounts.outputs.registry == 'true' }}
    - name: Restore trusted Cargo git for an untrusted checkout
      if: ${{ steps.cache-policy.outputs.trusted == 'false' }}
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ~/.cargo/git
        key: ${{ steps.cache-policy.outputs.git-key }}
        lookup-only: ${{ steps.cache-mounts.outputs.git == 'true' }}
    - name: Restore a Rust target without registering a save
      if: ${{ steps.cache-policy.outputs.target-save == 'false' || steps.cache-mounts.outputs.target == 'true' }}
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ${{ inputs.target-path }}
        key: ${{ steps.cache-mounts.outputs.target == 'true' && steps.cache-policy.outputs.target-seed-key || steps.cache-policy.outputs.target-key }}
        restore-keys: ${{ steps.cache-policy.outputs.target-restore }}
        lookup-only: ${{ steps.cache-mounts.outputs.target == 'true' }}
    - name: Restore a secondary target without registering a save
      if: ${{ (steps.cache-policy.outputs.secondary-save == 'false' || steps.cache-mounts.outputs.secondary == 'true') && steps.cache-policy.outputs.secondary == 'true' }}
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: ${{ inputs.secondary-target-path }}
        key: ${{ steps.cache-mounts.outputs.secondary == 'true' && steps.cache-policy.outputs.secondary-seed-key || steps.cache-policy.outputs.secondary-key }}
        restore-keys: ${{ steps.cache-policy.outputs.secondary-restore }}
        lookup-only: ${{ steps.cache-mounts.outputs.secondary == 'true' }}

    # Registered after every cache step so its post records the final tree
    # before Actions seeds are saved and before the sticky disks commit.
    - name: Reuse the Rust target as a fresh build cache
      if: ${{ runner.os == 'Linux' && inputs.reuse-target == 'true' }}
      uses: ./.github/actions/reuse-rust-target
      with:
        target-path: ${{ steps.cache-policy.outputs.target-path }}
        secondary-target-path: ${{ steps.cache-policy.outputs.secondary-path }}
        record: ${{ steps.cache-policy.outputs.trusted }}
