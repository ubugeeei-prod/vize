name: Full tooling worker
description: Run one planned shard of the exhaustive full suite with the original source CLI and native gates.
inputs:
  producer:
    description: Complete original full-suite CLI producer outputs.
    required: true
  shard:
    description: One-based worker index in the planned full-suite matrix.
    required: true
  total:
    description: Worker count of the planned full-suite matrix.
    required: true
runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
      with: { node-version-file: package.json, cache: true, run-install: false }
    - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
      with: { toolchain: stable }
    - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
      with: { wild-version: "0.9.0" }
    - uses: ./.github/actions/setup-rust-sticky-cache
      with:
        key: test-scripts
        cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}-shard-${{ inputs.shard }}
    - uses: ./.github/actions/setup-rust-script
    - name: Hydrate CLI and fact corpus fixtures and install JS dependencies
      shell: bash
      run: git submodule update --init --force --depth 1 -- tests/_fixtures/_git/ant-design-vue tests/_fixtures/_git/create-vue tests/_fixtures/_git/layoutit-grid tests/_fixtures/_git/vue-select tests/_fixtures/_git/vue-router && vp install --frozen-lockfile --prefer-offline && node tools/support/compat/github/prepare-vue-benchmarks.ts
    - uses: ./.github/actions/restore-source-cli
      with: { producer: "${{ inputs.producer }}" }
    - name: Check configured Router page CLI and editor types
      if: ${{ inputs.shard == '1' }}
      uses: ./.github/actions/check-router-page-types
    - name: Prepare the pinned plugin isolation runtime for other workers
      if: ${{ !cancelled() && inputs.shard != '1' }}
      shell: bash
      run: vp exec node tools/support/compat/davinci/plugin-sandbox-image.ts
    - name: Prepare plugin runtime and test native JS setup
      if: ${{ !cancelled() && inputs.shard == '1' }}
      uses: ./.github/actions/test-native-js-setup
    - name: Capture original native attribute values and fixed fresh mounts
      if: ${{ !cancelled() && inputs.shard == '1' }}
      uses: ./.github/actions/test-native-attribute-values-7502
    - name: Join original historical Vue documents to pinned whole goldens
      if: ${{ !cancelled() && inputs.shard == '1' }}
      uses: ./.github/actions/test-native-historical-sfc-documents
      with: { comparison-base: "${{ github.sha }}" }
    - name: Install CSS formatter reference browser
      uses: ./.github/actions/install-formatter-css-browser
    - name: Select the exhaustive full tooling inventory
      shell: bash
      run: node tools/support/compat/github/plan-tooling-tests.mjs 0000000000000000000000000000000000000000 "$GITHUB_SHA" --tier merge --output "$RUNNER_TEMP/tooling-plan.json"
    - name: Test release scripts
      shell: bash
      env:
        VIZE_LSP_BIN: ${{ github.workspace }}/target/ci/vize
        VIZE_LSP_REQUIRE_SOURCE_BUILD: "1"
        VIZE_TOOLING_TEST_TIER: merge
        VIZE_TOOLING_TEST_PLAN: ${{ runner.temp }}/tooling-plan.json
        VIZE_TOOLING_TEST_SHARD: ${{ inputs.shard }}/${{ inputs.total }}
      run: vp run --workspace-root test:scripts:planned
    - uses: ./.github/actions/upload-formatter-api-corpus-evidence
      if: ${{ always() }}
      with: { shard: "${{ inputs.shard }}" }
