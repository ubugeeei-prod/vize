name: Capture original Vue1 interpolation documents
description: Join fresh checked Glyph output to independent whole LF goldens and pinned getter outcomes
inputs:
  comparison-base:
    required: true
    description: Literal source comparison base used by the enclosing tooling plan
runs:
  using: composite
  steps:
    - name: Select the original Vue1 document source slice
      id: select
      shell: bash
      env:
        BASE_SHA: ${{ inputs.comparison-base }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
          echo 'selected=true' >> "$GITHUB_OUTPUT"
        else
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/vue1-text-document-paths.txt"
          if rg '^(crates/vize_glyph/src/native_doc(\.rs|/(expression(\.rs|/)|vue1_text(\.rs|/)|document\.rs|printer\.rs))|crates/vize_glyph/tests/(native_vue1_text_document|fixtures/native-vue1-text-doc-1\.0\.28\.json)|davinci/vize_l1/src/|davinci/vize_l0/src/source_frame\.rs|vendor/oxc_parser/src/|tests/tooling/(native-vue1-text-document-(oracle|capture-workflow)\.test\.ts|support/vue1-(pinned-getter|text-document-judge)\.ts)|tests/_fixtures/reference/vue1/|\.github/actions/test-native-(vue1|historical)-text-document|\.github/workflows/pr-source-checks\.yml)' "$RUNNER_TEMP/vue1-text-document-paths.txt"; then
            echo 'selected=true' >> "$GITHUB_OUTPUT"
          else
            echo 'selected=false' >> "$GITHUB_OUTPUT"
          fi
        fi
    - name: Capture actual original callbacks and complete pinned getter outcomes
      if: ${{ steps.select.outputs.selected == 'true' }}
      shell: bash
      env:
        VIZE_GLYPH_VUE1_TEXT_CAPTURE: ${{ runner.temp }}/native-vue1-text-documents.json
        VIZE_GLYPH_VUE1_TEXT_ORACLE_CAPTURE: ${{ runner.temp }}/native-vue1-text-document-getters.json
        VIZE_GLYPH_VUE1_TEXT_REQUIRE_CAPTURE: "1"
        VIZE_GLYPH_VUE1_TEXT_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        rm -f "$VIZE_GLYPH_VUE1_TEXT_CAPTURE" "$VIZE_GLYPH_VUE1_TEXT_ORACLE_CAPTURE"
        set +e
        cargo test --locked --profile ci -p vize_glyph --test native_vue1_text_document whole_lf_goldens_idempotence_and_capture_use_only_original_callback_documents -- --exact
        rust_status=$?
        vp node --test tests/tooling/native-vue1-text-document-oracle.test.ts
        oracle_status=$?
        set -e
        test -s "$VIZE_GLYPH_VUE1_TEXT_CAPTURE"
        test -s "$VIZE_GLYPH_VUE1_TEXT_ORACLE_CAPTURE"
        if [[ "$rust_status" != 0 || "$oracle_status" != 0 ]]; then
          exit 1
        fi
    - name: Retain complete original Vue1 documents and primary observations
      if: ${{ always() && steps.select.outputs.selected == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: native-vue1-text-documents-${{ github.run_id }}-${{ github.sha }}
        path: |
          ${{ runner.temp }}/native-vue1-text-documents.json
          ${{ runner.temp }}/native-vue1-text-document-getters.json
        if-no-files-found: error
        retention-days: 14
