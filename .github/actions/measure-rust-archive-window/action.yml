name: Measure the unchanged Rust tar with a bounded zstd window
description: Authenticate the original build once and preserve its complete decoded tar.
runs:
  using: composite
  steps:
    - name: Exercise full-body, trailer, corruption, provenance and partition controls
      shell: bash
      run: python3 -B tools/support/compat/github/rust_archive_controls.py
    - name: Download and authenticate the complete original ZIP before expiry
      id: original
      env:
        GH_TOKEN: ${{ github.token }}
        PAYLOAD_ARTIFACT_ID: "11706049605"
        PAYLOAD_SOURCE_SHA: 1f463e566cee76d093b3f0c41ee30b7bd1314cdb
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/rust-window"
        python3 -B tools/support/compat/github/artifact_payload_download.py "$RUNNER_TEMP/rust-window/download"
    - name: Audit every original member and re-encode the identical whole tar
      id: encode
      shell: bash
      run: |
        /usr/bin/time -v -o "$RUNNER_TEMP/rust-window/prepare.resources" python3 -B tools/support/compat/github/rust_archive_transport.py prepare "$RUNNER_TEMP/rust-window/download" "$RUNNER_TEMP/rust-window/trial" "$GITHUB_SHA"
    - name: Retain the complete original ZIP without recompression
      if: ${{ always() && steps.original.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: rust-window-baseline-${{ github.sha }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/rust-window/download/original.zip
        compression-level: 0
        if-no-files-found: error
        retention-days: 14
    - name: Upload the complete candidate archive without recompression
      if: ${{ steps.encode.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: rust-window-candidate-${{ github.sha }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/rust-window/trial/candidate/tests.tar.zst
        compression-level: 0
        if-no-files-found: error
        retention-days: 14
    - name: Retain all original receipts, inventories, errors and phase measurements
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: rust-window-custody-${{ github.sha }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/rust-window/download/*.json
          ${{ runner.temp }}/rust-window/trial/*.json
          ${{ runner.temp }}/rust-window/trial/*.resources
          ${{ runner.temp }}/rust-window/trial/*.stderr
          ${{ runner.temp }}/rust-window/trial/*.stdout
          ${{ runner.temp }}/rust-window/trial/candidate/*.stderr
          ${{ runner.temp }}/rust-window/prepare.resources
        if-no-files-found: error
        retention-days: 14
