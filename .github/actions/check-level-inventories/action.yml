name: Check Davinci inventories
description: Validate committed source witnesses and publish generated run ledgers
runs:
  using: composite
  steps:
    - name: Check Davinci source inventories
      shell: bash
      # The independent lanes run together; see source-inventories.ts.
      run: node tools/support/compat/davinci/source-inventories.ts
    - name: Upload generated Davinci ledgers
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: davinci-generated-ledgers
        path: artifacts/davinci-ledgers/
        if-no-files-found: error
        retention-days: 14
