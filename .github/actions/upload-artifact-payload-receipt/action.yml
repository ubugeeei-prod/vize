name: Retain complete artifact consumer receipt
description: Preserve the source-bound consumer receipt even after a failed or cancelled step
runs:
  using: composite
  steps:
    - name: Retain the full consumer verification receipt
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: artifact-payload-consumer-${{ github.sha }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/payload-restore.json
          ${{ runner.temp }}/payload-restore-resources.txt
        if-no-files-found: error
        retention-days: 14
