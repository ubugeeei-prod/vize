name: Retain differential product corpus evidence
description: Keep formatter API artifacts, product observations and source-built CLI receipts.
inputs:
  shard:
    description: Tooling shard identity within this workflow job.
    default: full
runs:
  using: composite
  steps:
    - name: Upload differential product corpus evidence
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: formatter-api-corpus-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ inputs.shard }}
        path: |
          target/differential/
          target/ci/vize.differential-build.json
        if-no-files-found: warn
