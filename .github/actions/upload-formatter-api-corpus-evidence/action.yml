name: Retain public formatter API corpus evidence
description: Keep source-built formatter receipts, raw streams and frozen executable artifacts.
runs:
  using: composite
  steps:
    - name: Upload public formatter API corpus evidence
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: formatter-api-corpus-${{ github.run_id }}-${{ github.run_attempt }}
        path: target/differential/formatter-api/
        if-no-files-found: warn
