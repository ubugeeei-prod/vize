name: Test actual source LSP product responses
description: Exercise editor features, authored config and project navigation with real native types
runs:
  using: composite
  steps:
    - name: Build the same-source CLI and record its identity
      shell: bash
      run: . "$GITHUB_ACTION_PATH/scripts/build-the-same-source-cli-and-record-its-identity.sh"
    - name: Install the original Vue provider once
      shell: bash
      run: npm install --prefix "$RUNNER_TEMP/native-lsp-provider" --ignore-scripts --no-package-lock --no-audit --no-fund vue@3.5.43
    - name: Require complete source LSP feature and project responses
      shell: bash
      env:
        VIZE_LSP_BIN: ${{ github.workspace }}/target/ci/vize
        VIZE_LSP_REQUIRE_SOURCE_BUILD: "1"
        VIZE_TEST_REQUIRE_TSGO: "1"
        VIZE_EDITOR_CONFIG_REQUIRED: "1"
        VIZE_PRIVATE_IMPORT_REQUIRED: "1"
        VIZE_PROJECT_NAVIGATION_REQUIRED: "1"
        VIZE_EDITOR_CONFIG_VUE_ROOT: ${{ runner.temp }}/native-lsp-provider/node_modules/vue
        VIZE_PRIVATE_IMPORT_VUE_ROOT: ${{ runner.temp }}/native-lsp-provider/node_modules/vue
        VIZE_PROJECT_NAVIGATION_VUE_ROOT: ${{ runner.temp }}/native-lsp-provider/node_modules/vue
        VIZE_EDITOR_CONFIG_CAPTURE: ${{ runner.temp }}/native-lsp/editor-config
        VIZE_PRIVATE_IMPORT_CAPTURE: ${{ runner.temp }}/native-lsp/private-imports
      run: . "$GITHUB_ACTION_PATH/scripts/require-complete-source-lsp-feature-and-project-responses.sh"
    - name: Preserve complete original template ref type admission
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: template-ref-type-admission-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          target/differential/fallthrough-listener-inputs/template-ref-admission-*
          target/differential/template-ref-type-admission-lsp
          target/differential/template-ref-global-admission
        if-no-files-found: error
        retention-days: 7
    - name: Preserve complete experimental route protocol receipts
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: experimental-route-lsp-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        path: |
          target/differential/experimental-router-params/observation.json
          target/differential/experimental-router-variable-roots/observation.json
          target/differential/experimental-router-variable-roots/provider/provider-identity.json
          target/differential/experimental-router-variable-roots/provider/provider-processes.json
          target/differential/experimental-router-params/provider/provider-identity.json
          target/differential/experimental-router-params/provider/provider-processes.json
          target/ci/vize.differential-build.json
        if-no-files-found: ignore
        retention-days: 7
    - name: Retain complete local completion resolve observations
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: local-completion-resolve-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          target/differential/local-completion-resolve
          target/ci/vize.differential-build.json
        if-no-files-found: error
        retention-days: 7
    - name: Preserve source identity and LSP responses on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: native-lsp-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          target/ci/vize.differential-build.json
          target/differential/lsp-sessions
          target/differential/experimental-router-params
          target/differential/experimental-router-variable-roots
          ${{ runner.temp }}/native-lsp
        if-no-files-found: ignore
        retention-days: 7
    - name: Preserve complete overlay graph protocol and memory observations
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: overlay-graph-lsp-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          target/differential/lsp-overlay-graph-reuse/
          target/differential/lsp-sessions/
          target/ci/vize.differential-build.json
        if-no-files-found: error
        retention-days: 7
