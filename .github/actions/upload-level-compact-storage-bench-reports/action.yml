name: Upload Levels allocation bench reports
description: Uploads allocation bench JSON reports for Levels wall-budget baselines.
runs:
  using: composite
  steps:
    - name: Upload reports
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: level-allocation-bench-reports
        path: tools/benchmarks/results/levels/*.json
        if-no-files-found: error
        retention-days: 14
