name: Native scoped CSS runtime
description: Check original SFC scoped CSS and fresh complete native modules in real Vue
runs:
  using: composite
  steps:
    - name: Capture scoped modules from the current Rust source and mount real Vue
      shell: bash
      env:
        VIZE_NATIVE_SCOPED_CSS_CAPTURE: ${{ runner.temp }}/native-scoped-css-capture.json
        VIZE_NATIVE_SCOPED_CSS_RUNTIME_CAPTURE: ${{ runner.temp }}/native-scoped-css-runtime.json
      run: |
        cargo test --locked --profile ci -p vize_atelier_sfc native::scoped_tests::four_source_bound_scoped_modules_css_and_default_identity_match_complete_contracts -- --exact
        vp node --test tests/tooling/native-sfc-scoped-css-reference.test.ts
        git rev-parse HEAD > "$RUNNER_TEMP/native-scoped-css-source.txt"
    - name: Upload current-source scoped CSS modules and runtime captures
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: native-scoped-css-${{ github.sha }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/native-scoped-css-capture.json
          ${{ runner.temp }}/native-scoped-css-runtime.json
          ${{ runner.temp }}/native-scoped-css-source.txt
        if-no-files-found: error
        retention-days: 7
