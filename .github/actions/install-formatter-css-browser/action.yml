name: Install CSS formatter reference browser
description: Provision the Chromium owned by the selected tests package
runs:
  using: composite
  steps:
    - name: Prepare checksum-pinned Pkl and upstream lint dependencies
      if: env.VIZE_TOOLING_TEST_PLAN != ''
      shell: bash
      run: node tools/support/compat/github/prepare-pkl-schema.mjs && node tools/support/compat/github/prepare-vue-benchmarks.mjs
    - name: Plan CSS formatter browser dependency
      id: formatter-css-browser
      if: env.VIZE_TOOLING_TEST_PLAN != ''
      shell: bash
      run: node tools/support/compat/github/formatter-css-browser-plan.mjs
    - uses: ./.github/actions/setup-ubuntu-archive
      if: env.VIZE_TOOLING_TEST_PLAN == '' || steps.formatter-css-browser.outputs.required == 'true'
    - name: Install the actual tests-package Chromium
      if: env.VIZE_TOOLING_TEST_PLAN == '' || steps.formatter-css-browser.outputs.required == 'true'
      shell: bash
      run: vize-ci-apt-retry vp exec --filter './tests' -- playwright install --with-deps chromium
