name: Native selected SFC DOM runtime
description: Capture whole original SFC components and compare pinned Vue click effects
runs:
  using: composite
  steps:
    - name: Qualify fresh completed lower File static class modules in both runtime modes
      shell: bash
      env:
        VIZE_L4_DOM_STATIC_CLASS_CAPTURE: ${{ runner.temp }}/native-dom-static-class.json
        VIZE_L4_DOM_STATIC_CLASS_RUNTIME_CAPTURE: ${{ runner.temp }}/native-dom-static-class-runtime
        VIZE_L4_DOM_STATIC_CLASS_REQUIRE_CAPTURE: "1"
      run: |
        cargo test --locked --profile ci -p vize_l4 --test native_dom_static_class -- --nocapture
        NODE_ENV=development vp node --test tests/tooling/native-dom-static-class-reference.test.ts
        NODE_ENV=production vp node --test tests/tooling/native-dom-static-class-reference.test.ts
        test -s "$VIZE_L4_DOM_STATIC_CLASS_CAPTURE"
        test -s "${VIZE_L4_DOM_STATIC_CLASS_RUNTIME_CAPTURE}.development.json"
        test -s "${VIZE_L4_DOM_STATIC_CLASS_RUNTIME_CAPTURE}.production.json"
    - name: Qualify whole public selected static class components in both runtime modes
      shell: bash
      env:
        VIZE_NATIVE_SELECTED_STATIC_CLASS_CAPTURE: ${{ runner.temp }}/native-selected-static-class.json
        VIZE_NATIVE_SELECTED_STATIC_CLASS_RUNTIME_CAPTURE: ${{ runner.temp }}/native-selected-static-class-runtime
        VIZE_NATIVE_SELECTED_STATIC_CLASS_REQUIRE_CAPTURE: "1"
      run: |
        set +e
        cargo test --locked --profile ci -p vize_atelier_sfc --test native_selected_static_class -- --nocapture
        rust_status=$?
        NODE_ENV=development vp node --test tests/tooling/native-selected-static-class-reference.test.ts
        development_status=$?
        NODE_ENV=production vp node --test tests/tooling/native-selected-static-class-reference.test.ts
        production_status=$?
        set -e
        printf '{"rust":%s,"development":%s,"production":%s}\n' "$rust_status" "$development_status" "$production_status" > "${VIZE_NATIVE_SELECTED_STATIC_CLASS_RUNTIME_CAPTURE}.statuses.json"
        test -s "$VIZE_NATIVE_SELECTED_STATIC_CLASS_CAPTURE"
        test -s "${VIZE_NATIVE_SELECTED_STATIC_CLASS_RUNTIME_CAPTURE}.development.json"
        test -s "${VIZE_NATIVE_SELECTED_STATIC_CLASS_RUNTIME_CAPTURE}.production.json"
        test "$rust_status" -eq 0
        test "$development_status" -eq 0
        test "$production_status" -eq 0
    - name: Capture and execute source-built selected SFC components
      shell: bash
      env:
        VIZE_NATIVE_SELECTED_SFC_DOM_CAPTURE: ${{ runner.temp }}/native-selected-sfc-dom-capture.json
        VIZE_NATIVE_SELECTED_SFC_DOM_REQUIRE_CAPTURE: "1"
        VIZE_NATIVE_SELECTED_SFC_DOM_RUNTIME_CAPTURE: ${{ runner.temp }}/native-selected-sfc-dom-runtime.json
      run: |
        cargo test --locked --profile ci -p vize_atelier_sfc native_selected::tests::five_whole_original_click_components_and_maps_are_captured -- --exact
        vp node --test tests/tooling/native-selected-sfc-dom-reference.test.ts
        test -s "$VIZE_NATIVE_SELECTED_SFC_DOM_CAPTURE"
        test -s "$VIZE_NATIVE_SELECTED_SFC_DOM_RUNTIME_CAPTURE"
    - name: Capture and execute whole original selected setup components
      shell: bash
      env:
        VIZE_NATIVE_SELECTED_SETUP_SFC_DOM_CAPTURE: ${{ runner.temp }}/native-selected-setup-sfc-dom-capture.json
        VIZE_NATIVE_SELECTED_SETUP_SFC_DOM_REQUIRE_CAPTURE: "1"
        VIZE_NATIVE_SELECTED_SETUP_SFC_DOM_RUNTIME_CAPTURE: ${{ runner.temp }}/native-selected-setup-sfc-dom-runtime.json
      run: |
        cargo test --locked --profile ci -p vize_atelier_sfc native_selected_setup::tests::seven_whole_original_setup_components_and_maps_are_captured -- --exact
        vp node --test tests/tooling/native-selected-setup-sfc-dom-reference.test.ts
        test -s "$VIZE_NATIVE_SELECTED_SETUP_SFC_DOM_CAPTURE"
        test -s "$VIZE_NATIVE_SELECTED_SETUP_SFC_DOM_RUNTIME_CAPTURE"
    - name: Capture and execute whole original mutable For components
      shell: bash
      env:
        VIZE_NATIVE_ORIGINAL_FOR_SFC_DOM_CAPTURE: ${{ runner.temp }}/native-original-for-sfc-dom-capture.json
        VIZE_NATIVE_ORIGINAL_FOR_SFC_DOM_REQUIRE_CAPTURE: "1"
        VIZE_NATIVE_ORIGINAL_FOR_SFC_DOM_RUNTIME_CAPTURE: ${{ runner.temp }}/native-original-for-sfc-dom-runtime.json
      run: |
        cargo test --locked --profile ci -p vize_atelier_sfc native_selected_setup::tests::original_for::ten_whole_original_for_components_and_maps_are_captured -- --exact
        vp node --test tests/tooling/native-original-for-sfc-dom-reference.test.ts
        test -s "$VIZE_NATIVE_ORIGINAL_FOR_SFC_DOM_CAPTURE"
        test -s "$VIZE_NATIVE_ORIGINAL_FOR_SFC_DOM_RUNTIME_CAPTURE"
    - name: Capture and execute whole original For value components
      shell: bash
      env:
        VIZE_NATIVE_ORIGINAL_FOR_VALUE_SFC_DOM_CAPTURE: ${{ runner.temp }}/native-original-for-value-sfc-dom-capture.json
        VIZE_NATIVE_ORIGINAL_FOR_VALUE_SFC_DOM_REQUIRE_CAPTURE: "1"
        VIZE_NATIVE_ORIGINAL_FOR_VALUE_SFC_DOM_RUNTIME_CAPTURE: ${{ runner.temp }}/native-original-for-value-sfc-dom-runtime.json
      run: |
        cargo test --locked --profile ci -p vize_atelier_sfc native_selected_setup::tests::original_for_value::six_whole_original_for_value_components_and_raw_maps_are_captured -- --exact
        vp node --test tests/tooling/native-original-for-value-sfc-dom-reference.test.ts
        test -s "$VIZE_NATIVE_ORIGINAL_FOR_VALUE_SFC_DOM_CAPTURE"
        test -s "$VIZE_NATIVE_ORIGINAL_FOR_VALUE_SFC_DOM_RUNTIME_CAPTURE"
    - name: Capture and qualify original constant For components in both runtime modes
      shell: bash
      env:
        VIZE_NATIVE_ORIGINAL_FOR_CONSTANT_SFC_DOM_CAPTURE: ${{ runner.temp }}/native-original-for-constant-sfc-dom-capture.json
        VIZE_NATIVE_ORIGINAL_FOR_CONSTANT_SFC_DOM_REQUIRE_CAPTURE: "1"
        VIZE_NATIVE_ORIGINAL_FOR_CONSTANT_SFC_DOM_RAW_CAPTURE: ${{ runner.temp }}/native-original-for-constant-sfc-dom-unqualified-attempts.json
      run: |
        rust_status=0
        cargo test --locked --profile ci -p vize_atelier_sfc native_selected_setup::tests::original_for_constant::eleven_whole_original_constant_for_components_and_raw_maps_are_captured -- --exact || rust_status=$?
        node_status=0
        vp node tests/tooling/support/native-original-for-constant-sfc-dom-processes.ts || node_status=$?
        RUST_STATUS="$rust_status" NODE_STATUS="$node_status" vp node --input-type=module -e '
          import fs from "node:fs";
          fs.writeFileSync(process.env.VIZE_NATIVE_ORIGINAL_FOR_CONSTANT_SFC_DOM_RAW_CAPTURE + ".statuses.json", JSON.stringify({
            schema: "vize.native-sfc.original-for-constant-process-statuses",
            sourceRevision: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID,
            rustStatus: Number(process.env.RUST_STATUS), nodeStatus: Number(process.env.NODE_STATUS)
          }, null, 2) + "\n");
        '
        test "$rust_status" -eq 0
        test "$node_status" -eq 0
        test -s "$VIZE_NATIVE_ORIGINAL_FOR_CONSTANT_SFC_DOM_CAPTURE"
        test -s "${{ runner.temp }}/native-original-for-constant-sfc-dom-development-runtime.json"
        test -s "${{ runner.temp }}/native-original-for-constant-sfc-dom-production-runtime.json"
    - name: Upload complete selected SFC component and runtime captures
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: native-selected-sfc-dom-${{ github.sha }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/native-dom-static-class.json
          ${{ runner.temp }}/native-dom-static-class-runtime.development.json
          ${{ runner.temp }}/native-dom-static-class-runtime.production.json
          ${{ runner.temp }}/native-selected-static-class.json
          ${{ runner.temp }}/native-selected-static-class-runtime.development.json
          ${{ runner.temp }}/native-selected-static-class-runtime.production.json
          ${{ runner.temp }}/native-selected-static-class-runtime.statuses.json
          ${{ runner.temp }}/native-selected-sfc-dom-capture.json
          ${{ runner.temp }}/native-selected-sfc-dom-runtime.json
          ${{ runner.temp }}/native-selected-setup-sfc-dom-capture.json
          ${{ runner.temp }}/native-selected-setup-sfc-dom-runtime.json
          ${{ runner.temp }}/native-original-for-sfc-dom-capture.json
          ${{ runner.temp }}/native-original-for-sfc-dom-runtime.json
          ${{ runner.temp }}/native-original-for-value-sfc-dom-capture.json
          ${{ runner.temp }}/native-original-for-value-sfc-dom-runtime.json
          ${{ runner.temp }}/native-original-for-constant-sfc-dom-capture.json
          ${{ runner.temp }}/native-original-for-constant-sfc-dom-unqualified-attempts.json
          ${{ runner.temp }}/native-original-for-constant-sfc-dom-unqualified-attempts.json.statuses.json
          ${{ runner.temp }}/native-original-for-constant-sfc-dom-*-unqualified-runtime.json
          ${{ runner.temp }}/native-original-for-constant-sfc-dom-development-runtime.json
          ${{ runner.temp }}/native-original-for-constant-sfc-dom-production-runtime.json
          ${{ runner.temp }}/native-original-for-constant-sfc-dom-*.stdout
          ${{ runner.temp }}/native-original-for-constant-sfc-dom-*.stderr
          ${{ runner.temp }}/native-original-for-constant-sfc-dom-*.process.json
        if-no-files-found: error
        retention-days: 7
