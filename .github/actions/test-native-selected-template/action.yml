name: Execute original selected-template DOM modules
description: Capture genuine L1-L4 modules and run their pinned Vue laws
runs:
  using: composite
  steps:
    - name: Capture and execute original selected-template modules
      shell: bash
      env:
        VIZE_L4_SELECTED_TEMPLATE_CAPTURE: ${{ runner.temp }}/native-selected-template-dom.json
      run: |
        rm -f "$VIZE_L4_SELECTED_TEMPLATE_CAPTURE"
        cargo test -p vize_l4 --profile ci --test native_selected_template complete_original_selected_templates_keep_custody_and_exact_output -- --exact
        vp node tools/support/compat/davinci/selected-template-dom.mjs "$VIZE_L4_SELECTED_TEMPLATE_CAPTURE"
    - name: Retain the actual native module and map capture
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: native-selected-template-dom-${{ github.run_id }}-${{ github.sha }}
        path: ${{ runner.temp }}/native-selected-template-dom.json
        if-no-files-found: error
        retention-days: 14
    - name: Execute original selected-template literal modules
      uses: ./.github/actions/test-native-selected-template-literals
