name: Setup JS Check Runtime
description: Validate workflows using the Actions Node.js runtime without compiling orchestration tools

inputs:
  full:
    description: Install native and compatibility tooling for scheduled or manual qualification
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/check-workflow-syntax
      with:
        controls: ${{ inputs.full }}
    - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
      if: inputs.full == 'true'
      with: { toolchain: stable }
    - uses: ./.github/actions/setup-wild-http-recovery
      if: inputs.full == 'true'
      with:
        wild-version: "0.9.0"
    - uses: ./.github/actions/setup-rust-sticky-cache
      if: inputs.full == 'true'
      with:
        key: check-js
        cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
    - uses: ./.github/actions/setup-rust-script
      if: inputs.full == 'true'
