name: Stabilize Ubuntu package archive
description: Avoid unhealthy Blacksmith mirror-list entries before apt-based setup

runs:
  using: composite
  steps:
    - name: Use HTTPS Ubuntu archives on Blacksmith
      shell: bash
      run: |
        set -euo pipefail
        sudo tee /etc/apt/apt.conf.d/80-vize-retry-downloads >/dev/null <<'APT'
        Acquire::Retries "5";
        Acquire::http::Timeout "30";
        Acquire::https::Timeout "30";
        Acquire::Queue-Mode "access";
        Acquire::http::Pipeline-Depth "0";
        Acquire::https::Pipeline-Depth "0";
        APT

        sudo tee /usr/local/bin/vize-ci-apt-retry >/dev/null <<'BASH'
        #!/usr/bin/env bash
        set -o pipefail

        max_attempts="${VIZE_CI_APT_RETRIES:-4}"
        delay_seconds="${VIZE_CI_APT_RETRY_DELAY_SECONDS:-8}"
        if [[ "$max_attempts" =~ ^[0-9]+$ ]]; then
          max_attempts=$((10#$max_attempts))
        else
          max_attempts=1
        fi
        if (( max_attempts < 1 )); then
          max_attempts=1
        fi

        if [[ "$delay_seconds" =~ ^[0-9]+$ ]]; then
          delay_seconds=$((10#$delay_seconds))
        else
          delay_seconds=8
        fi

        for attempt in $(seq 1 "$max_attempts"); do
          if "$@"; then
            exit 0
          else
            status=$?
          fi

          if [[ "$attempt" = "$max_attempts" ]]; then
            exit "$status"
          fi

          echo "::warning title=Apt-backed setup retry::attempt ${attempt}/${max_attempts} failed with exit ${status}; retrying" >&2
          sudo rm -rf /var/lib/apt/lists/partial /var/cache/apt/archives/partial || true
          sleep "$((delay_seconds * attempt))"
        done
        BASH
        sudo chmod +x /usr/local/bin/vize-ci-apt-retry

        mirror_list=/etc/apt/blacksmith-ubuntu-mirrors.txt
        if [[ -f "$mirror_list" ]]; then
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee "$mirror_list" >/dev/null
        fi

        apt_source_files=()
        for candidate in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
          [[ -f "$candidate" ]] && apt_source_files+=("$candidate")
        done
        if (( ${#apt_source_files[@]} > 0 )); then
          sudo sed -i \
            -e 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' \
            "${apt_source_files[@]}"
        fi
