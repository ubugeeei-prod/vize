name: Prepare release assets
description: Sign exact-source release assets while registries publish
inputs:
  tag-name: { required: true, description: Authorized immutable release tag }
  source-sha: { required: true, description: Authorized immutable source H }
outputs:
  artifact-id:
    description: Immutable asset envelope from this workflow run
    value: ${{ steps.upload.outputs.artifact-id }}
  sha256:
    description: SHA-256 of the complete signed asset envelope
    value: ${{ steps.seal.outputs.sha256 }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with: { node-version-file: package.json, package-manager-cache: false }
    - name: Download CLI artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with: { pattern: cli-*, path: cli-artifacts, merge-multiple: true }
    - name: Download editor extension artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with: { name: editor-extensions, path: editor-extension-artifacts }
    - name: List CLI artifacts
      shell: bash
      run: ls -la cli-artifacts/
    - name: List editor extension artifacts
      shell: bash
      run: find editor-extension-artifacts -maxdepth 5 -type f | sort
    # Publish CycloneDX and SPDX SBOMs for dependency auditing.
    - name: Generate workspace SBOM (CycloneDX)
      uses: anchore/sbom-action@61119d458adab75f756bc0b9e4bde25725f86a7a # v0.17.8
      with:
        artifact-name: vize-${{ inputs.tag-name }}-cyclonedx.sbom.json
        format: cyclonedx-json
        output-file: vize-${{ inputs.tag-name }}-cyclonedx.sbom.json
        upload-artifact: false
        upload-release-assets: false
    - name: Generate workspace SBOM (SPDX)
      uses: anchore/sbom-action@61119d458adab75f756bc0b9e4bde25725f86a7a # v0.17.8
      with:
        artifact-name: vize-${{ inputs.tag-name }}-spdx.sbom.json
        format: spdx-json
        output-file: vize-${{ inputs.tag-name }}-spdx.sbom.json
        upload-artifact: false
        upload-release-assets: false
    # Sign artifacts with the workflow OIDC identity and Sigstore.
    - name: Install cosign
      uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
      with:
        cosign-release: v2.4.1
    # Publish SHA-256 checksums alongside signatures and certificates.
    - name: Generate SHA-256 checksums for release artifacts
      shell: bash
      run: |
        for artifact in \
          cli-artifacts/*.tar.gz \
          cli-artifacts/*.zip \
          editor-extension-artifacts/editors/vscode/dist/*.vsix \
          editor-extension-artifacts/*.tar.gz; do
          if [ -f "$artifact" ]; then
            echo "Hashing $artifact"
            ( cd "$(dirname "$artifact")" && sha256sum "$(basename "$artifact")" ) > "${artifact}.sha256"
          fi
        done
    - name: Sign release artifacts (keyless)
      env:
        COSIGN_YES: "true"
        RELEASE_TAG_NAME: ${{ inputs.tag-name }}
      shell: bash
      run: |
        for artifact in \
          cli-artifacts/*.tar.gz \
          cli-artifacts/*.zip \
          editor-extension-artifacts/editors/vscode/dist/*.vsix \
          editor-extension-artifacts/*.tar.gz \
          vize-${RELEASE_TAG_NAME}-cyclonedx.sbom.json \
          vize-${RELEASE_TAG_NAME}-spdx.sbom.json; do
          if [ -f "$artifact" ]; then
            echo "Signing $artifact"
            cosign sign-blob --yes \
              --bundle "${artifact}.cosign.bundle" \
              --output-certificate "${artifact}.pem" \
              --output-signature "${artifact}.sig" \
              "$artifact"
          fi
        done
    - name: Seal signed assets and their source identity
      id: seal
      shell: bash
      env:
        RELEASE_TAG_NAME: ${{ inputs.tag-name }}
        RELEASE_SOURCE_SHA: ${{ inputs.source-sha }}
      run: node tools/support/release/release-assets.ts pack "$RUNNER_TEMP/release-assets.tar"
    - name: Retain signed release assets
      id: upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/release-assets.tar
        if-no-files-found: error
        compression-level: 0
