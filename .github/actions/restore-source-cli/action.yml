name: Restore the same-run source-built CLI and SFC oracle
description: Preserve the producer receipt and validate source, toolchain, run, modes and full bytes.
inputs:
  sha256: { required: true, description: Digest emitted by the successful source CLI producer }
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: source-cli-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/source-cli
        digest-mismatch: error
    - name: Validate and install original producer binaries and receipt
      shell: bash
      env: { SOURCE_CLI_SHA256: "${{ inputs.sha256 }}" }
      run: node tools/support/compat/github/source-cli-artifact.ts restore "$RUNNER_TEMP/source-cli/source-cli.tar.gz" "$SOURCE_CLI_SHA256" && cat target/ci/vize.differential-build.json && sudo install -m 0755 target/ci/vize /usr/local/bin/vize
