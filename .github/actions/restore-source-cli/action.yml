name: Restore the same-run source-built CLI and SFC oracle
description: Preserve producer custody and bind a separate immutable consumer attempt.
inputs:
  producer: { required: true, description: Complete outputs of the successful source CLI producer }
runs:
  using: composite
  steps:
    - name: Validate the exact retained producer outputs
      id: producer
      shell: bash
      env: { SOURCE_CLI_PRODUCER_OUTPUTS: "${{ inputs.producer }}" }
      run: node tools/support/compat/github/source-cli-artifact.ts producer
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: source-cli-${{ github.run_id }}-${{ steps.producer.outputs.producer-attempt }}
        path: ${{ runner.temp }}/source-cli
        digest-mismatch: error
    - name: Validate and install original producer binaries and receipt
      shell: bash
      env:
        SOURCE_CLI_SHA256: "${{ steps.producer.outputs.sha256 }}"
        SOURCE_CLI_PRODUCER_ATTEMPT: "${{ steps.producer.outputs.producer-attempt }}"
        SOURCE_CLI_RECEIPT_SHA256: "${{ steps.producer.outputs.receipt-sha256 }}"
      run: node tools/support/compat/github/source-cli-artifact.ts restore "$RUNNER_TEMP/source-cli/source-cli.tar.gz" "$SOURCE_CLI_SHA256" "$SOURCE_CLI_PRODUCER_ATTEMPT" "$SOURCE_CLI_RECEIPT_SHA256" && cat target/ci/vize.differential-build.json && sudo install -m 0755 target/ci/vize /usr/local/bin/vize
