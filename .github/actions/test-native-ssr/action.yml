name: Test fresh native SSR modules
description: Require source-built module maps and actual pinned Vue SSR executions
runs:
  using: composite
  steps:
    - name: Test fresh native SSR modules with pinned Vue runtime
      id: native-ssr
      shell: bash
      env:
        VIZE_L4_SSR_NATIVE_CAPTURE: ${{ runner.temp }}/native-ssr-modules.json
        VIZE_L4_SSR_RUNTIME_CAPTURE: ${{ runner.temp }}/native-ssr-runtime.json
        VIZE_L4_SELECTED_SSR_NATIVE_CAPTURE: ${{ runner.temp }}/native-selected-ssr-modules.json
        VIZE_L4_SELECTED_SSR_RUNTIME_CAPTURE: ${{ runner.temp }}/native-selected-ssr-runtime.json
        VIZE_L4_SSR_REQUIRE_NATIVE: "1"
        VIZE_JSX_SLOTS_SSR_CAPTURE: ${{ runner.temp }}/jsx-runtime-slots-ssr.json
        VIZE_JSX_VALUE_CAPTURE: ${{ runner.temp }}/jsx-value-sensitive-modules.json
        VIZE_JSX_FALSY_RECEIPT: ${{ runner.temp }}/jsx-value-sensitive-runtime.json
        VIZE_JSX_VAPOR_SLOTS_SSR_CAPTURE: ${{ runner.temp }}/jsx-vapor-runtime-slots-ssr.json
      run: |
        cargo test --locked --profile ci -p vize_l4 --test native_ssr --test native_ssr_roles --test native_selected_ssr -- --nocapture
        cargo test --locked --profile ci -p vize_atelier_jsx --test ssr -- --nocapture
        cargo test --locked --profile ci -p vize_atelier_jsx --test falsy_and actual_values_updates_and_hydration_match_jsx_child_semantics -- --exact --nocapture
        vp node --test tests/tooling/l4-native-ssr-reference.test.ts tests/tooling/l4-selected-ssr-reference.test.ts tests/tooling/native-ssr-static-class-reference.test.ts tests/tooling/jsx-runtime-slots-ssr.test.ts
        NODE_ENV=production vp node --test tests/tooling/native-ssr-static-class-reference.test.ts
    - name: Test fresh whole scriptless SFC SSR modules
      id: native-sfc-ssr
      shell: bash
      env:
        VIZE_NATIVE_SFC_SSR_CAPTURE: ${{ runner.temp }}/native-sfc-ssr-modules.json
        VIZE_NATIVE_SFC_SSR_RUNTIME_CAPTURE: ${{ runner.temp }}/native-sfc-ssr-runtime.json
        VIZE_L4_SSR_REQUIRE_NATIVE: "1"
      run: |
        set +e
        cargo test --locked --profile ci -p vize_atelier_sfc --test native_scriptless_ssr -- --nocapture
        rust_status=$?
        vp node --test tests/tooling/native-sfc-scriptless-ssr-reference.test.ts
        runtime_status=$?
        set -e
        test "$rust_status" -eq 0
        test "$runtime_status" -eq 0
    - name: Test fresh whole primitive setup SFC SSR modules
      id: native-setup-ssr
      shell: bash
      env:
        VIZE_NATIVE_SETUP_SSR_CAPTURE: ${{ runner.temp }}/native-setup-ssr-modules.json
        VIZE_NATIVE_SETUP_SSR_RUNTIME_CAPTURE: ${{ runner.temp }}/native-setup-ssr-runtime.json
        VIZE_L4_SSR_REQUIRE_NATIVE: "1"
      run: |
        set +e
        cargo test --locked --profile ci -p vize_atelier_sfc --test native_scriptless_setup_ssr -- --nocapture
        rust_status=$?
        vp node --test tests/tooling/native-sfc-setup-ssr-reference.test.ts tests/tooling/native-sfc-setup-ssr-direct-child-reference.test.ts
        runtime_status=$?
        set -e
        test "$rust_status" -eq 0
        test "$runtime_status" -eq 0
    - name: Capture genuine original input Model SSR values in both runtime modes
      id: native-input-model-ssr
      if: ${{ !cancelled() }}
      shell: bash
      env:
        VIZE_NATIVE_ORIGINAL_INPUT_MODEL_SFC_SSR_CAPTURE: ${{ runner.temp }}/native-original-input-model-sfc-ssr-capture.json
        VIZE_NATIVE_ORIGINAL_INPUT_MODEL_SFC_SSR_REQUIRE_CAPTURE: "1"
        VIZE_NATIVE_ORIGINAL_INPUT_MODEL_SFC_SSR_PRIMARY_CAPTURE: ${{ runner.temp }}/native-original-input-model-sfc-ssr-primary
        VIZE_NATIVE_ORIGINAL_INPUT_MODEL_SFC_SSR_RUNTIME_CAPTURE: ${{ runner.temp }}/native-original-input-model-sfc-ssr-runtime
      run: |
        model_l3_status=0
        cargo test --locked --profile ci -p vize_l3 --test native_model_ssr -- --nocapture || model_l3_status=$?
        model_rust_status=0
        cargo test --locked --profile ci -p vize_atelier_sfc native_ssr_setup::tests::original_input_model::seven_whole_original_input_model_ssr_components_and_raw_maps_are_captured -- --exact --nocapture || model_rust_status=$?
        model_development_status=0
        NODE_ENV=development vp node --test tests/tooling/native-original-input-model-sfc-ssr-reference.test.ts || model_development_status=$?
        model_production_status=0
        NODE_ENV=production vp node --test tests/tooling/native-original-input-model-sfc-ssr-reference.test.ts || model_production_status=$?
        printf '{"l3":%s,"rust":%s,"development":%s,"production":%s}\n' "$model_l3_status" "$model_rust_status" "$model_development_status" "$model_production_status" > "${VIZE_NATIVE_ORIGINAL_INPUT_MODEL_SFC_SSR_CAPTURE}.statuses.json"
        test "$model_l3_status" -eq 0
        test "$model_rust_status" -eq 0
        test "$model_development_status" -eq 0
        test "$model_production_status" -eq 0
        test -s "$VIZE_NATIVE_ORIGINAL_INPUT_MODEL_SFC_SSR_CAPTURE"
        test -s "${VIZE_NATIVE_ORIGINAL_INPUT_MODEL_SFC_SSR_PRIMARY_CAPTURE}.development.json"
        test -s "${VIZE_NATIVE_ORIGINAL_INPUT_MODEL_SFC_SSR_PRIMARY_CAPTURE}.production.json"
        test -s "${VIZE_NATIVE_ORIGINAL_INPUT_MODEL_SFC_SSR_RUNTIME_CAPTURE}.development.json"
        test -s "${VIZE_NATIVE_ORIGINAL_INPUT_MODEL_SFC_SSR_RUNTIME_CAPTURE}.production.json"
    - name: Preserve fresh SSR modules and actual runtime outcomes
      if: ${{ always() && steps.native-ssr.outcome != 'skipped' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: native-ssr-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        path: |
          ${{ runner.temp }}/native-ssr-modules.json
          ${{ runner.temp }}/jsx-value-sensitive-modules.json
          ${{ runner.temp }}/jsx-value-sensitive-runtime.json
          ${{ runner.temp }}/jsx-runtime-slots-ssr.json
          ${{ runner.temp }}/jsx-runtime-slots-ssr.json.runtime.json
          ${{ runner.temp }}/jsx-vapor-runtime-slots-ssr.json
          ${{ runner.temp }}/jsx-vapor-runtime-slots-ssr.json.runtime.json
          ${{ runner.temp }}/native-ssr-modules.json.refusals.json
          ${{ runner.temp }}/native-ssr-runtime.json
          ${{ runner.temp }}/native-ssr-runtime.json.static-class.development.json
          ${{ runner.temp }}/native-ssr-runtime.json.static-class.production.json
          ${{ runner.temp }}/native-selected-ssr-modules.json
          ${{ runner.temp }}/native-selected-ssr-runtime.json
          ${{ runner.temp }}/native-sfc-ssr-modules.json
          ${{ runner.temp }}/native-sfc-ssr-modules.json.positive.json
          ${{ runner.temp }}/native-sfc-ssr-runtime.json
          ${{ runner.temp }}/native-setup-ssr-modules.json
          ${{ runner.temp }}/native-setup-ssr-modules.json.positive.json
          ${{ runner.temp }}/native-setup-ssr-runtime.json
          ${{ runner.temp }}/native-setup-ssr-modules.json.direct-child.json
          ${{ runner.temp }}/native-setup-ssr-runtime.json.direct-child.json
          ${{ runner.temp }}/native-original-input-model-sfc-ssr-capture.json
          ${{ runner.temp }}/native-original-input-model-sfc-ssr-capture.json.statuses.json
          ${{ runner.temp }}/native-original-input-model-sfc-ssr-primary.*.json
          ${{ runner.temp }}/native-original-input-model-sfc-ssr-runtime.*.json
        if-no-files-found: error
        retention-days: 14
