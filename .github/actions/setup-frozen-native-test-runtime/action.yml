name: Pin the historical native test provider
description: Validate the private immutable compiler image before explicitly selecting it for old fixtures.
inputs:
  partition:
    description: Existing fixture lane or cohort, used only to separate retained receipts.
    required: true
runs:
  using: composite
  steps:
    - name: Verify and pin the historical TypeScript 7.0.2 fixture image
      shell: bash
      run: node tools/support/compat/github/frozen-native-test-runtime.ts "$RUNNER_TEMP/frozen-native-test-runtime.json"
    - name: Preserve the explicit historical test provider identity
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: frozen-native-test-runtime-${{ github.job }}-${{ inputs.partition }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/frozen-native-test-runtime.json
        if-no-files-found: error
        retention-days: 7
