name: Collect job test cases
description: Merge a persistent job capture and upload its structured case packet.
inputs:
  artifact:
    description: Artifact name for this run attempt
    required: true
runs:
  using: composite
  steps:
    - name: Merge job test cases
      shell: bash
      run: node tools/support/compat/github/job-test-cases.ts finalize
    - name: Upload job test cases
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact }}
        path: ${{ env.VIZE_TEST_CASES }}
        if-no-files-found: error
        retention-days: 7
