name: Capture complete original Vue2 SFC documents
description: Join fresh native whole-source output and frames to independent pinned primary references
inputs:
  comparison-base:
    required: true
    description: Literal source base from the enclosing source tooling plan
runs:
  using: composite
  steps:
    - name: Select the original whole Vue2 SFC source slice
      id: select
      shell: bash
      env:
        BASE_SHA: ${{ inputs.comparison-base }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
          echo 'selected=true' >> "$GITHUB_OUTPUT"
        else
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/vue2-whole-sfc-paths.txt"
          if rg '^(Cargo\.(toml|lock)$|davinci/vize_l[01]/(src/|Cargo\.toml$)|vendor/oxc[^/]*/|crates/vize_glyph/(Cargo\.toml$|src/(native_doc(\.rs|/)|lib\.rs$)|tests/(native_vue2_scriptless_sfc|native_vue2_sfc_diagnostics_drop|fixtures/native-vue2-scriptless-sfc-2\.7\.16\.json))|tests/_fixtures/reference/vue2/|tests/tooling/(native-vue2-scriptless-sfc-oracle\.test\.ts|support/vue2-whole-sfc-(oracle|observations)\.ts|support/vue2-pinned)|\.github/actions/(test-native-vue2-scriptless-sfc|test-native-historical-sfc-documents)/|\.github/workflows/pr-source-checks\.yml)' "$RUNNER_TEMP/vue2-whole-sfc-paths.txt"; then
            echo 'selected=true' >> "$GITHUB_OUTPUT"
          else
            echo 'selected=false' >> "$GITHUB_OUTPUT"
          fi
        fi
    - name: Capture every complete original SFC Doc before judging the primary join
      if: ${{ steps.select.outputs.selected == 'true' }}
      shell: bash
      env:
        VIZE_GLYPH_VUE2_SFC_CAPTURE: ${{ runner.temp }}/native-vue2-scriptless-sfc.json
        VIZE_GLYPH_VUE2_SFC_RUNTIME_CAPTURE: ${{ runner.temp }}/native-vue2-scriptless-sfc-runtime.json
        VIZE_GLYPH_VUE2_SFC_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        rust_log="$RUNNER_TEMP/native-vue2-scriptless-sfc-rust.log"
        oracle_log="$RUNNER_TEMP/native-vue2-scriptless-sfc-oracle.log"
        status_path="$RUNNER_TEMP/native-vue2-scriptless-sfc-status.json"
        rm -f "$VIZE_GLYPH_VUE2_SFC_CAPTURE" "$rust_log" "$oracle_log" "$status_path" "$VIZE_GLYPH_VUE2_SFC_RUNTIME_CAPTURE"
        set +e
        cargo test --locked --profile ci -p vize_glyph --test native_vue2_scriptless_sfc capture::whole_original_sfc_attempts_are_captured_before_complete_goldens_and_fixed_points -- --exact > "$rust_log" 2>&1
        rust_status=$?
        cat "$rust_log"
        capture_present=false
        oracle_executed=false
        oracle_status=1
        if [[ -s "$VIZE_GLYPH_VUE2_SFC_CAPTURE" ]]; then
          capture_present=true
          oracle_executed=true
          vp node --test tests/tooling/native-vue2-scriptless-sfc-oracle.test.ts > "$oracle_log" 2>&1
          oracle_status=$?
        else
          printf '%s\n' 'Native capture absent; primary join was not executed.' > "$oracle_log"
        fi
        cat "$oracle_log"
        runtime_present=false
        if [[ -s "$VIZE_GLYPH_VUE2_SFC_RUNTIME_CAPTURE" ]]; then runtime_present=true; fi
        RUST_STATUS="$rust_status" ORACLE_STATUS="$oracle_status" CAPTURE_PRESENT="$capture_present" ORACLE_EXECUTED="$oracle_executed" RUNTIME_PRESENT="$runtime_present" STATUS_PATH="$status_path" vp node --input-type=module -e '
          import { writeFileSync } from "node:fs";
          const e = process.env;
          writeFileSync(e.STATUS_PATH, JSON.stringify({
            schema: "vize.native-vue2-scriptless-sfc-validation", version: 1,
            sourceHead: e.VIZE_GLYPH_VUE2_SFC_SOURCE_HEAD,
            executionCommit: e.GITHUB_SHA, workflowRun: e.GITHUB_RUN_ID,
            rustExitStatus: Number(e.RUST_STATUS), oracleExitStatus: e.ORACLE_EXECUTED === "true" ? Number(e.ORACLE_STATUS) : null,
            capturePresent: e.CAPTURE_PRESENT === "true", oracleExecuted: e.ORACLE_EXECUTED === "true",
            runtimeObservationPresent: e.RUNTIME_PRESENT === "true"
          }) + "\n");'
        receipt_status=$?
        [[ "$rust_status" == 0 && "$oracle_status" == 0 && "$capture_present" == true && "$runtime_present" == true && "$receipt_status" == 0 ]]
    - name: Retain the actual whole Vue2 SFC output and source frames
      if: ${{ always() && steps.select.outputs.selected == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: native-vue2-scriptless-sfc-${{ github.run_id }}-${{ github.sha }}
        path: |
          ${{ runner.temp }}/native-vue2-scriptless-sfc.json
          ${{ runner.temp }}/native-vue2-scriptless-sfc-rust.log
          ${{ runner.temp }}/native-vue2-scriptless-sfc-oracle.log
          ${{ runner.temp }}/native-vue2-scriptless-sfc-status.json
          ${{ runner.temp }}/native-vue2-scriptless-sfc-runtime.json
        if-no-files-found: error
        retention-days: 14
