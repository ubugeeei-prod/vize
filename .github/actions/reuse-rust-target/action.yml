name: Restore Rust source mtimes
description: Give unchanged sources the mtimes recorded beside a warm Rust target directory

inputs:
  target-path:
    description: Absolute Rust target directory that holds the manifest
    required: true
  secondary-target-path:
    description: Optional second target directory mounted in the same job
    required: false
    default: ""
  record:
    description: Whether this trusted run records the manifest for later runs
    required: true

runs:
  using: node24
  main: main.ts
  post: post.ts
  post-if: always()
