name: Capture an explicitly selected owned Node test worker
description: Preserve one fresh-source original JS runner and private-process diagnostic custody.
inputs:
  source-sha:
    description: Full fresh source SHA; historical failed source reruns are refused
    default: ""
  controls-only:
    description: Exercise authored Linux fixtures without invoking the original JS runner
    default: "false"
runs:
  using: composite
  steps:
    - name: Preserve reviewed diagnostic helpers and both source identities
      id: custody
      shell: bash
      env:
        VIZE_OWNED_WORKER_SOURCE: ${{ inputs.source-sha || github.sha }}
      run: python3 tools/support/compat/github/owned_worker_capture.py stage "$VIZE_OWNED_WORKER_SOURCE"
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with: { ref: "${{ steps.custody.outputs.source-sha }}", persist-credentials: false }
    - name: Authenticate the fresh physical source and orchestration
      shell: bash
      env:
        VIZE_OWNED_WORKER_DIRECTORY: ${{ steps.custody.outputs.directory }}
      run: python3 "$VIZE_OWNED_WORKER_DIRECTORY/owned_worker_capture.py" authenticate
    - uses: ./.github/actions/setup-js-package-tests
    - name: Qualify the actual debugger lifecycle against authored controls
      if: ${{ inputs.controls-only == 'true' }}
      shell: bash
      env:
        VIZE_OWNED_WORKER_DIRECTORY: ${{ steps.custody.outputs.directory }}
        VIZE_OWNED_WORKER_CAPTURE: "true"
      run: python3 "$VIZE_OWNED_WORKER_DIRECTORY/owned_worker_capture.py" controls
    - name: Observe the original full JS runner once
      if: ${{ inputs.controls-only != 'true' }}
      shell: bash
      env:
        VIZE_OWNED_WORKER_DIRECTORY: ${{ steps.custody.outputs.directory }}
        VIZE_OWNED_WORKER_CAPTURE: "true"
      run: python3 "$VIZE_OWNED_WORKER_DIRECTORY/owned_worker_capture.py" -- vp run --workspace-root test:js
    - name: Preserve bounded public worker diagnostics and original build receipts
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: owned-worker-fault-${{ github.sha }}-${{ github.run_attempt }}-${{ github.job }}
        path: |
          ${{ steps.custody.outputs.directory }}/public/*.json
          npm/native/.artifacts/native/formatter-history/*.json
        if-no-files-found: error
        retention-days: 14
