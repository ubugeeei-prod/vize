name: Report full JS qualification
description: Install the pinned Node runtime and require every full qualification dependency to succeed.
inputs:
  needs-json:
    description: Complete full qualification job results.
    required: true
runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
      with: { node-version-file: "package.json", cache: false, run-install: false }
    - name: Require every full JS qualification job to succeed
      shell: bash
      env: { NEEDS_JSON: "${{ inputs.needs-json }}" }
      run: node tools/support/compat/github/require-needs-success.ts
