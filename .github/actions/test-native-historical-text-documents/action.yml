name: Capture original historical Vue text documents
description: Preserve the existing Vue2 proof and separately qualify original Vue1 documents
inputs:
  comparison-base:
    required: true
    description: Literal source comparison base from the enclosing tooling plan
runs:
  using: composite
  steps:
    - name: Join original Vue2 interpolation documents
      uses: ./.github/actions/test-native-vue2-text-document
      with:
        comparison-base: ${{ inputs.comparison-base }}
    - name: Join original Vue1 checked interpolation documents
      uses: ./.github/actions/test-native-vue1-text-document
      with:
        comparison-base: ${{ inputs.comparison-base }}
