name: Editor real-server end-to-end
description: Run VS Code, Zed, Neovim, Vim, and Helix real-server scenarios plus packaged specs

runs:
  using: composite
  steps:
    - name: Setup Vite+ and Node.js
      uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
      with:
        node-version-file: "package.json"
        cache: true
        run-install: false

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        targets: wasm32-wasip2

    - name: Setup Wild linker
      uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
      with:
        wild-version: "0.9.0"

    - uses: ./.github/actions/setup-rust-sticky-cache
      with:
        key: editor-host-smoke
        cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}

    - uses: ./.github/actions/setup-rust-script

    - name: Hydrate pinned create-vue fixture
      shell: bash
      run: |
        git submodule update --init --force --depth 1 -- tests/_fixtures/_git/create-vue
        test "$(git rev-parse HEAD:tests/_fixtures/_git/create-vue)" = \
          "$(git -C tests/_fixtures/_git/create-vue rev-parse HEAD)"

    - name: Install JS dependencies
      shell: bash
      env:
        NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
      run: vp install --frozen-lockfile --prefer-offline

    - name: Install pinned Zed extension CLI
      shell: bash
      env:
        ZED_EXTENSION_CLI_SHA: 9ee3c503a4bbbc6b4a0f8a789acca4871d773223
        ZED_EXTENSION_CLI_SHA256: a6fca5ef11ff23f0ef8b03bd2453270591c9fc6c03700c3c92017e5082ada757
      run: |
        set -euo pipefail
        curl -fsSL -o "${RUNNER_TEMP}/zed-extension" \
          "https://zed-extension-cli.nyc3.digitaloceanspaces.com/${ZED_EXTENSION_CLI_SHA}/x86_64-unknown-linux-gnu/zed-extension"
        echo "${ZED_EXTENSION_CLI_SHA256}  ${RUNNER_TEMP}/zed-extension" | sha256sum --check --strict
        chmod +x "${RUNNER_TEMP}/zed-extension"

    - name: Validate the Zed extension
      shell: bash
      working-directory: editors/zed
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/zed-extension-scratch"
        mkdir -p "${RUNNER_TEMP}/zed-extension-output"
        "${RUNNER_TEMP}/zed-extension" \
          --source-dir . \
          --scratch-dir "${RUNNER_TEMP}/zed-extension-scratch" \
          --output-dir "${RUNNER_TEMP}/zed-extension-output"

    - name: Install pinned Helix
      shell: bash
      env:
        HELIX_VERSION: 25.07.1
        HELIX_SHA256: 3f08e63ecd388fff657ad39722f88bb03dcf326f1f2da2700d99e1dc40ab2e8b
      run: |
        set -euo pipefail
        archive="${RUNNER_TEMP}/helix-${HELIX_VERSION}-x86_64-linux.tar.xz"
        curl -fsSL -o "${archive}" \
          "https://github.com/helix-editor/helix/releases/download/${HELIX_VERSION}/helix-${HELIX_VERSION}-x86_64-linux.tar.xz"
        echo "${HELIX_SHA256}  ${archive}" | sha256sum --check --strict
        mkdir -p "${RUNNER_TEMP}/helix"
        tar -xJf "${archive}" -C "${RUNNER_TEMP}/helix" --strip-components=1
        "${RUNNER_TEMP}/helix/hx" --version

    - name: Build vize CLI
      shell: bash
      run: cargo build --profile ci -p vize

    - name: Check the Helix package with the official CLI
      shell: bash
      env:
        XDG_CONFIG_HOME: ${{ runner.temp }}/helix-config
        HELIX_RUNTIME: ${{ runner.temp }}/helix/runtime
        VIZE_SERVER_PATH: ${{ github.workspace }}/target/ci/vize
      run: |
        set -euo pipefail
        mkdir -p "${XDG_CONFIG_HOME}/helix"
        cp editors/helix/languages.toml "${XDG_CONFIG_HOME}/helix/languages.toml"
        rust-script tools/commands/editors/helix/assert-helix-health.rs "${RUNNER_TEMP}/helix/hx"

    - name: Stabilize Ubuntu package archive
      uses: ./.github/actions/setup-ubuntu-archive

    - name: Ensure xvfb is available
      shell: bash
      run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

    - name: Install Neovim
      shell: bash
      env:
        NVIM_SHA256: a74740047e73b2b380d63a474282814063d10650cd6cc95efa16d1713c7e616c
        NVIM_VERSION: v0.11.4
      run: |
        set -euo pipefail
        curl -fsSL -o /tmp/nvim.tar.gz \
          "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
        echo "${NVIM_SHA256}  /tmp/nvim.tar.gz" | sha256sum --check --strict
        sudo tar -C /opt -xzf /tmp/nvim.tar.gz
        sudo ln -sf /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
        nvim --version | head -1

    - name: Ensure Vim is available
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v vim || ! vim --version | grep -F '+timers' >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y vim-nox
        fi
        vim --version | sed -n '1,2p'
        vim --version | grep -F '+timers' >/dev/null

    - name: Install pinned vim-lsp
      shell: bash
      env:
        VIM_LSP_COMMIT: 474c656659b5fb51eec6770309e0211c8aa49b5b
      run: |
        set -euo pipefail
        git init "${RUNNER_TEMP}/vim-lsp"
        git -C "${RUNNER_TEMP}/vim-lsp" remote add origin https://github.com/prabirshrestha/vim-lsp.git
        git -C "${RUNNER_TEMP}/vim-lsp" fetch --depth 1 origin "${VIM_LSP_COMMIT}"
        git -C "${RUNNER_TEMP}/vim-lsp" checkout --detach FETCH_HEAD
        cd "${RUNNER_TEMP}/vim-lsp"
        test "$(git rev-parse HEAD)" = "${VIM_LSP_COMMIT}"

    - name: Ensure Emacs is available
      shell: bash
      run: command -v emacs || (sudo apt-get update && sudo apt-get install -y emacs-nox)

    - name: Run VS Code host smoke against the real server
      shell: bash
      env:
        NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
        VIZE_SERVER_PATH: ${{ github.workspace }}/target/ci/vize
        VIZE_TEST_VSCODE_VERSION: "1.107.1"
      run: xvfb-run -a vp run --workspace-root test:vscode-extension:host-real

    - name: Run the packaged Neovim unit spec
      shell: bash
      env:
        NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
      run: vp run --workspace-root test:nvim-extension:headless

    - name: Run the packaged Vim unit spec
      shell: bash
      env:
        NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
      run: vp run --workspace-root test:vim-extension:headless

    - name: Run the packaged Emacs ERT suite
      shell: bash
      env:
        NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
      run: vp run --workspace-root test:emacs-extension:headless

    - name: Run the Neovim scenario against the real server
      shell: bash
      env:
        NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
        VIZE_SERVER_PATH: ${{ github.workspace }}/target/ci/vize
      run: vp run --workspace-root test:nvim-extension:real-server

    - name: Run the Vim scenario against the real server
      shell: bash
      env:
        NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
        VIZE_SERVER_PATH: ${{ github.workspace }}/target/ci/vize
        VIZE_TEST_VIM_LSP_PATH: ${{ runner.temp }}/vim-lsp
      run: vp run --workspace-root test:vim-extension:real-server

    - name: Run the Zed scenario against the real server
      shell: bash
      env:
        NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
        VIZE_SERVER_PATH: ${{ github.workspace }}/target/ci/vize
      run: vp run --workspace-root test:zed-extension:real-server

    - name: Run the Helix scenario against the real server
      shell: bash
      env:
        NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
        VIZE_SERVER_PATH: ${{ github.workspace }}/target/ci/vize
      run: vp run --workspace-root test:helix-extension:real-server
