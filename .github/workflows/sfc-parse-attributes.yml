name: Native parsed SFC attributes
on:
  pull_request:
    paths:
      - ".github/workflows/sfc-parse-attributes.yml"
      - "crates/vize_vitrine/src/napi/sfc/parse.rs"
      - "crates/vize_vitrine/src/napi/sfc/parse/**"
      - "crates/vize_vitrine/src/napi/sfc/types.rs"
      - "npm/native/index.d.ts"
      - "tests/native/sfc-parse-attributes-*.mjs"
      - "tests/fixtures/sfc/parsed-attributes/**"
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: sfc-parse-attributes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  VIZE_SFC_ATTRS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CARGO_TERM_COLOR: never
jobs:
  source:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: { role: [base, head] }
    env:
      VIZE_SFC_ATTRS_SOURCE_SHA: ${{ matrix.role == 'base' && '49a98d1e72707083354b8ff11e1cec800ded28b3' || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ env.VIZE_SFC_ATTRS_HEAD_SHA }}", persist-credentials: false }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: matrix.role == 'base'
        with:
          ref: 49a98d1e72707083354b8ff11e1cec800ded28b3
          path: .attrs-base
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: package.json, cache: true, run-install: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: sfc-parse-attributes
          cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}"
      - name: Build the canonical source image
        env:
          SOURCE_ROLE: ${{ matrix.role }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE"
          if [ "$SOURCE_ROLE" = base ]; then source_dir="$GITHUB_WORKSPACE/.attrs-base"; fi
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$VIZE_SFC_ATTRS_SOURCE_SHA"
          cd "$source_dir"
          if [ "$SOURCE_ROLE" = head ]; then
            vp install --frozen-lockfile --prefer-offline
          else
            vp install --filter './npm/native...' --frozen-lockfile --prefer-offline
          fi
          vp run --filter @vizejs/native build:ci
      - name: Seal each source role and capture complete API packets before comparisons
        env: { SOURCE_ROLE: "${{ matrix.role }}" }
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE"
          if [ "$SOURCE_ROLE" = base ]; then source_dir="$GITHUB_WORKSPACE/.attrs-base"; fi
          node tests/native/sfc-parse-attributes-capture.mjs "$source_dir" "$SOURCE_ROLE" "$GITHUB_WORKSPACE/artifacts/$SOURCE_ROLE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: sfc-parse-attributes-${{ env.VIZE_SFC_ATTRS_HEAD_SHA }}-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/${{ matrix.role }}/
          if-no-files-found: error
          retention-days: 14
  compare:
    needs: source
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ env.VIZE_SFC_ATTRS_HEAD_SHA }}", persist-credentials: false }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: package.json, cache: false, run-install: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          {
            name: "sfc-parse-attributes-${{ env.VIZE_SFC_ATTRS_HEAD_SHA }}-base-${{ github.run_id }}-${{ github.run_attempt }}",
            path: artifacts/base,
          }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          {
            name: "sfc-parse-attributes-${{ env.VIZE_SFC_ATTRS_HEAD_SHA }}-head-${{ github.run_id }}-${{ github.run_attempt }}",
            path: artifacts/head,
          }
      - run: node tests/native/sfc-parse-attributes-compare.mjs artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: sfc-parse-attributes-qualified-${{ env.VIZE_SFC_ATTRS_HEAD_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
