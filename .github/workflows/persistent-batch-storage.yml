name: Persistent batch storage
on:
  pull_request:
    paths:
      - .github/workflows/persistent-batch-storage.yml
      - crates/vize/src/commands/check/runner.rs
      - crates/vize/src/commands/check/runner/execution.rs
      - crates/vize_canon/src/batch/type_checker/installed_sources*
      - crates/vize_canon/src/batch/type_checker/installed_sources/**
      - crates/vize_canon/src/batch/virtual_project/persistent_namespace*
      - crates/vize_canon/src/batch/virtual_project/persistent_namespace/**
      - crates/vize_canon/src/batch/materialize_fs*
      - crates/vize_canon/src/batch/materialize_fs/**
      - crates/vize/tests/check_package_external_import_cli.rs
      - crates/vize/tests/check_outside_import_types_cli.rs
      - tests/_fixtures/differential/typechecker/relative-sibling-storage-10934/**
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: persistent-batch-storage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-storage:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CARGO_BUILD_JOBS: "24"
      RUST_TEST_THREADS: "4"
      VIZE_TEST_REQUIRE_TSGO: "1"
      VIZE_TYPECHECK_REGRESSION_CAPTURE: ${{ github.workspace }}/target/persistent-storage-evidence/native
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: nextest-ci
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/cache-vp-bootstrap
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          version: latest
          node-version-file: package.json
          cache: true
          cache-save: false
          run-install: true
      - uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1
        with: { tool: cargo-nextest@0.9.146 }
      - name: Pin source and toolchain identity
        run: |
          mkdir -p target/persistent-storage-evidence
          git rev-parse HEAD > target/persistent-storage-evidence/source.sha
          rustc --version --verbose > target/persistent-storage-evidence/rustc.txt
          cp Cargo.lock target/persistent-storage-evidence/
      - name: Require native visibility and three-process storage acceptance
        run: |
          cargo nextest run -p vize --test integration --cargo-profile ci --profile full -E 'test(relative_sibling_sfc_keeps_package_storage_and_exact_repeated_diagnostics) | test(type_config_anchor_does_not_expose_app_modules_to_sibling_sources) | test(expanded_program_cache_redirect_stays_outside_authored_workspace)' --no-tests=fail
          cp target/nextest/full/junit.xml target/persistent-storage-evidence/cli.junit.xml
          sha256sum target/ci/vize > target/persistent-storage-evidence/cli.sha256
          tar -czf target/persistent-storage-evidence/source-cli-linux-x64.tgz -C target/ci vize
      - name: Require exact batch packets and linked-target ownership invariants
        run: |
          cargo nextest run -p vize_canon --lib --test fix_history_diagnostics --cargo-profile ci --profile full -E 'test(relative_sibling_imports_preserve_complete_package_diagnostics) | test(persistent_namespace) | test(installed_sources) | test(replacing_a_hardlinked_cache_leaf)' --no-tests=fail
          cp target/nextest/full/junit.xml target/persistent-storage-evidence/canon.junit.xml
      - name: Preserve exact native evidence paths in one portable archive
        if: always()
        run: tar -czf target/persistent-storage-evidence.tgz -C target persistent-storage-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: persistent-batch-storage-${{ github.sha }}
          path: target/persistent-storage-evidence.tgz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
