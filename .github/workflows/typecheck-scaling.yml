name: Type-check scaling
run-name: "Type-check scaling ${{ inputs.base_sha && format('{0} -> {1}', inputs.base_sha, inputs.sha) || inputs.sha }} (${{ inputs.sizes }}; tools ${{ inputs.tools || 'default' }}; giant ${{ inputs.giant_blocks }}; monorepo ${{ inputs.monorepo_sfcs }}; nuxt ${{ inputs.nuxt_sizes }})"
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-hex commit to build and measure (paired head when base_sha is set)
        type: string
        required: true
      base_sha:
        description: Optional full base commit; enables one-runner alternating paired qualification
        type: string
        default: ""
      sizes:
        description: Comma-separated SFC counts of the single generated projects
        type: string
        default: "1000,5000,20000"
      runs:
        description: Fresh timed runs per tool and size (median and deviation; first cold run is extra)
        type: string
        default: "3"
      tools:
        description: Comma-separated tool IDs; blank keeps the standard comparison surface
        type: string
        default: ""
      monorepo_sfcs:
        description: SFCs of the project-references monorepo (0 skips it)
        type: string
        default: "5000"
      giant_blocks:
        description: Template blocks in one oversized SFC (0 skips it)
        type: string
        default: "10000"
      nuxt_sizes:
        description: Comma-separated SFC counts of generated Nuxt apps (empty skips them)
        type: string
        default: ""
  # Registers the dispatch-only workflow from its PR; the job runs only on dispatch.
  pull_request:
    paths:
      - .github/workflows/typecheck-scaling.yml
      - .github/scripts/workflows/typecheck-scaling/**
      - tools/benchmarks/scripts/typecheck-scaling*.ts
      - tests/tooling/typecheck-scaling*.test.ts
permissions: { contents: read }
concurrency:
  group: typecheck-scaling-${{ github.event.pull_request.number || inputs.sha }}-${{ inputs.base_sha || 'single' }}-${{ inputs.sizes }}-${{ inputs.tools || 'default' }}-${{ inputs.giant_blocks }}-${{ inputs.monorepo_sfcs }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  measure:
    if: github.event_name == 'workflow_dispatch' && inputs.base_sha == ''
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 330
    env:
      SHA: ${{ inputs.sha }}
      SIZES: ${{ inputs.sizes }}
      RUNS: ${{ inputs.runs }}
      SCALING_TOOLS: ${{ inputs.tools }}
      MONOREPO_SFCS: ${{ inputs.monorepo_sfcs }}
      GIANT_BLOCKS: ${{ inputs.giant_blocks }}
      NUXT_SIZES: ${{ inputs.nuxt_sizes }}
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /tools/ci/lib/scripts/
            /.github/scripts/workflows/typecheck-scaling/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - name: Validate inputs
        run: . "${{ env.VIZE_CI_FILES }}/validate-inputs.sh"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.100.0" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-script
      - name: Check out the measured commit beside the driver
        run: . "${{ env.VIZE_CI_FILES }}/check-out-the-measured-commit-beside-the-driver.sh"
      - name: Install the locked hosts, the Nuxt app and GNU time
        run: . "${{ env.VIZE_CI_FILES }}/install-the-locked-hosts-the-nuxt-app-and-gnu-time.sh"
      - name: Test the generator, gate and report
        run: node --test tests/tooling/scale-project-generator.test.ts tests/tooling/typecheck-scaling.test.ts
      - name: Build the native binding and the vize package
        working-directory: ${{ runner.temp }}/scaling-target
        run: . "${{ env.VIZE_CI_FILES }}/build-the-native-binding-and-the-vize-package.sh"
      - name: Measure
        env:
          VIZE_SCALING_RUNNER_LABEL: blacksmith-32vcpu-ubuntu-2404
        run: . "${{ env.VIZE_CI_FILES }}/measure.sh"
      - name: Write job summary
        if: always()
        run: . "${{ env.VIZE_CI_FILES }}/write-job-summary.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: typecheck-scaling-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/scaling-out/
            ${{ runner.temp }}/build-native.log
          if-no-files-found: warn
          retention-days: 30
  paired:
    if: github.event_name == 'workflow_dispatch' && inputs.base_sha != ''
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 180
    env:
      BASE_SHA: ${{ inputs.base_sha }}
      HEAD_SHA: ${{ inputs.sha }}
      DRIVER_SHA: ${{ github.workflow_sha }}
      SIZES: ${{ inputs.sizes }}
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "8"
      GOMAXPROCS: "8"
      # Both checkouts build on one compiler, even across a toolchain bump.
      RUSTUP_TOOLCHAIN: "1.100.0"
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /tools/ci/lib/scripts/
            /.github/scripts/workflows/typecheck-scaling/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - name: Validate paired inputs
        run: . "${{ env.VIZE_CI_FILES }}/validate-paired-inputs.sh"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: driver
          ref: ${{ env.DRIVER_SHA }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: base
          ref: ${{ env.BASE_SHA }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: head
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - name: Record exact source pair
        run: . "${{ env.VIZE_CI_FILES }}/record-exact-source-pair.sh"
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.100.0" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: driver/package.json
          run-install: false
      - name: Install the pinned measurement provider
        working-directory: driver
        run: vp install --frozen-lockfile --prefer-offline
      - name: Test paired order, diagnostic identity and nonlinear controls
        working-directory: driver
        run: node --test tests/tooling/typecheck-scaling.test.ts tools/benchmarks/scripts/pr-performance-build.test.ts
      - name: Build source binaries in independent fresh targets
        run: . "${{ env.VIZE_CI_FILES }}/build-source-binaries-in-independent-fresh-targets.sh"
      - name: Measure five alternating paired cycles on one runner
        run: . "${{ env.VIZE_CI_FILES }}/measure-five-alternating-paired-cycles-on-one-runner.sh"
      - name: Write paired summary
        if: always()
        run: . "${{ env.VIZE_CI_FILES }}/write-paired-summary.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: typecheck-scaling-paired-${{ github.run_id }}
          path: |
            paired-scaling/build/*.json
            paired-scaling/measurements/
          if-no-files-found: warn
          retention-days: 90
