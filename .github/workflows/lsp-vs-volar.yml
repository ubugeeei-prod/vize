name: LSP vs Vue language tools

# `vize lsp` against @vue/language-server + tsserver with @vue/typescript-plugin
# (what VS Code runs for "Vue (Official)"), driven over stdio by one scripted
# editing session on pinned real projects. Reports cold start, process-tree
# CPU and PSS/RSS, CPU per edit and p50/p99 latency of correct answers.
# Report only: it gates nothing. Pinned to `cpus` cores so the numbers resemble
# a developer laptop; `compare_ref` adds a second vize row for before/after.
# The tsserver row is Vize's backend for TypeScript 5.7-6.x: the project's
# tsserver with this commit's @vizejs/typescript-vue-plugin, the like-for-like
# counterpart of the Volar row.

on:
  workflow_dispatch:
    inputs:
      fixtures:
        description: Space-separated fixture ids (misskey, n8n)
        required: true
        default: "misskey n8n"
      compare_ref:
        description: Optional branch or SHA built as a second vize row (the "before" of a perf change)
        required: false
        default: ""
      rounds:
        description: Recorded sessions per editor
        required: true
        default: "3"
      cycles:
        description: Edit/request cycles per session
        required: true
        default: "5"
      cpus:
        description: Cores the benchmark may use
        required: true
        default: "8"
      tsgo_mapper:
        description: Optional TypeScript native version (e.g. 7.1.0-beta) for a third row, its own LSP checking .vue through the Vize content mapper
        required: false
        default: ""
      mapper_vize:
        description: npm spec of the vize package whose content mapper the tsgo row loads
        required: false
        default: "latest"
      tsserver_plugin:
        description: Add the project-TypeScript row, tsserver with this commit's @vizejs/typescript-vue-plugin
        type: boolean
        default: true
      vize_env:
        description: Optional space-separated KEY=VALUE pairs for every vize row (diagnosis runs, e.g. VIZE_TRACE_EDITOR_PREPARATION=1)
        required: false
        default: ""
  # Changes to the benchmark itself measure once before they merge.
  pull_request:
    paths:
      - .github/workflows/lsp-vs-volar.yml
      - tools/benchmarks/scripts/lsp-vs-volar*.ts
      - tests/tooling/lsp-vs-volar-evidence.test.ts

concurrency:
  group: lsp-vs-volar-${{ github.event.pull_request.number || github.ref }}-${{ inputs.compare_ref || '' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  COMPARE_REF: ${{ inputs.compare_ref || '' }}
  ROUNDS: ${{ inputs.rounds || '3' }}
  CYCLES: ${{ inputs.cycles || '5' }}
  CPUS: ${{ inputs.cpus || '8' }}
  VIZE_ENV: ${{ inputs.vize_env || '' }}
  TSGO_MAPPER: ${{ inputs.tsgo_mapper || '' }}
  MAPPER_VIZE: ${{ inputs.mapper_vize || 'latest' }}
  # Pull requests measure it too; only a dispatch can turn it off.
  TSSERVER_PLUGIN: ${{ github.event_name == 'pull_request' || inputs.tsserver_plugin }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fixtures: ${{ steps.plan.outputs.fixtures }}
    steps:
      - id: plan
        env:
          FIXTURES: ${{ inputs.fixtures || 'misskey n8n' }}
        run: echo "fixtures=$(printf '%s\n' $FIXTURES | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  bench:
    name: lsp-vs-volar (${{ matrix.fixture }})
    needs: plan
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        fixture: ${{ fromJSON(needs.plan.outputs.fixtures) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Install repository Rust toolchain
        run: |
          rustup toolchain install || rustup show active-toolchain
          cargo --version
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: lsp-vs-volar
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: "package.json", package-manager-cache: false }

      - name: Validate measurement evidence contracts
        run: node --test tests/tooling/lsp-vs-volar-evidence.test.ts

      - name: Build this commit
        run: |
          cargo build --profile ci-opt -p vize
          cp target/ci-opt/vize "$RUNNER_TEMP/vize-head"

      - name: Build the compare ref
        if: ${{ env.COMPARE_REF != '' }}
        run: |
          git fetch --no-tags --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$COMPARE_REF"
          git worktree add "$RUNNER_TEMP/compare" FETCH_HEAD
          (cd "$RUNNER_TEMP/compare" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --profile ci-opt -p vize)
          cp target/ci-opt/vize "$RUNNER_TEMP/vize-compare"

      - name: Install the repository's pinned Vue language tools and Corsa
        run: |
          # One source of truth: the workspace catalog pins vue-tsc (same release
          # train as @vue/language-server), TypeScript and the Corsa runtime.
          pin() { sed -n "s|^    \"\{0,1\}$1\"\{0,1\}: \"\(.*\)\"$|\1|p" pnpm-workspace.yaml | head -1; }
          vue=$(pin vue-tsc); ts=$(pin typescript); corsa=$(pin @typescript/typescript-linux-x64)
          test -n "$vue" && test -n "$ts" && test -n "$corsa"
          mkdir "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          echo '{"private":true}' > package.json
          npm install --no-audit --no-fund "@vue/language-server@$vue" "@vue/typescript-plugin@$vue" \
            "typescript@$ts" "@typescript/typescript-linux-x64@$corsa"
          node -e 'for (const name of ["@vue/language-server", "@vue/typescript-plugin", "@vue/language-core", "@volar/language-server", "typescript", "@typescript/typescript-linux-x64"]) console.log(name, require(`./node_modules/${name}/package.json`).version)' | tee versions.txt

      - name: Stage the tsserver plugin row (this commit's plugin and native addon)
        if: ${{ env.TSSERVER_PLUGIN == 'true' }}
        run: |
          # Same profile as the vize rows; published addons use `release`.
          cargo build --profile ci-opt -p vize_vitrine --features napi,legacy
          root="$RUNNER_TEMP/tsserver-plugin/node_modules"
          mkdir -p "$root/@vizejs"
          cp -R npm/native "$root/@vizejs/native"
          cp target/ci-opt/libvize_vitrine.so "$root/@vizejs/native/vize-vitrine.linux-x64-gnu.node"
          cp -R npm/typescript-plugin "$root/@vizejs/typescript-vue-plugin"
          rm -rf "$root/@vizejs/native/node_modules" "$root/@vizejs/typescript-vue-plugin/node_modules"
          # The project's TypeScript: the same tsserver the Volar row runs.
          ln -s "$RUNNER_TEMP/tools/node_modules/typescript" "$root/typescript"

      - name: Install the content-mapper row (TypeScript native LSP + published vize mapper)
        if: ${{ env.TSGO_MAPPER != '' }}
        run: |
          mkdir "$RUNNER_TEMP/mapper" && cd "$RUNNER_TEMP/mapper"
          echo '{"private":true}' > package.json
          npm install --no-audit --no-fund "@typescript/typescript-linux-x64@$TSGO_MAPPER" "vize@$MAPPER_VIZE"
          node -e 'for (const name of ["@typescript/typescript-linux-x64", "vize"]) console.log("mapper:" + name, require(`./node_modules/${name}/package.json`).version)' | tee versions.txt

      - name: Measure
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          tools="$RUNNER_TEMP/tools/node_modules"
          args=(--fixture "$FIXTURE" --vize "head=$RUNNER_TEMP/vize-head")
          if [ -n "$COMPARE_REF" ]; then
            args+=(--vize "compare=$RUNNER_TEMP/vize-compare" --meta "compare=$COMPARE_REF")
          fi
          if [ -n "$TSGO_MAPPER" ]; then
            # The mapper row reads the project's own TypeScript native host, not vize's pin.
            args+=(--tsgo-mapper "$RUNNER_TEMP/mapper/node_modules/@typescript/typescript-linux-x64/lib/tsc")
            args+=(--tsgo-mapper-version "$TSGO_MAPPER" --mapper-modules "$RUNNER_TEMP/mapper/node_modules")
            while read -r name version; do args+=(--meta "$name=$version"); done < "$RUNNER_TEMP/mapper/versions.txt"
          fi
          for assignment in $VIZE_ENV; do
            args+=(--vize-env "head:$assignment" --meta "env=$assignment")
            if [ -n "$COMPARE_REF" ]; then args+=(--vize-env "compare:$assignment"); fi
          done
          if [ "$TSSERVER_PLUGIN" = true ]; then
            args+=(--tsserver-plugin "$RUNNER_TEMP/tsserver-plugin" --tsserver-plugin-version "head")
          fi
          while read -r name version; do args+=(--meta "$name=$version"); done < "$RUNNER_TEMP/tools/versions.txt"
          taskset -c "0-$((CPUS - 1))" node tools/benchmarks/scripts/lsp-vs-volar.ts "${args[@]}" \
            --tsgo "$tools/@typescript/typescript-linux-x64/lib/tsc" --volar-root "$RUNNER_TEMP/tools" \
            --fixtures-dir "$RUNNER_TEMP/projects" --rounds "$ROUNDS" --cycles "$CYCLES" \
            --meta "head=$(git rev-parse HEAD)" --meta "cpus=$CPUS" \
            --out "lsp-vs-volar-$FIXTURE.md" --json "lsp-vs-volar-$FIXTURE.json" --logs "lsp-vs-volar-logs-$FIXTURE"
          cat "lsp-vs-volar-$FIXTURE.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lsp-vs-volar-${{ matrix.fixture }}
          path: |
            lsp-vs-volar-${{ matrix.fixture }}.md
            lsp-vs-volar-${{ matrix.fixture }}.json
            lsp-vs-volar-logs-${{ matrix.fixture }}/
          # Sessions write their JSON as they finish; a failed run keeps what it measured.
          if-no-files-found: warn
          retention-days: 30
