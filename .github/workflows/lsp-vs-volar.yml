name: LSP vs Vue language tools

# Bench-only variant: the same scripted LSP session for two vize builds inside
# WSL2, with the project on ext4 and on the Windows mount (9P).
on:
  workflow_dispatch:
    inputs:
      fixtures:
        description: Space-separated fixture ids
        required: true
        default: "scale-1k"
      compare_ref:
        description: Full SHA built as the "before" row
        required: true
      rounds:
        description: Recorded sessions per editor
        required: true
        default: "2"
      cycles:
        description: Edit/request cycles per session
        required: true
        default: "3"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      COMPARE_REF: ${{ inputs.compare_ref }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: |
          rustup toolchain install || rustup show active-toolchain
          cargo --version
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: lsp-vs-volar
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Build head and compare
        run: |
          set -euo pipefail
          [[ "$COMPARE_REF" =~ ^[0-9a-f]{40}$ ]]
          cargo build --profile ci-opt -p vize
          mkdir -p wsl-bin/head wsl-bin/compare
          cp target/ci-opt/vize wsl-bin/head/vize
          git fetch --no-tags --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$COMPARE_REF"
          git worktree add "$RUNNER_TEMP/compare" FETCH_HEAD
          (cd "$RUNNER_TEMP/compare" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --profile ci-opt -p vize)
          cp target/ci-opt/vize wsl-bin/compare/vize
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lsp-wsl2-bin
          path: wsl-bin/
          retention-days: 3

  wsl2:
    needs: build
    # WSL2 needs nested virtualization; Blacksmith Windows runners lack it.
    runs-on: windows-2025
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: "2"
          wsl-shell-user: root
          additional-packages: ca-certificates curl procps xz-utils
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lsp-wsl2-bin
          path: wsl-bin
      - name: Resolve the Windows mount
        shell: pwsh
        run: |
          $windowsPath = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $drive = $windowsPath.Substring(0, 1).ToLowerInvariant()
          $tail = $windowsPath.Substring(2).Replace('\', '/')
          $mount = "/mnt/$drive$tail"
          wsl.exe test -d $mount
          if ($LASTEXITCODE -ne 0) { throw "WSL mount is unavailable: $mount" }
          "WSL_MOUNT_ROOT=$mount/vize-lsp" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install Node 24 and the pinned TypeScript native host in WSL2
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          version=24.14.0
          curl -fsSLO "https://nodejs.org/dist/v$version/node-v$version-linux-x64.tar.xz"
          curl -fsSLO "https://nodejs.org/dist/v$version/SHASUMS256.txt"
          grep " node-v$version-linux-x64.tar.xz$" SHASUMS256.txt | sha256sum --check
          tar -xJf "node-v$version-linux-x64.tar.xz" -C /usr/local --strip-components=1
          corsa=$(tr -d "\r" < pnpm-workspace.yaml | sed -n 's|^    "\{0,1\}@typescript/typescript-linux-x64"\{0,1\}: "\(.*\)"$|\1|p' | head -1)
          test -n "$corsa"
          mkdir -p "$HOME/tools" && cd "$HOME/tools"
          echo '{"private":true}' > package.json
          npm install --no-audit --no-fund "@typescript/typescript-linux-x64@$corsa"
          node --version
          uname -a
      - name: Measure ext4 and the Windows mount
        shell: wsl-bash {0}
        env:
          FIXTURE_IDS: ${{ inputs.fixtures }}
          ROUNDS: ${{ inputs.rounds }}
          CYCLES: ${{ inputs.cycles }}
          COMPARE_REF: ${{ inputs.compare_ref }}
          HEAD_SHA: ${{ github.sha }}
          WSLENV: FIXTURE_IDS/u:ROUNDS/u:CYCLES/u:COMPARE_REF/u:HEAD_SHA/u:WSL_MOUNT_ROOT/u:GITHUB_STEP_SUMMARY/u
        run: |
          set -euo pipefail
          bin="$HOME/wsl-bin"
          mkdir -p "$bin/head" "$bin/compare" "$WSL_MOUNT_ROOT/out"
          cp wsl-bin/head/vize "$bin/head/vize" && cp wsl-bin/compare/vize "$bin/compare/vize"
          chmod +x "$bin"/*/vize
          # Editor homes and caches stay on ext4, as a WSL user's HOME does.
          export LSP_BENCH_HOME_DIR="$HOME/lsp-home"
          args=()
          for id in $FIXTURE_IDS; do args+=(--fixture "$id"); done
          summary_path=$(wslpath "$GITHUB_STEP_SUMMARY")
          for entry in "wsl2-ext4=$HOME/vize-lsp/projects" "wsl2-windows-mount=$WSL_MOUNT_ROOT/projects"; do
            label=${entry%%=*}
            mkdir -p "${entry#*=}"
            node tools/benchmarks/scripts/lsp-vs-volar.ts "${args[@]}" \
              --vize "head=$bin/head/vize" --vize "compare=$bin/compare/vize" \
              --tsgo "$HOME/tools/node_modules/@typescript/typescript-linux-x64/lib/tsc" \
              --fixtures-dir "${entry#*=}" --rounds "$ROUNDS" --cycles "$CYCLES" \
              --meta "cell=$label" --meta "head=$HEAD_SHA" --meta "compare=$COMPARE_REF" \
              --out "$WSL_MOUNT_ROOT/out/lsp-$label.md" --json "$WSL_MOUNT_ROOT/out/lsp-$label.json" \
              --logs "$WSL_MOUNT_ROOT/out/logs-$label" || echo "$label session failed: $?"
            echo "## $label" >> "$summary_path"
            cat "$WSL_MOUNT_ROOT/out/lsp-$label.md" >> "$summary_path" || true
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lsp-wsl2
          path: ${{ runner.temp }}/vize-lsp/out/
          if-no-files-found: warn
