name: Zizmor

on:
  push:
    branches: [main, davinci]
    paths:
      - ".github/**"
  pull_request: {}
  release:
    types: [published]
  schedule:
    # Weekly workflow-security audit, offset from the heavier daily gates.
    - cron: "17 2 * * 2"
  workflow_dispatch:

concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    name: Plan workflow security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      audit: ${{ steps.plan.outputs.audit }}
    steps:
      # No candidate checkout: only trusted inline code and read-only API calls.
      - name: Select workflow security audit
        id: plan
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            let audit = true;
            try {
              const pr = context.payload.pull_request;
              const maintainers = ['OWNER', 'MEMBER', 'COLLABORATOR'];
              if (context.eventName === 'pull_request' &&
                  maintainers.includes(pr?.author_association) &&
                  pr?.head?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`) {
                const args = { ...context.repo, pull_number: pr.number };
                const before = (await github.rest.pulls.get(args)).data;
                if (before.head.sha === pr.head.sha &&
                    Number.isInteger(before.changed_files) &&
                    before.changed_files > 0 && before.changed_files < 3000) {
                  const files = await github.paginate(github.rest.pulls.listFiles, {
                    ...args, per_page: 100,
                  });
                  const after = (await github.rest.pulls.get(args)).data;
                  const unchanged = after.head.sha === before.head.sha &&
                    after.changed_files === before.changed_files;
                  const complete = files.length === before.changed_files;
                  const workflowsChanged = files.some(file =>
                    [file.filename, file.previous_filename].some(name =>
                      typeof name === 'string' && name.startsWith('.github/')));
                  audit = !unchanged || !complete || workflowsChanged;
                }
              }
            } catch (error) {
              core.warning(`Unable to prove the audit is unnecessary: ${error.message}`);
            }
            core.setOutput('audit', String(audit));
            await core.summary.addRaw(`Workflow security audit required: ${audit}\n`).write();

  zizmor:
    name: Run zizmor
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || needs.plan.outputs.audit != 'false') }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          # Fork scans use console output and fail on findings.
          advanced-security: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          inputs: ".github"
          min-confidence: high
          min-severity: high
          online-audits: true
          version: "1.30.0"
