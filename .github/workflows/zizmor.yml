# DO NOT EDIT. Generated from tools/config/pkl/workflows/maintenance/zizmor.pkl.
# Edit the Pkl source and run `node tools/commands/generate/repository-config.ts`.
name: Zizmor

on:
  push:
    branches: [main, davinci]
    paths:
      - ".github/**"
  # #6830: PRs audit workflows only when they change them.
  pull_request:
    paths:
      - ".github/**"
  release:
    types: [published]
  schedule:
    # Weekly workflow-security audit, offset from the heavier daily gates.
    - cron: "17 2 * * 2"
  workflow_dispatch:

concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    name: Plan workflow security audit
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      audit: ${{ steps.plan.outputs.audit || 'true' }}
    steps:
      - name: Read the audit planner from the PR base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /.github/actions/plan-workflow-audit/
      - name: Select workflow security audit
        id: plan
        if: github.event_name == 'pull_request' && hashFiles('.github/actions/plan-workflow-audit/action.yml') != ''
        uses: ./.github/actions/plan-workflow-audit
        env:
          GH_TOKEN: ${{ github.token }}

  zizmor:
    name: Run zizmor
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || needs.plan.outputs.audit != 'false') }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          # Fork scans use console output and fail on findings.
          advanced-security: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          inputs: ".github"
          min-confidence: high
          min-severity: high
          online-audits: true
          version: "1.30.0"
