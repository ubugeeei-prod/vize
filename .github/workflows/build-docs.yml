name: Docs build
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Docs build @ {0}', github.sha) || format('Docs build {0} @ {1}', github.event_name, github.sha) }}

on:
  push:
    branches:
      - main
    # Publish authored site changes immediately. Code-only pushes use the
    # nightly build, and releases dispatch an exact-SHA build.
    paths:
      - ".github/workflows/build-docs.yml"
      - "docs/**"
      - "!docs/davinci/decisions/**"
      - "playground/**"
      - "examples/vite-musea/**"
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
  # The merge queue builds the same site and checks the reviewed routes' links
  # and anchors without the browser captures (Check / docs-build).
  workflow_call:
    inputs:
      links-only: { type: boolean, default: false }

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

# Release preflight consumes this workflow as immutable evidence for github.sha.
# Keep tag dispatch separate from a scheduled main build at the same SHA.
concurrency:
  group: docs-build-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    env:
      VIZE_DOCS_LINKS_ONLY: ${{ inputs.links-only && '1' || '0' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }

      - name: Setup Wild linker
        uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"

      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: docs-napi
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}

      - name: Setup Vite+ and Node.js
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - name: Install JS dependencies
        run: node tools/support/github/vp-install.ts --filter './docs...' --filter './npm/builder/vite...' --filter './npm/cli...' --filter './npm/native...' --filter './npm/ui...' --filter './npm/compose/core...'

      - name: Build @vizejs/vite-plugin
        run: node tools/support/github/run-many.ts vp run --filter './npm/native' build:ci -- vp run --filter './npm/cli' build -- vp run --filter './npm/builder/vite' build

      - name: Install Japanese rendering fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match --format '%{family}\n' ':lang=ja'

      - name: Build docs
        # The page manifest records this exact source SHA; do not replay an
        # earlier script result when only other source files changed.
        run: |
          vp run --no-cache --filter './docs' build
          test -s docs-render-evidence/component-previews/browser-evidence.json
          test -s docs-render-evidence/component-previews/unavailable-storage-evidence.json

      - name: Upload rendered docs screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-render-evidence
          path: docs-render-evidence
          if-no-files-found: error

      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs
          path: docs/dist
          if-no-files-found: error

  build-playground:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Setup Wild linker
        uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"

      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: docs-wasm
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
          secondary-key: docs-example
          secondary-target-path: .docs-example-target
          secondary-cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}

      # wasm-bindgen outputs only: both directories also hold tracked sources.
      - name: Cache WASM build
        id: cache-wasm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            npm/wasm/vize_vitrine*
            playground/src/wasm/vize_vitrine*
          key: ${{ runner.os }}-docs-wasm-v2-${{ hashFiles('crates/**/*.rs', 'davinci/**/*.rs', 'crates/**/Cargo.toml', 'davinci/**/Cargo.toml', 'Cargo.toml', 'Cargo.lock', 'tools/support/github/build-vitrine-wasm.ts', 'tools/support/tasks/build-vitrine-wasm.ts', 'tools/support/command-runtime.ts') }}

      - name: Install wasm-bindgen-cli
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        with:
          tool: wasm-bindgen-cli@0.2.129

      - name: Setup Vite+ and Node.js
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false

      - name: Build WASM
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        run: node tools/support/github/build-vitrine-wasm.ts npm/wasm playground/src/wasm

      - name: Install JS dependencies
        run: node tools/support/github/vp-install.ts --filter './playground...' --filter './examples/vite-musea...' --filter './npm/builder/vite-musea...' --filter './npm/builder/vite...' --filter './npm/cli...' --filter './npm/native...'

      - name: Build npm packages
        run: node tools/support/github/run-many.ts vp run --filter './npm/native' build:ci -- vp run --filter './npm/cli' build -- vp run --filter './npm/builder/vite' build -- vp run --filter './npm/builder/vite-musea' build

      - name: Build playground
        run: vp run --filter './playground' build

      - name: Build musea-examples
        run: vp run --filter './examples/vite-musea' build

      - name: Upload playground artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playground
          path: playground/dist
          if-no-files-found: error

      - name: Upload musea-examples artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: musea-examples
          path: examples/vite-musea/dist
          if-no-files-found: error
