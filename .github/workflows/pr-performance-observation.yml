name: PR performance observation (css style-lane quiet-runner bench)

# Measurements only. This workflow is deliberately independent of Check,
# merge_group, release gates, and the existing historical benchmark budgets.
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit to compare
        required: true
        type: string
      head_sha:
        description: Exact authored head commit; independent of the measurement driver
        required: true
        type: string
      runs:
        description: Interleaved runs per side
        required: false
        type: string
        default: "15"

permissions: { contents: read }
concurrency:
  group: style-lane-quiet-${{ github.run_id }}
  cancel-in-progress: true
env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
  DRIVER_SHA: ${{ github.workflow_sha }}
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "8"
  GOMAXPROCS: "8"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUSTUP_TOOLCHAIN: "1.100.0"

jobs:
  observe:
    name: Performance observations (optional)
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: driver
          ref: ${{ env.DRIVER_SHA }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: head
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: base
          ref: ${{ env.BASE_SHA }}
          persist-credentials: false
      - name: Record exact comparison sources
        env:
          EVENT_NAME: ${{ github.event_name }}
          OBSERVATION_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C base rev-parse HEAD)" == "$BASE_SHA" ]]
          [[ "$(git -C head rev-parse HEAD)" == "$HEAD_SHA" ]]
          [[ "$(git -C driver rev-parse HEAD)" == "$DRIVER_SHA" ]]
          git -C head fetch --no-tags "$GITHUB_WORKSPACE/base" "$BASE_SHA"
          mkdir -p performance-observation/build
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const git = (...args) => execFileSync('git', ['-C', 'head', ...args], { encoding: 'utf8' }).trim();
          writeFileSync('performance-observation/source-pair.json', JSON.stringify({
            schema: 1, event: process.env.EVENT_NAME, pullRequest: process.env.OBSERVATION_PR || null,
            base: process.env.BASE_SHA, head: process.env.HEAD_SHA,
            driver: process.env.DRIVER_SHA, driverTree: execFileSync('git', ['-C', 'driver', 'rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(), mergeBase: git('merge-base', process.env.BASE_SHA, process.env.HEAD_SHA),
            comparison: process.env.EVENT_NAME === 'pull_request' ? 'exact PR base and authored head, independent measurement driver' : 'explicit immutable source pair, independent measurement driver',
            changedPaths: git('diff', '--name-only', '-z', process.env.BASE_SHA, process.env.HEAD_SHA).split('\0').filter(Boolean),
          }, null, 2) + '\n');
          JS
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.100.0" }
      - uses: ./driver/.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: driver/package.json
          run-install: false
      - name: Install one pinned physical dependency provider
        working-directory: driver
        run: vp install --frozen-lockfile --prefer-offline
      - name: Build normal source binaries in independent fresh targets
        run: |
          set -euo pipefail
          for role in base head; do
            target="$RUNNER_TEMP/pr-performance-$role-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            node driver/tools/benchmarks/scripts/pr-performance-build.ts \
              --source-root "$GITHUB_WORKSPACE/$role" --target-dir "$target" \
              --binary "$target/ci-opt/vize" --role "$role" \
              --receipt "$GITHUB_WORKSPACE/performance-observation/build/$role.json"
          done
      - name: Validate identical normal build recipes
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { verifyPrPerformanceBuildPair } from './driver/tools/benchmarks/scripts/pr-performance-build.ts';
          const pair = verifyPrPerformanceBuildPair('performance-observation/build/base.json', 'performance-observation/build/head.json');
          writeFileSync('performance-observation/build/pair.json', JSON.stringify(pair, null, 2) + '\n');
          JS
      - name: Install Callgrind for exact instruction counts
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends valgrind
      - name: Prepare real-project and benchmark corpora
        working-directory: driver
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 -- tests/_fixtures/_git/misskey tests/_fixtures/_git/n8n tests/_fixtures/_git/nuxt-ui tests/_fixtures/_git/reka-ui
          root="$RUNNER_TEMP/style-lane"
          mkdir -p "$root"
          node --input-type=module -e "import('./tools/benchmarks/scripts/generate.mjs').then((m) => m.generateCorpus({ fileCount: 1000, benchDir: process.argv[1], log: () => {} }))" "$root/bench"
          for corpus in misskey n8n nuxt-ui reka-ui; do
            printf '%s: %s .vue files\n' "$corpus" "$(find "tests/_fixtures/_git/$corpus" -name '*.vue' -not -path '*/node_modules/*' | wc -l)"
          done
          echo "STYLE_LANE_ROOT=$root" >> "$GITHUB_ENV"
      - name: Interleaved base/head lint measurements
        run: |
          set -euo pipefail
          {
            echo "### css style-lane quiet-runner comparison"
            echo
            echo "Base \`$BASE_SHA\`, head \`$HEAD_SHA\`, both built by pr-performance-build.ts (ci-opt) with rustc $(rustc --version | cut -d' ' -f2). Runner: $(nproc) vCPU. \`vize lint . --no-config --preset P --format json\`, interleaved; Ir is Callgrind with RAYON_NUM_THREADS=1."
            echo
          } > "$RUNNER_TEMP/style-lane.md"
          git_root="$GITHUB_WORKSPACE/driver/tests/_fixtures/_git"
          node driver/tools/benchmarks/scripts/style-lane-quiet.ts \
            --base-bin "$RUNNER_TEMP/pr-performance-base-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/ci-opt/vize" \
            --head-bin "$RUNNER_TEMP/pr-performance-head-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/ci-opt/vize" \
            --corpora "misskey=$git_root/misskey,n8n=$git_root/n8n,nuxt-ui=$git_root/nuxt-ui,reka-ui=$git_root/reka-ui,bench-1000=$STYLE_LANE_ROOT/bench" \
            --presets default,opinionated,nuxt --ir bench-1000,reka-ui \
            --runs "${{ inputs.runs }}" --out "$RUNNER_TEMP/style-lane.md"
          cat "$RUNNER_TEMP/style-lane.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: style-lane-${{ env.HEAD_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/style-lane.md
          if-no-files-found: warn
          retention-days: 30
