name: PR performance observation (perf-linter quiet-runner bench)

# Measurements only. This workflow is deliberately independent of Check,
# merge_group, release gates, and the existing historical benchmark budgets.
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit to compare
        required: true
        type: string
      head_sha:
        description: Exact authored head commit; independent of the measurement driver
        required: true
        type: string
      scenarios:
        description: Comma-separated perf-linter-quiet scenarios
        required: false
        type: string
        default: mk,mk-json,mk-all,mk-all-text,bench,ta,ir-mk,ir-mk-text,ir-bench
      lsp_rounds:
        description: LSP edit-loop sessions per side (0 skips)
        required: false
        type: string
        default: "10"

permissions: { contents: read }
concurrency:
  group: perf-linter-quiet-${{ github.run_id }}
  cancel-in-progress: true
env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
  DRIVER_SHA: ${{ github.workflow_sha }}
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "8"
  GOMAXPROCS: "8"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUSTUP_TOOLCHAIN: "1.100.0"

jobs:
  observe:
    name: Performance observations (optional)
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: driver
          ref: ${{ env.DRIVER_SHA }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: head
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: base
          ref: ${{ env.BASE_SHA }}
          persist-credentials: false
      - name: Record exact comparison sources
        env:
          EVENT_NAME: ${{ github.event_name }}
          OBSERVATION_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C base rev-parse HEAD)" == "$BASE_SHA" ]]
          [[ "$(git -C head rev-parse HEAD)" == "$HEAD_SHA" ]]
          [[ "$(git -C driver rev-parse HEAD)" == "$DRIVER_SHA" ]]
          git -C head fetch --no-tags "$GITHUB_WORKSPACE/base" "$BASE_SHA"
          mkdir -p performance-observation/build
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const git = (...args) => execFileSync('git', ['-C', 'head', ...args], { encoding: 'utf8' }).trim();
          writeFileSync('performance-observation/source-pair.json', JSON.stringify({
            schema: 1, event: process.env.EVENT_NAME, pullRequest: process.env.OBSERVATION_PR || null,
            base: process.env.BASE_SHA, head: process.env.HEAD_SHA,
            driver: process.env.DRIVER_SHA, driverTree: execFileSync('git', ['-C', 'driver', 'rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(), mergeBase: git('merge-base', process.env.BASE_SHA, process.env.HEAD_SHA),
            comparison: process.env.EVENT_NAME === 'pull_request' ? 'exact PR base and authored head, independent measurement driver' : 'explicit immutable source pair, independent measurement driver',
            changedPaths: git('diff', '--name-only', '-z', process.env.BASE_SHA, process.env.HEAD_SHA).split('\0').filter(Boolean),
          }, null, 2) + '\n');
          JS
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.100.0" }
      - uses: ./driver/.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: driver/package.json
          run-install: false
      - name: Install one pinned physical dependency provider
        working-directory: driver
        run: vp install --frozen-lockfile --prefer-offline
      - name: Build normal source binaries in independent fresh targets
        run: |
          set -euo pipefail
          for role in base head; do
            target="$RUNNER_TEMP/pr-performance-$role-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            node driver/tools/benchmarks/scripts/pr-performance-build.ts \
              --source-root "$GITHUB_WORKSPACE/$role" --target-dir "$target" \
              --binary "$target/ci-opt/vize" --role "$role" \
              --receipt "$GITHUB_WORKSPACE/performance-observation/build/$role.json"
          done
      - name: Validate identical normal build recipes
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { verifyPrPerformanceBuildPair } from './driver/tools/benchmarks/scripts/pr-performance-build.ts';
          const pair = verifyPrPerformanceBuildPair('performance-observation/build/base.json', 'performance-observation/build/head.json');
          writeFileSync('performance-observation/build/pair.json', JSON.stringify(pair, null, 2) + '\n');
          JS
      - name: Symbolized head build for instruction attribution
        if: contains(inputs.scenarios, 'annotate')
        working-directory: head
        run: |
          set -euo pipefail
          cargo build --locked -p vize --profile ci-opt \
            --config 'profile.ci-opt.inherits="release"' --config 'profile.ci-opt.lto="thin"' \
            --config 'profile.ci-opt.codegen-units=16' --config 'profile.ci-opt.package.vize.strip="none"' \
            --config 'profile.ci-opt.debug="line-tables-only"' \
            --target-dir "$RUNNER_TEMP/pr-performance-head-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --quiet
          echo "VIZE_SYM_BIN=$RUNNER_TEMP/pr-performance-head-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/ci-opt/vize" >> "$GITHUB_ENV"
      - name: Install Callgrind for exact instruction counts
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends valgrind strace
      - name: Prepare misskey, type-aware and benchmark corpora
        working-directory: driver
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/perf-linter"
          mkdir -p "$root"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/misskey-dev/misskey "$root/misskey-src"
          git -C "$root/misskey-src" sparse-checkout set packages/frontend
          git -C "$root/misskey-src" checkout --quiet 6a508589d33d07902ffe8d8121a9fdc15a68173c
          for corpus in mk mkta; do
            mkdir -p "$root/$corpus"
            cp -R "$root/misskey-src/packages/frontend/src" "$root/misskey-src/packages/frontend/tsconfig.json" "$root/$corpus/"
          done
          mkdir -p "$root/mkta/node_modules/@typescript"
          ln -s "$(realpath node_modules/@typescript/typescript-linux-x64)" "$root/mkta/node_modules/@typescript/typescript-linux-x64"
          find "$root/mk/src" -name '*.vue' | wc -l
          node --input-type=module -e "import('./tools/benchmarks/scripts/generate.mjs').then((m) => m.generateCorpus({ fileCount: 1000, benchDir: process.argv[1], log: () => {} }))" "$root/bench"
          echo "PERF_LINTER_ROOT=$root" >> "$GITHUB_ENV"
      - name: Interleaved base/head lint and LSP measurements
        run: |
          set -euo pipefail
          {
            echo "### perf-linter quiet-runner comparison"
            echo
            echo "Base \`$BASE_SHA\`, head \`$HEAD_SHA\`, both built by pr-performance-build.ts (ci-opt) with rustc $(rustc --version | cut -d' ' -f2). Runner: $(nproc) vCPU."
            echo
          } > "$RUNNER_TEMP/perf-linter.md"
          node driver/tools/benchmarks/scripts/perf-linter-quiet.ts \
            --base-bin "$RUNNER_TEMP/pr-performance-base-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/ci-opt/vize" \
            --head-bin "$RUNNER_TEMP/pr-performance-head-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/ci-opt/vize" \
            --mk "$PERF_LINTER_ROOT/mk" --mkta "$PERF_LINTER_ROOT/mkta" --bench "$PERF_LINTER_ROOT/bench" \
            --runs "$PERF_LINTER_RUNS" --scenarios "$PERF_LINTER_SCENARIOS" \
            --lsp-rounds "$PERF_LINTER_LSP_ROUNDS" --lsp-edits 40 \
            --out "$RUNNER_TEMP/perf-linter.md"
          cat "$RUNNER_TEMP/perf-linter.md" >> "$GITHUB_STEP_SUMMARY"
        env:
          PERF_LINTER_RUNS: "30"
          PERF_LINTER_SCENARIOS: ${{ inputs.scenarios }}
          PERF_LINTER_LSP_ROUNDS: ${{ inputs.lsp_rounds }}
