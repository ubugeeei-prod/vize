name: PR performance observation (scratch CLI size and symbol diff, not for merge)

# Scratch measurement for #13338: builds each named source with the exact
# pr-performance-build.ts recipe (ci-opt, thin LTO, 16 CGUs, Wild), records
# the stripped CLI bytes, and the unstripped symbol sizes for a diff.
on:
  workflow_dispatch:
    inputs:
      shas:
        description: Space-separated source commits
        required: true
        type: string

permissions: { contents: read }
concurrency:
  group: size-scratch-${{ github.run_id }}
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "8"
  RUSTUP_TOOLCHAIN: "1.100.0"

jobs:
  size:
    name: CLI size and symbols
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: base
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.100.0" }
      - uses: ./driver/.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - name: Install Callgrind and generate the bench-1000 corpus
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends valgrind
          node --input-type=module -e "import('./driver/tools/benchmarks/scripts/generate.mjs').then((m) => m.generateCorpus({ fileCount: 1000, benchDir: process.argv[1], log: () => {} }))" "$RUNNER_TEMP/bench"
      - name: Build each source with the observation recipe
        env:
          SHAS: ${{ inputs.shas }}
        run: |
          set -euo pipefail
          mkdir -p out
          for sha in $SHAS; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            git -C base fetch -q --no-tags origin "$sha"
            git -C base checkout -q --detach "$sha"
            for strip in symbols none; do
              (cd base && cargo build --locked --profile ci-opt -p vize \
                --config 'profile.ci-opt.inherits="release"' --config 'profile.ci-opt.lto="thin"' \
                --config 'profile.ci-opt.codegen-units=16' \
                --config "profile.ci-opt.package.vize.strip=\"$strip\"" 2>&1 | tail -1)
              cp base/target/ci-opt/vize "out/vize-$strip"
            done
            echo "$sha $(stat -c %s out/vize-symbols)" | tee -a out/bytes.txt
            nm --print-size --size-sort -C --defined-only out/vize-none > "out/syms-$sha.txt"
            for preset in default opinionated nuxt; do
              (cd "$RUNNER_TEMP/bench" && RAYON_NUM_THREADS=1 valgrind --tool=callgrind --cache-sim=no                 --callgrind-out-file="$GITHUB_WORKSPACE/out/cg-$sha-$preset.out" "$GITHUB_WORKSPACE/out/vize-none"                 lint . --no-config --preset "$preset" --format json > /dev/null 2> "$GITHUB_WORKSPACE/out/cg-$sha-$preset.err" || true)
              echo "$sha $preset $(grep -o 'Collected : [0-9]*' "out/cg-$sha-$preset.err" | awk '{print $3}')" | tee -a out/ir.txt
              callgrind_annotate --threshold=99.5 "out/cg-$sha-$preset.out" > "out/annot-$sha-$preset.txt" 2>/dev/null || true
              rm -f "out/cg-$sha-$preset.out"
            done
            size -A out/vize-none > "out/sections-$sha.txt"
            rm out/vize-none out/vize-symbols
          done
          { echo '### CLI bytes'; echo; sed 's/^/    /' out/bytes.txt; echo; echo '### Ir bench-1000'; echo; sed 's/^/    /' out/ir.txt; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cli-size-${{ github.run_id }}
          path: out
          if-no-files-found: warn
          retention-days: 14
