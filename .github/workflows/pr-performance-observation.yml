# DO NOT EDIT. Generated from tools/config/pkl/workflows/checks/pr-performance-observation.pkl.
# Edit the Pkl source and run `node tools/commands/generate/repository-config.ts`.
name: PR performance observation

# Measurements only. This workflow is deliberately independent of Check,
# merge_group, release gates, and the existing historical benchmark budgets.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit to compare
        required: true
        type: string
      head_sha:
        description: Exact authored head commit; independent of the measurement driver
        required: true
        type: string

permissions: { contents: read }
concurrency:
  group: pr-performance-observation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
  DRIVER_SHA: ${{ github.workflow_sha }}
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "8"
  GOMAXPROCS: "8"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUSTUP_TOOLCHAIN: "1.100.0"

jobs:
  observe:
    name: Performance observations (optional)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 50
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /tools/ci/lib/scripts/
            /.github/scripts/workflows/pr-performance-observation/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: driver
          ref: ${{ env.DRIVER_SHA }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: head
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: base
          ref: ${{ env.BASE_SHA }}
          persist-credentials: false
      - name: Record exact comparison sources
        env:
          EVENT_NAME: ${{ github.event_name }}
          OBSERVATION_PR: ${{ github.event.pull_request.number }}
        run: . "${{ env.VIZE_CI_FILES }}/record-exact-comparison-sources.sh"
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.100.0" }
      - uses: ./driver/.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          version: 1.8.0
          node-version-file: driver/package.json
          run-install: false
      - name: Install one pinned physical dependency provider
        working-directory: driver
        run: vp install --frozen-lockfile --prefer-offline
      - name: Validate measurement and source custody controls
        working-directory: driver
        run: node --test tests/tooling/pr-performance-observation.test.ts tools/benchmarks/scripts/pr-performance-observation.test.ts tools/benchmarks/scripts/pr-performance-build.test.ts
      - name: Build normal source binaries in independent fresh targets
        run: . "${{ env.VIZE_CI_FILES }}/build-normal-source-binaries-in-independent-fresh-targets.sh"
      - name: Validate identical normal build recipes
        run: . "${{ env.VIZE_CI_FILES }}/validate-identical-normal-build-recipes.sh"
      - name: Generate identical public inputs and pin the native runtime
        working-directory: driver
        run: . "${{ env.VIZE_CI_FILES }}/generate-identical-public-inputs-and-pin-the-native-runtime.sh"
      - name: Observe alternating latency, separate memory, and binary sizes
        run: . "${{ env.VIZE_CI_FILES }}/observe-alternating-latency-separate-memory-and-binary-sizes.sh"
      - name: Publish the observation summary
        if: always()
        run: . "${{ env.VIZE_CI_FILES }}/publish-the-observation-summary.sh"
      - name: Package evidence without traversing dependency symlinks
        if: always()
        run: . "${{ env.VIZE_CI_FILES }}/package-evidence-without-traversing-dependency-symlinks.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-performance-${{ github.event.pull_request.number || 'manual' }}-${{ env.HEAD_SHA }}-${{ github.run_attempt }}
          path: |
            performance-observation.tgz
            performance-observation/measurements/summary.md
            performance-observation/measurements/report.json
          if-no-files-found: warn
          retention-days: 90
