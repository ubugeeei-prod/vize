name: Pinned OXC PURE Capture
on:
  pull_request:
    types: [opened, synchronize, labeled]
    paths:
      - ".github/workflows/oxc-pure-capture.yml"
      - "vendor/oxc_parser/**"
      - "crates/vize_atelier_core/examples/oxc_pure_capture.rs"
      - "tools/support/dependencies/export-capture-evidence.ts"
  workflow_dispatch:
    inputs:
      source-copy:
        description: Reviewed exact-source copy commit (ancestor of this head)
        required: true
        type: string
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'oxc-pure-capture')
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [original, candidate]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          run-install: true
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: oxc-pure-capture-${{ matrix.variant }}
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Verify reviewed original source identity
        env:
          SOURCE_COPY: ${{ inputs.source-copy || '9e5b321995182959425ff9b43faa2b067e6cd5bf' }}
          VARIANT: ${{ matrix.variant }}
        run: |
          git merge-base --is-ancestor "$SOURCE_COPY" HEAD
          if [ "$VARIANT" = original ]; then
            vp node tools/support/dependencies/restore-oxc-parser-original.ts "$SOURCE_COPY"
          fi
          mkdir -p capture
          git rev-parse HEAD > capture/head.txt
          git diff --binary > capture/source.diff
          cargo metadata --locked --format-version 1 > capture/metadata.json
      - name: Capture actual optimized parser and legacy compiler output
        run: cargo run --locked --profile ci-opt -p vize_atelier_core --example oxc_pure_capture -- capture
      - name: Export complete captured bytes through bounded verified log frames
        if: always()
        env:
          VARIANT: ${{ matrix.variant }}
        run: vp node tools/support/dependencies/export-capture-evidence.ts capture capture-export/evidence.json.gz "oxc-pure-$VARIANT"
      - name: Preserve the same lossless transport pack
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxc-pure-transport-${{ matrix.variant }}-${{ github.sha }}
          path: capture-export/evidence.json.gz
          if-no-files-found: error
      - name: Preserve complete source and output receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxc-pure-${{ matrix.variant }}-${{ github.sha }}
          path: capture
          if-no-files-found: error
