name: Source-built JS PR focused diagnostic
on:
  push:
    branches: [ci/js-pr-focused-diagnostic-6830]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  source-built-vite-tests:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "12"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: 691429b3ac2faff6af49295f04e06eb499d992e7
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - uses: ./.github/actions/setup-moonbit
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.0"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          cache-key-prefix: pr-7150-
          key: test-js-packages
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Build native addon from exact PR source
        run: vp run --workspace-root build:native:test
      - name: Run prepared Vite compiler tests with bound addon
        run: node npm/native/scripts/test-preparation.mjs vp run --filter './npm/builder/vite' test
      - name: Record exact source and addon identity
        run: |
          printf 'source=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
          shasum -a 256 npm/native/vize-vitrine.*.node >> "$GITHUB_STEP_SUMMARY"

  aggregate:
    needs: source-built-vite-tests
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    env:
      TEST_RESULT: ${{ needs.source-built-vite-tests.result }}
    steps:
      - name: Require source-built Vite tests
        run: test "$TEST_RESULT" = success
