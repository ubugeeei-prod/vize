name: Compact Collections

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact baseline commit
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: compact-collections-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  compact-collections:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/compact-collections/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: head
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select and record exact comparison commits
        env:
          REQUESTED_BASE: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: . "${{ env.VIZE_CI_FILES }}/select-and-record-exact-comparison-commits.sh"
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      # The cache action's nested local action resolves from the workspace root,
      # and this job checks the repository out under head/.
      - name: Expose the nested target action at the workspace root
        run: . "${{ env.VIZE_CI_FILES }}/expose-the-nested-target-action-at-the-workspace-root.sh"
      - uses: ./head/.github/actions/setup-rust-sticky-cache
        with:
          key: compact-collections
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
          target-path: head/target
      - name: Focused production regressions and lint
        working-directory: head
        run: . "${{ env.VIZE_CI_FILES }}/focused-production-regressions-and-lint.sh"
      - name: Install identical measurement harness on baseline
        run: . "${{ env.VIZE_CI_FILES }}/install-identical-measurement-harness-on-baseline.sh"
      - name: Build exact production base and head
        run: . "${{ env.VIZE_CI_FILES }}/build-exact-production-base-and-head.sh"
      - name: Alternate measurements and check graph parity
        run: . "${{ env.VIZE_CI_FILES }}/alternate-measurements-and-check-graph-parity.sh"
      - name: Upload raw samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compact-collections-measurements
          path: measurements/
          if-no-files-found: warn
          retention-days: 14
