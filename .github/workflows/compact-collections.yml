name: Compact Collections

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/vize_croquis/src/setup_context.rs"
      - "crates/vize_croquis/src/scope/**"
      - "crates/vize_croquis_cf/src/graph/**"
      - "crates/vize_croquis_cf/src/graph.rs"
      - "crates/vize_croquis_cf/examples/compact_collections.rs"
      - ".github/workflows/compact-collections.yml"
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact baseline commit
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: compact-collections-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  compact-collections:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: head
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select and record exact comparison commits
        env:
          REQUESTED_BASE: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          REQUESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_BASE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUESTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C head rev-parse HEAD)" == "$REQUESTED_HEAD" ]]
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            COMPARISON_BASE="$(git -C head merge-base "$REQUESTED_BASE" HEAD)"
          else
            git -C head merge-base --is-ancestor "$REQUESTED_BASE" HEAD
            COMPARISON_BASE="$REQUESTED_BASE"
          fi
          git -C head worktree add ../base "$COMPARISON_BASE"
          [[ "$(git -C base rev-parse HEAD)" == "$COMPARISON_BASE" ]]
          mkdir -p measurements
          export COMPARISON_BASE
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('measurements/commits.json').write_text(json.dumps({
              'base': os.environ['COMPARISON_BASE'],
              'head': os.environ['REQUESTED_HEAD'],
              'requested_base': os.environ['REQUESTED_BASE'],
          }, indent=2))
          PY
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./head/.github/actions/setup-rust-sticky-cache
        with:
          key: compact-collections
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
          target-path: head/target
      - name: Focused production regressions and lint
        working-directory: head
        run: |
          cargo test --locked -p vize_croquis -p vize_croquis_cf --lib
          cargo clippy --locked -p vize_croquis -p vize_croquis_cf --all-targets -- -D warnings
          cargo check --locked -p vize_croquis -p vize_croquis_cf --target wasm32-unknown-unknown
      - name: Install identical measurement harness on baseline
        run: |
          mkdir -p base/crates/vize_croquis_cf/examples
          cp head/crates/vize_croquis_cf/examples/compact_collections.rs base/crates/vize_croquis_cf/examples/
          python3 - <<'PY'
          from pathlib import Path
          path = Path('base/crates/vize_croquis_cf/Cargo.toml')
          source = path.read_text()
          if 'davinci_harness.workspace = true' not in source:
              source = source.replace('[dev-dependencies]', '[dev-dependencies]\ndavinci_harness.workspace = true')
          path.write_text(source)
          PY
      - name: Build exact production base and head
        run: |
          (cd base && CARGO_TARGET_DIR=../head/target/base cargo build --release -p vize_croquis_cf --example compact_collections)
          (cd head && CARGO_TARGET_DIR=target/head cargo build --release --locked -p vize_croquis_cf --example compact_collections)
      - name: Alternate measurements and check graph parity
        run: |
          mkdir -p measurements
          for pass in 1 2 3 4 5; do
            if (( pass % 2 )); then
              head/target/base/release/examples/compact_collections "measurements/base-$pass.json"
              head/target/head/release/examples/compact_collections "measurements/head-$pass.json"
            else
              head/target/head/release/examples/compact_collections "measurements/head-$pass.json"
              head/target/base/release/examples/compact_collections "measurements/base-$pass.json"
            fi
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          for i in range(1, 6):
              base = json.loads(Path(f'measurements/base-{i}.json').read_text())
              head = json.loads(Path(f'measurements/head-{i}.json').read_text())
              assert base['cycle_fingerprints'] == head['cycle_fingerprints']
              assert base['semantic_fingerprints'] == head['semantic_fingerprints']
              assert base['scope_id_bytes'] == head['scope_id_bytes'] == 4
          PY
      - name: Upload raw samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compact-collections-measurements
          path: measurements/
          if-no-files-found: warn
          retention-days: 14
