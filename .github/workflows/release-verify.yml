name: Public storage acceptance 10934
run-name: Public storage acceptance ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Genuine public npm version
        type: string
        required: true
      candidate:
        description: Actual immutable release tag commit
        type: string
        required: true
      authority_blob:
        description: Byte-pinned genuine producer and npm authority Git blob
        type: string
        required: true
permissions: { contents: read, actions: read }
concurrency:
  group: public-storage-10934-${{ inputs.version }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  public-storage:
    if: github.repository == 'ubugeeei-prod/vize'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLIC_STORAGE_VERSION: ${{ inputs.version }}
      PUBLIC_STORAGE_CANDIDATE: ${{ inputs.candidate }}
      PUBLIC_STORAGE_AUTHORITY_BLOB: ${{ inputs.authority_blob }}
      PUBLIC_STORAGE_SOURCE: ${{ github.workspace }}/release-source
      NODE_DISABLE_COMPILE_CACHE: "1"
    steps:
      - name: Allocate the owned acceptance location
        shell: bash
        run: |
          set -euo pipefail
          acceptance_root="$RUNNER_TEMP/public-storage-10934-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ ! -e "$acceptance_root" ]]
          printf 'PUBLIC_STORAGE_ROOT=%s\n' "$acceptance_root" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { path: carrier, persist-credentials: false }
      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PUBLIC_STORAGE_VERSION" =~ ^0\.[0-9]+\.0$ ]]
          [[ "$PUBLIC_STORAGE_CANDIDATE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PUBLIC_STORAGE_AUTHORITY_BLOB" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.candidate }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: 26.6.0, package-manager-cache: false }
      - name: Check the strict TypeScript carrier
        shell: bash
        run: |
          set -euo pipefail
          qa_types="$RUNNER_TEMP/public-storage-types"
          mkdir -p "$RUNNER_TEMP/public-storage-carrier-preflight"
          npm install --prefix "$qa_types" --ignore-scripts --no-audit --no-fund --prefer-online typescript@6.0.3 @types/node@25.9.2 2>&1 | tee "$RUNNER_TEMP/public-storage-carrier-preflight/install.log"
          node "$qa_types/node_modules/typescript/lib/tsc.js" --noEmit --strict --noUnusedLocals --noUnusedParameters --noUncheckedIndexedAccess --skipLibCheck --target ESNext --module NodeNext --moduleResolution NodeNext --allowImportingTsExtensions --types node --typeRoots "$qa_types/node_modules/@types" carrier/tools/support/release/public_storage_10934/run.ts 2>&1 | tee "$RUNNER_TEMP/public-storage-carrier-preflight/typecheck.log"
      - name: Provide read-only process observation
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v strace >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends strace
          fi
      - name: Verify genuine public storage in three fresh processes
        run: node carrier/tools/support/release/public_storage_10934/run.ts
      - name: Archive complete evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PUBLIC_STORAGE_ROOT/evidence"
          if [[ -d "$RUNNER_TEMP/public-storage-carrier-preflight" ]]; then
            cp -R "$RUNNER_TEMP/public-storage-carrier-preflight" "$PUBLIC_STORAGE_ROOT/evidence/"
          fi
          tar --exclude='./harness/project' -czf "$RUNNER_TEMP/public-storage-10934.tgz" -C "$PUBLIC_STORAGE_ROOT/evidence" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: public-storage-10934-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-storage-10934.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
