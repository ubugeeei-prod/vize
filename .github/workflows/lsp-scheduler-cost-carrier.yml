name: LSP indexed scheduler source cost carrier
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/lsp-scheduler-cost-carrier.yml"
      - ".github/scripts/workflows/lsp-scheduler-cost-carrier/**"
      - ".github/scripts/workflows/shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/vize_maestro/Cargo.toml"
      - "crates/vize_maestro/src/server.rs"
      - "crates/vize_maestro/src/server/**"
      - "davinci/vize_l0/Cargo.toml"
      - "davinci/vize_l0/src/profiler.rs"
      - "davinci/vize_l0/src/profiler/**"
      - "tools/benchmarks/crates/davinci_harness/**"
      - "tests/tooling/lsp-scheduler-cost-carrier.test.ts"
permissions:
  contents: read
concurrency:
  group: lsp-indexed-scheduler-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  census:
    name: Actual untimed selector visits and synchronous allocations
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: "4"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VIZE_SCHEDULER_COST_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      VIZE_SCHEDULER_COST_EVIDENCE: ${{ github.workspace }}/scheduler-evidence/indexed-scheduler-cost.json
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/lsp-scheduler-cost-carrier/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: . "${{ env.VIZE_CI_FILES }}/census-rustup-toolchain-install-rustup-show-active-too.sh"
      - name: Preserve exact source and allocator custody
        run: . "${{ env.VIZE_CI_FILES }}/preserve-exact-source-and-allocator-custody.sh"
      - name: Calibrate then count exactly one synchronous Rust carrier
        run: . "${{ env.VIZE_CI_FILES }}/calibrate-then-count-exactly-one-synchronous-rust-carrier.sh"
      - name: Preserve all original twenty laws and indexed queue laws without profiling
        run: . "${{ env.VIZE_CI_FILES }}/preserve-all-original-twenty-laws-and-indexed-queue-laws-without-profili.sh"
      - name: Compile normal library with test hooks and operands absent
        run: . "${{ env.VIZE_CI_FILES }}/compile-normal-library-with-test-hooks-and-operands-absent.sh"
      - name: Check shipped library without lint exceptions
        run: . "${{ env.VIZE_CI_FILES }}/check-shipped-library-without-lint-exceptions.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: lsp-indexed-scheduler-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: scheduler-evidence/
          if-no-files-found: error
          retention-days: 30
