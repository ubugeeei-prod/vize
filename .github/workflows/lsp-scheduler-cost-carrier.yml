name: Partition benchmark source bindings
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      OBSERVED_SOURCE: 28f8ec3bfa187b468641f89c2a71f0b7cdb2de6f
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 28f8ec3bfa187b468641f89c2a71f0b7cdb2de6f
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with:
          node-version-file: package.json
          run-install: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.99.1", components: rustfmt }
      - name: Run the three unchanged source-binding and protocol controls
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$OBSERVED_SOURCE"
          test -z "$(git status --porcelain)"
          mkdir "$RUNNER_TEMP/partition-layout-controls"
          node tools/benchmarks/scripts/partition-weight-control.ts > "$RUNNER_TEMP/partition-layout-controls/planner-control.json"
          node tools/benchmarks/scripts/partition-weight-kernel-control.ts > "$RUNNER_TEMP/partition-layout-controls/kernel-control.json"
          node --test tests/tooling/partition-weight-cli.test.ts 2>&1 | tee "$RUNNER_TEMP/partition-layout-controls/cli-controls.tap"
          git rev-parse HEAD > "$RUNNER_TEMP/partition-layout-controls/source.sha"
          rustfmt --version > "$RUNNER_TEMP/partition-layout-controls/rustfmt.txt"
          node --version > "$RUNNER_TEMP/partition-layout-controls/node.txt"
          cat "$RUNNER_TEMP/partition-layout-controls/planner-control.json" "$RUNNER_TEMP/partition-layout-controls/kernel-control.json"
          node -e 'const fs=require("node:fs");const s=fs.readFileSync(process.env.RUNNER_TEMP+"/partition-layout-controls/cli-controls.tap","utf8");for(const marker of ["# tests 2","# pass 2","# fail 0","# skipped 0"])if(!s.includes(marker))throw Error("incomplete CLI controls: "+marker);'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: partition-bench-source-bindings-28f-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/partition-layout-controls/
          if-no-files-found: error
          retention-days: 30
