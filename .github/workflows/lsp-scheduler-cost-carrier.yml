name: Normal native queue lifecycle calibration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  normal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with:
          node-version-file: package.json
          run-install: false
      - run: rustup toolchain install || rustup show active-toolchain
      - name: Keep compiler and machine provenance
        run: |
          set -euo pipefail
          mkdir queue-normal-evidence
          rustc -vV > queue-normal-evidence/rustc.txt
          uname -a > queue-normal-evidence/kernel.txt
          cat /proc/cpuinfo > queue-normal-evidence/cpuinfo.txt
          cat /proc/self/status > queue-normal-evidence/affinity-status.txt
          df -B1 > queue-normal-evidence/filesystems.txt
      - name: Actual static-config payload capture then paired unprofiled lifecycle
        timeout-minutes: 30
        run: node tools/benchmarks/scripts/normal-queue-lifecycle.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: normal-queue-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: queue-normal-evidence/
          if-no-files-found: error
          retention-days: 30
