name: Content mapper span allocation
on:
  pull_request:
    paths:
      - crates/vize_canon/src/batch/virtual_project/content_mapper/publish.rs
      - crates/vize_canon/src/batch/virtual_project/content_mapper/span_normalize.rs
      - tools/benchmarks/crates/vize/tests/content_mapper_span_profile.rs
      - tools/benchmarks/scripts/content-mapper-span-profile.mjs
      - tools/benchmarks/scripts/content-mapper-span-profile.test.mjs
      - .github/workflows/content-mapper-span-allocation.yml
permissions: { contents: read }
concurrency:
  group: content-mapper-span-allocation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      SPAN_EVENT_BASE: ${{ github.event.pull_request.base.sha }}
      SPAN_HEAD: ${{ github.event.pull_request.head.sha }}
      CARGO_BUILD_JOBS: "24"
      CARGO_INCREMENTAL: "0"
      RAYON_NUM_THREADS: "8"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          {
            ref: "${{ github.event.pull_request.head.sha }}",
            fetch-depth: 0,
            persist-credentials: false,
          }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version-file: package.json, package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - name: Test the evidence oracle and build isolated before and after sources
        run: |
          node --test tools/benchmarks/scripts/content-mapper-span-profile.test.mjs
          node tools/benchmarks/scripts/content-mapper-span-profile.mjs build "$RUNNER_TEMP/span-evidence"
      - name: Compare complete packets and fresh process measurements
        run: node tools/benchmarks/scripts/content-mapper-span-profile.mjs measure "$RUNNER_TEMP/span-evidence"
      - name: Write every family result
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/span-evidence/summary.md" ]]; then cat "$RUNNER_TEMP/span-evidence/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: content-mapper-span-allocation-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/span-evidence
          if-no-files-found: error
          retention-days: 14
