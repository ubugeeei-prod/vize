name: Production reach accounting
on:
  pull_request:
    paths:
      - ".github/workflows/production-reach-accounting.yml"
      - "crates/vize_atelier_sfc/tests/davinci_production_reach.rs"
      - "crates/vize_atelier_sfc/tests/davinci_production_reach/**"
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: production-reach-accounting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "24"
jobs:
  committed-corpus:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: clippy-test
          cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}"
      - name: Verify complete original component-handler production parity
        run: |
          set -o pipefail
          cargo test --locked --profile ci -p vize_atelier_sfc --features legacy-dom-differential --test davinci_production_reach inline_parity_regressions -- --nocapture 2>&1 | tee production-reach-originals.log
      - name: Hold complete committed-corpus parity, selection accounting and reach floors
        run: |
          set -o pipefail
          cargo test --locked --profile ci -p vize_atelier_sfc --features legacy-dom-differential --test davinci_production_reach -- --nocapture 2>&1 | tee production-reach-corpus.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: production-reach-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: production-reach-*.log
          if-no-files-found: error
          retention-days: 14
