name: IR pass composition
on:
  pull_request:
    paths:
      - ".github/workflows/ir-pass-composition.yml"
      - "tools/benchmarks/crates/davinci_harness/src/paired.rs"
      - "davinci/vize_l0/Cargo.toml"
      - davinci/vize_l0/src/diag/witness.rs
      - "davinci/vize_l0/src/pass.rs"
      - "davinci/vize_l0/src/pass/**"
      - "davinci/vize_l0/tests/grouped_passes.rs"
      - crates/vize_incremental/Cargo.toml
      - crates/vize_incremental/src/lib.rs
      - crates/vize_incremental/src/template.rs
      - crates/vize_incremental/src/template/**
      - crates/vize_incremental/tests/template_passes/**
      - crates/vize_maestro/Cargo.toml
      - crates/vize_maestro/src/document/store.rs
      - crates/vize_maestro/src/source_project.rs
      - crates/vize_maestro/src/source_project/template.rs
      - crates/vize_maestro/src/source_project/snapshot.rs
      - crates/vize_maestro/src/source_project/template/**
      - crates/vize_maestro/src/source_project/query.rs
      - crates/vize_maestro/tests/original_template_requests.rs
      - crates/vize_maestro/src/source_project/scoped_component.rs
      - crates/vize_maestro/tests/original_template_requests/**
      - crates/vize_maestro/tests/component_tool_passes.rs
      - crates/vize_patina/Cargo.toml
      - crates/vize_patina/src/rules/facts/max_template_complexity.rs
      - crates/vize_patina/src/rules/facts/max_template_complexity/**
      - crates/vize_patina/tests/original_template_lint.rs
      - crates/vize_patina/tests/original_template_lint/**
      - tests/formal/template-lint/**
      - tests/formal/ir-graph/TemplateProjection.lean
      - davinci/vize_l1/Cargo.toml
      - davinci/vize_l1/src/container/vue.rs
      - davinci/vize_l1/src/container/vue/descriptor.rs
      - davinci/vize_l1/src/container/vue/descriptor/template.rs
      - davinci/vize_l1/src/container/vue/descriptor/template/**
      - "davinci/vize_l1_to_l2/Cargo.toml"
      - "davinci/vize_l1_to_l2/src/pass.rs"
      - "davinci/vize_l1_to_l2/src/pass/**"
      - "davinci/vize_l1_to_l2/tests/observed_template_passes.rs"
      - davinci/vize_l1_to_l2/tests/original_template_queries.rs
      - davinci/vize_l1_to_l2/tests/original_template_queries/**
      - "davinci/vize_l2/src/analysis.rs"
      - "davinci/vize_l2/src/analysis/static_facts.rs"
      - "davinci/vize_l2/src/analysis/static_facts/**"
      - "davinci/vize_l2/src/analysis/template_complexity.rs"
      - "davinci/vize_l2/src/analysis/template_complexity/**"
      - "davinci/vize_l3/Cargo.toml"
      - "davinci/vize_l3/src/optimize.rs"
      - "davinci/vize_l3/tests/placement/extraction.rs"
      - .github/scripts/workflows/ir-pass-composition/**
permissions: { contents: read }
concurrency:
  group: ir-pass-composition-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  composition:
    name: Source-order groups, optimizer equivalence and paired timings
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: "1.100.0"
      RUST_MIN_STACK: "16777216"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/ir-pass-composition/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.100.0", components: clippy }
      - uses: ./.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - name: Run the original catalogue, traces and allocation measurements
        run: |-
          . "${{ env.VIZE_CI_FILES }}/run-the-original-catalogue-traces-and-allocation-measurements.sh"
      - name: Check original Vue templates against both passes and the independent CFG
        run: |-
          . "${{ env.VIZE_CI_FILES }}/check-original-vue-templates-against-both-passes-and-the-independent-cfg.sh"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Check lossless template queries against Vue and existing Vize products
        run: . "${{ env.VIZE_CI_FILES }}/check-lossless-template-queries-against-vue-and-existing-vize-products.sh"
      - name: Compare complete original complexity diagnostics and compiler-plus-lint timing
        env:
          VIZE_ORIGINAL_TEMPLATE_ORACLE: ${{ runner.temp }}/template-oracle.json
        run: . "${{ env.VIZE_CI_FILES }}/compare-complete-original-complexity-diagnostics-and-compiler-plus-lint-timing.sh"
  lint-ranking:
    name: Prove stable complexity label selection for unbounded inputs
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/ir-pass-composition/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check the prefix theorem with Lean
        working-directory: ${{ runner.temp }}
        run: . "${{ env.VIZE_CI_FILES }}/check-the-prefix-theorem-with-lean.sh"
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f
        with:
          kani-version: 0.68.0
          command: kani
          args: crates/vize_patina/src/rules/facts/max_template_complexity/original/kani.rs --output-format=terse
      - name: Check the editor's Rust projection on arbitrary UTF-8 ranges
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f
        with:
          kani-version: 0.68.0
          command: kani
          args: crates/vize_incremental/src/template/kani.rs --output-format=terse
  partition:
    name: Prove the Rust group cursor partitions every bounded plan
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false }
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f
        with:
          kani-version: "0.68.0"
          command: kani
          args: davinci/vize_l0/src/pass/fusion/grouped/kani.rs --output-format=terse
  stock:
    name: Stock compiler and Node addon (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix: { mode: [ default, portable ] }
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.100.0"
      RUST_MIN_STACK: "16777216"
      CARGO_INCREMENTAL: "0"
      MODE: ${{ matrix.mode }}
      TARGET_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/ir-pass-composition/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.100.0" }
      - uses: ./.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: 24 }
      - name: Compare the shipping entry points against the common base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          . "${{ env.VIZE_CI_FILES }}/compare-the-shipping-entry-points-against-the-common-base.sh"
