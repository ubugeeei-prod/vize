name: JSX authored native modules
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/vize_atelier_jsx/**"
      - "crates/vize_atelier_vapor/src/**"
      - "crates/vize_atelier_ssr/src/**"
      - "crates/vize_vitrine/src/napi/jsx.rs"
      - ".github/workflows/jsx-authored-native-modules.yml"
permissions: { contents: read }
concurrency:
  group: jsx-authored-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  authored-modules:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "24"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with: { key: test-scripts, cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}" }
      - name: Complete native module and source-map oracles
        env:
          VIZE_JSX_AUTHORED_NATIVE_CAPTURE: ${{ runner.temp }}/jsx-authored-native/packets.json
        run: |
          mkdir -p "$RUNNER_TEMP/jsx-authored-native"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/jsx-authored-native/source.txt"
          cargo test --locked --profile ci -p vize_atelier_jsx --test authored_native_modules -- --nocapture
      - name: Existing JSX library contracts
        if: always()
        run: cargo test --locked --profile ci -p vize_atelier_jsx --lib
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: jsx-authored-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/jsx-authored-native
            crates/vize_atelier_jsx/src/**/*.snap.new
          if-no-files-found: error
          retention-days: 14
