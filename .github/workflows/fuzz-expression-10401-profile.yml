name: Expression raw-close diagnostic audit
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: expression-10401-raw-close-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile:
    name: Raw-close audit ${{ matrix.role }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: baseline
            source: 3a4bf713f85589a50da5d0a7aaf8ae33fdcdc004
          - role: candidate
            source: 7bd29589171cdaae96aacca6ee7b213ea6dd347b
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      ROLE: ${{ matrix.role }}
      SOURCE_SHA: ${{ matrix.source }}
      DRIVER_SHA: 7bd29589171cdaae96aacca6ee7b213ea6dd347b
      AUDIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout frozen original profiler and input
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.DRIVER_SHA }}
          path: driver
          persist-credentials: false
      - name: Checkout immutable parser source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - name: Checkout diagnostic-only driver
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.AUDIT_SHA }}
          path: audit
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: nightly-2026-10-23
      # Only downloaded sources may be restored. No compiled target/cache exists.
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: expression-profile-downloads-${{ runner.os }}
      - name: Authenticate original and separate immutable counterexample manifests
        run: |
          set -euo pipefail
          mkdir evidence
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C driver rev-parse HEAD)" = "$DRIVER_SHA"
          test "$(git -C audit rev-parse HEAD)" = "$AUDIT_SHA"
          input="$GITHUB_WORKSPACE/driver/tests/fuzz/regressions/js_ts_expression/issue-10401.input"
          echo "6d668844f745732cdc92bdafa21f72ba5d09d9c14305d4ea9174fb802493dcc8  $input" | sha256sum -c -
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          tools = Path('audit/tools/diagnostics/fuzz-raw-close-10401')
          pins = json.loads((tools / 'pins.json').read_text())
          paths = {
              'original_input_sha256': Path('driver/tests/fuzz/regressions/js_ts_expression/issue-10401.input'),
              'original_driver_sha256': Path('driver/crates/vize_atelier_core/examples/fuzz_expression_10401_profile.rs'),
              'append_15_manifest_sha256': tools / 'manifests/append-15.json',
              'scaled_25_manifest_sha256': tools / 'manifests/scaled-25.json',
          }
          for key, path in paths.items():
              assert hashlib.sha256(path.read_bytes()).hexdigest() == pins[key], key
          append = json.loads(paths['append_15_manifest_sha256'].read_text())
          scaled = json.loads(paths['scaled_25_manifest_sha256'].read_text())
          assert len(append['cases']) == 15 and len(scaled['cases']) == 25
          assert append['cases'] == scaled['cases'][:15]
          PY
          python3 audit/tools/diagnostics/fuzz-raw-close-10401/generate.py --input "$input" --out "$RUNNER_TEMP/raw-close-append-$ROLE"
          python3 audit/tools/diagnostics/fuzz-raw-close-10401/generate.py --input "$input" --out "$RUNNER_TEMP/raw-close-scaled-$ROLE" --scale
          cmp audit/tools/diagnostics/fuzz-raw-close-10401/manifests/append-15.json "$RUNNER_TEMP/raw-close-append-$ROLE/manifest.json"
          cmp audit/tools/diagnostics/fuzz-raw-close-10401/manifests/scaled-25.json "$RUNNER_TEMP/raw-close-scaled-$ROLE/manifest.json"
          cp "$RUNNER_TEMP/raw-close-append-$ROLE/manifest.json" evidence/append-15.json
          cp -R "$RUNNER_TEMP/raw-close-scaled-$ROLE" evidence/inputs
          mkdir -p source/crates/vize_atelier_core/examples
          cp driver/crates/vize_atelier_core/examples/fuzz_expression_10401_profile.rs source/crates/vize_atelier_core/examples/
          cp audit/tools/diagnostics/fuzz-raw-close-10401/observer.rs source/crates/vize_atelier_core/examples/fuzz_expression_raw_close_observe.rs
          git -C source diff --exit-code
          {
            printf 'source_sha=%s\ndriver_sha=%s\naudit_sha=%s\nrole=%s\n' "$SOURCE_SHA" "$DRIVER_SHA" "$AUDIT_SHA" "$ROLE"
            rustc +nightly-2026-10-23 -Vv
            uname -a
            sha256sum "$input" driver/crates/vize_atelier_core/examples/fuzz_expression_10401_profile.rs audit/tools/diagnostics/fuzz-raw-close-10401/observer.rs
            git -C source status --short
          } > evidence/provenance.txt
          target="$RUNNER_TEMP/expression-10401-raw-close-$ROLE-$SOURCE_SHA-$GITHUB_RUN_ID-optimized"
          test ! -e "$target"
          printf 'CARGO_TARGET_DIR=%s\n' "$target" >> "$GITHUB_ENV"
          printf 'target_initially_absent=%s\n' "$target" >> evidence/provenance.txt
      - name: Build unchanged expression profiler and separate observation entry
        working-directory: source
        env:
          CARGO_PROFILE_CI_OPT_DEBUG: "1"
        run: |
          set -euo pipefail
          cargo +nightly-2026-10-23 build --locked --profile ci-opt -p vize_atelier_core --example fuzz_expression_10401_profile --example fuzz_expression_raw_close_observe 2>&1 | tee ../evidence/optimized-build.log
          git diff --exit-code
      - name: Install matching source profiler
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends valgrind
      - name: Replay only separate hashed cases and preserve all observations
        run: |
          set -euo pipefail
          binary="$CARGO_TARGET_DIR/ci-opt/examples/fuzz_expression_10401_profile"
          observer="$CARGO_TARGET_DIR/ci-opt/examples/fuzz_expression_raw_close_observe"
          sha256sum "$binary" "$observer" > evidence/binary-sha256.txt
          python3 audit/tools/diagnostics/fuzz-raw-close-10401/replay.py \
            --binary "$binary" --observer "$observer" --role "$ROLE" --source-sha "$SOURCE_SHA" \
            --manifest evidence/inputs/manifest.json --out evidence/replay --callgrind
      - name: Retain raw measurements, complete packets and profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: raw-close-${{ matrix.role }}-${{ matrix.source }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
  compare-control-packets:
    name: Raw-close complete AST, comments, errors and counter comparison
    needs: profile
    if: always()
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: audit
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: raw-close-*
          path: evidence
      - name: Require original 91 packets and every separate full packet to agree
        run: |
          set -euo pipefail
          baseline=evidence/raw-close-baseline-3a4bf713f85589a50da5d0a7aaf8ae33fdcdc004
          candidate=evidence/raw-close-candidate-7bd29589171cdaae96aacca6ee7b213ea6dd347b
          python3 audit/tools/diagnostics/fuzz-raw-close-10401/compare.py \
            "$baseline/replay" "$candidate/replay" --manifest "$baseline/inputs/manifest.json" \
            --pins audit/tools/diagnostics/fuzz-raw-close-10401/pins.json > evidence/audit-summary.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: raw-close-summary-${{ github.sha }}
          path: evidence/audit-summary.json
          if-no-files-found: error
          retention-days: 30
