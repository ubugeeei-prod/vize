name: Content Mapper Cold Start

on:
  pull_request:
    paths:
      - .github/workflows/content-mapper-cold-start.yml
      - crates/vize/Cargo.toml
      - crates/vize/src/bin/vize-content-mapper.rs
      - crates/vize/src/lib.rs
      - crates/vize/tests/content_mapper_tsgo_cli/memo_expression.rs
      - tests/tooling/content-mapper-process-receipt.test.ts
      - tools/support/compat/content-mapper/process-receipt.ts
      - tools/support/release/type-admission-mapper-host.ts
  merge_group:
  workflow_dispatch:

concurrency:
  group: content-mapper-cold-start-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  macos-arm64:
    runs-on: blacksmith-12vcpu-macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: content-mapper-cold-start
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Prepare the exact macOS Content Mapper host
        run: |
          set -euo pipefail
          provider="$RUNNER_TEMP/cold-content-mapper-host"
          proof="$RUNNER_TEMP/cold-content-mapper-host-proof"
          receipts="$RUNNER_TEMP/cold-content-mapper-receipts"
          mkdir -p "$receipts"
          env -u GH_TOKEN -u GITHUB_TOKEN -u NODE_AUTH_TOKEN -u NPM_TOKEN -u NODE_OPTIONS -u NODE_PATH \
            node tools/support/release/type-admission-mapper-host.ts "$provider" "$proof"
          runtime="$provider/node_modules/@typescript/typescript-darwin-arm64/lib/tsc"
          test -x "$runtime"
          printf 'VIZE_TEST_MEMO_CONTENT_MAPPER_TSGO=%s\n' "$runtime" >> "$GITHUB_ENV"
          printf 'VIZE_TEST_MEMO_PROCESS_RECEIPT_DIR=%s\n' "$receipts" >> "$GITHUB_ENV"
          printf 'VIZE_TEST_NODE=%s\n' "$(command -v node)" >> "$GITHUB_ENV"
          printf 'VIZE_TEST_REQUIRE_TSGO=1\n' >> "$GITHUB_ENV"
      - name: Capture the first post-build mapper process
        run: >-
          cargo test --locked -p vize --test integration --
          content_mapper_tsgo_cli::memo_expression::memo_dependencies_check_members_and_preserve_unused_controls
          --exact --nocapture --test-threads=1
      - name: Upload mapper process and provider receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: content-mapper-cold-start-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cold-content-mapper-receipts/
            ${{ runner.temp }}/cold-content-mapper-host-proof/
          if-no-files-found: error
          retention-days: 14
