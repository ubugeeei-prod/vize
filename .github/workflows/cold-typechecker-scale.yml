name: Generated VTS source census
run-name: Profiling-only 1/10/100 public SFC source census at ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      source_parent:
        description: Immutable production parent; no product optimization is included
        type: string
        required: true
        default: 09ff11b5a3440381d4f4558652885ec19520e4f1
permissions: { contents: read }
concurrency:
  group: vts-clone-census-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tiny-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env: { CARGO_BUILD_JOBS: "4", CARGO_INCREMENTAL: "0", RAYON_NUM_THREADS: "4", GOMAXPROCS: "4" }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false, fetch-depth: 8 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version-file: package.json, package-manager-cache: false }
      - name: Preflight graph, schema protocol, source identity and budgets
        env: { SOURCE_PARENT: "${{ inputs.source_parent }}" }
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_PARENT" = 09ff11b5a3440381d4f4558652885ec19520e4f1
          git merge-base --is-ancestor "$SOURCE_PARENT" HEAD
          node --test tests/tooling/vts-clone-census.test.ts
          node tools/benchmarks/scripts/vts-clone-census-preflight.ts "$SOURCE_PARENT"
      - name: Install only the pinned public Vue/checker/schema provider
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/census-provider"
          cd "$RUNNER_TEMP/census-provider"
          node -e 'require("node:fs").writeFileSync("package.json",JSON.stringify({private:true,dependencies:{vue:"3.5.44",typescript:"6.0.3","typescript-native":"npm:typescript@7.1.0-beta",ajv:"8.17.1"}}))'
          npm install --ignore-scripts --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - name: Build one fresh profiling CLI and admit each tiny graph before counts
        shell: bash
        run: |
          set -euo pipefail
          node tools/benchmarks/scripts/vts-clone-census.ts --out "$RUNNER_TEMP/census-evidence" --target "$RUNNER_TEMP/census-target" --provider "$RUNNER_TEMP/census-provider" --runtime "/tmp/vize-vts-census-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Package bounded receipts apart from full public evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/census-evidence"
          cp "$RUNNER_TEMP/census-provider/package.json" "$RUNNER_TEMP/census-provider/package-lock.json" "$RUNNER_TEMP/census-evidence/" 2>/dev/null || true
          tar --exclude='*/node_modules' --exclude='*/binary' -czf "$RUNNER_TEMP/census-raw.tgz" -C "$RUNNER_TEMP" census-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: vts-clone-census-small-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/census-evidence/summary.json
            ${{ runner.temp }}/census-evidence/build.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: vts-clone-census-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/census-raw.tgz
          if-no-files-found: error
          retention-days: 14
