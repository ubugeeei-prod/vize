name: CLI local probe source micro
run-name: Profiling-only local probe operation comparison at ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Immutable legacy source reference only; no old machine binary is timed
        type: string
        required: true
        default: b6127a994f7e2a75eb2c89de44d54cf8a0f17fcd
permissions: { contents: read }
concurrency:
  group: cli-probe-history-micro-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-micro:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: "4"
      RAYON_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version-file: package.json, package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - name: Verify the declared legacy source and run one fresh profiling test image
        env: { LEGACY_SOURCE: "${{ inputs.base_sha }}" }
        shell: bash
        run: |
          set -euo pipefail
          test "$LEGACY_SOURCE" = b6127a994f7e2a75eb2c89de44d54cf8a0f17fcd
          node tools/benchmarks/scripts/cli-probe-history-micro.ts --out "$RUNNER_TEMP/probe-micro" --target "$RUNNER_TEMP/probe-micro-target" --fixture "$RUNNER_TEMP/probe-shared-fixture"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cli-probe-history-micro-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/probe-micro/receipt.json
            ${{ runner.temp }}/probe-micro/build.json
            ${{ runner.temp }}/probe-micro/build-request.json
            ${{ runner.temp }}/probe-micro/fixture-seal.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cli-probe-history-build-raw-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/probe-micro/cargo.stdout.jsonl
            ${{ runner.temp }}/probe-micro/cargo.stderr.log
            ${{ runner.temp }}/probe-micro/legacy.json
            ${{ runner.temp }}/probe-micro/candidate.json
            ${{ runner.temp }}/probe-micro/*.stdout.txt
            ${{ runner.temp }}/probe-micro/*.stderr.txt
          if-no-files-found: error
          retention-days: 14
