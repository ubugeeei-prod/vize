name: CLI local probe normal source
run-name: Unprofiled OPT3 local probe source comparison at ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      source_head:
        description: Immutable production candidate; this branch only adds the normal carrier
        type: string
        required: true
        default: b9dd2d2c77af20e8b5329abc1ba98f9537ca3fdf
permissions: { contents: read }
concurrency:
  group: cli-probe-history-normal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  normal-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: "4"
      RAYON_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version-file: package.json, package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - name: Verify the declared source and run one fresh normal optimized image
        env: { SOURCE_HEAD: "${{ inputs.source_head }}" }
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_HEAD" = b9dd2d2c77af20e8b5329abc1ba98f9537ca3fdf
          test "$(git rev-parse HEAD^)" = "$SOURCE_HEAD"
          node tools/benchmarks/scripts/cli-probe-history-normal.ts --out "$RUNNER_TEMP/probe-normal" --target "$RUNNER_TEMP/probe-normal-target" --fixture "$RUNNER_TEMP/probe-shared-fixture"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cli-probe-history-normal-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/probe-normal/summary.json
            ${{ runner.temp }}/probe-normal/build.json
            ${{ runner.temp }}/probe-normal/build-request.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cli-probe-history-normal-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/probe-normal
          if-no-files-found: error
          retention-days: 14
