name: Cold typechecker scale
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Immutable 40-hex baseline commit distinct from the dispatched source
        type: string
        required: true
      head_sha:
        description: Immutable candidate source for the separate strict paired mode
        type: string
        required: false
      mode:
        description: Full default comparison or the strict ownership experiment
        type: choice
        options: [full, paired-comparison]
        default: full
      sfcs:
        description: Vue SFC count plus the complete authored package dependency graph
        type: choice
        options: ["2500", "10000", "50000"]
        default: "2500"
  pull_request:
    paths:
      - .github/workflows/cold-typechecker-scale.yml
      - tools/benchmarks/scripts/cold-typechecker-scale*.ts
      - tools/benchmarks/scripts/check-workspace.ts
      - tools/benchmarks/scripts/source-operation-perf*.ts
      - tools/benchmarks/scripts/source-pmu-calibration.ts
      - tools/benchmarks/src/pmu_calibration.rs
      - crates/vize/src/commands/check/runner/default_imports.rs
      - crates/vize_canon/src/batch/virtual_project/dependency_scan/resolution.rs
      - crates/vize_canon/src/batch/virtual_project/dependency_scan/resolution/input_history_tests.rs
      - tests/tooling/cold-typechecker-scale*.test.ts
      - tests/tooling/source-operation-perf.test.ts
      - tests/tooling/source-pmu-calibration.test.ts
permissions: { contents: read }
concurrency:
  group: cold-typechecker-scale-${{ github.event.pull_request.number || github.ref }}${{ inputs.mode == 'paired-comparison' && '-paired-comparison' || '' }}
  cancel-in-progress: true
jobs:
  paired-comparison:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'paired-comparison'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions: { contents: read }
    timeout-minutes: 60
    env:
      BASE_SHA: ${{ inputs.base_sha }}
      HEAD_SHA: ${{ inputs.head_sha }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GOMAXPROCS: "8"
      RAYON_NUM_THREADS: "8"
      CARGO_BUILD_JOBS: "8"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false, fetch-depth: 2 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: "24.14.0", package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - name: Select exact product sources and preserve the separate controller identity
        run: |
          set -euo pipefail
          [[ "${{ inputs.sfcs }}" == 2500 ]]
          [[ "$BASE_SHA" == e57fd021bf08b197956807eb122941c9cd13b056 ]]
          [[ "$HEAD_SHA" == d440bf04becabbb71d916915c640d39c8d8c6450 ]]
          mkdir "$RUNNER_TEMP/cold-paired"
          git fetch --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$BASE_SHA" "$HEAD_SHA"
          git worktree add --detach "$RUNNER_TEMP/cold-paired-base" "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/cold-paired-head" "$HEAD_SHA"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/cold-paired/driver.txt"
      - name: Install the exact source-pinned provider graph
        run: |
          set -euo pipefail
          [[ "$(node --version)" == v24.14.0 ]]
          [[ "$(npm --version)" == 11.9.0 ]]
          mkdir "$RUNNER_TEMP/provider"
          cp tests/_fixtures/tooling/owned-read-buffer-provider/package.json.txt "$RUNNER_TEMP/provider/package.json"
          cp tests/_fixtures/tooling/owned-read-buffer-provider/package-lock.json.txt "$RUNNER_TEMP/provider/package-lock.json"
          cd "$RUNNER_TEMP/provider"
          printf '%s\n' 'bb62ff5452cbfd7866d232c6e1a78d1d7b6d82ec5f6cbf67e08aa6deff9c324e  package.json' '9c2974672b5f5358e643276e6ec98c6084681ef609e8f25922ba4aa7adb0f0a6  package-lock.json' | sha256sum --check -
          npm ci --ignore-scripts --no-audit --no-fund
          cp package.json package-lock.json "$RUNNER_TEMP/cold-paired/"
      - name: Refuse changed inputs, native bytes and unsupported modes
        run: |
          set -euo pipefail
          mkdir -p node_modules
          ln -s "$RUNNER_TEMP/provider/node_modules/typescript" node_modules/typescript
          node --test tests/tooling/cold-typechecker-scale-native-forward.test.ts tests/tooling/cold-typechecker-scale-paired.test.ts tests/tooling/cold-typechecker-scale-strict-pair.test.ts tests/tooling/cold-typechecker-scale-read-buffer.test.ts
      - name: Build normal exact base and head with equal compiler settings
        run: |
          set -euo pipefail
          for role in base head; do
            node tools/benchmarks/scripts/cold-typechecker-scale-build.ts --source-root "$RUNNER_TEMP/cold-paired-$role" --target-dir "$RUNNER_TEMP/cold-paired-builds/$role" --binary "$RUNNER_TEMP/cold-paired/binaries/$role/vize" --receipt "$RUNNER_TEMP/cold-paired/builds/$role.json" --role "normal-$role"
          done
          node tools/benchmarks/scripts/cold-typechecker-scale-build.ts --base-receipt "$RUNNER_TEMP/cold-paired/builds/base.json" --head-receipt "$RUNNER_TEMP/cold-paired/builds/head.json" --receipt "$RUNNER_TEMP/cold-paired/builds/pair.json"
      - name: Build separate read-buffer instrumentation after normal image sealing
        run: |
          set -euo pipefail
          for role in base head; do
            source_sha="$BASE_SHA"
            if [[ "$role" == head ]]; then source_sha="$HEAD_SHA"; fi
            node tools/benchmarks/scripts/cold-typechecker-scale-read-buffer.ts "$RUNNER_TEMP/cold-paired-$role" "$source_sha" "$RUNNER_TEMP/cold-read-probe-$role" "$RUNNER_TEMP/cold-paired/instrumented/$role"
          done
      - name: Require full output and read ownership observations before four balanced pairs
        run: |
          set -euo pipefail
          export VIZE_BENCH_CPU_SET=$(node tools/benchmarks/scripts/cold-typechecker-scale-affinity.ts)
          taskset -c "$VIZE_BENCH_CPU_SET" node tools/benchmarks/scripts/cold-typechecker-scale-paired.ts --provider "$RUNNER_TEMP/provider" --out "$RUNNER_TEMP/cold-paired/observations" --base "$RUNNER_TEMP/cold-paired/builds/base.json" --head "$RUNNER_TEMP/cold-paired/builds/head.json"
      - name: Preserve every raw pair, native observation, control and source receipt
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cold-paired"
          tar --exclude='*/project' --exclude='*/xdg-cache' --exclude='*/tmp' --exclude='*/binaries' --exclude='*/binary' --exclude='*/target' -czf "$RUNNER_TEMP/cold-paired-evidence.tgz" -C "$RUNNER_TEMP" cold-paired
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cold-typechecker-paired-${{ inputs.head_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/cold-paired-evidence.tgz
          retention-days: 14
  profile:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'full'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      VIZE_BENCH_SFCS: ${{ inputs.sfcs || '2500' }}
      BASE_SHA: ${{ inputs.base_sha }}
      BENCH_EVENT: ${{ github.event_name }}
      PR_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GOMAXPROCS: "8"
      RAYON_NUM_THREADS: "8"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false, fetch-depth: 2 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version-file: package.json, package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - name: Validate the full SFC cohort
        run: |
          [[ "$VIZE_BENCH_SFCS" =~ ^(2500|10000|50000)$ ]]
          baseline_selection=$(node tools/benchmarks/scripts/cold-typechecker-scale-build.ts --select-baseline --receipt "$RUNNER_TEMP/cold-scale/baseline-selection.json")
          [[ "$baseline_selection" =~ ^BASE_SHA=[0-9a-f]{40}$ ]]
          printf '%s\n' "$baseline_selection" >> "$GITHUB_ENV"
          bench_support_scripts=$(node --input-type=module -e 'import {coldScaleSupportScriptFiles} from "./tools/benchmarks/scripts/cold-typechecker-scale.ts"; console.log(coldScaleSupportScriptFiles);')
          printf 'VIZE_BENCH_FILES=%s\n' "$((VIZE_BENCH_SFCS + bench_support_scripts))" >> "$GITHUB_ENV"
      - name: Install fixed comparison providers
        run: |
          mkdir "$RUNNER_TEMP/provider"
          cd "$RUNNER_TEMP/provider"
          cat > package.json <<'JSON'
          {"private":true,"dependencies":{"vize":"0.596.0","@vizejs/native":"0.596.0","vue":"3.6.0-rc.13","typescript":"6.0.3","typescript-native":"npm:typescript@7.1.0-beta","vue-tsc":"3.3.13"}}
          JSON
          npm install --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/cold-scale"
          cp package.json package-lock.json "$RUNNER_TEMP/cold-scale/"
      - name: Build the exact base and head with equal symbol settings
        run: |
          git fetch --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          mkdir -p "$RUNNER_TEMP/cold-scale"
          git rev-parse HEAD > "$RUNNER_TEMP/cold-scale/head.sha"
          git -C "$RUNNER_TEMP/base" rev-parse HEAD > "$RUNNER_TEMP/cold-scale/base.sha"
          for source in base head; do
            source_root="$GITHUB_WORKSPACE"
            if [[ "$source" == base ]]; then source_root="$RUNNER_TEMP/base"; fi
            node tools/benchmarks/scripts/cold-typechecker-scale-build.ts --source-root "$source_root" --target-dir "$RUNNER_TEMP/cold-builds/normal-$source" --binary "$RUNNER_TEMP/cold-scale/binaries/normal-$source/vize" --receipt "$RUNNER_TEMP/cold-scale/builds/normal-$source.json" --role "normal-$source"
          done
          node tools/benchmarks/scripts/cold-typechecker-scale-build.ts --base-receipt "$RUNNER_TEMP/cold-scale/builds/normal-base.json" --head-receipt "$RUNNER_TEMP/cold-scale/builds/normal-head.json" --receipt "$RUNNER_TEMP/cold-scale/builds/normal-pair.json"
      - name: Compare fresh processes and independent authored diagnostic controls
        run: |
          bench_cpu_set=$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:8])))')
          for round in 1 2 3; do
            order='base head'
            if [[ "$round" == 2 ]]; then order='head base'; fi
            for source in $order; do
              taskset -c "$bench_cpu_set" node tools/benchmarks/scripts/cold-typechecker-scale.ts --provider "$RUNNER_TEMP/provider" --files "$VIZE_BENCH_FILES" --tool cli --binary "$RUNNER_TEMP/cold-scale/binaries/normal-$source/vize" --out "$RUNNER_TEMP/cold-scale/$source-$round"
            done
          done
          for tool in mapper vue-tsc; do
            taskset -c "$bench_cpu_set" node tools/benchmarks/scripts/cold-typechecker-scale.ts --provider "$RUNNER_TEMP/provider" --files "$VIZE_BENCH_FILES" --tool "$tool" --out "$RUNNER_TEMP/cold-scale/$tool"
          done
          for tool in cli mapper vue-tsc; do
            args=()
            if [[ "$tool" == cli ]]; then args+=(--binary "$RUNNER_TEMP/cold-scale/binaries/normal-head/vize"); fi
            taskset -c "$bench_cpu_set" node tools/benchmarks/scripts/cold-typechecker-scale.ts --provider "$RUNNER_TEMP/provider" --files "$VIZE_BENCH_FILES" --tool "$tool" --invalid "${args[@]}" --out "$RUNNER_TEMP/cold-scale/control-$tool"
          done
      - name: Build allocation instrumentation separately from timing binaries
        run: |
          for source in base head; do
            source_root="$GITHUB_WORKSPACE"
            if [[ "$source" == base ]]; then source_root="$RUNNER_TEMP/base"; fi
            node tools/benchmarks/scripts/cold-typechecker-scale-build.ts --source-root "$source_root" --target-dir "$RUNNER_TEMP/cold-builds/profile-$source" --binary "$RUNNER_TEMP/vize-profile-$source" --receipt "$RUNNER_TEMP/cold-scale/builds/profile-$source.json" --role "profile-$source" --allocation
          done
          node tools/benchmarks/scripts/cold-typechecker-scale-build.ts --base-receipt "$RUNNER_TEMP/cold-scale/builds/profile-base.json" --head-receipt "$RUNNER_TEMP/cold-scale/builds/profile-head.json" --receipt "$RUNNER_TEMP/cold-scale/builds/profile-pair.json"
      - name: Capture paired Rust allocation spans without CPU sampling overhead
        timeout-minutes: 10
        run: |
          bench_cpu_set=$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:8])))')
          for source in base head; do
            taskset -c "$bench_cpu_set" node tools/benchmarks/scripts/cold-typechecker-scale.ts --provider "$RUNNER_TEMP/provider" --files "$VIZE_BENCH_FILES" --tool profile --binary "$RUNNER_TEMP/vize-profile-$source" --out "$RUNNER_TEMP/cold-scale/profile-$source"
          done
          node --input-type=module -e 'import fs from "node:fs"; for (const source of ["base","head"]) { const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/cold-scale/profile-"+source+"/profile.json")); if(!x.allocation)throw Error("allocation instrumentation missing"); }'
      - name: Capture direct normal-process PMU counters and bounded source stacks
        timeout-minutes: 15
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends linux-tools-generic llvm
          sudo sysctl -w kernel.perf_event_paranoid=0
          bench_cpu_set=$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:8])))')
          perf_bin=""
          for bench_perf_candidate in /usr/lib/linux-tools/*/perf /usr/lib/linux-tools-*/perf; do
            if [[ -x "$bench_perf_candidate" ]]; then perf_bin="$bench_perf_candidate"; break; fi
          done
          test -n "$perf_bin"
          llvm-addr2line --version > "$RUNNER_TEMP/cold-scale/addr2line-version.txt"
          taskset -c "$bench_cpu_set" node tools/benchmarks/scripts/source-pmu-calibration.ts --binary "$RUNNER_TEMP/cold-scale/pmu-calibration" --perf "$perf_bin" --out "$RUNNER_TEMP/cold-scale/pmu-controls"
          calibration="$RUNNER_TEMP/cold-scale/pmu-controls/calibration.json"
          for source in base head; do
            source_sha=$(cat "$RUNNER_TEMP/cold-scale/$source.sha")
            for events in core cache; do
              taskset -c "$bench_cpu_set" node tools/benchmarks/scripts/cold-typechecker-scale-profile.ts --provider "$RUNNER_TEMP/provider" --files "$VIZE_BENCH_FILES" --tool cli --mode stat --events "$events" --calibration "$calibration" --binary "$RUNNER_TEMP/cold-scale/binaries/normal-$source/vize" --source "$source_sha" --perf "$perf_bin" --out "$RUNNER_TEMP/cold-scale/stat-$events-$source"
            done
          done
          for events in core cache; do
            taskset -c "$bench_cpu_set" node tools/benchmarks/scripts/cold-typechecker-scale-profile.ts --provider "$RUNNER_TEMP/provider" --files "$VIZE_BENCH_FILES" --tool mapper --mode stat --events "$events" --calibration "$calibration" --source 'public-vize-0.596.0' --perf "$perf_bin" --out "$RUNNER_TEMP/cold-scale/stat-$events-mapper"
          done
          taskset -c "$bench_cpu_set" node tools/benchmarks/scripts/cold-typechecker-scale-profile.ts --provider "$RUNNER_TEMP/provider" --files "$VIZE_BENCH_FILES" --tool mapper --mode record --source 'public-vize-0.596.0' --perf "$perf_bin" --addr2line /usr/bin/llvm-addr2line --out "$RUNNER_TEMP/cold-scale/record-mapper"
          source_sha=$(cat "$RUNNER_TEMP/cold-scale/head.sha")
          taskset -c "$bench_cpu_set" node tools/benchmarks/scripts/cold-typechecker-scale-profile.ts --provider "$RUNNER_TEMP/provider" --files "$VIZE_BENCH_FILES" --tool cli --mode record --binary "$RUNNER_TEMP/cold-scale/binaries/normal-head/vize" --source "$source_sha" --perf "$perf_bin" --addr2line /usr/bin/llvm-addr2line --out "$RUNNER_TEMP/cold-scale/record-head"
      - name: Package evidence without traversing workspace links
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/cold-scale"
          tar --exclude='*/project' --exclude='*/xdg-cache' --exclude='*/tmp' -czf "$RUNNER_TEMP/cold-scale-evidence.tgz" -C "$RUNNER_TEMP" cold-scale
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cold-typechecker-scale-${{ github.sha }}
          path: ${{ runner.temp }}/cold-scale-evidence.tgz
          retention-days: 14
