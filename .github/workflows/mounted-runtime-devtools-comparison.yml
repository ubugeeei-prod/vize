name: Mounted runtime devtools comparison

on:
  pull_request:
    paths:
      - "tests/tooling/support/mounted-runtime-devtools.ts"
      - "tests/tooling/mounted-runtime-devtools.test.ts"
      - "tests/tooling/support/davinci-mounted-trace.mjs"
      - "tests/tooling/support/davinci-transition-trace.mjs"
      - "tests/tooling/support/vue-vapor-release.mjs"
      - "tools/support/compat/github/compare-mounted-runtime-devtools.ts"
      - ".github/workflows/mounted-runtime-devtools-comparison.yml"
  workflow_dispatch:
    inputs:
      custody_scope:
        type: choice
        default: mounted
        options:
          - mounted
          - original-shard-2

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_BUILD_JOBS: "12"
  VIZE_TEST_REQUIRE_TSGO: "1"

jobs:
  child-custody:
    name: Historical mounted child diagnostic custody
    if: github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 35
    permissions: { contents: read, actions: read }
    env:
      CUSTODY_SCOPE: ${{ inputs.custody_scope }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: "1.99.0"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: nextest-ci
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Snapshot diagnostic tools and select the literal historical source
        run: |
          set -euo pipefail
          source_sha=1d0f18e51a73f627922690bc4592689c927e080e
          source_tree=2a6355da2e5ddeb9024d2784d51a75709c0e6365
          orchestration_sha="$(git rev-parse HEAD)"
          diagnostic_tools="$RUNNER_TEMP/mounted-child-diagnostic-tools"
          custody="$RUNNER_TEMP/mounted-child-custody"
          mkdir -p "$diagnostic_tools" "$custody/cores"
          cp tools/support/compat/github/mounted-child-custody.cjs tools/support/compat/github/mounted-child-saturation.py "$diagnostic_tools/"
          cp -R tools/support/compat/github/mounted-child-capsule "$diagnostic_tools/"
          for file in mounted-child-custody.cjs mounted-child-saturation.py mounted-child-capsule/input.json.bin mounted-child-capsule/stdout.json.bin; do
            cmp "tools/support/compat/github/$file" "$diagnostic_tools/$file"
          done
          (cd "$diagnostic_tools" && sha256sum mounted-child-custody.cjs mounted-child-saturation.py mounted-child-capsule/input.json.bin mounted-child-capsule/stdout.json.bin) > "$custody/diagnostic-tools.sha256"
          (cd "$diagnostic_tools" && printf '%s  %s\n' 6419fea8a049f0c000d0a637380d2e601160dc404a3a758ae5be2f27b78b6722 mounted-child-capsule/input.json.bin 06e73bd399d2cb2cd7753173b6c07d527835da5eb4489b1e1ff72ac65bf7f511 mounted-child-capsule/stdout.json.bin | sha256sum --check)
          git fetch --no-tags origin "$source_sha"
          git checkout --detach "$source_sha"
          test "$(git rev-parse HEAD)" = "$source_sha"
          test "$(git rev-parse HEAD^{tree})" = "$source_tree"
          git diff --exit-code "$source_sha" HEAD -- crates davinci npm tests Cargo.toml Cargo.lock package.json pnpm-lock.yaml pnpm-workspace.yaml rust-toolchain.toml tools
          (cd "$diagnostic_tools" && sha256sum --check "$custody/diagnostic-tools.sha256")
          printf 'orchestration=%s\nreplay=%s\ntree=%s\n' "$orchestration_sha" "$source_sha" "$source_tree" > "$custody/source.txt"
          git rev-parse HEAD HEAD^{tree} > "$custody/archive-source.txt"
          echo "VIZE_MOUNTED_CHILD_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "VIZE_MOUNTED_CHILD_CUSTODY=$custody" >> "$GITHUB_ENV"
          if [[ "$CUSTODY_SCOPE" == original-shard-2 ]]; then
            echo "VIZE_TEST_DISABLE_TSGO=1" >> "$GITHUB_ENV"
            echo "VIZE_NUXT_CONFIG_ITERATIONS=100" >> "$GITHUB_ENV"
          fi
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - name: Install the selected historical pinned dependencies
        run: |
          set -euo pipefail
          if [[ "$CUSTODY_SCOPE" == original-shard-2 ]]; then unset VIZE_TEST_REQUIRE_TSGO; fi
          vp install --frozen-lockfile --prefer-offline
      - uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1
        with:
          tool: cargo-nextest@0.9.146
          checksum: true
          fallback: cargo-binstall
      - name: Install the original pinned Pkl fixture runtime
        if: inputs.custody_scope == 'original-shard-2'
        run: npm install --global @pkl-community/pkl@0.27.2
      - name: Download the untouched original failed worker archive
        if: inputs.custody_scope == 'original-shard-2'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-test-archive-38027451698-1d0f18e51a73f627922690bc4592689c927e080e
          run-id: 38027451698
          github-token: ${{ github.token }}
          path: .artifacts/rust-test-archive
      - name: Verify every original archive receipt field
        if: inputs.custody_scope == 'original-shard-2'
        run: |
          set -euo pipefail
          node tools/support/compat/github/rust-test-archive.mjs verify .artifacts/rust-test-archive/tests.tar.zst .artifacts/rust-test-archive/receipt.json
          cp .artifacts/rust-test-archive/receipt.json "$VIZE_MOUNTED_CHILD_CUSTODY/original-archive-receipt.json"
      - name: Run the unchanged historical tests with diagnostic capture
        env:
          RUST_TEST_THREADS: "4"
        run: |
          set -euo pipefail
          ulimit -c unlimited
          sudo sysctl -w "kernel.core_pattern=$VIZE_MOUNTED_CHILD_CUSTODY/cores/core.%p" > "$VIZE_MOUNTED_CHILD_CUSTODY/core-pattern.txt"
          export NODE_OPTIONS="${NODE_OPTIONS:-} --require=$RUNNER_TEMP/mounted-child-diagnostic-tools/mounted-child-custody.cjs"
          export VIZE_MOUNTED_TRACE_OBSERVATIONS=1
          if [[ "$CUSTODY_SCOPE" == original-shard-2 ]]; then
            unset VIZE_TEST_REQUIRE_TSGO
            export VIZE_MOUNTED_CHILD_ROLE=original-workspace-shard-2
            mkdir -p target/tmp
            cargo nextest run --archive-file .artifacts/rust-test-archive/tests.tar.zst --extract-to "$GITHUB_WORKSPACE" --extract-overwrite --workspace-remap "$GITHUB_WORKSPACE" --profile pr --partition hash:2/4 --no-tests=pass 2>&1 | tee "$VIZE_MOUNTED_CHILD_CUSTODY/original-tests.log"
          else
            cargo nextest run --locked --cargo-profile ci --profile pr --package vize_atelier_vapor --test davinci_mounted_behavior --test-threads 4 --no-fail-fast 2>&1 | tee "$VIZE_MOUNTED_CHILD_CUSTODY/original-tests.log"
          fi
      - name: Verify labeled core custody and saturate the unchanged failing input
        run: |
          set -euo pipefail
          ulimit -c unlimited
          export NODE_OPTIONS="${NODE_OPTIONS:-} --require=$RUNNER_TEMP/mounted-child-diagnostic-tools/mounted-child-custody.cjs"
          set +e
          VIZE_MOUNTED_CHILD_ROLE=controlled-sigsegv node -e 'process.kill(process.pid, "SIGSEGV")' > "$VIZE_MOUNTED_CHILD_CUSTODY/controlled-sigsegv.stdout" 2> "$VIZE_MOUNTED_CHILD_CUSTODY/controlled-sigsegv.stderr"
          status=$?
          set -e
          echo "$status" > "$VIZE_MOUNTED_CHILD_CUSTODY/controlled-sigsegv.status"
          test "$status" -eq 139
          if [[ "$CUSTODY_SCOPE" == original-shard-2 ]]; then unset VIZE_TEST_REQUIRE_TSGO; fi
          python3 "$RUNNER_TEMP/mounted-child-diagnostic-tools/mounted-child-saturation.py"
      - name: Retain replay core backtraces without changing failed exits
        if: ${{ always() }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cores=("$RUNNER_TEMP/mounted-child-custody/cores/"core.*)
          if (( ${#cores[@]} == 0 )); then exit 0; fi
          sudo apt-get update
          sudo apt-get install -y gdb
          for core in "${cores[@]}"; do
            child_pid="${core##*.}"
            packet="$RUNNER_TEMP/mounted-child-custody/$child_pid-0-start.json"
            executable="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).executable.retained)' "$packet")"
            gdb --batch -iex "set sysroot $RUNNER_TEMP/mounted-child-custody/sysroot" -ex 'set pagination off' -ex 'info sharedlibrary' -ex 'thread apply all bt full' "$executable" "$core" > "$core.backtrace" 2>&1
          done
      - name: Preserve replay outcomes and pathname byte snapshots
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mounted-child-custody-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mounted-child-custody/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
  compare:
    name: Baseline and fresh observer runtime parity
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: "1.99.0"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: nextest-ci
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - name: Install exact pinned dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Build the unchanged Transition parity test once
        run: cargo test --profile ci --package vize_atelier_vapor --test davinci_transition_parity --no-run
      - name: Compare complete traces and all fresh subprocesses
        run: vp exec node tools/support/compat/github/compare-mounted-runtime-devtools.ts "$RUNNER_TEMP/mounted-runtime-devtools-comparison"
      - name: Retain complete traces, lifecycle events and timing evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mounted-runtime-devtools-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mounted-runtime-devtools-comparison/
          if-no-files-found: error
          retention-days: 14
