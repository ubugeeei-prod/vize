name: Checker constructor emitter parity

on:
  workflow_dispatch:
    inputs:
      base-sha:
        description: "Exact source baseline for complete existing projection parity"
        required: true
        type: string
      qualify-input-ownership:
        description: "Validate the composed product tree with all144 unchanged generic packets and actual mapper allocation observations"
        type: boolean
        default: false
      measure-source:
        description: "Capture optimized source-API allocation requests and paired timing"
        type: boolean
        default: false
  pull_request:
    paths:
      - "crates/vize_canon/src/virtual_ts/generator/component_constructors.rs"
      - "crates/vize_canon/src/virtual_ts/generator/component_constructors/**"
      - "crates/vize_canon/src/virtual_ts/props.rs"
      - "crates/vize_canon/tests/constructor_emission_projection.rs"
      - ".github/workflows/checker-constructor-emitter.yml"

permissions: { contents: read }

concurrency:
  group: constructor-emitter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.title, 'refactor(canon)') || startsWith(github.event.pull_request.title, 'perf(canon)')
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "24"
      CARGO_INCREMENTAL: "0"
      BASE_SHA: ${{ inputs.base-sha || github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          {
            ref: "${{ github.event.pull_request.head.sha || github.sha }}",
            fetch-depth: 0,
            persist-credentials: false,
          }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: "package.json", package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with: { key: test-scripts, cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}" }
      - name: Capture exact base and head through the identical observation harness
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]
          capture="$RUNNER_TEMP/constructor-emitter"
          baseline="$RUNNER_TEMP/constructor-base"
          mkdir -p "$capture"
          git worktree add --detach "$baseline" "$BASE_SHA"
          observer=crates/vize_canon/tests/constructor_emission_projection.rs
          cp "$observer" "$baseline/$observer"
          cmp "$observer" "$baseline/$observer"
          git -C "$baseline" diff --exit-code -- crates/vize_canon/src
          (cd "$baseline" && CARGO_TARGET_DIR="$RUNNER_TEMP/constructor-target-base" VIZE_CONSTRUCTOR_PROJECTION_CAPTURE="$capture/base.json" cargo test --locked --profile ci -p vize_canon --test constructor_emission_projection complete_constructor_projection_packets -- --exact --nocapture) > "$capture/base.log" 2>&1
          CARGO_TARGET_DIR="$RUNNER_TEMP/constructor-target-head" VIZE_CONSTRUCTOR_PROJECTION_CAPTURE="$capture/head.json" cargo test --locked --profile ci -p vize_canon --test constructor_emission_projection complete_constructor_projection_packets -- --exact --nocapture > "$capture/head.log" 2>&1
      - name: Retain isolated compiled observer custody
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, readdirSync, realpathSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const capture = path.join(process.env.RUNNER_TEMP, 'constructor-emitter');
          const sha256 = file => createHash('sha256').update(readFileSync(file)).digest('hex');
          const rows = ['base', 'head'].map(side => {
            const target = realpathSync(path.join(process.env.RUNNER_TEMP, `constructor-target-${side}`));
            const directory = path.join(target, 'ci/deps');
            const candidates = readdirSync(directory).filter(name => /^constructor_emission_projection-[a-f0-9]+$/.test(name));
            assert.equal(candidates.length, 1);
            const binary = realpathSync(path.join(directory, candidates[0]));
            assert.ok(binary.startsWith(target + path.sep));
            return { side, source: side === 'base' ? process.env.BASE_SHA : process.env.HEAD_SHA, target, binary, sha256: sha256(binary) };
          });
          assert.notEqual(rows[0].target, rows[1].target);
          assert.notEqual(rows[0].binary, rows[1].binary);
          writeFileSync(path.join(capture, 'compiled-observers.json'), JSON.stringify(rows, null, 2) + '\n');
          JS
      - name: Compare complete generated bytes, projection mappings and semantic links
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const directory = `${process.env.RUNNER_TEMP}/constructor-emitter`;
          const baseBytes = readFileSync(`${directory}/base.json`);
          const headBytes = readFileSync(`${directory}/head.json`);
          const base = JSON.parse(baseBytes), head = JSON.parse(headBytes);
          assert.equal(base.length, 228);
          assert.equal(head.length, 228);
          assert.deepEqual(head, base, 'complete checker/mapper projection packets must be unchanged');
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const observer = readFileSync('crates/vize_canon/tests/constructor_emission_projection.rs');
          const receipt = { base: process.env.BASE_SHA, head: process.env.HEAD_SHA, observerSha256: hash(observer), basePacketSha256: hash(baseBytes), headPacketSha256: hash(headBytes), completePackets: head.length, scope: 'Exact source projection parity; not native type-engine or publication acceptance' };
          writeFileSync(`${directory}/receipt.json`, JSON.stringify(receipt, null, 2) + '\n');
          console.log(JSON.stringify(receipt));
          JS
      - name: Measure optimized source APIs on the identical base and head observer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.measure-source }}
        shell: bash
        run: |
          set -euo pipefail
          capture="$RUNNER_TEMP/constructor-emitter"
          baseline="$RUNNER_TEMP/constructor-base"
          observer=tools/benchmarks/probes/generic_parameter_profile.rs
          integration=crates/vize_canon/tests/generic_parameter_profile.rs
          cp "$observer" "$integration"
          cp "$observer" "$baseline/$integration"
          cmp "$observer" "$integration"
          cmp "$observer" "$baseline/$integration"
          (cd "$baseline" && CARGO_TARGET_DIR="$RUNNER_TEMP/constructor-target-base" VIZE_GENERIC_PARAMETER_PROFILE_CWD="$RUNNER_TEMP/constructor-profile-cwd" VIZE_GENERIC_PARAMETER_PROFILE_CAPTURE="$capture/profile-base.json" cargo test --locked --profile ci-opt -p vize_canon --test generic_parameter_profile complete_source_generic_parameter_profile -- --exact --ignored --nocapture) > "$capture/profile-base.log" 2>&1
          CARGO_TARGET_DIR="$RUNNER_TEMP/constructor-target-head" VIZE_GENERIC_PARAMETER_PROFILE_CWD="$RUNNER_TEMP/constructor-profile-cwd" VIZE_GENERIC_PARAMETER_PROFILE_CAPTURE="$capture/profile-head.json" cargo test --locked --profile ci-opt -p vize_canon --test generic_parameter_profile complete_source_generic_parameter_profile -- --exact --ignored --nocapture > "$capture/profile-head.log" 2>&1
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const directory = `${process.env.RUNNER_TEMP}/constructor-emitter`;
          const read = name => JSON.parse(readFileSync(`${directory}/${name}`));
          const base = read('profile-base.json'), head = read('profile-head.json');
          assert.equal(base.rows.length, 6); assert.equal(head.rows.length, 6);
          assert.equal(base.workingDirectory, head.workingDirectory);
          const median = values => [...values].sort((a, b) => a - b)[1];
          const rows = head.rows.map((current, index) => {
            const previous = base.rows[index];
            assert.deepEqual([current.case, current.mapper, current.source, current.iterationsPerSample], [previous.case, previous.mapper, previous.source, previous.iterationsPerSample]);
            if (current.case !== 'literal') assert.deepEqual(current.packet, previous.packet);
            else {
              assert.notDeepEqual(current.packet, previous.packet, 'quoted generic fixture must reach the repaired production projection');
              const expectedProps = "export type Props<T extends 'a,b' = 'a,b', U extends `x,${string}` = 'x,y', F extends (left: T, right: U) => readonly [T, U] = (left: T, right: U) => readonly [T, U]> = Awaited<ReturnType<typeof __setup<T, U, F>>>[\"__vize_setup_props\"];";
              const declarations = packet => (packet.text ?? packet.virtual_ts).split('\n').filter(line => line.startsWith('export type Props<'));
              assert.deepEqual(declarations(current.packet), [expectedProps], 'head must emit the complete independently authored literal contract');
              assert.notDeepEqual(declarations(previous.packet), [expectedProps], 'baseline must retain the original quoted-comma corruption');
            }
            return { case: current.case, mapper: current.mapper, iterationsPerSample: current.iterationsPerSample,
              baseAllocationCalls: previous.allocationCallsPerSample, headAllocationCalls: current.allocationCallsPerSample,
              baseRequestedBytes: previous.requestedBytesPerSample, headRequestedBytes: current.requestedBytesPerSample,
              baseMedianNanoseconds: median(previous.samplesNanoseconds), headMedianNanoseconds: median(current.samplesNanoseconds) };
          });
          const sha256 = path => createHash('sha256').update(readFileSync(path)).digest('hex');
          const binaries = ['base', 'head'].map(side => {
            const target = path.join(process.env.RUNNER_TEMP, `constructor-target-${side}`);
            const directory = path.join(target, 'ci-opt/deps');
            const candidates = readdirSync(directory).filter(name => /^generic_parameter_profile-[a-f0-9]+$/.test(name));
            assert.equal(candidates.length, 1);
            const binary = path.join(directory, candidates[0]);
            return { side, binary, sha256: sha256(binary) };
          });
          assert.notEqual(binaries[0].binary, binaries[1].binary);
          assert.notEqual(binaries[0].sha256, binaries[1].sha256, 'the repaired literal control must come from different source executables');
          const receipt = { base: process.env.BASE_SHA, head: process.env.HEAD_SHA,
            binaries, profile: 'ci-opt', observerSha256: sha256('tools/benchmarks/probes/generic_parameter_profile.rs'),
            basePacketSha256: sha256(`${directory}/profile-base.json`), headPacketSha256: sha256(`${directory}/profile-head.json`),
            scope: head.scope, workingDirectory: head.workingDirectory, allocationDefinition: head.allocationDefinition, rows };
          writeFileSync(`${directory}/profile-receipt.json`, JSON.stringify(receipt, null, 2) + '\n');
          console.log(JSON.stringify(receipt));
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: constructor-emitter-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/constructor-emitter
          if-no-files-found: error
          retention-days: 7

  composed-input-ownership:
    if: github.event_name == 'workflow_dispatch' && inputs.qualify-input-ownership
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 25
    permissions: { contents: read, actions: read }
    env:
      CARGO_BUILD_JOBS: "24"
      CARGO_INCREMENTAL: "0"
      SOURCE_SHA: ${{ github.sha }}
      RECORDED_PRODUCT_SHA: "1f68052dffd4eb09fd8b69211f3562d484d06085"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "26.12.1", package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - name: Prove the exact composed product source remains unchanged
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code "$RECORDED_PRODUCT_SHA" HEAD -- Cargo.toml Cargo.lock crates vendor npm
          mkdir -p "$RUNNER_TEMP/cpi-ownership-validation"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cpi-ownership-validation-target" >> "$GITHUB_ENV"
          git rev-parse HEAD HEAD^{tree} "$RECORDED_PRODUCT_SHA" > "$RUNNER_TEMP/cpi-ownership-validation/source-identity.txt"
      - name: Restore the actual recorded physical source host and full input evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: instance-globals-10617-1f68052dffd4eb09fd8b69211f3562d484d06085-1
          run-id: 40228210670
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/recorded-cpi-composition
      - name: Authenticate recorded host bytes and all three profiler input programs
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/recorded-cpi-composition/source-host.tar.gz" -C "$RUNNER_TEMP"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync, writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import path from 'node:path';
          const digest = bytes => createHash('sha256').update(bytes).digest('hex');
          const recorded = path.join(process.env.RUNNER_TEMP, 'recorded-cpi-composition');
          const host = JSON.parse(readFileSync(path.join(recorded, 'source-host.json')));
          assert.equal(host.upstream, 'd6c4afddb2c55f4a9dea7b59293a99a8fdea1799');
          assert.equal(host.source, process.env.RECORDED_PRODUCT_SHA);
          assert.equal(digest(readFileSync(`${process.env.RUNNER_TEMP}/instance-globals-source-host/tsgo`)), host.sha256);
          const directory = 'tests/_fixtures/content-mapper/cpi-ledger-validation-10617';
          const provenance = JSON.parse(readFileSync(`${directory}/provenance.json`));
          assert.equal(provenance.source, process.env.RECORDED_PRODUCT_SHA);
          assert.equal(provenance.files.length, 3);
          for (const row of provenance.files) {
            const actual = readFileSync(`${directory}/${row.file}`);
            assert.equal(actual.length, row.bytes);
            assert.equal(digest(actual), row.sha256);
            assert.deepEqual(actual, readFileSync(path.join(recorded, row.original)));
          }
          writeFileSync(`${process.env.RUNNER_TEMP}/cpi-ownership-validation/recorded-custody.json`, JSON.stringify({source:process.env.SOURCE_SHA, productBaseline:process.env.RECORDED_PRODUCT_SHA, host, provenance, isolatedRoleCostObserved:false}, null, 2)+'\n');
          JS
      - name: Install the same pinned generic test dependency image
        run: |
          mkdir -p "$RUNNER_TEMP/cpi-ownership-consumer"
          cd "$RUNNER_TEMP/cpi-ownership-consumer"
          npm init -y
          npm install --prefer-online --ignore-scripts --no-audit --no-fund --save-exact vize@0.566.0 typescript@7.1.0-dev.20261024.1 vue@3.5.42
      - name: Retain all 144 unchanged generic repair observations
        env:
          VIZE_TEST_CONTENT_MAPPER_TSGO: ${{ runner.temp }}/instance-globals-source-host/tsgo
          VIZE_TEST_CONTENT_MAPPER_VUE: ${{ runner.temp }}/cpi-ownership-consumer/node_modules/vue
        run: |
          set -euo pipefail
          capture="$RUNNER_TEMP/cpi-ownership-validation/generic-regression"
          mkdir -p "$capture"
          cargo test --locked --profile ci -p vize --test integration --no-run --message-format=json > "$capture/build.jsonl" 2> "$capture/build.log"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, readdirSync, realpathSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import path from 'node:path';
          const capture = `${process.env.RUNNER_TEMP}/cpi-ownership-validation/generic-regression`;
          const messages = readFileSync(`${capture}/build.jsonl`, 'utf8').split('\n').filter(Boolean).map(line => JSON.parse(line));
          assert.equal(messages.at(-1).reason, 'build-finished');
          assert.equal(messages.at(-1).success, true);
          const targets = messages.filter(message => message.reason === 'compiler-artifact' && message.target.name === 'integration' && message.target.kind.join() === 'test' && message.executable);
          assert.equal(targets.length, 1);
          const binary = realpathSync(targets[0].executable);
          const hash = file => createHash('sha256').update(readFileSync(file)).digest('hex');
          const binarySha256 = hash(binary);
          const run = (name, args) => {
            const result = spawnSync(binary, args, {encoding: 'utf8', maxBuffer: 16 * 1024 * 1024});
            writeFileSync(`${capture}/${name}.stdout.raw`, result.stdout ?? '');
            writeFileSync(`${capture}/${name}.stderr.raw`, result.stderr ?? '');
            writeFileSync(`${capture}/${name}.process.json`, JSON.stringify({source: process.env.SOURCE_SHA, executable: binary, executableSha256: binarySha256, argv: args, cwd: process.cwd(), pid: result.pid, status: result.status, signal: result.signal, error: result.error ? {name: result.error.name, message: result.error.message, stack: result.error.stack, code: result.error.code} : null}, null, 2) + '\n');
            assert.equal(result.error, undefined);
            assert.equal(result.signal, null);
            assert.equal(result.status, 0);
            assert.equal(hash(binary), binarySha256);
            return result;
          };
          const filter = 'content_mapper_tsgo_cli::quoted_generic_parameters::';
          const listed = run('inventory', [filter, '--list', '--format', 'terse']);
          const actual = listed.stdout.split('\n').filter(line => line.endsWith(': test')).map(line => line.slice(0, -6)).sort();
          const expected = [
            `${filter}quoted_generic_parameters_keep_complete_cli_and_official_host_packets_through_repairs`,
            `${filter}syntax::malformed_generic_attributes_keep_provider_syntax_codes_and_authored_ranges_through_repairs`,
            `${filter}body_error::independent_authored_body_errors_survive_generic_repairs`,
          ].sort();
          assert.deepEqual(actual, expected, 'the complete original three-test authority must execute');
          writeFileSync(`${capture}/inventory.json`, JSON.stringify({source: process.env.SOURCE_SHA, binary, binarySha256, actual}, null, 2) + '\n');
          const executed = run('execution', [filter, '--test-threads=1', '--nocapture']);
          assert.match(executed.stdout, /test result: ok\. 3 passed; 0 failed; 0 ignored;/u);
          // Read only this directly observed libtest PID's output. Cached or
          // concurrent producers cannot enter the fresh execution inventory.
          const root = path.join('target/vize-tests/content-mapper-quoted-generic-parameters', String(executed.pid));
          const schemas = new Map([
            ['vize.quoted-generic-parameters-host-observation', 32],
            ['vize.quoted-generic-syntax-host-observation', 48],
            ['vize.generic-body-error-host-observation', 64],
          ]);
          const packets = [];
          const walk = directory => {
            for (const item of readdirSync(directory, {withFileTypes: true})) {
              const file = path.join(directory, item.name);
              if (item.isDirectory()) walk(file);
              else if (item.isFile() && file.endsWith('.json')) {
                const bytes = readFileSync(file), packet = JSON.parse(bytes);
                if (schemas.has(packet?.schema)) packets.push({file, schema: packet.schema, sha256: createHash('sha256').update(bytes).digest('hex')});
              }
            }
          };
          walk(root);
          for (const [schema, count] of schemas) assert.equal(packets.filter(packet => packet.schema === schema).length, count, schema);
          assert.equal(packets.length, 144);
          writeFileSync(`${capture}/whole-packet-inventory.json`, JSON.stringify({source: process.env.SOURCE_SHA, executedPid: executed.pid, binarySha256, completePackets: packets.length, packets}, null, 2) + '\n');
          JS
      - name: Measure both unchanged ownership controls and recorded CPI mapper generation
        env:
          VIZE_INPUT_OWNERSHIP_PROFILE_CAPTURE: ${{ runner.temp }}/cpi-ownership-validation/original-generation-profile.json
          VIZE_CPI_OWNERSHIP_PROFILE_CAPTURE: ${{ runner.temp }}/cpi-ownership-validation/cpi-generation-profile.json
        run: |
          cargo test --locked --profile ci -p vize_benchmarks --test component_input_ownership_profile -- --nocapture --test-threads=1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cpi-ownership-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cpi-ownership-validation
            ${{ runner.temp }}/cpi-ownership-consumer/package.json
            ${{ runner.temp }}/cpi-ownership-consumer/package-lock.json
            target/vize-tests/content-mapper-quoted-generic-parameters
          if-no-files-found: error
          retention-days: 7
