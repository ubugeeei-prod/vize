name: Optional inject fallback contracts
on:
  pull_request:
    branches: [main]
    paths:
      - crates/vize_croquis_cf/**
      - crates/vize_croquis/src/provide.rs
      - crates/vize_croquis/src/script_parser/**
      - tools/support/compat/defaulted-inject/**
      - tests/tooling/defaulted-inject-snapshot-transition.test.ts
      - .github/workflows/defaulted-inject.yml
  push:
    branches: [main]
    paths:
      - crates/vize_croquis_cf/**
      - tools/support/compat/defaulted-inject/**
      - tests/tooling/defaulted-inject-snapshot-transition.test.ts
      - .github/workflows/defaulted-inject.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: defaulted-inject-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  producer:
    uses: ./.github/workflows/full-source-cli.yml
  packets:
    needs: producer
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile --prefer-offline
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - name: Preserve the consumer checkout before source restoration
        run: |
          mkdir -p "$RUNNER_TEMP/defaulted-inject-proof"
          git rev-parse HEAD > "$RUNNER_TEMP/defaulted-inject-proof/consumer-checkout.txt"
      - uses: ./.github/actions/restore-source-cli
        with:
          producer: ${{ toJSON(needs.producer.outputs) }}
      - name: Preserve public before provenance
        run: |
          mkdir -p "$RUNNER_TEMP/defaulted-inject-proof"
          npm view --registry=https://registry.npmjs.org vize@0.602.0 --json > "$RUNNER_TEMP/defaulted-inject-proof/before-registry.json"
          npm install --registry=https://registry.npmjs.org --prefix "$RUNNER_TEMP/defaulted-inject-before" --ignore-scripts --no-audit --no-fund vize@0.602.0 > "$RUNNER_TEMP/defaulted-inject-proof/install.stdout" 2> "$RUNNER_TEMP/defaulted-inject-proof/install.stderr"
          cp "$RUNNER_TEMP/defaulted-inject-before/package-lock.json" "$RUNNER_TEMP/defaulted-inject-proof/before-lock.json"
          cp target/ci/vize.differential-build.json "$RUNNER_TEMP/defaulted-inject-proof/candidate-build.json"
          cp target/ci/vize.source-use.json "$RUNNER_TEMP/defaulted-inject-proof/candidate-use.json"
      - name: Require original and mutation whole packets with unchanged facts
        env:
          VIZE_DEFAULTED_INJECT_PROOF: ${{ runner.temp }}/defaulted-inject-proof/packets.json
          VIZE_DEFAULTED_INJECT_BEFORE_CLI: ${{ runner.temp }}/defaulted-inject-before/node_modules/.bin/vize
        run: |
          node --test tests/tooling/defaulted-inject-snapshot-transition.test.ts
          node tools/support/compat/defaulted-inject/verify.ts
      - name: Preserve every input, full process and unchanged source identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: defaulted-inject-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/defaulted-inject-proof
          if-no-files-found: error
          retention-days: 30
