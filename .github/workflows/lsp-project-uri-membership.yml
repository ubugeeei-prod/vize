name: Project URI membership observations

on:
  pull_request:
    paths:
      - ".github/workflows/lsp-project-uri-membership.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Cargo.lock"
      - "crates/vize_maestro/src/ide/corsa_support/canonical.rs"
      - "crates/vize_maestro/src/ide/corsa_support/canonical/project.rs"
      - "crates/vize_maestro/src/ide/corsa_support/canonical/project/identities/**"
      - "crates/vize_maestro/src/ide/corsa_support/canonical/project/identities.rs"
      - "crates/vize_maestro/src/server/state.rs"
      - "crates/vize_maestro/src/server/state/default.rs"
      - "crates/vize_maestro/src/server/state/canonical_paths.rs"
      - "tests/tooling/lsp-project-uri-membership.test.ts"
      - "tests/tooling/lsp-project-uri-membership-position.test.ts"
      - "tests/tooling/support/project-uri-membership-10622.ts"
      - "tests/tooling/support/project-uri-membership-position-10622.ts"
      - "tests/tooling/support/project-uri-membership-provider-10622.ts"
      - "tests/tooling/support/typecheck-dependency.ts"
      - "editors/vscode/test/fixtures/passive-vize-server.cjs"
      - "tests/_fixtures/differential/lsp/warm-type-backed-requests/**"
      - "tests/_fixtures/differential/lsp/project-uri-membership-10622/**"

permissions: { contents: read }

concurrency:
  group: project-uri-membership-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  observations:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "12"
      CARGO_TERM_COLOR: always
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RAYON_NUM_THREADS: "4"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      VIZE_LSP_BIN: target/ci/vize
      VIZE_LSP_REQUIRE_SOURCE_BUILD: "1"
      VIZE_TEST_REQUIRE_TSGO: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: package.json, cache: true, run-install: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with: { key: test-scripts, cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}" }
      - run: vp install --frozen-lockfile --prefer-offline
      - name: Install the immutable original corpus Vue provider
        shell: bash
        run: |
          set -euo pipefail
          provider="$RUNNER_TEMP/project-uri-vue-10622"
          mkdir -p "$provider"
          cp tests/_fixtures/differential/lsp/project-uri-membership-10622/vue-3.5.41/package.json "$provider/package.json"
          cp tests/_fixtures/differential/lsp/project-uri-membership-10622/vue-3.5.41/package-lock.json "$provider/package-lock.json"
          npm ci --prefix "$provider" --ignore-scripts --no-audit --no-fund
          printf 'VIZE_PROJECT_URI_VUE_PACKAGE=%s/node_modules/vue\n' "$provider" >> "$GITHUB_ENV"
      - name: Check every referenced tooling TypeScript project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/vize-tests/project-uri-membership-10622
          node tools/support/typescript/check-project.ts 2>&1 | tee target/vize-tests/project-uri-membership-10622/typescript.log
      - name: Build and receipt the exact source CLI
        run: |
          cargo build --profile ci -p vize
          vp exec node tests/differential/build-receipt.ts
      - name: Record exact source and compiler identities
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync, realpathSync, writeFileSync } from 'node:fs';
          import { resolveTypecheckRuntime } from './tests/tooling/support/typecheck-dependency.ts';
          const source = JSON.parse(readFileSync('target/ci/vize.differential-build.json'));
          assert.equal(source.sourceRevision, process.env.SOURCE_SHA);
          const selected = resolveTypecheckRuntime(process.cwd());
          assert.ok(selected, 'the pinned actual TypeScript runtime is required');
          const runtime = realpathSync(selected);
          appendFileSync(process.env.GITHUB_ENV, `CORSA_BIN=${runtime}\n`);
          const receipt = {
            source,
            sourceTree: execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(),
            runtime: { sha256: createHash('sha256').update(readFileSync(runtime)).digest('hex'), version: execFileSync(runtime, ['--version'], { encoding: 'utf8' }).trim() },
            scope: 'Exact source URI relation, physical read order, concurrent cache clearing and measured operation counts. No publication or consumer-wide performance claim.',
          };
          writeFileSync('target/vize-tests/project-uri-membership-10622/source.json', JSON.stringify(receipt, null, 2) + '\n');
          JS
      - name: Verify complete legacy relation and URI work counts
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize_maestro --lib ide::corsa_support::canonical::project::identities::tests:: -- --nocapture 2>&1 | tee target/vize-tests/project-uri-membership-10622/identities.log
      - name: Verify physical path leases and concurrent invalidation
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize_maestro --lib server::state::canonical_paths::tests:: -- --nocapture 2>&1 | tee target/vize-tests/project-uri-membership-10622/path-leases.log
      - name: Verify original400 complete packets, native ownership and byte positions
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/tooling/lsp-project-uri-membership.test.ts tests/tooling/lsp-project-uri-membership-position.test.ts 2>&1 | tee target/vize-tests/project-uri-membership-10622/protocol.log
      - name: Retain owned complete source observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-uri-membership-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha }}
          path: |
            target/vize-tests/project-uri-membership-10622/
            target/differential/lsp-sessions/
            target/ci/vize.differential-build.json
          if-no-files-found: error
          retention-days: 7
