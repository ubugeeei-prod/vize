name: Doctor filter benchmark

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact ancestor baseline commit for the paired comparison
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: doctor-filter-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HEAD_SHA: ${{ github.sha }}

jobs:
  paired-filter:
    name: Doctor filter parity and paired matching
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: head
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select the exact ancestor baseline
        env:
          REQUESTED_BASE: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_BASE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git -C head merge-base --is-ancestor "$REQUESTED_BASE" "$HEAD_SHA"
          echo "BASE_SHA=$(git -C head merge-base "$REQUESTED_BASE" "$HEAD_SHA")" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: base
          ref: ${{ env.BASE_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with:
          wild-version: "0.9.0"
      # The cache action's nested local action resolves from the workspace root,
      # and this job checks the repository out under head/.
      - name: Expose the nested target action at the workspace root
        run: mkdir -p .github/actions && cp -R head/.github/actions/reuse-rust-target .github/actions/
      - uses: ./head/.github/actions/setup-rust-sticky-cache
        with:
          key: doctor-filter-head
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
          target-path: head/target
          secondary-key: doctor-filter-base
          secondary-target-path: base/target
          secondary-cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with:
          node-version-file: head/package.json
          run-install: false
      - name: Verify filter semantics and lint contract
        working-directory: head
        run: |
          cargo test --locked -p vize_doctor filter
          cargo clippy --locked -p vize_doctor --all-targets -- -D warnings
      - name: Build identical public API probes against exact base and head
        run: |
          set -euo pipefail
          [[ "$(git -C head rev-parse HEAD)" == "$HEAD_SHA" ]]
          [[ "$(git -C base rev-parse HEAD)" == "$BASE_SHA" ]]
          mkdir -p base/crates/vize_doctor/examples
          cp -R head/crates/vize_doctor/examples/filter_patterns_bench base/crates/vize_doctor/examples/
          diff -r head/crates/vize_doctor/examples/filter_patterns_bench base/crates/vize_doctor/examples/filter_patterns_bench
          cargo build --locked --manifest-path base/Cargo.toml --profile ci-opt -p vize_doctor --example filter_patterns_bench
          cargo build --locked --manifest-path head/Cargo.toml --profile ci-opt -p vize_doctor --example filter_patterns_bench
      - name: Compare planted verdicts and nine alternating measurement pairs
        run: |
          node head/tools/benchmarks/scripts/doctor-filter-paired.ts \
            "$GITHUB_WORKSPACE/base/target/ci-opt/examples/filter_patterns_bench" \
            "$GITHUB_WORKSPACE/head/target/ci-opt/examples/filter_patterns_bench" \
            "$GITHUB_WORKSPACE/doctor-filter-bench.json"
      - name: Upload exact workloads and raw timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: doctor-filter-bench
          path: |
            doctor-filter-bench.json
            doctor-filter-bench.json.samples/
          if-no-files-found: error
          retention-days: 14
