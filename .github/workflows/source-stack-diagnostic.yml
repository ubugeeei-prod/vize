name: Source Stack diagnostic
on:
  push:
    branches: [ci/source-stack-diagnostic-6830]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tier: ${{ steps.source.outputs.js-browser-tier }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - name: Plan representative added source line
        id: source
        run: node tools/support/compat/github/plan-source-checks.mjs "$(git rev-parse HEAD^)" "$GITHUB_SHA" pull_request
      - name: Require narrow source and full merge tiers
        env:
          SOURCE_TIER: ${{ steps.source.outputs.js-browser-tier }}
          SOURCE_JS: ${{ steps.source.outputs.js }}
          SOURCE_PLAYGROUND: ${{ steps.source.outputs.playground }}
        run: |
          test "$SOURCE_TIER" = source
          test "$SOURCE_JS" = true
          test "$SOURCE_PLAYGROUND" = false
          GITHUB_OUTPUT=/dev/null node tools/support/compat/github/plan-source-checks.mjs "$(git rev-parse HEAD^)" "$GITHUB_SHA" merge_group | tee "$RUNNER_TEMP/merge-plan.log"
          grep -q 'JS packages: true (full); tooling: true; playground: true' "$RUNNER_TEMP/merge-plan.log"

  tooling-source:
    needs: plan
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "12"
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          cache-key-prefix: pr-7132-
          key: test-scripts
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Install focused tooling dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Build and receipt source CLI
        run: cargo build --profile ci -p vize && vp exec node tests/differential/build-receipt.mjs && cat target/ci/vize.differential-build.json && sudo install -m 0755 target/ci/vize /usr/local/bin/vize
      - name: Test focused source tooling
        env:
          VIZE_LSP_BIN: ${{ github.workspace }}/target/ci/vize
          VIZE_LSP_REQUIRE_SOURCE_BUILD: "1"
          VIZE_TEST_REQUIRE_TSGO: "1"
        run: |
          test -s target/ci/vize.differential-build.json
          target/ci/vize --version
          node --test --test-concurrency=1 tests/tooling/davinci-ssr-l4-bridge.test.ts tests/tooling/davinci-stage-dependencies.test.ts

  js-source:
    needs: plan
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "12"
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - uses: ./.github/actions/setup-moonbit
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          cache-key-prefix: pr-7150-
          key: test-js-packages
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Build source native addon
        run: vp run --workspace-root build:native:test
      - name: Pack source CLI and test it
        run: vp run --filter './npm/cli' test
      - name: Require source Vize app config
        working-directory: examples/vite-musea
        run: |
          vp exec node --input-type=module -e "
            import { loadConfig } from 'vize';
            const config = await loadConfig(process.cwd());
            if (config?.vite?.scanPatterns?.[0] !== 'src/**/*.vue') {
              throw new Error('Vize app config was not loaded from source');
            }
          "
      - name: Test focused Vite compiler
        run: VP_RUN_CONCURRENCY_LIMIT=1 node npm/native/scripts/test-preparation.mjs vp run --filter './npm/builder/vite' test

  aggregate:
    if: ${{ always() }}
    needs: [plan, tooling-source, js-source]
    runs-on: ubuntu-24.04
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Require all diagnostic lanes
        run: node tools/support/compat/github/require-needs-success.mjs
