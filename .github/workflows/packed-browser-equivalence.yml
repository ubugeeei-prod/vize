name: Packed browser tool equivalence
on:
  workflow_dispatch:
    inputs:
      base: { description: Full base commit SHA, required: true, type: string }
      head: { description: Full candidate commit SHA, required: true, type: string }
  pull_request:
    paths:
      - ".github/workflows/packed-browser-equivalence.yml"
      - ".github/scripts/workflows/packed-browser-equivalence/**"
      - "tools/commands/levels/packed-browser-equivalence.ts"
      - "tools/support/compat/npm/wasm-responses.ts"
      - "tests/tooling/packed-browser-equivalence.test.ts"
permissions: { contents: read }
jobs:
  compare:
    name: Compare packed browser tool outputs
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      BASE_SHA: ${{ inputs.base || github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ inputs.head || github.event.pull_request.head.sha }}
      RUSTUP_TOOLCHAIN: "1.100.0"
      CARGO_BUILD_JOBS: "24"
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/packed-browser-equivalence/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          {
            ref: "${{ github.event.pull_request.head.sha || github.sha }}",
            persist-credentials: false,
          }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: "24.14.0", package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.100.0", targets: wasm32-unknown-unknown }
      - uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1
        with: { tool: wasm-bindgen-cli@0.2.129 }
      - name: Compare immutable builds and execute the unpacked public APIs
        run: . "${{ env.VIZE_CI_FILES }}/compare-immutable-builds-and-execute-the-unpacked-public-apis.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: packed-browser-equivalence
          path: ${{ runner.temp }}/browser-package.json
          if-no-files-found: ignore
