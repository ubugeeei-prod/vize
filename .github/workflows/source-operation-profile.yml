name: UI Corsa RPC diagnostic
on:
  workflow_dispatch:
permissions: { contents: read }
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  diagnostic:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: "12"
      CARGO_TERM_COLOR: never
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: f234b6bff00cf0d44bcec8e8e45eaa98d850b220
          persist-credentials: false
      - uses: ./.github/actions/cache-vp-bootstrap
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          version: latest
          node-version-file: package.json
          cache: true
          cache-save: false
          run-install: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - name: Fetch only committed observers outside the exact source checkout
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVER_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          export VIZE_UI_OBSERVATION="$RUNNER_TEMP/ui-corsa-observation"
          printf 'VIZE_UI_OBSERVATION=%s\\n' "$VIZE_UI_OBSERVATION" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ui-corsa-observer" "$VIZE_UI_OBSERVATION"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/40603481864/artifacts?per_page=100" > "$VIZE_UI_OBSERVATION/original-artifact-inventory.json"
          for pair in 'ui-corsa-rpc-proxy.ts:rpc-proxy.ts' 'ui-corsa-observer.ts:observer.ts' 'ui-corsa-case.ts:case.ts'; do
            source_name="${pair%%:*}"
            output_name="${pair#*:}"
            gh api "repos/$GITHUB_REPOSITORY/contents/tools/benchmarks/scripts/$source_name?ref=$OBSERVER_REVISION" --jq '.content | @base64d' > "$RUNNER_TEMP/ui-corsa-observer/$output_name"
          done
          printf '%s\n' '{"type":"module"}' > "$RUNNER_TEMP/ui-corsa-observer/package.json"
          git rev-parse HEAD > "$VIZE_UI_OBSERVATION/source.sha"
          git status --porcelain > "$VIZE_UI_OBSERVATION/source-before.status"
          test ! -d target
      - name: Install the original conformance dependency selection
        run: node tools/support/compat/github/install-js-checks.ts ui-conformance
      - name: Check observer types and preserve transport source identity
        run: |
          set -euo pipefail
          vp exec tsc --noEmit --strict --noUncheckedIndexedAccess --erasableSyntaxOnly --target ESNext --module NodeNext --moduleResolution NodeNext --types node --typeRoots "$GITHUB_WORKSPACE/node_modules/@types" "$RUNNER_TEMP/ui-corsa-observer/rpc-proxy.ts" "$RUNNER_TEMP/ui-corsa-observer/observer.ts" "$RUNNER_TEMP/ui-corsa-observer/case.ts"
          node --input-type=module -e 'import fs from "node:fs"; import {stripTypeScriptTypes} from "node:module"; import {createHash} from "node:crypto"; const dir=process.env.RUNNER_TEMP+"/ui-corsa-observer"; const rows={}; for(const name of ["rpc-proxy","observer","case"]){const source=fs.readFileSync(dir+"/"+name+".ts","utf8"); const js=stripTypeScriptTypes(source); fs.writeFileSync(dir+"/"+name+".js",js,{mode:0o755}); rows[name]={sourceSha256:createHash("sha256").update(source).digest("hex"),javascriptSha256:createHash("sha256").update(js).digest("hex")};} fs.writeFileSync(process.env.VIZE_UI_OBSERVATION+"/observer-source.json",JSON.stringify(rows,null,2)+"\n");'
      - name: Build one fresh normal source NAPI image with original features
        env: { VIZE_NATIVE_CI_FORMATTER_HISTORY: "1" }
        run: |
          set -euo pipefail
          vp run --filter './npm/native' build:ci > "$VIZE_UI_OBSERVATION/build.stdout" 2> "$VIZE_UI_OBSERVATION/build.stderr"
      - name: Calibrate byte parity then observe one unchanged dropdown source
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/ui-corsa-observer/observer.js"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ui-corsa-diagnostic-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/ui-corsa-observation/receipt.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ui-corsa-diagnostic-raw-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ui-corsa-observation/
            ${{ runner.temp }}/ui-corsa-observer/
            npm/native/.artifacts/native/formatter-history/build-receipt.json
          if-no-files-found: warn
