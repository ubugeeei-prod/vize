name: Recovery line-break functional laws
on:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      SOURCE_CANDIDATE: 6cbca7d2b5fa7f42b97bbe47816037de77ec17cd
      ORACLE_FIRST: b8a29282602f58626266efe25359ed8ef12618dc
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/recovery-line-break-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: recovery-line-break-functional-v1
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Record the exact source and compiler before functional tests
        run: |
          set -euo pipefail
          mkdir -p functional
          git rev-parse HEAD > functional/bench.sha
          git cat-file commit HEAD > functional/bench.commit
          rustc +1.99.1 -vV > functional/rustc.txt
          lscpu > functional/cpu.txt
          python3 - <<'PYSOURCE'
          import hashlib,json,os,pathlib
          files={"crates/vize_croquis/src/script_parser/recovery.rs":"682be6852ad3d1cf168526f24f7cac12e3997232d754115b72bed994350d13d6","crates/vize_croquis/src/script_parser/recovery/retry_parity_tests.rs":"d7f60b8ce5ed01774334dd1fcb65aecbcff49ba5bec4292d64f68800069025cc"}
          actual={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in files}
          assert actual==files
          root=pathlib.Path("functional")
          (root/"source.json").write_text(json.dumps({"bench":(root/"bench.sha").read_text().strip(),"candidate":os.environ["SOURCE_CANDIDATE"],"oracleFirst":os.environ["ORACLE_FIRST"],"files":actual,"lockSha256":hashlib.sha256(pathlib.Path("Cargo.lock").read_bytes()).hexdigest(),"runner":{k:os.environ.get(k) for k in ("RUNNER_NAME","RUNNER_OS","RUNNER_ARCH","RUNNER_ENVIRONMENT","CARGO_BUILD_JOBS","RUSTFLAGS","CARGO_ENCODED_RUSTFLAGS","CARGO_INCREMENTAL")},"affinity":sorted(os.sched_getaffinity(0)),"scope":"untimed correctness and selected parser-operation counters; no speed or memory comparison"},indent=2)+"\n")
          PYSOURCE
      - name: Compare frozen full parser packets and every Unicode scalar
        run: |
          set -euo pipefail
          cargo +1.99.1 test --locked --profile ci -p vize_croquis script_parser::recovery --message-format=json-render-diagnostics -- --nocapture --test-threads 1 > functional/parser.log 2> functional/parser.stderr
      - name: Check exact selected parser requests and the existing allocator laws
        run: |
          set -euo pipefail
          cargo +1.99.1 test --locked --profile ci -p vize_l0 --test source_operations_profile --features micro-profiling --message-format=json-render-diagnostics -- --nocapture > functional/source-operations.log 2> functional/source-operations.stderr
      - name: Seal bounded text metadata with exact test and source-counter custody
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PYRECEIPT'
          import hashlib,json,os,pathlib,re
          root=pathlib.Path("functional")
          text=lambda n:(root/n).read_text() if (root/n).is_file() else ""
          parser=text("parser.log"); operations=text("source-operations.log")
          names=re.findall(r"^test ([^ ]+) \.\.\. ok$",parser,re.M)
          required=["recovery_reuses_original_errors_without_changing_any_public_parser_field","retry_budget_and_nested_independent_holes_remain_exact","vector_line_breaks_keep_scalar_byte_offsets_for_every_unicode_scalar","vector_line_breaks_keep_authored_repair_ranges_and_complete_packets","vector_line_breaks_keep_huge_irreparable_authored_programs"]
          qualified=all(sum(n.endswith("::"+r) for n in names)==1 for r in required) and "test result: ok." in parser and "source operation scopes, allocation exclusion, and 64-worker counts passed" in operations
          counters=[]
          for line in operations.splitlines():
              if line.startswith("parser_control_counts="): counters=json.loads(line.partition("=")[2])
          actual=sorted((r["name"],r["calls"],r["units"]) for r in counters if r["kind"]=="counter" and r["name"].startswith("croquis."))
          setup="const value = 1;"; plain="const plain = 2;"; incomplete="const recovered = missing.;"
          expected=sorted([("croquis.oxc.original.bytes",3,len(setup)+len(plain)+len(incomplete)),("croquis.oxc.recovery.bytes",1,len(incomplete)),("croquis.plain.parse_requests.bytes",1,len(plain)),("croquis.setup.analysis_requests.bytes",2,len(setup)+len(incomplete)),("croquis.setup.parse_requests.bytes",2,len(setup)+len(incomplete))])
          qualified=qualified and actual==expected
          artifacts=[]
          for filename in ("parser.log","source-operations.log"):
              for line in text(filename).splitlines():
                  if not line.startswith("{"): continue
                  row=json.loads(line)
                  if row.get("reason")=="compiler-artifact" and row["target"]["name"] in ("vize_croquis","source_operations_profile"):
                      artifacts.append({k:row[k] for k in ("package_id","manifest_path","target","profile","features","fresh","executable")})
          for name in ("vize_croquis","source_operations_profile"):
              exact=[a for a in artifacts if a["target"]["name"]==name and a.get("executable")]
              qualified=qualified and len(exact)==1 and not exact[0]["fresh"] and exact[0]["profile"]["opt_level"]=="0"
              for a in exact:
                  qualified=qualified and a["target"]["kind"]==(["lib"] if name=="vize_croquis" else ["test"])
                  qualified=qualified and a["features"]==([] if name=="vize_croquis" else ["default","micro-profiling"])
                  qualified=qualified and pathlib.Path(a["manifest_path"]).is_relative_to(pathlib.Path.cwd())
                  path=pathlib.Path(a["executable"])
                  a["binarySha256"]=hashlib.sha256(path.read_bytes()).hexdigest()
                  a["binaryBytes"]=path.stat().st_size
          receipt={"source":json.loads(text("source.json")) if text("source.json") else None,"qualifiedFunctional":qualified,"normalPerformanceQualified":False,"allocationComparisonQualified":False,"passedParserTests":names,"requiredTests":required,"selectedParserCounters":counters,"expectedCounters":expected,"artifacts":artifacts,"rawSha256":{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()},"failureTail":None if qualified else {"parser":parser[-8000:],"operations":operations[-8000:],"stderr":text("parser.stderr")[-4000:]+text("source-operations.stderr")[-4000:]}}
          data=(json.dumps(receipt,indent=2)+"\n").encode()
          assert len(data)<=95000
          (root/"receipt.json").write_bytes(data)
          print(data.decode())
          assert qualified,"functional or selected-operation source law failed"
          PYRECEIPT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: recovery-line-break-receipt-${{ github.run_id }}
          path: |
            functional/receipt.json
            functional/rustc.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: recovery-line-break-raw-${{ github.run_id }}
          path: functional/
          if-no-files-found: error
