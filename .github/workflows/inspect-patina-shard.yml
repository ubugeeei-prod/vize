name: Inspect sharded type-aware evidence

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: patina-project-batch
          path: evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: "43728888443"
      - name: Publish retained boundary
        run: |
          escape() {
            local value="$1"
            value="${value//'%'/'%25'}"
            value="${value//$'\n'/'%0A'}"
            value="${value//$'\r'/'%0D'}"
            printf '%s' "$value"
          }
          listing="$(find evidence -maxdepth 2 -type f -printf '%f %s bytes\n' | sort)"
          echo "::notice title=retained files::$(escape "$listing")"
          if [[ -f evidence/progress.jsonl ]]; then
            echo "::notice title=progress tail::$(escape "$(tail -n 30 evidence/progress.jsonl)")"
          fi
          if [[ -f evidence/samples.jsonl ]]; then
            detail="$(jq -s 'map({side,label,elapsedMs,diagnostics,aggregateCpuSeconds,maximumShardRssKiB,requestCount:(.requestPhaseCounts // [] | map(.count) | add),signatureRequests:(.requestPhaseCounts // [] | map(select(.attribution.pass=="getSignaturesOfType")|.count) | add)})' evidence/samples.jsonl)"
            echo "::notice title=completed sample summary::$(escape "$detail")"
            base_vector="$(jq -c 'select(.label=="base-profile-0")|.requestPhaseCounts' evidence/samples.jsonl)"
            head_vector="$(jq -c 'select(.label=="head-profile-0")|.requestPhaseCounts' evidence/samples.jsonl)"
            if [[ -n "$base_vector" && -n "$head_vector" && "$base_vector" != "$head_vector" ]]; then
              printf '%s\n' "$base_vector" | jq . > /tmp/base-vector.json
              printf '%s\n' "$head_vector" | jq . > /tmp/head-vector.json
              detail="$(diff -u /tmp/base-vector.json /tmp/head-vector.json | head -n 120 || true)"
              echo "::notice title=base head request delta::$(escape "$detail")"
            fi
          fi
          for file in evidence/*.unexpected.stdout; do
            [[ -f "$file" ]] || continue
            detail="$(wc -c evidence/base-cohort-authority.stdout "$file"; sha256sum evidence/base-cohort-authority.stdout "$file"; cmp -l evidence/base-cohort-authority.stdout "$file" | head -n 20 || true)"
            echo "::notice title=$(basename "$file") diff::$(escape "$detail")"
          done
          profiles=(evidence/*.profile.json)
          if [[ -f "${profiles[0]}" ]]; then
            detail="$(jq -s '{files:length,truncations:(map(.truncation)|unique),requestSpans:(map([.spans[]|select(.key|startswith("corsa.request."))]|length)),invalid:(map([.spans[]|select(.key|startswith("corsa.request."))|select(.attribution.stage!="patina" or .attribution.pass=="other" or (.count|type)!="number" or .count<=0)|{key,attribution,count}]))}' "${profiles[@]}")"
            echo "::notice title=profile vector validity::$(escape "$detail")"
          fi
          {
            echo "## Retained sharded boundary"
            echo
            echo '```text'
            find evidence -maxdepth 2 -type f -printf '%f %s bytes\n' | sort
            echo '```'
            echo
            for file in evidence/*.stderr; do
              echo "### $(basename "$file")"
              echo
              echo '```text'
              tail -n 40 "$file"
              echo '```'
            done
            if [[ -f evidence/samples.jsonl ]]; then
              echo
              echo "### Completed samples"
              echo
              echo '```json'
              cat evidence/samples.jsonl
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
