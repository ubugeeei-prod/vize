name: Inspect sharded type-aware evidence

on:
  push:
    branches:
      - bench/no-implied-eval-sharded-13000

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: patina-project-batch
          path: evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: "43726614652"
      - name: Publish retained boundary
        run: |
          escape() {
            local value="$1"
            value="${value//'%'/'%25'}"
            value="${value//$'\n'/'%0A'}"
            value="${value//$'\r'/'%0D'}"
            printf '%s' "$value"
          }
          listing="$(find evidence -maxdepth 2 -type f -printf '%f %s bytes\n' | sort)"
          echo "::notice title=retained files::$(escape "$listing")"
          for file in evidence/*.stderr evidence/*.rss.txt; do
            [[ -f "$file" ]] || continue
            detail="$(tail -n 80 "$file")"
            echo "::notice title=$(basename "$file")::$(escape "$detail")"
          done
          if [[ -f evidence/samples.jsonl ]]; then
            echo "::notice title=completed samples::$(escape "$(cat evidence/samples.jsonl)")"
          fi
          {
            echo "## Retained sharded boundary"
            echo
            echo '```text'
            find evidence -maxdepth 2 -type f -printf '%f %s bytes\n' | sort
            echo '```'
            echo
            for file in evidence/*.stderr; do
              echo "### $(basename "$file")"
              echo
              echo '```text'
              tail -n 40 "$file"
              echo '```'
            done
            if [[ -f evidence/samples.jsonl ]]; then
              echo
              echo "### Completed samples"
              echo
              echo '```json'
              cat evidence/samples.jsonl
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
