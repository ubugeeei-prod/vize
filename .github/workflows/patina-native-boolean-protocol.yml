name: Patina native boolean protocols
on:
  workflow_dispatch:
    inputs:
      symbol_owner_repro:
        description: Run only the bounded symbol-owner causal collector
        type: boolean
        default: false
      source_sha:
        description: Exact source commit required by the causal collector
        type: string
        default: ""
  pull_request:
    paths:
      - crates/vize_patina/src/linter/corsa_session/**
      - crates/vize_patina/src/linter/corsa_session.rs
      - crates/vize_patina/src/linter/native_type_aware/**
      - crates/vize_patina/src/linter/native_type_aware.rs
      - crates/vize_patina/src/linter/engine/batch/projects.rs
      - crates/vize_patina/tests/fixtures/strict-boolean-nodes/**
      - crates/vize/tests/lint_strict_boolean_cli/**
      - crates/vize/tests/lint_strict_boolean_cli.rs
      - .github/workflows/patina-native-boolean-protocol.yml
permissions: { contents: read }
concurrency:
  group: patina-native-boolean-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  live-native:
    if: github.event_name != 'workflow_dispatch' || !inputs.symbol_owner_repro
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 25
    permissions: { contents: read, actions: read }
    env:
      CARGO_BUILD_JOBS: "24"
      RUST_TEST_THREADS: "4"
      VIZE_TEST_REQUIRE_TSGO: "1"
      VIZE_TEST_REQUIRE_TSRS: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with: { key: nextest-ci, cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}" }
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          {
            version: latest,
            node-version-file: package.json,
            cache: true,
            cache-save: false,
            run-install: true,
          }
      - name: Install the exact reported project runtime independently
        working-directory: ${{ runner.temp }}
        run: |
          npm install --prefix "$RUNNER_TEMP/patina-tsrs" --ignore-scripts --no-audit --no-fund tsrs@0.20.1-ts7.1.0-beta
          echo "VIZE_TEST_TSRS_PACKAGE=$RUNNER_TEMP/patina-tsrs/node_modules/tsrs" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/target/patina-native-boolean"
          cp "$RUNNER_TEMP/patina-tsrs/package-lock.json" "$GITHUB_WORKSPACE/target/patina-native-boolean/provider-package-lock.json"
          sha256sum "$RUNNER_TEMP/patina-tsrs/node_modules/@tsrs/linux-x64-gnu/tsrs" "$GITHUB_WORKSPACE/node_modules/@typescript/typescript-linux-x64/lib/tsc" > "$GITHUB_WORKSPACE/target/patina-native-boolean/provider-sha256.txt"
      - name: Keep captured AST refusal laws and runtime failure severity
        run: |
          set -o pipefail
          cargo test --locked --profile ci -p vize_patina --lib corsa_session::boolean::nodes::tests -- --nocapture 2>&1 | tee target/patina-native-boolean/ast-tests.txt
          cargo test --locked --profile ci -p vize_patina --lib selected_runtime_query_failure_is_an_error -- --nocapture 2>&1 | tee target/patina-native-boolean/query-failure-tests.txt
      - name: Preserve all complete boolean reports with the stable runtime
        env:
          CORSA_PATH: ${{ github.workspace }}/node_modules/@typescript/typescript-linux-x64/lib/tsc
        run: |
          set -o pipefail
          cargo test --locked --profile ci -p vize --test integration lint_strict_boolean_cli:: -- --nocapture 2>&1 | tee target/patina-native-boolean/stable-tests.txt
      - name: Preserve the same complete reports with the reported tsrs runtime
        run: |
          set -o pipefail
          export CORSA_PATH="$RUNNER_TEMP/patina-tsrs/node_modules/@tsrs/linux-x64-gnu/tsrs"
          cargo test --locked --profile ci -p vize --test integration lint_strict_boolean_cli:: -- --nocapture 2>&1 | tee target/patina-native-boolean/tsrs-tests.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: patina-native-boolean-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/patina-native-boolean/
          if-no-files-found: error
          retention-days: 7
  symbol-owner-counterfactual:
    if: github.event_name == 'workflow_dispatch' && inputs.symbol_owner_repro
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions: { contents: read, actions: read }
    env:
      CARGO_BUILD_JOBS: "24"
      VIZE_SYMBOL_OWNER_REPRO: "1"
      EXPECTED_SOURCE: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Pin this instrumentation to its exact source
        run: |
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          mkdir -p "$RUNNER_TEMP/patina-symbol-owner-source"
          git show -s --format='%H %T %P' HEAD > "$RUNNER_TEMP/patina-symbol-owner-source/source.txt"
          sha256sum Cargo.lock pnpm-lock.yaml package.json > "$RUNNER_TEMP/patina-symbol-owner-source/lock-sha256.txt"
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with: { key: nextest-ci, cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}" }
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          {
            version: latest,
            node-version-file: package.json,
            cache: true,
            cache-save: false,
            run-install: true,
          }
      - name: Authenticate the two exact installed native providers
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target/patina-symbol-owner"
          cp "$RUNNER_TEMP/patina-symbol-owner-source/source.txt" "$RUNNER_TEMP/patina-symbol-owner-source/lock-sha256.txt" "$GITHUB_WORKSPACE/target/patina-symbol-owner/"
          npm install --prefix "$RUNNER_TEMP/patina-symbol-owner" --ignore-scripts --no-audit --no-fund tsrs@0.20.1-ts7.1.0-beta
          cp "$RUNNER_TEMP/patina-symbol-owner/package-lock.json" "$GITHUB_WORKSPACE/target/patina-symbol-owner/provider-package-lock.json"
          cp "$RUNNER_TEMP/patina-symbol-owner/node_modules/tsrs/package.json" "$GITHUB_WORKSPACE/target/patina-symbol-owner/tsrs-package.json"
          cp "$RUNNER_TEMP/patina-symbol-owner/node_modules/@tsrs/linux-x64-gnu/package.json" "$GITHUB_WORKSPACE/target/patina-symbol-owner/tsrs-image-package.json"
          cp "$GITHUB_WORKSPACE/node_modules/@typescript/typescript-linux-x64/package.json" "$GITHUB_WORKSPACE/target/patina-symbol-owner/stable-image-package.json"
          sha256sum "$RUNNER_TEMP/patina-symbol-owner/node_modules/@tsrs/linux-x64-gnu/tsrs" "$GITHUB_WORKSPACE/node_modules/@typescript/typescript-linux-x64/lib/tsc" > "$GITHUB_WORKSPACE/target/patina-symbol-owner/provider-sha256.txt"
          echo "0ce4f6cb4e95b24f59daafc667034e20182af6615d7a5e41cb9d8bfe035d4468  $RUNNER_TEMP/patina-symbol-owner/node_modules/@tsrs/linux-x64-gnu/tsrs" > "$GITHUB_WORKSPACE/target/patina-symbol-owner/expected-provider-sha256.txt"
          echo "4f2de678286401759b3fb4475bafe35b8f32b4b3a07d92642bbf37eadc9b34a4  $GITHUB_WORKSPACE/node_modules/@typescript/typescript-linux-x64/lib/tsc" >> "$GITHUB_WORKSPACE/target/patina-symbol-owner/expected-provider-sha256.txt"
          sha256sum --check "$GITHUB_WORKSPACE/target/patina-symbol-owner/expected-provider-sha256.txt"
      - name: Collect only the explicitly ignored causal target with both providers
        run: |
          set -o pipefail
          result=0
          for provider in stable tsrs; do
            if [[ "$provider" = stable ]]; then
              export CORSA_PATH="$GITHUB_WORKSPACE/node_modules/@typescript/typescript-linux-x64/lib/tsc"
            else
              export CORSA_PATH="$RUNNER_TEMP/patina-symbol-owner/node_modules/@tsrs/linux-x64-gnu/tsrs"
            fi
            export VIZE_SYMBOL_OWNER_PROVIDER_LABEL="$provider"
            export VIZE_SYMBOL_OWNER_EVIDENCE_DIR="$GITHUB_WORKSPACE/target/patina-symbol-owner/$provider"
            if cargo test --locked --profile ci -p vize --test integration lint_symbol_owner_cli::same_connection_foreign_callable_probe -- --ignored --exact --nocapture 2>&1 | tee "target/patina-symbol-owner/$provider-tests.txt"; then
              echo "$provider collector completed; inspect packets for reproduction status"
            else
              result=1
            fi
          done
          exit "$result"
      - name: Bind the compiled SDK source and CLI without copying images
        if: always()
        run: |
          client_crate="$(find "$CARGO_HOME/registry/cache" -type f -name corsa_client-2.0.0-beta.2.crate -print -quit)"
          test -n "$client_crate"
          echo "7ec16cb3138106003a1c1cdea181debb9281e3e54b88c45fa9550544a943e79a  $client_crate" | sha256sum --check
          sha256sum "$client_crate" > target/patina-symbol-owner/sdk-crate-sha256.txt
          tar -xOf "$client_crate" corsa_client-2.0.0-beta.2/.cargo_vcs_info.json > target/patina-symbol-owner/sdk-vcs.json
          sha256sum target/ci/vize > target/patina-symbol-owner/cli-sha256.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: patina-symbol-owner-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/patina-symbol-owner/
          if-no-files-found: error
          retention-days: 7
