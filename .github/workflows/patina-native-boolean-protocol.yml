name: Patina native boolean protocols
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - crates/vize_patina/src/linter/corsa_session/**
      - crates/vize_patina/src/linter/corsa_session.rs
      - crates/vize_patina/src/linter/native_type_aware/**
      - crates/vize_patina/src/linter/native_type_aware.rs
      - crates/vize_patina/src/linter/engine/batch/projects.rs
      - crates/vize_patina/tests/fixtures/strict-boolean-nodes/**
      - crates/vize/tests/lint_strict_boolean_cli/**
      - crates/vize/tests/lint_strict_boolean_cli.rs
      - .github/workflows/patina-native-boolean-protocol.yml
      - .github/scripts/workflows/patina-native-boolean-protocol/**
permissions: { contents: read }
concurrency:
  group: patina-native-boolean-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  live-native:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 25
    permissions: { contents: read, actions: read }
    env:
      VIZE_CI_FILES: "${{ github.workspace }}/.github/scripts/workflows/patina-native-boolean-protocol"
      CARGO_BUILD_JOBS: "24"
      RUST_TEST_THREADS: "4"
      VIZE_TEST_REQUIRE_TSGO: "1"
      VIZE_TEST_REQUIRE_TSRS: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.100.0" }
      - uses: ./.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with: { key: nextest-ci, cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}" }
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          {
            version: latest,
            node-version-file: package.json,
            cache: true,
            cache-save: false,
            run-install: true,
          }
      - name: Install the exact reported project runtime independently
        working-directory: ${{ runner.temp }}
        run: . "${{ env.VIZE_CI_FILES }}/install-the-exact-reported-project-runtime-independently.sh"
      - name: Keep captured AST refusal laws and runtime failure severity
        run: . "${{ env.VIZE_CI_FILES }}/keep-captured-ast-refusal-laws-and-runtime-failure-severity.sh"
      - name: Preserve dynamic module namespaces beside component imports
        run: . "${{ env.VIZE_CI_FILES }}/preserve-dynamic-module-namespaces-beside-component-imports.sh"
      - name: Preserve all complete boolean reports with the stable runtime
        env:
          CORSA_PATH: ${{ github.workspace }}/node_modules/@typescript/typescript-linux-x64/lib/tsc
          VIZE_SYMBOL_OWNER_CLI_CAPTURE: ${{ github.workspace }}/target/patina-native-boolean/stable-owner-cli.json
        run: . "${{ env.VIZE_CI_FILES }}/preserve-all-complete-boolean-reports-with-the-stable-runtime.sh"
      - name: Preserve the same complete reports with the reported tsrs runtime
        env:
          VIZE_SYMBOL_OWNER_CLI_CAPTURE: ${{ github.workspace }}/target/patina-native-boolean/tsrs-owner-cli.json
        run: . "${{ env.VIZE_CI_FILES }}/preserve-the-same-complete-reports-with-the-reported-tsrs-runtime.sh"
      - name: Capture cold and materialized signature owners with the stable runtime
        if: always()
        env:
          CORSA_PATH: ${{ github.workspace }}/node_modules/@typescript/typescript-linux-x64/lib/tsc
        run: . "${{ env.VIZE_CI_FILES }}/capture-cold-and-materialized-signature-owners-with-the-stable-runtime.sh"
      - name: Capture the same signature owners with the reported tsrs runtime
        if: always()
        run: . "${{ env.VIZE_CI_FILES }}/capture-the-same-signature-owners-with-the-reported-tsrs-runtime.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: patina-native-boolean-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/patina-native-boolean/
          if-no-files-found: error
          retention-days: 7
