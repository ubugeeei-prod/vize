name: Musea HTTP lifecycle diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  http-lifecycle:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install only the Musea dependency closure
        run: vp install --filter './npm/builder/vite-musea...' --frozen-lockfile --prefer-offline
      - name: Compare baseline and isolated HTTP contracts on the same Linux worker
        run: vp exec node npm/builder/vite-musea/scripts/http-lifecycle-probe.mjs 163c349e00cc49d117da0a24b2d5acf26aa3c9b1 artifacts/musea-http-lifecycle
      - name: Retain all phases, native provider identities and original test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: musea-http-lifecycle-${{ github.sha }}
          path: artifacts/musea-http-lifecycle
          if-no-files-found: error
          retention-days: 14
