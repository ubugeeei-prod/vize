name: Musea accessibility and capture
on:
  pull_request:
    paths:
      [
        "npm/builder/vite-musea/**",
        "tests/_fixtures/differential/musea/**",
        "tests/tooling/fixtures/musea/**",
        "examples/vite-musea/src/components/MuseaButton.vue",
        ".github/workflows/musea-browser.yml",
      ]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musea-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  musea-native-inline:
    name: Musea native inline Art contracts
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - uses: ./.github/actions/setup-moonbit
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with: { toolchain: "1.99.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          cache-key-prefix: musea-native-inline-
          key: native-inline-browser
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Install source-native browser dependencies
        run: vp install --filter './npm/native...' --filter './npm/builder/vite...' --filter './npm/builder/vite-musea...' --frozen-lockfile --prefer-offline
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
      - uses: ./.github/actions/setup-ubuntu-archive
      - name: Install Chromium and its system dependencies
        run: vize-ci-apt-retry vp exec --filter './npm/builder/vite-musea' -- playwright install --with-deps chromium
      - name: Build the exact source native binding and gallery
        run: |
          vp run --filter './npm/native' build:ci
          vp run --filter './npm/builder/vite' build
          vp run --filter './npm/builder/vite-musea' build
      - name: Verify actual native inline component rendering and globals
        working-directory: npm/builder/vite-musea
        env:
          VIZE_MUSEA_NATIVE_BROWSER_TESTS: "1"
        run: vp exec tsx --test src/art-component.test.ts src/inline-art.browser.test.ts src/vrt-api.browser.test.ts src/vrt-report.browser.test.ts src/vrt/report-identity.test.ts src/cli/serve.test.ts src/cli/service/input.test.ts src/hosted-vrt-service.browser.test.ts src/hosted-vrt-lifecycle.browser.test.ts src/literal-variant-keys.browser.test.ts src/literal-variant-keys.test.ts
