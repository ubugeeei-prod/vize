name: Musea accessibility and capture
on:
  pull_request:
    paths:
      [
        "npm/builder/vite-musea/**",
        "tests/_fixtures/differential/musea/**",
        "examples/vite-musea/src/components/MuseaButton.vue",
        ".github/workflows/musea-browser.yml",
      ]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musea-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  musea-browser:
    name: Musea real Chromium contracts
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install Musea test dependencies
        run: vp install --filter './npm/builder/vite-musea...' --frozen-lockfile --prefer-offline
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
      - uses: ./.github/actions/setup-ubuntu-archive
      - name: Install Chromium and its system dependencies
        run: |
          # Browser dependency resolution needs package indices, not desktop metadata.
          sudo tee /etc/apt/apt.conf.d/81-vize-musea-package-indexes >/dev/null <<'APT'
          Acquire::Languages "none";
          Acquire::IndexTargets::deb::DEP-11::DefaultEnabled "false";
          Acquire::IndexTargets::deb::CNF::DefaultEnabled "false";
          APT
          vize-ci-apt-retry vp exec --filter './npm/builder/vite-musea' -- playwright install --with-deps chromium
      - name: Verify real accessibility and deterministic screenshots
        working-directory: npm/builder/vite-musea
        env:
          VIZE_MUSEA_BROWSER_TESTS: "1"
        run: |
          vp exec tsx --test src/a11y/browser-contracts.test.ts src/a11y/node-report.test.ts gallery/components/code-display.browser.test.ts gallery/components/global-toolbar.browser.test.ts gallery/components/hosted-tests.browser.test.ts
          vp exec tsx --test gallery/components/hosted-vrt.browser.test.ts
      - name: Retain gallery browser observations and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: musea-code-display-${{ github.sha }}
          path: |
            artifacts/musea-code/*.png
            artifacts/musea-code/observations.json
            artifacts/musea-globals/*.png
            artifacts/musea-globals/observations.json
            artifacts/musea-hosted/*.png
            artifacts/musea-hosted/observations.json
            artifacts/musea-hosted-vrt/**/*.png
            artifacts/musea-hosted-vrt/*.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
