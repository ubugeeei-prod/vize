name: Davinci resource budgets

# TS-44 (Davinci P5-11a): the resident `vize lsp` measured against the
# `docs/davinci/plan/budgets.toml [resource]` ceilings on the reference
# runner. Every recorded number names this workflow's measure command; the
# ratchet step rejects a loosened or dropped ceiling against the PR base.

on:
  schedule:
    # Daily, offset from the other nightly lanes.
    - cron: "53 5 * * *"
  workflow_dispatch:

concurrency:
  group: davinci-resource-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
  RESOURCE_PRESET: linux-x64-ci

jobs:
  resource:
    name: TS-44 resource budgets (linux-x64-ci)
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline
      # The runner's rustup installs the toolchain pinned in rust-toolchain.toml.
      - name: Install the repository Rust toolchain
        run: |
          rustup toolchain install || rustup show active-toolchain
          cargo --version
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: davinci-resource
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      # The optimized profile check-bench measures; shipped release binaries
      # use fat LTO and one codegen unit on top of it.
      - name: Build the measured server
        run: >-
          cargo build --profile ci-opt -p vize
          --config 'profile.ci-opt.inherits="release"'
          --config 'profile.ci-opt.lto="thin"'
          --config 'profile.ci-opt.codegen-units=16'

      - name: Measure the resident server
        run: >-
          rust-script tools/commands/davinci/resource-budgets.rs --measure
          --preset "${RESOURCE_PRESET}" --runs 3 --keystrokes 20 --idle-seconds 60
          --server target/ci-opt/vize --out "${RUNNER_TEMP}/resource.json"
      - name: Every number carries its methodology
        if: ${{ !cancelled() }}
        run: rust-script tools/commands/davinci/resource-budgets.rs --validate
      - name: No ceiling is loosened against the base
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          # Resolve the base revision's path so the directory move itself can
          # still compare against the pre-move budget registry.
          BASE_BUDGET_PATH="$(git ls-tree -r --name-only "${BASE_SHA}" | rg '(^|/)plan/budgets[.]toml$')"
          test -n "${BASE_BUDGET_PATH}"
          git show "${BASE_SHA}:${BASE_BUDGET_PATH}" > "${RUNNER_TEMP}/base-budgets.toml"
          rust-script tools/commands/davinci/resource-budgets.rs --ratchet "${RUNNER_TEMP}/base-budgets.toml"
      - name: The measurement holds every pinned ceiling
        if: ${{ !cancelled() }}
        run: >-
          rust-script tools/commands/davinci/resource-budgets.rs --check
          --measurement "${RUNNER_TEMP}/resource.json"
      - name: Summarize
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### TS-44 resource measurement (${RESOURCE_PRESET})"
            echo '```json'
            cat "${RUNNER_TEMP}/resource.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: resource-${{ env.RESOURCE_PRESET }}
          path: ${{ runner.temp }}/resource.json
          retention-days: 30

  resident-resource:
    name: Synthetic 10k-file resident resources (P5-4b)
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install the repository Rust toolchain
        run: rustup toolchain install || rustup show active-toolchain
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: davinci-resident-resource
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      - name: Build the isolated resident session
        run: >-
          cargo build --profile ci-opt -p vize_resident --example resource_session
          --config 'profile.ci-opt.inherits="release"'
          --config 'profile.ci-opt.lto="thin"'
          --config 'profile.ci-opt.codegen-units=16'
      - name: Measure and enforce the unchanged reference RSS ceilings
        run: >-
          rust-script tools/commands/davinci/resident-resources.rs
          --server target/ci-opt/examples/resource_session --files 10000 --edits 32
          --runs 3 --out "${RUNNER_TEMP}/resident-resource.json"
      - name: Summarize the isolated session
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Synthetic resident database (fixture alpha inputs; no LSP or Corsa)'
            echo '```json'
            cat "${RUNNER_TEMP}/resident-resource.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: resident-resource-${{ env.RESOURCE_PRESET }}
          path: ${{ runner.temp }}/resident-resource.json
          retention-days: 30

  production-lsp-resource:
    name: Production 10k open SFC process-tree RSS (record only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Install the repository Rust toolchain
        run: rustup toolchain install || rustup show active-toolchain
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: davinci-resource
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      - name: Verify assertion, module, and source length gates
        run: >-
          vp exec node --test tests/tooling/davinci-assertion-lint.test.ts
          tests/tooling/davinci-module-layout.test.ts tests/tooling/source-file-lengths.test.ts
      - name: Build the production server
        run: >-
          cargo build --profile ci-opt -p vize
          --config 'profile.ci-opt.inherits="release"'
          --config 'profile.ci-opt.lto="thin"'
          --config 'profile.ci-opt.codegen-units=16'
      - name: Verify the protocol and controlled edit oracle
        run: >-
          vp exec node tools/support/compat/davinci/lsp-resources.mjs
          --server target/ci-opt/vize --files 2 --runs 1 --idle-seconds 10
          --out "${RUNNER_TEMP}/lsp-resource-smoke.json"
      - name: Measure 10000 production providers, open buffers, and Corsa
        run: >-
          vp exec node tools/support/compat/davinci/lsp-resources.mjs
          --server target/ci-opt/vize --files 10000 --runs 3 --idle-seconds 10
          --out "${RUNNER_TEMP}/lsp-resource.json"
      - name: Summarize the actual scope and every process
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Production Maestro LSP: 10000 open and metadata-warmed SFC providers'
            echo 'Maestro and all Corsa descendants are included; the Node harness is excluded.'
            echo 'The isolated resident example and nine-file TS-44 baseline remain separate.'
            echo '```json'
            cat "${RUNNER_TEMP}/lsp-resource.json" || cat "${RUNNER_TEMP}/lsp-resource-smoke.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: production-lsp-resource-linux-x64-ci
          path: ${{ runner.temp }}/lsp-resource*.json
          retention-days: 30
