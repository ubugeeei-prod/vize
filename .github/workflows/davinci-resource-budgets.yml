name: Davinci resource budgets

# TS-44 (Davinci P5-11a): the resident `vize lsp` measured against the
# `docs/davinci/plan/budgets.toml [resource]` ceilings on the reference
# runner. Every recorded number names this workflow's measure command; the
# ratchet step rejects a loosened or dropped ceiling against the PR base.

on:
  schedule:
    # Daily, offset from the other nightly lanes.
    - cron: "53 5 * * *"
  workflow_dispatch:
    inputs:
      include_release:
        description: Also measure the shipped fat-LTO Linux CLI at the same source revision
        type: boolean
        default: false

concurrency:
  group: davinci-resource-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
  RESOURCE_PRESET: linux-x64-ci

jobs:
  resource:
    name: TS-44 resource budgets (linux-x64-ci)
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      VIZE_CI_FILES: "${{ github.workspace }}/.github/scripts/workflows/davinci-resource-budgets"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline
      # The runner's rustup installs the toolchain pinned in rust-toolchain.toml.
      - name: Install the repository Rust toolchain
        run: . "${{ env.VIZE_CI_FILES }}/install-the-repository-rust-toolchain.sh"
      # No Wild: the server links with rust-lld like the shipped x86_64 Linux
      # CLI, so crates/vize/build.rs folds identical code and packs relocations.
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: davinci-resource
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      # The optimized profile check-bench measures; shipped release binaries
      # use fat LTO and one codegen unit on top of it.
      - name: Build the measured server
        run: . "${{ env.VIZE_CI_FILES }}/build-the-measured-server.sh"
      - name: Record the measured binary and build identity
        run: . "${{ env.VIZE_CI_FILES }}/record-the-measured-binary-and-build-identity.sh"

      - name: Measure the resident server
        run: >-
          rust-script tools/commands/davinci/resource-budgets.rs --measure --preset "${RESOURCE_PRESET}" --runs 3 --keystrokes 20 --idle-seconds 60 --server target/ci-opt/vize --out "${RUNNER_TEMP}/resource.json"
      - name: Every number carries its methodology
        if: ${{ !cancelled() }}
        run: rust-script tools/commands/davinci/resource-budgets.rs --validate
      - name: No ceiling is loosened against the base
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: . "${{ env.VIZE_CI_FILES }}/no-ceiling-is-loosened-against-the-base.sh"
      - name: The measurement holds every pinned ceiling
        if: ${{ !cancelled() }}
        run: >-
          rust-script tools/commands/davinci/resource-budgets.rs --check --measurement "${RUNNER_TEMP}/resource.json"
      - name: Summarize
        if: ${{ !cancelled() }}
        run: . "${{ env.VIZE_CI_FILES }}/summarize.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: resource-${{ env.RESOURCE_PRESET }}
          path: |
            ${{ runner.temp }}/resource.json
            ${{ runner.temp }}/resource-build-identity.json
          retention-days: 30

  resident-resource:
    name: Synthetic 10k-file resident resources (P5-4b)
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      VIZE_CI_FILES: "${{ github.workspace }}/.github/scripts/workflows/davinci-resource-budgets"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install the repository Rust toolchain
        run: . "${{ env.VIZE_CI_FILES }}/install-the-repository-rust-toolchain-2.sh"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: davinci-resident-resource
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Build the isolated resident session
        run: >-
          cargo build --profile ci-opt -p vize_incremental --example resource_session --config 'profile.ci-opt.inherits="release"' --config 'profile.ci-opt.lto="thin"' --config 'profile.ci-opt.codegen-units=16'
      - name: Measure and enforce the unchanged reference RSS ceilings
        run: >-
          node tools/commands/davinci/resident-resources.ts --server target/ci-opt/examples/resource_session --files 10000 --edits 32 --runs 3 --out "${RUNNER_TEMP}/resident-resource.json"
      - name: Summarize the isolated session
        if: ${{ !cancelled() }}
        run: . "${{ env.VIZE_CI_FILES }}/summarize-the-isolated-session.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: resident-resource-${{ env.RESOURCE_PRESET }}
          path: ${{ runner.temp }}/resident-resource.json
          retention-days: 30

  production-lsp-resource:
    name: Production 10k open SFC process-tree RSS (record only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      VIZE_CI_FILES: "${{ github.workspace }}/.github/scripts/workflows/davinci-resource-budgets"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Install the repository Rust toolchain
        run: . "${{ env.VIZE_CI_FILES }}/install-the-repository-rust-toolchain-2.sh"
      # No Wild: the server links with rust-lld like the shipped x86_64 Linux
      # CLI, so crates/vize/build.rs folds identical code and packs relocations.
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: davinci-resource
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      - name: Verify assertion, module, and source length gates
        run: >-
          vp exec node --test tests/tooling/davinci-assertion-lint.test.ts tests/tooling/davinci-module-layout.test.ts tests/tooling/source-file-lengths.test.ts
      - name: Build the production server
        run: >-
          cargo build --profile ci-opt -p vize --config 'profile.ci-opt.inherits="release"' --config 'profile.ci-opt.lto="thin"' --config 'profile.ci-opt.codegen-units=16'
      - name: Verify the protocol and controlled edit oracle
        run: . "${{ env.VIZE_CI_FILES }}/verify-the-protocol-and-controlled-edit-oracle.sh"
      - name: Measure 10000 open buffers, 16 production providers, and Corsa
        run: . "${{ env.VIZE_CI_FILES }}/measure-10000-open-buffers-16-production-providers-and.sh"
      - name: Summarize the actual scope and every process
        if: ${{ !cancelled() }}
        run: . "${{ env.VIZE_CI_FILES }}/summarize-the-actual-scope-and-every-process.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: production-lsp-resource-linux-x64-ci
          path: ${{ runner.temp }}/lsp-resource*.json
          retention-days: 30

  release-resource:
    name: Shipped Linux CLI resource comparison
    if: github.event_name == 'workflow_dispatch' && inputs.include_release
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      VIZE_CI_FILES: ${{ github.workspace }}/.github/scripts/workflows/davinci-resource-budgets
      CARGO_TERM_COLOR: always
      NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Install the repository Rust toolchain
        run: . "${{ env.VIZE_CI_FILES }}/install-the-repository-rust-toolchain-2.sh"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: lsp-release-resources
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      - name: Build the shipped Linux CLI recipe
        run: . "${{ env.VIZE_CI_FILES }}/build-the-shipped-linux-cli-recipe.sh"
      - name: Record the measured binary and build identity
        run: . "${{ env.VIZE_CI_FILES }}/record-the-measured-binary-and-build-identity-2.sh"
      - name: Measure the complete TS-44 campaign with the shipped profile
        run: . "${{ env.VIZE_CI_FILES }}/measure-the-complete-ts-44-campaign-with-the-shipped.sh"
      - name: Apply every unchanged TS-44 ceiling to this additional build
        run: rust-script tools/commands/davinci/resource-budgets.rs --check --measurement "${RUNNER_TEMP}/release-resource.json"
      - name: Verify the protocol and controlled edit oracle
        run: '. "${{ env.VIZE_CI_FILES }}/verify-the-protocol-and-controlled-edit-oracle-2.sh"'
      - name: Measure 10000 open buffers, 16 production providers, and Corsa
        run: '. "${{ env.VIZE_CI_FILES }}/measure-10000-open-buffers-16-production-providers-and-2.sh"'
      - name: Summarize the separate release measurements
        if: ${{ !cancelled() }}
        run: . "${{ env.VIZE_CI_FILES }}/summarize-the-separate-release-measurements.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: release-lsp-resources-linux-x64
          path: |
            ${{ runner.temp }}/release-build-identity.json
            ${{ runner.temp }}/release-resource.json
            ${{ runner.temp }}/release-lsp-resource*.json
          retention-days: 30
