name: Public release acceptance
on:
  workflow_dispatch:
    inputs:
      cut: { description: Official source before versioning C, required: true, type: string }
      head: { description: Frozen versioned source H, required: true, type: string }
      tag: { description: Published stable minor tag, required: true, type: string }
      source_pr: { description: Official frozen source PR, required: true, type: string }
      release_run:
        description: Original official Release R; success or an explicit authenticated consumer replacement required
        required: true
        type: string
      consumer_recovery_run:
        description: Explicit signed consumer replacement run for an admitted frozen fixture failure only
        required: false
        default: ""
        type: string
permissions: { contents: read, actions: read }
concurrency:
  group: public-release-acceptance-${{ inputs.release_run }}
  cancel-in-progress: false
jobs:
  public-consumer:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      PUBLIC_CUT: ${{ inputs.cut }}
      PUBLIC_HEAD: ${{ inputs.head }}
      PUBLIC_TAG: ${{ inputs.tag }}
      PUBLIC_SOURCE_PR: ${{ inputs.source_pr }}
      PUBLIC_RELEASE_RUN: ${{ inputs.release_run }}
      PUBLIC_CONSUMER_RECOVERY_RUN: ${{ inputs.consumer_recovery_run }}
      PUBLIC_OUTPUT: ${{ github.workspace }}/artifacts/public-release/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Require reviewed main and absent runtime overrides
        id: guard
        env: { DISPATCH_REF: "${{ github.ref }}" }
        shell: bash
        run: |
          test "$DISPATCH_REF" = refs/heads/main
          for key in NODE_OPTIONS VIZE_PREFER_WORKSPACE_BINDING NAPI_RS_NATIVE_LIBRARY_PATH NAPI_RS_FORCE_WASI VIZE_ALLOW_NATIVE_VERSION_MISMATCH CORSA_PATH CORSA_EXECUTABLE TSGO_PATH TSGO_EXECUTABLE VIZE_PUBLIC_NATIVE_CUSTODY VIZE_OXLINT_NATIVE_CUSTODY VIZE_CORSA_DEV_PATHS CARGO_BIN_EXE_vize SOURCE_SHA VIZE_TEST_REQUIRE_TSGO VIZE_TEST_DISABLE_TSGO VIZE_TEST_FIX_HISTORY_CAPTURE_DIR VIZE_INLAY_HINT_CAPTURE VIZE_LSP_PASSIVE_EVIDENCE RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_RUSTC RUSTC RUSTUP_TOOLCHAIN; do
            if [ -n "${!key:-}" ]; then
              echo "::error::Runtime override must be absent: $key"
              exit 1
            fi
          done
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ github.workflow_sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: package.json, run-install: false }
      - name: Install pinned signed consumer replacement verifier
        if: inputs.consumer_recovery_run != ''
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        with: { cosign-release: v2.4.1 }
      - name: Authenticate public release and prepare a fresh consumer
        env: { GH_TOKEN: "${{ github.token }}" }
        id: prepare
        shell: bash
        run: |
          mkdir -p "$PUBLIC_OUTPUT"
          node tools/support/release/public_acceptance/accept.ts prepare 2>&1 | tee "$PUBLIC_OUTPUT/prepare.log"
      - name: Install exact public versions
        id: install
        working-directory: ${{ env.PUBLIC_CONSUMER }}
        shell: bash
        run: npm install --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org 2>&1 | tee "$PUBLIC_OUTPUT/install.log"
      - name: Retain and authenticate the installed consumer
        id: installed
        shell: bash
        run: node tools/support/release/public_acceptance/accept.ts installed 2>&1 | tee "$PUBLIC_OUTPUT/installed.log"
      - uses: ./.github/actions/setup-ubuntu-archive
      - name: Install real Chromium
        id: chromium
        working-directory: ${{ env.PUBLIC_CONSUMER }}
        shell: bash
        run: npx --no-install playwright install --with-deps chromium 2>&1 | tee "$PUBLIC_OUTPUT/chromium.log"
      - name: Replay original native DOM and SSR cases
        id: native
        working-directory: ${{ env.PUBLIC_CONSUMER }}
        shell: bash
        run: node native.ts "$PUBLIC_VERSION" "$PUBLIC_OUTPUT/native.json" 2>&1 | tee "$PUBLIC_OUTPUT/native.log"
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        id: lsp_rust
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.install.outcome == 'success' && steps.installed.outcome == 'success' }}
        with: { toolchain: "${{ env.PUBLIC_LSP_TOOLCHAIN }}" }
      - name: Replay original 32 transactions with the installed public CLI
        id: lsp
        if: ${{ !cancelled() && steps.guard.outcome == 'success' && steps.prepare.outcome == 'success' && steps.install.outcome == 'success' && steps.installed.outcome == 'success' && steps.lsp_rust.outcome == 'success' }}
        shell: bash
        run: node tools/support/release/public_acceptance/lsp.ts 2>&1 | tee "$PUBLIC_OUTPUT/lsp.log"
      - name: Replay complete formatter CLI stock semantics with the installed public CLI
        id: formatter
        if: ${{ !cancelled() && steps.guard.outcome == 'success' && steps.prepare.outcome == 'success' && steps.install.outcome == 'success' && steps.installed.outcome == 'success' && steps.lsp.outcome == 'success' }}
        shell: bash
        run: |
          node --test tests/tooling/formatter-expression-width-semantics.test.mjs tests/tooling/formatter-continuation-prefix-width.test.mjs 2>&1 | tee "$PUBLIC_OUTPUT/formatter.log"
      - name: Replay public Musea gallery and globals
        id: browser
        if: >-
          ${{ !cancelled() &&
              steps.guard.outcome == 'success' &&
              steps.prepare.outcome == 'success' &&
              steps.install.outcome == 'success' &&
              steps.installed.outcome == 'success' &&
              steps.chromium.outcome == 'success' &&
              (steps.native.outcome == 'success' || steps.native.outcome == 'failure') }}
        working-directory: ${{ env.PUBLIC_CONSUMER }}
        shell: bash
        run: node browser.ts "$PUBLIC_VERSION" "$PUBLIC_OUTPUT/musea.json" 2>&1 | tee "$PUBLIC_OUTPUT/musea.log"
      - name: Authenticate and acquire the pinned static-gallery tunnel
        id: tunnel
        if: >-
          ${{ !cancelled() &&
              steps.guard.outcome == 'success' &&
              steps.prepare.outcome == 'success' &&
              steps.install.outcome == 'success' &&
              steps.installed.outcome == 'success' &&
              steps.chromium.outcome == 'success' &&
              (steps.native.outcome == 'success' || steps.native.outcome == 'failure') &&
              (steps.browser.outcome == 'success' || steps.browser.outcome == 'failure') }}
        shell: bash
        run: node tools/support/release/public_acceptance/vrt_tunnel_setup.ts
      - name: Observe installed public Musea VRT and hosted audits
        id: vrt
        if: >-
          ${{ !cancelled() &&
              steps.guard.outcome == 'success' &&
              steps.prepare.outcome == 'success' &&
              steps.install.outcome == 'success' &&
              steps.installed.outcome == 'success' &&
              steps.chromium.outcome == 'success' &&
              (steps.native.outcome == 'success' || steps.native.outcome == 'failure') &&
              (steps.browser.outcome == 'success' || steps.browser.outcome == 'failure') }}
        working-directory: ${{ env.PUBLIC_CONSUMER }}
        shell: bash
        run: |
          export VRT_RETAINED_OUTPUT="$PUBLIC_OUTPUT"
          PUBLIC_OUTPUT="$(mktemp -d "$RUNNER_TEMP/vize-public-vrt.XXXXXX")"
          vrt_status=0
          node vrt_observer.ts "$PUBLIC_VERSION" "$PUBLIC_OUTPUT/vrt.json" 3>&2 > "$PUBLIC_OUTPUT/vrt.log" 2>&1 || vrt_status=$?
          printf 'VRT observer exited: %d\n' "${vrt_status:-0}" >&2
          if ! node vrt_retained.ts "$PUBLIC_OUTPUT/vrt.log" "$VRT_RETAINED_OUTPUT"; then
            if [ "$vrt_status" -eq 0 ]; then exit 1; fi
            exit "$vrt_status"
          fi
          exit "$vrt_status"
      - name: Seal installed public acceptance
        env: { GH_TOKEN: "${{ github.token }}" }
        if: ${{ success() && steps.native.outcome == 'success' && steps.browser.outcome == 'success' && steps.lsp.outcome == 'success' && steps.formatter.outcome == 'success' }}
        shell: bash
        run: node tools/support/release/public_acceptance/accept.ts finish 2>&1 | tee "$PUBLIC_OUTPUT/finish.log"
      - name: Retain diagnostic public metadata first
        if: ${{ always() && (steps.vrt.outcome == 'skipped' || ((steps.vrt.outcome == 'success' || steps.vrt.outcome == 'failure') && steps.vrt.outputs.upload-safe == 'true')) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/public-release/**/*.json
            artifacts/public-release/**/*.jsonl
          if-no-files-found: error
          retention-days: 30
      - name: Retain actual public observations
        if: ${{ always() && (steps.vrt.outcome == 'skipped' || ((steps.vrt.outcome == 'success' || steps.vrt.outcome == 'failure') && steps.vrt.outputs.upload-safe == 'true')) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/public-release
          if-no-files-found: error
          retention-days: 30
