# DO NOT EDIT. Generated from tools/config/pkl/workflows/maintenance/tool-codegen-equivalence.pkl.
# Edit the Pkl source and run `node tools/commands/generate/repository-config.ts`.
name: Tool codegen equivalence
on:
  workflow_dispatch:
    inputs:
      base:
        description: Full base commit SHA
        required: true
        type: string
      head:
        description: Full candidate commit SHA
        required: true
        type: string
      package:
        description: Workspace library package to compare
        required: true
        default: vize_maestro
        type: string
      product:
        description: Library (lib), binary (bin:NAME), or packaged native image (node-addon)
        required: true
        default: lib
        type: string
  pull_request:
    paths:
      - ".github/workflows/tool-codegen-equivalence.yml"
      - ".github/scripts/workflows/tool-codegen-equivalence/**"
      - "tools/commands/levels/codegen-equivalence.ts"
      - "tests/tooling/levels-codegen-equivalence.test.ts"
permissions: { contents: read }
jobs:
  compare:
    name: Compare ${{ inputs.package || 'vize_maestro' }} ${{ inputs.product || 'lib' }} ${{ matrix.mode }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: [default, portable]
    env:
      BASE_SHA: ${{ inputs.base || github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ inputs.head || github.event.pull_request.head.sha }}
      PACKAGE: ${{ inputs.package || 'vize_maestro' }}
      PRODUCT: ${{ inputs.product || 'lib' }}
      MODE: ${{ matrix.mode }}
      CARGO_BUILD_JOBS: "24"
      RUSTUP_TOOLCHAIN: "1.100.0"
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/tool-codegen-equivalence/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          {
            ref: "${{ github.event.pull_request.head.sha || github.sha }}",
            persist-credentials: false,
          }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: "24.14.0" }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.100.0" }
      - uses: ./.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - name: Verify comparison controls and fetch both commits
        run: . "${{ env.VIZE_CI_FILES }}/verify-comparison-controls-and-fetch-both-commits.sh"
      - name: Compare independently compiled products
        run: . "${{ env.VIZE_CI_FILES }}/compare-independently-compiled-products.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tool-codegen-${{ matrix.mode }}
          path: ${{ runner.temp }}/codegen-${{ matrix.mode }}.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure() && (startsWith(env.PRODUCT, 'bin:') || env.PRODUCT == 'node-addon')
        with:
          name: tool-executable-difference-${{ matrix.mode }}
          path: ${{ runner.temp }}/codegen-${{ matrix.mode }}.json.executables-*/*
          retention-days: 7
          if-no-files-found: ignore
