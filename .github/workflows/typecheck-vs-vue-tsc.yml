name: Typecheck vs vue-tsc

# One fixed comparative diagnostic/timing packet; ordinary PRs validate pure contracts only.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - .github/workflows/typecheck-vs-vue-tsc.yml
      - .github/scripts/workflows/typecheck-vs-vue-tsc/**
      - tools/benchmarks/scripts/typecheck-vs-vue-tsc*.ts
      - tests/tooling/typecheck-vs-vue-tsc*.test.ts
      - tests/_fixtures/tooling/typecheck-vs-vue-tsc-provider/**

concurrency:
  group: typecheck-vs-vue-tsc-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: { contents: read }
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_DISABLE_COMPILE_CACHE: "1"
jobs:
  contracts:
    name: comparative-source-contracts
    runs-on: blacksmith-32vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24.14.0", package-manager-cache: false }
      - name: Fetch immutable product source oracle
        run: git fetch --no-tags --depth=1 origin ea22f2cd2aa661b9bdab940e25464eff692b935f
      - name: Validate complete evidence and refusal controls
        run: node --test tests/tooling/typecheck-vs-vue-tsc-evidence.test.ts tests/tooling/typecheck-vs-vue-tsc-frozen.test.ts
  bench:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: contracts
    name: fixed-2500-and-misskey
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 240
    env:
      VIZE_CI_FILES: "${{ github.workspace }}/.github/scripts/workflows/typecheck-vs-vue-tsc"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false, fetch-depth: 2 }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.99.1" }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24.14.0", package-manager-cache: false }
      - name: Prepare exact product and frozen provider
        run: . "${{ env.VIZE_CI_FILES }}/prepare-exact-product-and-frozen-provider.sh"
      - name: Build fixed normal product
        run: . "${{ env.VIZE_CI_FILES }}/build-fixed-normal-product.sh"
      - name: Measure
        run: . "${{ env.VIZE_CI_FILES }}/measure.sh"
      - name: Preserve all raw before any verdict
        if: always()
        run: . "${{ env.VIZE_CI_FILES }}/preserve-all-raw-before-any-verdict.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: typecheck-vs-vue-tsc-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/typecheck-vs-vue-tsc-raw.tgz
          if-no-files-found: error
          retention-days: 30
