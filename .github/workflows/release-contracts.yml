name: Release contracts
# Runs the release pipeline's tool and workflow tests on changes to them.
on:
  pull_request:
    paths:
      - ".github/workflows/release*.yml"
      - ".github/actions/release-*/**"
      - ".github/actions/build-release-*/**"
      - ".github/release-notes/drop-in-scope.md"
      - "pnpm-workspace.yaml"
      - "tools/support/release/**"
      - "tests/tooling/release/**"
      - "tests/tooling/package-manifests.test.ts"
      - "tests/tooling/bundler-plugin-manifests.test.ts"
      - "tests/tooling/davinci-plugin-sdk-release.test.ts"
      - "tests/tooling/drop-in-claim-scope.test.ts"
      - "tests/tooling/github-workflows-release-build.test.ts"
      - "tests/tooling/release-jsr-workflow.test.ts"
      - "tests/tooling/publish-npm-package*.test.ts"
      - "tests/tooling/publish-editor*.test.ts"
      - "tests/tooling/publish-open-vsx-extension.test.ts"
      - "tests/tooling/publish-vscode-extension*.test.ts"
      - "tests/tooling/support/fake-npm-registry.ts"
      - "tests/tooling/support/fake-command.ts"
  workflow_dispatch:
    inputs:
      version:
        description: Exact published version for an optional consumer qualification
        required: false
        type: string
      source_sha:
        description: Exact immutable public release tag commit
        required: false
        type: string
      candidate:
        description: Exact released candidate for complete public contracts
        required: false
        type: string
      phase:
        description: Set release-contracts only for the independent public consumer
        required: false
        type: string
      type_admission:
        description: Qualify type admission only on its first containing published after release
        required: false
        type: boolean
        default: false
      additional_observers:
        description: Qualify independent published icon and canonical SDK observers after core contracts
        required: false
        type: boolean
        default: false
      custom_properties:
        description: Qualify the after-only public custom-property and authored directive contracts
        required: false
        type: boolean
        default: false
permissions: { contents: read }
concurrency:
  group: release-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  contracts:
    if: github.event_name != 'workflow_dispatch' || inputs.phase != 'release-contracts' && inputs.phase != 'type-admission-capability'
    name: Release pipeline contracts
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: ./.github/actions/cache-vp-bootstrap
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: package.json, cache: true, run-install: true }
      - name: Release workflow, versioning and publication
        run: >-
          node --test
          tests/tooling/release/npm-resume.test.ts
          tests/tooling/release/public-consumer-guards.test.ts
          tests/tooling/release/public-observers.test.ts
          tests/tooling/release/public-type-admission.test.ts
          tests/tooling/release/public-type-admission-capability.test.ts
          tests/tooling/release/public-provider.test.ts
          tests/tooling/release/release-workflow.test.ts
          tests/tooling/release/release-notes.test.ts
          tests/tooling/release/verify-published-registry.test.ts
          tests/tooling/release/release-signing.test.ts
          tests/tooling/release/editor-platforms.test.ts
          tests/tooling/github-workflows-release-build.test.ts
          tests/tooling/release-jsr-workflow.test.ts
          tests/tooling/drop-in-claim-scope.test.ts
          tests/tooling/package-manifests.test.ts
          tests/tooling/bundler-plugin-manifests.test.ts
          tests/tooling/davinci-plugin-sdk-release.test.ts
      - name: Concurrent npm publication
        run: node --test tests/tooling/publish-npm-package*.test.ts
      - name: Target-aware editor publication
        run: node --test tests/tooling/publish-editor*.test.ts tests/tooling/publish-open-vsx-extension.test.ts tests/tooling/publish-vscode-extension*.test.ts
  public-release-contracts:
    if: github.repository == 'ubugeeei-prod/vize' && github.ref == 'refs/heads/main' && (inputs.phase == 'release-contracts' || (inputs.phase == 'after' && inputs.candidate != '')) || (github.repository == 'ubugeeei-prod/vize' && github.ref == 'refs/heads/main' && inputs.phase == 'after' && inputs.additional_observers == true) || (github.repository == 'ubugeeei-prod/vize' && github.ref == 'refs/heads/main' && inputs.type_admission == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUBLIC_VERSION: ${{ inputs.version }}
      PUBLIC_SOURCE_SHA: ${{ inputs.source_sha }}
      PUBLIC_CANDIDATE: ${{ inputs.candidate }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "26.6.0", package-manager-cache: false }
      - name: Validate the explicit public candidate
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { mkdirSync, writeFileSync } from "node:fs";
          import path from "node:path";
          const { PUBLIC_VERSION: version, PUBLIC_CANDIDATE: candidate, PUBLIC_SOURCE_SHA: source } = process.env;
          const valid = /^0\.[0-9]+\.0$/.test(version ?? "") && /^[0-9a-f]{40}$/.test(candidate ?? "") && source === candidate;
          const directory = path.join(process.env.RUNNER_TEMP, "public-release-proof");
          mkdirSync(directory, { recursive: true });
          writeFileSync(path.join(directory, "candidate-validation.json"), JSON.stringify({
            version, candidate, source, accepted: valid, workflowSha: process.env.GITHUB_SHA,
          }, null, 2) + "\n", { flag: "wx" });
          assert.equal(valid, true, "an exact public version and matching immutable candidate are required");
          NODE
      - name: Install exact public packages in an independent fresh consumer
        run: node tools/support/release/public_release_contracts/bootstrap.ts "$RUNNER_TEMP/public-release-consumer" "$PUBLIC_VERSION" "$RUNNER_TEMP/public-release-proof"
      - name: Verify complete packets, runtime controls, and native public custody
        run: node tools/support/release/public_release_contracts/run.ts "$RUNNER_TEMP/public-release-consumer" "$PUBLIC_VERSION" "$RUNNER_TEMP/public-release-proof" "$PUBLIC_CANDIDATE"
      - name: Prove the candidate contains the required icon source
        if: inputs.additional_observers == true && inputs.phase == 'after'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_ICON_SOURCE: d38ab7e48514566f1776f25439e8777a9856b5a6
        run: |
          gh api "repos/$GITHUB_REPOSITORY/compare/$REQUIRED_ICON_SOURCE...$PUBLIC_CANDIDATE" > "$RUNNER_TEMP/public-release-proof/icons-source-comparison.json"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const comparison = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/public-release-proof/icons-source-comparison.json", "utf8"));
          assert.equal(comparison.base_commit.sha, process.env.REQUIRED_ICON_SOURCE);
          assert.ok(["ahead", "identical"].includes(comparison.status));
          NODE
      - name: Qualify independent published icon class packets
        if: inputs.additional_observers == true && inputs.phase == 'after'
        run: node tools/support/release/public_icons/verify.ts "$RUNNER_TEMP/public-release-consumer" "$PUBLIC_VERSION" "$RUNNER_TEMP/public-release-proof/icons-10928.json"
      - name: Preserve complete consumer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-release-consumer-${{ inputs.version }}
          path: ${{ runner.temp }}/public-release-proof/
          if-no-files-found: error
          retention-days: 30

  public-custom-properties:
    if: github.repository == 'ubugeeei-prod/vize' && github.ref == 'refs/heads/main' && inputs.phase == 'after' && inputs.custom_properties || (github.repository == 'ubugeeei-prod/vize' && github.ref == 'refs/heads/main' && inputs.type_admission == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PUBLIC_VERSION: ${{ inputs.version }}
      PUBLIC_SOURCE_SHA: ${{ inputs.source_sha }}
      REQUIRED_CPP_SOURCE: 7c2f6f46172404a8f95335a79ee2b95094f6b7ee
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24.14.0", package-manager-cache: false }
      - name: Prove the first containing type-admission publication
        if: inputs.type_admission == true
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TYPE_CANDIDATE: ${{ inputs.candidate }}
          PUBLIC_TYPE_PHASE: ${{ inputs.phase }}
        run: node tools/support/release/type-admission-eligibility.ts "$PUBLIC_VERSION" "$PUBLIC_TYPE_CANDIDATE" "$PUBLIC_SOURCE_SHA" "$PUBLIC_TYPE_PHASE" "$RUNNER_TEMP/public-type-admission-eligibility.json"
      - name: Prove the immutable tag contains the merged public-instance change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PUBLIC_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$PUBLIC_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "refs/tags/v$PUBLIC_VERSION"
          [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == "$PUBLIC_SOURCE_SHA" ]]
          gh api "repos/$GITHUB_REPOSITORY/compare/$REQUIRED_CPP_SOURCE...$PUBLIC_SOURCE_SHA" > "$RUNNER_TEMP/cpp-source-comparison.json"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync, writeFileSync } from "node:fs";
          const comparison = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/cpp-source-comparison.json", "utf8"));
          assert.equal(comparison.base_commit.sha, process.env.REQUIRED_CPP_SOURCE);
          assert.ok(["ahead", "identical"].includes(comparison.status));
          writeFileSync(process.env.RUNNER_TEMP + "/cpp-release-identity.json", JSON.stringify({
            version: process.env.PUBLIC_VERSION, sourceSha: process.env.PUBLIC_SOURCE_SHA,
            requiredSource: process.env.REQUIRED_CPP_SOURCE, containsRequiredSource: true,
            comparisonStatus: comparison.status, workflowSha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
          }, null, 2) + "\n", { flag: "wx" });
          NODE
      - name: Qualify fresh public custom properties and authored directive ownership
        run: |
          node tools/support/release/public_custom_properties/verify.ts \
            "$PUBLIC_VERSION" "$RUNNER_TEMP/public-custom-properties-consumer" \
            "$RUNNER_TEMP/cpp-release-identity.json"
      - name: Qualify independent published canonical SDK
        if: inputs.additional_observers == true && inputs.phase == 'after'
        run: node tools/support/release/public_canonical_sdk/verify.ts "$RUNNER_TEMP/public-custom-properties-consumer" "$PUBLIC_VERSION" "$RUNNER_TEMP/public-custom-properties-consumer/public-canonical-sdk.json"
      - name: Preserve the original CPP consumer before template admission
        if: inputs.type_admission == true
        run: env -u GH_TOKEN -u GITHUB_TOKEN -u NODE_AUTH_TOKEN -u NPM_TOKEN node tools/support/release/type-admission-cpp-custody.ts "$RUNNER_TEMP/public-custom-properties-consumer" "$PUBLIC_VERSION" before "$RUNNER_TEMP/public-type-admission-cpp-custody.json"
      - name: Install the isolated native TypeScript mapper host
        if: inputs.type_admission == true
        run: env -u GH_TOKEN -u GITHUB_TOKEN -u NODE_AUTH_TOKEN -u NPM_TOKEN node tools/support/release/type-admission-mapper-host.ts "$RUNNER_TEMP/public-type-admission-mapper-host" "$RUNNER_TEMP/public-type-admission-mapper-host-proof"
      - name: Qualify independent published template type admission
        if: inputs.type_admission == true
        run: env -u GH_TOKEN -u GITHUB_TOKEN -u NODE_AUTH_TOKEN -u NPM_TOKEN node tools/support/release/public_type_admission/run.ts "$RUNNER_TEMP/public-custom-properties-consumer" "$PUBLIC_VERSION" "$RUNNER_TEMP/public-custom-properties-consumer/type-admission" "$RUNNER_TEMP/public-type-admission-eligibility.json"
      - name: Verify the original CPP consumer after template admission
        if: always() && inputs.type_admission == true
        run: env -u GH_TOKEN -u GITHUB_TOKEN -u NODE_AUTH_TOKEN -u NPM_TOKEN node tools/support/release/type-admission-cpp-custody.ts "$RUNNER_TEMP/public-custom-properties-consumer" "$PUBLIC_VERSION" after "$RUNNER_TEMP/public-type-admission-cpp-custody.json"
      - name: Preserve complete public packets and immutable original witnesses
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-custom-properties-${{ inputs.version }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/cpp-source-comparison.json
            ${{ runner.temp }}/cpp-release-identity.json
            ${{ runner.temp }}/public-custom-properties-consumer/*.json
            ${{ runner.temp }}/public-custom-properties-consumer/*.stdout
            ${{ runner.temp }}/public-custom-properties-consumer/*.stderr
            ${{ runner.temp }}/public-custom-properties-consumer/*.status
            ${{ runner.temp }}/public-custom-properties-consumer/*.txt
            ${{ runner.temp }}/public-custom-properties-consumer/src/
            tools/support/release/public_custom_properties/
            ${{ runner.temp }}/public-custom-properties-consumer/public-canonical-sdk-evidence/
            ${{ runner.temp }}/public-type-admission-eligibility.json
            ${{ runner.temp }}/public-custom-properties-consumer/type-admission/
            ${{ runner.temp }}/public-type-admission-mapper-host-proof/
            ${{ runner.temp }}/public-type-admission-cpp-custody.json*

  type-admission-source-capability:
    if: github.repository == 'ubugeeei-prod/vize' && github.event_name == 'workflow_dispatch' && inputs.phase == 'type-admission-capability'
    name: Isolated mapper host source capability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PUBLIC_VERSION: ${{ inputs.version }}
      PUBLIC_SOURCE_SHA: ${{ inputs.source_sha }}
      PUBLIC_CANDIDATE: ${{ inputs.candidate }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24.14.0", package-manager-cache: false }
      - name: Prove the known public source for the isolated host capability
        env:
          GH_TOKEN: ${{ github.token }}
          CAPABILITY_PHASE: ${{ inputs.phase }}
          CAPABILITY_ADMISSION: ${{ inputs.type_admission }}
          CAPABILITY_OBSERVERS: ${{ inputs.additional_observers }}
          CAPABILITY_CPP: ${{ inputs.custom_properties }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";
          const version = process.env.PUBLIC_VERSION;
          const source = process.env.PUBLIC_SOURCE_SHA;
          const required = "7c2f6f46172404a8f95335a79ee2b95094f6b7ee";
          const repository = "ubugeeei-prod/vize";
          assert.equal(process.env.GITHUB_REPOSITORY, repository);
          assert.equal(process.env.GITHUB_REF, "refs/heads/test/public-type-admission-release");
          assert.equal(process.env.CAPABILITY_PHASE, "type-admission-capability");
          assert.equal(version, "0.603.0");
          assert.equal(source, "3778a06863bc70bf63b435ae816cca134d2d438e");
          assert.equal(process.env.PUBLIC_CANDIDATE, source);
          for (const name of ["CAPABILITY_ADMISSION", "CAPABILITY_OBSERVERS", "CAPABILITY_CPP"])
            assert.notEqual(process.env[name], "true", "source-only proof must not select public qualification");
          assert.ok(process.env.GH_TOKEN);
          const api = async (endpoint) => {
            const response = await fetch("https://api.github.com/repos/" + repository + endpoint, {
              headers: { Authorization: "Bearer " + process.env.GH_TOKEN, Accept: "application/vnd.github+json" },
              signal: AbortSignal.timeout(30000),
            });
            assert.equal(response.status, 200, endpoint);
            return response.json();
          };
          const publishedRelease = await api("/releases/tags/v" + version);
          const tags = await api("/tags?per_page=100");
          const tag = tags.find((value) => value.name === "v" + version);
          assert.ok(tag);
          assert.equal(tag.commit.sha, source);
          assert.equal(publishedRelease.tag_name, tag.name);
          assert.equal(publishedRelease.draft, false);
          assert.ok(publishedRelease.published_at);
          const comparison = await api("/compare/" + required + "..." + source);
          assert.equal(comparison.base_commit.sha, required);
          assert.equal(comparison.merge_base_commit.sha, required);
          assert.equal(comparison.behind_by, 0);
          assert.ok(["ahead", "identical"].includes(comparison.status));
          const temporary = process.env.RUNNER_TEMP;
          const write = (name, value) => fs.writeFileSync(path.join(temporary, name), JSON.stringify(value, null, 2) + "\n", { flag: "wx" });
          write("cpp-source-comparison.json", comparison);
          write("cpp-release-identity.json", {
            version, sourceSha: source, requiredSource: required, containsRequiredSource: true,
            comparisonStatus: comparison.status, workflowSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID,
          });
          write("public-type-admission-capability-plan.json", {
            schema: "vize.typeAdmission.sourceCapabilityEligibility.v1", scope: "source-capability-only",
            coreReleaseEligible: false, version, sourceSha: source, tag, publishedRelease, comparison,
            workflowSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID,
            mapperHost: { route: "hosted-content-mapper", sdkVersion: "7.1.0-beta",
              workspace: path.join(temporary, "public-type-admission-capability-host"),
              setupReceipt: path.join(temporary, "public-type-admission-capability-host-proof/setup.json.txt") },
          });
          NODE
      - name: Authenticate the existing public CLI and native TypeScript provider
        run: env -u GH_TOKEN -u GITHUB_TOKEN -u NODE_AUTH_TOKEN -u NPM_TOKEN node tools/support/release/public_custom_properties/verify.ts "$PUBLIC_VERSION" "$RUNNER_TEMP/public-custom-properties-consumer" "$RUNNER_TEMP/cpp-release-identity.json"
      - name: Preserve the original CPP consumer before source capability
        run: env -u GH_TOKEN -u GITHUB_TOKEN -u NODE_AUTH_TOKEN -u NPM_TOKEN node tools/support/release/type-admission-cpp-custody.ts "$RUNNER_TEMP/public-custom-properties-consumer" "$PUBLIC_VERSION" before "$RUNNER_TEMP/public-type-admission-cpp-custody.json"
      - name: Install the isolated native TypeScript mapper host
        run: env -u GH_TOKEN -u GITHUB_TOKEN -u NODE_AUTH_TOKEN -u NPM_TOKEN node tools/support/release/type-admission-mapper-host.ts "$RUNNER_TEMP/public-type-admission-capability-host" "$RUNNER_TEMP/public-type-admission-capability-host-proof"
      - name: Verify actual hosted mapper capability and its physical public provider
        run: env -u GH_TOKEN -u GITHUB_TOKEN -u NODE_AUTH_TOKEN -u NPM_TOKEN node tools/support/release/public_type_admission/capability.ts "$RUNNER_TEMP/public-custom-properties-consumer" "$PUBLIC_VERSION" "$RUNNER_TEMP/public-type-admission-capability" "$RUNNER_TEMP/public-type-admission-capability-plan.json"
      - name: Verify the original CPP consumer after source capability
        if: always()
        run: env -u GH_TOKEN -u GITHUB_TOKEN -u NODE_AUTH_TOKEN -u NPM_TOKEN node tools/support/release/type-admission-cpp-custody.ts "$RUNNER_TEMP/public-custom-properties-consumer" "$PUBLIC_VERSION" after "$RUNNER_TEMP/public-type-admission-cpp-custody.json"
      - name: Preserve the source-only capability observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: type-admission-source-capability-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/cpp-source-comparison.json
            ${{ runner.temp }}/cpp-release-identity.json
            ${{ runner.temp }}/public-type-admission-capability-plan.json
            ${{ runner.temp }}/public-type-admission-capability/
            ${{ runner.temp }}/public-type-admission-capability-host-proof/
            ${{ runner.temp }}/public-type-admission-cpp-custody.json*
            ${{ runner.temp }}/public-custom-properties-consumer/*.json
            ${{ runner.temp }}/public-custom-properties-consumer/*.stdout
            ${{ runner.temp }}/public-custom-properties-consumer/*.stderr
            ${{ runner.temp }}/public-custom-properties-consumer/*.status
            ${{ runner.temp }}/public-custom-properties-consumer/*.txt
            ${{ runner.temp }}/public-custom-properties-consumer/src/
