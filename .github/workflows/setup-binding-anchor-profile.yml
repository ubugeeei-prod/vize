name: Setup binding anchor allocation profile
on:
  pull_request:
    paths:
      - crates/vize_canon/src/virtual_ts/generator/anchors.rs
      - crates/vize_canon/src/virtual_ts/generator/imports.rs
      - crates/vize_canon/src/virtual_ts/generator/type_only_imports.rs
      - crates/vize_canon/src/virtual_ts/generator/type_only_imports/**
      - tests/_fixtures/differential/typechecker/prepared-type-only-import-facts/**
      - crates/vize_canon/src/virtual_ts/props.rs
      - crates/vize_canon/src/virtual_ts/props/template_bindings.rs
      - tools/benchmarks/crates/vize/tests/setup_binding_anchor_profile.rs
      - tools/benchmarks/scripts/setup-binding-anchor-evidence.ts
      - tools/benchmarks/scripts/setup-binding-constructor-evidence.ts
      - tools/support/compat/content-mapper/**
      - tests/tooling/setup-binding-anchor-evidence.test.ts
      - .github/workflows/setup-binding-anchor-profile.yml
      - .github/scripts/workflows/setup-binding-anchor-profile/**
      - .github/scripts/workflows/shared/**
permissions: { contents: read }
concurrency:
  group: setup-binding-anchor-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUSTUP_TOOLCHAIN: "1.100.0"
      CARGO_BUILD_JOBS: "24"
      CARGO_INCREMENTAL: "0"
      RAYON_NUM_THREADS: "8"
      VIZE_BINDING_PROFILE_INPUT: ${{ github.workspace }}/tests/_fixtures/differential/typechecker/prepared-type-only-import-facts/Imports.vue.txt
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/setup-binding-anchor-profile/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          {
            ref: "${{ github.event.pull_request.head.sha }}",
            fetch-depth: 0,
            persist-credentials: false,
          }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version-file: package.json, package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.100.0" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - name: Build role-isolated exact source observers
        run: . "${{ env.VIZE_CI_FILES }}/build-role-isolated-exact-source-observers.sh"
      - name: Compare fresh generation packets and allocation pressure
        run: . "${{ env.VIZE_CI_FILES }}/compare-fresh-generation-packets-and-allocation-pressure.sh"
      - name: Require complete constructor projection byte parity
        run: . "${{ env.VIZE_CI_FILES }}/require-complete-constructor-projection-byte-parity.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: setup-binding-anchor-profile-${{ github.sha }}
          path: ${{ runner.temp }}/binding-evidence
          retention-days: 14
