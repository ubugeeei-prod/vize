name: Release Operator

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Start a minor, prepare a reviewed stable patch, resume, or retire an immutable cut
        type: choice
        options: [start, patch, resume, retire, retire-before-release, recover-consumer]
        default: start
        required: true
      source_cut:
        description: Exact reviewed C; required for patch and recover-consumer
        type: string
        default: ""
        required: false
      source_pr:
        description: Original source PR number; required for resume and either retirement mode
        type: string
        default: ""
        required: false
      source_head:
        description: Exact original 40-hex source head; required for either retirement mode
        type: string
        default: ""
        required: false
      source_tag:
        description: Exact original v0.minor.0 tag; required for either retirement mode
        type: string
        default: ""
        required: false
      release_run:
        description: Original Release workflow run ID; required only for retire
        type: string
        default: ""
        required: false
      qualification_run:
        description: Original failed exact-H qualification Check; required only for retire-before-release
        type: string
        default: ""
        required: false
      operator_run:
        description: Original Release Operator entry run ID; required for either retirement mode
        type: string
        default: ""
        required: false
      consumer_recovery_run:
        description: Signed public consumer replacement run; required only for recover-consumer
        type: string
        default: ""
        required: false

permissions: { contents: read }

# Do not share Release's release-candidates group: the operator waits on that run.
concurrency:
  group: release-operator
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  operator:
    if: github.repository == 'ubugeeei-prod/vize' && github.ref == 'refs/heads/main'
    name: Run the official pinned release operator
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Configure main-only deployment branches before adding the user credential.
    environment: release-operator
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          run-install: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with: { toolchain: "1.99.1" }
      - uses: ./.github/actions/setup-rust-script

      - name: Install the frozen graph
        run: vp install --frozen-lockfile

      - name: Install pinned consumer replacement verifier
        if: inputs.operation == 'recover-consumer'
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        with: { cosign-release: v2.4.1 }

      - name: Authorize the existing maintainer user and invoke the public release command
        env:
          GH_TOKEN: ${{ secrets.RELEASE_OPERATOR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_OPERATOR_TOKEN }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_SOURCE_CUT: ${{ inputs.source_cut }}
          RELEASE_SOURCE_PR: ${{ inputs.source_pr }}
          RELEASE_SOURCE_HEAD: ${{ inputs.source_head }}
          RELEASE_SOURCE_TAG: ${{ inputs.source_tag }}
          RELEASE_RUN: ${{ inputs.release_run }}
          RELEASE_QUALIFICATION_RUN: ${{ inputs.qualification_run }}
          RELEASE_ORIGINAL_OPERATOR_RUN: ${{ inputs.operator_run }}
          RELEASE_CONSUMER_RECOVERY_RUN: ${{ inputs.consumer_recovery_run }}
          VIZE_RELEASE_OPERATOR_TIMEOUT_SECONDS: "14400"
          VIZE_RELEASE_EXPECTED_CUT_SHA: ${{ (inputs.operation == 'start' || inputs.operation == 'patch') && github.sha || '' }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::Missing protected maintainer user credential"; exit 1; }
          login=$(gh api user --jq 'select(.type == "User") | .login')
          test -n "$login" && test "$login" = "$GITHUB_ACTOR" && test "$login" = "$GITHUB_TRIGGERING_ACTOR" || { echo "::error::The user credential must belong to the original and current triggering maintainer"; exit 1; }
          case "$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$login/permission" --jq '.role_name')" in
            maintain|admin) ;;
            *) echo "::error::The release operator requires maintain or admin"; exit 1 ;;
          esac
          id=$(gh api user --jq '.id')
          git config user.name "$login"
          git config user.email "$id+$login@users.noreply.github.com"
          gh auth setup-git --hostname github.com
          if [[ "$RELEASE_OPERATION" != "retire-before-release" && -n "$RELEASE_QUALIFICATION_RUN" ]]; then
            echo "::error::Only retire-before-release accepts a qualification run"; exit 1
          fi
          case "$RELEASE_OPERATION" in
            start|patch|resume)
              [[ -z "$RELEASE_SOURCE_HEAD" && -z "$RELEASE_SOURCE_TAG" && -z "$RELEASE_RUN" && -z "$RELEASE_ORIGINAL_OPERATOR_RUN" ]] || { echo "::error::Only retire accepts source head, tag, Release run and original operator run inputs"; exit 1; }
              ;;
          esac
          if [[ "$RELEASE_OPERATION" != "patch" && "$RELEASE_OPERATION" != "recover-consumer" && -n "$RELEASE_SOURCE_CUT" ]]; then
            echo "::error::Only patch and recover-consumer accept an explicit cut"; exit 1
          fi
          if [[ "$RELEASE_OPERATION" != "recover-consumer" && -n "$RELEASE_CONSUMER_RECOVERY_RUN" ]]; then
            echo "::error::Only recover-consumer accepts a replacement run"; exit 1
          fi
          case "$RELEASE_OPERATION" in
            recover-consumer)
              [[ "$RELEASE_SOURCE_PR" =~ ^[1-9][0-9]*$ && "$RELEASE_RUN" =~ ^[1-9][0-9]*$ && "$RELEASE_CONSUMER_RECOVERY_RUN" =~ ^[1-9][0-9]*$ && -z "$RELEASE_ORIGINAL_OPERATOR_RUN" ]] || { echo "::error::Consumer recovery requires exact source PR, original R and replacement run"; exit 1; }
              [[ "$RELEASE_SOURCE_CUT" =~ ^[0-9a-f]{40}$ && "$RELEASE_SOURCE_HEAD" =~ ^[0-9a-f]{40}$ && "$RELEASE_SOURCE_TAG" =~ ^v0\.[1-9][0-9]*\.0$ ]] || { echo "::error::Consumer recovery requires exact original C/H/tag"; exit 1; }
              export PUBLIC_CUT="$RELEASE_SOURCE_CUT" PUBLIC_HEAD="$RELEASE_SOURCE_HEAD" PUBLIC_TAG="$RELEASE_SOURCE_TAG" PUBLIC_SOURCE_PR="$RELEASE_SOURCE_PR" PUBLIC_RELEASE_RUN="$RELEASE_RUN" PUBLIC_CONSUMER_RECOVERY_RUN="$RELEASE_CONSUMER_RECOVERY_RUN"
              node tools/support/release/consumer_recovery/main.ts verify "$RUNNER_TEMP/verified-consumer-recovery"
              ;;
            patch)
              test -z "$RELEASE_SOURCE_PR" || { echo "::error::A stable patch cannot reuse a source PR input"; exit 1; }
              [[ "$RELEASE_SOURCE_CUT" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Patch requires exact reviewed policy and stable C identities"; exit 1; }
              rust-script tools/commands/release/pr.rs start-stable "$GITHUB_SHA" "$RELEASE_SOURCE_CUT"
              ;;
            start)
              test -z "$RELEASE_SOURCE_PR" || { echo "::error::A fresh cut cannot reuse a source PR input"; exit 1; }
              vp run release minor -y --pin
              ;;
            resume)
              [[ "$RELEASE_SOURCE_PR" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Resume requires the original positive source PR number"; exit 1; }
              vp run release --resume "$RELEASE_SOURCE_PR" --pin
              ;;
            retire-before-release)
              [[ "$RELEASE_SOURCE_PR" =~ ^[1-9][0-9]*$ && "$RELEASE_QUALIFICATION_RUN" =~ ^[1-9][0-9]*$ && "$RELEASE_ORIGINAL_OPERATOR_RUN" =~ ^[1-9][0-9]*$ && -z "$RELEASE_RUN" ]] || { echo "::error::Pre-release retirement requires exact source PR, qualification Q and original O, without any Release R"; exit 1; }
              [[ "$RELEASE_SOURCE_HEAD" =~ ^[0-9a-f]{40}$ && "$RELEASE_SOURCE_TAG" =~ ^v0\.[1-9][0-9]*\.0$ ]] || { echo "::error::Pre-release retirement requires exact H and original v0.minor.0 tag"; exit 1; }
              rust-script tools/commands/release/pr.rs retire-before-release "$RELEASE_SOURCE_PR" "$RELEASE_SOURCE_HEAD" "$RELEASE_SOURCE_TAG" "$RELEASE_QUALIFICATION_RUN" "$RELEASE_ORIGINAL_OPERATOR_RUN"
              ;;
            retire)
              [[ "$RELEASE_SOURCE_PR" =~ ^[1-9][0-9]*$ && "$RELEASE_RUN" =~ ^[1-9][0-9]*$ && "$RELEASE_ORIGINAL_OPERATOR_RUN" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Retire requires positive source PR, Release run and original operator run IDs"; exit 1; }
              [[ "$RELEASE_SOURCE_HEAD" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::Retire requires the exact 40-hex source head"; exit 1; }
              [[ "$RELEASE_SOURCE_TAG" =~ ^v0\.[1-9][0-9]*\.0$ ]] || { echo "::error::Retire requires the original v0.minor.0 tag"; exit 1; }
              rust-script tools/commands/release/pr.rs retire "$RELEASE_SOURCE_PR" "$RELEASE_SOURCE_HEAD" "$RELEASE_SOURCE_TAG" "$RELEASE_RUN" "$RELEASE_ORIGINAL_OPERATOR_RUN"
              ;;
            *) echo "::error::Unknown release operation"; exit 1 ;;
          esac
      - name: Preserve authenticated consumer recovery verification
        if: ${{ always() && inputs.operation == 'recover-consumer' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-consumer-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-consumer-recovery
          if-no-files-found: warn
          retention-days: 30
