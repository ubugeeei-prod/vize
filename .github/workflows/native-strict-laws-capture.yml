name: Native strict law capture
on:
  pull_request:
    types: [opened]
permissions: { contents: read }
jobs:
  capture:
    if: ${{ github.repository == 'ubugeeei-prod/vize' && github.head_ref == 'fix/native-strict-source-contracts' }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "12"
      VIZE_TEST_REQUIRE_TSGO: "1"
      VIZE_NATIVE_STRICT_CAPTURE_DIR: ${{ runner.temp }}/native-strict-laws
      VIZE_NATIVE_SYNTAX_CAPTURE_DIR: ${{ runner.temp }}/native-strict-laws/syntax
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { ref: "${{ env.SOURCE_SHA }}", persist-credentials: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: nextest-ci
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/cache-vp-bootstrap
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with: { node-version-file: "package.json", cache: true, run-install: false }
      - name: Record exact source, compiler and capture environment
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          mkdir -p "$VIZE_NATIVE_STRICT_CAPTURE_DIR"
          git diff --exit-code
          git rev-parse HEAD > "$VIZE_NATIVE_STRICT_CAPTURE_DIR/source-sha.txt"
          git ls-tree -r HEAD > "$VIZE_NATIVE_STRICT_CAPTURE_DIR/source-tree.txt"
          rustc -vV > "$VIZE_NATIVE_STRICT_CAPTURE_DIR/rustc.txt"
          cargo -V > "$VIZE_NATIVE_STRICT_CAPTURE_DIR/cargo.txt"
          vp node --version > "$VIZE_NATIVE_STRICT_CAPTURE_DIR/node.txt"
          vp node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const names = ['SOURCE_SHA', 'GITHUB_WORKFLOW_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_EVENT_NAME', 'RUNNER_OS', 'RUNNER_ARCH', 'RUSTFLAGS', 'CARGO_TARGET_DIR', 'VIZE_TEST_REQUIRE_TSGO', 'CORSA_PATH'];
          fs.writeFileSync(`${process.env.VIZE_NATIVE_STRICT_CAPTURE_DIR}/environment.json`, JSON.stringify(Object.fromEntries(names.map(name => [name, process.env[name] ?? null])), null, 2));
          NODE
      - name: Install locked actual native and Vue dependencies
        run: node tools/support/github/vp-install.ts --filter vize-workspace --filter './npm/native...' --filter './npm/builder/vite...'
      - name: Capture workspace CLI controls
        run: |
          set -euo pipefail
          unset VIZE_TEST_DISABLE_TSGO
          cargo test --locked --profile ci -p vize --test check_workspace_server_deps_cli -- --nocapture --test-threads=1 2>&1 | tee "$VIZE_NATIVE_STRICT_CAPTURE_DIR/workspace-tests.log"
      - name: Capture complete semantic handoff child streams
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          unset VIZE_TEST_DISABLE_TSGO
          cargo test --locked --profile ci -p vize_canon --test native_syntax_semantics handoff_notice::required_semantic_completion_does_not_report_runtime_degradation -- --exact --nocapture 2>&1 | tee "$VIZE_NATIVE_STRICT_CAPTURE_DIR/handoff-tests.log"
      - name: Capture actual configured LSP diagnostic
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize_maestro --lib lsp_custom_modifiers_reach_the_configured_rule -- --nocapture 2>&1 | tee "$VIZE_NATIVE_STRICT_CAPTURE_DIR/lsp-tests.log"
      - name: Bind retained native receiver to its complete binary identity
        if: ${{ always() }}
        run: |
          vp node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const root = process.env.VIZE_NATIVE_STRICT_CAPTURE_DIR;
          const file = `${root}/syntax/semantic-handoff-child.json`;
          if (fs.existsSync(file)) {
            const {native} = JSON.parse(fs.readFileSync(file));
            const bytes = fs.readFileSync(native);
            fs.writeFileSync(`${root}/native-binary.json`, JSON.stringify({path:native, bytes:bytes.length, sha256:crypto.createHash('sha256').update(bytes).digest('hex')}, null, 2));
          }
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: native-strict-laws-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-strict-laws
          if-no-files-found: error
          retention-days: 7
