name: JS install dependency closure
on:
  pull_request:
    paths:
      - ".github/workflows/js-install-closure.yml"
      - "tools/support/compat/github/install-js-checks.ts"
      - "tools/support/compat/github/js-install-closure.mjs"
      - "tests/tooling/js-install-dependency-closure.test.mjs"
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: js-install-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  install:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: { role: [before, after] }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ matrix.role == 'before' && 'fc745ea5a2c9efcf6b1549d6312c61d4f2770697' || github.sha }}
          path: source
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: package.json, cache: false, run-install: false }
      - name: Reproduce the real filtered installer on a fresh source tree
        env: { SOURCE_ROLE: "${{ matrix.role }}" }
        run: node tools/support/compat/github/js-install-closure.mjs "$SOURCE_ROLE" source "artifacts/$SOURCE_ROLE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: js-install-closure-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/${{ matrix.role }}/
          if-no-files-found: error
          retention-days: 14
  compare:
    needs: install
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: package.json, cache: false, run-install: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          {
            name: "js-install-closure-before-${{ github.run_id }}-${{ github.run_attempt }}",
            path: artifacts/before,
          }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          {
            name: "js-install-closure-after-${{ github.run_id }}-${{ github.run_attempt }}",
            path: artifacts/after,
          }
      - run: node tools/support/compat/github/js-install-closure.mjs compare artifacts
      - name: Exercise private transitive, optional, UI fixture and Unicode path controls with the real package manager
        run: node --test tests/tooling/js-install-dependency-closure.test.mjs
