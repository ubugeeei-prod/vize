name: Tooling shard diagnostic
on:
  push:
    branches: [ci/tooling-merge-shards-6830-diagnostic]

permissions:
  contents: read

jobs:
  tooling:
    name: Complete tooling shard (${{ matrix.shard }}/4)
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
      CARGO_BUILD_JOBS: "12"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - uses: ./.github/actions/setup-moonbit
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          cache-key-prefix: diagnostic-${{ github.sha }}-
          key: test-scripts
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}-shard-${{ matrix.shard }}
      - uses: ./.github/actions/setup-rust-script
      - name: Install fixture and JS dependencies
        run: git submodule update --init --force --depth 1 -- tests/_fixtures/_git/ant-design-vue tests/_fixtures/_git/create-vue tests/_fixtures/_git/vue-select && vp install --frozen-lockfile --prefer-offline
      - name: Build and install vize CLI
        run: cargo build --profile ci -p vize && vp exec node tests/differential/build-receipt.mjs && cat target/ci/vize.differential-build.json && sudo install -m 0755 target/ci/vize /usr/local/bin/vize
      - name: Prepare the pinned plugin isolation runtime
        run: vp exec node tools/support/compat/davinci/plugin-sandbox-image.mjs
      - name: Test complete tooling shard
        env:
          VIZE_LSP_BIN: ${{ github.workspace }}/target/ci/vize
          VIZE_LSP_REQUIRE_SOURCE_BUILD: "1"
          VIZE_TOOLING_MERGE_SHARD: ${{ matrix.shard }}
          VIZE_TOOLING_TIMING_FILE: target/tooling-file-times-${{ matrix.shard }}.jsonl
        run: vp run --workspace-root test:scripts:merge-shard
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: tooling-file-times-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: target/tooling-file-times-${{ matrix.shard }}.jsonl
          if-no-files-found: warn
      - uses: ./.github/actions/upload-formatter-api-corpus-evidence
        if: ${{ always() && matrix.shard == 1 }}

  report:
    name: Require complete tooling shards
    if: ${{ always() }}
    needs: tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Require every tooling shard
        env: { NEEDS_JSON: "${{ toJSON(needs) }}" }
        run: node tools/support/compat/github/require-needs-success.mjs
