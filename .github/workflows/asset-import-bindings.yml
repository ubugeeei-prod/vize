name: SFC asset import bindings

on:
  pull_request:
    paths:
      - "crates/vize_atelier_sfc/src/bundler/assets.rs"
      - "crates/vize_atelier_sfc/src/bundler/assets/**"
      - "crates/vize_atelier_sfc/src/bundler/tests/asset_names.rs"
      - "crates/vize_croquis/src/drawer/helpers/v_for/**"
      - "crates/vize_atelier_sfc/examples/asset_import_names_profile.rs"
      - "tests/tooling/asset-import-binding-source.mjs"
      - ".github/workflows/asset-import-bindings.yml"
      - ".github/scripts/workflows/asset-import-bindings/**"

permissions: { contents: read }
concurrency:
  group: asset-import-bindings-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-native:
    # The immutable before image qualifies this repair; Check retains routine regression tests.
    if: ${{ github.event.pull_request.number == 10711 }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: "24"
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: ""
      RUSTC_WORKSPACE_WRAPPER: ""
      BASE_SHA: "e466c0366d303baf725d67942a8a6a0f872c0dc0"
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/asset-import-bindings/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          {
            version: "1.1.0",
            node-version-file: package.json,
            cache: true,
            cache-save: false,
            run-install: false,
          }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.100.0" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: asset-bindings-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - run: vp install --frozen-lockfile --prefer-offline
      - name: Build immutable before and head producers in separate source targets
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/build-immutable-before-and-head-producers-in-separate-source-targets.sh"
      - name: Verify full unchanged packets, actual collision repair and source custody
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/verify-full-unchanged-packets-actual-collision-repair-and-source-custody.sh"
      - name: Preserve complete source evidence, images, packets and unnormalized logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: asset-import-bindings-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.HEAD_SHA }}
          path: |
            ${{ runner.temp }}/asset-import-bindings/**
            !${{ runner.temp }}/asset-import-bindings/node_modules/**
          if-no-files-found: error
          retention-days: 14
