name: Level instruction counts

# Temporary measurement branch: optimized LLVM IR identity of base vs head under
# the release profile (tools/commands/levels/ir-identity.ts). Not for main.
on:
  workflow_dispatch:
    inputs:
      base_sha: { description: Base commit, required: true, type: string }
      head_sha: { description: Head commit, required: true, type: string }
      args:
        description: ir-identity arguments (--crate, --step, --rename-path, --rename)
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.100.0"
  CARGO_INCREMENTAL: "0"

jobs:
  ir:
    name: Release LLVM IR identity
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { path: driver, fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: driver/package.json }
      - run: rustup toolchain install 1.100.0 --profile minimal
      - uses: ./driver/.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - name: Compare
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          ARGS: ${{ inputs.args }}
        run: |
          set -uo pipefail
          read -ra extra <<< "$ARGS"
          mkdir -p "$RUNNER_TEMP/out"
          cd driver
          node tools/commands/levels/ir-identity.ts --base "$BASE_SHA" --head "$HEAD_SHA" \
            "${extra[@]}" --diff 3 --save "$RUNNER_TEMP/out/ir" --work "$RUNNER_TEMP/work" --keep \
            > "$RUNNER_TEMP/out/summary.txt" 2> "$RUNNER_TEMP/out/build.log"
          status=$?
          {
            echo "base $BASE_SHA"
            echo "head $HEAD_SHA"
            echo "args $ARGS"
            echo "exit $status"
            cat "$RUNNER_TEMP/out/summary.txt"
          } | tee "$RUNNER_TEMP/out/report.txt"
          { echo '```'; head -c 60000 "$RUNNER_TEMP/out/report.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          gzip -9 "$RUNNER_TEMP"/out/ir/*.ll || true
          tail -50 "$RUNNER_TEMP/out/build.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ir-identity
          path: |
            ${{ runner.temp }}/out/report.txt
            ${{ runner.temp }}/out/ir
          retention-days: 7
