name: Level instruction counts

on:
  # Check calls the measurement once per queue candidate and scheduled run.
  # Avoid a second standalone PR run of the same instruction campaign.
  workflow_dispatch:
    inputs:
      sfc_parse_only:
        description: Measure only the template-only SFC regression
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: instruction-counts-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUSTUP_TOOLCHAIN: "1.99.1"

jobs:
  instruction-counts:
    if: ${{ !inputs.sfc_parse_only }}
    name: Per-stage instruction ceilings
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      # Reusable workflows retain the caller's workflow name.
      MEASURE: ${{ github.event_name == 'merge_group' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.workflow == 'Level instruction counts' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          run-install: false
      - name: Install pinned measurement Rust
        if: env.MEASURE == 'true'
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install Callgrind and matching client request headers
        if: env.MEASURE == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends valgrind
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        if: env.MEASURE == 'true'
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        if: env.MEASURE == 'true'
        with:
          key: instruction-counts-v1
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Test instruction parser and gates
        run: node --test tests/tooling/level-instruction-counts.test.mjs tests/tooling/formatter-instruction-counts.test.mjs
      - name: Test default harness and client request windows
        if: env.MEASURE == 'true'
        run: |
          cargo test --locked -p davinci_harness --lib
          cargo test --locked -p davinci_harness --lib --features instruction-counts
      - name: Measure original formatter routines three times without Criterion sampling
        if: env.MEASURE == 'true'
        run: node tools/benchmarks/scripts/instruction-counts.mjs --formatter --collect --out "${RUNNER_TEMP}/formatter-instruction-counts"
      - name: Measure each stage three times without Criterion sampling
        if: env.MEASURE == 'true'
        run: node tools/benchmarks/scripts/instruction-counts.mjs --collect --out "${RUNNER_TEMP}/instruction-counts"
      - name: Verify pinned registry and immutable base ratchet
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" ]]; then
            BASE_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          fi
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          BASE_ARGS=()
          if git cat-file -e "$BASE_SHA:docs/davinci/plan/instruction-budgets.toml" 2>/dev/null; then
            git show "$BASE_SHA:docs/davinci/plan/instruction-budgets.toml" > "${RUNNER_TEMP}/base-instruction-budgets.toml"
            BASE_ARGS=(--base-budgets "${RUNNER_TEMP}/base-instruction-budgets.toml")
          else
            # First introduction only: require the exact independently reviewed
            # 100-row artifact. Later bases contain a registry and must ratchet.
            echo '17c3947044c033d03b0a86d13b2c3fa6dc2d1e90cb2222033921f649e97a826f  docs/davinci/plan/instruction-budgets.toml' | sha256sum --check --strict
          fi
          node tools/benchmarks/scripts/instruction-counts.mjs --verify-budgets "${BASE_ARGS[@]}"
          FORMATTER_BASE_ARGS=()
          if git cat-file -e "$BASE_SHA:docs/davinci/plan/formatter-instruction-budgets.toml" 2>/dev/null; then
            git show "$BASE_SHA:docs/davinci/plan/formatter-instruction-budgets.toml" > "${RUNNER_TEMP}/base-formatter-instruction-budgets.toml"
            FORMATTER_BASE_ARGS=(--base-budgets "${RUNNER_TEMP}/base-formatter-instruction-budgets.toml")
          else
            # First introduction: exact reviewed three-run formatter calibration.
            echo 'e49d7c38a43fcdfa3bf7114c50ef91734f355d943269d42bc1d18821d444de99  docs/davinci/plan/formatter-instruction-budgets.toml' | sha256sum --check --strict
          fi
          node tools/benchmarks/scripts/instruction-counts.mjs --formatter --verify-budgets "${FORMATTER_BASE_ARGS[@]}"
      - name: Enforce pinned ceilings
        if: env.MEASURE == 'true'
        run: |
          set -euo pipefail
          BASE_ARGS=()
          if [[ -f "${RUNNER_TEMP}/base-instruction-budgets.toml" ]]; then
            BASE_ARGS=(--base-budgets "${RUNNER_TEMP}/base-instruction-budgets.toml")
          fi
          node tools/benchmarks/scripts/instruction-counts.mjs --check \
            --measurement "${RUNNER_TEMP}/instruction-counts/measurement.json" "${BASE_ARGS[@]}"
      - name: Enforce original formatter ceilings
        if: env.MEASURE == 'true'
        run: |
          set -euo pipefail
          BASE_ARGS=()
          if [[ -f "${RUNNER_TEMP}/base-formatter-instruction-budgets.toml" ]]; then
            BASE_ARGS=(--base-budgets "${RUNNER_TEMP}/base-formatter-instruction-budgets.toml")
          fi
          node tools/benchmarks/scripts/instruction-counts.mjs --formatter --check \
            --measurement "${RUNNER_TEMP}/formatter-instruction-counts/measurement.json" "${BASE_ARGS[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && env.MEASURE == 'true' }}
        with:
          name: instruction-counts-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/instruction-counts
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && env.MEASURE == 'true' }}
        with:
          name: formatter-instruction-counts-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formatter-instruction-counts
          if-no-files-found: error
          retention-days: 30

  sfc-parse:
    name: Template-only SFC instruction parity
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - name: Install measurement tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends valgrind
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: sfc-instructions-v1
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Verify native descriptor compatibility
        run: |
          cargo test --locked -p vize_l1 --lib container::vue
          cargo test --locked -p vize_atelier_sfc --lib parse::tests
      - name: Measure both parsers three times and enforce parity
        run: |
          node tools/benchmarks/scripts/instruction-counts.mjs --sfc-parsing --collect --out "${RUNNER_TEMP}/sfc-instructions"
          node tools/benchmarks/scripts/sfc-parse-instructions.ts "${RUNNER_TEMP}/sfc-instructions/measurement.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sfc-instructions-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sfc-instructions
          if-no-files-found: warn
