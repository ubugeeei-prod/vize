name: Level instruction counts

# Temporary measurement branch: release-profile (fat LTO, one codegen unit)
# `vize` CLI size, base vs head. Not for main.
on:
  workflow_dispatch:
    inputs:
      base_sha: { description: Base commit, required: true, type: string }
      head_sha: { description: Head commit, required: true, type: string }

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.100.0"
  CARGO_INCREMENTAL: "0"

jobs:
  size:
    name: Release CLI size diff
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { path: driver, persist-credentials: false }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { path: base, ref: "${{ inputs.base_sha }}", persist-credentials: false }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { path: head, ref: "${{ inputs.head_sha }}", persist-credentials: false }
      - run: rustup toolchain install 1.100.0 --profile minimal
      - uses: ./driver/.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - name: Build and diff
        run: |
          set -euo pipefail
          mkdir -p out
          for role in base head; do
            ( cd $role && CARGO_TARGET_DIR=$RUNNER_TEMP/t-$role cargo build --locked --release -p vize 2>&1 | tail -1 )
            bin=$RUNNER_TEMP/t-$role/release/vize
            cp $bin out/$role.release
            strip --strip-all -o out/$role.stripped $bin
            size -A out/$role.release > out/$role.sections
          done
          {
            echo "base ${{ inputs.base_sha }}"
            echo "head ${{ inputs.head_sha }}"
            for role in base head; do
              echo "$role release bytes $(stat -c %s out/$role.release) sha256 $(sha256sum out/$role.release | cut -c1-64)"
              echo "$role stripped bytes $(stat -c %s out/$role.stripped) sha256 $(sha256sum out/$role.stripped | cut -c1-64)"
            done
            echo "=== sections base -> head"
            diff <(awk '{print $1, $2}' out/base.sections) <(awk '{print $1, $2}' out/head.sections) || true
          } | tee out/summary.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat out/summary.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: release-size, path: "out/summary.txt\nout/*.sections", retention-days: 7 }
