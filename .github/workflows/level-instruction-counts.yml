name: Level instruction counts

# Temporary measurement branch: per-function Callgrind diff of the instruction
# windows (stage or formatter suites) between two commits. Not for main.
on:
  workflow_dispatch:
    inputs:
      base_sha: { description: Base commit, required: true, type: string }
      head_sha: { description: Head commit, required: true, type: string }
      formatter: { description: Formatter suites instead of stage suites, required: false, default: "false", type: string }
      rows: { description: Space-separated bench ids to diff, required: true, type: string }
      symbols: { description: Space-separated demangled symbol substrings to disassemble, required: false, default: "", type: string }
      binary: { description: Bench binary name prefix to disassemble, required: false, default: "formatter_instructions", type: string }

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.100.0"
  CARGO_INCREMENTAL: "0"

jobs:
  cg:
    name: Callgrind window diff
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { path: base, ref: "${{ inputs.base_sha }}", persist-credentials: false }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { path: head, ref: "${{ inputs.head_sha }}", persist-credentials: false }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: base/package.json, run-install: false }
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends valgrind
      - uses: ./base/.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - name: Collect
        env: { FORMATTER: "${{ inputs.formatter }}" }
        run: |
          set -euo pipefail
          flag=""; [ "$FORMATTER" = true ] && flag=--formatter
          for role in base head; do
            (cd $role && node tools/benchmarks/scripts/instruction-counts.mjs $flag --collect --out "$RUNNER_TEMP/$role/ic" | tail -2)
          done
      - name: Diff
        env: { ROWS: "${{ inputs.rows }}" }
        run: |
          set -euo pipefail
          mkdir -p out
          for role in base head; do
            for f in $(grep -l -E "^(desc|cmd|fn)" -r "$RUNNER_TEMP/$role/ic/run-1" --include='*.callgrind*' | grep -v -E '\.(stderr|stdout)$'); do
              for row in $ROWS; do
                if grep -q -- "$row" "$f" 2>/dev/null; then
                  callgrind_annotate --inclusive=no --threshold=100 "$f" > "out/$role-$row.txt" || true
                fi
              done
            done
          done
          ls out
          python3 - <<'PY'
          import os, re, collections
          def load(p):
              d = collections.Counter()
              for line in open(p, errors='replace'):
                  m = re.match(r'\s*([\d,]+)\s+\([^)]*\)\s+(.*)$', line)
                  if m:
                      d[re.sub(r'\s*\[[^\]]*\]\s*$', '', m.group(2).strip())] += int(m.group(1).replace(',', ''))
              return d
          for row in os.environ['ROWS'].split():
              try:
                  a, b = load(f'out/base-{row}.txt'), load(f'out/head-{row}.txt')
              except FileNotFoundError as e:
                  print('missing', e); continue
              print(f'\n=== {row}: {sum(a.values()):,} -> {sum(b.values()):,}')
              for k in sorted(set(a) | set(b), key=lambda k: -abs(b[k] - a[k]))[:40]:
                  if a[k] != b[k]:
                      print(f'{b[k]-a[k]:+10,} {a[k]:12,} {k[:200]}')
          PY
      - name: Disassemble
        if: inputs.symbols != ''
        env: { SYMBOLS: "${{ inputs.symbols }}", BINARY: "${{ inputs.binary }}" }
        run: |
          set -euo pipefail
          for role in base head; do
            bin=$(find "$role/target/ci-opt/build" -type f -name "$BINARY-*" -perm -u+x | head -1)
            echo "$role $bin"
            objdump -d --no-show-raw-insn -C "$bin" > "$RUNNER_TEMP/$role.asm"
            for sym in $SYMBOLS; do
              awk -v s="$sym" '/^[0-9a-f]+ <.*>:$/ { keep = index($0, s) > 0 } keep' "$RUNNER_TEMP/$role.asm" \
                | sed -E 's/^ *[0-9a-f]+:\t//; s/0x[0-9a-f]+/ADDR/g; s/[0-9a-f]{6,}/ADDR/g' > "out/$role-$sym.asm"
              wc -l "out/$role-$sym.asm"
            done
          done
          for sym in $SYMBOLS; do echo "=== $sym"; diff "out/base-$sym.asm" "out/head-$sym.asm" | head -80 || true; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: cg-diff, path: out, retention-days: 3 }
