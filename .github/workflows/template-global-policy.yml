name: Public template compiler global policy
on:
  workflow_dispatch:
    inputs:
      version: { description: Exact public version, required: true, type: string }
      source_sha: { description: Exact prepared tag commit, required: true, type: string }
      authority_blob:
        { description: Genuine publisher authority Git blob, required: true, type: string }
permissions: { contents: read }
concurrency:
  group: template-global-public-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  public-runtime:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      VIZE_TEMPLATE_GLOBAL_PUBLIC_VERSION: ${{ inputs.version }}
      VIZE_TEMPLATE_GLOBAL_PUBLIC_SOURCE: ${{ inputs.source_sha }}
      VIZE_TEMPLATE_GLOBAL_PUBLIC_AUTHORITY: ${{ inputs.authority_blob }}
      VIZE_TEMPLATE_GLOBAL_OBSERVER_SHA: ${{ github.sha }}
      VIZE_TEMPLATE_GLOBAL_RUNTIME_REQUIRED: "1"
      VIZE_TEMPLATE_GLOBAL_RUNTIME_PROOF: ${{ github.workspace }}/target/vize-tests/template-global-public
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact public inputs even when dispatch supplied empty strings
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VIZE_TEMPLATE_GLOBAL_OBSERVER_SHA"
          node --input-type=module -e '
          import assert from "node:assert/strict";
          assert.match(process.env.VIZE_TEMPLATE_GLOBAL_PUBLIC_VERSION ?? "", /^[0-9]+\.[0-9]+\.[0-9]+$/);
          for (const key of ["VIZE_TEMPLATE_GLOBAL_PUBLIC_SOURCE","VIZE_TEMPLATE_GLOBAL_PUBLIC_AUTHORITY"])
            assert.match(process.env[key] ?? "", /^[a-f0-9]{40}$/);
          '
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: latest
          node-version-file: package.json
          cache: true
          cache-save: false
          run-install: false
      - name: Install the unchanged pinned runtime and compiler observers
        run: vp install --frozen-lockfile --prefer-offline
      - name: Create independent fresh candidate and immutable before consumers
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/template-global-public-candidate"
          before="$RUNNER_TEMP/template-global-public-before"
          test ! -e "$candidate"
          test ! -e "$before"
          npm install --prefix "$candidate" --registry=https://registry.npmjs.org --ignore-scripts --no-audit --no-fund --save-exact \
            "vize@$VIZE_TEMPLATE_GLOBAL_PUBLIC_VERSION" "@vizejs/native@$VIZE_TEMPLATE_GLOBAL_PUBLIC_VERSION" \
            "@vizejs/native-linux-x64-gnu@$VIZE_TEMPLATE_GLOBAL_PUBLIC_VERSION"
          npm install --prefix "$before" --registry=https://registry.npmjs.org --ignore-scripts --no-audit --no-fund --save-exact \
            vue@3.5.41 @vue/compiler-sfc@3.5.41 vize@0.600.0 @vizejs/native@0.600.0 @vizejs/native-linux-x64-gnu@0.600.0
          echo "VIZE_TEMPLATE_GLOBAL_PUBLIC_PACKAGE=$candidate/package.json" >> "$GITHUB_ENV"
          echo "VIZE_TEMPLATE_GLOBAL_ORACLE_PACKAGE=$before/package.json" >> "$GITHUB_ENV"
      - name: Require real public images and all54 complete component/runtime rows
        shell: bash
        run: |
          set -euo pipefail
          unset NODE_PATH NAPI_RS_NATIVE_LIBRARY_PATH VIZE_NATIVE_PATH
          node --test tests/tooling/public-template-global-policy.test.ts
      - name: Retain complete packets and compact whole-record index
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-global-public-${{ inputs.version }}
          path: target/vize-tests/template-global-public
          if-no-files-found: error
