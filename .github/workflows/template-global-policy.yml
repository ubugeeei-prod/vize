name: Template compiler global policy
on:
  pull_request:
    paths:
      - .github/workflows/template-global-policy.yml
      - davinci/vize_l0/src/template_globals.rs
      - davinci/vize_l1_to_l2/src/emit/prefix/**
      - crates/vize_atelier_core/src/steps/expression/**
      - crates/vize_atelier_core/src/lane/context.rs
      - crates/vize_atelier_core/src/codegen/helpers/constant_expression.rs
      - crates/vize_atelier_core/src/codegen/slots/params.rs
      - crates/vize_atelier_sfc/src/script/import_usage_check/**
      - crates/vize_atelier_sfc/tests/template_global_policy.rs
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: template-global-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  whole-modules:
    name: Complete compiler modules (${{ matrix.role }})
    strategy:
      fail-fast: false
      matrix: { role: [before, candidate] }
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "12"
      CARGO_TERM_COLOR: always
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VIZE_TEMPLATE_GLOBAL_CAPTURE_DIR: ${{ runner.temp }}/template-global-${{ matrix.role }}
      VIZE_TEMPLATE_GLOBAL_BEFORE: ${{ matrix.role == 'before' && '1' || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ matrix.role == 'before' && 'f5973f93e2c2f33092300c59145074a2dd753be7' || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read the observer without changing the immutable before producer
        if: matrix.role == 'before'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: qualification
          persist-credentials: false
          sparse-checkout: crates/vize_atelier_sfc/tests/template_global_policy.rs
          sparse-checkout-cone-mode: false
      - name: Install only the whole-module observer in the before tree
        if: matrix.role == 'before'
        run: cp qualification/crates/vize_atelier_sfc/tests/template_global_policy.rs crates/vize_atelier_sfc/tests/template_global_policy.rs
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with: { key: nextest-ci, cache-key-suffix: Linux-X64-1.99.1 }
      - name: Require the whole-module policy and preserve actual execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VIZE_TEMPLATE_GLOBAL_CAPTURE_DIR"
          git rev-parse HEAD >"$VIZE_TEMPLATE_GLOBAL_CAPTURE_DIR/producer.sha"
          if [[ -z "$VIZE_TEMPLATE_GLOBAL_BEFORE" ]]; then unset VIZE_TEMPLATE_GLOBAL_BEFORE; fi
          set +e
          cargo test --locked --profile ci -p vize_atelier_sfc --test template_global_policy every_sfc_backend_keeps_host_globals_on_the_component_proxy -- --exact --nocapture >"$VIZE_TEMPLATE_GLOBAL_CAPTURE_DIR/test.stdout" 2>"$VIZE_TEMPLATE_GLOBAL_CAPTURE_DIR/test.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" >"$VIZE_TEMPLATE_GLOBAL_CAPTURE_DIR/test.status"
          cat "$VIZE_TEMPLATE_GLOBAL_CAPTURE_DIR/test.stdout"
          cat "$VIZE_TEMPLATE_GLOBAL_CAPTURE_DIR/test.stderr" >&2
          test "$status" = 0
          python3 - "$VIZE_TEMPLATE_GLOBAL_CAPTURE_DIR" <<'PYTHON'
          import hashlib, json, pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          stdout = (root / 'test.stdout').read_text()
          assert 'test every_sfc_backend_keeps_host_globals_on_the_component_proxy ... ok' in stdout
          assert re.search(r'test result: ok\. 1 passed; 0 failed; 0 ignored;', stdout)
          expected = {f'{case}-{target}-{str(inline).lower()}.json'
              for case in ['globals', 'local', 'loop', 'import']
              for target in ['dom', 'vapor', 'ssr'] for inline in [False, True]}
          actual = {file.name for file in root.glob('*.json')}
          assert actual == expected, (actual, expected)
          packets = []
          for name in sorted(expected):
              file = root / name
              whole = json.loads(file.read_text())
              assert whole['wholeSource'] and whole['wholeResult']['code']
              packets.append({'name':name,'bytes':file.stat().st_size,
                  'sha256':hashlib.sha256(file.read_bytes()).hexdigest()})
          (root / 'receipt.json').write_text(json.dumps({'producer':(root / 'producer.sha').read_text().strip(),
              'executed':1,'wholePackets':packets}, indent=2) + '\n')
          PYTHON
      - name: Preserve complete authored inputs, modules, maps and free-reference results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-global-${{ matrix.role }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/template-global-${{ matrix.role }}
          if-no-files-found: error
