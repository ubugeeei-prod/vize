name: Template compiler global policy
on:
  pull_request:
    paths:
      - .github/workflows/template-global-policy.yml
      - davinci/vize_l0/src/template_globals.rs
      - davinci/vize_l1_to_l2/src/emit/prefix/**
      - crates/vize_atelier_core/src/steps/expression/**
      - crates/vize_atelier_core/src/lane/context.rs
      - crates/vize_atelier_core/src/codegen/helpers/constant_expression.rs
      - crates/vize_atelier_core/src/codegen/slots/params.rs
      - crates/vize_atelier_sfc/src/script/import_usage_check/**
      - crates/vize_atelier_sfc/tests/template_global_policy.rs
      - tests/tooling/native-template-global-policy.test.ts
      - tests/tooling/support/template-global-*.ts
      - tests/_fixtures/differential/compiler/template-global-policy/**
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: template-global-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  whole-modules:
    name: Complete compiler modules (${{ matrix.role }})
    strategy:
      fail-fast: false
      matrix: { role: [before, candidate] }
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "12"
      CARGO_TERM_COLOR: always
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VIZE_TEMPLATE_GLOBAL_CAPTURE_DIR: ${{ github.workspace }}/target/vize-tests/template-global-${{ matrix.role }}
      VIZE_TEMPLATE_GLOBAL_BEFORE: ${{ matrix.role == 'before' && '1' || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ matrix.role == 'before' && 'f5973f93e2c2f33092300c59145074a2dd753be7' || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read the observer without changing the immutable before producer
        if: matrix.role == 'before'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: qualification
          persist-credentials: false
          sparse-checkout: crates/vize_atelier_sfc/tests/template_global_policy.rs
          sparse-checkout-cone-mode: false
      - name: Install only the whole-module observer in the before tree
        if: matrix.role == 'before'
        run: cp qualification/crates/vize_atelier_sfc/tests/template_global_policy.rs crates/vize_atelier_sfc/tests/template_global_policy.rs
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with: { key: nextest-ci, cache-key-suffix: Linux-X64-1.99.1 }
      - name: Require the whole-module policy and preserve actual execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VIZE_TEMPLATE_GLOBAL_CAPTURE_DIR"
          git rev-parse HEAD >"$VIZE_TEMPLATE_GLOBAL_CAPTURE_DIR/producer.sha"
          if [[ -z "$VIZE_TEMPLATE_GLOBAL_BEFORE" ]]; then unset VIZE_TEMPLATE_GLOBAL_BEFORE; fi
          set +e
          cargo test --locked --profile ci -p vize_atelier_sfc --test template_global_policy every_sfc_backend_keeps_host_globals_on_the_component_proxy -- --exact --nocapture >"$VIZE_TEMPLATE_GLOBAL_CAPTURE_DIR/test.stdout" 2>"$VIZE_TEMPLATE_GLOBAL_CAPTURE_DIR/test.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" >"$VIZE_TEMPLATE_GLOBAL_CAPTURE_DIR/test.status"
          cat "$VIZE_TEMPLATE_GLOBAL_CAPTURE_DIR/test.stdout"
          cat "$VIZE_TEMPLATE_GLOBAL_CAPTURE_DIR/test.stderr" >&2
          test "$status" = 0
          python3 - "$VIZE_TEMPLATE_GLOBAL_CAPTURE_DIR" <<'PYTHON'
          import hashlib, json, pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          stdout = (root / 'test.stdout').read_text()
          assert 'test every_sfc_backend_keeps_host_globals_on_the_component_proxy ... ok' in stdout
          assert re.search(r'test result: ok\. 1 passed; 0 failed; 0 ignored;', stdout)
          expected = {f'{case}-{target}-{str(inline).lower()}.json'
              for case in ['globals', 'local', 'loop', 'import']
              for target in ['dom', 'vapor', 'ssr'] for inline in [False, True]}
          actual = {file.name for file in root.glob('*.json')}
          assert actual == expected | {'legacy-fixture.json'}, (actual, expected)
          packets = []
          for name in sorted(expected):
              file = root / name
              whole = json.loads(file.read_text())
              assert whole['wholeSource'] and whole['wholeResult']['code']
              packets.append({'name':name,'bytes':file.stat().st_size,
                  'sha256':hashlib.sha256(file.read_bytes()).hexdigest()})
          legacy_file = root / 'legacy-fixture.json'
          legacy = json.loads(legacy_file.read_text())
          assert legacy['wholeSource'] and legacy['wholeResult']['code']
          assert legacy['options'] == {'filename':'Layout.vue','scriptIsTs':False,'templateIsTs':False,
              'ssr':True,'scriptOutput':'InlineTemplate'}
          (root / 'receipt.json').write_text(json.dumps({'producer':(root / 'producer.sha').read_text().strip(),
              'executed':1,'wholePackets':packets,'auxiliaryLegacyFixture':{'name':legacy_file.name,
              'bytes':legacy_file.stat().st_size,'sha256':hashlib.sha256(legacy_file.read_bytes()).hexdigest()}}, indent=2) + '\n')
          PYTHON
      - name: Preserve complete authored inputs, modules, maps and free-reference results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-global-${{ matrix.role }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ github.workspace }}/target/vize-tests/template-global-${{ matrix.role }}
          if-no-files-found: error
  runtime:
    name: Actual stock and native component runtimes
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "12"
      VIZE_TEMPLATE_GLOBAL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VIZE_TEMPLATE_GLOBAL_RUNTIME_REQUIRED: "1"
      VIZE_TEMPLATE_GLOBAL_RUNTIME_PROOF: ${{ github.workspace }}/target/vize-tests/template-global-runtime
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.VIZE_TEMPLATE_GLOBAL_SOURCE_SHA }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: latest
          node-version-file: package.json
          cache: true
          cache-save: false
          run-install: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with: { key: test-js-packages, cache-key-suffix: Linux-X64-1.99.1 }
      - name: Install the pinned workspace runtime providers
        run: vp install --frozen-lockfile --prefer-offline
      - name: Install the independent public Vue and Vize baseline
        run: |
          npm install --prefix "$RUNNER_TEMP/template-global-oracle" --registry=https://registry.npmjs.org --no-audit --no-fund --save-exact vue@3.5.41 @vue/compiler-sfc@3.5.41 vize@0.600.0 @vizejs/native@0.600.0 @vizejs/native-linux-x64-gnu@0.600.0
          echo "VIZE_TEMPLATE_GLOBAL_ORACLE_PACKAGE=$RUNNER_TEMP/template-global-oracle/package.json" >> "$GITHUB_ENV"
      - name: Build the exact candidate native compiler
        run: |
          test "$(git rev-parse HEAD)" = "$VIZE_TEMPLATE_GLOBAL_SOURCE_SHA"
          token="$(openssl rand -hex 16)"
          VIZE_NATIVE_BUILD_TOKEN="$token" cargo build --locked --profile ci -p vize_vitrine --features napi
          cp target/ci/libvize_vitrine.so npm/native/vize-vitrine.linux-x64-gnu.node
          echo "VIZE_TEMPLATE_GLOBAL_EXPECTED_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Execute complete modules under the actual Vue runtimes
        run: |
          unset NAPI_RS_NATIVE_LIBRARY_PATH
          node --test tests/tooling/native-template-global-policy.test.ts
      - name: Preserve complete public and candidate modules, graphs and actual runtime observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-global-runtime-${{ env.VIZE_TEMPLATE_GLOBAL_SOURCE_SHA }}
          path: ${{ env.VIZE_TEMPLATE_GLOBAL_RUNTIME_PROOF }}
          if-no-files-found: error
