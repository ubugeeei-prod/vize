name: Script recovery cost
on:
  pull_request:
    paths:
      - .github/workflows/script-recovery-cost.yml
      - crates/vize_croquis/src/script_parser/recovery.rs
      - crates/vize_croquis/src/script_parser/recovery/**
      - davinci/vize_l0/examples/source_recovery_benchmark.rs
      - davinci/vize_l0/tests/source_probes/mod.rs
  workflow_dispatch:
    inputs:
      base_sha:
        description: Immutable pre-optimization baseline commit
        type: string
        required: true
permissions: { contents: read }
concurrency:
  group: script-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 40
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: script-recovery-v1
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Preserve exact source identities and the shared benchmark carrier
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$BASE_SHA" != "$(git rev-parse HEAD)"
          mkdir -p evidence
          git fetch --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/recovery-base" "$BASE_SHA"
          git rev-parse HEAD > evidence/head.sha
          git -C "$RUNNER_TEMP/recovery-base" rev-parse HEAD > evidence/base.sha
          cp davinci/vize_l0/examples/source_recovery_benchmark.rs "$RUNNER_TEMP/recovery-base/davinci/vize_l0/examples/"
          sha256sum davinci/vize_l0/examples/source_recovery_benchmark.rs > evidence/carrier.sha256
          rustc +1.99.1 -vV > evidence/rustc.txt
          lscpu > evidence/cpu.txt
      - name: Compare complete parser packets and exact source counter controls
        run: |
          set -euo pipefail
          cargo +1.99.1 test --locked --profile ci -p vize_croquis script_parser::recovery 2>&1 | tee evidence/recovery-packets.log
          cargo +1.99.1 test --locked --profile ci -p vize_l0 --test source_operations_profile --features micro-profiling 2>&1 | tee evidence/callsite-controls.log
      - name: Build independent baseline and candidate targets with equal flags
        run: |
          set -euo pipefail
          for role in base head; do
            source="$GITHUB_WORKSPACE"
            if [[ "$role" == base ]]; then source="$RUNNER_TEMP/recovery-base"; fi
            cargo +1.99.1 build --locked --profile ci-opt --manifest-path "$source/Cargo.toml" --target-dir "$GITHUB_WORKSPACE/target/recovery-$role" -p vize_l0 --example source_recovery_benchmark --message-format json > "evidence/build-$role.jsonl"
            cp "target/recovery-$role/ci-opt/examples/source_recovery_benchmark" "evidence/normal-$role"
            sha256sum "$source/Cargo.lock" "$source/crates/vize_croquis/src/script_parser/recovery.rs" > "evidence/inputs-$role.sha256"
          done
          sha256sum evidence/normal-base evidence/normal-head > evidence/binaries.sha256
          test "$(sha256sum evidence/normal-base | cut -d' ' -f1)" != "$(sha256sum evidence/normal-head | cut -d' ' -f1)"
      - name: Measure normal processes and separate instrumented allocation windows
        run: |
          set -euo pipefail
          cpus=$(python3 -c 'import os;print(",".join(map(str,sorted(os.sched_getaffinity(0))[:8])))')
          printf '%s\n' "$cpus" > evidence/affinity.txt
          for rows in 32 256 2048; do
            for round in 1 2 3; do
              order='base head'
              if [[ "$round" == 2 ]]; then order='head base'; fi
              for role in $order; do
                /usr/bin/time -v -o "evidence/time-$role-$rows-$round.txt" taskset -c "$cpus" "evidence/normal-$role" 100 "$rows" > "evidence/normal-$role-$rows-$round.json"
              done
            done
          done
          for role in base head; do
            source="$GITHUB_WORKSPACE"
            if [[ "$role" == base ]]; then source="$RUNNER_TEMP/recovery-base"; fi
            cargo +1.99.1 build --locked --profile ci-opt --manifest-path "$source/Cargo.toml" --target-dir "$GITHUB_WORKSPACE/target/recovery-$role" -p vize_l0 --example source_recovery_benchmark --features micro-profiling
            taskset -c "$cpus" "target/recovery-$role/ci-opt/examples/source_recovery_benchmark" 100 256 profile > "evidence/profile-$role.json"
          done
          python3 - <<'PY'
          import json, pathlib, statistics
          root = pathlib.Path('evidence')
          summary = {'scope': 'repeated source parse+analysis, not cold whole-project time', 'normal': {}}
          for rows in (32, 256, 2048):
              data = {role: [json.loads((root/f'normal-{role}-{rows}-{n}.json').read_text()) for n in (1,2,3)] for role in ('base','head')}
              assert len({(x['sourceHash'], x['sourceBytes'], x['checksum'], x['iterations']) for samples in data.values() for x in samples}) == 1
              summary['normal'][rows] = {role: {'samplesNs': [x['elapsedNs'] for x in samples], 'medianNs': statistics.median(x['elapsedNs'] for x in samples)} for role,samples in data.items()}
          profiles = {role: json.loads((root/f'profile-{role}.json').read_text()) for role in ('base','head')}
          assert profiles['base']['sourceHash'] == profiles['head']['sourceHash']
          for role, multiplier in (('base', 2), ('head', 1)):
              sample = profiles[role]
              entries = [x for x in sample['micro'] if x['name'] == 'croquis.oxc.recovery.bytes']
              assert len(entries) == 1 and entries[0]['calls'] == sample['iterations'] * multiplier
              assert entries[0]['units'] == sample['sourceBytes'] * sample['iterations'] * multiplier
          assert profiles['head']['allocation']['requestedBytes'] < profiles['base']['allocation']['requestedBytes']
          summary['allocation'] = {role: x['allocation'] for role,x in profiles.items()}
          (root/'summary.json').write_text(json.dumps(summary, indent=2)+'\n')
          PY
          rm evidence/normal-base evidence/normal-head
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: script-recovery-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
