# DO NOT EDIT. Generated from tools/config/pkl/workflows/performance/criterion-bench.pkl.
# Edit the Pkl source and run `node tools/commands/generate/repository-config.ts`.
name: Benchmark - Criterion suites
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full base commit SHA
        required: true
        type: string
      head_sha:
        description: Full head commit SHA
        required: true
        type: string
      vapor_only:
        description: Measure only the Davinci Vapor native/retained pairs
        required: false
        default: false
        type: boolean
      level_memory_only:
        description: Compare all105 normal-mode allocation and RSS reports
        required: false
        default: false
        type: boolean
      production_only:
        description: Measure whole-SFC shipping shapes on three independent reference runners
        required: false
        default: false
        type: boolean
concurrency:
  group: criterion-bench-${{ inputs.base_sha }}-${{ inputs.head_sha }}-${{ inputs.production_only || false }}-${{ inputs.level_memory_only || false }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Relative comparisons stay report-only; existing absolute and dialect gates remain strict.
  CRITERION_AB_THRESHOLD: ""
  DIALECT_GUARD_FILE_COUNT: 400
  DIALECT_GUARD_THRESHOLD_PERCENT: 2
jobs:
  criterion-ab:
    if: ${{ !inputs.production_only && !inputs.level_memory_only }}
    name: criterion-ab
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/criterion-bench/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - name: Checkout head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: head
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: base
          ref: ${{ inputs.base_sha }}
          persist-credentials: false
      - name: Validate exact benchmark commits
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: . "${{ env.VIZE_CI_FILES }}/validate-exact-benchmark-commits.sh"
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      # The A/B driver is plain Node (no npm deps); pin the runtime so the
      # script never runs under an unexpected runner-default Node version.
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "head/package.json"
          cache: true
          run-install: false
      - name: Select affected Criterion suites
        id: impact
        env:
          PR_BASE_SHA: ${{ inputs.base_sha }}
          PR_HEAD_SHA: ${{ inputs.head_sha }}
          VAPOR_ONLY: ${{ inputs.vapor_only }}
        run: . "${{ env.VIZE_CI_FILES }}/select-affected-criterion-suites.sh"
      - name: Setup Wild linker
        uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        if: steps.impact.outputs.has_suites == 'true'
        with:
          wild-version: "0.9.0"
      # Criterion stores base/head build artifacts in isolated subdirectories
      # under head/target, while the surrounding cache keeps both sides warm.
      # The cache action's nested local action resolves from the workspace root,
      # and this job checks the repository out under head/.
      - name: Expose the nested target action at the workspace root
        run: . "${{ env.VIZE_CI_FILES }}/expose-the-nested-target-action-at-the-workspace-root.sh"
      - name: Mount Criterion cache
        uses: ./head/.github/actions/setup-rust-sticky-cache
        if: steps.impact.outputs.has_suites == 'true'
        with:
          key: criterion-bench
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
          target-path: head/target
      - name: Cache critcmp
        id: cache-critcmp
        if: steps.impact.outputs.has_suites == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cargo/bin/critcmp
          key: ${{ runner.os }}-critcmp-0.1.8
      - name: Install critcmp
        if: steps.impact.outputs.has_suites == 'true' && steps.cache-critcmp.outputs.cache-hit != 'true'
        run: cargo install critcmp --version 0.1.8 --locked
      # The runner compares exported baseline snapshots, so base/head builds do
      # not share one Cargo target graph.
      - name: Run criterion A/B
        run: . "${{ env.VIZE_CI_FILES }}/run-criterion-a-b.sh"
      - name: Install pinned official compiler-vapor
        if: steps.impact.outputs.vapor_selected == 'true'
        working-directory: head
        run: vp install --filter @vize/bench... --frozen-lockfile --prefer-offline
      - name: Compare Vapor L3, retained and official compiler on exact head
        if: steps.impact.outputs.vapor_selected == 'true'
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: . "${{ env.VIZE_CI_FILES }}/compare-vapor-l3-retained-and-official-compiler-on-exact-head.sh"
      - name: Upload criterion A/B summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: criterion-ab
          path: |
            criterion-ab-summary.md
            head/target/criterion-ab-base.json
            head/target/criterion-ab-head.json
            vapor-compiler-comparison.json
            vapor-compiler-comparison.md
          if-no-files-found: warn
          retention-days: 14
  dialect-guard:
    if: ${{ !inputs.production_only && !inputs.level_memory_only }}
    name: dialect-guard
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/criterion-bench/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - name: Checkout head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha }}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: dialect-guard
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      # The corpus generator and guard driver are plain Node (no npm deps).
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - name: Install locked config dependencies
        run: vp install --frozen-lockfile --prefer-offline --filter vize-workspace --ignore-scripts
      # A vize binary with the legacy Vue feature OFF (the shipped Vue 3 build)
      # and one with it ON. Distinct target dirs keep the two feature sets from
      # invalidating each other's incremental cache.
      - name: Build vize (legacy OFF)
        run: cargo build --profile ci-opt -p vize --target-dir target/off
      - name: Build vize (legacy ON)
        run: cargo build --profile ci-opt -p vize --features legacy --target-dir target/on
      - name: Generate Vue 3 corpus
        run: node tools/benchmarks/scripts/generate.mjs "$DIALECT_GUARD_FILE_COUNT"
      - name: Compare legacy OFF vs ON
        run: . "${{ env.VIZE_CI_FILES }}/compare-legacy-off-vs-on.sh"
  production-pairs:
    if: ${{ inputs.production_only && !inputs.level_memory_only }}
    name: Production pairs (measurement ${{ matrix.repetition }})
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2, 3]
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/criterion-bench/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact production comparison head
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: . "${{ env.VIZE_CI_FILES }}/validate-exact-production-comparison-head.sh"
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable, components: clippy }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: davinci-production-pairs-${{ matrix.repetition }}
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          run-install: false
      - name: Check scoped selector and benchmark compile contract
        run: . "${{ env.VIZE_CI_FILES }}/check-scoped-selector-and-benchmark-compile-contract.sh"
      - name: Build before timed windows
        run: vp exec cargo build --profile ci-opt -p vize_atelier_sfc --features davinci-production-bench --example davinci_production_perf
      - name: Measure shipping adapter pairs
        env:
          VIZE_BENCH_HEAD_SHA: ${{ inputs.head_sha }}
        run: . "${{ env.VIZE_CI_FILES }}/measure-shipping-adapter-pairs.sh"
      - name: Collect detailed bridge attribution in a separate binary
        if: ${{ matrix.repetition == 1 }}
        env:
          VIZE_BENCH_HEAD_SHA: ${{ inputs.head_sha }}
        run: . "${{ env.VIZE_CI_FILES }}/collect-detailed-bridge-attribution-in-a-separate-binary.sh"
      - name: Upload raw samples and separate attribution profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: davinci-production-perf-${{ matrix.repetition }}
          path: production-perf/
          if-no-files-found: warn
          retention-days: 30
  production-summary:
    if: ${{ inputs.production_only && !inputs.level_memory_only }}
    needs: production-pairs
    runs-on: blacksmith-32vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          run-install: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: davinci-production-perf-*
          path: production-perf
      - name: Validate identities and aggregate all independent observations
        run: vp exec node tools/benchmarks/scripts/davinci-production-summary.ts production-perf production-perf/summary.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: davinci-production-summary
          path: production-perf/summary.md
          if-no-files-found: error
          retention-days: 30
  level-memory:
    if: ${{ inputs.level_memory_only }}
    uses: ./.github/workflows/level-memory-bench.yml
    with:
      base_sha: ${{ inputs.base_sha }}
      head_sha: ${{ inputs.head_sha }}
      conflicting_modes: ${{ inputs.production_only || inputs.vapor_only }}
