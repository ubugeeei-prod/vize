name: Criterion Bench

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full base commit SHA
        required: true
        type: string
      head_sha:
        description: Full head commit SHA
        required: true
        type: string
      vapor_only:
        description: Measure only the Davinci Vapor native/retained pairs
        required: false
        default: false
        type: boolean

concurrency:
  group: criterion-bench-${{ inputs.base_sha }}-${{ inputs.head_sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Relative Criterion comparisons remain report-only because shared-runner
  # jitter makes one global percentage threshold unreliable. Individual suites
  # may additionally declare conservative absolute median budgets; those are
  # hard gates on the reference runner. The dialect guard below is also a hard
  # gate because byte-identical codegen is deterministic.
  #
  # The A/B sweep covers the four JSX cost dimensions #1501 requires — parser/
  # lowering (jsx_lower), Croquis analysis (jsx_croquis_analyze), Patina rule
  # traversal (jsx_lint, from vize_patina/markup_ir_bench), and VDOM/Vapor
  # codegen — so a regression in any of them shows up in the critcmp table. The
  # documented JSX regression threshold is 10% (see tools/benchmarks/scripts/criterion-ab.mjs):
  # setting CRITERION_AB_THRESHOLD: 10 here flips this lane from report-only into
  # a hard gate that fails on a +10% median regression, no code change needed.
  CRITERION_AB_THRESHOLD: ""
  # The dialect-guard corpus is small so the legacy OFF/ON binaries compile it
  # quickly; identity is exact, and the A/B timing tolerates a 2% delta once the
  # paired median delta is large enough to exceed CI millisecond-scale jitter.
  DIALECT_GUARD_FILE_COUNT: 400
  DIALECT_GUARD_THRESHOLD_PERCENT: 2

jobs:
  criterion-ab:
    name: criterion-ab
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: head
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: base
          ref: ${{ inputs.base_sha }}
          persist-credentials: false

      - name: Validate exact benchmark commits
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" != "$HEAD_SHA" ]]
          [[ "$HEAD_SHA" == "$DISPATCH_SHA" ]]
          [[ "$(git -C base rev-parse HEAD)" == "$BASE_SHA" ]]
          [[ "$(git -C head rev-parse HEAD)" == "$HEAD_SHA" ]]
          git -C head merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # The A/B driver is plain Node (no npm deps); pin the runtime so the
      # script never runs under an unexpected runner-default Node version.
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "head/package.json"
          cache: true
          run-install: false

      - name: Select affected Criterion suites
        id: impact
        env:
          PR_BASE_SHA: ${{ inputs.base_sha }}
          PR_HEAD_SHA: ${{ inputs.head_sha }}
          VAPOR_ONLY: ${{ inputs.vapor_only }}
        run: |
          if [[ "$VAPOR_ONLY" == "true" ]]; then
            printf '%s\n' '{"selected":["vize_atelier_vapor"],"reason":"Explicit Davinci Vapor native/retained comparison."}' > "$GITHUB_WORKSPACE/criterion-impact.json"
            echo 'has_suites=true' >> "$GITHUB_OUTPUT"
          else
            node head/tools/benchmarks/scripts/criterion-impact.mjs \
              --repo-dir "$GITHUB_WORKSPACE/head" \
              --base-sha "$PR_BASE_SHA" \
              --head-sha "$PR_HEAD_SHA" \
              --out "$GITHUB_WORKSPACE/criterion-impact.json"
          fi
          if node -e 'const s = require(process.argv[1]); process.exit(s.selected.includes("vize_atelier_vapor") ? 0 : 1)' "$GITHUB_WORKSPACE/criterion-impact.json"; then
            echo 'vapor_selected=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Wild linker
        uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        if: steps.impact.outputs.has_suites == 'true'
        with:
          wild-version: "0.9.0"

      # Criterion stores base/head build artifacts in isolated subdirectories
      # under head/target, while the surrounding cache keeps both sides warm.
      - name: Mount Criterion cache
        uses: ./head/.github/actions/setup-rust-sticky-cache
        if: steps.impact.outputs.has_suites == 'true'
        with:
          key: criterion-bench
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
          target-path: head/target

      - name: Cache critcmp
        id: cache-critcmp
        if: steps.impact.outputs.has_suites == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cargo/bin/critcmp
          key: ${{ runner.os }}-critcmp-0.1.8

      - name: Install critcmp
        if: steps.impact.outputs.has_suites == 'true' && steps.cache-critcmp.outputs.cache-hit != 'true'
        run: cargo install critcmp --version 0.1.8 --locked

      # The runner compares exported baseline snapshots, so base/head builds do
      # not share one Cargo target graph.
      - name: Run criterion A/B
        run: |
          node head/tools/benchmarks/scripts/criterion-ab.mjs \
            --base-dir "$GITHUB_WORKSPACE/base" \
            --head-dir "$GITHUB_WORKSPACE/head" \
            --target-dir "$GITHUB_WORKSPACE/head/target" \
            --selection "$GITHUB_WORKSPACE/criterion-impact.json" \
            ${CRITERION_AB_THRESHOLD:+--threshold "$CRITERION_AB_THRESHOLD"} \
            --out "$GITHUB_WORKSPACE/criterion-ab-summary.md"

      - name: Install pinned official compiler-vapor
        if: steps.impact.outputs.vapor_selected == 'true'
        working-directory: head
        run: vp install --filter @vize/bench... --frozen-lockfile --prefer-offline

      - name: Compare Vapor S3, retained and official compiler on exact head
        if: steps.impact.outputs.vapor_selected == 'true'
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          node head/tools/benchmarks/scripts/vapor-compiler-compare.mjs \
            --head-sha "$HEAD_SHA" \
            --criterion "$GITHUB_WORKSPACE/head/target/criterion-ab-head.json" \
            --out "$GITHUB_WORKSPACE/vapor-compiler-comparison.json" \
            --summary "$GITHUB_WORKSPACE/vapor-compiler-comparison.md"

      - name: Upload criterion A/B summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: criterion-ab
          path: |
            criterion-ab-summary.md
            vapor-compiler-comparison.json
            vapor-compiler-comparison.md
          if-no-files-found: warn
          retention-days: 14

  dialect-guard:
    name: dialect-guard
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"

      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: dialect-guard
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}

      # The corpus generator and guard driver are plain Node (no npm deps).
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false

      # A vize binary with the legacy Vue feature OFF (the shipped Vue 3 build)
      # and one with it ON. Distinct target dirs keep the two feature sets from
      # invalidating each other's incremental cache.
      - name: Build vize (legacy OFF)
        run: cargo build --profile ci-opt -p vize --target-dir target/off

      - name: Build vize (legacy ON)
        run: cargo build --profile ci-opt -p vize --features legacy --target-dir target/on

      - name: Generate Vue 3 corpus
        run: node tools/benchmarks/scripts/generate.mjs "$DIALECT_GUARD_FILE_COUNT"

      - name: Compare legacy OFF vs ON
        run: |
          node tools/benchmarks/scripts/dialect-guard.mjs \
            --input tools/benchmarks/scripts/__in__ \
            --off-bin target/off/ci-opt/vize \
            --on-bin target/on/ci-opt/vize \
            --out-dir "$GITHUB_WORKSPACE/dialect-guard-out" \
            --threshold "$DIALECT_GUARD_THRESHOLD_PERCENT"
