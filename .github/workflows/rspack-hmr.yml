name: Rspack SFC HMR

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/rspack-hmr.yml"
      - "npm/builder/rspack/**"
      - "npm/builder/shared/**"
      - "npm/native/**"
      - "crates/vize_atelier_sfc/**"
      - "crates/vize_vitrine/src/napi/sfc/**"
      - "crates/vize_croquis/src/sfc/**"

permissions: { contents: read }

concurrency:
  group: rspack-hmr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: package.json, cache: true, run-install: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.99.1" }
      - uses: ./.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with: { key: rspack-hmr, cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}" }
      - uses: ./.github/actions/setup-ubuntu-archive
      - run: vp install --frozen-lockfile --prefer-offline
      - name: Build the source native image
        run: vp run --filter @vizejs/native build:ci
      - name: Check CSS module HMR identity without a browser
        run: node --test npm/builder/rspack/src/shared/output.test.ts npm/builder/rspack/src/shared/hotReload.test.ts
      - name: Install the isolated Rspack 2 runtime from the HMR docs
        working-directory: npm/builder/rspack
        run: |
          set -euo pipefail
          runtime="${RUNNER_TEMP}/vize-rspack-hmr-runtime"
          npm install --prefix "$runtime" --legacy-peer-deps \
            @rspack/core@2.2.2 @rspack/dev-server@2.2.1 \
            vue@3.5.42 playwright@1.62.1 css-loader@7.1.2
          vize-ci-apt-retry node "$runtime/node_modules/playwright/cli.js" install --with-deps chromium
          echo "VIZE_HMR_RUNTIME=$runtime" >> "$GITHUB_ENV"
      - name: Run browser HMR
        # A live browser session needs the selected runtime environment and fresh execution.
        run: vp run --no-cache --filter @vizejs/rspack-plugin test:hmr
