name: Rspack SFC HMR

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/08-rspack.yml"
      - "tools/ci/workflows/08-rspack/scripts/**"
      - "npm/builder/rspack/**"
      - "npm/builder/shared/**"
      - "npm/native/**"
      - "crates/vize_atelier_sfc/**"
      - "crates/vize_vitrine/src/napi/sfc/**"
      - "crates/vize_croquis/src/sfc/**"
      - tools/ci/workflows/08-rspack/jobs/**

permissions: { contents: read }

concurrency:
  group: rspack-hmr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      VIZE_CI_FILES: "${{ github.workspace }}/tools/ci/workflows/08-rspack/scripts"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { version: 1.8.0, node-version-file: package.json, cache: true, run-install: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.100.0" }
      - uses: ./.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with: { key: rspack-hmr, cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}" }
      - uses: ./.github/actions/setup-ubuntu-archive
      - run: vp install --frozen-lockfile --prefer-offline
      - name: Build the source native image
        run: vp run --filter @vizejs/native build:ci
      - name: Check CSS module HMR identity without a browser
        run: node --test npm/builder/rspack/src/shared/output.test.ts npm/builder/rspack/src/shared/hotReload.test.ts
      - name: Install the isolated Rspack 2 runtime from the HMR docs
        working-directory: npm/builder/rspack
        run: . "${{ env.VIZE_CI_FILES }}/install-the-isolated-rspack-2-runtime-from-the-hmr-docs.sh"
      - name: Run browser HMR
        # A live browser session needs the selected runtime environment and fresh execution.
        run: vp run --no-cache --filter @vizejs/rspack-plugin test:hmr
  source-ranges:
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_TERM_COLOR: always
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /tools/ci/lib/scripts/
            /tools/ci/workflows/08-rspack/scripts/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          version: 1.8.0
          node-version-file: package.json
          cache: true
          cache-save: false
          run-install: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.100.0
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with:
          wild-version: 0.9.0
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: clippy-test
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      - name: Install the locked adapter and native dependencies
        run: vp install --frozen-lockfile --prefer-offline --filter '@vizejs/rspack-plugin...' --filter '@vizejs/builder-shared...' --filter '@vizejs/native...'
      - name: Prepare the exact source native image
        run: . "${{ env.VIZE_CI_FILES }}/src-ranges-prepare-the-exact-source-native-image.sh"
      - name: Retain original src boundaries, complete modules and source maps
        run: . "${{ env.VIZE_CI_FILES }}/src-ranges-retain-original-src-boundaries-complete-modules-and-source-maps.sh"
