name: Fresco dimension benchmark

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fresco-dimensions-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HEAD_SHA: ${{ github.sha }}

jobs:
  dimensions:
    name: Fresco dimension parity and layout (measurement ${{ matrix.replica }})
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source of both parser implementations
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]
          echo "BASE_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: clippy
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: fresco-dimensions-${{ matrix.replica }}
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Prove scalar bits, error categories and consumer behavior
        run: cargo test --locked -p vize_fresco layout::dimensions
      - name: Verify the actual NAPI call sites
        run: cargo clippy --locked -p vize_fresco --features napi --lib -- -D warnings
      - name: Lint the parity corpus and benchmark
        run: cargo clippy --locked -p vize_fresco --lib --tests -- -D warnings
      - name: Compare actual parsing and 1k/10k node layout workloads
        env:
          FRESCO_DIMENSION_BENCH_OUT: ${{ github.workspace }}/fresco-dimension-bench.json
          REPLICA: ${{ matrix.replica }}
        run: cargo test --locked --profile ci-opt -p vize_fresco --lib paired_parse_and_layout -- --ignored --test-threads=1
      - name: Upload raw paired timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fresco-dimension-bench-${{ matrix.replica }}
          path: fresco-dimension-bench.json
          if-no-files-found: error
          retention-days: 14
