name: Generated VTS source census
run-name: Exact 1/10/100 SFC source census at ${{ inputs.source_sha }}

# This exact-campaign workflow requires an immutable one-commit source/parent
# pair and a complete instrumentation allowlist, so arbitrary PRs must not run it.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable source commit to check out and measure
        type: string
        required: true
      source_parent:
        description: Immutable immediate production parent
        type: string
        required: true

permissions: { contents: read }

concurrency:
  group: vts-source-census-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  census:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      GOMAXPROCS: "4"
      RAYON_NUM_THREADS: "4"
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_PARENT: ${{ inputs.source_parent }}
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/vts-source-census/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version-file: package.json, package-manager-cache: false }
      - name: Install only the pinned workflow parser
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/install-only-the-pinned-workflow-parser.sh"
      - name: Verify exact source, observer laws and production projection
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/verify-exact-source-observer-laws-and-production-projection.sh"
      - name: Remove the workflow parser link
        if: always()
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/remove-the-workflow-parser-link.sh"
      - name: Install only the pinned public Vue checker and schema provider
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/install-only-the-pinned-public-vue-checker-and-schema-provider.sh"
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.100.0" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - name: Build one fresh profiling CLI and measure three paired repetitions
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/build-one-fresh-profiling-cli-and-measure-three-paired-repetitions.sh"
      - name: Run profiling-only identity and custody laws in the built target
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/run-profiling-only-identity-and-custody-laws-in-the-built-target.sh"
      - name: Package bounded receipts apart from complete public evidence
        if: always()
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/package-bounded-receipts-apart-from-complete-public-evidence.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: vts-source-census-small-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/census-evidence/summary.json
            ${{ runner.temp }}/census-evidence/build.json
            ${{ runner.temp }}/census-evidence/packets/*/source-identity.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: vts-source-census-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/census-raw.tgz
          if-no-files-found: error
          retention-days: 14
