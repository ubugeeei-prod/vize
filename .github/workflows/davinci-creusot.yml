name: Davinci Creusot

# Deductive proofs of the Davinci laws (docs/davinci/decisions/2026-11-17-creusot.md).
# Creusot compiles the tests/formal/creusot workspace, whose library roots sit
# next to the shipped kernels, and why3find replays the committed proofs. Any goal without a valid
# proof fails the job. The toolchain comes from its own flake, so the product
# flake and the stable Rust build never see Creusot's nightly compiler.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prove:
    name: Creusot proofs
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          extra_nix_config: |
            keep-derivations = true
            keep-outputs = true
      - name: Cache the Creusot toolchain
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: creusot-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/nix/creusot/flake.nix', 'tools/nix/creusot/flake.lock') }}
          restore-prefixes-first-match: creusot-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 8G
      - name: Build the pinned toolchain
        run: nix build 'path:./tools/nix/creusot' --out-link "$RUNNER_TEMP/creusot" --print-build-logs
      - name: Find certificates from the original recovery kernel
        working-directory: tests/formal/creusot
        run: nix develop 'path:../../../tools/nix/creusot' --command cargo creusot -- -p vize_l2_recovery_proofs --locked
      - name: Replay the captured proofs
        working-directory: tests/formal/creusot
        run: nix develop 'path:../../../tools/nix/creusot' --command cargo creusot --replay -- -p vize_l2_recovery_proofs --locked
      - name: Save the solver certificates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: checked-prefix-certificates
          path: tests/formal/creusot/verif/vize_l2_recovery_proofs_rlib/**/proof.json
          if-no-files-found: error
          retention-days: 7
      - name: Check that changing either runtime operation invalidates its certificate
        working-directory: tests/formal/creusot
        shell: bash
        run: |
          set -euo pipefail
          kernel=../../../davinci/vize_l2/src/query/script/assignments/prefix/frame.rs
          cp "$kernel" "$RUNNER_TEMP/valid-recovery-frame.rs"
          for operation in rebase retry_limit; do
            cp "$RUNNER_TEMP/valid-recovery-frame.rs" "$kernel"
            if [[ "$operation" == rebase ]]; then
              sed -i 's/new_start + (offset - old_start)/new_start/' "$kernel"
            else
              sed -i 's/failed_end \/ 2)/failed_end \/ 1)/' "$kernel"
            fi
            ! cmp -s "$kernel" "$RUNNER_TEMP/valid-recovery-frame.rs"
            if nix develop 'path:../../../tools/nix/creusot' --command cargo creusot --replay -- -p vize_l2_recovery_proofs --locked > "$RUNNER_TEMP/$operation.log" 2>&1; then
              echo "Invalid $operation still verified" >&2
              exit 1
            fi
            cat "$RUNNER_TEMP/$operation.log"
            rg -i 'unproved|failed goal|proof failed|partial|incomplete|no proof|stuck|failed to prove' "$RUNNER_TEMP/$operation.log"
          done
