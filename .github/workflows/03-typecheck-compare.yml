  mapper-wsl2:
    needs: mapper-build-linux
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      VIZE_CI_FILES: ${{ github.workspace }}/tools/ci/workflows/03-typecheck-compare/scripts
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364
        with:
          distribution: Ubuntu-24.04
          wsl-version: "2"
          wsl-shell-user: root
          additional-packages: ca-certificates curl time xz-utils
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pair-bin-linux
          path: pair-bin
      - name: Resolve the Windows mount
        shell: pwsh
        run: . "${{ env.VIZE_CI_FILES }}/mapper-resolve-the-windows-mount.ps1"
      - name: Install Node 24 in WSL2
        shell: wsl-bash {0}
        env:
          WSLENV: VIZE_CI_FILES/p
        run: . "$VIZE_CI_FILES/mapper-install-node-24-in-wsl2.sh"
      - name: Measure ext4 and the Windows mount
        shell: wsl-bash {0}
        env:
          WSLENV: GIANT_BLOCKS/u:SIZES/u:RUNS/u:ALLOW/u:REFERENCE/u:WSL_MOUNT_ROOT/u:GITHUB_STEP_SUMMARY/u:VIZE_CI_FILES/p
          SIZES: ${{ inputs.sizes }}
          GIANT_BLOCKS: ${{ inputs.giant_blocks || '0' }}
          RUNS: ${{ inputs.runs }}
          ALLOW: ${{ inputs.allow_output_change && '--allow-output-change' || '' }}
          REFERENCE: ${{ inputs.reference_mapper }}
        run: . "$VIZE_CI_FILES/mapper-measure-ext4-and-the-windows-mount.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pair-wsl2
          path: ${{ runner.temp }}/vize-pair/out/
          if-no-files-found: warn
  mapper-windows:
    needs: mapper-build-windows
    runs-on: blacksmith-32vcpu-windows-2025
    timeout-minutes: 90
    env:
      VIZE_CI_FILES: ${{ github.workspace }}/tools/ci/workflows/03-typecheck-compare/scripts
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pair-bin-windows
          path: pair-bin
      - name: Measure
        shell: pwsh
        env:
          SIZES: ${{ inputs.sizes }}
          GIANT_BLOCKS: ${{ inputs.giant_blocks || '0' }}
          RUNS: ${{ inputs.runs }}
          ALLOW: ${{ inputs.allow_output_change && '--allow-output-change' || '' }}
          REFERENCE: ${{ inputs.reference_mapper }}
        run: . "${{ env.VIZE_CI_FILES }}/mapper-measure.ps1"
      - name: Probe Windows burst costs
        if: inputs.windows_probe
        shell: pwsh
        env:
          SIZES: ${{ inputs.sizes }}
        run: . "${{ env.VIZE_CI_FILES }}/mapper-probe-windows-burst-costs.ps1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pair-windows
          path: ${{ runner.temp }}/pair-out/
          if-no-files-found: warn
  replay-resolve:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.mode == 'content-mapper-replay'
    needs: test
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      base: ${{ steps.shas.outputs.base }}
      head: ${{ steps.shas.outputs.head }}
    env:
      VIZE_CI_FILES: ${{ github.workspace }}/tools/ci/workflows/03-typecheck-compare/scripts
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: shas
        env:
          BASE: ${{ inputs.base }}
          HEAD: ${{ inputs.head || github.sha }}
        run: . "${{ env.VIZE_CI_FILES }}/replay-shas.sh"
  replay-build:
    needs: replay-resolve
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 90
    strategy:
      matrix:
        variant:
          - cli
          - alloc
          - perf
    env:
      BASE: ${{ needs.replay-resolve.outputs.base }}
      HEAD: ${{ needs.replay-resolve.outputs.head }}
      RUSTUP_TOOLCHAIN: 1.100.0
      VARIANT: ${{ matrix.variant }}
      PROFILE_INPUT: ${{ github.event_name == 'push' || inputs.profile }}
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /tools/ci/lib/scripts/
            /tools/ci/workflows/03-typecheck-compare/scripts/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - name: Validate inputs
        run: . "${{ env.VIZE_CI_FILES }}/replay-validate-inputs.sh"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        if: env.VARIANT == 'cli' || env.PROFILE_INPUT == 'true'
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        if: env.VARIANT == 'cli' || env.PROFILE_INPUT == 'true'
        with:
          toolchain: 1.100.0
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        if: env.VARIANT == 'cli' || env.PROFILE_INPUT == 'true'
        with:
          wild-version: 0.9.0
      - name: Build
        if: env.VARIANT == 'cli' || env.PROFILE_INPUT == 'true'
        run: . "${{ env.VIZE_CI_FILES }}/replay-build.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: env.VARIANT == 'cli' || env.PROFILE_INPUT == 'true'
        with:
          name: replay-bin-${{ matrix.variant }}
          path: replay-bin/
          retention-days: 7
  replay:
    needs:
      - replay-resolve
      - replay-build
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 120
    env:
      BASE: ${{ needs.replay-resolve.outputs.base }}
      HEAD: ${{ needs.replay-resolve.outputs.head }}
      CORPORA: ${{ inputs.corpora || 'misskey,n8n,reka-ui,nuxt-ui' }}
      RUNS: ${{ inputs.runs || '5' }}
      LAUNCHER: ${{ github.event_name == 'push' || inputs.launcher }}
      PROFILE: ${{ github.event_name == 'push' || inputs.profile }}
      ALLOW: ${{ inputs.allow_output_change && '--allow-output-change' || '' }}
      HOST_RUNS: ${{ inputs.host_runs || '3' }}
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /tools/ci/lib/scripts/
            /tools/ci/workflows/03-typecheck-compare/scripts/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - name: Validate inputs
        run: . "${{ env.VIZE_CI_FILES }}/replay-validate-inputs-2.sh"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with:
          version: 1.8.0
          node-version-file: package.json
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        if: env.LAUNCHER == 'true'
        with:
          toolchain: 1.100.0
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        if: env.LAUNCHER == 'true'
        with:
          wild-version: 0.9.0
      - uses: ./.github/actions/setup-rust-script
        if: env.LAUNCHER == 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: replay-bin-*
          path: replay-bin
          merge-multiple: true
      - name: Hydrate the corpora and install the locked hosts and corpus packages
        run: . "${{ env.VIZE_CI_FILES }}/replay-hydrate-the-corpora-and-install-the-locked-hosts-and-corpus-packages.sh"
      - name: Build the npm launcher and the native binding for base and head
        if: env.LAUNCHER == 'true'
        run: . "${{ env.VIZE_CI_FILES }}/replay-build-the-npm-launcher-and-the-native-binding-for-base-and-head.sh"
      - name: Record tsc's request streams
        run: . "${{ env.VIZE_CI_FILES }}/replay-record-tsc-s-request-streams.sh"
      - name: Replay
        run: . "${{ env.VIZE_CI_FILES }}/replay-replay.sh"
      - name: Host runs through a timing proxy
        if: env.HOST_RUNS != '0'
        run: . "${{ env.VIZE_CI_FILES }}/replay-host-runs-through-a-timing-proxy.sh"
      - name: Count allocations
        if: env.PROFILE == 'true'
        run: . "${{ env.VIZE_CI_FILES }}/replay-count-allocations.sh"
      - name: Profile the head CLI and count syscalls
        if: env.PROFILE == 'true'
        run: . "${{ env.VIZE_CI_FILES }}/replay-profile-the-head-cli-and-count-syscalls.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: replay-out
          path: ${{ runner.temp }}/replay-out/
          if-no-files-found: warn
