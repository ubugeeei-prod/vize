name: CSS color literal hover

on:
  pull_request:
    paths:
      - ".github/workflows/css-color-literal-hover.yml"
      - ".github/scripts/workflows/css-color-literal-hover/**"
      - "crates/vize_maestro/src/server/annotations.rs"
      - "crates/vize_maestro/src/server/annotations/document_color.rs"
      - "crates/vize_maestro/src/server/annotations/document_color/**"
      - "crates/vize_maestro/src/server/handlers/typed.rs"
      - "tests/tooling/lsp-css-color-literal-hover.test.ts"
      - "tests/tooling/lsp-css-color-declaration-admission.test.ts"
      - "tests/_fixtures/differential/lsp/css-color-declaration-admission-10562/**"
      - "tests/_fixtures/differential/lsp/css-concrete-color-hover-10556/**"

permissions: { contents: read }

concurrency:
  group: css-color-literal-hover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-packets:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "12"
      CARGO_TERM_COLOR: always
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      VIZE_LSP_BIN: target/ci/vize
      VIZE_LSP_REQUIRE_SOURCE_BUILD: "1"
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/css-color-literal-hover/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: package.json, cache: true, run-install: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.100.0" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with: { key: test-scripts, cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}" }
      - run: vp install --frozen-lockfile --prefer-offline
      - name: Build and receipt the exact source CLI
        run: . "${{ env.VIZE_CI_FILES }}/build-and-receipt-the-exact-source-cli.sh"
      - name: Retain full current hovers and original color-provider contracts
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/retain-full-current-hovers-and-original-color-provider-contracts.sh"
      - name: Verify selected parser and publication boundaries with actual source work
        shell: bash
        env:
          VIZE_CSS_SELECTED_WORK_CAPTURE: ${{ github.workspace }}/target/vize-tests/css-color-literal-hover/scanner-work.json
        run: . "${{ env.VIZE_CI_FILES }}/verify-selected-parser-and-publication-boundaries-with-actual-source-wor.sh"
      - name: Retain owned complete packets, source work and provider receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: css-color-hover-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha }}
          path: |
            target/vize-tests/css-color-literal-hover/
            target/vize-tests/css-color-declaration-admission/
            target/differential/lsp-sessions/
            target/ci/vize.differential-build.json
          if-no-files-found: error
          retention-days: 7
