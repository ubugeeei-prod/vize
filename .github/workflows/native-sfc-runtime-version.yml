name: SFC runtime version selection

on:
  pull_request:
    paths:
      - .github/workflows/native-sfc-runtime-version.yml
      - crates/vize_vitrine/src/napi/sfc.rs
      - crates/vize_vitrine/src/napi/sfc/**
      - davinci/vize_l0/src/config/model/vue.rs
      - tests/tooling/native-sfc-runtime-version.test.mjs
  workflow_dispatch:

permissions: { contents: read }
concurrency:
  group: sfc-runtime-version-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-runtime-selection:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "12"
      CARGO_TERM_COLOR: always
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RAYON_NUM_THREADS: "4"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VIZE_NATIVE_SFC_VERSION_REQUIRED: "1"
      VIZE_NATIVE_SFC_VERSION_PROOF: target/vize-tests/sfc-runtime-version
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: package.json, cache: true, run-install: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with: { key: sfc-runtime-version, cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}" }
      - uses: ./.github/actions/setup-rust-script
      - run: vp install --frozen-lockfile --prefer-offline --filter './npm/native...'
      - name: Build the actual source-native package
        run: vp run --filter './npm/native' build:ci
      - name: Seal the selected image and exact source
        run: GITHUB_SHA="$SOURCE_SHA" node npm/native/scripts/native-build-receipt.mjs
      - name: Verify runtime selectors, all native paths and whole outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VIZE_NATIVE_SFC_VERSION_PROOF"
          node --test tests/tooling/native-sfc-runtime-version.test.mjs 2>&1 | tee "$VIZE_NATIVE_SFC_VERSION_PROOF/tap.log"
      - name: Preserve source identity and all observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sfc-runtime-version-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/vize-tests/sfc-runtime-version/
            npm/native/.artifacts/native/build-token-receipt.json
          if-no-files-found: error
          include-hidden-files: true
