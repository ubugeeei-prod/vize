name: V1 qualification manifest

on:
  pull_request:
    paths:
      - .github/actions/setup-runtime-package-managers/action.yml
      - .github/workflows/**
      - .prettierignore
      - crates/vize/**
      - crates/vize_atelier_dom/**
      - crates/vize_atelier_jsx/**
      - crates/vize_atelier_vapor/**
      - crates/vize_canon/**
      - crates/vize_maestro/**
      - crates/vize_patina/**
      - docs/release/v1-supported-matrix.json
      - editors/**
      - npm/builder/vite/**
      - npm/cli/package.json
      - npm/framework/nuxt/**
      - npm/linter/oxlint/**
      - npm/native/package.json
      - pnpm-workspace.yaml
      - tools/commands/release/v1-support-matrix.ts
      - tools/support/compat/v1/support-matrix.ts
      - tools/support/compat/npm/smoke-release-init-managers.ts
      - tools/support/compat/npm/smoke-release-init-shapes.ts
      - tools/support/github/release-platforms.ts
      - tools/support/release/editor-platforms.ts
      - tests/tooling/v1-supported-matrix.test.ts
  workflow_call:
    inputs:
      enforce_complete:
        description: Reject every unresolved v1 qualification row
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      enforce_complete:
        description: Reject every unresolved v1 qualification row
        required: false
        type: boolean
        default: false

permissions: { contents: read }
concurrency:
  group: v1-supported-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inventory-contract:
    name: Generated fail-closed inventory contract
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", package-manager-cache: false }
      - name: Reject a stale generated manifest
        run: node tools/commands/release/v1-support-matrix.ts --check
      - name: Verify closed support, boundary and identity inventories
        run: node --test tests/tooling/v1-supported-matrix.test.ts
      - name: Enforce complete exact-candidate qualification
        if: ${{ inputs.enforce_complete }}
        run: node tools/commands/release/v1-support-matrix.ts --check --enforce-complete
