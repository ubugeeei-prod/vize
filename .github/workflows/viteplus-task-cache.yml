name: Vite+ task cache consumers
run-name: Vite+ task cache ${{ inputs.version && format('public {0}', inputs.version) || 'source' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Vize version to verify; omit to test the source integration
        required: false
        type: string
  pull_request:
    paths:
      - "npm/builder/vite/src/**"
      - "npm/cli/src/config/**"
      - "crates/vize_carton/src/config/loader/**"
      - "npm/builder/vite/scripts/check-task-cache.ts"
      - ".github/workflows/viteplus-task-cache.yml"

permissions: { contents: read }

concurrency:
  group: viteplus-task-cache-${{ github.event.pull_request.number || github.ref }}-${{ inputs.version || 'source' }}
  cancel-in-progress: true

jobs:
  consumers:
    strategy:
      fail-fast: false
      matrix:
        provider: ["0.2.3", "1.4.0"]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with: { node-version-file: package.json, run-install: false }
      - name: Check real installed tasks and cache invalidation
        env:
          VIZE_TASK_CACHE_PROVIDER: ${{ matrix.provider }}
          VIZE_TASK_CACHE_PUBLIC_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VIZE_TASK_CACHE_PUBLIC_VERSION" ]; then
            node npm/builder/vite/scripts/check-task-cache.ts "$VIZE_TASK_CACHE_PUBLIC_VERSION"
          else
            node npm/builder/vite/scripts/check-task-cache.ts
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: viteplus-task-cache-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/differential/viteplus-task-cache/*.json
          if-no-files-found: error
          retention-days: 14
