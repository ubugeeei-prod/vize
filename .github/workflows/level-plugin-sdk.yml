name: Levels Plugin SDK

on:
  pull_request:
    branches: [main, levels]
    paths:
      - "npm/plugin-sdk/**"
      - "npm/devtools/**"
      - "crates/vize_vitrine/**"
      - "crates/vize_croquis/**"
      - "tests/tooling/level-plugin-*.test.ts"
      - "tests/tooling/fixtures/level-plugin-sdk/**"
      - ".github/workflows/level-plugin-sdk.yml"
  push:
    branches: [main, levels]
    paths:
      - "npm/plugin-sdk/**"
      - "npm/devtools/**"
      - "crates/vize_vitrine/**"
      - "crates/vize_croquis/**"
      - "tests/tooling/level-plugin-*.test.ts"
      - "tests/tooling/fixtures/level-plugin-sdk/**"
      - ".github/workflows/level-plugin-sdk.yml"
  workflow_dispatch:

concurrency:
  group: level-plugin-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plugin-contracts:
    name: Native JS plugin contracts (TS-51)
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: level-plugin-sdk
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      - run: vp install --frozen-lockfile --prefer-offline
      - name: Build the actual native JS host
        working-directory: npm/native
        run: vp run build:ci
      - name: Prepare the pinned isolation runtime
        run: vp exec node tools/support/compat/levels/plugin-sandbox-image.ts
      - name: Run the author package and native plugin contracts
        run: vp exec node --test tests/tooling/level-plugin-*.test.ts
