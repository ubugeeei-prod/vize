name: Release Log Escape Contract Probe
on:
  push:
    branches: [ci-release-registry-response-probe]
    paths: [.github/workflows/registry-response-probe.yml]
  workflow_dispatch:
permissions:
  actions: read
jobs:
  probe:
    if: github.repository == 'ubugeeei-prod/vize' && github.ref == 'refs/heads/ci-release-registry-response-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify exact failed-log capture with installed GitHub CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const repo = 'ubugeeei-prod/vize';
          const job = 113945842593;
          const run = 37967620221;
          const head = 'f58ba3592f378a6a40eea75b3d8040c6ad26ea0f';
          const expectedBytes = 175686;
          const expectedSha256 = '904e2082d84d53b83abd294161615c30aaa4ca674b64ef02b57419f2f57e95ba';
          const knownRefusal = 'the response contains terminal escape sequences; pass --allow-escape-sequences to output it anyway';
          const hash = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const escapes = (bytes) => bytes.reduce((count, byte) => count + Number(byte === 27), 0);
          const ensure = (ok, label) => { if (!ok) throw new Error(label); };
          function invoke(label, args) {
            const result = spawnSync('gh', args, {
              timeout: 30000,
              maxBuffer: 8 * 1024 * 1024,
              encoding: 'buffer',
              env: { ...process.env, GH_PROMPT_DISABLED: '1' },
            });
            const stdout = Buffer.isBuffer(result.stdout) ? result.stdout : Buffer.alloc(0);
            const stderr = Buffer.isBuffer(result.stderr) ? result.stderr : Buffer.alloc(0);
            const classification = result.error || result.signal ? 'subprocess-failure'
              : result.status === 0 ? 'success'
              : stderr.includes(Buffer.from(knownRefusal)) ? 'known-escape-refusal' : 'unknown-failure';
            console.log(JSON.stringify({
              command: label, exit: result.status, classification,
              stdoutBytes: stdout.length, stdoutSha256: hash(stdout), stdoutEscCount: escapes(stdout),
              stderrBytes: stderr.length, stderrSha256: hash(stderr), stderrEscCount: escapes(stderr),
            }));
            return { ...result, stdout, stderr, classification };
          }
          function jsonCall(label, path) {
            const result = invoke(label, ['api', path]);
            ensure(result.status === 0 && !result.error && !result.signal, label + ' failed');
            let parsed;
            try { parsed = JSON.parse(result.stdout.toString('utf8')); }
            catch { throw new Error(label + ' invalid JSON'); }
            return parsed;
          }
          const version = invoke('gh-version', ['version']);
          ensure(version.status === 0 && !version.error && !version.signal, 'gh version failed');
          const match = version.stdout.toString('utf8').match(/^gh version (\d+\.\d+\.\d+)/);
          ensure(Boolean(match), 'gh version unrecognized');
          console.log(JSON.stringify({ ghVersion: match[1] }));
          const jobMetadata = jsonCall('exact-job-metadata', 'repos/' + repo + '/actions/jobs/' + job);
          ensure(jobMetadata.id === job && jobMetadata.run_id === run && jobMetadata.head_sha === head
            && jobMetadata.status === 'completed' && jobMetadata.conclusion === 'failure', 'job identity mismatch');
          const runMetadata = jsonCall('exact-run-metadata', 'repos/' + repo + '/actions/runs/' + run);
          ensure(runMetadata.id === run && runMetadata.head_sha === head && runMetadata.run_attempt === 1
            && runMetadata.status === 'completed' && runMetadata.conclusion === 'failure'
            && runMetadata.head_repository?.full_name === repo, 'run identity mismatch');
          const path = 'repos/' + repo + '/actions/jobs/' + job + '/logs';
          const withoutFlag = invoke('raw-log-without-escape-flag', ['api', path]);
          const withFlag = invoke('raw-log-with-escape-flag', ['api', path, '--allow-escape-sequences']);
          ensure(withFlag.status === 0 && !withFlag.error && !withFlag.signal, 'escape flag fetch failed');
          ensure(withFlag.stdout.length === expectedBytes && hash(withFlag.stdout) === expectedSha256
            && escapes(withFlag.stdout) === 4097, 'flag raw log identity mismatch');
          const unflaggedMatch = withoutFlag.status === 0 && !withoutFlag.error && !withoutFlag.signal
            && withoutFlag.stdout.length === expectedBytes && hash(withoutFlag.stdout) === expectedSha256;
          const knownUnflaggedRefusal = withoutFlag.status !== 0 && !withoutFlag.error && !withoutFlag.signal
            && withoutFlag.classification === 'known-escape-refusal' && withoutFlag.stdout.length === 0;
          ensure(unflaggedMatch || knownUnflaggedRefusal, 'unflagged gh behavior unrecognized');
          console.log(JSON.stringify({ classification: unflaggedMatch ? 'unflagged-raw-match' : 'unflagged-known-escape-refusal',
            stdoutBytes: withFlag.stdout.length, stdoutSha256: hash(withFlag.stdout),
            stdoutEscCount: escapes(withFlag.stdout) }));
          NODE
