name: Registry Response Probe
on:
  push:
    branches: [ci-release-registry-response-probe]
permissions: { contents: read }
jobs:
  probe:
    if: github.repository == 'ubugeeei-prod/vize'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read exact anonymous provider responses
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          const targets = [{"channel":"marketplace","name":"ubugeeei.vize","version":"0.438.0","url":"https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery","method":"POST","query":{"filters":[{"criteria":[{"filterType":7,"value":"ubugeeei.vize"}],"pageNumber":1,"pageSize":1}],"flags":1}},{"channel":"marketplace","name":"ubugeeei.vize","version":"0.438.0","url":"https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery","method":"POST","query":{"filters":[{"criteria":[{"filterType":7,"value":"ubugeeei.vize"}],"pageNumber":1,"pageSize":1}],"flags":512}}];
          const observations = [];
          async function observe(target) {
            const began = new Date().toISOString();
            try {
              const response = await fetch(target.url, { method: target.method ?? 'GET', body: target.query ? JSON.stringify(target.query) : undefined, credentials: 'omit', redirect: 'manual', cache: 'no-store', signal: AbortSignal.timeout(30000), headers: { Accept: target.channel === 'marketplace' ? 'application/json;api-version=3.0-preview.1' : 'application/json', ...(target.query ? { 'Content-Type': 'application/json' } : {}), 'Cache-Control': 'no-cache', Pragma: 'no-cache', 'User-Agent': 'vize-registry-response-probe' } });
              const chunks = []; let size = 0;
              for await (const chunk of response.body) { size += chunk.length; if (size > 2097152) throw new Error('diagnostic response exceeds 2 MiB; completeness not claimed'); chunks.push(chunk); }
              const bytes = Buffer.concat(chunks); const text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
              let parsed, parseError; try { parsed = JSON.parse(text); } catch (error) { parseError = String(error); }
              const row = { ...target, began, observedAt: new Date().toISOString(), status: response.status, finalUrl: response.url, redirected: response.redirected, contentType: response.headers.get('content-type'), date: response.headers.get('date'), bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex'), bodyShape: parsed === null ? 'null' : Array.isArray(parsed) ? 'array' : typeof parsed, parseError, rawBase64: bytes.toString('base64') };
              observations.push(row);
              if (bytes.length <= 65536) console.log('VIZE_PRIMARY_BYTES ' + JSON.stringify(row));
              console.log(JSON.stringify({ ...row, rawBase64: undefined, raw: text.length <= 2048 ? text : text.slice(0, 350), summary: target.channel === 'marketplace' && parsed && typeof parsed === 'object' ? { keys: Object.keys(parsed), results: parsed.results?.length, extensions: parsed.results?.[0]?.extensions?.length, resultMetadata: parsed.results?.[0]?.resultMetadata, extension: parsed.results?.[0]?.extensions?.[0] ? { keys: Object.keys(parsed.results[0].extensions[0]), extensionName: parsed.results[0].extensions[0].extensionName, publisher: parsed.results[0].extensions[0].publisher, flags: parsed.results[0].extensions[0].flags, versions: parsed.results[0].extensions[0].versions?.length, firstVersion: parsed.results[0].extensions[0].versions?.[0], lastVersion: parsed.results[0].extensions[0].versions?.at(-1) } : undefined } : undefined }));
            } catch (error) { const row = { ...target, began, observedAt: new Date().toISOString(), error: String(error), completeness: false }; observations.push(row); console.log(JSON.stringify(row)); }
          }
          for (let i = 0; i < targets.length; i += 3) await Promise.all(targets.slice(i, i + 3).map(observe));
          writeFileSync(process.env.RUNNER_TEMP + '/vize-registry-response-probe.json', JSON.stringify({ schema: 'vize-anonymous-provider-response-diagnostic-v1', sourceH: 'f58ba3592f378a6a40eea75b3d8040c6ad26ea0f', run: process.env.GITHUB_RUN_ID, workflowSource: process.env.GITHUB_SHA, node: process.version, observations, claim: 'Primary response data only; no release, retirement, absence qualification or publication claim.' }, null, 2));
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-response-probe
          path: ${{ runner.temp }}/vize-registry-response-probe.json
          retention-days: 7
          if-no-files-found: error
