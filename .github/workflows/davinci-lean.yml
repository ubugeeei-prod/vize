name: Davinci Lean

on:
  push:
    branches: [main, davinci]
    paths:
      - "formal/impeto/**"
      - "crates/vize_atelier_dom/**"
      - "crates/vize_atelier_vapor/**"
      - "crates/vize_impeto/**"
      - "crates/vize_s2_to_s3/**"
      - "davinci-road/plan/phase-3.md"
      - "davinci-road/plan/test-suites.md"
      - "tests/tooling/davinci-lean-reference.test.ts"
      - "tests/tooling/support/davinci-runtime-trace.mjs"
      - ".github/workflows/davinci-lean.yml"
  pull_request:
    branches: [main, davinci]
    paths:
      - "formal/impeto/**"
      - "crates/vize_atelier_dom/**"
      - "crates/vize_atelier_vapor/**"
      - "crates/vize_impeto/**"
      - "crates/vize_s2_to_s3/**"
      - "davinci-road/plan/phase-3.md"
      - "davinci-road/plan/test-suites.md"
      - "tests/tooling/davinci-lean-reference.test.ts"
      - "tests/tooling/support/davinci-runtime-trace.mjs"
      - ".github/workflows/davinci-lean.yml"
  workflow_dispatch:

concurrency:
  group: davinci-lean-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  impeto-reference:
    name: Impeto Lean reference (TS-28)
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: davinci-lean
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          run-install: false
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          lake-package-directory: formal/impeto
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "true"
      - name: Run TS-28 fixture differential
        working-directory: formal/impeto
        run: lake exe impetoRef --check-fixtures
      - name: Run TS-28 backend trace split
        working-directory: formal/impeto
        run: lake exe impetoRef --check-backend-fixtures
      - name: Run TS-28 compiled backend trace
        run: cargo test -p vize_atelier_vapor --test davinci_s3_compiled_trace
