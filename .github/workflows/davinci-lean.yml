name: Davinci Lean

on:
  schedule:
    - cron: "11 5 * * *"
  workflow_dispatch:

concurrency:
  group: davinci-lean-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  impeto-reference:
    name: Impeto Lean reference (TS-28)
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: davinci-lean
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          run-install: false
      - name: Install mounted runtime dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          lake-package-directory: tests/formal/impeto
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "true"
      - name: Run TS-28 fixture differential
        working-directory: tests/formal/impeto
        run: lake exe impetoRef --check-fixtures
      - name: Run TS-28 backend trace split
        working-directory: tests/formal/impeto
        run: lake exe impetoRef --check-backend-fixtures
      - name: Run TS-28 stateful reference differential
        working-directory: tests/formal/impeto
        run: lake exe impetoRef --check-stateful-fixtures
      - name: Reject P3-15 proof escapes in the Lean package
        working-directory: tests/formal/impeto
        run: |
          status=0
          grep -rnwE --include='*.lean' --exclude-dir=.lake 'sorry|admit|axiom|native_decide' . || status=$?
          test "$status" -eq 1
      - name: Run P3-15 reactivity lattice differential
        working-directory: tests/formal/impeto
        run: lake exe impetoRef --check-lattice-fixtures
      - name: Run P3-15 scheduling contract differential
        working-directory: tests/formal/impeto
        run: lake exe impetoRef --check-schedule-fixtures
      - name: Run C-23 independent S3 folio checker
        working-directory: tests/formal/impeto
        run: lake exe impetoRef --check-folios
      - name: Check Rust reactivity lattice fact provenance
        run: cargo test -p vize_impeto --test lattice_reference_fixture
      - name: Check Rust S3 graph and value fixture provenance
        run: cargo test -p vize_s2_to_s3 --test lean_reference_fixture
      - name: Run TS-28 compiled backend trace
        run: cargo test -p vize_atelier_vapor --test davinci_s3_compiled_trace
      - name: Run TS-30 mounted backend behavior
        run: cargo test -p vize_atelier_vapor --test davinci_mounted_behavior
      - uses: ./.github/actions/setup-ubuntu-archive
      - name: Install Chromium for the event contract
        working-directory: tests
        run: vize-ci-apt-retry vp exec playwright install --with-deps chromium
      - name: Run TS-30 event scope and delivery in Chromium
        run: cargo test -p vize_atelier_vapor --test davinci_event_handlers -- --ignored --nocapture
