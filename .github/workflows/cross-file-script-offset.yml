name: Cross-file script coordinate packets
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cross-file-script-offset.yml
      - .github/scripts/workflows/cross-file-script-offset/**
      - crates/vize/src/commands/lint/cross_file.rs
      - crates/vize/src/commands/lint/cross_file/**
      - crates/vize/src/commands/doctor.rs
      - crates/vize/src/commands/doctor/**
      - crates/vize_croquis_cf/**
      - tests/tooling/cross-file-script-offset.test.ts
      - tests/tooling/fixtures/cross-file-script-offset/**
      - tests/tooling/support/nuxt-exclusive-id-public-before.ts
      - tests/tooling/support/nuxt-render-foundation-parity.ts
      - tests/tooling/support/nuxt-render-census-proposal.ts
      - tests/tooling/support/nuxt-render-scope-*.ts
      - crates/vize_croquis/**
      - crates/vize/src/commands/project_nuxt.rs
      - crates/vize/src/commands/project_nuxt/**
      - tests/_fixtures/cross-file/nuxt-exclusive-id-10919.json
      - tests/_fixtures/cross-file/nuxt-render-foundation-controls-10919.json
  push:
    branches: [main]
    paths:
      - .github/workflows/cross-file-script-offset.yml
      - .github/scripts/workflows/cross-file-script-offset/**
      - crates/vize/src/commands/lint/cross_file.rs
      - crates/vize/src/commands/lint/cross_file/**
      - crates/vize/src/commands/doctor.rs
      - crates/vize/src/commands/doctor/**
      - crates/vize_croquis_cf/**
      - tests/tooling/cross-file-script-offset.test.ts
      - tests/tooling/fixtures/cross-file-script-offset/**
      - tests/tooling/support/nuxt-exclusive-id-public-before.ts
      - tests/tooling/support/nuxt-render-foundation-parity.ts
      - tests/tooling/support/nuxt-render-census-proposal.ts
      - tests/tooling/support/nuxt-render-scope-*.ts
      - crates/vize_croquis/**
      - crates/vize/src/commands/project_nuxt.rs
      - crates/vize/src/commands/project_nuxt/**
      - tests/_fixtures/cross-file/nuxt-exclusive-id-10919.json
      - tests/_fixtures/cross-file/nuxt-render-foundation-controls-10919.json
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: cross-file-script-offset-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  census-proposal:
    name: Propose the exact source-qualified Croquis product index
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Render a proposal without rewriting the checkout or installing dependencies
        env:
          VIZE_NUXT_SCOPE_AUTHORED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tests/tooling/support/nuxt-render-census-proposal.ts "$RUNNER_TEMP/nuxt-render-census-proposal.json"
      - name: Preserve exact source and generated index proposal
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuxt-render-census-proposal-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/nuxt-render-census-proposal.json
          if-no-files-found: error
          retention-days: 14
  producer:
    uses: ./.github/workflows/full-source-cli.yml
  coordinates:
    name: Whole split-script packets against the public CLI
    needs: producer
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      VIZE_CI_FILES: "${{ github.workspace }}/.github/scripts/workflows/cross-file-script-offset"
      VIZE_CROSS_FILE_OFFSET_REQUIRE_BEFORE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/setup-wild-http-recovery
        with:
          wild-version: "0.9.0"
      - name: Configure shared packet paths on the runner
        run: . "${{ env.VIZE_CI_FILES }}/configure-shared-packet-paths-on-the-runner.sh"
      - run: vp install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/restore-source-cli
        id: restore
        with:
          producer: ${{ toJSON(needs.producer.outputs) }}
      - name: Install the immutable public before producer outside the workspace
        id: public_before
        run: . "${{ env.VIZE_CI_FILES }}/install-the-immutable-public-before-producer-outside-the-workspace.sh"
      - name: Require complete packets, script spans and unchanged template and doctor controls
        run: vp node --test tests/tooling/cross-file-script-offset.test.ts
      - name: Capture research-only Nuxt ID before packets
        if: ${{ always() && steps.public_before.outcome == 'success' }}
        run: |
          vp node tests/tooling/support/nuxt-exclusive-id-public-before.ts --corpus tests/_fixtures/cross-file/nuxt-exclusive-id-10919.json --cli "$VIZE_CROSS_FILE_OFFSET_BEFORE_CLI" --output "$RUNNER_TEMP/cross-file-offset-proof/nuxt-exclusive-id-10919"
      - name: Require byte-identical unattested original Nuxt packets
        if: ${{ always() && steps.public_before.outcome == 'success' }}
        run: |
          vp node tests/tooling/support/nuxt-render-foundation-parity.ts --before "$RUNNER_TEMP/cross-file-offset-proof/nuxt-exclusive-id-10919/before.json" --output "$RUNNER_TEMP/cross-file-offset-proof/nuxt-render-foundation-parity.json"
      - name: Select a supported Node host after preserving the original research packets
        id: nuxt_node
        if: ${{ always() && steps.public_before.outcome == 'success' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Install the genuine pinned Nuxt runtime and unsupported-version control once
        id: nuxt_runtime
        working-directory: ${{ runner.temp }}
        if: ${{ always() && steps.public_before.outcome == 'success' && steps.nuxt_node.outcome == 'success' }}
        run: . "${{ env.VIZE_CI_FILES }}/install-the-genuine-pinned-nuxt-runtime-and-unsupported-version-control.sh"
      - name: Require actual supported Nuxt exclusivity and conservative counterfactuals with counted IO
        if: ${{ always() && steps.public_before.outcome == 'success' && steps.nuxt_runtime.outcome == 'success' }}
        env:
          VIZE_NUXT_SCOPE_AUTHORED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --experimental-import-meta-resolve tests/tooling/support/nuxt-render-scope-acceptance.ts --runtime "$RUNNER_TEMP/nuxt-runtime-10919" --before "$RUNNER_TEMP/cross-file-offset-proof/nuxt-exclusive-id-10919/before.json" --output "$RUNNER_TEMP/cross-file-offset-proof/nuxt-render-scope"
      - name: Preserve all original producer inputs, processes and output packets
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cross-file-script-offset-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/cross-file-offset-proof
          if-no-files-found: error
          retention-days: 14
