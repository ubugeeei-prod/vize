# DO NOT EDIT. Generated from tools/config/pkl/workflows/performance/compile-bench.pkl.
# Edit the Pkl source and run `node tools/commands/generate/repository-config.ts`.
name: Benchmark - SFC compilation

# Compile-only measurements on the README runner class: wall, CPU-seconds
# (user+sys) and load cost per build, single-thread and parallel apart.
# compare: the pushed commit against its merge base with main, both built from
# source in the shipped release profile; fails when their corpus output differs.
# verify: the compiler crate's tests and clippy. Opt in with [published]
# (release history from npm) and [profile] (frame-pointer perf profile).

on:
  push:
    branches: ["bench/compile/**"]
  workflow_dispatch:
    inputs:
      versions:
        description: Published @vizejs/native versions (space-separated)
        required: false
        default: ""
      profile_versions:
        description: Published versions to profile with perf (space-separated)
        required: false
        default: ""
      base:
        description: Full SHA to compare the dispatched ref against (default merge base with main)
        required: false
        default: ""
      profile:
        description: Also build the ref with frame pointers and record a perf profile
        required: false
        type: boolean
        default: false

concurrency:
  group: compile-bench-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  COMPILE_BENCH_FILES: "3000"
  COMPILE_BENCH_VERSIONS: ${{ inputs.versions || '0.424.10 0.425.1 0.429.2 0.441.0 0.481.0 0.511.0 0.541.0 0.571.0 0.601.0 0.631.0 0.646.0 0.661.0' }}
  COMPILE_BENCH_PROFILE_VERSIONS: ${{ inputs.profile_versions || '0.424.10 0.661.0' }}
  COMPILE_BENCH_BASE: ${{ inputs.base || '' }}
  # Crates the verify job tests and lints.
  COMPILE_BENCH_VERIFY: "-p vize_atelier_sfc"

jobs:
  published:
    name: published
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.versions != '') || contains(github.event.head_commit.message, '[published]') }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VIZE_CI_FILES: "${{ github.workspace }}/.github/scripts/workflows/compile-bench"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false

      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline

      - name: Generate benchmark corpus
        run: node tools/benchmarks/scripts/generate.mjs "$COMPILE_BENCH_FILES"

      - name: Fetch published natives
        run: . "${{ env.VIZE_CI_FILES }}/fetch-published-natives.sh"

      - name: Measure
        run: . "${{ env.VIZE_CI_FILES }}/measure.sh"

      - name: Profile single-thread compile
        run: . "${{ env.VIZE_CI_FILES }}/profile-single-thread-compile.sh"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compile-bench-published
          path: |
            compile-history.md
            compile-history.json
            profiles/
          retention-days: 30

  profile:
    name: profile
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.profile) || contains(github.event.head_commit.message, '[profile]') }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VIZE_CI_FILES: "${{ github.workspace }}/.github/scripts/workflows/compile-bench"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }

      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"

      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: compile-bench
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}

      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false

      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline

      # Shipped release profile plus line tables and frame pointers, so perf
      # can attribute inclusive time to compiler stages.
      - name: Build native with symbols
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_STRIP: none
        run: . "${{ env.VIZE_CI_FILES }}/build-native-with-symbols.sh"

      - name: Generate benchmark corpus
        run: node tools/benchmarks/scripts/generate.mjs "$COMPILE_BENCH_FILES"

      - name: Fetch latest published native
        run: . "${{ env.VIZE_CI_FILES }}/fetch-latest-published-native.sh"

      - name: Measure source against latest release
        run: . "${{ env.VIZE_CI_FILES }}/measure-source-against-latest-release.sh"

      - name: Profile source compile
        run: . "${{ env.VIZE_CI_FILES }}/profile-source-compile.sh"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compile-bench-source
          path: |
            compile-source.md
            compile-source.json
            profiles/
          retention-days: 30

  compare:
    name: compare
    if: ${{ !contains(github.event.head_commit.message, '[skip compare]') }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VIZE_CI_FILES: "${{ github.workspace }}/.github/scripts/workflows/compile-bench"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 50

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }

      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"

      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false

      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline

      - name: Check out the merge base
        run: . "${{ env.VIZE_CI_FILES }}/check-out-the-merge-base.sh"

      # Separate target dirs: two checkouts sharing one overwrite each other.
      - name: Build base and head natives
        run: . "${{ env.VIZE_CI_FILES }}/build-base-and-head-natives.sh"

      - name: Generate benchmark corpus
        run: node tools/benchmarks/scripts/generate.mjs "$COMPILE_BENCH_FILES"

      - name: Measure base against head
        run: . "${{ env.VIZE_CI_FILES }}/measure-base-against-head.sh"

      - name: Count instructions
        run: . "${{ env.VIZE_CI_FILES }}/count-instructions.sh"

      - name: Require identical output
        run: . "${{ env.VIZE_CI_FILES }}/require-identical-output.sh"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compile-bench-compare
          path: |
            compile-compare.md
            compile-compare.json
            stat-*.csv
          retention-days: 30

  verify:
    name: verify
    if: ${{ !contains(github.event.head_commit.message, '[skip verify]') }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable, components: clippy }

      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"

      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: compile-bench-verify
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}

      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false

      # Runtime contract tests load vue, happy-dom and the Vapor runtime.
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline

      # Snapshot fixtures are Pkl.
      - name: Install Pkl
        run: npm install --global @pkl-community/pkl@0.27.2

      - name: Clippy
        run: cargo clippy $COMPILE_BENCH_VERIFY -- -D warnings -D clippy::wildcard_imports

      - name: Test
        run: cargo test --no-fail-fast $COMPILE_BENCH_VERIFY
