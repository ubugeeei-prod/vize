name: Compile Benchmark

# Compile-only measurements on the README runner class: wall, CPU-seconds
# (user+sys) and load cost per build, single-thread and parallel apart.
# compare: the pushed commit against its merge base with main, both built from
# source in the shipped release profile; fails when their corpus output differs.
# verify: the compiler crate's tests and clippy. Opt in with [published]
# (release history from npm) and [profile] (frame-pointer perf profile).

on:
  push:
    branches: ["bench/compile/**"]
  workflow_dispatch:
    inputs:
      versions:
        description: Published @vizejs/native versions (space-separated)
        required: false
        default: ""
      profile_versions:
        description: Published versions to profile with perf (space-separated)
        required: false
        default: ""
      base:
        description: Full SHA to compare the dispatched ref against (default merge base with main)
        required: false
        default: ""
      profile:
        description: Also build the ref with frame pointers and record a perf profile
        required: false
        type: boolean
        default: false

concurrency:
  group: compile-bench-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  COMPILE_BENCH_FILES: "3000"
  COMPILE_BENCH_VERSIONS: ${{ inputs.versions || '0.424.10 0.425.1 0.429.2 0.441.0 0.481.0 0.511.0 0.541.0 0.571.0 0.601.0 0.631.0 0.646.0 0.661.0' }}
  COMPILE_BENCH_PROFILE_VERSIONS: ${{ inputs.profile_versions || '0.424.10 0.661.0' }}
  COMPILE_BENCH_BASE: ${{ inputs.base || '' }}
  # Crates the verify job tests and lints.
  COMPILE_BENCH_VERIFY: "-p vize_atelier_sfc -p vize_atelier_vapor -p vize_atelier_ssr -p vize_l1_to_l2"

jobs:
  published:
    name: published
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.versions != '') || contains(github.event.head_commit.message, '[published]') }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false

      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline

      - name: Generate benchmark corpus
        run: node tools/benchmarks/scripts/generate.mjs "$COMPILE_BENCH_FILES"

      - name: Fetch published natives
        run: |
          set -euo pipefail
          for v in $COMPILE_BENCH_VERSIONS; do
            dir="$RUNNER_TEMP/native/$v"
            mkdir -p "$dir"
            curl -fsSL "https://registry.npmjs.org/@vizejs/native-linux-x64-gnu/-/native-linux-x64-gnu-$v.tgz" | tar -xz -C "$dir"
            file "$dir"/package/*.node
          done

      - name: Measure
        run: |
          set -euo pipefail
          args=()
          for v in $COMPILE_BENCH_VERSIONS; do
            args+=(--native "$v=$(ls "$RUNNER_TEMP/native/$v"/package/*.node)")
          done
          node tools/benchmarks/scripts/compile-history.ts \
            --input tools/benchmarks/scripts/__in__ \
            --vue "$PWD/tools/benchmarks/scripts/node_modules/@vue/compiler-sfc" \
            "${args[@]}" --runs 5 --warmups 2 --rounds 2 \
            --out compile-history.md --json compile-history.json
          node -p '"@vue/compiler-sfc " + require("./tools/benchmarks/scripts/node_modules/@vue/compiler-sfc/package.json").version' >> compile-history.md
          cat compile-history.md >> "$GITHUB_STEP_SUMMARY"

      - name: Profile single-thread compile
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          perf_bin=""
          for candidate in /usr/lib/linux-tools/*/perf /usr/lib/linux-tools-*/perf; do
            if [[ -x "$candidate" ]]; then perf_bin="$candidate"; break; fi
          done
          test -n "$perf_bin"
          mkdir -p profiles
          input="$PWD/tools/benchmarks/scripts/__in__"
          for v in $COMPILE_BENCH_PROFILE_VERSIONS; do
            node_file=$(ls "$RUNNER_TEMP/native/$v"/package/*.node)
            spec=$(printf '{"label":"%s","kind":"native","path":"%s","mode":"loop1t"}' "$v" "$node_file")
            "$perf_bin" stat -e task-clock,instructions,cycles,cache-misses,branch-misses -o "profiles/$v.stat.txt" \
              node tools/benchmarks/scripts/compile-history.ts --child "$spec" --input "$input" --runs 5 --warmups 1 > /dev/null
            "$perf_bin" record -F 999 --call-graph dwarf,16384 -o "profiles/$v.perf.data" \
              node tools/benchmarks/scripts/compile-history.ts --child "$spec" --input "$input" --runs 3 --warmups 1 > /dev/null
            "$perf_bin" report -i "profiles/$v.perf.data" --no-children --sort dso,symbol --stdio --percent-limit 0.3 2> /dev/null | head -150 > "profiles/$v.self.txt"
            "$perf_bin" report -i "profiles/$v.perf.data" --children --sort symbol --stdio -g none --percent-limit 1 2> /dev/null | head -200 > "profiles/$v.children.txt"
            "$perf_bin" script -i "profiles/$v.perf.data" 2> /dev/null | gzip > "profiles/$v.perf-script.txt.gz"
            echo "::group::$v perf stat"; cat "profiles/$v.stat.txt"; echo "::endgroup::"
            echo "::group::$v self"; cat "profiles/$v.self.txt"; echo "::endgroup::"
            echo "::group::$v children"; cat "profiles/$v.children.txt"; echo "::endgroup::"
            rm "profiles/$v.perf.data"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compile-bench-published
          path: |
            compile-history.md
            compile-history.json
            profiles/
          retention-days: 30

  profile:
    name: profile
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.profile) || contains(github.event.head_commit.message, '[profile]') }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }

      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"

      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: compile-bench
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}

      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false

      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline

      # Shipped release profile plus line tables and frame pointers, so perf
      # can attribute inclusive time to compiler stages.
      - name: Build native with symbols
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_STRIP: none
        run: |
          export RUSTFLAGS="${RUSTFLAGS:-} -C force-frame-pointers=yes"
          vp run --workspace-root build:native

      - name: Generate benchmark corpus
        run: node tools/benchmarks/scripts/generate.mjs "$COMPILE_BENCH_FILES"

      - name: Fetch latest published native
        run: |
          set -euo pipefail
          v="${COMPILE_BENCH_VERSIONS##* }"
          mkdir -p "$RUNNER_TEMP/native/$v"
          curl -fsSL "https://registry.npmjs.org/@vizejs/native-linux-x64-gnu/-/native-linux-x64-gnu-$v.tgz" | tar -xz -C "$RUNNER_TEMP/native/$v"
          echo "LATEST_VERSION=$v" >> "$GITHUB_ENV"

      - name: Measure source against latest release
        run: |
          set -euo pipefail
          node tools/benchmarks/scripts/compile-history.ts \
            --input tools/benchmarks/scripts/__in__ \
            --vue "$PWD/tools/benchmarks/scripts/node_modules/@vue/compiler-sfc" \
            --native "$LATEST_VERSION=$(ls "$RUNNER_TEMP/native/$LATEST_VERSION"/package/*.node)" \
            --native "source-${GITHUB_SHA::10}=$(ls npm/native/*.node)" \
            --runs 5 --warmups 2 --rounds 2 \
            --out compile-source.md --json compile-source.json
          cat compile-source.md >> "$GITHUB_STEP_SUMMARY"

      - name: Profile source compile
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          perf_bin=""
          for candidate in /usr/lib/linux-tools/*/perf /usr/lib/linux-tools-*/perf; do
            if [[ -x "$candidate" ]]; then perf_bin="$candidate"; break; fi
          done
          test -n "$perf_bin"
          mkdir -p profiles
          node_file=$(ls "$PWD"/npm/native/*.node)
          input="$PWD/tools/benchmarks/scripts/__in__"
          for mode in loop1t batchmax; do
            spec=$(printf '{"label":"source","kind":"native","path":"%s","mode":"%s"}' "$node_file" "$mode")
            "$perf_bin" stat -e task-clock,instructions,cycles,cache-misses -o "profiles/$mode.stat.txt" \
              node tools/benchmarks/scripts/compile-history.ts --child "$spec" --input "$input" --runs 5 --warmups 1 > /dev/null
            "$perf_bin" record -F 2999 --call-graph fp -o "profiles/$mode.perf.data" \
              node tools/benchmarks/scripts/compile-history.ts --child "$spec" --input "$input" --runs 5 --warmups 1 > /dev/null
            "$perf_bin" report -i "profiles/$mode.perf.data" --no-children --sort dso,symbol --stdio -g none --percent-limit 0.2 2> /dev/null | head -250 > "profiles/$mode.self.txt"
            "$perf_bin" report -i "profiles/$mode.perf.data" --children --sort symbol --stdio -g none --percent-limit 0.3 2> /dev/null | head -400 > "profiles/$mode.children.txt"
            "$perf_bin" script -i "profiles/$mode.perf.data" 2> /dev/null | gzip > "profiles/$mode.perf-script.txt.gz"
            for f in stat self children; do echo "::group::$mode $f"; head -120 "profiles/$mode.$f.txt"; echo "::endgroup::"; done
            rm "profiles/$mode.perf.data"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compile-bench-source
          path: |
            compile-source.md
            compile-source.json
            profiles/
          retention-days: 30

  compare:
    name: compare
    if: ${{ !contains(github.event.head_commit.message, '[skip compare]') }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 50

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }

      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"

      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false

      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline

      - name: Check out the merge base
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=50 origin main
          base=$(git merge-base HEAD FETCH_HEAD)
          # A fixed base measures a whole series against one starting point.
          if [[ -n "${COMPILE_BENCH_BASE:-}" ]]; then
            git fetch --no-tags --depth=1 origin "$COMPILE_BENCH_BASE"
            base=$COMPILE_BENCH_BASE
          fi
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          git worktree add --detach "$RUNNER_TEMP/base" "$base"

      # Separate target dirs: two checkouts sharing one overwrite each other.
      - name: Build base and head natives
        run: |
          set -euo pipefail
          for side in base head; do
            dir=$PWD
            if [[ $side == base ]]; then dir=$RUNNER_TEMP/base; fi
            (cd "$dir" && CARGO_TARGET_DIR="$RUNNER_TEMP/target-$side" cargo build --release -p vize_vitrine --features napi,legacy --lib)
            cp "$RUNNER_TEMP/target-$side/release/libvize_vitrine.so" "$RUNNER_TEMP/$side.node"
            rm -rf "$RUNNER_TEMP/target-$side"
          done

      - name: Generate benchmark corpus
        run: node tools/benchmarks/scripts/generate.mjs "$COMPILE_BENCH_FILES"

      - name: Measure base against head
        run: |
          set -euo pipefail
          node tools/benchmarks/scripts/compile-history.ts \
            --input tools/benchmarks/scripts/__in__ \
            --vue "$PWD/tools/benchmarks/scripts/node_modules/@vue/compiler-sfc" \
            --native "base-${BASE_SHA::10}=$RUNNER_TEMP/base.node" \
            --native "head-${GITHUB_SHA::10}=$RUNNER_TEMP/head.node" \
            --runs 5 --warmups 2 --rounds 4 \
            --out compile-compare.md --json compile-compare.json
          cat compile-compare.md >> "$GITHUB_STEP_SUMMARY"

      - name: Count instructions
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=-1
          perf_bin=""
          for candidate in /usr/lib/linux-tools/*/perf /usr/lib/linux-tools-*/perf; do
            if [[ -x "$candidate" ]]; then perf_bin="$candidate"; break; fi
          done
          test -n "$perf_bin"
          input="$PWD/tools/benchmarks/scripts/__in__"
          {
            echo
            echo "perf stat, one process: 1 warmup + 5 passes"
            echo
            echo "| Build | Mode | Instructions | Cycles | Task clock |"
            echo "| --- | --- | ---: | ---: | ---: |"
          } >> compile-compare.md
          for mode in loop1t batch1t batchmax; do
            for side in base head; do
              spec=$(printf '{"label":"%s","kind":"native","path":"%s","mode":"%s"}' "$side" "$RUNNER_TEMP/$side.node" "$mode")
              "$perf_bin" stat -x, -e instructions,cycles,task-clock -o "stat-$side-$mode.csv" \
                node tools/benchmarks/scripts/compile-history.ts --child "$spec" --input "$input" --runs 5 --warmups 1 > /dev/null
              node -e 'const [f, side, mode] = process.argv.slice(1); const rows = Object.fromEntries(require("fs").readFileSync(f, "utf8").split("\n").filter((l) => /^[0-9]/.test(l)).map((l) => { const c = l.split(","); return [c[2], Number(c[0])]; })); console.log(`| ${side} | ${mode} | ${(rows.instructions / 1e9).toFixed(3)}G | ${(rows.cycles / 1e9).toFixed(3)}G | ${(rows["task-clock"] / 1e6).toFixed(1)} ms |`)' "stat-$side-$mode.csv" "$side" "$mode" >> compile-compare.md
            done
          done
          cat compile-compare.md

      - name: Require identical output
        run: |
          node -e '
            const { rows } = JSON.parse(require("fs").readFileSync("compile-compare.json", "utf8"));
            let ok = true;
            // An approved TS-source output change sets COMPILE_BENCH_TS_OUTPUT_MAY_CHANGE; JS-source output must never change.
            const keys = process.env.COMPILE_BENCH_TS_OUTPUT_MAY_CHANGE === "true" ? ["outputSha256Js"] : ["outputSha256"];
            for (const mode of ["loop1t", "batch1t", "batchmax"]) {
              for (const key of keys) {
                const hashes = new Set(rows.filter((row) => row.mode === mode).map((row) => row[key]));
                if (hashes.size !== 1) { ok = false; console.error(`${mode}: ${key} differs between base and head`); }
              }
            }
            if (!ok) process.exit(1);
          '

      # The timed corpus compiles DOM client output only; hash Vapor and SSR too.
      - name: Require identical Vapor and SSR output
        run: |
          set -euo pipefail
          input="$PWD/tools/benchmarks/scripts/__in__"
          { echo; echo "Vapor/SSR loop1t output (one pass)"; echo; echo "| Options | Side | Files | Failed | All | JS-source | TS-source |"; echo "| --- | --- | ---: | ---: | --- | --- | --- |"; } >> compile-compare.md
          ok=true
          for opts in '{"vapor":true}' '{"vapor":true,"isProd":true}' '{"ssr":true}' '{"ssr":true,"isProd":true}' '{"ssr":true,"vapor":true}'; do
            for side in base head; do
              spec=$(printf '{"label":"%s","kind":"native","path":"%s","mode":"loop1t"}' "$side" "$RUNNER_TEMP/$side.node")
              COMPILE_BENCH_SFC_OPTIONS="$opts" node tools/benchmarks/scripts/compile-history.ts --child "$spec" --input "$input" --runs 1 --warmups 0 > "hash-$side.json"
              node -e 'const [f, opts, side] = process.argv.slice(1); const r = JSON.parse(require("fs").readFileSync(f, "utf8")); console.log(`| \`${opts}\` | ${side} | ${r.files} | ${r.failed} | ${r.outputSha256.slice(0, 16)} | ${r.outputSha256Js.slice(0, 12)} | ${r.outputSha256Ts.slice(0, 12)} |`)' "hash-$side.json" "$opts" "$side" >> compile-compare.md
            done
            if ! node -e 'const [a, b] = process.argv.slice(1).map((f) => JSON.parse(require("fs").readFileSync(f, "utf8"))); process.exit(a.outputSha256 === b.outputSha256 && a.failed === b.failed ? 0 : 1)' hash-base.json hash-head.json; then
              echo "::error::$opts output differs between base and head"; ok=false
            fi
          done
          cat compile-compare.md
          $ok

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compile-bench-compare
          path: |
            compile-compare.md
            compile-compare.json
            stat-*.csv
          retention-days: 30

  verify:
    name: verify
    if: ${{ !contains(github.event.head_commit.message, '[skip verify]') }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable, components: clippy }

      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"

      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: compile-bench-verify
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}

      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false

      # Runtime contract tests load vue, happy-dom and the Vapor runtime.
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline

      # Snapshot fixtures are Pkl.
      - name: Install Pkl
        run: npm install --global @pkl-community/pkl@0.27.2

      - name: Clippy
        run: cargo clippy $COMPILE_BENCH_VERIFY -- -D warnings -D clippy::wildcard_imports

      - name: Test
        run: cargo test --no-fail-fast $COMPILE_BENCH_VERIFY
