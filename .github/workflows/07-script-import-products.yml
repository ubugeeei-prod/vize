        run: . "${{ env.VIZE_CI_FILES }}/measure-original-import-products.sh"
      - name: Retain exact-source parity and raw paired measurements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: original-import-products-${{ github.sha }}-${{ github.run_attempt }}
