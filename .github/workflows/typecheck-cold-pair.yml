# DO NOT EDIT. Generated from tools/config/pkl/workflows/performance/typecheck-cold-pair.pkl.
# Edit the Pkl source and run `node tools/commands/generate/repository-config.ts`.
name: Type-check cold pair
run-name: "Type-check cold pair ${{ inputs.head }} vs ${{ inputs.base }} (${{ inputs.projects }})"
# Two commits check the same generated projects cold on Linux, WSL2 (ext4 and
# the Windows mount) and native Windows, alternating builds per run.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Full 40-hex commit measured first (the "before")
        type: string
        required: true
      head:
        description: Full 40-hex commit compared against it
        type: string
        required: true
      projects:
        description: Comma-separated generated projects (vue:<sfcs> or monorepo:<sfcs>)
        type: string
        default: "vue:1000,vue:5000,monorepo:5000"
      runs:
        description: Alternating recorded cold runs per build
        type: string
        default: "5"
      runtime:
        description: Native checker host used by both builds
        type: choice
        options: [tsgo, tsrs]
        default: tsgo
      checkers:
        description: Explicit checker width used by both builds
        type: choice
        options: ["1", "8"]
        default: "8"
      strace:
        description: Attribute filesystem calls per process, syscall and path on Linux
        type: boolean
        default: true
      platforms:
        description: Comma-separated measured cells (linux, wsl2, windows)
        type: string
        default: "linux,wsl2,windows"
      allow_output_change:
        description: Publish timing even when the builds report different diagnostics
        type: boolean
        default: false
  # Registers the dispatch-only workflow from its PR; only the tests run there.
  pull_request:
    paths:
      - .github/workflows/typecheck-cold-pair.yml
      - .github/scripts/workflows/typecheck-cold-pair/**
      - tools/benchmarks/scripts/typecheck-cold-pair*.ts
      - tests/tooling/typecheck-cold-pair.test.ts
permissions: { contents: read }
concurrency:
  group: typecheck-cold-pair-${{ github.event.pull_request.number || inputs.head }}-${{ inputs.base }}-${{ inputs.projects }}-${{ inputs.platforms }}-${{ inputs.runtime }}-${{ inputs.checkers }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  test:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - run: node --test tests/tooling/typecheck-cold-pair.test.ts

  build-linux:
    # Each platform builds on its own, so Linux results do not wait for Windows.
    if: github.event_name == 'workflow_dispatch' && (contains(format(',{0},', inputs.platforms), ',linux,') || contains(format(',{0},', inputs.platforms), ',wsl2,'))
    needs: test
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      BASE: ${{ inputs.base }}
      HEAD: ${{ inputs.head }}
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/typecheck-cold-pair/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - name: Validate inputs
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/validate-inputs.sh"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.100.0" }
      # The faster linker is optional: a failed release download falls back
      # to the default linker instead of failing the pair.
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        id: wild
        continue-on-error: true
        with: { wild-version: "0.9.0" }
      - name: Drop a partial wild configuration
        if: steps.wild.outcome == 'failure'
        run: . "${{ env.VIZE_CI_FILES }}/drop-a-partial-wild-configuration.sh"
      - name: Build both commits
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/build-both-commits.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cold-pair-bin-linux
          path: pair-bin/
          retention-days: 7

  build-windows:
    # Each platform builds on its own, so Linux results do not wait for Windows.
    if: github.event_name == 'workflow_dispatch' && contains(format(',{0},', inputs.platforms), ',windows,')
    needs: test
    runs-on: blacksmith-32vcpu-windows-2025
    timeout-minutes: 90
    env:
      BASE: ${{ inputs.base }}
      HEAD: ${{ inputs.head }}
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/typecheck-cold-pair/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - name: Validate inputs
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/validate-inputs.sh"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - name: Setup MSVC toolchain
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with: { arch: amd64 }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.100.0" }
      - name: Build both commits
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/build-both-commits-2.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cold-pair-bin-windows
          path: pair-bin/
          retention-days: 7

  linux:
    needs: build-linux
    if: contains(format(',{0},', inputs.platforms), ',linux,')
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 120
    env:
      VIZE_CI_FILES: "${{ github.workspace }}/.github/scripts/workflows/typecheck-cold-pair"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: cold-pair-bin-linux, path: pair-bin }
      - name: Measure
        env:
          PROJECTS: ${{ inputs.projects }}
          RUNS: ${{ inputs.runs }}
          RUNTIME: ${{ inputs.runtime }}
          CHECKERS: ${{ inputs.checkers }}
          ALLOW: ${{ inputs.allow_output_change && '--allow-output-change' || '' }}
          STRACE: ${{ inputs.strace && '--strace' || '' }}
        run: . "${{ env.VIZE_CI_FILES }}/measure.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          { name: cold-pair-linux, path: "${{ runner.temp }}/pair-out/", if-no-files-found: warn }

  wsl2:
    needs: build-linux
    if: contains(format(',{0},', inputs.platforms), ',wsl2,')
    # WSL2 needs nested virtualization; Blacksmith Windows runners lack it.
    runs-on: windows-2025
    timeout-minutes: 300
    env:
      VIZE_CI_FILES: "${{ github.workspace }}/.github/scripts/workflows/typecheck-cold-pair"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: "2"
          wsl-shell-user: root
          additional-packages: ca-certificates curl time xz-utils
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: cold-pair-bin-linux, path: pair-bin }
      - name: Resolve the Windows mount
        shell: pwsh
        run: . "${{ env.VIZE_CI_FILES }}/resolve-the-windows-mount.ps1"
      - name: Install Node 24 in WSL2
        shell: wsl-bash {0}
        run: . "$VIZE_CI_FILES/install-node-24-in-wsl2.sh"
        env:
          WSLENV: "VIZE_CI_FILES/p"
      - name: Measure ext4 and the Windows mount
        shell: wsl-bash {0}
        env:
          PROJECTS: ${{ inputs.projects }}
          RUNS: ${{ inputs.runs }}
          RUNTIME: ${{ inputs.runtime }}
          CHECKERS: ${{ inputs.checkers }}
          ALLOW: ${{ inputs.allow_output_change && '--allow-output-change' || '' }}
          WSLENV: "PROJECTS/u:RUNS/u:RUNTIME/u:CHECKERS/u:ALLOW/u:WSL_MOUNT_ROOT/u:GITHUB_STEP_SUMMARY/u:VIZE_CI_FILES/p"
        run: . "$VIZE_CI_FILES/measure-ext4-and-the-windows-mount.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          {
            name: cold-pair-wsl2,
            path: "${{ runner.temp }}/vize-cold-pair/out/",
            if-no-files-found: warn,
          }

  windows:
    needs: build-windows
    if: contains(format(',{0},', inputs.platforms), ',windows,')
    runs-on: blacksmith-32vcpu-windows-2025
    timeout-minutes: 120
    env:
      VIZE_CI_FILES: "${{ github.workspace }}/.github/scripts/workflows/typecheck-cold-pair"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: cold-pair-bin-windows, path: pair-bin }
      - name: Measure
        shell: pwsh
        env:
          PROJECTS: ${{ inputs.projects }}
          RUNS: ${{ inputs.runs }}
          RUNTIME: ${{ inputs.runtime }}
          CHECKERS: ${{ inputs.checkers }}
          ALLOW: ${{ inputs.allow_output_change && '--allow-output-change' || '' }}
        run: . "${{ env.VIZE_CI_FILES }}/measure.ps1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          { name: cold-pair-windows, path: "${{ runner.temp }}/pair-out/", if-no-files-found: warn }
