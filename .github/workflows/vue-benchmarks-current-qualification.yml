# DO NOT EDIT. Generated from tools/config/pkl/workflows/performance/vue-benchmarks-current-qualification.pkl.
# Edit the Pkl source and run `node tools/commands/generate/repository-config.ts`.
name: Vue Benchmarks Current Qualification

# Periodically replay the complete original 5489 lint and typecheck validators
# against the source-built CLI from this exact main commit. This is a
# correctness observation: any remaining plant failure keeps the workflow red
# and every raw stream is retained for attribution.
on:
  workflow_dispatch:
  schedule:
    - cron: "53 6 * * 1"

permissions: { contents: read }

concurrency:
  group: vue-benchmarks-current-qualification-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_SOURCE_SHA: ${{ github.sha }}
  EXECUTED_WORKFLOW_SHA: ${{ github.workflow_sha }}

jobs:
  source-cli:
    uses: ./.github/workflows/full-source-cli.yml

  current-qualification:
    name: current-qualification
    needs: source-cli
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/vue-benchmarks-current-qualification/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - name: Refuse a branch, stale main, or unreviewed workflow source
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/refuse-a-branch-stale-main-or-unreviewed-workflow-source.sh"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify current main and hydrate the fixed read-only upstream input
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/verify-current-main-and-hydrate-the-fixed-read-only-upstream-input.sh"

      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }

      - uses: ./.github/actions/restore-source-cli
        with: { producer: "${{ toJSON(needs.source-cli.outputs) }}" }

      - name: Run process-custody controls
        run: node --test tools/benchmarks/scripts/vue-benchmarks-current-typecheck.test.mjs

      - name: Materialize the frozen minimal reference installation
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/materialize-the-frozen-minimal-reference-installation.sh"

      - name: Observe all eleven original lint pairs
        id: lint
        continue-on-error: true
        env:
          VIZE_SOURCE_CLI_RECEIPT_SHA256: ${{ needs.source-cli.outputs.receipt-sha256 }}
        run: node --test tests/tooling/vue-benchmarks-current-lint.test.ts

      - name: Observe all 154 original typecheck plants
        id: typecheck
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/observe-all-154-original-typecheck-plants.sh"

      - name: Recheck source, gitlink, and provider custody
        if: ${{ always() }}
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/recheck-source-gitlink-and-provider-custody.sh"

      - name: Retain every successful and failed observation
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vue-benchmarks-current-qualification-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/differential/vue-benchmarks-current-lint/
            target/ci/vize.differential-build.json
            ${{ runner.temp }}/vue-benchmarks-current-typecheck/
            ${{ runner.temp }}/vue-benchmarks-current-provider/package.json
            ${{ runner.temp }}/vue-benchmarks-current-provider/package-lock.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Require complete original lint and typecheck qualification
        if: ${{ always() && !cancelled() }}
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
        run: . "${{ env.VIZE_CI_FILES }}/require-complete-original-lint-and-typecheck-qualification.sh"
