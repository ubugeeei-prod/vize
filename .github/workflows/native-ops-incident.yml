name: Native operational incident trace
on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Root-reviewed one diagnostic only; never product qualification.
        type: choice
        required: true
        default: not-authorized
        options: [not-authorized, reviewed-one-replay]
permissions:
  contents: read
concurrency:
  group: builders-exit-a124-once
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  builders-exit-observation:
    if: ${{ inputs.authorization == 'reviewed-one-replay' && github.run_attempt == 1 }}
    name: Unchanged a124 builders with exit observation
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 35
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
      CARGO_BUILD_JOBS: "12"
      VIZE_JS_PACKAGE_GROUP: builders
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - name: Retain the bounded observer outside the source checkout
        run: cp .github/scripts/builders-exit-observer.sh "$RUNNER_TEMP/builders-exit-observer.sh"
      - name: Check out the exact failing synthetic source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 49f799942728504454c4ff4078448a852dbc8e8e
          persist-credentials: false
      - name: Require exact original source
        run: test "$(git rev-parse HEAD)" = 49f799942728504454c4ff4078448a852dbc8e8e
      - uses: ./.github/actions/cache-vp-bootstrap
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          version: latest
          node-version-file: package.json
          cache: true
          cache-save: false
          run-install: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: test-js-packages
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Install unchanged builders dependencies
        run: node tools/support/compat/github/install-js-checks.ts builders
      - name: Require the process-only diagnostic tracer
        run: |
          if ! command -v strace; then
            sudo apt-get update -qq
            sudo apt-get install --yes --no-install-recommends --no-upgrade strace
          fi
      - name: Observe the original command once and preserve its exit status
        env:
          TEST_CASES_JOB: PR JS package tests (builders)
          VIZE_TEST_CASES: ${{ runner.temp }}/test-cases-js-builders.json
        run: bash "$RUNNER_TEMP/builders-exit-observer.sh"
      - name: Preserve bounded exit evidence only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: builders-exit-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/builders-exit-observation/*.json
            ${{ runner.temp }}/builders-exit-observation/*.txt
            ${{ runner.temp }}/builders-exit-observation/*.tsv
            ${{ runner.temp }}/builders-exit-observation/*.log
            ${{ runner.temp }}/test-cases-js-builders.json
            ${{ runner.temp }}/js-native-fault-evidence-*/**/*.json
          if-no-files-found: error
          retention-days: 14
