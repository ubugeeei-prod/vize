name: Public acceptance actor contracts
on:
  pull_request:
    paths:
      - ".github/workflows/release-public-acceptance.yml"
      - ".github/workflows/release-public-acceptance-contracts.yml"
      - "tools/support/release/public_acceptance/**"
      - "tests/tooling/release-public-a11y.test.ts"
      - "tests/tooling/release-public-corsa-provider.test.ts"
      - "tests/tooling/release-public-lsp-lifecycle.test.ts"
      - "tests/tooling/release/release-public-*.test.ts"
      - "tests/_fixtures/release/public-corsa-resolver.json"
      - "tests/_fixtures/release/public-lsp-clean-eof.json"
      - "tests/_fixtures/release/public-lsp-boundary-eof.json"
permissions: { contents: read }
concurrency:
  group: public-acceptance-contracts-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  contracts:
    name: Public acceptance actor contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: package.json, run-install: false }
      - name: Install frozen test tooling
        run: vp install --frozen-lockfile --prefer-offline --filter vize-workspace --ignore-scripts
      - name: Verify installed resolver, source, lifecycle, accessibility and tunnel actors
        run: >-
          node --test tests/tooling/release-public-corsa-provider.test.ts
          tests/tooling/release-public-lsp-lifecycle.test.ts
          tests/tooling/release-public-a11y.test.ts
          tests/tooling/release/release-public-acceptance.test.ts
          tests/tooling/release/release-public-quick-tunnel.test.ts
          tests/tooling/release/release-public-vrt-tunnel-inputs.test.ts
