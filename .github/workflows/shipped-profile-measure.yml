name: Fresco signal dispatch comparison
on:
  workflow_dispatch:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  compare:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.base_sha }}
          path: signal-base
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.head_sha }}
          path: signal-head
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.100.0
      - name: Install existing Callgrind identity
        run: . ".github/scripts/workflows/shipped-profile-measure/install-callgrind.sh"
      - name: Build, verify native behavior, and compare instructions and static storage
        env:
          SIGNAL_PROBE_ROOT: ${{ github.workspace }}
          SIGNAL_PROBE_BASE_SHA: ${{ inputs.base_sha }}
          SIGNAL_PROBE_HEAD_SHA: ${{ inputs.head_sha }}
        run: node tools/benchmarks/probes/fresco-signal-dispatch/driver.ts
      - name: Retain raw dumps, actual ELFs, source, dependency identity and receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fresco-signal-dispatch-${{ inputs.head_sha }}
          if-no-files-found: error
          path: |
            signal-evidence/measurement.json
            signal-evidence/environment.json
            signal-evidence/authored/**
            signal-evidence/*/package/**
            signal-evidence/*/metadata.json
            signal-evidence/*/build.jsonl
            signal-evidence/*/symbols.txt
            signal-evidence/*/sections.txt
            signal-evidence/*/elf-symbols.txt
            signal-evidence/*/default.stdout
            signal-evidence/*/default.stderr
            signal-evidence/*/run-*/**
            signal-evidence/*/fresco_signal_dispatch_probe
run-name: Fresco native signal comparison ${{ inputs.base_sha }} → ${{ inputs.head_sha }}
