name: Shipped release-profile measure

# Dispatch-only measurement of the shipped release profile (fat LTO, one codegen
# unit) for an exact base/head source pair: every level instruction row (stages,
# formatter, SFC parsing) and the shipped `vize` CLI and `vize_vitrine` N-API
# library bytes. A discarded base build primes the fresh runner, then each side
# builds in its own fresh target as base, head, base twin, head twin. The twins
# must exactly reproduce their primary side. The benches build through
# [profile.ci-opt] with Cargo's profile environment
# overrides, so no temporary branch edits Cargo.toml. Never on PRs or the queue.
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit (40 hex characters)
        required: true
        type: string
      head_sha:
        description: Exact head commit (40 hex characters)
        required: true
        type: string
      twins:
        description: Also build and measure an independent A/A twin of each side
        required: false
        default: true
        type: boolean

permissions: { contents: read }
concurrency:
  group: shipped-profile-measure-${{ inputs.base_sha }}-${{ inputs.head_sha }}
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUSTUP_TOOLCHAIN: "1.100.0"
  BASE_SHA: ${{ inputs.base_sha }}
  HEAD_SHA: ${{ inputs.head_sha }}

jobs:
  measure:
    name: Release-profile instructions and sizes
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 360
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/shipped-profile-measure/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { path: driver, persist-credentials: false }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { path: base, ref: "${{ inputs.base_sha }}", persist-credentials: false }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { path: head, ref: "${{ inputs.head_sha }}", persist-credentials: false }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: driver/package.json, run-install: false }
      - name: Validate the source pair
        run: node driver/tools/benchmarks/scripts/release-measure.ts --validate-inputs
      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2
        with: { version: 0.15.1 }
      - uses: ./driver/.github/actions/setup-cargo-zigbuild
      - name: Install pinned Rust
        run: rustup toolchain install 1.100.0 --profile minimal --target x86_64-unknown-linux-gnu
      - name: Install Callgrind
        run: . "${{ env.VIZE_CI_FILES }}/install-callgrind.sh"
      - uses: ./driver/.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - name: Test the report renderer
        run: node --test driver/tools/benchmarks/scripts/release-measure.test.ts
      - name: Warm up, then measure base, head and twins
        env:
          TWINS: ${{ inputs.twins }}
        run: node driver/tools/benchmarks/scripts/release-measure.ts --actions
      - name: Publish the report
        if: always()
        run: node driver/tools/benchmarks/scripts/release-measure.ts --publish "$RUNNER_TEMP/release-measure/out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-measure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release-measure/out/summary.md
            ${{ runner.temp }}/release-measure/out/pair.json
            ${{ runner.temp }}/release-measure/out/*/side.json
            ${{ runner.temp }}/release-measure/out/*/*/measurement/measurement.json
          if-no-files-found: warn
          retention-days: 30
