name: Content Mapper Source Case Jobs

on:
  workflow_call:
    inputs:
      request: { type: string, required: true }

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CONTENT_MAPPER_TYPESCRIPT_SHA: "d6c4afddb2c55f4a9dea7b59293a99a8fdea1799"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reported-q16:
    if: github.event_name == 'workflow_dispatch' && fromJSON(inputs.request).targeted-test == 'reported-q16'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      EXPECTED_SOURCE_SHA: ${{ fromJSON(inputs.request).expected-source-sha }}
      Q16_TARGETED_TEST: ${{ fromJSON(inputs.request).targeted-test }}
      Q16_OTHER_MODES: ${{ fromJSON(inputs.request).router-experimental-only || fromJSON(inputs.request).event-rename-only || fromJSON(inputs.request).official-css-options-only || fromJSON(inputs.request).published-defaults-only }}
      Q16_PUBLIC_CUT: ${{ fromJSON(inputs.request).cut }}
      Q16_PUBLIC_HEAD: ${{ fromJSON(inputs.request).head }}
      Q16_PUBLIC_TAG: ${{ fromJSON(inputs.request).tag }}
      Q16_PUBLIC_SOURCE_PR: ${{ fromJSON(inputs.request).source_pr }}
      Q16_PUBLIC_RELEASE_RUN: ${{ fromJSON(inputs.request).release_run }}
    steps:
      - name: Checkout exact reviewed joint baseline
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - name: Initialize runner-local joint evidence paths
        shell: bash
        env:
          Q16_REQUESTED_CASE_SET: ${{ fromJSON(inputs.request).reported-q16-cases }}
        run: |
          printf 'Q16_OUT=%s/reported-q16\nQ16_PROVIDER=%s/reported-q16-provider\nQ16_CASE_SET=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$Q16_REQUESTED_CASE_SET" >> "$GITHUB_ENV"
      - name: Setup repository build Node and Vite Plus
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: package.json, cache: true, run-install: false }
      - name: Refuse mixed modes and preserve the source-role package adaptation
        run: node tools/support/compat/content-mapper/reported-q16.ts prepare
      - name: Setup source Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: content-mapper-reported-q16
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Install frozen repository build dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Build one current source NAPI companion and CLI with raw evidence
        run: node tools/support/compat/content-mapper/reported-q16.ts build
      - name: Setup reported Node for the published host and oracle role
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: "${{ env.Q16_PROVIDER_NODE }}", package-manager-cache: false }
      - name: Install the exact report host and oracle versions and retain the generated lock
        shell: bash
        run: |
          set -uo pipefail
          node --version > "$Q16_OUT/provider-node-version.txt"
          npm --version > "$Q16_OUT/provider-npm-version.txt"
          npm install --prefix "$Q16_PROVIDER" --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org > "$Q16_OUT/provider-lock.stdout.bin" 2> "$Q16_OUT/provider-lock.stderr.bin"
          lock_status=$?
          printf '%s\n' "$lock_status" > "$Q16_OUT/provider-lock.status.txt"
          test "$lock_status" = 0 || exit "$lock_status"
          cp "$Q16_PROVIDER/package.json" "$Q16_OUT/provider-package.json"
          cp "$Q16_PROVIDER/package-lock.json" "$Q16_OUT/provider-package-lock.json"
          npm ci --prefix "$Q16_PROVIDER" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org > "$Q16_OUT/provider-install.stdout.bin" 2> "$Q16_OUT/provider-install.stderr.bin"
          install_status=$?
          printf '%s\n' "$install_status" > "$Q16_OUT/provider-install.status.txt"
          exit "$install_status"
      - name: Authenticate installed host roles before any report checks
        run: node tools/support/compat/content-mapper/reported-q16.ts provider
      - name: Run all six exact compiled tests and retain every result before the final verdict
        run: node tools/support/compat/content-mapper/reported-q16.ts cases
      - name: Upload all raw Cargo, test, source and provider evidence even on baseline failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reported-q16-source-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reported-q16/
          if-no-files-found: error
          include-hidden-files: true

  router-experimental:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && fromJSON(inputs.request).targeted-test != 'generic-body-error' && fromJSON(inputs.request).targeted-test != 'reported-q16' && fromJSON(inputs.request).router-experimental-only)
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Require the exact requested source
        env:
          EXPECTED_SOURCE_SHA: ${{ fromJSON(inputs.request).expected-source-sha }}
        run: |
          if [ -n "$EXPECTED_SOURCE_SHA" ]; then
            test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          fi
          mkdir -p "$RUNNER_TEMP/router-experimental"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/router-experimental/source-identity.txt"
          git diff --exit-code HEAD
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: router-experimental
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - name: Install frozen dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Install the pinned published mapper host
        run: |
          mkdir -p "$RUNNER_TEMP/router-mapper-host"
          cp tests/fixtures/typechecker/experimental-router-mapper-host/package.json.txt "$RUNNER_TEMP/router-mapper-host/package.json"
          cp tests/fixtures/typechecker/experimental-router-mapper-host/package-lock.json.txt "$RUNNER_TEMP/router-mapper-host/package-lock.json"
          npm ci --prefix "$RUNNER_TEMP/router-mapper-host" --ignore-scripts --no-audit --no-fund --prefer-offline --registry=https://registry.npmjs.org
          sha256sum "$RUNNER_TEMP/router-mapper-host/package-lock.json" "$RUNNER_TEMP/router-mapper-host/node_modules/typescript/package.json" "$RUNNER_TEMP/router-mapper-host/node_modules/@typescript/typescript-linux-x64/lib/tsc" > "$RUNNER_TEMP/router-experimental/host-identity.sha256"
      - name: Build source CLI
        run: |
          cargo build --locked --profile ci -p vize --bin vize
          sha256sum target/ci/vize > "$RUNNER_TEMP/router-experimental/source-cli.sha256"
      - name: Test immutable project context and batch preservation
        id: project-context
        continue-on-error: true
        env:
          CORSA_PATH: ${{ runner.temp }}/router-mapper-host/node_modules/@typescript/typescript-linux-x64/lib/tsc
          VIZE_TEST_REQUIRE_TSGO: "1"
        run: |
          cargo test --locked --profile ci -p vize_canon --lib content_mapper_config::typed_router_tests:: -- --nocapture
          cargo test --locked --profile ci -p vize --lib commands::content_mapper::typed_router_tests:: -- --nocapture
          cargo test --locked --profile ci -p vize_canon --test fix_history_diagnostics content_mapper_experimental_router_context_preserves_published_page_types -- --nocapture
      - name: Profile one admission and repeated source projections in isolation
        id: source-profile
        continue-on-error: true
        env:
          VIZE_TEST_ROUTER_PROFILE_OUTPUT: ${{ runner.temp }}/router-experimental/source-profile.json
        run: >-
          cargo test --locked --profile ci -p vize_canon --lib
          batch::virtual_project::content_mapper::typed_router_profile_tests::typed_router_context_admission_is_outside_repeated_projection_work
          -- --ignored --exact --nocapture
      - name: Require complete published-provider mapper and reference packets
        id: mapper-oracle
        continue-on-error: true
        env:
          VIZE_TEST_BIN: ${{ github.workspace }}/target/ci/vize
          VIZE_TEST_CONTENT_MAPPER_TSGO: ${{ runner.temp }}/router-mapper-host/node_modules/typescript/bin/tsc
          VIZE_TEST_ROUTER_EXPERIMENTAL_REQUIRED: "1"
          VIZE_TEST_ROUTER_OUTPUT: ${{ runner.temp }}/router-experimental/mapper
        run: vp node --test --test-concurrency=1 tests/tooling/router-experimental-mapper-oracle.test.ts
      - name: Upload complete mapper packets and process measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: router-experimental-mapper-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/router-experimental/
          if-no-files-found: error
      - name: Require every independent router qualification result
        if: always()
        env:
          PROJECT_CONTEXT_OUTCOME: ${{ steps.project-context.outcome }}
          SOURCE_PROFILE_OUTCOME: ${{ steps.source-profile.outcome }}
          MAPPER_ORACLE_OUTCOME: ${{ steps.mapper-oracle.outcome }}
        run: |
          test "$PROJECT_CONTEXT_OUTCOME" = success
          test "$SOURCE_PROFILE_OUTCOME" = success
          test "$MAPPER_ORACLE_OUTCOME" = success
