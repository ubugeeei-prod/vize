name: Davinci Incremental

# Phase 5 incrementality suites (davinci-road/plan/test-suites.md):
# - TS-43 key stability runs on two platforms against one committed golden, so
#   a platform-dependent byte in any key recipe fails on at least one lane.
# - TS-42 incremental ≡ clean runs the committed edit scripts through the
#   resident tier over the corpus shard and every committed fixture, and proves
#   it catches a seeded stale-cache defect. Every PR touching the resident tier
#   (crates/vize_resident/**) runs it.

on:
  push:
    branches: [main, davinci]
    paths:
      - "crates/vize_carton/src/hash.rs"
      - "crates/vize_davinci/**"
      - "crates/vize_s1/**"
      - "crates/vize_s2/**"
      - "crates/vize_s1_to_s2/**"
      - "crates/vize_resident/**"
      - "crates/vize_croquis/src/sfc/**"
      - "tools/commands/davinci/incremental-equivalence*"
      - "tools/commands/davinci/incremental-equivalence/**"
      - "Cargo.lock"
      - "davinci-road/plan/key-manifests.md"
      - ".github/workflows/davinci-incremental.yml"
  pull_request:
    branches: [main, davinci]
    paths:
      - "crates/vize_carton/src/hash.rs"
      - "crates/vize_davinci/**"
      - "crates/vize_s1/**"
      - "crates/vize_s2/**"
      - "crates/vize_s1_to_s2/**"
      - "crates/vize_resident/**"
      - "crates/vize_croquis/src/sfc/**"
      - "tools/commands/davinci/incremental-equivalence*"
      - "tools/commands/davinci/incremental-equivalence/**"
      - "Cargo.lock"
      - "davinci-road/plan/key-manifests.md"
      - ".github/workflows/davinci-incremental.yml"
  workflow_dispatch:

concurrency:
  group: davinci-incremental-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  key-stability:
    name: Key stability (TS-43, ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: blacksmith-32vcpu-ubuntu-2404
            target: linux-x64-gnu
          - runner: blacksmith-12vcpu-macos-15
            target: darwin-arm64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        if: runner.os == 'Linux'
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        if: runner.os == 'Linux'
        with:
          key: davinci-incremental
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: runner.os != 'Linux'
        with:
          shared-key: davinci-incremental-${{ matrix.platform.target }}
          cache-workspace-crates: "true"
      - name: Print and compare the TS-43 golden keys
        run: cargo test -p vize_davinci --test artifact_keys --test key_manifests -- --nocapture

  incremental-equivalence:
    name: Incremental ≡ clean (TS-42)
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Hydrate the corpus shard
        run: git submodule update --init --depth 1 -- tests/_fixtures/_git/splitpanes tests/_fixtures/_git/layoutit-grid tests/_fixtures/_git/cssgridgenerator
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: davinci-incremental-equivalence
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      - name: Resident tier tests (firewall accounting, committed plane)
        run: cargo test -p vize_resident
      - name: TS-42 over the corpus shard and the committed fixtures
        run: rust-script tools/commands/davinci/incremental-equivalence.rs --corpus-shard --fixtures tests/_fixtures/_projects --fixtures tests/_fixtures/vue-language-tools
      - name: TS-42 catches the seeded stale-cache defect
        run: |
          cargo test -p vize_resident --features seeded-stale-cache --test equivalence
          rust-script tools/commands/davinci/incremental-equivalence.rs --corpus-shard --fixtures tests/_fixtures/_projects --fixtures tests/_fixtures/vue-language-tools --seeded
