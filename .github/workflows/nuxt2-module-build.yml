name: Nuxt 2 module build
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/nuxt2-module-build.yml
      - npm/framework/nuxt/**
      - npm/framework/nuxt-lint-config/**
      - npm/cli/**
      - npm/native/**
      - crates/vize_carton/src/config/**
      - davinci/vize_l0/src/config/**
      - tools/support/compat/nuxt/fixtures/nuxt2-module-build/**
      - tools/support/compat/nuxt/nuxt2-module-build.mjs
      - tools/support/compat/nuxt/nuxt2-lint-config.mjs
      - tools/support/compat/nuxt/nuxt-auto-init-config.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/nuxt2-module-build.yml
      - npm/framework/nuxt/**
      - npm/framework/nuxt-lint-config/**
      - npm/cli/**
      - npm/native/**
      - crates/vize_carton/src/config/**
      - davinci/vize_l0/src/config/**
      - tools/support/compat/nuxt/fixtures/nuxt2-module-build/**
      - tools/support/compat/nuxt/nuxt2-module-build.mjs
      - tools/support/compat/nuxt/nuxt2-lint-config.mjs
      - tools/support/compat/nuxt/nuxt-auto-init-config.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuxt2-module-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: --openssl-legacy-provider

jobs:
  nuxt2-module-build:
    name: Nuxt 2 webpack build and SSR
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version: "22"
          cache: true
          run-install: false
      - name: Install workspace tooling
        run: vp install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/setup-moonbit
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.99.0"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: nuxt2-config-source-native
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      - name: Build the source configuration normalizer
        run: vp run --no-cache --filter './npm/native' build:debug
      - name: Build the canonical Vize configuration loader
        working-directory: npm/cli
        run: vp pack
      - name: Build the candidate Nuxt lint preset
        working-directory: npm/framework/nuxt-lint-config
        run: vp pack
      - name: Build the candidate Nuxt integration
        working-directory: npm/framework/nuxt
        run: vp pack
      - name: Verify version-specific plans and original modern oracle
        run: vp node --test npm/framework/nuxt-lint-config/src/*.test.ts npm/framework/nuxt/src/lint/generation*.test.ts npm/framework/nuxt/src/builder.test.ts
      - name: Install the Nuxt 2 reproduction
        working-directory: tools/support/compat/nuxt/fixtures/nuxt2-module-build
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Verify candidate webpack build and SSR routes
        run: vp env exec node tools/support/compat/nuxt/nuxt2-module-build.mjs "$RUNNER_TEMP/nuxt2-module-proof"
      - name: Upload Nuxt 2 build and SSR evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuxt2-module-proof-${{ github.sha }}
          path: ${{ runner.temp }}/nuxt2-module-proof
          if-no-files-found: ignore
