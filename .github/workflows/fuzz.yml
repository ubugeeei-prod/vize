name: Fuzz

on:
  workflow_dispatch:
    inputs:
      max-total-time:
        description: "libFuzzer -max_total_time per target (seconds)"
        required: false
        default: "120"
      mode:
        # `campaign` searches for new inputs; `replay` only re-runs the corpus
        # already committed and cached, so it is a regression check with a fixed
        # verdict. Release evidence uses `replay`: a fresh campaign is a
        # randomized search that can fail a tag over an input discovered minutes
        # earlier and unrelated to what is being released.
        description: "campaign (search for new inputs) or replay (re-run the known corpus)"
        required: false
        default: campaign
        type: choice
        options:
          - campaign
          - replay
  schedule:
    # Daily long-run fuzz at 04:23 UTC; reproducers are uploaded as artifacts
    # so a regression triage can grab the failing input without re-running.
    - cron: "23 4 * * *"
  pull_request:
    branches: [main]
    paths:
      - "crates/vize_atelier_sfc/**"
      - "crates/vize_atelier_dom/**"
      - "crates/vize_atelier_core/**"
      - "crates/vize_atelier_ssr/**"
      - "crates/vize_atelier_vapor/**"
      - "crates/vize_armature/**"
      - "crates/vize_carton/**"
      - "crates/vize_davinci/**"
      - "crates/vize_s2/**"
      - "crates/vize_s1_to_s2/**"
      - "crates/vize_s1/**"
      - "tests/fuzz/**"
      - "tools/commands/ci/fuzz/**"
      - "tools/support/**"
      - ".github/workflows/fuzz.yml"

run-name: Fuzz ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'replay' && 'replay' || format('{0}s', inputs.max-total-time)) || github.event_name }} @ ${{ github.sha }}

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    # libFuzzer requires Linux or macOS; this matrix uses GitHub-hosted Ubuntu
    # for consistency. macOS coverage can be added in a
    # follow-up if platform-divergent panics ever appear in triage.
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    # Pull-request fuzzing is advisory to keep the short readiness lane moving.
    # Scheduled and manually dispatched runs are release evidence and must fail
    # after preserving and triaging any reproducer.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            sfc_parse,
            template_lexer,
            js_ts_expression,
            css_parse,
            template_compile,
            s1_lowering,
            folio_parse,
          ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Resolve max-total-time
        id: budget
        shell: bash
        env:
          REQUESTED_MAX_TOTAL_TIME: ${{ inputs.max-total-time }}
          FUZZ_MODE: ${{ inputs.mode || 'campaign' }}
        run: |
          if [[ "$FUZZ_MODE" == "replay" ]]; then
            # `-runs=0` executes every corpus input once and exits, so no budget
            # applies and the verdict depends only on the corpus.
            echo "seconds=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${{ github.event_name }}" in
            schedule)
              # Nightly long fuzz: 30 minutes/target — large enough to drive
              # libFuzzer past coverage plateaus on the seeded corpus.
              seconds=1800
              ;;
            workflow_dispatch)
              seconds="$REQUESTED_MAX_TOTAL_TIME"
              ;;
            *)
              # PR-gating short fuzz: 2 minutes/target — tight enough to keep
              # PR latency reasonable while still exercising every seed.
              seconds=120
              ;;
          esac
          if [[ ! "$seconds" =~ ^[0-9]{1,4}$ ]] || (( 10#$seconds < 1 || 10#$seconds > 3600 )); then
            echo "::error title=Invalid fuzz budget::max-total-time must be an integer from 1 to 3600 seconds"
            exit 1
          fi
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: nightly
          components: rust-src

      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: fuzz-${{ matrix.target }}
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
          target-path: tests/fuzz/target

      - uses: ./.github/actions/setup-rust-script

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version "^0.13"

      # The runner image does not define this repository's Node floor, and
      # seed_corpus.mjs uses `fs.globSync` which is Node 22+. Pin to the repo's
      # `package.json#devEngines.runtime` so the script runs on the same Node
      # line as `vp` / `node-engine-compat`.
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          run-install: false

      - name: Seed fuzz corpus from repository fixtures
        run: rust-script tools/commands/ci/fuzz/seed_corpus.rs

      - name: Restore grown corpus cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: tests/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Run fuzz target ${{ matrix.target }}
        id: fuzz
        continue-on-error: true
        env:
          FUZZ_MAX_TOTAL_TIME: ${{ steps.budget.outputs.seconds }}
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_MODE: ${{ inputs.mode || 'campaign' }}
        # Long corpus runs retain sanitizer allocator high-water memory even
        # when no individual input allocates excessively. Keep the per-call
        # allocation guard strict while giving the instrumented process room
        # to finish the 30-minute scheduled evidence run.
        run: |
          if [[ "$FUZZ_MODE" == "replay" ]]; then
            # Regression check: replay the seeded and cached corpus once each.
            budget="-runs=0"
          else
            budget="-max_total_time=$FUZZ_MAX_TOTAL_TIME"
          fi
          cargo +nightly fuzz run --fuzz-dir tests/fuzz "$FUZZ_TARGET" -- \
            "$budget" \
            -max_len=65536 \
            -timeout=25 \
            -rss_limit_mb=4096 \
            -malloc_limit_mb=2048

      - name: Upload reproducers when libFuzzer crashed
        id: upload-reproducers
        if: always() && hashFiles(format('tests/fuzz/artifacts/{0}/**', matrix.target)) != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-reproducers-${{ matrix.target }}
          path: tests/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

      - name: Create or update fuzz triage fix
        id: triage
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && hashFiles(format('tests/fuzz/artifacts/{0}/**', matrix.target)) != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="fix(fuzz): ${{ matrix.target }} found a reproducer"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          Fuzz target \`${{ matrix.target }}\` found a crash, timeout, or OOM reproducer.

          - Workflow run: ${run_url}
          - Artifact: \`fuzz-reproducers-${{ matrix.target }}\`
          - Commit: \`${{ github.sha }}\`

          Download the artifact from the workflow run and replay it locally with:

          \`\`\`sh
          cd tests/fuzz
          cargo +nightly fuzz run ${{ matrix.target }} artifacts/${{ matrix.target }}/<reproducer>
          \`\`\`
          EOF

          existing_fix="$(
            gh issue list \
              --state open \
              --search "${title} in:title" \
              --json number \
              --jq '.[0].number // ""'
          )"

          if [ -n "$existing_fix" ]; then
            gh issue comment "$existing_fix" --body-file "$body_file"
          else
            gh issue create --title "$title" --body-file "$body_file"
          fi

      - name: Enforce fuzz result for release evidence
        id: enforce
        if: always()
        env:
          FUZZ_EVENT_NAME: ${{ github.event_name }}
          FUZZ_OUTCOME: ${{ steps.fuzz.outcome || 'skipped' }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: rust-script tools/commands/ci/fuzz/enforce-result.rs "$FUZZ_EVENT_NAME" "$FUZZ_TARGET" "$FUZZ_OUTCOME"
