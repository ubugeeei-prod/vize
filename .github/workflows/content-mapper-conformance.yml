# DO NOT EDIT. Generated from tools/config/pkl/workflows/typecheck/content-mapper-conformance.pkl.
# Edit the Pkl source and run `node tools/commands/generate/repository-config.ts`.
name: Content Mapper Conformance

on:
  schedule:
    - cron: "21 4 * * *"
  workflow_dispatch:
    inputs:
      targeted-test:
        description: "Run the full suite or the original 16-state/four-host generic body-error cohort"
        type: choice
        options: [full, generic-body-error]
        default: full
      expected-source-sha:
        description: "Exact reviewed source for the targeted mode"
        type: string
        required: false

concurrency:
  group: content-mapper-${{ github.ref }}${{ inputs.targeted-test == 'generic-body-error' && '-generic-body-error' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CONTENT_MAPPER_TYPESCRIPT_SHA: "d6c4afddb2c55f4a9dea7b59293a99a8fdea1799"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  exact-tsgo-project:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 35
    env:
      VIZE_CI_FILES: "${{ github.workspace }}/.github/scripts/workflows/content-mapper-conformance"
    steps:
      - name: Checkout Vize
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Verify targeted source
        if: inputs.targeted-test == 'generic-body-error'
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected-source-sha }}
        run: . "${{ env.VIZE_CI_FILES }}/verify-targeted-source.sh"
      - name: Checkout exact TypeScript Content Mapper revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: microsoft/TypeScript
          ref: ${{ env.CONTENT_MAPPER_TYPESCRIPT_SHA }}
          path: typescript-content-mapper
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: typescript-content-mapper/tsc/go.mod
          cache-dependency-path: typescript-content-mapper/tsc/go.sum
      - name: Verify upstream content mapper protocol regressions
        working-directory: typescript-content-mapper/tsc
        run: . "${{ env.VIZE_CI_FILES }}/verify-upstream-content-mapper-protocol-regressions.sh"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: content-mapper-conformance
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - name: Install JavaScript dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Build exact upstream tsgo
        working-directory: typescript-content-mapper/tsc
        run: . "${{ env.VIZE_CI_FILES }}/build-exact-upstream-tsgo.sh"
      - name: Retain exact native host identity before conformance
        run: . "${{ env.VIZE_CI_FILES }}/retain-exact-native-host-identity-before-conformance.sh"
      - name: Run original generic body-error cohort
        if: inputs.targeted-test == 'generic-body-error'
        env:
          VIZE_TEST_CONTENT_MAPPER_TSGO: ${{ runner.temp }}/tsgo
        run: |
          cargo test --locked -p vize --test integration -- content_mapper_tsgo_cli::quoted_generic_parameters::body_error::independent_authored_body_errors_survive_generic_repairs --exact --nocapture
      - name: Run authored syntax and setup binding conformance
        if: inputs.targeted-test != 'generic-body-error'
        env:
          VIZE_TEST_CONTENT_MAPPER_TSGO: ${{ runner.temp }}/tsgo
        run: . "${{ env.VIZE_CI_FILES }}/run-authored-syntax-and-setup-binding-conformance.sh"
      - name: Run TS-40 current-projection baselines
        if: inputs.targeted-test != 'generic-body-error'
        run: . "${{ env.VIZE_CI_FILES }}/run-ts-40-current-projection-baselines.sh"
      - name: Build packed Content Mapper runtime
        if: inputs.targeted-test != 'generic-body-error'
        run: . "${{ env.VIZE_CI_FILES }}/build-packed-content-mapper-runtime.sh"
      - name: Prepare native platform packages
        if: inputs.targeted-test != 'generic-body-error'
        run: node tools/support/github/stage-built-native-packages.ts npm/native
      - name: Run standard tsgo through fresh-installed package tarballs
        if: inputs.targeted-test != 'generic-body-error'
        env:
          VIZE_TEST_CONTENT_MAPPER_TSGO: ${{ runner.temp }}/tsgo
        run: . "${{ env.VIZE_CI_FILES }}/run-standard-tsgo-through-fresh-installed-package-tarballs.sh"
      - name: Run standard project and declaration conformance
        if: inputs.targeted-test != 'generic-body-error'
        env:
          VIZE_TEST_CONTENT_MAPPER_TSGO: ${{ runner.temp }}/tsgo
          VIZE_TEST_CONTENT_MAPPER_JAVASCRIPT_TSC: ${{ github.workspace }}/npm/cli/node_modules/.bin/tsc
          VIZE_TEST_CONTENT_MAPPER_VUE: ${{ github.workspace }}/npm/cli/node_modules/vue
        run: . "${{ env.VIZE_CI_FILES }}/run-standard-project-and-declaration-conformance.sh"
      - name: Run importer-scoped package resolution matrix
        if: inputs.targeted-test != 'generic-body-error'
        env:
          CORSA_PATH: ${{ runner.temp }}/tsgo
          VIZE_TEST_REQUIRE_TSGO: "1"
        run: . "${{ env.VIZE_CI_FILES }}/run-importer-scoped-package-resolution-matrix.sh"
      - name: Run Content Mapper LSP and virtual-overlay editor checks
        if: inputs.targeted-test != 'generic-body-error'
        env:
          TSGO_PATH: ${{ runner.temp }}/tsgo
          VIZE_TEST_CONTENT_MAPPER_TSGO: ${{ runner.temp }}/tsgo
        run: . "${{ env.VIZE_CI_FILES }}/run-content-mapper-lsp-and-virtual-overlay-editor-checks.sh"
      - name: Stress every editor case against its exact native provider
        if: inputs.targeted-test != 'generic-body-error'
        run: . "${{ env.VIZE_CI_FILES }}/stress-every-editor-case-against-its-exact-native-provider.sh"
      - uses: ./.github/actions/qualify-content-mapper-provider-closure
      - name: Preserve whole owner calibration observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: content-mapper-owner-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/vize-tests/content-mapper-directive-owners
            target/vize-tests/content-mapper-quoted-generic-parameters
            ${{ runner.temp }}/content-mapper-native-host.json
            ${{ runner.temp }}/content-mapper-editor-stress
          if-no-files-found: error
          retention-days: 7
  nuxt-generated-membership:
    name: Nuxt generated declaration membership
    if: ${{ github.event_name == 'schedule' || inputs.targeted-test == 'full' }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      VIZE_CI_FILES: ${{ github.workspace }}/.github/scripts/workflows/content-mapper-conformance
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "12"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.100.0
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with:
          wild-version: 0.9.0
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: nuxt-generated-membership
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install pinned stock and native providers
        run: vp install --frozen-lockfile --prefer-offline
      - name: Run the native and stock Nuxt membership controls
        env:
          VIZE_TEST_REQUIRE_TSGO: "1"
          VIZE_TEST_STOCK_VUE_TSC: ${{ github.workspace }}/tests/node_modules/vue-tsc/bin/vue-tsc.js
          VIZE_NUXT_MEMBERSHIP_ARTIFACTS: ${{ runner.temp }}/nuxt-membership-packets
        run: cargo test --locked --profile ci -p vize --test integration check_cli::check_nuxt_generated_computed_map_values_preserve_record_types -- --exact --nocapture
      - name: Require every executed native and stock control
        env:
          PACKETS: ${{ runner.temp }}/nuxt-membership-packets
        run: . "${{ env.VIZE_CI_FILES }}/nuxt-membership-require-every-executed-native-stock-and-graph-control.sh"
