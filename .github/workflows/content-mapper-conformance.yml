name: Content Mapper Conformance

on:
  schedule:
    - cron: "21 4 * * *"
  workflow_dispatch:
    inputs:
      event-rename-only:
        description: "Qualify both Vize-owned event rename targets with exact upstream tsgo"
        type: boolean
        default: false

concurrency:
  group: content-mapper-${{ github.event.pull_request.number || github.ref }}${{ inputs.event-rename-only && '-event-rename' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CONTENT_MAPPER_TYPESCRIPT_SHA: "d6c4afddb2c55f4a9dea7b59293a99a8fdea1799"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  exact-tsgo-project:
    if: ${{ !inputs.event-rename-only }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout Vize
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Checkout exact TypeScript Content Mapper revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: microsoft/TypeScript
          ref: ${{ env.CONTENT_MAPPER_TYPESCRIPT_SHA }}
          path: typescript-content-mapper
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: typescript-content-mapper/tsc/go.mod
          cache-dependency-path: typescript-content-mapper/tsc/go.sum
      - name: Verify upstream content mapper protocol regressions
        working-directory: typescript-content-mapper/tsc
        run: |
          go test ./internal/contentmapper -run '^(TestRunnerTransform|TestRunnerTransformResponseValidation)$' -count=1
          go test ./internal/spanmap -run '^(TestOriginalToVirtualOverlappingSpans|TestValidateOriginalOverlapAndFeatures)$' -count=1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: content-mapper-conformance
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - name: Install JavaScript dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Run TS-40 current-projection baselines
        run: |
          cargo test -p vize --test davinci_ts40_projection_cli -- --nocapture
          cargo test -p vize_maestro --test davinci_ts40_projection -- --nocapture
          cargo test -p vize_maestro --features legacy --test davinci_ts40_projection -- --nocapture
          node --test tests/tooling/davinci-ts40-projection.test.ts
      - name: Build exact upstream tsgo
        working-directory: typescript-content-mapper/tsc
        run: |
          go build -tags=noembed -trimpath -o "$RUNNER_TEMP/tsgo" ./cmd/tsc
          cp internal/bundled/libs/*.d.ts "$RUNNER_TEMP/"
      - name: Build packed Content Mapper runtime
        run: |
          vp run --filter './npm/native' build:ci
          (cd npm/cli && vp pack)
      - name: Prepare native platform packages
        working-directory: npm/native
        run: |
          vp exec napi create-npm-dirs
          vp exec napi pre-publish -t npm --no-gh-release --skip-optional-publish
          for binary in vize-vitrine.*.node; do
            [ -f "$binary" ] || continue
            target="${binary#vize-vitrine.}"
            target="${target%.node}"
            if [ -d "npm/$target" ]; then
              cp "$binary" "npm/$target/"
            fi
          done
      - name: Run standard tsgo through fresh-installed package tarballs
        env:
          VIZE_TEST_CONTENT_MAPPER_TSGO: ${{ runner.temp }}/tsgo
        run: |
          rust-script tools/commands/release/npm/smoke-release-install.rs --prepare-manifests --content-mapper-checks \
            npm/native npm/native/npm/* \
            npm/cli
      - name: Run standard project and declaration conformance
        env:
          VIZE_TEST_CONTENT_MAPPER_TSGO: ${{ runner.temp }}/tsgo
          VIZE_TEST_CONTENT_MAPPER_JAVASCRIPT_TSC: ${{ github.workspace }}/npm/cli/node_modules/.bin/tsc
          VIZE_TEST_CONTENT_MAPPER_VUE: ${{ github.workspace }}/npm/cli/node_modules/vue
        run: |
          cargo test -p vize --test content_mapper_tsgo_cli -- --nocapture
          cargo test -p vize --test content_mapper_tsgo_directives -- --nocapture
          cargo test -p vize --test content_mapper_tsgo_build -- --nocapture
          cargo test -p vize --test content_mapper_tsgo_incremental -- --nocapture
          cargo test -p vize --test content_mapper_tsgo_package_references -- --nocapture
          cargo test -p vize --test content_mapper_tsgo_watch -- --nocapture
          cargo test -p vize --test content_mapper_importer_scoped_packages -- --nocapture
      - name: Run importer-scoped package resolution matrix
        env:
          CORSA_PATH: ${{ runner.temp }}/tsgo
          VIZE_TEST_REQUIRE_TSGO: "1"
        run: |
          cargo test -p vize --test check_importer_scoped_package_cli -- --nocapture
          cargo test -p vize --test check_package_declaration_barrel_cli -- --nocapture
          cargo test -p vize --test check_package_paths_authority_cli -- --nocapture
          cargo test -p vize --test check_package_resolution_modes_cli -- --nocapture
          cargo test -p vize --test check_package_scope_mode_cli -- --nocapture
          cargo test -p vize --test check_package_tsx_shadow_cli -- --nocapture
      - name: Run Content Mapper LSP and virtual-overlay editor checks
        env:
          TSGO_PATH: ${{ runner.temp }}/tsgo
          VIZE_TEST_CONTENT_MAPPER_TSGO: ${{ runner.temp }}/tsgo
        run: |
          cargo test -p vize --test content_mapper_tsgo_lsp -- --nocapture
          cargo test -p vize --test content_mapper_lsp_shutdown -- --nocapture
          cargo test -p vize --test content_mapper_tsgo_declaration_lsp -- --nocapture
          cargo test -p vize --test content_mapper_tsgo_lsp_event_forms -- --nocapture
          cargo test -p vize_canon --test lsp_import_resolution -- --nocapture
      - name: Stress exact editor lifecycle
        env:
          TSGO_PATH: ${{ runner.temp }}/tsgo
          VIZE_TEST_CONTENT_MAPPER_TSGO: ${{ runner.temp }}/tsgo
        run: |
          for iteration in $(seq 1 20); do
            cargo test -p vize_maestro -- --quiet
            echo "Content Mapper Maestro lifecycle cycle $iteration/20 passed"
          done

  event-rename:
    if: github.event_name == 'workflow_dispatch' && inputs.event-rename-only
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout Vize
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Checkout exact TypeScript Content Mapper revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: microsoft/TypeScript
          ref: ${{ env.CONTENT_MAPPER_TYPESCRIPT_SHA }}
          path: typescript-content-mapper
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: typescript-content-mapper/tsc/go.mod
          cache-dependency-path: typescript-content-mapper/tsc/go.sum
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: content-mapper-conformance
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - name: Install frozen dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Build exact upstream tsgo
        working-directory: typescript-content-mapper/tsc
        run: |
          go build -tags=noembed -trimpath -o "$RUNNER_TEMP/tsgo" ./cmd/tsc
          cp internal/bundled/libs/*.d.ts "$RUNNER_TEMP/"
      - name: Preserve source and provider identity before queries
        run: |
          mkdir -p "$RUNNER_TEMP/event-rename"
          rustc -Vv > "$RUNNER_TEMP/event-rename/rustc.txt"
          go version > "$RUNNER_TEMP/event-rename/go.txt"
          node --version > "$RUNNER_TEMP/event-rename/node.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/event-rename/source-sha.txt"
          git -C typescript-content-mapper rev-parse HEAD > "$RUNNER_TEMP/event-rename/provider-source-sha.txt"
          test "$(cat "$RUNNER_TEMP/event-rename/provider-source-sha.txt")" = "$CONTENT_MAPPER_TYPESCRIPT_SHA"
          git diff --binary HEAD > "$RUNNER_TEMP/event-rename/source.patch"
          test ! -s "$RUNNER_TEMP/event-rename/source.patch"
          sha256sum "$RUNNER_TEMP/tsgo" "$RUNNER_TEMP/"*.d.ts > "$RUNNER_TEMP/event-rename/provider.sha256"
          sha256sum tests/_fixtures/differential/lsp/event-rename/4075/{bound-emitter,named-model}/cases.json.txt > "$RUNNER_TEMP/event-rename/oracles.sha256"
          sha256sum pnpm-lock.yaml > "$RUNNER_TEMP/event-rename/dependency-lock.sha256"
          cp npm/cli/node_modules/vue/package.json "$RUNNER_TEMP/event-rename/vue-package.json"
          sha256sum npm/cli/node_modules/vue/package.json > "$RUNNER_TEMP/event-rename/vue-package.sha256"
      - name: Run both whole event rename transaction targets
        id: transactions
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ github.sha }}
          VIZE_TEST_REQUIRE_TSGO: "1"
          VIZE_TEST_CONTENT_MAPPER_TSGO: ${{ runner.temp }}/tsgo
          VIZE_TEST_CONTENT_MAPPER_VUE: ${{ github.workspace }}/npm/cli/node_modules/vue
          VIZE_TEST_FIX_HISTORY_CAPTURE_DIR: ${{ runner.temp }}/event-rename/packets
          VIZE_INLAY_HINT_CAPTURE: ${{ runner.temp }}/event-rename/processes
        run: |
          cargo test --locked --profile ci --no-fail-fast -p vize \
            --test lsp_bound_event_casing_cli \
            --test lsp_named_model_transactions_cli -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/event-rename/tests.log"
      - name: Preserve actual CLI identity and complete artifact inventory
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/event-rename"
          if [ -f target/ci/vize ]; then
            sha256sum target/ci/vize > "$RUNNER_TEMP/event-rename/cli.sha256"
          fi
          find "$RUNNER_TEMP/event-rename" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/event-rename-inventory.sha256"
      - name: Upload complete event rename observations before result gate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: content-mapper-event-rename-${{ github.sha }}
          path: |
            ${{ runner.temp }}/event-rename/
            ${{ runner.temp }}/event-rename-inventory.sha256
          if-no-files-found: error
      - name: Require both whole transaction targets
        if: always()
        env:
          TRANSACTIONS_OUTCOME: ${{ steps.transactions.outcome }}
        run: test "$TRANSACTIONS_OUTCOME" = success
