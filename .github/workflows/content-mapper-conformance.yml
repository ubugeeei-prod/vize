name: Content Mapper Conformance

on:
  schedule:
    - cron: "21 4 * * *"
  workflow_dispatch:
    inputs:
      event-rename-only:
        description: "Qualify both Vize-owned event rename targets with exact upstream tsgo"
        type: boolean
        default: false
      official-css-options-only:
        description: "Qualify Escaton's CSS, component and flow cases with the official published TypeScript 7.1 host"
        type: boolean
        default: false
      expected-source-sha:
        description: "Exact reviewed actor F for either official mode"
        type: string
        required: false
      published-defaults-only:
        { description: "Only published reporter fixtures", type: boolean, default: false }
      published-report:
        { description: "Report", type: choice, options: ["9499", "9498"], default: "9499" }
      cut: { description: "Published source cut C", type: string, required: false }
      head: { description: "Published source H", type: string, required: false }
      tag: { description: "Published stable minor tag", type: string, required: false }
      source_pr: { description: "Published frozen source PR", type: string, required: false }
      release_run: { description: "Successful official Release R", type: string, required: false }

concurrency:
  group: content-mapper-${{ inputs.published-defaults-only && github.run_id || github.event.pull_request.number || github.ref }}${{ inputs.published-defaults-only && '-published-defaults' || inputs.official-css-options-only && '-official-css-options' || inputs.event-rename-only && '-event-rename' || '' }}
  cancel-in-progress: ${{ !inputs.published-defaults-only }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CONTENT_MAPPER_TYPESCRIPT_SHA: "d6c4afddb2c55f4a9dea7b59293a99a8fdea1799"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  exact-tsgo-project:
    if: ${{ !inputs.event-rename-only && !inputs.official-css-options-only && !inputs.published-defaults-only }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout Vize
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Checkout exact TypeScript Content Mapper revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: microsoft/TypeScript
          ref: ${{ env.CONTENT_MAPPER_TYPESCRIPT_SHA }}
          path: typescript-content-mapper
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: typescript-content-mapper/tsc/go.mod
          cache-dependency-path: typescript-content-mapper/tsc/go.sum
      - name: Verify upstream content mapper protocol regressions
        working-directory: typescript-content-mapper/tsc
        run: |
          go test ./internal/contentmapper -run '^(TestRunnerTransform|TestRunnerTransformResponseValidation)$' -count=1
          go test ./internal/spanmap -run '^(TestOriginalToVirtualOverlappingSpans|TestValidateOriginalOverlapAndFeatures)$' -count=1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: content-mapper-conformance
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - name: Install JavaScript dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Build exact upstream tsgo
        working-directory: typescript-content-mapper/tsc
        run: |
          go build -tags=noembed -trimpath -o "$RUNNER_TEMP/tsgo" ./cmd/tsc
          cp internal/bundled/libs/*.d.ts "$RUNNER_TEMP/"
      - name: Retain exact native host identity before conformance
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync, spawnSync } from 'node:child_process';
          const binary = `${process.env.RUNNER_TEMP}/tsgo`;
          const upstream = execFileSync('git', ['-C', 'typescript-content-mapper', 'rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          assert.equal(upstream, process.env.CONTENT_MAPPER_TYPESCRIPT_SHA);
          const bytes = readFileSync(binary);
          const version = spawnSync(binary, ['--version']);
          assert.equal(version.status, 0);
          assert.equal(version.signal, null);
          assert.equal(version.stderr.length, 0);
          const receipt = { source: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID, upstream, binary, sha256: createHash('sha256').update(bytes).digest('hex'), size: bytes.length, version: {status: version.status, stdout: version.stdout.toString('base64'), stderr: version.stderr.toString('base64')} };
          writeFileSync(`${process.env.RUNNER_TEMP}/content-mapper-native-host.json`, JSON.stringify(receipt, null, 2) + '\n');
          JS
      - name: Run authored syntax and setup binding conformance
        env:
          VIZE_TEST_CONTENT_MAPPER_TSGO: ${{ runner.temp }}/tsgo
        run: |
          cargo test -p vize --test integration -- content_mapper_tsgo_cli::template_expression_syntax:: --nocapture
          cargo test -p vize --test integration -- content_mapper_tsgo_cli::const_enum_import:: --nocapture
          cargo test -p vize --test integration -- content_mapper_tsgo_cli::type_only_import_use:: --nocapture
          cargo test -p vize --test integration -- content_mapper_tsgo_cli::standard_tsgo_reports_each_component_prop_problem_once --nocapture
          cargo test -p vize --test integration -- content_mapper_tsgo_cli::standard_tsgo_contextually_types_multiline_callback_prop --nocapture
          cargo test -p vize --test integration -- content_mapper_tsgo_cli::unknown_options_10218:: --nocapture
          cargo test -p vize --test integration -- content_mapper_tsgo_cli::generic_constructor_slots:: --nocapture
          cargo test -p vize --test integration -- content_mapper_tsgo_cli::long_prop_kebab_case:: --nocapture
          cargo test -p vize --test integration -- content_mapper_tsgo_cli::pug_refusal:: --nocapture
      - name: Run TS-40 current-projection baselines
        run: |
          cargo test -p vize --test integration -- davinci_ts40_projection_cli:: --nocapture
          cargo test -p vize_maestro --test davinci_ts40_projection -- --nocapture
          cargo test -p vize_maestro --features legacy --test davinci_ts40_projection -- --nocapture
          node --test tests/tooling/davinci-ts40-projection.test.ts
      - name: Build packed Content Mapper runtime
        run: |
          vp run --filter './npm/native' build:ci
          (cd npm/cli && vp pack)
      - name: Prepare native platform packages
        working-directory: npm/native
        run: |
          vp exec napi create-npm-dirs
          vp exec napi pre-publish -t npm --no-gh-release --skip-optional-publish
          for binary in vize-vitrine.*.node; do
            [ -f "$binary" ] || continue
            target="${binary#vize-vitrine.}"
            target="${target%.node}"
            if [ -d "npm/$target" ]; then
              cp "$binary" "npm/$target/"
            fi
          done
      - name: Run standard tsgo through fresh-installed package tarballs
        env:
          VIZE_TEST_CONTENT_MAPPER_TSGO: ${{ runner.temp }}/tsgo
        run: |
          rust-script tools/commands/release/npm/smoke-release-install.rs --prepare-manifests --content-mapper-checks \
            npm/native npm/native/npm/* \
            npm/cli
      - name: Run standard project and declaration conformance
        env:
          VIZE_TEST_CONTENT_MAPPER_TSGO: ${{ runner.temp }}/tsgo
          VIZE_TEST_CONTENT_MAPPER_JAVASCRIPT_TSC: ${{ github.workspace }}/npm/cli/node_modules/.bin/tsc
          VIZE_TEST_CONTENT_MAPPER_VUE: ${{ github.workspace }}/npm/cli/node_modules/vue
        run: |
          cargo test -p vize --test integration -- content_mapper_tsgo_cli:: --nocapture
          cargo test -p vize --test integration -- content_mapper_tsgo_directives:: --nocapture
          cargo test -p vize --test integration -- content_mapper_tsgo_build:: --nocapture
          cargo test -p vize --test integration -- content_mapper_tsgo_incremental:: --nocapture
          cargo test -p vize --test integration -- content_mapper_tsgo_package_references:: --nocapture
          cargo test -p vize --test integration -- content_mapper_tsgo_watch:: --nocapture
          cargo test -p vize --test integration -- content_mapper_importer_scoped_packages:: --nocapture
      - name: Run importer-scoped package resolution matrix
        env:
          CORSA_PATH: ${{ runner.temp }}/tsgo
          VIZE_TEST_REQUIRE_TSGO: "1"
        run: |
          cargo test -p vize --test integration -- check_importer_scoped_package_cli:: --nocapture
          cargo test -p vize --test integration -- check_package_declaration_barrel_cli:: --nocapture
          cargo test -p vize --test integration -- check_package_paths_authority_cli:: --nocapture
          cargo test -p vize --test integration -- check_package_resolution_modes_cli:: --nocapture
          cargo test -p vize --test integration -- check_package_scope_mode_cli:: --nocapture
          cargo test -p vize --test integration -- check_package_tsx_shadow_cli:: --nocapture
      - name: Run Content Mapper LSP and virtual-overlay editor checks
        env:
          TSGO_PATH: ${{ runner.temp }}/tsgo
          VIZE_TEST_CONTENT_MAPPER_TSGO: ${{ runner.temp }}/tsgo
        run: |
          cargo test -p vize --test integration -- content_mapper_tsgo_lsp:: --nocapture
          cargo test -p vize --test integration -- content_mapper_lsp_shutdown:: --nocapture
          cargo test -p vize --test integration -- content_mapper_tsgo_declaration_lsp:: --nocapture
          cargo test -p vize --test integration -- content_mapper_tsgo_lsp_event_forms:: --nocapture
          cargo test -p vize_canon --test lsp_import_resolution -- --nocapture
      - name: Stress every editor case against its exact native provider
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { mkdirSync, readFileSync, realpathSync, writeFileSync } from 'node:fs';
          import { createRequire } from 'node:module';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';

          const root = process.cwd();
          const capture = path.join(process.env.RUNNER_TEMP, 'content-mapper-editor-stress');
          mkdirSync(capture, { recursive: true });
          const digest = bytes => createHash('sha256').update(bytes).digest('hex');
          const fileHash = file => digest(readFileSync(file));
          const write = (name, value) => writeFileSync(path.join(capture, name), JSON.stringify(value, null, 2) + '\n');
          const legacy = 'ide::diagnostics::editor_typecheck_unknown_options_tests::original_unknown_options_preserve_complete_editor_vectors';
          const receipt = { source: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID, status: 'RUNNING', initializationEvidence: 'Fixture, source and startup configuration custody; not a raw RPC witness', providers: {}, inventory: [], cycles: [] };
          const aliases = ['CORSA_PATH', 'CORSA_EXECUTABLE', 'TSGO_PATH', 'TSGO_EXECUTABLE', 'TSRS_PATH', 'TSRS_EXECUTABLE', 'VIZE_TEST_TSGO_PATH', 'VIZE_TEST_DISABLE_TSGO', 'VIZE_UNKNOWN_TEMPLATE_CAPTURE'];
          function environment(binary, fixtureCapture) {
            const env = { ...process.env, SOURCE_SHA: process.env.GITHUB_SHA };
            for (const key of aliases) delete env[key];
            if (binary) Object.assign(env, { CORSA_PATH: binary, TSGO_PATH: binary, VIZE_TEST_TSGO_PATH: binary, VIZE_TEST_REQUIRE_TSGO: '1' });
            if (fixtureCapture) env.VIZE_UNKNOWN_TEMPLATE_CAPTURE = fixtureCapture;
            return env;
          }
          let sequence = 0;
          function run(label, command, args, binary, fixtureCapture) {
            const directory = `${String(sequence++).padStart(3, '0')}-${label}`;
            const destination = path.join(capture, directory);
            mkdirSync(destination);
            const env = environment(binary, fixtureCapture);
            const result = spawnSync(command, args, { cwd: root, env, maxBuffer: 64 * 1024 * 1024, timeout: 180000 });
            const stdout = result.stdout ?? Buffer.alloc(0), stderr = result.stderr ?? Buffer.alloc(0);
            writeFileSync(path.join(destination, 'stdout.bin'), stdout);
            writeFileSync(path.join(destination, 'stderr.bin'), stderr);
            writeFileSync(path.join(destination, 'process.json'), JSON.stringify({ command, arguments: args, cwd: root, provider: binary ?? null, providerSha256: binary ? fileHash(binary) : null, startupEnvironment: Object.fromEntries([...aliases, 'SOURCE_SHA', 'VIZE_TEST_REQUIRE_TSGO'].map(key => [key, env[key] ?? null])), status: result.status, signal: result.signal, error: result.error?.message ?? null, stdoutSha256: digest(stdout), stderrSha256: digest(stderr) }, null, 2) + '\n');
            assert.equal(result.error, undefined, `${label}: process error; retained under ${directory}`);
            assert.equal(result.signal, null, `${label}: process signal`);
            assert.equal(result.status, 0, `${label}: full output retained under ${directory}`);
            if (label === 'original-version') assert.equal(stderr.length, 0);
            return stdout.toString('utf8');
          }
          function names(text) {
            const result = [];
            for (const line of text.split('\n').filter(Boolean)) {
              const match = /^(.*): test$/u.exec(line);
              assert.ok(match, `unexpected complete terse inventory row: ${line}`);
              result.push(match[1]);
            }
            // Terse inventories contain case rows only. Each full execution below
            // independently proves the exact same names and its complete summary count.
            assert.equal(new Set(result).size, result.length, 'inventory names must be unique per target');
            return result.sort();
          }
          function executions(text, inventory, ignored, selected) {
            const events = [...text.matchAll(/^test (.+) \.\.\. (ok|FAILED|ignored(?:,.*)?)$/gmu)].map(match => ({ name: match[1], state: match[2].startsWith('ignored') ? 'ignored' : match[2] }));
            assert.deepEqual(events.map(event => event.name).sort(), [...selected].sort(), 'all selected cases must produce exactly one complete result');
            assert.deepEqual(events.filter(event => event.state === 'ignored').map(event => event.name).sort(), ignored.filter(name => selected.includes(name)), 'declared ignored-case policy must remain unchanged');
            assert.equal(events.some(event => event.state === 'FAILED'), false);
            const summaries = [...text.matchAll(/^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out;/gmu)];
            assert.equal(summaries.length, 1, 'each target must finish with one complete summary');
            const actual = summaries[0].slice(1).map(Number);
            const ignoredCount = ignored.filter(name => selected.includes(name)).length;
            assert.deepEqual(actual, [selected.length - ignoredCount, 0, ignoredCount, 0, inventory.length - selected.length], 'complete inventory and summary counts must agree');
            return events;
          }
          function reject(label, operation) {
            let rejected = false;
            try { operation(); } catch { rejected = true; }
            assert.equal(rejected, true, `${label}: evidence must fail closed`);
          }
          // Negative controls guard against empty, omitted, duplicate and widened evidence.
          const sample = 'test a ... ok\ntest b ... ignored\ntest result: ok. 1 passed; 0 failed; 1 ignored; 0 measured; 0 filtered out;\n';
          names('a: test\nb: test\n');
          reject('empty inventory', () => executions(sample, names(''), [], []));
          reject('omitted inventory row', () => { const partial = names('b: test\n'); executions(sample, partial, ['b'], partial); });
          reject('duplicate inventory row', () => names('a: test\na: test\n'));
          executions(sample, ['a', 'b'], ['b'], ['a', 'b']);
          reject('missing case', () => executions(sample.replace('test a ... ok\n', ''), ['a', 'b'], ['b'], ['a', 'b']));
          reject('duplicate case', () => executions('test a ... ok\n' + sample, ['a', 'b'], ['b'], ['a', 'b']));
          reject('changed ignore policy', () => executions(sample, ['a', 'b'], [], ['a', 'b']));
          reject('changed total', () => executions(sample.replace('1 passed', '2 passed'), ['a', 'b'], ['b'], ['a', 'b']));
          reject('undeclared filtering', () => executions(sample.replace('0 filtered out', '1 filtered out'), ['a', 'b'], ['b'], ['a', 'b']));
          const docs = names('doc_a: test\ndoc_b: test\n');
          const docSample = 'test doc_a ... ok\ntest doc_b ... ok\ntest result: ok. 2 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;\n';
          executions(docSample, docs, [], docs);
          reject('empty Rustdoc inventory', () => executions(docSample, names(''), [], []));
          reject('omitted Rustdoc row', () => { const partial = names('doc_a: test\n'); executions(docSample, partial, [], partial); });
          write('negative-controls.json', { emptyInventory: 'rejected', omittedInventory: 'rejected', duplicateInventory: 'rejected', missing: 'rejected', duplicate: 'rejected', changedIgnore: 'rejected', changedTotal: 'rejected', undeclaredFiltering: 'rejected', emptyRustdoc: 'rejected', omittedRustdoc: 'rejected' });

          try {
            const mapper = realpathSync(path.join(process.env.RUNNER_TEMP, 'tsgo'));
            const mapperReceipt = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, 'content-mapper-native-host.json')));
            assert.equal(fileHash(mapper), mapperReceipt.sha256);
            assert.equal(mapperReceipt.upstream, process.env.CONTENT_MAPPER_TYPESCRIPT_SHA);
            receipt.providers.mapper = mapperReceipt;
            const require = createRequire(path.join(root, 'npm/cli/package.json'));
            const manifestPath = require.resolve('@typescript/typescript-linux-x64/package.json');
            const manifest = JSON.parse(readFileSync(manifestPath));
            assert.equal(manifest.name, '@typescript/typescript-linux-x64');
            assert.equal(manifest.version, '7.0.2');
            const original = realpathSync(path.join(path.dirname(manifestPath), 'lib/tsc'));
            assert.equal(readFileSync(original).subarray(0, 4).toString('hex'), '7f454c46');
            assert.equal(fileHash(original), '4f2de678286401759b3fb4475bafe35b8f32b4b3a07d92642bbf37eadc9b34a4');
            assert.equal(run('original-version', original, ['--version']), 'Version 7.0.2\n');
            receipt.providers.original = { binary: original, sha256: fileHash(original), manifestPath, manifestSha256: fileHash(manifestPath), version: manifest.version, gitHead: manifest.gitHead };
            const metadata = JSON.parse(run('metadata', 'cargo', ['metadata', '--locked', '--no-deps', '--format-version=1']));
            const pkg = metadata.packages.find(pkg => pkg.name === 'vize_maestro');
            assert.ok(pkg);
            const build = run('build-once', 'cargo', ['test', '--locked', '-p', 'vize_maestro', '--no-run', '--message-format=json'], mapper);
            const messages = build.split('\n').filter(Boolean).map(line => JSON.parse(line));
            assert.equal(messages.at(-1).reason, 'build-finished');
            assert.equal(messages.at(-1).success, true);
            const binaries = messages.filter(message => message.reason === 'compiler-artifact' && message.package_id === pkg.id && message.profile.test && message.executable);
            assert.ok(binaries.length > 0);
            const targets = binaries.map(artifact => {
              const kind = artifact.target.kind;
              assert.equal(kind.length, 1);
              assert.ok(kind[0] === 'lib' || kind[0] === 'test');
              return { key: `${kind[0]}:${artifact.target.name}`, selector: kind[0] === 'lib' ? ['--lib'] : ['--test', artifact.target.name], executable: artifact.executable, executableSha256: fileHash(artifact.executable), features: artifact.features };
            });
            targets.push({ key: 'doctest:vize_maestro', selector: ['--doc'] });
            assert.equal(new Set(targets.map(target => target.key)).size, targets.length);
            for (const target of targets) {
              const command = ['test', '--locked', '-p', 'vize_maestro', ...target.selector, '--'];
              target.inventory = names(run(`list-${target.key.replaceAll(':', '-')}`, 'cargo', [...command, '--list', '--format', 'terse'], mapper));
              target.ignored = names(run(`ignored-${target.key.replaceAll(':', '-')}`, 'cargo', [...command, '--ignored', '--list', '--format', 'terse'], mapper));
              assert.ok(target.ignored.every(name => target.inventory.includes(name)));
              for (const name of target.inventory) receipt.inventory.push({ target: target.key, name, ignored: target.ignored.includes(name), provider: name === legacy ? 'original' : 'mapper' });
            }
            assert.equal(receipt.inventory.filter(test => test.name.includes(legacy)).length, 1);
            assert.equal(receipt.inventory.find(test => test.name === legacy).ignored, false);
            const legacyTarget = targets.find(target => target.inventory.includes(legacy));
            assert.equal(legacyTarget.key, 'lib:vize_maestro');
            receipt.targets = targets;
            write('receipt.json', receipt);
            for (let cycle = 1; cycle <= 20; cycle++) {
              const completed = [];
              for (const target of targets) {
                const selected = target.inventory.filter(name => name !== legacy);
                const command = ['test', '--locked', '-p', 'vize_maestro', ...target.selector, '--', '--format', 'pretty', '--color', 'never', '--skip', legacy];
                const stdout = run(`cycle-${cycle}-${target.key.replaceAll(':', '-')}`, 'cargo', command, mapper);
                completed.push(...executions(stdout, target.inventory, target.ignored, selected).map(event => ({ target: target.key, ...event, provider: 'mapper' })));
              }
              const fixtureCapture = path.join(capture, `cycle-${cycle}-original-fixtures`);
              const stdout = run(`cycle-${cycle}-original`, 'cargo', ['test', '--locked', '-p', 'vize_maestro', ...legacyTarget.selector, '--', '--exact', legacy, '--format', 'pretty', '--color', 'never'], original, fixtureCapture);
              completed.push(...executions(stdout, legacyTarget.inventory, legacyTarget.ignored, [legacy]).map(event => ({ target: legacyTarget.key, ...event, provider: 'original' })));
              const identity = test => `${test.target}\0${test.name}`;
              assert.deepEqual(completed.map(identity).sort(), receipt.inventory.map(identity).sort(), 'combined providers must execute the complete original inventory exactly once per cycle');
              assert.equal(completed.filter(test => test.provider === 'original').length, 1);
              for (const test of completed) assert.equal(test.provider, receipt.inventory.find(expected => identity(expected) === identity(test)).provider);
              assert.equal(fileHash(mapper), mapperReceipt.sha256);
              assert.equal(fileHash(original), receipt.providers.original.sha256);
              for (const target of targets.filter(target => target.executable)) assert.equal(fileHash(target.executable), target.executableSha256, 'test executable must remain the once-built image');
              receipt.cycles.push({ cycle, completed, active: completed.filter(test => test.state === 'ok').length, ignored: completed.filter(test => test.state === 'ignored').length });
              write('receipt.json', receipt);
              console.log(`Editor lifecycle cycle ${cycle}/20 passed: ${receipt.cycles.at(-1).active} active + ${receipt.cycles.at(-1).ignored} declared ignores; both exact providers covered`);
            }
            assert.equal(receipt.cycles.length, 20);
            receipt.status = 'COMPLETE_INVENTORY_PASSED';
          } catch (error) {
            receipt.status = 'FAILED';
            receipt.error = error.stack;
            throw error;
          } finally {
            write('receipt.json', receipt);
          }
          JS
      - name: Preserve whole owner calibration observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: content-mapper-owner-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/vize-tests/content-mapper-directive-owners
            ${{ runner.temp }}/content-mapper-native-host.json
            ${{ runner.temp }}/content-mapper-editor-stress
          if-no-files-found: error
          retention-days: 7

  event-rename:
    if: github.event_name == 'workflow_dispatch' && inputs.event-rename-only && !inputs.official-css-options-only && !inputs.published-defaults-only
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout Vize
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Checkout exact TypeScript Content Mapper revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: microsoft/TypeScript
          ref: ${{ env.CONTENT_MAPPER_TYPESCRIPT_SHA }}
          path: typescript-content-mapper
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: typescript-content-mapper/tsc/go.mod
          cache-dependency-path: typescript-content-mapper/tsc/go.sum
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: content-mapper-conformance
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - name: Install frozen dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Build exact upstream tsgo
        working-directory: typescript-content-mapper/tsc
        run: |
          go build -tags=noembed -trimpath -o "$RUNNER_TEMP/tsgo" ./cmd/tsc
          cp internal/bundled/libs/*.d.ts "$RUNNER_TEMP/"
      - name: Preserve source and provider identity before queries
        run: |
          mkdir -p "$RUNNER_TEMP/event-rename"
          rustc -Vv > "$RUNNER_TEMP/event-rename/rustc.txt"
          go version > "$RUNNER_TEMP/event-rename/go.txt"
          node --version > "$RUNNER_TEMP/event-rename/node.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/event-rename/source-sha.txt"
          git -C typescript-content-mapper rev-parse HEAD > "$RUNNER_TEMP/event-rename/provider-source-sha.txt"
          test "$(cat "$RUNNER_TEMP/event-rename/provider-source-sha.txt")" = "$CONTENT_MAPPER_TYPESCRIPT_SHA"
          git diff --binary HEAD > "$RUNNER_TEMP/event-rename/source.patch"
          test ! -s "$RUNNER_TEMP/event-rename/source.patch"
          sha256sum "$RUNNER_TEMP/tsgo" "$RUNNER_TEMP/"*.d.ts > "$RUNNER_TEMP/event-rename/provider.sha256"
          sha256sum tests/_fixtures/differential/lsp/event-rename/4075/{bound-emitter,named-model}/cases.json.txt > "$RUNNER_TEMP/event-rename/oracles.sha256"
          sha256sum pnpm-lock.yaml > "$RUNNER_TEMP/event-rename/dependency-lock.sha256"
          cp npm/cli/node_modules/vue/package.json "$RUNNER_TEMP/event-rename/vue-package.json"
          sha256sum npm/cli/node_modules/vue/package.json > "$RUNNER_TEMP/event-rename/vue-package.sha256"
      - name: Run both whole event rename transaction targets
        id: transactions
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ github.sha }}
          VIZE_TEST_REQUIRE_TSGO: "1"
          VIZE_TEST_CONTENT_MAPPER_TSGO: ${{ runner.temp }}/tsgo
          VIZE_TEST_CONTENT_MAPPER_VUE: ${{ github.workspace }}/npm/cli/node_modules/vue
          VIZE_TEST_FIX_HISTORY_CAPTURE_DIR: ${{ runner.temp }}/event-rename/packets
          VIZE_INLAY_HINT_CAPTURE: ${{ runner.temp }}/event-rename/processes
        run: |
          cargo test --locked --profile ci --no-fail-fast -p vize --test integration -- \
            lsp_bound_event_casing_cli:: \
            lsp_named_model_transactions_cli:: --nocapture \
            2>&1 | tee "$RUNNER_TEMP/event-rename/tests.log"
      - name: Preserve actual CLI identity and complete artifact inventory
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/event-rename"
          if [ -f target/ci/vize ]; then
            sha256sum target/ci/vize > "$RUNNER_TEMP/event-rename/cli.sha256"
          fi
          find "$RUNNER_TEMP/event-rename" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/event-rename-inventory.sha256"
      - name: Upload complete event rename observations before result gate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: content-mapper-event-rename-${{ github.sha }}
          path: |
            ${{ runner.temp }}/event-rename/
            ${{ runner.temp }}/event-rename-inventory.sha256
          if-no-files-found: error
      - name: Require both whole transaction targets
        if: always()
        env:
          TRANSACTIONS_OUTCOME: ${{ steps.transactions.outcome }}
        run: test "$TRANSACTIONS_OUTCOME" = success

  official-css-options:
    if: github.event_name == 'workflow_dispatch' && (inputs.official-css-options-only || inputs.published-defaults-only)
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected-source-sha }}
    steps:
      - name: Require the explicit public scope and absent runtime overrides
        if: inputs.published-defaults-only
        env: { SOURCE_MODE: "${{ inputs.official-css-options-only }}" }
        shell: bash
        run: |
          test "$SOURCE_MODE" != true
          [[ "$GITHUB_REF" == refs/heads/* ]]
          for key in NODE_OPTIONS VIZE_PREFER_WORKSPACE_BINDING NAPI_RS_NATIVE_LIBRARY_PATH NAPI_RS_FORCE_WASI VIZE_ALLOW_NATIVE_VERSION_MISMATCH CORSA_PATH CORSA_EXECUTABLE TSGO_PATH TSGO_EXECUTABLE VIZE_PUBLIC_NATIVE_CUSTODY VIZE_OXLINT_NATIVE_CUSTODY VIZE_CORSA_DEV_PATHS CARGO_BIN_EXE_vize SOURCE_SHA VIZE_TEST_REQUIRE_TSGO VIZE_TEST_DISABLE_TSGO VIZE_TEST_FIX_HISTORY_CAPTURE_DIR VIZE_INLAY_HINT_CAPTURE VIZE_LSP_PASSIVE_EVIDENCE RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_RUSTC RUSTC RUSTUP_TOOLCHAIN; do
            test -z "${!key:-}"
          done
      - name: Require an unambiguous focused campaign
        env:
          EVENT_RENAME_ONLY: ${{ inputs.event-rename-only }}
        run: |
          test "$EVENT_RENAME_ONLY" != true
      - name: Checkout the reviewed Vize source
        if: ${{ !inputs.published-defaults-only }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Checkout the actual public validation actor
        if: inputs.published-defaults-only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ github.workflow_sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Authenticate source and recipe before any build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/official-css-source"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/official-css-source/git-identity.txt"
          sha256sum Cargo.toml Cargo.lock rust-toolchain.toml \
            tools/support/compat/content-mapper/official-css-options.ts \
            tools/support/compat/content-mapper/official-fixtures.ts \
            tests/_fixtures/content-mapper/escaton-css-options.json \
            tests/_fixtures/content-mapper/escaton-component-events.json \
            tests/_fixtures/content-mapper/escaton-component-props.json \
            tests/_fixtures/content-mapper/escaton-nested-flow-9433.json \
            tests/_fixtures/content-mapper/escaton-public-props-9498.json \
            tests/_fixtures/content-mapper/nuxt-pattern-emit-10195.json \
            .github/workflows/content-mapper-conformance.yml \
            > "$RUNNER_TEMP/official-css-source/inputs.sha256"
      - name: Setup pinned Node and Vite Plus
        if: ${{ !inputs.published-defaults-only }}
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: latest
          node-version-file: "package.json"
          cache: true
          cache-save: false
          run-install: false
      - name: Setup pinned Node for public packages only
        if: inputs.published-defaults-only
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - name: Setup repository Rust toolchain
        if: ${{ !inputs.published-defaults-only }}
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: "1.99.1"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        if: ${{ !inputs.published-defaults-only }}
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        if: ${{ !inputs.published-defaults-only }}
        with:
          key: content-mapper-official-css-options
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Install frozen workspace dependencies
        if: ${{ !inputs.published-defaults-only }}
        run: vp install --frozen-lockfile --prefer-offline
      - name: Verify native legacy projection compatibility
        if: ${{ !inputs.published-defaults-only }}
        env:
          VIZE_TEMPLATE_EMIT_TS40_CAPTURE: ${{ runner.temp }}/official-css-source/ts40-legacy
        run: cargo test -p vize_maestro --features legacy --test davinci_ts40_projection -- --nocapture
      - name: Build the real packed mapper runtime
        if: ${{ !inputs.published-defaults-only }}
        run: |
          vp run --filter './npm/native' build:ci
          (cd npm/cli && vp pack)
          (cd npm/native && vp exec napi create-npm-dirs)
          (cd npm/native && vp exec napi pre-publish -t npm --no-gh-release --skip-optional-publish)
          cp npm/native/vize-vitrine.linux-x64-gnu.node npm/native/npm/linux-x64-gnu/
          sha256sum npm/native/vize-vitrine.linux-x64-gnu.node > "$RUNNER_TEMP/official-css-source/native-image.sha256"
      - name: Run original public failures and fresh packed official host controls
        if: ${{ !inputs.published-defaults-only }}
        id: official
        run: >-
          node tools/support/compat/content-mapper/official-css-options.ts
          --output "$RUNNER_TEMP/official-css-options"
          --fixture tests/_fixtures/content-mapper/escaton-component-events.json
          --fixture tests/_fixtures/content-mapper/escaton-component-props.json
          --fixture tests/_fixtures/content-mapper/escaton-nested-flow-9433.json
          --fixture tests/_fixtures/content-mapper/escaton-public-props-9498.json
          --fixture tests/_fixtures/content-mapper/nuxt-pattern-emit-10195.json
      - name: Run exact published reporter fixtures
        if: inputs.published-defaults-only
        env:
          PUBLIC_REPORT: ${{ inputs.published-report }}
          PUBLIC_CUT: ${{ inputs.cut }}
          PUBLIC_HEAD: ${{ inputs.head }}
          PUBLIC_TAG: ${{ inputs.tag }}
          PUBLIC_SOURCE_PR: ${{ inputs.source_pr }}
          PUBLIC_RELEASE_RUN: ${{ inputs.release_run }}
          PUBLIC_ACTOR: ${{ github.workflow_sha }}
          PUBLIC_INPUTS: ${{ runner.temp }}/official-css-source/public-inputs.json
        shell: bash
        run: |
          case "$PUBLIC_REPORT" in
            9499) public_fixture=tests/_fixtures/content-mapper/with-defaults-surplus.json ;;
            9498) public_fixture=tests/_fixtures/content-mapper/escaton-public-props-9498.json ;;
            *) echo "Unsupported published report" >&2; exit 2 ;;
          esac
          sha256sum "$public_fixture" >> "$RUNNER_TEMP/official-css-source/inputs.sha256"
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import { officialActorInputs } from './tools/support/compat/content-mapper/official-fixtures.ts';
          const keys = ['PUBLIC_CUT', 'PUBLIC_HEAD', 'PUBLIC_TAG', 'PUBLIC_SOURCE_PR', 'PUBLIC_RELEASE_RUN', 'PUBLIC_ACTOR'];
          const inputs = Object.fromEntries(keys.map(key => [key, process.env[key]]));
          officialActorInputs(inputs);
          fs.writeFileSync(process.env.PUBLIC_INPUTS, JSON.stringify(inputs, null, 2) + '\n');
          JS
          node tools/support/compat/content-mapper/official-css-options.ts --candidate-only --explicit-fixtures-only --public-version "${PUBLIC_TAG#v}" --public-inputs "$PUBLIC_INPUTS" --fixture "$public_fixture" --output "$RUNNER_TEMP/official-css-options"
      - name: Retain complete official compiler diagnostics and package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-css-options-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/official-css-source/
            ${{ runner.temp }}/official-css-options/
            !${{ runner.temp }}/official-css-options/**/node_modules
            !${{ runner.temp }}/official-css-options/**/node_modules/**
