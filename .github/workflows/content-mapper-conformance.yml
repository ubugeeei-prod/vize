name: Published prop diagnostic on macOS 15 (temporary)
run-name: Public 0.678.0 macOS 15 diagnostic @ ${{ github.sha }}
on:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: public-prop-11809-${{ github.ref }}
  cancel-in-progress: false
jobs:
  published-consumer:
    if: github.ref == 'refs/heads/diagnostic/11809-macos15-public678'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - name: Verify official Node 22.23.3
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/11809-evidence"
          mkdir -p "$evidence/node-download"
          cd "$evidence/node-download"
          curl --fail --location --silent --show-error --output SHASUMS256.txt https://nodejs.org/dist/v22.23.3/SHASUMS256.txt
          archive=node-v22.23.3-darwin-arm64.tar.xz
          curl --fail --location --silent --show-error --output "$archive" "https://nodejs.org/dist/v22.23.3/$archive"
          expected=72d5d8832b41c9d9646197af614ffd751406ea4d215060eb91b98864e1919a3e
          test "$(awk -v file="$archive" '$2 == file { print $1 }' SHASUMS256.txt)" = "$expected"
          printf '%s  %s\n' "$expected" "$archive" | shasum -a 256 --check
          tar -xJf "$archive"
          ./node-v22.23.3-darwin-arm64/bin/node --version
      - name: Observe bounded published consumer contracts
        shell: bash
        run: |
          set -euo pipefail
          node_root="$RUNNER_TEMP/11809-evidence/node-download/node-v22.23.3-darwin-arm64"
          export PATH="$node_root/bin:$PATH"
          "$node_root/bin/node" --experimental-strip-types tools/diagnostics/11809-macos15-public-consumer.ts
      - name: Preserve complete diagnostics and physical image receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public678-macos15-11809-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/11809-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
