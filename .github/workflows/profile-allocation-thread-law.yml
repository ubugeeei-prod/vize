name: Profile allocation thread law
on:
  pull_request:
    paths:
      - .github/workflows/profile-allocation-thread-law.yml
      - davinci/vize_l0/src/profiler/core.rs
      - davinci/vize_l0/src/profiler/allocation.rs
      - davinci/vize_l0/src/profiler/metrics.rs
      - davinci/vize_l0/tests/profile_allocation_thread_law.rs
  workflow_dispatch: {}
permissions: { contents: read }
concurrency:
  group: profile-allocation-thread-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  laws:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: profile-thread-law-v1
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Check the small normal and instrumented allocation carriers
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source.sha
          rustc +1.99.1 -vV > evidence/rustc.txt
          cargo +1.99.1 test --locked --profile ci -p vize_l0 --test profile_allocation_thread_law -- --nocapture 2>&1 | tee evidence/normal-law.log
          cargo +1.99.1 test --locked --profile ci -p vize_l0 --test profile_allocation_thread_law --features micro-profiling -- --nocapture 2>&1 | tee evidence/instrumented-law.log
          cargo +1.99.1 test --locked --profile ci -p vize_l0 --features micro-profiling --doc ProfileGuard 2>&1 | tee evidence/send-law.log
          cargo +1.99.1 test --locked --profile ci -p vize_l0 --test source_operations_profile --features micro-profiling 2>&1 | tee evidence/observer-law.log
          cargo +1.99.1 test --locked --profile ci -p vize_carton --test davinci_profile_export --features micro-profiling per_span_allocation_counts_and_schema_validation 2>&1 | tee evidence/nested-export-law.log
      - name: Compile the profiling CLI after the carrier succeeds
        run: |
          set -euo pipefail
          cargo +1.99.1 build --locked --profile ci -p vize --features profiling --message-format json > evidence/profiling-cli-artifacts.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: profile-allocation-thread-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
