name: Davinci Kani

on:
  pull_request:
    paths:
      - ".github/workflows/davinci-kani.yml"
      - "davinci/vize_l3/src/lattice/axis.rs"
      - "davinci/vize_l3/src/lattice/class.rs"
      - "davinci/vize_l3/src/lattice/effect.rs"
      - "davinci/vize_l3/src/lattice/kani.rs"
      - "davinci/vize_l3/src/lattice/classify_proofs.rs"
      - "crates/vize_patina/src/html_content_model/tri.rs"
      - "crates/vize_patina/src/html_content_model/walk.rs"
      - "crates/vize_patina/src/html_content_model/kani.rs"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  l3-lattice:
    name: L3 lattice properties
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.68.0"
          command: kani
          args: davinci/vize_l3/src/lattice/kani.rs --output-format=terse

  html-content-model:
    name: HTML content-model kernel properties
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.68.0"
          command: kani
          args: crates/vize_patina/src/html_content_model/kani.rs --output-format=terse
