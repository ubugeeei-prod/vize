name: Levels Kani

on:
  pull_request:
    paths:
      - ".github/workflows/level-kani.yml"
      - "levels/vize_l3/src/lattice/axis.rs"
      - "levels/vize_l3/src/lattice/class.rs"
      - "levels/vize_l3/src/lattice/effect.rs"
      - "levels/vize_l3/src/lattice/kani.rs"
      - "levels/vize_l3/src/lattice/classify_proofs.rs"
      - "tests/level_test_support/src/l3_reference/checker.rs"
      - "tests/level_test_support/src/l3_reference/checker_proofs.rs"
      - "tests/level_test_support/src/l3_reference/graphs.rs"
      - "tests/level_test_support/src/l3_reference/incremental.rs"
      - "tests/level_test_support/src/l3_reference/incremental_proofs.rs"
      - "tests/level_test_support/src/l3_reference/kani.rs"
      - "tests/level_test_support/src/l3_reference/program.rs"
      - "tests/level_test_support/src/l3_reference/schedule.rs"
      - "tests/level_test_support/src/l3_reference/schedule_proofs.rs"
      - "tests/level_test_support/src/l3_reference/trace.rs"
      - "crates/vize_patina/src/html_content_model/tri.rs"
      - "crates/vize_patina/src/html_content_model/walk.rs"
      - "crates/vize_patina/src/html_content_model/kani.rs"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  l3-lattice:
    name: L3 lattice properties
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.68.0"
          command: kani
          args: levels/vize_l3/src/lattice/kani.rs --output-format=terse

  l3-reference:
    name: L3 reference schedule, checker, and incremental laws
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.68.0"
          command: kani
          args: tests/level_test_support/src/l3_reference/kani.rs --output-format=terse --jobs 2

  html-content-model:
    name: HTML content-model kernel properties
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.68.0"
          command: kani
          args: crates/vize_patina/src/html_content_model/kani.rs --output-format=terse
