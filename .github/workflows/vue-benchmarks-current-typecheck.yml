name: Vue Benchmarks Current Typecheck

# Register on main before one exact-main correctness dispatch. This untimed
# probe does not modify the default native-phase or protected CPU workloads.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main source SHA reviewed for this replay
        required: true
        type: string
      reference:
        description: Also capture the pinned independent vue-tsc reference
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: vue-benchmarks-current-typecheck-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
  EXECUTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
  WITH_REFERENCE: ${{ inputs.reference }}

jobs:
  current-typecheck:
    name: current-typecheck
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Refuse a branch, stale main or unreviewed workflow source
        shell: bash
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          test "$EXECUTED_WORKFLOW_SHA" = "$EXPECTED_SOURCE_SHA"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the literal main checkout and fixed upstream gitlink
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SOURCE_SHA"
          test "$(git ls-tree HEAD tests/_fixtures/_git/vue-benchmarks | cut -f1)" = '160000 commit 5489aee433cd1054b9d72973457498544da7c467'
          git submodule update --init --depth 1 -- tests/_fixtures/_git/vue-benchmarks
          test "$(git -C tests/_fixtures/_git/vue-benchmarks rev-parse HEAD)" = 5489aee433cd1054b9d72973457498544da7c467
          test -z "$(git -C tests/_fixtures/_git/vue-benchmarks status --porcelain --untracked-files=all)"

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"

      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: vue-benchmarks-current-typecheck
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}

      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Run only the owned process-custody controls
        run: node --test tools/benchmarks/scripts/vue-benchmarks-current-typecheck.test.mjs

      - name: Materialize the frozen minimal provider installation
        shell: bash
        run: |
          provider_source=tools/benchmarks/fixtures/vue-benchmarks-current-typecheck-provider
          provider_prefix="$RUNNER_TEMP/vue-benchmarks-current-provider"
          mkdir "$provider_prefix"
          cp "$provider_source/package.json" "$provider_source/package-lock.json" "$provider_prefix/"
          npm ci --prefix "$provider_prefix" --ignore-scripts --no-audit --no-fund
          cmp "$provider_source/package-lock.json" "$provider_prefix/package-lock.json"
          sha256sum "$provider_prefix/package.json" "$provider_prefix/package-lock.json"

      - name: Build and retain the real source CLI identity
        shell: bash
        run: |
          cargo build --locked --profile ci -p vize
          mkdir "$RUNNER_TEMP/vue-benchmarks-current-build"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/vue-benchmarks-current-build/source.txt"
          git show HEAD:.github/workflows/vue-benchmarks-current-typecheck.yml > "$RUNNER_TEMP/vue-benchmarks-current-build/workflow.yml"
          file target/ci/vize "$RUNNER_TEMP/vue-benchmarks-current-provider/node_modules/@typescript/typescript-linux-x64/lib/tsc" > "$RUNNER_TEMP/vue-benchmarks-current-build/elf.txt"
          sha256sum target/ci/vize "$RUNNER_TEMP/vue-benchmarks-current-provider/node_modules/@typescript/typescript-linux-x64/lib/tsc" > "$RUNNER_TEMP/vue-benchmarks-current-build/binaries.sha256"
          node --version > "$RUNNER_TEMP/vue-benchmarks-current-build/node-version.txt"
          npm --version > "$RUNNER_TEMP/vue-benchmarks-current-build/npm-version.txt"

      - name: Capture six native checks and optional two independent reference checks
        shell: bash
        run: |
          provider_prefix="$RUNNER_TEMP/vue-benchmarks-current-provider"
          args=(
            --source-sha "$EXPECTED_SOURCE_SHA"
            --vize-bin "$GITHUB_WORKSPACE/target/ci/vize"
            --corsa-bin "$provider_prefix/node_modules/@typescript/typescript-linux-x64/lib/tsc"
            --vue-dir "$provider_prefix/node_modules/vue"
            --output "$RUNNER_TEMP/vue-benchmarks-current-typecheck"
          )
          if [[ "$WITH_REFERENCE" = true ]]; then
            args+=(--vue-tsc-bin "$provider_prefix/node_modules/.bin/vue-tsc")
          fi
          node tools/benchmarks/scripts/vue-benchmarks-current-typecheck.mjs "${args[@]}"

      - name: Recheck original source, gitlink and frozen provider after execution
        if: ${{ always() }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C tests/_fixtures/_git/vue-benchmarks status --porcelain --untracked-files=all)"
          cmp tools/benchmarks/fixtures/vue-benchmarks-current-typecheck-provider/package-lock.json "$RUNNER_TEMP/vue-benchmarks-current-provider/package-lock.json"

      - name: Retain every successful or failed original observation
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vue-benchmarks-current-typecheck-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/vue-benchmarks-current-typecheck/
            ${{ runner.temp }}/vue-benchmarks-current-build/
            ${{ runner.temp }}/vue-benchmarks-current-provider/package.json
            ${{ runner.temp }}/vue-benchmarks-current-provider/package-lock.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
