name: Logical native overlay namespace probe (diagnostic only)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source P, parent of the reviewed diagnostic controller
        required: true
        type: string
      workflow_ref:
        description: Exact controller H with source P as its only parent
        required: true
        type: string

permissions: { contents: read }
concurrency:
  group: logical-native-overlay-${{ github.run_id }}
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"

jobs:
  logical:
    name: One exact ignored Linux logical namespace control
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      WORKFLOW_SHA: ${{ inputs.workflow_ref }}
      EXECUTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Select fresh owned build and evidence paths
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$EXECUTED_WORKFLOW_SHA" = "$WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags --depth=2 origin "$WORKFLOW_SHA"
          test ! -e target
          test ! -L target
          logical_target="$RUNNER_TEMP/logical-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          logical_evidence="$RUNNER_TEMP/logical-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$logical_target"
          test ! -e "$logical_evidence"
          mkdir -m 700 "$logical_target" "$logical_evidence"
          ln -s "$logical_target" target
          printf 'CARGO_TARGET_DIR=%s\nEVIDENCE=%s\n' "$logical_target" "$logical_evidence" >> "$GITHUB_ENV"
          git show "$WORKFLOW_SHA:.github/actions/lsp-logical-probe/run.ts" > "$logical_evidence/run.ts"
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install frozen source dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - name: Select the unchanged locked native provider
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e 'import assert from "node:assert/strict"; for (const name of ["CORSA_PATH","CORSA_EXECUTABLE","TSGO_PATH","TSGO_EXECUTABLE","TSRS_PATH","TSRS_EXECUTABLE"]) assert.ok(!process.env[name], `ambient ${name} refused`);'
          GITHUB_SHA="$SOURCE_SHA" vp exec node tools/support/compat/github/full-rust-runtime.ts
      - name: Check strict helper and execute one exact native control
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/.pnpm/typescript@6.0.3/node_modules/typescript/lib/tsc.js --ignoreConfig --strict --noEmit --noImplicitAny --noUncheckedIndexedAccess --exactOptionalPropertyTypes --erasableSyntaxOnly --target es2023 --module esnext --moduleResolution bundler --allowImportingTsExtensions --skipLibCheck --types node --typeRoots "$PWD/node_modules/@types" "$EVIDENCE/run.ts" > "$EVIDENCE/strict.stdout" 2> "$EVIDENCE/strict.stderr"
          node "$EVIDENCE/run.ts" --controls > "$EVIDENCE/controls.stdout" 2> "$EVIDENCE/controls.stderr"
          node "$EVIDENCE/run.ts"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: logical-native-overlay-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/logical-evidence-${{ github.run_id }}-${{ github.run_attempt }}/
            target/nextest/full/native-runtime-provider.json
          if-no-files-found: error
          retention-days: 30
