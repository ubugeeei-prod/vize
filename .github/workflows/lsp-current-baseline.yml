name: Private foreground preparation arrival-zero comparison

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed finite candidate source (must match the controller)
        required: true
        default: "03ad1ca3e78fc97e8995882bd61942ce6fcbda23"
        type: string

permissions:
  contents: read

concurrency:
  group: lsp-initial-ready-supplement-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
  REQUESTED_CANDIDATE: ${{ inputs.source_sha }}
  EXPECTED_WORKFLOW: ${{ github.workflow_sha }}

jobs:
  compare:
    name: Shipping B C C B; two arrival-zero native fixtures
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: "16"
      RAYON_NUM_THREADS: "8"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 6
          persist-credentials: false
      - name: Refuse foreign source or workflow ancestry; stage immutable controller
        shell: bash
        run: |
          set -euo pipefail
          test "$REQUESTED_CANDIDATE" = 03ad1ca3e78fc97e8995882bd61942ce6fcbda23
          test "$GITHUB_SHA" = "$EXPECTED_WORKFLOW"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          parent() {
            git cat-file -p "$1" | awk 'BEGIN { header=1 } /^$/ { header=0 } header && /^parent / { print $2 }'
          }
          test "$(parent "$GITHUB_SHA")" = 03ad1ca3e78fc97e8995882bd61942ce6fcbda23
          test "$(parent 03ad1ca3e78fc97e8995882bd61942ce6fcbda23)" = 3f276046ca36ee4764fd6b9f6cd5c123f5048052
          test "$(parent 3f276046ca36ee4764fd6b9f6cd5c123f5048052)" = dbbe171c70503ae3017cf293e58c2301399cc5bc
          test "$(parent dbbe171c70503ae3017cf293e58c2301399cc5bc)" = 1248e5a903c6de56f2e4630650a048744d135edf
          test "$(parent 1248e5a903c6de56f2e4630650a048744d135edf)" = 6395f93131f6d4cdb4b429dece08d9b15bbbef4c
          case "$RUNNER_TEMP" in *$'\n'*|*$'\r'*) exit 1;; esac
          control="$RUNNER_TEMP/initial-ready-supplement-control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$control"
          mkdir -m 700 "$control/lsp-initial-ready-pair" "$control/lsp-initial-ready-supplement"
          for name in shipping-adapter.ts readiness-parity.ts; do
            install -m 400 ".github/actions/lsp-initial-ready-pair/$name" "$control/lsp-initial-ready-pair/$name"
          done
          for name in controller.ts source-custody.ts foreground-source.ts custody-controls.test.ts workload.ts native-queries.ts fixtures.ts resources.ts controls.test.ts README.md; do
            install -m 400 ".github/actions/lsp-initial-ready-supplement/$name" "$control/lsp-initial-ready-supplement/$name"
          done
          install -m 400 .github/workflows/lsp-current-baseline.yml "$control/workflow.yml"
          printf 'CONTROL_DIRECTORY=%s\n' "$control" >> "$GITHUB_ENV"
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install exact original JavaScript stacks
        run: vp install --frozen-lockfile --prefer-offline
      - name: Install original isolated comparison provider
        working-directory: tests/_fixtures/performance/lsp-dual-server/provider
        run: vp install --frozen-lockfile --prefer-offline
      - name: Hydrate only the exact reviewed Vben source fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture=tests/_fixtures/_git/vue-vben-admin
          expected=748b182e440863711dc9624924e92440f5ddc4d3
          test "$(git rev-parse "HEAD:$fixture")" = "$expected"
          git submodule update --init --depth 1 -- "$fixture"
          test "$(git -C "$fixture" rev-parse HEAD)" = "$expected"
          test -z "$(git -C "$fixture" status --porcelain=v1 --untracked-files=all)"
          git -C "$fixture" rev-parse HEAD > "$CONTROL_DIRECTORY/vben-source.txt"
          git -C "$fixture" ls-tree -r --full-tree HEAD > "$CONTROL_DIRECTORY/vben-tracked-tree.txt"
      - name: Strict typed controller and synthetic refusal controls
        shell: bash
        run: |
          set -euo pipefail
          compiler=node_modules/.pnpm/typescript@6.0.3/node_modules/typescript/lib/tsc.js
          node "$compiler" --version > "$CONTROL_DIRECTORY/strict-version.txt"
          node "$compiler" --ignoreConfig --strict --noEmit --noUnusedLocals --noUnusedParameters --noImplicitAny \
            --noUncheckedIndexedAccess --exactOptionalPropertyTypes --erasableSyntaxOnly \
            --target es2023 --module esnext --moduleResolution bundler \
            --allowImportingTsExtensions --allowJs --skipLibCheck --types node \
            --typeRoots "$PWD/node_modules/@types" \
            "$CONTROL_DIRECTORY/lsp-initial-ready-supplement/controller.ts" \
            "$CONTROL_DIRECTORY/lsp-initial-ready-supplement/workload.ts" \
            "$CONTROL_DIRECTORY/lsp-initial-ready-supplement/native-queries.ts" \
            "$CONTROL_DIRECTORY/lsp-initial-ready-supplement/fixtures.ts" \
            "$CONTROL_DIRECTORY/lsp-initial-ready-supplement/resources.ts" \
            "$CONTROL_DIRECTORY/lsp-initial-ready-supplement/controls.test.ts" \
            "$CONTROL_DIRECTORY/lsp-initial-ready-supplement/custody-controls.test.ts" \
            > "$CONTROL_DIRECTORY/strict.stdout" 2> "$CONTROL_DIRECTORY/strict.stderr"
          node --test "$CONTROL_DIRECTORY/lsp-initial-ready-supplement/controls.test.ts" "$CONTROL_DIRECTORY/lsp-initial-ready-supplement/custody-controls.test.ts" \
            > "$CONTROL_DIRECTORY/controls.stdout" 2> "$CONTROL_DIRECTORY/controls.stderr"
      - name: Install the unchanged repository Rust toolchain
        run: rustup toolchain install || rustup show active-toolchain
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - name: Fresh normal release B/C builds; eight matched arrival-zero sessions
        run: vp exec node "$CONTROL_DIRECTORY/lsp-initial-ready-supplement/controller.ts"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: lsp-initial-ready-supplement-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/initial-ready-supplement-control-${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ runner.temp }}/initial-ready-supplement-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
