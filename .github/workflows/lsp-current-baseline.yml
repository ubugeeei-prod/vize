name: Current-source LSP baseline

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed private workflow SHA, including the functional helper
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lsp-current-baseline-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"

jobs:
  functional:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 180
    env:
      EXPECTED_WORKFLOW: ${{ inputs.source_sha }}
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "16"
      RAYON_NUM_THREADS: "8"
      RUSTFLAGS: ""
      CARGO_ENCODED_RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Authenticate the exact private workflow commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_WORKFLOW" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_WORKFLOW"
          test "$GITHUB_SHA" = "$EXPECTED_WORKFLOW"
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install only locked repository dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Install the repository Rust toolchain
        run: |
          rustup toolchain install || rustup show active-toolchain
          cargo --version
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: lsp-current-baseline
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Stage the reviewed helper and run its pure controls
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/initial-canon-helper-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$destination"
          cp -R .github/actions/lsp-initial-canon-functional "$destination"
          node --test "$destination/controls.test.ts"
      - name: Preserve first release CLI and qualify two exact native laws
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/initial-canon-helper-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/controller.ts"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: initial-canon-functional-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/initial-canon-functional-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 3
