name: Retained-text original Vben comparison
run-name: Retained-text B-C-C-B @ ${{ inputs.source_sha }}

# Temporary controller only; B/C workload, options and source recipes are immutable.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed temporary controller H (sole parent C)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: retained-text-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
  RAYON_NUM_THREADS: "4"
  VIZE_PERF_BUDGET_SCALE: "1"
  VIZE_TRACE_EDITOR_PREPARATION: "1"
  CARGO_INCREMENTAL: "0"
  RETAINED_CONTROLLER_SOURCE: ${{ inputs.source_sha }}

jobs:
  original-vben:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ec8474e0ea9ed05062542c57c857f36b9467ac15
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: 437f32b11bb5d8ab9275583a4d0dbdb1f3e8b048
          path: candidate
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - name: Run finite controller refusal controls
        run: node --test .github/retained-text/laws.test.ts
      - name: Build distinct first CLIs and execute all four original attempts
        run: node .github/retained-text/run.ts "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/candidate"
      - name: Retain every outcome and small raw source receipt without executables
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retained-text-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.source_sha }}
          path: target/vize-tests/retained-text-campaign/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
