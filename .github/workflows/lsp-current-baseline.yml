name: Private initial readiness normal release paired comparison

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed finite candidate source (must match the controller)
        required: true
        default: "b52148128716418a08aa33b6d6e1c6e33961db56"
        type: string

permissions:
  contents: read

concurrency:
  group: lsp-initial-ready-abba-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
  REQUESTED_CANDIDATE: ${{ inputs.source_sha }}
  EXPECTED_WORKFLOW: ${{ github.workflow_sha }}

jobs:
  compare:
    name: Shipping B C C B; original 100 fresh and 100 warm each
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: "16"
      RAYON_NUM_THREADS: "8"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: false
      - name: Refuse foreign source or workflow ancestry; stage immutable controller
        shell: bash
        run: |
          set -euo pipefail
          test "$REQUESTED_CANDIDATE" = b52148128716418a08aa33b6d6e1c6e33961db56
          test "$GITHUB_SHA" = "$EXPECTED_WORKFLOW"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          parent() {
            git cat-file -p "$1" | awk 'BEGIN { header=1 } /^$/ { header=0 } header && /^parent / { print $2 }'
          }
          test "$(parent "$GITHUB_SHA")" = "$REQUESTED_CANDIDATE"
          test "$(parent "$REQUESTED_CANDIDATE")" = b5aa51bf91e4642b16657a5deeaca311f8b5f250
          test "$(parent b5aa51bf91e4642b16657a5deeaca311f8b5f250)" = 51c31c6bfee4d0b6587b644c2aab39c6f3e83a1f
          case "$RUNNER_TEMP" in *$'\n'*|*$'\r'*) exit 1;; esac
          control="$RUNNER_TEMP/initial-ready-control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$control"
          for name in controller.ts controls.test.ts README.md shipping-adapter.ts readiness-parity.ts; do
            install -m 400 ".github/actions/lsp-initial-ready-pair/$name" "$control/$name"
          done
          install -m 400 .github/workflows/lsp-current-baseline.yml "$control/workflow.yml"
          printf 'CONTROL_DIRECTORY=%s\n' "$control" >> "$GITHUB_ENV"
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install exact original JavaScript stacks
        run: vp install --frozen-lockfile --prefer-offline
      - name: Install original isolated comparison provider
        working-directory: tests/_fixtures/performance/lsp-dual-server/provider
        run: vp install --frozen-lockfile --prefer-offline
      - name: Strict typed controller and synthetic refusal controls
        shell: bash
        run: |
          set -euo pipefail
          compiler=node_modules/.pnpm/typescript@6.0.3/node_modules/typescript/lib/tsc.js
          node "$compiler" --version > "$CONTROL_DIRECTORY/strict-version.txt"
          node "$compiler" --ignoreConfig --strict --noEmit --noUnusedLocals --noUnusedParameters --noImplicitAny \
            --noUncheckedIndexedAccess --exactOptionalPropertyTypes --erasableSyntaxOnly \
            --target es2023 --module esnext --moduleResolution bundler \
            --allowImportingTsExtensions --skipLibCheck --types node \
            --typeRoots "$PWD/node_modules/@types" \
            "$CONTROL_DIRECTORY/controller.ts" "$CONTROL_DIRECTORY/controls.test.ts" "$CONTROL_DIRECTORY/shipping-adapter.ts" "$CONTROL_DIRECTORY/readiness-parity.ts" \
            > "$CONTROL_DIRECTORY/strict.stdout" 2> "$CONTROL_DIRECTORY/strict.stderr"
          node --test "$CONTROL_DIRECTORY/controls.test.ts" \
            > "$CONTROL_DIRECTORY/controls.stdout" 2> "$CONTROL_DIRECTORY/controls.stderr"
      - name: Install the unchanged repository Rust toolchain
        run: rustup toolchain install || rustup show active-toolchain
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - name: Fresh normal release B/C builds; common17 plus C clock6 and both-role native2; original ABBA
        run: vp exec node "$CONTROL_DIRECTORY/controller.ts"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: lsp-initial-ready-abba-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/initial-ready-control-${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ runner.temp }}/initial-ready-comparison-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
