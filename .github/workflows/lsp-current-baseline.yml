name: Temporary reviewed Misskey legacy RSS diagnostic

# REVIEW ARTIFACT ONLY. Reuse the existing dispatch path on an isolated branch.
# Never cherry-pick this workflow to main. After qualification, restore that path
# from its original reviewed commit; the production fix is a separate commit.
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Immutable ordinary source baseline
        required: true
        default: 8fb898f36d8a6858fff4b3f16d286e49ad2ed965
        type: string
      candidate_sha:
        description: Immutable reviewed source-only candidate
        required: true
        default: 106251f048c1dc39cd50c0c23e93420963e4b163
        type: string
      workflow_ref:
        description: Exact commit executing this temporary workflow
        required: true
        type: string

permissions: { contents: read }
concurrency:
  group: misskey-legacy-rss-${{ inputs.workflow_ref }}-${{ github.run_id }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
  RAYON_NUM_THREADS: "4"
  CARGO_INCREMENTAL: "0"
  VIZE_PERF_BUDGET_SCALE: "1"

jobs:
  observe:
    name: Legacy RSS (${{ matrix.role }})
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: { role: [base, candidate] }
    env:
      BASE_SHA: ${{ inputs.base_sha }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      WORKFLOW_SHA: ${{ inputs.workflow_ref }}
      EXECUTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
      ROLE: ${{ matrix.role }}
      SOURCE_SHA: ${{ matrix.role == 'base' && inputs.base_sha || inputs.candidate_sha }}
      VIZE_LSP_BIN: target/ci/vize
    steps:
      - name: Refuse mutable, stale, or unrelated dispatch authorities
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          for sha in "$BASE_SHA" "$CANDIDATE_SHA" "$WORKFLOW_SHA"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          done
          test "$BASE_SHA" = 8fb898f36d8a6858fff4b3f16d286e49ad2ed965
          test "$CANDIDATE_SHA" = 106251f048c1dc39cd50c0c23e93420963e4b163
          test "$BASE_SHA" != "$CANDIDATE_SHA"
          test "$WORKFLOW_SHA" = "$EXECUTED_WORKFLOW_SHA"
          test "$GITHUB_SHA" = "$WORKFLOW_SHA"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$RUNNER_OS" = Linux
          echo "EVIDENCE=$RUNNER_TEMP/misskey-rss-$ROLE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/misskey-rss-build-$ROLE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { ref: "${{ env.SOURCE_SHA }}", fetch-depth: 1, persist-credentials: false }
      - name: Verify immutable role and identical original harnesses
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$EVIDENCE"
          mkdir -m 700 "$EVIDENCE"
          test ! -e "$CARGO_TARGET_DIR"
          test ! -e target
          mkdir -m 700 "$CARGO_TARGET_DIR"
          ln -s "$CARGO_TARGET_DIR" target
          printf 'initially absent: %s/ci/vize and receipt\n' "$CARGO_TARGET_DIR" > "$EVIDENCE/initial-output-absence.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$CANDIDATE_SHA" "$WORKFLOW_SHA"
          test "$(git cat-file -p "$CANDIDATE_SHA" | sed -n 's/^parent //p')" = "$BASE_SHA"
          test "$(git cat-file -p "$WORKFLOW_SHA" | sed -n 's/^parent //p')" = "$CANDIDATE_SHA"
          git diff --name-only "$CANDIDATE_SHA" "$WORKFLOW_SHA" > "$EVIDENCE/workflow-only-paths.txt"
          while IFS= read -r changed; do
            case "$changed" in
              .github/workflows/lsp-current-baseline.yml|.github/actions/lsp-rss-diagnostic/custody.ts|.github/actions/lsp-rss-diagnostic/source-census.ts|.github/actions/lsp-rss-diagnostic/results.ts) ;;
              *) echo "Foreign workflow-only path: $changed" >&2; exit 1 ;;
            esac
          done < "$EVIDENCE/workflow-only-paths.txt"
          git diff --exit-code "$BASE_SHA" "$CANDIDATE_SHA" -- \
            Cargo.toml Cargo.lock \
            tests/performance tests/_helpers tests/tooling/support/lsp tests/differential \
            tests/_fixtures/vue-ecosystem-fixtures.json tests/package.json \
            tools/support/compat/davinci tools/config/vite-plus \
            .github/actions/check-vue-parity/action.yml \
            package.json pnpm-lock.yaml pnpm-workspace.yaml vite.config.ts vite-plus.config.ts
          git rev-parse HEAD HEAD^{tree} > "$EVIDENCE/source-and-tree.txt"
          git show --no-patch --format=raw HEAD > "$EVIDENCE/source-commit.txt"
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with: { node-version-file: package.json, cache: true, run-install: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - name: Install unchanged providers and hydrate pinned inputs
        shell: bash
        run: |
          set -euo pipefail
          vp install --frozen-lockfile --prefer-offline
          git submodule update --init --depth 1 -- \
            tests/_fixtures/_git/misskey tests/_fixtures/_git/vue-vben-admin
          for fixture in misskey vue-vben-admin; do
            path="tests/_fixtures/_git/$fixture"
            expected=$(git ls-tree HEAD "$path" | awk '{print $3}')
            test "$(git -C "$path" rev-parse HEAD)" = "$expected"
            test -z "$(git -C "$path" status --porcelain --untracked-files=all)"
            printf '%s %s\n' "$fixture" "$expected" >> "$EVIDENCE/fixture-gitlinks.txt"
          done
      - name: Build original FullVue legacy CLI and fresh role receipt
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$CARGO_TARGET_DIR/ci/vize"
          test ! -e "$CARGO_TARGET_DIR/ci/vize.differential-build.json"
          cargo build --profile ci -p vize --features legacy
          node tests/differential/build-receipt.ts --legacy
          cp target/ci/vize.differential-build.json "$EVIDENCE/legacy-build-receipt.json"
          sha256sum target/ci/vize > "$EVIDENCE/source-build-image.sha256"
          test ! -e "$CARGO_TARGET_DIR/measured-build-vize"
          cp target/ci/vize "$CARGO_TARGET_DIR/measured-build-vize"
          cargo test --profile ci -p vize_maestro --features legacy --lib \
            ide::workspace_symbols::tests::macro_declaration_range_targets_quoted_name_content \
            -- --exact --nocapture \
            > "$EVIDENCE/workspace-symbols.stdout" 2> "$EVIDENCE/workspace-symbols.stderr"
          grep -Fqx 'test ide::workspace_symbols::tests::macro_declaration_range_targets_quoted_name_content ... ok' "$EVIDENCE/workspace-symbols.stdout"
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;' "$EVIDENCE/workspace-symbols.stdout"
          sha256sum target/ci/vize > "$EVIDENCE/post-library-unit-cli-image.sha256"
          test ! -e "$CARGO_TARGET_DIR/post-library-unit-vize"
          mv target/ci/vize "$CARGO_TARGET_DIR/post-library-unit-vize"
          mv "$CARGO_TARGET_DIR/measured-build-vize" target/ci/vize
          sha256sum --check "$EVIDENCE/source-build-image.sha256"
          cp crates/vize_maestro/src/ide/workspace_symbols/tests.rs "$EVIDENCE/focused-oracle-source.rs"
          if test -f crates/vize_maestro/src/ide/workspace_symbols/contracts.rs; then
            cp crates/vize_maestro/src/ide/workspace_symbols/contracts.rs "$EVIDENCE/contracts-source.rs"
          fi
      - name: Stage exact reviewed strict TypeScript diagnostic helpers
        shell: bash
        run: |
          set -euo pipefail
          for helper in custody source-census results; do
            git show "$WORKFLOW_SHA:.github/actions/lsp-rss-diagnostic/$helper.ts" > "$EVIDENCE/$helper.ts"
          done
          sha256sum "$EVIDENCE/"*.ts > "$EVIDENCE/helper-sha256.txt"
          compiler=node_modules/.pnpm/typescript@6.0.3/node_modules/typescript/lib/tsc.js
          test -f "$compiler"
          node "$compiler" --version > "$EVIDENCE/strict-tsc-version.txt"
          node "$compiler" --ignoreConfig --strict --noEmit --noImplicitAny \
            --noUncheckedIndexedAccess --exactOptionalPropertyTypes --erasableSyntaxOnly --target ES2022 \
            --module ESNext --moduleResolution Bundler --esModuleInterop --skipLibCheck \
            --types node --typeRoots "$GITHUB_WORKSPACE/node_modules/@types" \
            "$EVIDENCE/custody.ts" "$EVIDENCE/source-census.ts" "$EVIDENCE/results.ts" \
            > "$EVIDENCE/strict-tsc.stdout" 2> "$EVIDENCE/strict-tsc.stderr"
      - name: Record immutable runtime and all-harness custody
        shell: bash
        run: |
          node "$EVIDENCE/custody.ts" before
          cat /proc/cpuinfo > "$EVIDENCE/cpuinfo.txt"
          env | sort | grep -E '^(RAYON_|GOMAXPROCS|CARGO_INCREMENTAL|RUSTFLAGS|VIZE_PERF_)' \
            > "$EVIDENCE/measurement-env.txt"
      - name: Supplementary hydrated filesystem census (not compiler proof)
        run: node "$EVIDENCE/source-census.ts"
      - name: Original incremental controls then three independent original churn sessions
        shell: bash
        run: |
          set -euo pipefail
          observe() {
            local label="$1" task="$2" code
            mkdir -p "$EVIDENCE/$label"
            node "$EVIDENCE/custody.ts" before
            for suite in misskey-lsp-incremental vben-lsp-incremental misskey-lsp-churn; do
              if test -d "target/vize-tests/metrics/$suite"; then
                mv "target/vize-tests/metrics/$suite" "$EVIDENCE/$label/prior-$suite"
              fi
            done
            set +e
            vp run --no-cache --filter './tests' "$task" \
              > "$EVIDENCE/$label/stdout.txt" 2> "$EVIDENCE/$label/stderr.txt"
            code=$?
            set -e
            printf '{"exitCode":%s}\n' "$code" > "$EVIDENCE/$label/exit.json"
            if test -d target/vize-tests/metrics; then
              cp -R target/vize-tests/metrics "$EVIDENCE/$label/metrics"
            else
              printf 'metrics directory absent\n' > "$EVIDENCE/$label/metrics-missing.txt"
            fi
            node "$EVIDENCE/custody.ts" after
            cp "$EVIDENCE/after.json" "$EVIDENCE/$label/custody-after.json"
          }
          observe incremental test:performance:lsp-incremental
          for session in 1 2 3; do observe "churn-$session" test:performance:lsp-churn; done
      - name: Recheck sources, provider, fixtures and every candidate result
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          node "$EVIDENCE/custody.ts" after
          test -z "$(git status --porcelain --untracked-files=no)"
          for fixture in misskey vue-vben-admin; do
            test -z "$(git -C tests/_fixtures/_git/$fixture status --porcelain --untracked-files=all)"
          done
          node "$EVIDENCE/results.ts"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: misskey-legacy-rss-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.SOURCE_SHA }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: error
          retention-days: 14
