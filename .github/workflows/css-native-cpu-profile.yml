name: Native CSS CPU samples
on:
  workflow_dispatch:
  push:
    branches: ["test/css-native-cpu-profile"]
    paths:
      - ".github/workflows/css-native-cpu-profile.yml"
      - "tools/benchmarks/scripts/css-native-cpu-profile.mjs"
      - "tools/benchmarks/scripts/css-native-attribution.mjs"
      - "tests/tooling/css-native-cpu-profile.test.mjs"
permissions:
  contents: read
  actions: read
concurrency:
  group: css-native-cpu-${{ github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  samples:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.deleted }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24.14.0" }
      - name: Install the Linux software-event sampler
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-common linux-tools-generic binutils
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const depends = execFileSync('dpkg-query', ['-W', '-f', '${Depends}', 'linux-tools-generic'], {encoding:'utf8'});
          const packages = [...new Set(depends.match(/linux-tools-[0-9][a-zA-Z0-9.+-]*-generic/gu))];
          assert.equal(packages.length, 1, 'the installed generic package must select exactly one implementation');
          const files = execFileSync('dpkg-query', ['-L', packages[0]], {encoding:'utf8'})
            .split('\n').filter(file => file.endsWith('/perf')).map(file => fs.realpathSync(file));
          assert.equal(files.length, 1, 'actual perf implementation must be unambiguous');
          fs.appendFileSync(process.env.GITHUB_ENV, `VIZE_CSS_PERF=${files[0]}\n`);
          JS
      - name: Verify the unchanged workload and source custody controls
        run: node --test tests/tooling/css-native-attribution.test.mjs tests/tooling/css-native-cpu-profile.test.mjs
      - name: Sample the actual original images without rebuilding product code
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/benchmarks/scripts/css-native-cpu-profile.mjs target/css-native-cpu-profile
      - name: Retain raw samples, every workload result, identities and permission failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: css-native-cpu-${{ github.sha }}-${{ github.run_id }}
          path: target/css-native-cpu-profile/
          if-no-files-found: error
          retention-days: 14
