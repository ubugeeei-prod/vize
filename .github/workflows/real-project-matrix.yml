name: Real Project Matrix
# "enforced" gates every surface. "release-gated" is the exact release dispatch:
# tool surfaces and the Davinci corpus enforce, lint and LSP parity record their
# raw outcomes, and typecheck divergence is skipped. Every other combination is
# "observational".
run-name: >-
  Real Project Matrix ${{ inputs.project && 'scoped-diagnostic' || (inputs.core_tools_mode || 'enforce') == 'enforce' &&
  (inputs.typecheck_dependencies_mode || 'enforce') == 'enforce' &&
  (inputs.davinci_dom_corpus_mode || 'enforce') == 'enforce' &&
  ((inputs.lint_divergence_mode || 'enforce') == 'enforce' &&
  (inputs.lsp_mode || 'enforce') == 'enforce' &&
  (inputs.typecheck_divergence_mode || 'enforce') == 'enforce' &&
  'enforced' ||
  (inputs.lint_divergence_mode || 'enforce') == 'record-only' &&
  (inputs.lsp_mode || 'enforce') == 'record-only' &&
  (inputs.typecheck_divergence_mode || 'enforce') == 'skip' &&
  'release-gated') || 'observational' }} @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Optional exact fixture ID for a scoped diagnostic; empty runs the full matrix"
        required: false
        default: ""
        type: string
      core_tools_mode:
        description: "Core tool surface handling"
        required: false
        default: "enforce"
        type: choice
        options:
          - enforce
          - record-only
      core_tools_timeout_ms:
        description: "Per-project core tool timeout in milliseconds"
        required: false
        default: "2400000"
        type: string
      typecheck_dependencies_mode:
        description: "Typecheck baseline dependency preparation handling"
        required: false
        default: "enforce"
        type: choice
        options:
          - enforce
          - record-only
      lint_divergence_mode:
        description: "Patina lint divergence gate handling"
        required: false
        default: "enforce"
        type: choice
        options:
          - enforce
          - record-only
      lsp_mode:
        description: "LSP lifecycle gate handling"
        required: false
        default: "enforce"
        type: choice
        options:
          - enforce
          - record-only
      typecheck_divergence_mode:
        description: "Typechecker baseline divergence gate handling"
        required: false
        default: "enforce"
        type: choice
        options:
          - enforce
          - record-only
          - skip
      davinci_dom_corpus_mode:
        description: "Davinci L2 DOM corpus gate handling"
        required: false
        default: "enforce"
        type: choice
        options:
          - enforce
          - record-only
  schedule:
    # Nightly full ecosystem sweep. Manual dispatches provide on-demand release evidence.
    - cron: "37 5 * * *"

concurrency:
  group: real-project-matrix-${{ github.ref }}${{ inputs.project && format('-scoped-{0}', inputs.project) || '' }}
  cancel-in-progress: true

permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan-projects:
    name: select ecosystem projects
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.projects.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false, ref: "${{ github.sha }}" }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: "package.json", package-manager-cache: false }
      - name: Name every project in its fixture partition
        id: projects
        env:
          SELECTED_PROJECT: ${{ inputs.project || '' }}
        run: node tools/support/compat/github/real-project-matrix-plan.ts matrix --project "$SELECTED_PROJECT"

  real-project-matrix:
    name: real projects (${{ matrix.name }})
    needs: plan-projects
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # The hosted release fallback must fit the documented Free plan floor:
      # 20 concurrent standard hosted jobs, so 22 shards can take two waves.
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan-projects.outputs.matrix) }}
    env:
      FIXTURE_SHARD_COUNT: ${{ matrix.shardCount || '22' }}
      FIXTURE_SHARD_INDEX: ${{ matrix.shard }}
      FIXTURE_REPORT_DIR: real-project-results/shard-${{ matrix.shard }}
    steps:
      - name: Checkout matrix commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: ./.github/actions/setup-rust-script
      - name: Enable package manager shims
        run: corepack enable

      - name: Select and hydrate fixture shard
        shell: bash
        run: |
          mapfile -t fixture_paths < <(
            rust-script tools/commands/fixtures/tool-matrix-report.rs \
              --list-fixture-paths \
              --shard-index "$FIXTURE_SHARD_INDEX" \
              --shard-count "$FIXTURE_SHARD_COUNT"
          )
          if (( ${#fixture_paths[@]} == 0 )); then
            echo "::error title=Empty fixture shard::shard $FIXTURE_SHARD_INDEX selected no projects"
            exit 1
          fi
          mkdir -p "$FIXTURE_REPORT_DIR"
          printf '%s\n' "${fixture_paths[@]}" > "$FIXTURE_REPORT_DIR/selected-fixtures.txt"
          git submodule update --init --depth 1 -- "${fixture_paths[@]}"

      - name: Install pinned typecheck baseline dependencies
        id: typecheck_dependencies
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          rust-script tools/commands/fixtures/typecheck-dependency-prepare.rs \
            --output-dir "$FIXTURE_REPORT_DIR" \
            --shard-index "$FIXTURE_SHARD_INDEX" \
            --shard-count "$FIXTURE_SHARD_COUNT" \
            --timeout-ms 600000

      - name: Audit formatter waiver owners
        id: waiver_audit
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rust-script tools/commands/fixtures/glyph-corpus-waiver-audit.rs \
            --output "$FIXTURE_REPORT_DIR/glyph-waiver-issues.json"

      - name: Setup Wild linker
        uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"

      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: real-project-matrix-${{ matrix.shard }}
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}

      - name: Install JavaScript dependencies
        run: vp install --frozen-lockfile --prefer-offline
      # v0.450.0 lost a shard to a stalled crates.io download; retry only the fetch.
      - name: Fetch Rust dependencies
        env: { CARGO_NET_RETRY: "10" }
        run: |
          for attempt in 1 2 3; do
            cargo fetch --locked --target "$(rustc -vV | sed -n 's/^host: //p')" && exit 0
            echo "::warning title=crates.io fetch::attempt $attempt failed"
            sleep $((attempt * 30))
          done
          exit 1
      - name: Build Vize CLI
        run: cargo build --profile ci -p vize
      - name: Classify pinned Misskey generated diagnostics
        if: ${{ !cancelled() && contains(matrix.name, 'misskey') }}
        env:
          CORSA_PATH: ${{ github.workspace }}/node_modules/@typescript/typescript-linux-x64/lib/tsc
          VIZE_TEST_MISSKEY_GENERATED_DIAGNOSTICS_9516: "1"
          VIZE_TEST_REQUIRE_TSGO: "1"
          VIZE_TEST_FIX_HISTORY_CAPTURE_DIR: ${{ github.workspace }}/${{ env.FIXTURE_REPORT_DIR }}/misskey-generated-diagnostics-9516
        run: >-
          cargo test --locked --profile ci -p vize_canon --lib
          pinned_misskey_preserves_current_and_tuple_diagnostic_boundaries
          -- --nocapture --test-threads=1
      - name: Exercise real projects with every core tool
        id: core_tools
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 60 # Green shards take at most 14 min; one project may use its 40.
        env:
          CORE_TOOLS_TIMEOUT_MS: ${{ inputs.core_tools_timeout_ms || '2400000' }}
        run: |
          rust-script tools/commands/fixtures/tool-matrix-report.rs \
            --shard-index "$FIXTURE_SHARD_INDEX" \
            --shard-count "$FIXTURE_SHARD_COUNT" \
            --vize-bin target/ci/vize \
            --timeout-ms "$CORE_TOOLS_TIMEOUT_MS" \
            --output-dir "$FIXTURE_REPORT_DIR"

      - name: Check real-project LSP lifecycle
        id: lsp
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 30 # Green shards take at most 11 min.
        env:
          CORSA_PATH: ${{ github.workspace }}/node_modules/@typescript/typescript-linux-x64/lib/tsc
          REAL_PROJECT_LSP_TIMEOUT_MS: "600000"
          VIZE_LSP_BIN: target/ci/vize
          VIZE_LSP_REQUIRE_SOURCE_BUILD: "1"
          VIZE_LSP_BUILD_RECIPE: "cargo build --profile ci -p vize"
        run: |
          node tests/differential/build-receipt.ts
          node tests/tooling/support/lsp/verify-session-captures.ts snapshot "$FIXTURE_REPORT_DIR/lsp-wire-before.json"
          printf '%s\n' 'Lifecycle timings include passive raw RPC recording; they are not paired performance acceptance.' > "$FIXTURE_REPORT_DIR/lsp-wire-timing-policy.txt"
          if [ ! -x "$CORSA_PATH" ]; then
            echo "::error title=Missing typecheck runtime::vp install produced no executable at $CORSA_PATH"
            exit 1
          fi
          node --test --test-concurrency=1 \
            tests/tooling/real-project-lsp.test.ts
          test -s "$FIXTURE_REPORT_DIR/lsp-lifecycle-summary.json"

      - name: Validate source-bound LSP wire
        if: ${{ always() }}
        run: node tests/tooling/support/lsp/verify-session-captures.ts verify "$FIXTURE_REPORT_DIR/lsp-wire-before.json" "$FIXTURE_REPORT_DIR/lsp-wire-integrity.json"

      - name: Measure real-project lint divergence
        id: lint_divergence
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          LINT_DIVERGENCE_MODE: ${{ inputs.lint_divergence_mode || 'enforce' }}
        run: |
          node tools/commands/fixtures/lint-divergence-report.ts \
            --shard-index "$FIXTURE_SHARD_INDEX" \
            --shard-count "$FIXTURE_SHARD_COUNT" \
            --measure-coverage-gap \
            --budget-mode "$LINT_DIVERGENCE_MODE" \
            --vize-bin target/ci/vize \
            --timeout-ms 600000 \
            --output-dir "$FIXTURE_REPORT_DIR"
          test -s "$FIXTURE_REPORT_DIR/lint-divergence-summary.json"

      - name: Check real-project syntax highlighting
        id: syntax_highlighter
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SYNTAX_HIGHLIGHTER_ORACLE_TIMEOUT_MS: "600000"
        run: |
          node --test --test-concurrency=1 \
            tests/tooling/real-project-syntax-highlighting.test.ts
          test -s "$FIXTURE_REPORT_DIR/syntax-highlighter-divergence.json"
          test -s "$FIXTURE_REPORT_DIR/syntax-highlighter-divergence.md"

      - name: Check glyph formatter corpus properties
        id: glyph
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          VIZE_TEST_BIN: target/ci/vize
        shell: bash
        run: |
          glyph_exit_code=0
          node --test --test-concurrency=1 \
            tests/tooling/sfc-baseline-routes.test.ts \
            tests/tooling/sfc-baselines.test.ts \
            tests/tooling/vue2-render-signature.test.ts \
            tests/tooling/glyph-sfc-evidence.test.ts \
            tests/tooling/sfc-equivalence.test.ts \
            tests/tooling/glyph-corpus-idempotence.test.ts \
            tests/tooling/glyph-corpus-parse-preservation.test.ts \
            tests/tooling/glyph-pug-oracle.test.ts tests/tooling/davinci-pug-corpus-oracle.test.ts \
            tests/tooling/glyph-corpus-lint-agreement.test.ts || glyph_exit_code=$?
          for property in idempotence parse-preservation lint-agreement; do
            if [[ ! -s "$FIXTURE_REPORT_DIR/glyph-$property.json" ]]; then
              echo "::error title=Missing formatter evidence::$property produced no artifact"
              glyph_exit_code=1
            fi
          done
          if [[ ! -s "$FIXTURE_REPORT_DIR/glyph-pug-semantics.json" ]]; then
            echo "::error title=Missing formatter evidence::Pug semantic oracle produced no artifact"
            glyph_exit_code=1
          fi
          if [[ ! -s "$FIXTURE_REPORT_DIR/glyph-sfc-dialect-equivalence.json" ]]; then
            echo "::error title=Missing formatter evidence::SFC dialect oracle produced no artifact"
            glyph_exit_code=1
          fi
          exit "$glyph_exit_code"
      - name: Record formatter deletion-readiness evidence
        if: ${{ !cancelled() }}
        run: |
          node tests/differential/formatter-deletion-verifier.mjs "$FIXTURE_REPORT_DIR"
          test -s "$FIXTURE_REPORT_DIR/formatter-deletion-readiness.json"
      - name: Enforce typechecker baseline divergence
        id: typecheck_divergence
        if: ${{ !cancelled() && (inputs.typecheck_divergence_mode || 'enforce') != 'skip' }}
        continue-on-error: true
        timeout-minutes: 100
        env:
          BUDGET_MODE: ${{ inputs.typecheck_divergence_mode || 'enforce' }}
          VIZE_TYPECHECK_DIVERGENCE_PROGRESS: "1"
        run: |
          rust-script tools/commands/fixtures/typecheck-divergence-report.rs \
            --report-dir "$FIXTURE_REPORT_DIR" \
            --shard-index "$FIXTURE_SHARD_INDEX" \
            --shard-count "$FIXTURE_SHARD_COUNT" \
            --budget-mode "$BUDGET_MODE" \
            --vize-bin target/ci/vize \
            --vue-tsc-bin tests/node_modules/.bin/vue-tsc
      - name: Enforce all real-project surface verdicts
        id: surface_verdict
        if: ${{ always() }}
        shell: bash
        env:
          CORE_TOOLS_MODE: ${{ inputs.core_tools_mode || 'enforce' }}
          TYPECHECK_DEPENDENCIES_MODE: ${{ inputs.typecheck_dependencies_mode || 'enforce' }}
          LINT_DIVERGENCE_MODE: ${{ inputs.lint_divergence_mode || 'enforce' }}
          LSP_MODE: ${{ inputs.lsp_mode || 'enforce' }}
          TYPECHECK_DIVERGENCE_MODE: ${{ inputs.typecheck_divergence_mode || 'enforce' }}
          VIZE_WAIVER_AUDIT_OUTCOME: ${{ steps.waiver_audit.outcome }}
          VIZE_TYPECHECK_DEPENDENCIES_OUTCOME: ${{ steps.typecheck_dependencies.outcome }}
          VIZE_CORE_TOOLS_OUTCOME: ${{ steps.core_tools.outcome }}
          VIZE_LSP_OUTCOME: ${{ steps.lsp.outcome }}
          VIZE_LINT_DIVERGENCE_OUTCOME: ${{ steps.lint_divergence.outcome }}
          VIZE_SYNTAX_HIGHLIGHTER_OUTCOME: ${{ steps.syntax_highlighter.outcome }}
          VIZE_GLYPH_OUTCOME: ${{ steps.glyph.outcome }}
          VIZE_TYPECHECK_DIVERGENCE_OUTCOME: ${{ steps.typecheck_divergence.outcome }}
        run: rust-script tools/commands/fixtures/real-project-surface-verdict.rs --from-workflow-env --output "$FIXTURE_REPORT_DIR/surface-verdict.json"

      - name: Publish shard summary
        if: ${{ always() }}
        shell: bash
        run: rust-script tools/commands/ci/github/publish-real-project-shard-summary.rs

      - name: Upload shard report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-project-matrix-${{ matrix.shard }}
          path: ${{ env.FIXTURE_REPORT_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload source-bound LSP wire evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-project-lsp-wire-${{ matrix.shard }}-${{ github.sha }}
          path: |
            target/differential/lsp-sessions
            target/ci/vize.differential-build.json
          if-no-files-found: error
          retention-days: 30

  davinci-dom-corpus:
    permissions: { contents: read, actions: read, checks: read }
    uses: ./.github/workflows/davinci-canonical-corpus.yml
    with:
      davinci_dom_corpus_mode: ${{ inputs.davinci_dom_corpus_mode || 'enforce' }}

  davinci-dom-divergence-issue:
    name: file canonical DOM divergence
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    needs: davinci-dom-corpus
    permissions: { contents: read, actions: read, issues: write }
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout matrix commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false, ref: "${{ github.sha }}" }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: "package.json", package-manager-cache: false }
      - name: Download canonical DOM evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canonical-corpus-dom-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: real-project-davinci-dom-corpus
      - name: File canonical DOM divergence issue
        env: { GH_TOKEN: "${{ github.token }}" }
        run: node tools/support/compat/github/canonical-corpus-divergence-issue.mjs publish real-project-davinci-dom-corpus
