name: Real Project Matrix
run-name: Linux readiness snapshots @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      enforce_divergence_budget:
        description: Compatibility input retained for manual dispatch
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
  VIZE_TEST_WORKTREE_ID: ci-readiness

jobs:
  linux-readiness-snapshots:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/app-readiness
