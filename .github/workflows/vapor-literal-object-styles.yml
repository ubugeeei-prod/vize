name: Vapor literal object styles
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/vize_relief/**"
      - "crates/vize_atelier_core/**"
      - "crates/vize_atelier_vapor/**"
      - "crates/vize_atelier_jsx/**"
      - ".github/workflows/vapor-literal-object-styles.yml"
permissions: { contents: read }
concurrency:
  group: vapor-literal-object-styles-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  styles:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "24"
      CARGO_INCREMENTAL: "0"
      QUALIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: "78719553cf550bcffbf1d0fb891fda642f42de3a"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with: { key: test-scripts, cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}" }
      - name: Observe exact source evaluator and complete compiler packets
        env:
          VIZE_LITERAL_STYLE_CAPTURE: ${{ runner.temp }}/vapor-literal-styles/head.json
          VIZE_LITERAL_STYLE_PROFILE_CAPTURE: ${{ runner.temp }}/vapor-literal-styles/head-profile.json
          VIZE_LITERAL_STYLE_SFC_CAPTURE: ${{ runner.temp }}/vapor-literal-styles/head-sfc.json
          VIZE_LITERAL_STYLE_MAP_CAPTURE: ${{ runner.temp }}/vapor-literal-styles/maps.json
          VIZE_LITERAL_STYLE_REVIEW_CAPTURE: ${{ runner.temp }}/vapor-literal-styles/head-review.json
          VIZE_LITERAL_STYLE_CASE_CAPTURE: ${{ runner.temp }}/vapor-literal-styles/head-attribute-case.json
          VIZE_LITERAL_STYLE_PRIORITY_CAPTURE: ${{ runner.temp }}/vapor-literal-styles/head-priority.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vapor-literal-styles"
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_HEAD_SHA"
          git diff --exit-code
          node --test tests/tooling/vapor-style-api-fixtures.test.mjs tests/tooling/vapor-style-authored-transition.test.ts
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/vapor-literal-styles/head-source.txt"
          cargo test --locked --profile ci -p vize_atelier_jsx --test literal_object_styles --test literal_style_source --test literal_style_sfc --test literal_style_maps -- --nocapture --test-threads=1
      - name: Observe the same inputs against the actual unchanged baseline
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/vapor-literal-style-base"
          observer=crates/vize_atelier_jsx/tests/literal_style_source.rs
          git worktree add --detach "$baseline" "$BASE_SHA"
          cp "$observer" "$baseline/$observer"
          sfc_observer=crates/vize_atelier_jsx/tests/literal_style_sfc.rs
          cp "$sfc_observer" "$baseline/$sfc_observer"
          fixture=tests/_fixtures/differential/compiler/vapor-literal-object-styles-10749
          mkdir -p "$baseline/$fixture"
          cp "$fixture/inputs.json" "$fixture/priority-inputs.json" "$fixture/attribute-case-inputs.json" "$fixture/review-inputs.json" "$fixture/App.vue.txt" "$baseline/$fixture/"
          cmp "$observer" "$baseline/$observer"
          git -C "$baseline" diff --exit-code -- crates/*/src
          (cd "$baseline" && CARGO_TARGET_DIR="$RUNNER_TEMP/vapor-literal-style-base-target" VIZE_LITERAL_STYLE_EXPECT_OLD=1 VIZE_LITERAL_STYLE_PRIORITY_CAPTURE="$RUNNER_TEMP/vapor-literal-styles/base-priority.json" VIZE_LITERAL_STYLE_CASE_CAPTURE="$RUNNER_TEMP/vapor-literal-styles/base-attribute-case.json" VIZE_LITERAL_STYLE_REVIEW_CAPTURE="$RUNNER_TEMP/vapor-literal-styles/base-review.json" VIZE_LITERAL_STYLE_SFC_CAPTURE="$RUNNER_TEMP/vapor-literal-styles/base-sfc.json" VIZE_LITERAL_STYLE_PROFILE_CAPTURE="$RUNNER_TEMP/vapor-literal-styles/base-profile.json" VIZE_LITERAL_STYLE_CAPTURE="$RUNNER_TEMP/vapor-literal-styles/base.json" cargo test --locked --profile ci -p vize_atelier_jsx --test literal_style_source --test literal_style_sfc -- --nocapture --test-threads=1)
          git -C "$baseline" rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/vapor-literal-styles/base-source.txt"
          sha256sum "$observer" "$baseline/$observer" > "$RUNNER_TEMP/vapor-literal-styles/observer.sha256"
      - name: Compare complete packets and explicit authored module successors
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { assertAuthoredStylePackets, assertPreservedStylePacket } from './tests/tooling/support/vapor-style-authored-transition.ts';
          const directory = `${process.env.RUNNER_TEMP}/vapor-literal-styles`;
          const base = JSON.parse(fs.readFileSync(`${directory}/base.json`));
          const head = JSON.parse(fs.readFileSync(`${directory}/head.json`));
          assert.equal(head.length, 180); assert.equal(base.length, head.length);
          const originalHead=JSON.parse(fs.readFileSync('tests/_fixtures/differential/compiler/vapor-literal-object-styles-10749/observed-head.json'));
          assert.equal(originalHead.length,head.length);
          assertAuthoredStylePackets('main',head);
          head.forEach((row,index)=>assertPreservedStylePacket('main',index,originalHead[index].output,row.output));
          const beforeCase=JSON.parse(fs.readFileSync(`${directory}/base-attribute-case.json`));
          const afterCase=JSON.parse(fs.readFileSync(`${directory}/head-attribute-case.json`));
          assert.equal(beforeCase.length,48);assert.equal(afterCase.length,48);
          assertAuthoredStylePackets('attribute-case',afterCase);
          afterCase.forEach((row,index)=>{const previous=beforeCase[index];for(const key of ['id','family','source','standalone','retained','mapped'])assert.deepEqual(row[key],previous[key]);assertPreservedStylePacket('attribute-case',index,previous.output,row.output);});
          let changed = 0;
          for (let index=0; index<head.length; index++) {
            const current=head[index], previous=base[index];
            for (const key of ['id','family','source','retained','mapped','mode','ssr','standalone','fold']) assert.deepEqual(current[key], previous[key]);
            assert.ok(current.expressionReparses <= previous.expressionReparses, `no new expression parsing ${index}`);
            if (!current.fold) assertPreservedStylePacket('main',index,previous.output,current.output);
            else {
              assert.notDeepEqual(current.output, previous.output, `real fold must alter the full packet ${index}`);
              changed++;
            }
            if (current.family==='jsx' && (current.mode==='Vdom' || current.ssr)) {
              assert.equal(current.counters.find(row=>row.name==='relief.inline_style.literal_object_candidates')?.total ?? 0,0);
            }
          }
          const beforeReview=JSON.parse(fs.readFileSync(`${directory}/base-review.json`));
          const afterReview=JSON.parse(fs.readFileSync(`${directory}/head-review.json`));
          assert.equal(beforeReview.length,48); assert.equal(afterReview.length,48);
          assertAuthoredStylePackets('review',afterReview);
          afterReview.forEach((row,index)=>{const previous=beforeReview[index];for(const key of ['id','family','source','standalone','retained','mapped','fold'])assert.deepEqual(row[key],previous[key]);if(row.fold)assert.notDeepEqual(row.output,previous.output);else assertPreservedStylePacket('review',index,previous.output,row.output);});
          const beforePriority=JSON.parse(fs.readFileSync(`${directory}/base-priority.json`));
          const afterPriority=JSON.parse(fs.readFileSync(`${directory}/head-priority.json`));
          assert.equal(beforePriority.length,48);assert.equal(afterPriority.length,48);
          assertAuthoredStylePackets('priority',afterPriority);
          afterPriority.forEach((row,index)=>{const previous=beforePriority[index];for(const key of ['id','family','source','standalone','retained','mapped','fold'])assert.deepEqual(row[key],previous[key]);if(row.fold)assert.notDeepEqual(row.output,previous.output);else assertPreservedStylePacket('priority',index,previous.output,row.output);assert.ok(row.expressionReparses<=previous.expressionReparses);});
          const beforeSfc=JSON.parse(fs.readFileSync(`${directory}/base-sfc.json`));
          const afterSfc=JSON.parse(fs.readFileSync(`${directory}/head-sfc.json`));
          assert.equal(beforeSfc.length,4);assert.equal(afterSfc.length,4);
          assertAuthoredStylePackets('sfc',afterSfc);
          afterSfc.forEach((row,index)=>{const previous=beforeSfc[index];for(const key of ['source','vapor','ssr','fold'])assert.deepEqual(row[key],previous[key]);if(row.fold)assert.notDeepEqual(row.output,previous.output);else assertPreservedStylePacket('sfc',index,previous.output,row.output);});
          const beforeProfile=JSON.parse(fs.readFileSync(`${directory}/base-profile.json`));
          const afterProfile=JSON.parse(fs.readFileSync(`${directory}/head-profile.json`));
          assert.equal(beforeProfile.length,24); assert.equal(afterProfile.length,24);
          const median=xs=>xs.toSorted((a,b)=>a-b)[Math.floor(xs.length/2)];
          const measurements=afterProfile.map((row,index)=>{
            const previous=beforeProfile[index];
            for(const key of ['id','family','source','mode','ssr','standalone','retained','iterationsPerSample']) assert.deepEqual(row[key],previous[key]);
            assert.equal(row.samplesNs.length,9); assert.equal(previous.samplesNs.length,9);
            return {id:row.id,family:row.family,mode:row.mode,ssr:row.ssr,standalone:row.standalone,retained:row.retained,baseMedianNs:median(previous.samplesNs),headMedianNs:median(row.samplesNs),ratio:median(row.samplesNs)/median(previous.samplesNs),baseArenaBytes:previous.arenaBytes,headArenaBytes:row.arenaBytes,baseExpressionReparses:previous.expressionReparses,headExpressionReparses:row.expressionReparses};
          });
          fs.writeFileSync(`${directory}/measurement.json`,JSON.stringify({scope:'CI source full-compile observer including parsing/lowering/codegen/JSON; arena used bytes excludes owned heap; report only',measurements},null,2)+'\n');
          fs.writeFileSync(`${directory}/comparison.json`,JSON.stringify({scope:'source-only; complete raw outputs; explicit authored module successors preserve all other facets; no browser or published artifact credit',rows:head.length,styleFoldChanges:changed,styleConservativeRows:head.length-changed,authoredModuleSuccessors:28,historicalOutputsUnchanged:152},null,2)+'\n');
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: vapor-literal-object-styles-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vapor-literal-styles
          if-no-files-found: error
          retention-days: 14
