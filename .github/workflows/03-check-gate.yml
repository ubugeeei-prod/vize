# DO NOT EDIT. Generated from tools/ci/workflows/03-check-gate/workflow.pkl.
# Edit the Pkl source and run `node tools/commands/generate/repository-config.ts`.
name: Benchmark - Type checking gate

# Fail-closed budget/report job for `vize check` (#3283): tools/benchmarks/scripts/check-gate.mjs
# refuses to emit any timing unless the measured binary reports every planted
# diagnostic in minimal plant projects and in a planted copy of the timed
# corpus, and it records the exact vize/tsgo/vue-tsc/vue versions, entry
# point, file count, byte count, per-row diagnostic counts, and backend
# readiness with the artifact. The full Check workflow runs the fixture parity
# suite on main and by dispatch; this lane also requires planted diagnostics
# before publishing any timing.

on:
  workflow_dispatch:
    inputs:
      check_file_count:
        description: Generated SFC files for the measured corpus
        required: true
        default: "500"
      runs:
        description: Measured runs per row
        required: true
        default: "5"
      warmups:
        description: Warmup runs per row
        required: true
        default: "2"
  schedule:
    # Weekly report cadence refreshes the throughput/readiness artifact.
    - cron: "17 6 * * 1"

concurrency:
  group: check-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VIZE_CHECK_BENCH_FILE_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.check_file_count || '500' }}
  VIZE_CHECK_BENCH_RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.runs || '5' }}
  VIZE_CHECK_BENCH_WARMUPS: ${{ github.event_name == 'workflow_dispatch' && inputs.warmups || '2' }}

jobs:
  check-bench:
    name: check-bench
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /tools/ci/lib/scripts/
            /tools/ci/workflows/03-check-gate/scripts/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - name: Checkout benchmark commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }

      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"

      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: check-bench
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}

      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false

      - name: Test check benchmark report helpers
        run: node --test tools/benchmarks/scripts/check-gate-report.test.ts

      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline

      # Same ci-opt settings the PR benchmark measures under, injected via
      # --config so the profile does not need to exist in Cargo.toml.
      - name: Build Vize CLI
        run: >-
          cargo build --profile ci-opt -p vize
          --config 'profile.ci-opt.inherits="release"'
          --config 'profile.ci-opt.lto="thin"'
          --config 'profile.ci-opt.codegen-units=16'

      - name: Generate benchmark corpus
        run: node tools/benchmarks/scripts/generate.mjs "$VIZE_CHECK_BENCH_FILE_COUNT"

      - name: Run the fail-closed check benchmark gate
        env:
          VIZE_BENCHMARK_REVISION: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          VIZE_BENCH_REF: ${{ github.ref_name }}
        run: . "${{ env.VIZE_CI_FILES }}/run-the-fail-closed-check-benchmark-gate.sh"

      - name: Write job summary
        run: . "${{ env.VIZE_CI_FILES }}/write-job-summary.sh"

      - name: Upload check benchmark gate results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-bench-gate
          path: |
            check-gate-summary.md
            check-gate-results.json
          if-no-files-found: error
          retention-days: 30
