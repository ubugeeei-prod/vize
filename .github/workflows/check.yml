name: Check
run-name: Braces lock and installed source capture @ ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: braces-lock-capture-${{ github.sha }}
  cancel-in-progress: false
jobs:
  braces-lock-capture:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 3
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Verify original source and lock identity
        run: vp node tools/support/ci/braces-lock-capture.ts before
      - name: Retain the complete reviewed Braces-only lock projection and diff
        run: vp node tools/support/ci/braces-lock-capture.ts after-lock
      - name: Install the reviewed lock projection without lifecycle scripts
        run: vp install --frozen-lockfile --ignore-scripts --prefer-offline
      - name: Retain the complete original production audit before package validation
        run: vp node tools/support/ci/braces-lock-capture.ts audit
      - name: Prove every installed module and preserve the Forge proof
        run: vp node tools/support/ci/braces-lock-capture.ts installed
