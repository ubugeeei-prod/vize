name: Check
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Check full @ {0}', github.sha) || format('Check {0} @ {1}', github.event_name, github.sha) }}
on:
  push:
    branches: [main, davinci]
  pull_request: {}
  merge_group:
    types: [checks_requested]
    branches: [main]
  schedule:
    # Daily 03:11 UTC, staggered from native smoke and e2e.
    - cron: "11 3 * * *"
  workflow_dispatch:
    inputs:
      compare-rust-test-profile:
        description: Also run the original test profile and require exact same-source ci parity
        type: boolean
        required: false
        default: false
concurrency:
  # A push to main must not cancel an exact-SHA full validation used by release.
  group: check-v3-${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && format('full-{0}', github.sha) || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true
permissions: { contents: read }
env: { CARGO_TERM_COLOR: always, FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true }
jobs:
  iteration-plan:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 2
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      dependencies: ${{ steps.plan.outputs.dependencies }}
      engines: ${{ steps.plan.outputs.engines }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - id: plan
        name: Select product and dependency checks
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/support/compat/github/plan-check-inputs.ts
  pr-source-checks:
    name: PR source checks
    permissions: { contents: read, actions: read, checks: read }
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: ./.github/workflows/pr-source-checks.yml
  instruction-counts:
    name: Instruction ceilings
    if: ${{ github.event_name == 'merge_group' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/level-instruction-counts.yml
  level-dependency-direction:
    uses: ./.github/workflows/level-dependencies.yml
  release-integration-catalog:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    permissions: { contents: read, pull-requests: read }
    uses: ./.github/workflows/release-integration-catalog.yml
  nix-flake:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/check-nix
  fmt-rust:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable, components: rustfmt }
      - name: Format Rust
        run: cargo fmt --all -- --check
  check-js:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions: { contents: read, actions: read }
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { fetch-depth: 2 }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - name: Guard legacy crate deletion
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: vp node tools/support/compat/davinci/legacy-deletion-guard.mjs
      - name: Check Davinci source inventories
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        uses: ./.github/actions/check-level-inventories
      - uses: ./.github/actions/setup-js-check-runtime
        with:
          {
            full: "${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}",
          }
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Check JS/TS
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: ./node_modules/@typescript/typescript-linux-x64/lib/tsc --noEmit --pretty false --project docs/tsconfig.json && vp run --no-cache --filter './npm/native' build:debug && vp run --workspace-root check:ci
      - name: Check fast JS/TS
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push' }}
        run: vp run --workspace-root check:iteration
  semver-checks:
    name: cargo-semver-checks (${{ matrix.crate }})
    # Check published APIs before tag promotion and when resuming an exact release tag.
    if: ${{ github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/heads/release/v') || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 25
    permissions: { contents: read }
    # Keep this list in sync with crates published by tools/support/release/publish_crates.
    strategy:
      fail-fast: false
      matrix:
        crate:
          - vize_armature
          - vize_atelier_core
          - vize_atelier_dom
          - vize_atelier_sfc
          - vize_atelier_ssr
          - vize_atelier_vapor
          - vize_carton
          - vize_croquis
          - vize_fresco
          - vize_musea
          - vize_relief
          - vize_l1_to_l2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: 1.99.0 }
      - uses: ./.github/actions/setup-rust-script
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: "package.json", package-manager-cache: false }
      - name: Use candidate version for SemVer classification
        # cargo-semver-checks derives the release type from the bumped version.
        run: |
          : > "$RUNNER_TEMP/semver-change-marker.txt"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: semver-checks
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        with:
          tool: cargo-semver-checks@0.51.0 # 0.50.0+ reads the rustdoc JSON v61 of Rust 1.99
      - name: Check public API SemVer compatibility
        env:
          BASELINE_REV: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before || '') }}
          RUSTUP_TOOLCHAIN: 1.99.0
        run: bash tools/commands/ci/github/check-semver.sh "${{ matrix.crate }}"
  security-audit:
    needs: iteration-plan
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ needs.iteration-plan.outputs.dependencies == 'true' }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        if: ${{ needs.iteration-plan.outputs.dependencies == 'true' }}
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        if: ${{ needs.iteration-plan.outputs.dependencies == 'true' }}
        with: { toolchain: stable }
      - name: Install JS dependencies
        if: ${{ needs.iteration-plan.outputs.dependencies == 'true' }}
        run: vp install --frozen-lockfile --prefer-offline
      - name: Audit production npm dependencies
        if: ${{ needs.iteration-plan.outputs.dependencies == 'true' }}
        run: node tools/commands/ci/npm-audit-retry.ts
      - name: Install cargo-audit
        if: ${{ needs.iteration-plan.outputs.dependencies == 'true' }}
        uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        with: { tool: cargo-audit }
      - name: Audit Rust dependencies
        if: ${{ needs.iteration-plan.outputs.dependencies == 'true' }}
        run: cargo audit --deny warnings
      - name: Report unchanged inputs
        if: ${{ needs.iteration-plan.outputs.dependencies != 'true' }}
        run: echo 'dependencies inputs are unchanged.' >> "$GITHUB_STEP_SUMMARY"
  node-engine-compat:
    needs: iteration-plan
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ needs.iteration-plan.outputs.engines == 'true' }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        if: ${{ needs.iteration-plan.outputs.engines == 'true' }}
        with:
          node-version: ${{ matrix.node-version }}
          cache: true
          run-install: false
      - name: Install JS dependencies
        if: ${{ needs.iteration-plan.outputs.engines == 'true' }}
        run: vp install --frozen-lockfile --prefer-offline
      - name: Check package engine matrix
        if: ${{ needs.iteration-plan.outputs.engines == 'true' }}
        run: node --test tests/tooling/node-engine-matrix.test.ts tests/tooling/package-manifests.test.ts tests/tooling/dependency-security-compat.test.mjs tests/tooling/comparison-base.test.ts tests/tooling/plan-source-checks.test.ts tests/tooling/plan-check-inputs.test.ts tests/tooling/warning-budget.test.ts tests/tooling/npm-audit-command.test.ts
      - name: Report unchanged inputs
        if: ${{ needs.iteration-plan.outputs.engines != 'true' }}
        run: echo 'engines inputs are unchanged.' >> "$GITHUB_STEP_SUMMARY"
  check-vize-apps:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    needs: iteration-plan
    timeout-minutes: 20
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Check affected product applications
        if: ${{ needs.iteration-plan.outputs.apps == 'true' }}
        uses: ./.github/actions/check-vize-apps
      - name: Report unaffected applications
        if: ${{ needs.iteration-plan.outputs.apps != 'true' }}
        run: echo 'Product application inputs are unchanged.' >> "$GITHUB_STEP_SUMMARY"
  vue-parity:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 30
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with: { key: vue-parity, cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}" }
      - uses: ./.github/actions/check-vue-parity
  full-source-cli:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/full-source-cli.yml
  tooling-plan:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/full-tooling-plan.yml
  test-scripts:
    name: Tooling (${{ matrix.name }})
    runs-on: blacksmith-32vcpu-ubuntu-2404
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }} # Preserve native evidence when the producer fails.
    timeout-minutes: 30
    needs: [full-source-cli, tooling-plan]
    strategy: { fail-fast: false, matrix: "${{ fromJSON(needs.tooling-plan.outputs.matrix) }}" }
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
      VIZE_SOURCE_CLI_RECEIPT_SHA256: ${{ needs.full-source-cli.outputs.receipt-sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/test-full-tooling
        with:
          producer: ${{ toJSON(needs.full-source-cli.outputs) }}
          shard: ${{ matrix.index }}
          total: ${{ matrix.total }}
  test-scripts-gate:
    name: test-scripts # Release preflight requires exactly one successful job with this exact name.
    runs-on: ubuntu-24.04
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    timeout-minutes: 5
    needs: [full-source-cli, tooling-plan, test-scripts]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/report-full-js-qualification
        with: { needs-json: "${{ toJSON(needs) }}" }
  editor-extensions:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/package-editor-extensions
  editor-host-smoke:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/vscode-host-smoke
  build-js-packages:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 30
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - uses: ./.github/actions/setup-moonbit
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: build-js-packages
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Verify declarations, build native package, and check UI package
        run: vp run --filter './npm/fresco-native' check:generated && vp run --filter './npm/fresco-native' check:types && vp run --filter './npm/native' build:ci && vp run --filter './npm/ui' check
      - name: Check composable hydration and Vapor conformance
        # Independent of the UI package check above; it only needs the native
        # binding that step built, so a UI failure must not hide this result.
        if: ${{ !cancelled() }}
        run: vp run --filter './npm/compose/core' check:conformance
      - name: Build JS packages
        run: vp run --workspace-root build:packages
      - name: Stage shared JS build artifacts
        run: |
          mkdir -p .artifacts/shared-js-build/npm/native
          mkdir -p .artifacts/shared-js-build/npm/cli
          mkdir -p .artifacts/shared-js-build/npm/builder/vite
          cp npm/native/*.node .artifacts/shared-js-build/npm/native/
          cp npm/native/index.js npm/native/index.d.ts .artifacts/shared-js-build/npm/native/
          cp -R npm/cli/dist .artifacts/shared-js-build/npm/cli/
          cp -R npm/builder/vite/dist .artifacts/shared-js-build/npm/builder/vite/
      - name: Upload shared JS build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-js-build
          path: .artifacts/shared-js-build/
          if-no-files-found: error
          retention-days: 7
  test-js-packages:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 45
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-js-package-tests
      - name: Test JS packages
        if: ${{ always() }}
        uses: ./.github/actions/test-js-packages-with-history
  full-js-report:
    name: full-js-report
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    needs:
      - test-js-packages
      - build-js-packages
      - test-scripts
      - full-source-cli
      - check-js
      - instruction-counts
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/report-full-js-qualification
        with: { needs-json: "${{ toJSON(needs) }}" }
  full-rust-workspace:
    name: Full Rust workspace and doctests
    runs-on: blacksmith-32vcpu-ubuntu-2404
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "24"
      VIZE_NUXT_CONFIG_ITERATIONS: "100"
      VIZE_TEST_REQUIRE_TSGO: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with: { toolchain: "1.99.1", components: clippy }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/cache-vp-bootstrap
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: package.json, cache: true, run-install: true }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: nextest-ci
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      - name: Install Pkl CLI and hydrate pinned native fixture
        run: npm install --global @pkl-community/pkl@0.27.2 && git submodule update --init --force --depth 1 -- tests/_fixtures/_git/element-plus
      - name: Install full-workspace nextest
        uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        with: { tool: cargo-nextest@0.9.146 }
      - name: Run the original test profile for same-source comparison
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.compare-rust-test-profile }}
        run: node tools/support/compat/github/run-rust-workspace-tests.ts --cargo-profile test --output target/nextest/full/workspace-reference-timing.json
      - name: Run and inventory every workspace test and doctest
        if: ${{ !cancelled() }}
        run: node tools/support/compat/github/run-rust-workspace-tests.ts --cargo-profile ci
      - name: Preserve full-workspace test results and walltime
        if: ${{ always() }}
        uses: ./.github/actions/upload-rust-full-workspace-results
      - uses: ./.github/actions/retain-sfc-runtime
        if: ${{ always() }}
  full-rust-report:
    name: full-rust-report
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() && !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    needs: [full-rust-workspace, clippy-and-test]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - name: Require workspace and native differential jobs
        env: { NEEDS_JSON: "${{ toJSON(needs) }}" }
        run: node tools/support/compat/github/require-needs-success.ts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-full-workspace-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/rust-full-workspace
      - name: Require the requested same-source test and ci inventories
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.compare-rust-test-profile }}
        run: node tools/support/compat/github/rust-workspace-inventory.ts compare .artifacts/rust-full-workspace/workspace-inventory-test.json .artifacts/rust-full-workspace/workspace-inventory-ci.json
      - name: Verify complete same-head workspace execution
        env: { SOURCE_SHA: "${{ github.sha }}", NEEDS_JSON: "${{ toJSON(needs) }}" }
        run: node tools/support/compat/github/rust-workspace-inventory.ts verify "$SOURCE_SHA" .artifacts/rust-full-workspace
  clippy-and-test:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 45
    env: { VIZE_NUXT_CONFIG_ITERATIONS: "100" }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable, components: clippy }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: true
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: clippy-test
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings -D clippy::wildcard_imports && cargo clippy -p vize_maestro --tests -- -D warnings && rust-script tools/commands/ci/github/check-maestro-feature-contract.rs && rust-script tools/commands/ci/check-workspace-lints.rs --check && rust-script tools/commands/ci/check-skeleton-todos.rs --check
      - name: Davinci no_std stage-library portability lanes (TS-24)
        run: cargo build -p vize_l0 -p vize_l1 -p vize_l2 -p vize_l3 -p vize_l1_to_l2 -p vize_l2_to_l3 --lib --target wasm32-wasip2 && cargo build -p vize_l0 -p vize_l1 -p vize_l2 -p vize_l3 -p vize_l1_to_l2 -p vize_l2_to_l3 --lib --target wasm32-wasip2 --no-default-features
      - name: Davinci allocation gate
        run: cargo bench -p vize_l1_to_l2 --bench davinci_storage -- --quick && cargo bench -p vize_patina --bench davinci_markup -- --quick && rust-script tools/commands/davinci/bench-compare.rs --bench s1_to_s2_lower_vfor_three_aliases --bench s1_to_s2_emit_von_two_per_bucket --bench s1_to_s2_emit_p2_11_dom_surface --bench s1_to_s2_pass_template_complexity --bench patina_jsx_markup_one_root --bench patina_s2_markup_one_root && cargo bench -p vize_musea --bench davinci_art -- --quick && rust-script tools/commands/davinci/bench-compare.rs --bench musea_parse_art_define_art --bench musea_parse_art_legacy_attrs --bench musea_parse_art_inline
      - name: Upload Davinci allocation bench reports
        if: ${{ always() }}
        uses: ./.github/actions/upload-davinci-compact-storage-bench-reports
      - name: Install Pkl CLI and hydrate pinned native fixture
        run: npm install --global @pkl-community/pkl@0.27.2 && git submodule update --init --force --depth 1 -- tests/_fixtures/_git/element-plus
      - name: Test
        env: { VIZE_TEST_REQUIRE_TSGO: "1" }
        uses: ./.github/actions/test-rust-workspace-differential
        # The required full-rust-report verifies the sibling's source-bound
        # complete inventory, JUnit and doctests as well as this native tail.
        with: { workspace-already-tested: "true" }
      - uses: ./.github/actions/retain-sfc-runtime
        if: ${{ always() }}
  coverage:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: ./.github/actions/setup-rust-script
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: coverage
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: "package.json", run-install: false }
      # The fixture-coverage runner evaluates the SFC Pkl fixtures.
      - name: Install Pkl CLI
        run: npm install --global @pkl-community/pkl@0.27.2
      - name: Coverage report
        run: rust-script tools/commands/ci/github/write-coverage-summary.rs
  source-coverage:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 50
    # Source coverage is a daily/full-run trend metric; fast checks stay on PRs and pushes.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
      VIZE_NUXT_CONFIG_ITERATIONS: "100"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable, components: llvm-tools-preview }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-moonbit
      - uses: ./.github/actions/setup-rust-script
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: coverage-source
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Install Pkl CLI and hydrate pinned native fixture
        run: npm install --global @pkl-community/pkl@0.27.2 && git submodule update --init --force --depth 1 -- tests/_fixtures/_git/element-plus
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        with: { tool: "cargo-llvm-cov,cargo-nextest@0.9.146" }
      - name: Source coverage report
        env:
          VIZE_NATIVE_SYNTAX_CAPTURE_DIR: ${{ runner.temp }}/source-coverage-native-syntax
          VIZE_LSP_EXIT_FAILURE_EVIDENCE: ${{ runner.temp }}/source-coverage-lsp-exit
        run: vp run --workspace-root coverage:source
      - name: Retain native syntax and failed LSP exit packets
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-coverage-native-syntax-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-coverage-native-syntax/
            ${{ runner.temp }}/source-coverage-lsp-exit/
          if-no-files-found: warn
      - name: Verify source coverage summary
        run: test -s target/llvm-cov/source-summary.json
      - name: Upload source coverage summary
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-source-coverage-summary
          path: target/llvm-cov/source-summary.json
          if-no-files-found: error
          retention-days: 14
  branch-coverage:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 45
    # Keep the strict nightly instrumentation gate on scheduled and explicit runs.
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # nightly
        with: { toolchain: nightly, components: llvm-tools-preview }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-moonbit
      - uses: ./.github/actions/setup-rust-script
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: coverage-branch
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Install Pkl CLI
        run: npm install --global @pkl-community/pkl@0.27.2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        with: { tool: cargo-llvm-cov }
      - name: Branch coverage report
        run: vp run --workspace-root coverage:source:branch
      - name: Verify branch coverage summary
        run: test -s target/llvm-cov/source-branch-summary.json
      - name: Upload branch coverage summary
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-branch-coverage-summary
          path: target/llvm-cov/source-branch-summary.json
          if-no-files-found: error
          retention-days: 14
  playground-test:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 30
    needs: [build-js-packages]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      # Rust is always needed for @vizejs/native (used by vite-plugin-vize)
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable, targets: wasm32-unknown-unknown }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: playground-test
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Cache WASM build
        id: cache-wasm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: playground/src/wasm/vize_vitrine* # outputs only; tests/tooling/github-wasm-cache.test.ts
          key: ${{ runner.os }}-wasm-v2-${{ hashFiles('crates/**/*.rs', 'davinci/**/*.rs', 'crates/**/Cargo.toml', 'davinci/**/Cargo.toml', 'Cargo.toml', 'Cargo.lock', 'tools/support/github/build-vitrine-wasm.ts', 'tools/support/tasks/build-vitrine-wasm.ts', 'tools/support/command-runtime.ts') }}
      - name: Install wasm-bindgen-cli
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        with: { tool: wasm-bindgen-cli@0.2.129 }
      - name: Setup Vite+ and Node.js
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - name: Build WASM
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        run: node tools/support/github/build-vitrine-wasm.ts playground/src/wasm
      - name: Install JS dependencies
        run: node tools/support/github/vp-install.ts --filter './playground...' --filter './npm/builder/vite...' --filter './npm/cli...' --filter './npm/native...' --filter './npm/ui...'
      - name: Download shared JS build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shared-js-build
          path: .
      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        uses: ./.github/actions/install-playwright-browsers
      - name: Run playground tests
        run: vp run --filter './playground' test:browser
      - name: Run VRT
        run: vp run --filter './playground' test:vrt
        continue-on-error: true
        id: vrt
      - name: Upload VRT report
        if: steps.vrt.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playground-vrt-report
          path: playground/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload VRT diff artifacts
        if: steps.vrt.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrt-diff
          path: playground/e2e/vrt/test-results/
          retention-days: 7
      - name: Fail if VRT failed
        if: steps.vrt.outcome == 'failure'
        run: exit 1
  test-report:
    name: test-report
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    needs:
      - iteration-plan
      - fmt-rust
      - check-js
      - security-audit
      - node-engine-compat
      - check-vize-apps
      - pr-source-checks
      - instruction-counts
      - level-dependency-direction
      - release-integration-catalog
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - name: Require every PR source and Rust result
        if: ${{ github.event_name == 'pull_request' }}
        env: { PR_SOURCE_JOBS_JSON: "${{ needs.pr-source-checks.outputs.jobs-json }}" }
        run: node tools/support/compat/github/require-pr-checks.ts
      - name: Require every needed job to succeed
        env: { NEEDS_JSON: "${{ toJSON(needs) }}" }
        run: node tools/support/compat/github/require-needs-success.ts --check-report
