name: Check
run-name: Forge installed source proof @ fd4a6b380
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: forge-installed-source-proof-fd4a6b380
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
  PROOF_SOURCE: fd4a6b380e33bf088a357ac395e6fa8ed40147ab
  PROOF_TREE: b29203977a72a275e1ac5094ec59601af4800fe0
  PROOF_PARENT: dd6beada6373fc58af149e7e19cf0204710ec022
jobs:
  installed-forge-proof:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: fd4a6b380e33bf088a357ac395e6fa8ed40147ab
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact immutable source before installation
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PROOF_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PROOF_TREE"
          test "$(git rev-parse HEAD^)" = "$PROOF_PARENT"
          test -z "$(git status --porcelain --untracked-files=no)"
          proof_dir="$RUNNER_TEMP/forge-installed-source-proof"
          mkdir -p "$proof_dir"
          echo "PROOF_DIR=$proof_dir" >> "$GITHUB_ENV"
          git cat-file commit HEAD > "$proof_dir/source-commit.raw"
          git ls-tree -r -z HEAD | sha256sum > "$proof_dir/tracked-tree.sha256"
          sha256sum pnpm-lock.yaml pnpm-workspace.yaml patches/node-forge@1.4.0.patch > "$proof_dir/before.sha256"
          sha256sum .github/workflows/check.yml > "$proof_dir/original-check.sha256"
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - uses: ./.github/actions/setup-js-check-runtime
      - name: Record real pinned runtime and pnpm
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          vp --version | tee "$PROOF_DIR/vp-version.txt"
          vp exec pnpm --version | tee "$PROOF_DIR/pnpm-version.txt"
          test "$(tr -d '\r\n' < "$PROOF_DIR/pnpm-version.txt")" = "12.1.0"
          vp node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import os from "node:os";
          assert.equal(process.version, "v24.14.0");
          const record = { node: process.version, versions: process.versions, platform: process.platform, arch: process.arch, release: os.release(), source: process.env.PROOF_SOURCE, tree: process.env.PROOF_TREE, parent: process.env.PROOF_PARENT, run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT };
          fs.writeFileSync(process.env.PROOF_DIR + "/runtime.json", JSON.stringify(record, null, 2));
          console.log(JSON.stringify(record));
          JS
      - name: Genuine frozen pnpm workspace installation
        id: install
        shell: bash
        run: |
          set -euo pipefail
          vp install --frozen-lockfile --prefer-offline 2>&1 | tee "$PROOF_DIR/frozen-install.log"
          sha256sum pnpm-lock.yaml pnpm-workspace.yaml patches/node-forge@1.4.0.patch > "$PROOF_DIR/after.sha256"
          cmp "$PROOF_DIR/before.sha256" "$PROOF_DIR/after.sha256"
          git diff --exit-code
      - name: Retain original moderate production registry JSON and status
        id: native_audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          vp exec pnpm audit --prod --audit-level moderate --json > "$PROOF_DIR/audit-moderate.stdout.json" 2> "$PROOF_DIR/audit-moderate.stderr.log"
          audit_status=$?
          printf '%s\n' "$audit_status" > "$PROOF_DIR/audit-moderate.status"
          cat "$PROOF_DIR/audit-moderate.stdout.json"
          cat "$PROOF_DIR/audit-moderate.stderr.log" >&2
          exit "$audit_status"
      - name: Retain all-severity production diagnostic JSON and status
        id: full_audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          vp exec pnpm audit --prod --audit-level info --json > "$PROOF_DIR/audit-all.stdout.json" 2> "$PROOF_DIR/audit-all.stderr.log"
          audit_status=$?
          printf '%s\n' "$audit_status" > "$PROOF_DIR/audit-all.status"
          cat "$PROOF_DIR/audit-all.stdout.json"
          cat "$PROOF_DIR/audit-all.stderr.log" >&2
          exit "$audit_status"
      - name: Verify every actual installed package and public crypto control
        id: installed_source
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          vp node --input-type=module <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          import { createRequire } from "node:module";
          import { packageDigest, verifyInstalledForge } from "./tools/support/security/node-forge-proof.ts";
          const proof = verifyInstalledForge(process.cwd());
          const store = path.resolve("node_modules/.pnpm");
          const packages = fs.readdirSync(store).filter((name) => /^(?:node-forge@|listhen@|@nuxt\+cli@3\.37\.0|nitropack@2\.13\.4)/.test(name)).map((directory) => {
            const name = directory.startsWith("node-forge@") ? "node-forge" : directory.startsWith("listhen@") ? "listhen" : directory.startsWith("@nuxt+cli@") ? "@nuxt/cli" : "nitropack";
            const root = fs.realpathSync(path.join(store, directory, "node_modules", name));
            const manifest = JSON.parse(fs.readFileSync(path.join(root, "package.json"), "utf8"));
            const require = createRequire(path.join(root, "package.json"));
            return { directory, root, name: manifest.name, version: manifest.version, main: manifest.main, digest: name === "node-forge" || name === "listhen" ? packageDigest(root) : null, listhen: name === "@nuxt/cli" || name === "nitropack" ? require.resolve("listhen") : null, forge: name === "listhen" ? require.resolve("node-forge") : null };
          });
          const receipt = { source: process.env.PROOF_SOURCE, ...proof, packages };
          fs.writeFileSync(process.env.PROOF_DIR + "/installed-source.json", JSON.stringify(receipt, null, 2));
          console.log(JSON.stringify(receipt));
          JS
      - name: Actual source patch and Nuxt CLI/Nitro encrypted TLS and PKCS12 laws
        id: tls
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          vp node --test tests/tooling/node-forge-security.test.ts tests/tooling/node-forge-listhen.test.ts 2>&1 | tee "$PROOF_DIR/crypto-tls-laws.log"
      - name: Execute unchanged-threshold real production audit adapter
        id: adapter
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          rust-script tools/commands/ci/npm-audit.rs 2>&1 | tee "$PROOF_DIR/audit-adapter.log"
      - name: Preserve final tracked source and terminal step metadata
        if: ${{ always() && steps.runtime.outcome == 'success' }}
        env:
          PROOF_STEPS: ${{ toJSON(steps) }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum pnpm-lock.yaml pnpm-workspace.yaml patches/node-forge@1.4.0.patch > "$PROOF_DIR/final.sha256"
          cmp "$PROOF_DIR/before.sha256" "$PROOF_DIR/final.sha256"
          git diff --exit-code
          vp node --input-type=module <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          import { createHash } from "node:crypto";
          const directory = process.env.PROOF_DIR;
          const files = fs.readdirSync(directory).sort().map((name) => {
            const bytes = fs.readFileSync(path.join(directory, name));
            if (bytes.length > 16 * 1024 * 1024) throw new Error("unbounded evidence: " + name);
            return { name, bytes: bytes.length, sha256: createHash("sha256").update(bytes).digest("hex") };
          });
          const record = { source: process.env.PROOF_SOURCE, tree: process.env.PROOF_TREE, parent: process.env.PROOF_PARENT, steps: JSON.parse(process.env.PROOF_STEPS), files, sourceAcceptance: false, pr: false, queue: false, merged: false };
          fs.writeFileSync(path.join(directory, "capture-receipt.json"), JSON.stringify(record, null, 2));
          console.log(JSON.stringify(record));
          JS
      - name: Retain complete bounded install/registry/source/TLS evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forge-installed-source-fd4a6b380-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/forge-installed-source-proof/
          if-no-files-found: error
          retention-days: 7
