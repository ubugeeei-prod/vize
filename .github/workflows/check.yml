name: Mounted child exit diagnostic
on:
  workflow_dispatch: null
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  source-coverage:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 40
    if: ${{ github.event_name == 'schedule' || github.event_name ==
      'workflow_dispatch' }}
    env:
      NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
      VIZE_NUXT_CONFIG_ITERATIONS: "100"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: llvm-tools-preview
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with:
          wild-version: 0.9.0
      - uses: ./.github/actions/setup-moonbit
      - uses: ./.github/actions/setup-rust-script
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: coverage-source
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Install Pkl CLI
        run: npm install --global @pkl-community/pkl@0.27.2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1
        with:
          tool: cargo-llvm-cov
      - name: Source coverage report
        run: vp run --workspace-root coverage:source
      - name: Verify source coverage summary
        run: test -s target/llvm-cov/source-summary.json
      - name: Upload source coverage summary
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-source-coverage-summary
          path: target/llvm-cov/source-summary.json
          if-no-files-found: error
          retention-days: 14
