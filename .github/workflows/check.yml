name: Capture official Vue 2 compiler oracle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Capture original registry tarballs and source bytes
        run: node tools/support/ci/vue2-oracle-capture.mjs
