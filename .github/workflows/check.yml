name: Span edits nextest JUnit transport
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  transport:
    strategy:
      fail-fast: false
      matrix:
        layer: [bottom, top]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - name: Validate actual testcase identity refusals
        run: vp exec node tools/support/ci/span-edits-junit/testcase-laws.ts
      - name: Read pinned original worker artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: vp exec node tools/support/ci/span-edits-junit/collect.ts tools/support/ci/span-edits-junit/${{ matrix.layer }}.json "$RUNNER_TEMP/span-junit"
      - name: Emit complete lossless authenticated evidence frames
        run: vp exec node tools/support/ci/span-edits-junit/frames.ts "$RUNNER_TEMP/span-junit/payload.json"
