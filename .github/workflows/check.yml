name: Native wire TypeScript port replay only
on: { workflow_dispatch: {} }
permissions: { contents: read, actions: read }
jobs:
  historical-wire-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version-file: package.json, package-manager-cache: false }
      - name: Replay immutable real packets through the TypeScript port
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, re, subprocess, tarfile, zipfile
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "wire-port-historical"
          assert not out.exists()
          out.mkdir()
          def api(path):
              result = subprocess.run(["gh","api","--allow-escape-sequences",path],capture_output=True,timeout=90)
              assert result.returncode == 0, result.stderr.decode("utf8","replace")
              return result.stdout
          repo = os.environ["GITHUB_REPOSITORY"]
          artifact_id = 12777516451
          archive = api(f"repos/{repo}/actions/artifacts/{artifact_id}/zip")
          assert len(archive) == 5493285
          assert hashlib.sha256(archive).hexdigest() == "397540d7992196478a1dcbae82df278b536e45fcf38fe4b6e1f567c9720355b9"
          with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
              entry, = bundle.infolist()
              assert entry.filename == "binding-origin-admission.tgz"
              previous = bundle.read(entry)
          source_identity = None
          with tarfile.open(fileobj=io.BytesIO(previous),mode="r:gz") as bundle:
              for member in bundle:
                  if member.name == "binding-origin-admission/acceptance.json":
                      stream = bundle.extractfile(member); assert stream is not None
                      source_identity = json.load(stream)
                      assert source_identity["sourceSha"] == "cfa9b573e9857e87caa67d2e938c302fdacf5f49"
                      assert source_identity["actualTestImage"]["sha256"] == "af8a05e0ffce56c4c3dd6603b4cd435d7f96ac71a93eabf8aac5a7bb25eb0150"
                  match = re.fullmatch(r"binding-origin-admission/native-(7[.]0[.]2|7[.]1[.]0-beta)/(client-to-native[.]wire[.]bin|native-to-client[.]wire[.]bin|carrier-receipt[.]json|full-wire-receipt[.]json|raw-symbol-candidates[.]json|full-wire-symbol-packets[.]json)",member.name)
                  if match is None: continue
                  assert member.isfile()
                  version, name = match.groups()
                  capture = out / version
                  capture.mkdir(exist_ok=True)
                  stream = bundle.extractfile(member); assert stream is not None
                  (capture / name).write_bytes(stream.read())
          assert source_identity is not None
          rows = []
          for version in ["7.0.2","7.1.0-beta"]:
              capture = out / version
              names = ["full-wire-receipt.json","raw-symbol-candidates.json","full-wire-symbol-packets.json"]
              before = {name:json.loads((capture/name).read_text()) for name in names}
              command = ["node","crates/vize_canon/src/binding_origins/native_api_probe/verify-wire.ts",str(capture),version]
              result = subprocess.run(command,cwd=root,capture_output=True,text=True,timeout=60)
              (out / (version + ".stdout.txt")).write_text(result.stdout)
              (out / (version + ".stderr.txt")).write_text(result.stderr)
              assert result.returncode == 0, result.stdout + result.stderr
              after = {name:json.loads((capture/name).read_text()) for name in names}
              assert before == after, "ported validator must preserve every actual field and receipt"
              rows.append({"version":version,"command":command,"status":result.returncode,"semanticPacketsEqual":True,"receipt":json.loads(result.stdout)})
          receipt = {
              "scope":"historical real wire replay only; no Cargo or native checker process",
              "sourceArtifact":artifact_id,"sourceZipSha256":hashlib.sha256(archive).hexdigest(),
              "originalSource":source_identity["sourceSha"],"validatorSource":os.environ["GITHUB_SHA"],
              "files":{str(path.relative_to(root)):hashlib.sha256(path.read_bytes()).hexdigest() for path in sorted((root/"crates/vize_canon/src/binding_origins/native_api_probe").glob("verify-*.ts"))},
              "roles":rows,"nativeProcessesStarted":0,"hostWireQualified":False,"passed":True,
          }
          (out/"replay-receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt),flush=True)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-wire-ts-port-replay
          path: |
            ${{ runner.temp }}/wire-port-historical/replay-receipt.json
            ${{ runner.temp }}/wire-port-historical/*.stdout.txt
            ${{ runner.temp }}/wire-port-historical/*.stderr.txt
          retention-days: 14
