name: LSP artifact transport
run-name: LSP artifact transport ${{ inputs.run_id }} @ ${{ inputs.source_head }}
on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        required: true
      artifact_id:
        type: string
        required: true
      source_head:
        type: string
        required: true
permissions:
  actions: read
  contents: read
jobs:
  transport:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - name: Download original source-built product evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/lsp-capture
      - name: Emit bounded lossless raw capture frames
        env:
          GH_TOKEN: ${{ github.token }}
          LSP_SOURCE_RUN: ${{ inputs.run_id }}
          LSP_ARTIFACT_ID: ${{ inputs.artifact_id }}
          LSP_SOURCE_HEAD: ${{ inputs.source_head }}
          LSP_CAPTURE_PATH: ${{ runner.temp }}/lsp-capture
        run: vp exec node tools/support/ci/lsp-artifact-transport.ts "$LSP_CAPTURE_PATH"
