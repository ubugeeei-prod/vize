name: Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasmtime-lock-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    name: Capture actual Wasmtime patch lock
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout temporary transport
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          path: transport
          persist-credentials: false
      - name: Checkout immutable resolver source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: 2576a9b5e5d4336e5da362f048d3aaa3f2bc11ae
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Setup pinned Cargo
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.0
      - name: Setup pinned Node for courier
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version: 24.14.0
          run-install: false
          cache: false
      - name: Verify source and retain original inputs
        id: before
        run: node transport/tools/support/ci/wasmtime-lock-capture.ts source before
      - name: Resolve only the compatible Wasmtime patch
        id: resolver
        working-directory: source
        run: cargo update -p wasmtime --precise 48.0.4
      - name: Guard original source and record complete package delta
        id: guard
        if: always() && steps.before.outcome == 'success' && steps.resolver.outcome == 'success'
        run: node transport/tools/support/ci/wasmtime-lock-capture.ts source after
      - name: Retain lossless resolver output even on failure
        if: always()
        env:
          BEFORE_OUTCOME: ${{ steps.before.outcome }}
          RESOLVER_OUTCOME: ${{ steps.resolver.outcome }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
        run: node transport/tools/support/ci/wasmtime-lock-capture.ts source emit
