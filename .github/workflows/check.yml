name: JSX Fixture Candidates
run-name: JSX fixture candidates @ ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  jsx-snapshot-candidates:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - uses: ./.github/actions/setup-moonbit
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: jsx-snapshot-candidates
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Build the actual native JSX compiler and Rspack loader
        run: vp run --filter './npm/native' build:debug && vp run --filter './npm/builder/rspack' build
      - name: Verify the exact native classifier and five reviewed golden cases
        run: |
          mkdir -p jsx-snapshot-candidates
          git rev-parse HEAD > jsx-snapshot-candidates/tested-head.txt
          git log -1 --format=%H -- crates/vize_atelier_jsx crates/vize_vitrine > jsx-snapshot-candidates/native-producer-head.txt
          git rev-parse HEAD:crates/vize_atelier_jsx > jsx-snapshot-candidates/producer-tree.txt
          vp exec cargo test -p vize_atelier_jsx --test babel_compat_oracle --test authored_module
          vp exec node --test --test-name-pattern='^(compileJsxModule includes the runtime-helper preamble in the emitted module|compileJsxModule surfaces a v3 source map when sourceMap is requested|jsx: a \.jsx Vue component compiles to VDOM render code|jsx: a \.jsx <style scoped> block emits scope-rewritten CSS into the bundle|jsx: a vapor \.jsx component compiles to template render code)$' npm/builder/rspack/src/shared/jsx-compile.test.ts npm/builder/rspack/src/jsx.test.ts
      - name: Upload candidates for explicit review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rspack-jsx-snapshot-candidates-${{ github.sha }}
          path: |
            jsx-snapshot-candidates/
            npm/builder/rspack/src/shared/jsx-compile.test.ts.snapshot
            npm/builder/rspack/src/__snapshots__/jsx.test.ts.snap
          if-no-files-found: error
          retention-days: 7
