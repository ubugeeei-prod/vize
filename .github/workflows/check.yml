name: Current formatter artifact transport
run-name: Current formatter artifact transport ${{ inputs.run_id }} attempt ${{ inputs.source_attempt }}
on:
  workflow_dispatch:
    inputs:
      run_id: { type: string, required: true }
      source_attempt: { type: string, required: true }
      source_job: { type: string, required: true }
      artifact_id: { type: string, required: true }
permissions:
  actions: read
  contents: read
jobs:
  transport:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - name: Download actual current source-built formatter evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/formatter-capture
      - name: Emit bounded lossless full formatter capture frames
        env:
          GH_TOKEN: ${{ github.token }}
          FORMATTER_SOURCE_RUN: ${{ inputs.run_id }}
          FORMATTER_SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
          FORMATTER_SOURCE_JOB: ${{ inputs.source_job }}
          FORMATTER_ARTIFACT_ID: ${{ inputs.artifact_id }}
          FORMATTER_CAPTURE_PATH: ${{ runner.temp }}/formatter-capture
        run: vp exec node tools/support/ci/formatter-artifact-transport.ts "$FORMATTER_CAPTURE_PATH"
