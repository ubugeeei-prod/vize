name: Check
run-name: Generate patched devalue lock @ ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact initial source commit on chore/devalue-security-20261002
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: devalue-lock-capture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate-devalue-lock:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chore/devalue-security-20261002' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_BRANCH: chore/devalue-security-20261002
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 2
      - name: Verify exact source and dedicated branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          test "$GITHUB_REF" = "refs/heads/$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          sha256sum pnpm-workspace.yaml pnpm-lock.yaml
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - name: Install the declared package manager
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          npm install --global pnpm@12.1.0 --ignore-scripts
          test "$(pnpm --version)" = "12.1.0"
          test "$(node --version)" = "v24.14.0"
      - name: Generate and verify the lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import crypto from "node:crypto";
          import { execFileSync } from "node:child_process";
          const git = (...args) => execFileSync("git", args, { encoding: "utf8" }).trim();
          assert.equal(git("rev-parse", "HEAD"), process.env.EXPECTED_SOURCE_SHA);
          assert.deepEqual(git("diff", "--name-only", "HEAD").split("\n"), ["pnpm-lock.yaml"]);
          assert.deepEqual(git("status", "--porcelain", "--untracked-files=all").split("\n"), ["M pnpm-lock.yaml"]);
          assert.equal(JSON.parse(fs.readFileSync("package.json", "utf8")).packageManager, "pnpm@12.1.0");
          const lock = fs.readFileSync("pnpm-lock.yaml", "utf8");
          assert(lock.includes("devalue@5.9.3:"));
          assert(!lock.includes("devalue@5.9.2:"));
          assert(git("diff", "--", "pnpm-lock.yaml").includes("devalue@5.9.3"));
          const hash = (file) => crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
          console.log(JSON.stringify({
            schema: "vize.dependency.lock-generation", version: 1,
            sourceRevision: process.env.EXPECTED_SOURCE_SHA,
            node: process.version,
            pnpm: execFileSync("pnpm", ["--version"], { encoding: "utf8" }).trim(),
            workspaceSha256: hash("pnpm-workspace.yaml"), lockSha256: hash("pnpm-lock.yaml"),
          }));
          JS
          git diff --check
      - name: Commit the generated lock to the dedicated branch
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | cut -f1)"
          test "$remote_sha" = "$EXPECTED_SOURCE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          git commit -m "chore(deps): regenerate patched devalue lock"
          git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
          printf 'Generated lock commit: %s\n' "$(git rev-parse HEAD)"
