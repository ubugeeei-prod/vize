name: Published npm package graph custody

on:
  pull_request:
    paths:
      - "tools/support/release/lint_reports/package_graph.mjs"
      - "tools/support/release/lint_reports/package_members.py"
      - "tests/tooling/released-package-graph.test.mjs"
      - "tests/tooling/released-lint-reports.test.mjs"
      - "tests/tooling/released-nuxt-dev-ssr.test.mjs"
      - "tests/tooling/support/published-package-graph-smoke.mjs"
      - ".github/workflows/published-package-graph.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: published-package-graph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  custody:
    name: Alias and bundled public archive custody
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Test original tampering laws and alias and bundled archive controls
        run: node --test tests/tooling/released-lint-reports.test.mjs tests/tooling/released-nuxt-dev-ssr.test.mjs tests/tooling/released-package-graph.test.mjs
      - name: Authenticate actual public npm alias and bundled archives
        run: node tests/tooling/support/published-package-graph-smoke.mjs
      - name: Retain registry archives and whole lock receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-package-graph-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published-package-graph-*/evidence/
          if-no-files-found: warn
          retention-days: 7
