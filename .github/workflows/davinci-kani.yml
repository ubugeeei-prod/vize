name: Davinci Kani

on:
  pull_request:
    paths:
      - ".github/workflows/davinci-kani.yml"
      - "crates/vize_l3/src/lattice/class.rs"
      - "crates/vize_l3/src/lattice/effect.rs"
      - "tests/formal/kani/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  l3-lattice:
    name: L3 lattice properties
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.68.0"
          command: kani
          args: tests/formal/kani/l3_lattice.rs --output-format=terse
