name: Davinci Kani
on:
  pull_request:
    paths:
      - .github/workflows/davinci-kani.yml
      - .github/scripts/workflows/davinci-kani/**
      - davinci/vize_l0/src/span.rs
      - davinci/vize_l0/src/span/proofs.rs
      - davinci/vize_l0/src/source_range.rs
      - davinci/vize_l0/src/source_range/proofs.rs
      - davinci/vize_l0/src/line_index/kani.rs
      - davinci/vize_l0/src/line_index/utf16.rs
      - davinci/vize_l4/src/write/kani.rs
      - davinci/vize_l4/src/write/line_endings.rs
      - davinci/vize_l4/src/write/source_map/kani.rs
      - davinci/vize_l4/src/write/source_map/vlq.rs
      - davinci/vize_l2/src/query/position/index/intervals.rs
      - davinci/vize_l2/src/query/position/index/intervals/tests.rs
      - tests/formal/position-index/Intervals.lean
      - davinci/vize_l3/src/query/check/kani.rs
      - davinci/vize_l3/src/query/check/rule.rs
      - tests/davinci_test_support/src/l3_reference/incremental.rs
      - tests/davinci_test_support/src/l3_reference/incremental_proofs.rs
      - tests/davinci_test_support/src/l3_reference/kani.rs
      - davinci/vize_l0/src/js_string.rs
      - davinci/vize_l0/src/js_string/tests.rs
      - davinci/vize_l0/src/js_string_kani.rs
      - davinci/vize_l0/tests/emitted_string_literals.rs
      - tests/formal/string-literal/**
      - davinci/vize_l2/src/analysis/text_facts.rs
      - davinci/vize_l2/src/analysis/text_facts/kani.rs
      - davinci/vize_l0/src/allocator.rs
      - davinci/vize_l0/src/allocator/kani.rs
      - davinci/vize_l0/src/profiler/allocation.rs
      - davinci/vize_l0/src/profiler/allocation/kani.rs
  workflow_dispatch: null
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  position-index:
    name: L2 position queries on original byte intervals
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f
        with:
          kani-version: 0.68.0
          args: --manifest-path davinci/vize_l2/Cargo.toml --features position-index --tests --lib --harness position_queries_ --output-format=terse
  source-coordinates:
    name: Span, range, UTF-16 column, line terminator and VLQ laws
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f
        with:
          kani-version: 0.68.0
          command: kani
          args: davinci/vize_l4/src/write/source_map/kani.rs --output-format=terse
      - name: Verify UTF-16 columns of every short UTF-8 text
        run: kani davinci/vize_l0/src/line_index/kani.rs --output-format=terse --jobs 2
      - name: Verify JavaScript line terminators
        run: kani davinci/vize_l4/src/write/kani.rs --output-format=terse
      - name: Verify span, range and mapping offsets
        run: "cargo kani --manifest-path davinci/vize_l0/Cargo.toml --lib --harness span::proofs:: --harness source_range::proofs:: --output-format=terse --jobs 2"
  graph-certificates:
    name: L3 reachability certificates
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f
        with:
          kani-version: 0.68.0
          command: kani
          args: davinci/vize_l3/src/query/check/kani.rs --output-format=terse
  l3-reference:
    name: L3 reference incremental update laws
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f
        with:
          kani-version: 0.68.0
          command: kani
          args: tests/davinci_test_support/src/l3_reference/kani.rs --output-format=terse --jobs 2
  compiler-string-literals:
    name: Emitted compiler string literals
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /tools/ci/lib/scripts/
            /.github/scripts/workflows/davinci-kani/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.100.0
      - uses: ./.github/actions/setup-wild-http-recovery
        with:
          wild-version: 0.9.0
      - name: Produce literal bytes from the compiler writer
        env:
          VIZE_LITERAL_PROOF_ROWS: ${{ runner.temp }}/rust-literals.jsonl
        run: . "${{ env.VIZE_CI_FILES }}/produce-literal-bytes-from-the-compiler-writer.sh"
      - name: Check the round-trip theorem and each emitted value
        working-directory: tests/formal/string-literal
        run: . "${{ env.VIZE_CI_FILES }}/check-the-round-trip-theorem-and-each-emitted-value.sh"
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f
        with:
          kani-version: 0.68.0
          command: kani
          args: davinci/vize_l0/src/js_string_kani.rs --harness compiler_emits_original_ascii --output-format=terse
  unsafe-text-rebuild:
    name: "Unsafe island: L2 text rebuild fill into spare capacity"
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f
        with:
          kani-version: 0.68.0
          args: --manifest-path davinci/vize_l2/Cargo.toml --lib --tests --harness fill_writes_ --output-format=terse
  unsafe-l0-allocators:
    name: "Unsafe islands: L0 parked values and profiling allocator"
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f
        with:
          kani-version: 0.68.0
          args: --manifest-path davinci/vize_l0/Cargo.toml --lib --tests --harness parked_values_ --harness profiling_allocator_ --output-format=terse
