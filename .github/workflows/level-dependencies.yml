name: Level dependencies
on:
  workflow_call:

permissions:
  contents: read

jobs:
  level-dependencies:
    name: Level dependency direction
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: false
          run-install: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Fetch dependency policy comparison base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          dependency_base="$BASE_SHA"
          if [[ -z "$dependency_base" ]]; then
            dependency_base="$(git rev-parse HEAD^)"
          fi
          if [[ ! "$dependency_base" =~ ^[0-9a-f]{40}$ || "$dependency_base" =~ ^0+$ ]]; then
            echo 'Missing dependency policy comparison base' >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$dependency_base"
          echo "DEPENDENCY_BASE=$dependency_base" >> "$GITHUB_ENV"
      - name: Test dependency policy mutations
        run: node --test tests/tooling/davinci-level-dependencies.test.mjs tests/tooling/davinci-directory-dependencies.test.mjs
      - name: Report and ratchet normal level dependencies
        run: node tools/support/compat/davinci/level-dependencies.mjs --base "$DEPENDENCY_BASE"
