name: Binding origin mutation metadata replay
on:
  workflow_dispatch:
permissions: { contents: read, actions: read }
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version-file: package.json, package-manager-cache: false }
      - name: Replay retained native frames without Cargo or native execution
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, subprocess, tarfile, zipfile
          repo = "ubugeeei-prod/vize"
          artifact_id = 12782903641
          expected_zip = "2ee9b7055186f8aa9308398dd8fdb8724ff2e28f1bc74b4d00e0d205155ec285"
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "origin-mutation-wire-replay"
          assert not out.exists()
          out.mkdir()
          reports = out / "metadata"
          reports.mkdir()
          def api(path):
              return json.loads(subprocess.check_output(["gh","api","repos/" + repo + "/" + path]))
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          metadata = api("actions/artifacts/" + str(artifact_id))
          assert metadata["id"] == artifact_id and metadata["size_in_bytes"] == 5631664
          assert metadata["digest"] == "sha256:" + expected_zip and metadata["expired"] is False
          assert metadata["workflow_run"]["id"] == 40612038133
          data = subprocess.check_output(["gh","api","repos/" + repo + "/actions/artifacts/" + str(artifact_id) + "/zip"])
          assert len(data) == 5631664 and sha(data) == expected_zip
          archive = zipfile.ZipFile(io.BytesIO(data))
          assert archive.namelist() == ["binding-origin-admission.tgz"]
          bundle = archive.read("binding-origin-admission.tgz")
          tar = tarfile.open(fileobj=io.BytesIO(bundle), mode="r:gz")
          def member(name):
              file = tar.extractfile("binding-origin-admission/" + name)
              assert file is not None
              return file.read()
          acceptance_bytes = member("acceptance.json")
          acceptance = json.loads(acceptance_bytes)
          assert acceptance["sourceSha"] == "5d62d4fa0b5c5795d454a47071e1193f429bb36f"
          assert acceptance["sourceTree"] == "03ae7d5f196f72acb144ead88a6832eaf5b5b6b2"
          assert acceptance["actualTestImage"]["sha256"] == "07a5d728f354eea6a16323878c1eee1434fddbd48091fbe3409794ef7f3df784"
          assert acceptance["actualTestImage"]["bytes"] == 105321842
          assert len(acceptance["tests"]) == 23 and all(row["qualified"] for row in acceptance["tests"])
          assert len(acceptance["nativeCarrierRoles"]) == 2
          assert all(row["status"] == 0 for row in acceptance["nativeCarrierRoles"])
          env = {key:value for key,value in os.environ.items() if key not in ["GH_TOKEN","GITHUB_TOKEN","NPM_TOKEN","NODE_AUTH_TOKEN"]}
          roles = []
          for version in ["7.0.2","7.1.0-beta"]:
              capture = out / version
              capture.mkdir()
              originals = {}
              for name in ["client-to-native.wire.bin","native-to-client.wire.bin","carrier-receipt.json"]:
                  value = member("native-" + version + "/" + name)
                  (capture / name).write_bytes(value)
                  originals[name] = {"bytes":len(value),"sha256":sha(value)}
              carrier = json.loads((capture / "carrier-receipt.json").read_text())
              assert carrier["passed"] is True and len(carrier["phases"]) == 3
              assert len(carrier["semanticMutationPhases"]) == 3
              assert carrier["hostProjectSessionSpawns"] == 1 and carrier["hostSnapshotRefreshes"] == 5
              assert carrier["nativeProgramCreationCount"] is None and carrier["nativeBindCount"] is None
              row = {"version":version,"originalMembers":originals,"sourceRustPassed":True,"operations":[]}
              for script in ["verify-wire.ts","verify-mutation-controls.ts"]:
                  command = ["node",str(root / "crates/vize_canon/src/binding_origins/native_api_probe" / script),str(capture),version]
                  result = subprocess.run(command,cwd=root,env=env,capture_output=True,text=True,timeout=60)
                  prefix = version + "." + script
                  (reports / (prefix + ".stdout.txt")).write_text(result.stdout)
                  (reports / (prefix + ".stderr.txt")).write_text(result.stderr)
                  observed = json.loads(result.stdout) if result.returncode == 0 else None
                  row["operations"].append({"command":command,"status":result.returncode,"result":observed})
                  if result.returncode != 0:
                      print(result.stdout,flush=True)
                      print(result.stderr,flush=True)
              row["passed"] = all(item["status"] == 0 for item in row["operations"])
              roles.append(row)
          source = subprocess.check_output(["git","rev-parse","HEAD"],text=True,cwd=root).strip()
          receipt = {
              "schema":"vize.binding-origin.retained-mutation-replay.v1",
              "scope":"metadata parsing of retained real native frames; no new Cargo or native API process",
              "sourceArtifact":metadata,"sourceZipSha256":expected_zip,
              "originalAcceptanceSha256":sha(acceptance_bytes),
              "nativeSource":acceptance["sourceSha"],"nativeSourceTree":acceptance["sourceTree"],
              "nativeImage":acceptance["actualTestImage"],
              "validatorSource":source,"roles":roles,
              "validatorFiles":{str(path.relative_to(root)):sha(path.read_bytes()) for path in sorted((root / "crates/vize_canon/src/binding_origins/native_api_probe").glob("verify-*.ts"))},
              "cargoBuilds":0,"nativeProcessesStarted":0,"nativeProgramCount":None,"nativeBindCount":None,
              "hostWireQualified":False,"originClassifierQualified":False,
              "passed":len(roles) == 2 and all(row["passed"] for row in roles),
          }
          (reports / "replay.json").write_text(json.dumps(receipt,indent=2) + "\n")
          print("RETAINED_MUTATION_REPLAY " + json.dumps({"source":source,"passed":receipt["passed"],"roles":[{"version":row["version"],"passed":row["passed"]} for row in roles]}),flush=True)
          assert receipt["passed"]
          PY
      - name: Package bounded metadata only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/origin-mutation-wire-replay/metadata"
          tar -czf "$RUNNER_TEMP/origin-mutation-wire-replay.tgz" -C "$RUNNER_TEMP/origin-mutation-wire-replay" metadata
          test "$(stat -c %s "$RUNNER_TEMP/origin-mutation-wire-replay.tgz")" -le 95000
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: origin-mutation-metadata-replay
          path: ${{ runner.temp }}/origin-mutation-wire-replay.tgz
          retention-days: 14
