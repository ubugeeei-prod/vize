name: Binding origin source laws
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/binding-origin-laws.yml
      - .github/scripts/workflows/binding-origin-laws/**
      - .github/scripts/workflows/shared/**
      - crates/vize_canon/src/binding_origins/**
      - crates/vize_canon/src/lib.rs
permissions: { contents: read }
concurrency:
  group: binding-origin-laws-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  laws:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 40
    env:
      {
        VIZE_CI_FILES: "${{ github.workspace }}/.github/scripts/workflows/binding-origin-laws",
        CARGO_BUILD_JOBS: "4",
        RAYON_NUM_THREADS: "4",
        CARGO_INCREMENTAL: "0",
      }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version-file: package.json, package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.100.0" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - name: Build one fresh image, run 23 origin laws and two native API carriers
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/build-one-fresh-image-run-23-origin-laws-and-two-native-api-carriers.sh"
      - name: Package actual compiler and test receipts
        if: always()
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/package-actual-compiler-and-test-receipts.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: binding-origin-source-laws-${{ github.sha }}
          path: ${{ runner.temp }}/binding-origin-admission.tgz
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: binding-origin-native-metadata-${{ github.sha }}
          path: ${{ runner.temp }}/binding-origin-native-metadata.tgz
          retention-days: 14
