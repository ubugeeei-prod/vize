name: Level deletion readiness

on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: Successful exact-SHA Real Project Matrix run with davinci-deletion-evidence
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deletion-readiness:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      VIZE_CI_FILES: "${{ github.workspace }}/.github/scripts/workflows/level-deletion-readiness"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          run-install: false
      - name: Download exact-SHA differential evidence
        if: ${{ inputs.evidence_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
        run: . "${{ env.VIZE_CI_FILES }}/download-exact-sha-differential-evidence.sh"
      - name: Check deletion readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: vp node tests/differential/check-deletion-readiness.mjs "$RUNNER_TEMP/davinci-deletion-evidence"
