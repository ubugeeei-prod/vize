# DO NOT EDIT. Generated from tools/config/pkl/workflows/performance/benchmark.pkl.
# Edit the Pkl source and run `node tools/commands/generate/repository-config.ts`.
name: Benchmark - Source comparison

on:
  schedule:
    - cron: "29 5 * * 2"
  # Dispatch records its head SHA from --ref, so validation rejects mismatches.
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full lowercase 40-character base commit SHA
        required: true
        type: string
      head_sha:
        description: Full lowercase 40-character head SHA; --ref must be a branch or tag at this commit
        required: true
        type: string

run-name: "Benchmark ${{ github.event_name == 'schedule' && format('long baseline...{0}', github.sha) || github.event_name == 'workflow_dispatch' && format('{0}...{1}', inputs.base_sha, inputs.head_sha) || format('PR #{0}', github.event.pull_request.number) }}"

concurrency:
  group: benchmark-${{ github.event_name == 'schedule' && 'long-baseline' || github.event_name == 'workflow_dispatch' && format('dispatch-{0}-{1}', inputs.base_sha, inputs.head_sha) || github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BENCHMARK_BASE_SHA: ${{ github.event_name == 'schedule' && 'cea92c7994b4b84c1e42ed74c023b17c0c54090d' || github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha }}
  BENCHMARK_HEAD_SHA: ${{ github.event_name == 'schedule' && github.sha || github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.pull_request.head.sha }}
  # Keep the fastest lane above the runner's noise floor (#1411).
  VIZE_BENCH_FILE_COUNT: 1000
  VIZE_BENCH_RUNS: 10
  VIZE_BENCH_WARMUPS: 2
  VIZE_BENCH_REGRESSION_THRESHOLD_PERCENT: 5
  VIZE_BENCH_BUILD_PROFILE_KEY: ci-opt-release-thin-lto-cgu16

jobs:
  pr-benchmark:
    name: pr-benchmark
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/benchmark/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - name: Validate benchmark SHAs
        if: ${{ github.event_name != 'pull_request' }}
        env:
          RUN_HEAD_SHA: ${{ github.sha }}
        run: . "${{ env.VIZE_CI_FILES }}/validate-benchmark-shas.sh"

      - name: Checkout head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: head
          ref: ${{ env.BENCHMARK_HEAD_SHA }}
          fetch-depth: ${{ github.event_name != 'pull_request' && '0' || '1' }}

      - name: Checkout base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: base
          ref: ${{ env.BENCHMARK_BASE_SHA }}

      - name: Check base checkout
        id: base-integrity
        working-directory: base
        env:
          BASE_SHA: ${{ env.BENCHMARK_BASE_SHA }}
          HEAD_SHA: ${{ env.BENCHMARK_HEAD_SHA }}
          EVENT_NAME: ${{ github.event_name }}
        run: . "${{ env.VIZE_CI_FILES }}/check-base-checkout.sh"

      - name: Install Rust toolchain
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }

      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"

      # The cache action's nested local action resolves from the workspace root,
      # and this job checks the repository out under head/.
      - name: Expose the nested target action at the workspace root
        run: . "${{ env.VIZE_CI_FILES }}/expose-the-nested-target-action-at-the-workspace-root.sh"
      - uses: ./head/.github/actions/setup-rust-sticky-cache
        with:
          key: benchmark-head
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
          target-path: head/target
          secondary-key: benchmark-base
          secondary-target-path: base/target
          secondary-cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}

      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "head/package.json"
          cache: true
          run-install: false

      - name: Install JS dependencies
        working-directory: head
        run: vp install --frozen-lockfile --prefer-offline

      - name: Validate base metadata
        id: validate-base
        if: steps.base-integrity.outputs.skip != 'true'
        continue-on-error: true
        run: . "${{ env.VIZE_CI_FILES }}/validate-base-metadata.sh"

      - name: Skip benchmark when base metadata is invalid
        if: steps.base-integrity.outputs.skip != 'true' && steps.validate-base.outcome != 'success'
        run: . "${{ env.VIZE_CI_FILES }}/skip-benchmark-when-base-metadata-is-invalid.sh"

      - name: Cache base CLI
        id: cache-base-cli
        if: steps.base-integrity.outputs.skip != 'true' && steps.validate-base.outcome == 'success'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: base/target/ci-opt/vize
          key: ${{ runner.os }}-${{ runner.arch }}-benchmark-base-${{ env.VIZE_BENCH_BUILD_PROFILE_KEY }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ env.BENCHMARK_BASE_SHA }}

      # Inject ci-opt so old bases build and both sides use identical settings.
      # This exact configuration is represented by the cache/profile key above.
      - name: Build base CLI
        id: build-base
        if: steps.base-integrity.outputs.skip != 'true' && steps.validate-base.outcome == 'success' && steps.cache-base-cli.outputs.cache-hit != 'true'
        continue-on-error: true
        run: >-
          cargo build --manifest-path base/Cargo.toml --profile ci-opt -p vize --config 'profile.ci-opt.inherits="release"' --config 'profile.ci-opt.lto="thin"' --config 'profile.ci-opt.codegen-units=16'

      # Skip an unbuildable base instead of hard-failing a hotfix PR.
      - name: Skip benchmark when base CLI cannot be built
        if: steps.base-integrity.outputs.skip != 'true' && steps.validate-base.outcome == 'success' && steps.build-base.outcome == 'failure'
        run: . "${{ env.VIZE_CI_FILES }}/skip-benchmark-when-base-cli-cannot-be-built.sh"

      - name: Cache head CLI
        id: cache-head-cli
        if: steps.base-integrity.outputs.skip != 'true' && steps.validate-base.outcome == 'success' && steps.build-base.outcome != 'failure'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: head/target/ci-opt/vize
          key: ${{ runner.os }}-${{ runner.arch }}-benchmark-head-${{ env.VIZE_BENCH_BUILD_PROFILE_KEY }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ env.BENCHMARK_HEAD_SHA }}

      - name: Build head CLI
        if: steps.base-integrity.outputs.skip != 'true' && steps.validate-base.outcome == 'success' && steps.cache-head-cli.outputs.cache-hit != 'true' && steps.build-base.outcome != 'failure'
        run: >-
          cargo build --manifest-path head/Cargo.toml --profile ci-opt -p vize --config 'profile.ci-opt.inherits="release"' --config 'profile.ci-opt.lto="thin"' --config 'profile.ci-opt.codegen-units=16'

      - name: Generate benchmark input
        if: steps.base-integrity.outputs.skip != 'true' && steps.validate-base.outcome == 'success' && steps.build-base.outcome != 'failure'
        working-directory: head
        run: node tools/benchmarks/scripts/generate.mjs "$VIZE_BENCH_FILE_COUNT"

      - name: Compare base and head
        if: steps.base-integrity.outputs.skip != 'true' && steps.validate-base.outcome == 'success' && steps.build-base.outcome != 'failure'
        run: . "${{ env.VIZE_CI_FILES }}/compare-base-and-head.sh"

      - name: Observe CSS completion and hover on existing base and head CLIs
        if: steps.base-integrity.outputs.skip != 'true' && steps.validate-base.outcome == 'success' && steps.build-base.outcome != 'failure'
        run: >-
          node head/tools/benchmarks/scripts/css-documentation.ts "$GITHUB_WORKSPACE/base/target/ci-opt/vize" "$GITHUB_WORKSPACE/head/target/ci-opt/vize" "$BENCHMARK_BASE_SHA" "$BENCHMARK_HEAD_SHA" "$GITHUB_WORKSPACE/css-documentation-observations.json"

      - name: Record benchmark build provenance
        if: steps.base-integrity.outputs.skip != 'true' && steps.validate-base.outcome == 'success' && steps.build-base.outcome != 'failure'
        run: . "${{ env.VIZE_CI_FILES }}/record-benchmark-build-provenance.sh"

      - name: Write job summary
        run: . "${{ env.VIZE_CI_FILES }}/write-job-summary.sh"

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-benchmark
          path: |
            benchmark-summary.md
            benchmark-results.json
            benchmark-provenance.txt
            css-documentation-observations.json
          if-no-files-found: warn
          retention-days: 14

  pr-benchmark-budget:
    name: pr-benchmark-budget
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5
    needs:
      - pr-benchmark
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: head
          ref: ${{ env.BENCHMARK_HEAD_SHA }}

      # enforce-pr-budget.ts relies on Node's type stripping, so pin the
      # workspace Node instead of the runner image default. Nothing is installed.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: "head/package.json"
          package-manager-cache: false

      - name: Download benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-benchmark

      - name: Enforce benchmark budget
        env:
          PR_LABELS_JSON: ${{ github.event_name == 'pull_request' && toJSON(github.event.pull_request.labels.*.name) || '[]' }}
        run: >-
          node head/tools/benchmarks/scripts/enforce-pr-budget.ts --json benchmark-results.json --labels-json "$PR_LABELS_JSON"

  pr-benchmark-comment:
    name: pr-benchmark-comment
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - pr-benchmark
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Download benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-benchmark

      - name: Comment on PR
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BENCHMARK_COMMENT_KEY: ${{ github.event.pull_request.head.sha }}
        run: node tools/benchmarks/scripts/comment-pr.mjs --body benchmark-summary.md --comment-key "$BENCHMARK_COMMENT_KEY"
