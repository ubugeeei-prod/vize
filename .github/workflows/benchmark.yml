name: Cross-file finalization observations
run-name: Cross-file read-only facts @ ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-file-finalize-facts-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FACTS_CORE_BASE_SHA: 0a5bd041a2b7353be157215c78966f170deb613c

jobs:
  observe-source-facts:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: "1.99.1"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: cross-file-sfc-effects
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Confirm product sources are unchanged and retain provenance
        run: |
          mkdir -p target/vize-tests/cross-file-finalize-facts
          git diff --exit-code "$FACTS_CORE_BASE_SHA" HEAD -- crates/vize_croquis_cf/src crates/vize_croquis/src crates/vize_atelier_sfc/src crates/vize/src crates/vize_vitrine/src Cargo.lock davinci/vize_l0
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const run = (...args) => execFileSync(args[0], args.slice(1), { encoding: 'utf8' }).trim();
          const paths = ['crates/vize_croquis_cf/src','crates/vize_croquis/src','crates/vize_atelier_sfc/src','crates/vize/src','crates/vize_vitrine/src','davinci/vize_l0'];
          fs.writeFileSync('target/vize-tests/cross-file-finalize-facts/provenance.json', JSON.stringify({ schema: 'vize.cross-file.finalization-facts.provenance', sourceSha: run('git','rev-parse','HEAD'), expectedSha: process.env.GITHUB_SHA, unchangedCoreBase: process.env.FACTS_CORE_BASE_SHA, trees: Object.fromEntries(paths.map(path => [path,run('git','rev-parse',`HEAD:${path}`)])), rustc: run('rustc','--version','--verbose'), cargo: run('cargo','--version'), lockSha256: crypto.createHash('sha256').update(fs.readFileSync('Cargo.lock')).digest('hex'), profile: 'ci', compilationCommand: ['cargo','run','--locked','--profile','ci','-p','vize','--example','cross_file_finalize_facts','--','target/vize-tests/cross-file-finalize-facts'], qualified: false }, null, 2));
          JS
      - name: Install frozen build tools
        run: vp install --frozen-lockfile --prefer-offline
      - name: Observe complete registry, graph and diagnostic facts
        run: |
          cargo run --locked --profile ci -p vize --example cross_file_finalize_facts -- target/vize-tests/cross-file-finalize-facts > target/vize-tests/cross-file-finalize-facts/rust.stdout 2> target/vize-tests/cross-file-finalize-facts/rust.stderr
          cat target/vize-tests/cross-file-finalize-facts/rust.stdout
          sha256sum target/ci/examples/cross_file_finalize_facts > target/vize-tests/cross-file-finalize-facts/observer-image.sha256
      - name: Retain complete observations even when a property differs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-file-finalize-facts-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/vize-tests/cross-file-finalize-facts
          if-no-files-found: error
          retention-days: 14
