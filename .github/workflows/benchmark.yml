name: Benchmark

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VIZE_BENCH_FILE_COUNT: 300
  VIZE_BENCH_RUNS: 5
  VIZE_BENCH_WARMUPS: 1

jobs:
  pr-benchmark:
    name: pr-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: head
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "benchmark"
          cache-workspace-crates: "true"

      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "head/.node-version"
          cache: true
          run-install: false

      - name: Install JS dependencies
        working-directory: head
        run: vp install --frozen-lockfile --prefer-offline

      - name: Validate base metadata
        id: validate-base
        continue-on-error: true
        run: cargo metadata --manifest-path base/Cargo.toml --format-version 1 --no-deps > /dev/null

      - name: Skip benchmark when base metadata is invalid
        if: steps.validate-base.outcome != 'success'
        run: |
          {
            echo "## PR Benchmark"
            echo
            echo "Base metadata could not be parsed, so the benchmark was skipped for this PR."
            echo
            echo "| status | reason |"
            echo "| --- | --- |"
            echo "| skipped | base checkout is not buildable |"
          } > benchmark-summary.md

      - name: Cache base CLI
        id: cache-base-cli
        if: steps.validate-base.outcome == 'success'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: base/target/ci/vize
          key: ${{ runner.os }}-benchmark-base-cli-${{ github.event.pull_request.base.sha }}

      - name: Build base CLI
        if: steps.validate-base.outcome == 'success' && steps.cache-base-cli.outputs.cache-hit != 'true'
        run: cargo build --manifest-path base/Cargo.toml --profile ci -p vize

      - name: Cache head CLI
        id: cache-head-cli
        if: steps.validate-base.outcome == 'success'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: head/target/ci/vize
          key: ${{ runner.os }}-benchmark-head-cli-${{ github.event.pull_request.head.sha }}

      - name: Build head CLI
        if: steps.validate-base.outcome == 'success' && steps.cache-head-cli.outputs.cache-hit != 'true'
        run: cargo build --manifest-path head/Cargo.toml --profile ci -p vize

      - name: Generate benchmark input
        if: steps.validate-base.outcome == 'success'
        working-directory: head
        run: node bench/generate.mjs "$VIZE_BENCH_FILE_COUNT"

      - name: Compare base and head
        if: steps.validate-base.outcome == 'success'
        run: |
          node head/bench/compare-pr.mjs \
            --input "$GITHUB_WORKSPACE/head/bench/__in__" \
            --base-bin "$GITHUB_WORKSPACE/base/target/ci/vize" \
            --head-bin "$GITHUB_WORKSPACE/head/target/ci/vize" \
            --base-label "${{ github.event.pull_request.base.sha }}" \
            --head-label "${{ github.event.pull_request.head.sha }}" \
            --runs "$VIZE_BENCH_RUNS" \
            --warmups "$VIZE_BENCH_WARMUPS" \
            --out "$GITHUB_WORKSPACE/benchmark-summary.md" \
            --json "$GITHUB_WORKSPACE/benchmark-results.json"

      - name: Write job summary
        run: cat benchmark-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-benchmark
          path: |
            benchmark-summary.md
            benchmark-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Comment on PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BENCHMARK_COMMENT_KEY: ${{ github.event.pull_request.head.sha }}
        run: node base/bench/comment-pr.mjs --body benchmark-summary.md --comment-key "$BENCHMARK_COMMENT_KEY"
