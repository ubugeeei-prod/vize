name: Title Policy

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    branches: [main, davinci]
    types: [opened, edited, reopened, synchronize, ready_for_review]

concurrency:
  group: title-policy-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  issue-pr-title-policy:
    name: Normalize titles and assignees
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/actions/setup-rust-script
            tools/commands/ci/github/issue-pr-title-policy.rs
            tools/support/common.rs
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: ./.github/actions/setup-rust-script

      - name: Apply issue and PR title policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: rust-script tools/commands/ci/github/issue-pr-title-policy.rs
