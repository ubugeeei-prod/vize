name: Clean obsolete merge groups

on:
  workflow_run:
    workflows: [Check]
    types: [requested, completed]
  workflow_dispatch:

concurrency:
  group: cleanup-obsolete-merge-groups
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      # workflow_run has write authority: execute only trusted default-branch code.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /tools/support/compat/github/cancel-obsolete-merge-groups.ts
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Cancel only superseded queue candidates
        run: node tools/support/compat/github/cancel-obsolete-merge-groups.ts
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retain cancellation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obsolete-merge-groups-${{ github.run_id }}
          path: ${{ runner.temp }}/obsolete-merge-groups.json
          if-no-files-found: ignore
