name: Canon helper native baseline
on:
  pull_request:
    paths:
      - tools/benchmarks/scripts/canon-helper-*.ts
      - tools/support/process-launcher.ts
      - tools/support/launchers/exec*.sh
      - tools/benchmarks/scripts/canon-template-helper-carrier.ts
      - tests/tooling/canon-helper-native-proxy.test.ts
      - .github/workflows/canon-helper-native-baseline.yml
      - .github/scripts/workflows/canon-helper-native-baseline/**
      - .github/scripts/workflows/shared/**
  workflow_dispatch:
    inputs:
      sfcs:
        type: choice
        options: ["1", "10", "100", "2500"]
        default: "1"
permissions:
  contents: read
concurrency:
  group: canon-helper-native-baseline-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sfcs: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('[{0}]', inputs.sfcs) || '[1]') }}
    env:
      NODE_DISABLE_COMPILE_CACHE: "1"
      GOMAXPROCS: "2"
      RAYON_NUM_THREADS: "2"
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/canon-helper-native-baseline/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 1d1bb26a7f7dcbcb9adf75075bd7ad301c0bb957
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.14.0"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - name: Regenerate and verify the fixed normal source image
        run: . "${{ env.VIZE_CI_FILES }}/regenerate-and-verify-the-fixed-normal-source-image.sh"
      - name: Check out the reviewed helper harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: b31168ec9c5282f4b58de1d9f5f64e8aa7b7bdaf
          path: .admission-driver
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /tools/benchmarks/scripts/type-admission-scale.ts
            /tools/benchmarks/scripts/type-admission-scale-types.ts
            /tools/benchmarks/scripts/type-admission-scale-sfc.ts
            /tools/benchmarks/scripts/type-admission-scale-graph.ts
            /tests/tooling/support/type-admission-fixtures.ts
            /tests/tooling/support/type-admission-mutation.ts
      - name: Install one pinned public helper provider and the integrated native backend
        run: . "${{ env.VIZE_CI_FILES }}/install-one-pinned-public-helper-provider-and-the-integrated-native-back.sh"
      - name: Run the proxy byte and classification controls
        run: . "${{ env.VIZE_CI_FILES }}/run-the-proxy-byte-and-classification-controls.sh"
      - name: Preserve the frozen public repro and independently poison inferred slot payloads
        env:
          VIZE_SOURCE_SDK_ROOT: ${{ github.workspace }}/npm/cli
        run: . "${{ env.VIZE_CI_FILES }}/preserve-the-frozen-public-repro-and-independently-poison-inferred-slot.sh"
      - name: Capture actual CLI and source mapper packets with mutation and repair oracles
        env:
          VIZE_MATRIX_SFCS: "${{ matrix.sfcs }}"
          VIZE_SOURCE_SDK_ROOT: ${{ github.workspace }}/npm/cli
        run: . "${{ env.VIZE_CI_FILES }}/capture-actual-cli-and-source-mapper-packets-with-mutation-and-repair-or.sh"
      - name: Package only bounded authored inputs and raw evidence
        if: always()
        run: . "${{ env.VIZE_CI_FILES }}/package-only-bounded-authored-inputs-and-raw-evidence.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: canon-helper-native-baseline-${{ matrix.sfcs }}-${{ github.sha }}
          path: ${{ runner.temp }}/helper-baseline-evidence.tgz
          retention-days: 14
