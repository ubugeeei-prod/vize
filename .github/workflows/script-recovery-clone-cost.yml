name: Script recovery clone cost
on:
  pull_request:
    paths:
      - .github/workflows/script-recovery-clone-clone-cost.yml
      - crates/vize_croquis/src/script_parser/recovery.rs
      - crates/vize_croquis/src/script_parser/recovery/**
      - davinci/vize_l0/examples/source_recovery_clone_benchmark.rs
      - davinci/vize_l0/tests/source_probes/mod.rs
      - tools/benchmarks/scripts/compare_recovery_clone.py
  workflow_dispatch:
    inputs:
      base_sha:
        description: Immutable first-parent baseline commit
        type: string
        required: true
permissions: { contents: read }
concurrency:
  group: script-recovery-clone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: script-recovery-clone-functional-v1
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Check full parser packets and source laws without timing qualification
        run: |
          set -euo pipefail
          mkdir -p functional-evidence
          git rev-parse HEAD > functional-evidence/source.sha
          rustc +1.99.1 -vV > functional-evidence/rustc.txt
          lscpu > functional-evidence/cpu.txt
          python3 -c 'import json,os; print(json.dumps({"runner":{k:os.environ.get(k) for k in ("RUNNER_NAME","RUNNER_OS","RUNNER_ARCH","RUNNER_ENVIRONMENT","CARGO_BUILD_JOBS")},"affinity":sorted(os.sched_getaffinity(0)),"scope":"untimed parser packets and counter laws; no throughput comparison"}))' > functional-evidence/resources.json
          python3 tools/benchmarks/scripts/recovery_cost_contract.py | tee functional-evidence/recovery-class-controls.log
          python3 tools/benchmarks/scripts/compare_recovery_clone.py --self-test | tee functional-evidence/clone-class-controls.log
          cargo +1.99.1 test --locked --profile ci -p vize_croquis script_parser::recovery --message-format json -- --nocapture 2>&1 | tee functional-evidence/parser-packets.log
          cargo +1.99.1 test --locked --profile ci -p vize_l0 --test source_operations_profile --features micro-profiling --message-format json 2>&1 | tee functional-evidence/source-counter-laws.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: script-recovery-clone-functional-${{ github.sha }}
          path: functional-evidence/
          if-no-files-found: error
  allocation-law:
    needs: functional
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DECLARED_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: script-recovery-clone-allocation-law-v1
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Preserve the immutable profile-only pair and shared carrier
        run: |
          set -euo pipefail
          mkdir -p allocation-evidence
          git rev-parse HEAD > allocation-evidence/head.sha
          git cat-file commit HEAD > allocation-evidence/head.commit
          python3 -c 'from pathlib import Path; lines=Path("allocation-evidence/head.commit").read_bytes().partition(b"\n\n")[0].splitlines(); parents=[line.split()[1].decode() for line in lines if line.startswith(b"parent ")]; assert parents; Path("allocation-evidence/base.sha").write_text(parents[0]+"\n")'
          allocation_base_sha=$(cat allocation-evidence/base.sha)
          [[ "$allocation_base_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$allocation_base_sha" = "$DECLARED_BASE_SHA"
          git fetch --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$allocation_base_sha"
          git worktree add --detach "$RUNNER_TEMP/recovery-allocation-base" "$allocation_base_sha"
          test "$(git -C "$RUNNER_TEMP/recovery-allocation-base" rev-parse HEAD)" = "$allocation_base_sha"
          cp davinci/vize_l0/examples/source_recovery_clone_benchmark.rs "$RUNNER_TEMP/recovery-allocation-base/davinci/vize_l0/examples/"
          git diff --name-status "$allocation_base_sha" HEAD > allocation-evidence/source-diff.txt
          rustc +1.99.1 -vV > allocation-evidence/rustc.txt
          lscpu > allocation-evidence/cpu.txt
          python3 - <<'PYIDENTITY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('allocation-evidence')
          sha = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          receipt = {'base': (root/'base.sha').read_text().strip(), 'firstParent': (root/'base.sha').read_text().strip(), 'declaredBase': os.environ['DECLARED_BASE_SHA'], 'head': (root/'head.sha').read_text().strip(), 'sourceDiff': (root/'source-diff.txt').read_text().splitlines(), 'normalTimingQualified': False, 'roles': {}}
          for role in ('base','head'):
              source = pathlib.Path(os.environ['RUNNER_TEMP'])/'recovery-allocation-base' if role == 'base' else pathlib.Path(os.environ['GITHUB_WORKSPACE'])
              receipt['roles'][role] = {'sourceRoot': str(source), 'recoverySha256': sha(source/'crates/vize_croquis/src/script_parser/recovery.rs'), 'lockSha256': sha(source/'Cargo.lock'), 'carrierSha256': sha(source/'davinci/vize_l0/examples/source_recovery_clone_benchmark.rs')}
          assert receipt['roles']['base']['lockSha256'] == receipt['roles']['head']['lockSha256']
          assert receipt['roles']['base']['carrierSha256'] == receipt['roles']['head']['carrierSha256']
          (root/'identity.json').write_text(json.dumps(receipt,indent=2)+'\n')
          (root/'resources.json').write_text(json.dumps({'runner': {key:os.environ.get(key) for key in ('RUNNER_NAME','RUNNER_OS','RUNNER_ARCH','RUNNER_ENVIRONMENT','CARGO_BUILD_JOBS','RUSTFLAGS','CARGO_ENCODED_RUSTFLAGS','CARGO_INCREMENTAL')}, 'affinity':sorted(os.sched_getaffinity(0)), 'scope':'untimed allocation/source-count law only; instrumented elapsedNs is unqualified'},indent=2)+'\n')
          PYIDENTITY
      - name: Build independent instrumented roles and admit the small allocation law
        run: |
          set -euo pipefail
          for role in base head; do
            source="$GITHUB_WORKSPACE"
            if [[ "$role" == base ]]; then source="$RUNNER_TEMP/recovery-allocation-base"; fi
            cargo +1.99.1 build --locked --profile ci-opt --manifest-path "$source/Cargo.toml" --target-dir "$GITHUB_WORKSPACE/target/recovery-allocation-$role-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -p vize_l0 --example source_recovery_clone_benchmark --features micro-profiling --message-format json > "allocation-evidence/profile-build-$role.jsonl"
            cp "target/recovery-allocation-$role-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/ci-opt/examples/source_recovery_clone_benchmark" "allocation-evidence/instrumented-$role"
            for scenario in irreparable valid repairable; do
              "allocation-evidence/instrumented-$role" 8 4096 profile "$scenario" > "allocation-evidence/profile-$scenario-$role-4096.json"
            done
          done
          python3 tools/benchmarks/scripts/compare_recovery_clone.py allocation-tiny allocation-evidence
      - name: Enforce allocation and parse-call laws on huge authored sources
        run: |
          set -euo pipefail
          for scenario in irreparable valid repairable; do
            for bytes in 131072 1048576 10485760; do
              for role in base head; do
                "allocation-evidence/instrumented-$role" 3 "$bytes" profile "$scenario" > "allocation-evidence/profile-$scenario-$role-$bytes.json"
              done
            done
          done
          python3 tools/benchmarks/scripts/compare_recovery_clone.py allocation-matrix allocation-evidence
          rm allocation-evidence/instrumented-base allocation-evidence/instrumented-head
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: script-recovery-clone-allocation-summary-${{ github.sha }}
          path: |
            allocation-evidence/clone-allocation-*-summary.json
            allocation-evidence/identity.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: script-recovery-clone-allocation-${{ github.sha }}
          path: |
            allocation-evidence/*.json
            allocation-evidence/*.jsonl
            allocation-evidence/*.txt
            allocation-evidence/*.sha
            allocation-evidence/*.commit
          if-no-files-found: error
  compare:
    needs: [functional, allocation-law]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 40
    env:
      DECLARED_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
      EVENT_KIND: ${{ github.event_name }}
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - name: Reject invalid clone comparisons before building
        run: python3 tools/benchmarks/scripts/compare_recovery_clone.py --self-test
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: script-recovery-clone-v1
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Preserve exact source identities and the shared benchmark carrier
        run: |
          set -euo pipefail
          [[ "$DECLARED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p evidence
          printf '%s\n' "$DECLARED_BASE_SHA" > evidence/declared-base.sha
          git rev-parse HEAD > evidence/head.sha
          git cat-file commit HEAD > evidence/head.commit
          python3 -c 'from pathlib import Path; h=Path("evidence/head.commit").read_bytes().partition(b"\n\n")[0].splitlines(); p=[x.split()[1].decode() for x in h if x.startswith(b"parent ")]; assert p; Path("evidence/first-parent.sha").write_text(p[0]+"\n")'
          recovery_base_sha=$(cat evidence/first-parent.sha)
          [[ "$recovery_base_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$recovery_base_sha" != "$(git rev-parse HEAD)"
          if [[ "$EVENT_KIND" == workflow_dispatch ]]; then test "$DECLARED_BASE_SHA" = "$recovery_base_sha"; fi
          git fetch --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$recovery_base_sha"
          git worktree add --detach "$RUNNER_TEMP/recovery-base" "$recovery_base_sha"
          git -C "$RUNNER_TEMP/recovery-base" rev-parse HEAD > evidence/base.sha
          test "$(cat evidence/base.sha)" = "$(cat evidence/first-parent.sha)"
          git diff --name-status "$recovery_base_sha" HEAD > evidence/source-diff.txt
          cp davinci/vize_l0/examples/source_recovery_clone_benchmark.rs "$RUNNER_TEMP/recovery-base/davinci/vize_l0/examples/"
          sha256sum davinci/vize_l0/examples/source_recovery_clone_benchmark.rs "$RUNNER_TEMP/recovery-base/davinci/vize_l0/examples/source_recovery_clone_benchmark.rs" > evidence/carriers.sha256
          test "$(cut -d' ' -f1 evidence/carriers.sha256 | sort -u | wc -l)" -eq 1
          rustc +1.99.1 -vV > evidence/rustc.txt
          lscpu > evidence/cpu.txt
      - name: Compare complete parser packets and exact source counter controls
        run: |
          set -euo pipefail
          cargo +1.99.1 test --locked --profile ci -p vize_croquis script_parser::recovery 2>&1 | tee evidence/recovery-packets.log
          cargo +1.99.1 test --locked --profile ci -p vize_l0 --test source_operations_profile --features micro-profiling 2>&1 | tee evidence/callsite-controls.log
      - name: Build independent baseline and candidate targets with equal flags
        run: |
          set -euo pipefail
          for role in base head; do
            source="$GITHUB_WORKSPACE"
            if [[ "$role" == base ]]; then source="$RUNNER_TEMP/recovery-base"; fi
            cargo +1.99.1 build --locked --profile ci-opt --manifest-path "$source/Cargo.toml" --target-dir "$GITHUB_WORKSPACE/target/recovery-clone-$role-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -p vize_l0 --example source_recovery_clone_benchmark --message-format json > "evidence/build-$role.jsonl"
            cp "target/recovery-clone-$role-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/ci-opt/examples/source_recovery_clone_benchmark" "evidence/normal-$role"
            sha256sum "$source/Cargo.lock" "$source/crates/vize_croquis/src/script_parser/recovery.rs" > "evidence/inputs-$role.sha256"
          done
          sha256sum evidence/normal-base evidence/normal-head > evidence/binaries.sha256
          test "$(sha256sum evidence/normal-base | cut -d' ' -f1)" != "$(sha256sum evidence/normal-head | cut -d' ' -f1)"
          python3 - <<'PYIDENTITY'
          import hashlib, json, os, pathlib
          evidence = pathlib.Path('evidence')
          sha = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          receipt = {'declaredBase': (evidence/'declared-base.sha').read_text().strip(), 'base': (evidence/'base.sha').read_text().strip(), 'head': (evidence/'head.sha').read_text().strip(), 'firstParent': (evidence/'first-parent.sha').read_text().strip(), 'sourceDiff': (evidence/'source-diff.txt').read_text().splitlines(), 'roles': {}}
          assert receipt['base'] == receipt['firstParent']
          for role in ('base', 'head'):
              source = pathlib.Path(os.environ['RUNNER_TEMP'])/'recovery-base' if role == 'base' else pathlib.Path(os.environ['GITHUB_WORKSPACE'])
              rows = [json.loads(x) for x in (evidence/f'build-{role}.jsonl').read_text().splitlines()]
              artifacts = [x for x in rows if x.get('reason') == 'compiler-artifact']
              croquis = [x for x in artifacts if x['target']['name'] == 'vize_croquis' and x['target']['kind'] == ['lib']]
              carrier = [x for x in artifacts if x['target']['name'] == 'source_recovery_clone_benchmark' and x['target']['kind'] == ['example']]
              assert len(croquis) == len(carrier) == 1
              assert pathlib.Path(croquis[0]['manifest_path']) == source/'crates/vize_croquis/Cargo.toml'
              assert pathlib.Path(carrier[0]['target']['src_path']) == source/'davinci/vize_l0/examples/source_recovery_clone_benchmark.rs'
              executable = pathlib.Path(carrier[0]['executable'])
              assert sha(executable) == sha(evidence/f'normal-{role}')
              receipt['roles'][role] = {'sourceRoot': str(source), 'recoverySha256': sha(source/'crates/vize_croquis/src/script_parser/recovery.rs'), 'lockSha256': sha(source/'Cargo.lock'), 'carrierSha256': sha(source/'davinci/vize_l0/examples/source_recovery_clone_benchmark.rs'), 'binarySha256': sha(executable), 'artifacts': [{k:x[k] for k in ('package_id', 'manifest_path', 'target', 'profile', 'features', 'fresh', 'executable')} for x in (croquis[0], carrier[0])]}
          assert receipt['roles']['base']['carrierSha256'] == receipt['roles']['head']['carrierSha256']
          assert receipt['roles']['base']['lockSha256'] == receipt['roles']['head']['lockSha256']
          (evidence/'identity.json').write_text(json.dumps(receipt, indent=2)+'\n')
          PYIDENTITY
      - name: Admit the small carrier before the huge-file matrix
        run: |
          set -euo pipefail
          cpus=$(python3 -c 'import os;print(",".join(map(str,sorted(os.sched_getaffinity(0))[:8])))')
          printf '%s\n' "$cpus" > evidence/affinity.txt
          for scenario in irreparable valid repairable; do
            for role in base head; do
              taskset -c "$cpus" "evidence/normal-$role" 8 4096 normal "$scenario" > "evidence/normal-$scenario-$role-4096-1.json"
            done
          done
          for role in base head; do
            source="$GITHUB_WORKSPACE"
            if [[ "$role" == base ]]; then source="$RUNNER_TEMP/recovery-base"; fi
            cargo +1.99.1 build --locked --profile ci-opt --manifest-path "$source/Cargo.toml" --target-dir "$GITHUB_WORKSPACE/target/recovery-clone-$role-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -p vize_l0 --example source_recovery_clone_benchmark --features micro-profiling --message-format json > "evidence/profile-build-$role.jsonl"
            cp "target/recovery-clone-$role-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/ci-opt/examples/source_recovery_clone_benchmark" "evidence/instrumented-$role"
            for scenario in irreparable valid repairable; do
              taskset -c "$cpus" "evidence/instrumented-$role" 8 4096 profile "$scenario" > "evidence/profile-$scenario-$role-4096.json"
            done
          done
          sha256sum evidence/instrumented-base evidence/instrumented-head > evidence/instrumented-binaries.sha256
          python3 tools/benchmarks/scripts/compare_recovery_clone.py tiny evidence
      - name: Measure actual-code Unicode and CRLF sources on each size axis
        run: |
          set -euo pipefail
          cpus=$(cat evidence/affinity.txt)
          for scenario in irreparable valid repairable; do
            for bytes in 131072 1048576 10485760; do
              for round in 1 2 3; do
                order='base head'
                if [[ "$round" == 2 ]]; then order='head base'; fi
                for role in $order; do
                  /usr/bin/time -v -o "evidence/time-$scenario-$role-$bytes-$round.txt" taskset -c "$cpus" "evidence/normal-$role" 5 "$bytes" normal "$scenario" > "evidence/normal-$scenario-$role-$bytes-$round.json"
                done
              done
              for role in base head; do
                taskset -c "$cpus" "evidence/instrumented-$role" 3 "$bytes" profile "$scenario" > "evidence/profile-$scenario-$role-$bytes.json"
              done
            done
          done
          python3 tools/benchmarks/scripts/compare_recovery_clone.py matrix evidence
          rm evidence/normal-base evidence/normal-head evidence/instrumented-base evidence/instrumented-head
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: script-recovery-clone-summary-${{ github.sha }}
          path: |
            evidence/clone-*-summary.json
            evidence/identity.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: script-recovery-clone-${{ github.sha }}
          path: |
            evidence/*.json
            evidence/*.jsonl
            evidence/*.log
            evidence/*.txt
            evidence/*.sha
            evidence/*.sha256
            evidence/*.commit
          if-no-files-found: error
