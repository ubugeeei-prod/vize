name: V1 exact candidate admission

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact 40-character source candidate to admit
        required: true
        type: string
      receipt_run_id:
        description: Actions run that owns the exact receipt bundle
        required: true
        type: string
      receipt_artifact:
        description: Artifact containing v1-exact-candidate-receipts.json
        required: true
        type: string
      enforce_complete:
        description: Reject any required host row without complete exact receipts
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character source candidate to admit
        required: true
        type: string
      receipt_run_id:
        description: Actions run that owns the exact receipt bundle
        required: true
        type: string
      receipt_artifact:
        description: Artifact containing v1-exact-candidate-receipts.json
        required: true
        type: string
      enforce_complete:
        description: Reject any required host row without complete exact receipts
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: v1-exact-candidate-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  plan:
    name: Generate exact host plan
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      hosts: ${{ steps.plan.outputs.hosts }}
      host_count: ${{ steps.plan.outputs.host_count }}
      row_count: ${{ steps.plan.outputs.row_count }}
      receipt_run: ${{ steps.receipt-run.outputs.run }}
      receipt_run_attempt: ${{ steps.receipt-run.outputs.attempt }}
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/v1-exact-candidate/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Verify the exact candidate checkout
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: . "${{ env.VIZE_CI_FILES }}/verify-the-exact-candidate-checkout.sh"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", package-manager-cache: false }
      - name: Bind the receipt run to the exact candidate
        id: receipt-run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RECEIPT_RUN_ID: ${{ inputs.receipt_run_id }}
        run: . "${{ env.VIZE_CI_FILES }}/bind-the-receipt-run-to-the-exact-candidate.sh"
      - name: Download the immutable receipt bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.receipt_artifact }}
          path: .qualification/receipts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.receipt_run_id }}
      - name: Require the canonical receipt bundle name
        run: test -f .qualification/receipts/v1-exact-candidate-receipts.json
      - name: Derive every host row from the committed manifest
        id: plan
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: >-
          node tools/commands/release/v1-exact-candidate.ts plan
          --candidate "$CANDIDATE_SHA" --github-output
      - name: Preserve the source receipt bundle for row admission
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1-exact-candidate-receipt-bundle-${{ inputs.candidate_sha }}
          path: .qualification/receipts/v1-exact-candidate-receipts.json
          if-no-files-found: error
          retention-days: 30

  validate-host:
    name: Admit ${{ matrix.id }}
    needs: plan
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.hosts) }}
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/v1-exact-candidate/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", package-manager-cache: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: v1-exact-candidate-receipt-bundle-${{ inputs.candidate_sha }}
          path: .qualification/receipts
      - name: Admit exact positive, negative and qualification receipts
        shell: bash
        env:
          VIZE_NEEDS_PLAN_OUTPUTS_RECEIPT_RUN: "${{ needs.plan.outputs.receipt_run }}"
          VIZE_NEEDS_PLAN_OUTPUTS_RECEIPT_RUN_ATTEMPT: "${{ needs.plan.outputs.receipt_run_attempt }}"
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          HOST_ID: ${{ matrix.id }}
        run: . "${{ env.VIZE_CI_FILES }}/admit-exact-positive-negative-and-qualification-receipts.sh"
      - name: Preserve immutable host admission
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1-host-admission-${{ inputs.candidate_sha }}-${{ matrix.id }}
          path: .qualification/admission/${{ inputs.candidate_sha }}-${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 30

  admit:
    name: Enforce one exact candidate
    needs: [plan, validate-host]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/v1-exact-candidate/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", package-manager-cache: false }
      - name: Download every host admission from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: v1-host-admission-${{ inputs.candidate_sha }}-*
          path: .qualification/admissions
          merge-multiple: true
      - name: Assemble the exact-candidate manifest
        shell: bash
        env:
          VIZE_NEEDS_PLAN_OUTPUTS_RECEIPT_RUN: "${{ needs.plan.outputs.receipt_run }}"
          VIZE_NEEDS_PLAN_OUTPUTS_RECEIPT_RUN_ATTEMPT: "${{ needs.plan.outputs.receipt_run_attempt }}"
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: . "${{ env.VIZE_CI_FILES }}/assemble-the-exact-candidate-manifest.sh"
      - name: Enforce complete exact-candidate host qualification
        if: ${{ inputs.enforce_complete }}
        shell: bash
        env:
          VIZE_NEEDS_PLAN_OUTPUTS_RECEIPT_RUN: "${{ needs.plan.outputs.receipt_run }}"
          VIZE_NEEDS_PLAN_OUTPUTS_RECEIPT_RUN_ATTEMPT: "${{ needs.plan.outputs.receipt_run_attempt }}"
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: . "${{ env.VIZE_CI_FILES }}/enforce-complete-exact-candidate-host-qualification.sh"
      - name: Preserve the admitted manifest
        if: ${{ always() && hashFiles('.qualification/v1-exact-candidate-manifest.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1-exact-candidate-manifest-${{ inputs.candidate_sha }}
          path: .qualification/v1-exact-candidate-manifest.json
          if-no-files-found: error
          retention-days: 30
