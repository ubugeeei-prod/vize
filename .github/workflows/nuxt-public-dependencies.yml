name: Nuxt public runtime dependencies
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/nuxt-public-dependencies.yml
      - npm/framework/nuxt/**
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - tools/support/security/**
      - tests/tooling/nuxt-kit-consumer.test.ts
  push:
    branches: [main]
    paths:
      - .github/workflows/nuxt-public-dependencies.yml
      - npm/framework/nuxt/**
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - tools/support/security/**
      - tests/tooling/nuxt-kit-consumer.test.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuxt-public-dependencies-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-kit:
    name: Packed module runtime Kit without workspace overrides
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install workspace tooling
        run: vp install --frozen-lockfile --prefer-offline
      - name: Verify full historical audit refusals
        run: vp node --test tests/tooling/nuxt-kit-consumer.test.ts
      - name: Build the candidate Nuxt module
        run: |
          pnpm --filter @vizejs/nuxt-lint-config build
          pnpm --filter @vizejs/nuxt build
      - name: Pack the actual publishable manifest
        working-directory: npm/framework/nuxt
        run: pnpm pack --pack-destination "$RUNNER_TEMP/nuxt-public-kit-pack"
      - name: Resolve and audit the packed public Kit edge in a fresh consumer
        run: vp node tools/support/security/nuxt-kit-consumer.ts "$RUNNER_TEMP"/nuxt-public-kit-pack/*.tgz "$RUNNER_TEMP/nuxt-public-kit-proof"
      - name: Preserve archive, manifest, full graph and raw audit packets
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuxt-public-kit-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/nuxt-public-kit-proof
          if-no-files-found: error
