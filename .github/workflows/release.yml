name: Release
# Dispatch on main (or `vp run release`) to publish the next minor version.
#
# main is already validated by the merge queue, so nothing here re-runs Check.
# `version` picks the next minor above every tag and npm version, stamps it into
# all manifests on a commit whose only parent is the main commit, and pushes it
# to refs/release-candidates/<main sha>. main itself is never rewritten. All
# platforms build that candidate in parallel and one pre-publish smoke checks
# the tarballs. Only when every artifact exists does `tag` push vX.Y.0, so a
# failed build burns no version: the next run retries the same number. Every
# registry then publishes in parallel. npm publishes and verifies every native
# platform package before exposing @vizejs/native or vize, so an install can
# never resolve a wrapper while its binding is still propagating.
# release-verify.yml checks registry visibility again after publishing, outside
# this run. Re-running failed jobs is safe: every publisher skips versions that
# exist.
# npm-first: when the rolling crates.io quota refuses this version, the
# post-build admission defers crates.io alone. Every other registry and the
# GitHub release still publish; crates.io skips the version and a later
# admitted release publishes the crates at its own version.
# release-cadence.yml dispatches this workflow automatically. It is always a
# workflow_dispatch run because crates.io trusted publishing refuses
# workflow_run and schedule triggers.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to release (default the next minor)
        required: false
        default: ""
        type: string
      source:
        description: main commit to release (default the dispatched main commit)
        required: false
        default: ""
        type: string
      npm_resume_run:
        description: Release run whose immutable artifacts should resume npm publication
        required: false
        default: ""
        type: string
run-name: Release ${{ inputs.npm_resume_run && format('npm resume {0} from run {1}', inputs.version, inputs.npm_resume_run) || inputs.version || 'next minor' }}${{ inputs.source && format(' @ {0}', inputs.source) || '' }}
concurrency:
  group: release
  cancel-in-progress: false
permissions: { contents: read }
env:
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Release binaries report the plain version; every other build says <version>-dev.
  VIZE_RELEASE_BUILD: "1"
  # JS packages built by ./.github/actions/release-build-packages.
  RELEASE_JS_PACKAGES: npm/cli npm/builder/vite npm/linter/oxlint npm/builder/unplugin npm/fresco npm/mcp-musea npm/builder/vite-musea npm/builder/rspack npm/framework/musea-nuxt npm/framework/nuxt-lint-config npm/framework/nuxt npm/marquette npm/compose/core npm/compose/router npm/ui npm/plugin-sdk npm/builder/babel
jobs:
  version:
    if: github.repository == 'ubugeeei-prod/vize' && github.ref == 'refs/heads/main'
    name: Prepare the release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { actions: read, contents: write }
    outputs:
      version: ${{ steps.resume.outputs.version || steps.cut.outputs.version }}
      tag: ${{ steps.resume.outputs.tag || steps.cut.outputs.tag }}
      sha: ${{ steps.resume.outputs.sha || steps.cut.outputs.sha }}
      ref: ${{ steps.cut.outputs.ref }}
      publish_tag: ${{ steps.resume.outputs.publish_tag }}
      allow_newer_tag: ${{ steps.resume.outputs.allow_newer_tag }}
      cli_matrix: ${{ steps.platforms.outputs.cli_matrix }}
      native_matrix: ${{ steps.platforms.outputs.native_matrix }}
      editor_matrix: ${{ steps.platforms.outputs.editor_matrix }}
      editor_platform_artifacts: ${{ steps.resume.outputs.editor_platform_artifacts }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: "package.json", package-manager-cache: false }
      - name: Validate the npm release resume
        id: resume
        if: inputs.npm_resume_run != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.npm_resume_run }}
          RESUME_VERSION: ${{ inputs.version }}
          RELEASE_SOURCE_INPUT: ${{ inputs.source }}
          RELEASE_JS_PACKAGES: ${{ env.RELEASE_JS_PACKAGES }}
        run: node tools/support/release/npm_resume/main.ts "$RESUME_VERSION" "$RESUME_RUN"
      - name: Check out the requested main commit
        if: inputs.npm_resume_run == '' && inputs.source != ''
        env:
          RELEASE_SOURCE: ${{ inputs.source }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only a commit already on main may be released.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_SOURCE...$GITHUB_SHA" --jq .status)
          [[ "$status" == ahead || "$status" == identical ]]
          git fetch --depth=1 origin "$RELEASE_SOURCE"
          git checkout --detach FETCH_HEAD
      # The crate quota never refuses a cut; the post-build admission decides crates.
      - name: Resolve the requested version with current workflow tooling
        id: resolve
        if: inputs.npm_resume_run == ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-quota-tooling"
          git archive "$GITHUB_SHA" package.json tools/support/release tools/support/archive tests/tooling/release/quota-live-legacy-refusal.ts | tar -x -C "$RUNNER_TEMP/release-quota-tooling"
          quota_main="$RUNNER_TEMP/release-quota-tooling/tools/support/release/release/main.ts"
          version="$RELEASE_VERSION"
          if [[ -z "$version" ]]; then
            version="$(node "$quota_main" next)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Stamp, commit and push the release candidate
        id: cut
        if: inputs.npm_resume_run == ''
        env: { RELEASE_VERSION: "${{ steps.resolve.outputs.version }}" }
        run: node tools/support/release/release/main.ts cut ${RELEASE_VERSION:+"$RELEASE_VERSION"}
      - name: Emit the actual created candidate's original producer attestation
        if: steps.cut.outputs.sha != ''
        env:
          RELEASE_VERSION: ${{ steps.cut.outputs.version }}
          RELEASE_SHA: ${{ steps.cut.outputs.sha }}
        run: node "$RUNNER_TEMP/release-quota-tooling/tools/support/release/release/producer_identity.ts" "$RELEASE_VERSION" "$RELEASE_SHA" "$RUNNER_TEMP/release-producer-source/producer-candidate.json"
      - name: Retain the original producer candidate artifact
        if: steps.cut.outputs.sha != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-producer-source-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-producer-source/producer-candidate.json
          archive: true
          if-no-files-found: error
          retention-days: 90
      - name: Select release platforms
        id: platforms
        if: steps.cut.outputs.ref != ''
        env:
          RELEASE_TAG: "${{ steps.cut.outputs.tag }}"
          VIZE_RELEASE_MACOS_RUNNER: "${{ vars.VIZE_RELEASE_MACOS_RUNNER }}"
        run: node tools/support/github/release-platforms.ts github-output "$RELEASE_TAG"

  build-cli:
    name: Build CLI - ${{ matrix.settings.target }}
    needs: version
    if: needs.version.outputs.ref != ''
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        settings: ${{ fromJSON(needs.version.outputs.cli_matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ needs.version.outputs.ref }}", persist-credentials: false }
      - uses: ./.github/actions/build-release-cli
        with:
          target: ${{ matrix.settings.target }}
          archive: ${{ matrix.settings.archive }}
          release-version: ${{ needs.version.outputs.version }}
          authorized-release: "true"

  build-native:
    name: Build Native - ${{ matrix.settings.target }}
    needs: version
    if: needs.version.outputs.ref != ''
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        settings: ${{ fromJSON(needs.version.outputs.native_matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ needs.version.outputs.ref }}", persist-credentials: false }
      - uses: ./.github/actions/build-release-native
        with:
          target: ${{ matrix.settings.target }}
          cross-compile: ${{ matrix.settings.cross_compile }}
          release-version: ${{ needs.version.outputs.version }}
          authorized-release: "true"

  build-packages:
    name: Build npm packages
    needs: version
    if: needs.version.outputs.ref != ''
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ needs.version.outputs.ref }}", persist-credentials: false }
      - uses: ./.github/actions/release-build-packages

  build-wasm:
    name: Build @vizejs/wasm
    needs: version
    if: needs.version.outputs.ref != ''
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ needs.version.outputs.ref }}", persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: "package.json", package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable, targets: wasm32-unknown-unknown }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          reuse-target: "true"
          restore-trusted: "true"
          key: release-wasm
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      - uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        with: { tool: wasm-bindgen-cli@0.2.129 }
      - name: Build WASM
        run: node tools/support/tasks/build-vize-wasm-package.ts
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: "package.json", run-install: true }
      - name: Smoke @vizejs/wasm
        run: |
          rust-script tools/commands/release/npm/smoke-wasm-package.rs npm/wasm
          node tools/commands/release/npm/smoke-release-install.ts npm/wasm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-wasm
          path: npm/wasm
          if-no-files-found: error
          compression-level: 1

  build-editor-extensions:
    name: Build editor extensions
    needs: version
    if: needs.version.outputs.ref != ''
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ needs.version.outputs.ref }}", persist-credentials: false }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: "package.json", cache: true, run-install: false }
      - name: Install JS dependencies
        run: vp install --workspace-root --frozen-lockfile --prefer-offline
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          reuse-target: "true"
          restore-trusted: "true"
          key: release-tools
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      - name: Package editor extensions
        run: |
          vp run --workspace-root package:vscode-extension
          vp run --workspace-root check:zed-extension
          vp run --workspace-root package:zed-extension
          vp run --workspace-root package:nvim-extension
          vp run --workspace-root package:vim-extension
          vp run --workspace-root package:helix-extension
          vp run --workspace-root package:emacs-extension
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editor-extensions
          path: |
            emacs-vize-extension.tar.gz
            helix-vize-extension.tar.gz
            editors/vscode/dist/vize.vsix
            nvim-vize-extension.tar.gz
            vim-vize-extension.tar.gz
            zed-vize-extension.tar.gz
          if-no-files-found: error
          compression-level: 0

  smoke-editor-artifacts:
    name: Smoke release editor hosts
    needs: [version, build-cli, build-packages, build-editor-extensions]
    if: needs.version.outputs.ref != ''
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ needs.version.outputs.ref }}", persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: "package.json", package-manager-cache: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/release-cli
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: editor-extensions
          path: ${{ runner.temp }}/release-editors
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: ${{ runner.temp }}/release-npm
      - name: Install the exact release artifacts and initialize a fresh project
        id: artifacts
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/release-editor-evidence"
          install_root="$RUNNER_TEMP/release-editor-install"
          fresh="$RUNNER_TEMP/release-editor-fresh-project"
          mkdir -p "$evidence" "$install_root/cli" "$install_root/npm" "$fresh/src" target/source-editors

          tar -xzf "$RUNNER_TEMP/release-cli/vize-x86_64-unknown-linux-gnu.tar.gz" \
            -C "$install_root/cli"
          server="$install_root/cli/vize"
          test -x "$server"
          test "$("$server" --version)" = "vize $RELEASE_VERSION"

          for editor in zed nvim vim helix emacs; do
            mv "editors/$editor" "target/source-editors/$editor"
            tar -xzf "$RUNNER_TEMP/release-editors/${editor}-vize-extension.tar.gz" \
              -C editors
            test -d "editors/$editor"
          done
          vsix="$RUNNER_TEMP/release-editors/editors/vscode/dist/vize.vsix"
          test -s "$vsix"

          test -f "$RUNNER_TEMP/release-npm/cli/package.json"
          test "$(node -p "require('$RUNNER_TEMP/release-npm/cli/package.json').version")" = \
            "$RELEASE_VERSION"
          npm pack "$RUNNER_TEMP/release-npm/cli" \
            --pack-destination "$install_root/npm" --ignore-scripts >/dev/null
          cli_archive=$(find "$install_root/npm" -maxdepth 1 -type f -name '*.tgz' -print)
          test "$(printf '%s\n' "$cli_archive" | wc -l)" -eq 1
          mkdir -p "$install_root/npm/package"
          tar -xzf "$cli_archive" -C "$install_root/npm/package" --strip-components=1
          packaged_cli="$install_root/npm/package/bin/vize"
          test -f "$packaged_cli"
          test "$(node -p "require('$install_root/npm/package/package.json').version")" = \
            "$RELEASE_VERSION"

          node --input-type=module - "$fresh" <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          const root = process.argv[2];
          fs.cpSync("editors/vscode/test-fixtures/extension-host/real-vue", root, {
            recursive: true,
          });
          fs.writeFileSync(path.join(root, "package.json"), `${JSON.stringify({
            name: "vize-release-editor-smoke",
            version: "0.0.0",
            private: true,
            type: "module",
            scripts: { dev: "vite", build: "vite build" },
            dependencies: { vue: "3.5.34" },
            devDependencies: { typescript: "6.0.3", vite: "8.0.0" },
          }, null, 2)}\n`);
          fs.writeFileSync(path.join(root, "src/Lint.vue"), `<script setup lang="ts">
          const items = [1, 2]
          </script>
          <template><ul><li v-for="item in items">{{ item }}</li></ul></template>
          `);
          JS
          node "$packaged_cli" init "$fresh" --yes --no-lint --vite --fmt --typecheck --editor --no-install \
            | tee "$evidence/init.txt"
          dependency_root="$RUNNER_TEMP/release-editor-dependencies"
          mkdir -p "$dependency_root"
          npm install --prefix "$dependency_root" --ignore-scripts --no-audit --no-fund \
            --package-lock=false --save=false vue@3.5.34 typescript@6.0.3
          mv "$dependency_root/node_modules" "$fresh/node_modules"
          test -f "$fresh/.vscode/extensions.json"
          grep -F 'ubugeeei.vize' "$fresh/.vscode/extensions.json"
          set +e
          "$server" lint "$fresh/src/Lint.vue" --format json --no-config \
            > "$evidence/diagnostics.json"
          lint_status=$?
          set -e
          test "$lint_status" -eq 1
          grep -F 'vue/require-v-for-key' "$evidence/diagnostics.json"
          find "$fresh" -type l -print > "$evidence/project-links.txt"
          find "$fresh" -path "$fresh/node_modules" -prune -o -type l -print \
            > "$evidence/project-links-outside-node-modules.txt"
          test ! -s "$evidence/project-links-outside-node-modules.txt"
          find "$fresh/node_modules" -type l -print > "$evidence/dependency-links.txt"
          while IFS= read -r link; do
            target=$(readlink -f "$link")
            case "$target" in
              "$fresh/node_modules"/*) ;;
              *)
                echo "installed dependency link escapes the fresh project: $link -> $target" >&2
                exit 1
                ;;
            esac
          done < "$evidence/dependency-links.txt"
          if grep -R -F -n "$GITHUB_WORKSPACE" "$fresh" > "$evidence/workspace-links.txt"; then
            echo "fresh release project refers to the source checkout" >&2
            exit 1
          fi
          sha256sum "$server" "$vsix" "$RUNNER_TEMP/release-editors/"*.tar.gz \
            > "$evidence/artifacts.sha256"
          find "$fresh" -type f -print | LC_ALL=C sort > "$evidence/project-files.txt"
          printf 'server=%s\n' "$server" >> "$GITHUB_OUTPUT"
          printf 'vsix=%s\n' "$vsix" >> "$GITHUB_OUTPUT"
          printf 'fresh=%s\n' "$fresh" >> "$GITHUB_OUTPUT"
          printf 'evidence=%s\n' "$evidence" >> "$GITHUB_OUTPUT"
      - name: Launch the packaged editor hosts with the release binary
        uses: ./.github/actions/vscode-host-smoke
        with:
          prebuilt-server: ${{ steps.artifacts.outputs.server }}
          prebuilt-vsix: ${{ steps.artifacts.outputs.vsix }}
          expected-version: ${{ needs.version.outputs.version }}
          release-workspace: ${{ steps.artifacts.outputs.fresh }}
          release-evidence: ${{ steps.artifacts.outputs.evidence }}
      - name: Require packaged hosts on the initialized release project
        env:
          VIZE_SERVER_PATH: ${{ steps.artifacts.outputs.server }}
          VIZE_TEST_HELIX_PATH: ${{ runner.temp }}/helix/hx
          VIZE_TS45_EXISTING_WORKSPACE: ${{ steps.artifacts.outputs.fresh }}
          VIZE_TS45_OUT: ${{ steps.artifacts.outputs.evidence }}/hosts
        run: |
          set -euo pipefail
          mkdir -p "$VIZE_TS45_OUT"
          node tests/editor-conformance/run.ts neovim --out "$VIZE_TS45_OUT"
          node tests/editor-conformance/run.ts helix --out "$VIZE_TS45_OUT"
          xvfb-run -a node tests/editor-conformance/run.ts vscode --out "$VIZE_TS45_OUT"
          find "$VIZE_TS45_OUT" -type f -print | LC_ALL=C sort
          find "$VIZE_TS45_EXISTING_WORKSPACE" -type l -print \
            > "${{ steps.artifacts.outputs.evidence }}/project-links-after-hosts.txt"
          find "$VIZE_TS45_EXISTING_WORKSPACE" \
            -path "$VIZE_TS45_EXISTING_WORKSPACE/node_modules" -prune -o -type l -print \
            > "${{ steps.artifacts.outputs.evidence }}/project-links-after-hosts-outside-node-modules.txt"
          test ! -s "${{ steps.artifacts.outputs.evidence }}/project-links-after-hosts-outside-node-modules.txt"
          find "$VIZE_TS45_EXISTING_WORKSPACE/node_modules" -type l -print \
            > "${{ steps.artifacts.outputs.evidence }}/dependency-links-after-hosts.txt"
          while IFS= read -r link; do
            target=$(readlink -f "$link")
            case "$target" in
              "$VIZE_TS45_EXISTING_WORKSPACE/node_modules"/*) ;;
              *)
                echo "installed dependency link escapes the fresh project after host execution: $link -> $target" >&2
                exit 1
                ;;
            esac
          done < "${{ steps.artifacts.outputs.evidence }}/dependency-links-after-hosts.txt"
          if grep -R -F -n "$GITHUB_WORKSPACE" "$VIZE_TS45_EXISTING_WORKSPACE" \
            > "${{ steps.artifacts.outputs.evidence }}/workspace-links-after-hosts.txt"; then
            echo "fresh release project refers to the source checkout after host execution" >&2
            exit 1
          fi
      - name: Retain release artifact and fresh-project evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-editor-hosts-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/release-editor-evidence
          if-no-files-found: error
          retention-days: 90

  # Reuse each native producer image and its token receipt. Packaging does not
  # execute foreign images or build another native provider.
  build-editor-platforms:
    name: Build editor provider - ${{ matrix.settings.target }}
    needs: [version, build-native]
    if: needs.version.outputs.ref != ''
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        settings: ${{ fromJSON(needs.version.outputs.editor_matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ needs.version.outputs.ref }}", persist-credentials: false }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: "package.json", cache: true, run-install: false }
      - name: Install packaging dependencies
        run: vp install --workspace-root --frozen-lockfile --prefer-offline
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          reuse-target: "true"
          restore-trusted: "true"
          key: release-tools
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      # The extension installs outside the root workspace; the universal VSIX
      # recipe installs its packager first, exactly as Build editor extensions does.
      - name: Install VS Code extension dependencies
        run: vp run --workspace-root package:vscode-extension
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bindings-${{ matrix.settings.rustTarget }}
          path: ${{ runner.temp }}/native-provider
      - name: Package the exact target provider
        env:
          RUST_TARGET: ${{ matrix.settings.rustTarget }}
          VSIX_ARCHIVE: ${{ matrix.settings.archive }}
          # A failed-job rerun may resolve a force-pushed candidate ref. The
          # receipt must match the attempt SHA the native artifacts were built for.
          VIZE_RELEASE_CANDIDATE_SHA: ${{ needs.version.outputs.sha }}
        run: >-
          rust-script tools/commands/editors/vscode/package-typescript-provider.rs
          "$RUST_TARGET" "$RUNNER_TEMP/native-provider"
          "$GITHUB_WORKSPACE/.artifacts/vscode/$VSIX_ARCHIVE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.settings.artifact }}
          path: .artifacts/vscode/*
          if-no-files-found: error
          compression-level: 0

  # The single pre-publish gate: install every package tarball together and
  # run it. Runs without registry credentials. Every registry waits for it, so
  # a failed build (wasm included) publishes nowhere.
  smoke:
    name: Smoke package tarballs
    needs: [version, build-packages, build-native, build-wasm]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ needs.version.outputs.ref }}", persist-credentials: false }
      - uses: ./.github/actions/setup-runtime-package-managers
        with: { node-version-file: "package.json" }
      - uses: ./.github/actions/release-npm-artifacts
      - name: Smoke install release package tarballs
        env:
          VIZE_SMOKE_TIMING_FILE: ${{ runner.temp }}/packed-smoke-timing.jsonl
        run: |
          read -ra js <<< "$RELEASE_JS_PACKAGES"
          node tools/commands/release/npm/smoke-release-install.ts --prepare-manifests --runtime-checks \
            npm/native npm/native/npm/* npm/fresco-native "${js[@]}"
      - name: Retain packed smoke timing
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packed-smoke-timing
          path: ${{ runner.temp }}/packed-smoke-timing.jsonl
          if-no-files-found: warn
          retention-days: 14

  # Every artifact exists: only now does the version become real.
  tag:
    name: Tag the release
    needs: [version, smoke, smoke-editor-artifacts, build-cli, build-editor-extensions]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { actions: write, contents: write }
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_CANDIDATE: ${{ needs.version.outputs.ref }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ needs.version.outputs.ref }}" }
      - name: Push the tag and drop the candidate ref
        run: |
          git push origin "HEAD:refs/tags/$RELEASE_TAG"
          git push origin ":$RELEASE_CANDIDATE"
      - name: Dispatch Parcel native publication from the immutable tag
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run parcel-transformer.yml --ref "$RELEASE_TAG" -f publish=true

  # Re-read complete registry histories after the long builds, before any registry write.
  # The pre-stamp check is not reused as admission evidence.
  publication-quota:
    name: Admit the immutable release publication
    needs: [version, tag]
    if: ${{ always() && needs.version.result == 'success' && (inputs.npm_resume_run != '' || needs.tag.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { contents: read, actions: read }
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_SHA: ${{ needs.version.outputs.sha }}
      RELEASE_PRODUCER_RUN: ${{ inputs.npm_resume_run || github.run_id }}
    outputs:
      # publish, or defer when the rolling budget refuses: only crates.io waits.
      crates: ${{ steps.admission.outputs.crates }}
      crates_reason: ${{ steps.admission.outputs.crates_reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: "package.json", package-manager-cache: false }
      - name: Decide crate publication from a fresh rolling budget for the original producer
        id: admission
        env:
          RELEASE_QUOTA_EVIDENCE: ${{ runner.temp }}/publication-quota/report.json
        run: node tools/support/release/release/main.ts quota-publication "$RELEASE_VERSION"
      - name: Retain the publication admission receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publication-quota-${{ needs.version.outputs.tag }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-quota
          if-no-files-found: error
          retention-days: 90

  publish-npm:
    name: Publish npm packages
    needs: [version, tag, publication-quota]
    if: ${{ always() && needs.publication-quota.result == 'success' && needs.version.result == 'success' && (inputs.npm_resume_run != '' || needs.tag.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: npm
    permissions: { actions: read, contents: read, id-token: write }
    env:
      # Native tarballs can remain unavailable after their versions appear in
      # the registry. Give the dependent-package barrier a 30-minute window.
      PUBLISH_RESOLUTION_RETRY_LIMIT: "180"
      PUBLISH_RESOLUTION_RETRY_DELAY: "10"
      NPM_PUBLISH_TAG: ${{ needs.version.outputs.publish_tag }}
      NPM_ALLOW_NEWER_TAG: ${{ needs.version.outputs.allow_newer_tag }}
    outputs:
      packages: ${{ steps.publish.outputs.packages }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.npm_resume_run != '' && github.sha || needs.version.outputs.tag }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: "package.json", cache: true, run-install: false }
      - uses: ./.github/actions/release-npm-artifacts
        with:
          run-id: ${{ inputs.npm_resume_run }}
          github-token: ${{ github.token }}
          release-tag: ${{ inputs.npm_resume_run != '' && needs.version.outputs.tag || '' }}
      - if: inputs.npm_resume_run == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: npm-package-wasm, path: npm/wasm }
      - if: inputs.npm_resume_run != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-wasm
          path: npm/wasm
          run-id: ${{ inputs.npm_resume_run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Publish native platforms before dependent packages
        id: publish
        run: |
          read -ra js <<< "$RELEASE_JS_PACKAGES"
          platforms=(npm/native/npm)
          native=(npm/native)
          dependents=(npm/fresco-native npm/wasm "${js[@]}")
          node tools/support/release/publish_npm_package_dirs/main.ts "${platforms[@]}" --concurrency 8 --provenance
          node tools/support/release/publish_npm_package_dirs/main.ts "${native[@]}" --concurrency 1 --provenance
          node tools/support/release/publish_npm_package_dirs/main.ts "${dependents[@]}" --concurrency 16 --provenance --no-wait
          echo "packages=$(node tools/support/release/publish_npm_package_dirs/main.ts --names "${platforms[@]}" "${native[@]}" "${dependents[@]}")" >> "$GITHUB_OUTPUT"

  publish-crates:
    name: Publish crates
    needs: [version, tag, publication-quota]
    if: ${{ !cancelled() && needs.publication-quota.result == 'success' && needs.publication-quota.outputs.crates == 'publish' && needs.version.result == 'success' && (needs.tag.result == 'success' || (inputs.npm_resume_run != '' && needs.tag.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    permissions: { contents: read, actions: read, id-token: write }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ needs.version.outputs.tag }}", persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: "package.json", package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          reuse-target: "true"
          restore-trusted: "true"
          key: release-crates
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Recheck quota before any new crate write, including failed-job recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
          RELEASE_PRODUCER_RUN: ${{ inputs.npm_resume_run || github.run_id }}
          RELEASE_QUOTA_EVIDENCE: ${{ runner.temp }}/crate-quota/report.json
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/release-quota-tooling"
          git archive "$GITHUB_SHA" package.json tools/support/release tools/support/archive tests/tooling/release/quota-live-legacy-refusal.ts | tar -x -C "$RUNNER_TEMP/release-quota-tooling"
          node "$RUNNER_TEMP/release-quota-tooling/tools/support/release/release/main.ts" quota "$RELEASE_VERSION"
      - uses: rust-lang/crates-io-auth-action@b7e9a28eded4986ec6b1fa40eeee8f8f165559ec # v1
        id: crates-io-auth
      - name: Publish to crates.io
        env: { CARGO_REGISTRY_TOKEN: "${{ steps.crates-io-auth.outputs.token }}" }
        run: node tools/support/release/publish_crates/main.ts
      - name: Retain the crate write admission receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crate-quota-${{ needs.version.outputs.tag }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crate-quota
          if-no-files-found: error
          retention-days: 90

  publish-vscode:
    name: Publish VS Code extension
    needs: [version, tag, publication-quota]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: vscode-marketplace
    env:
      VSCE_DLX_BIN: npx
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ needs.version.outputs.tag }}", persist-credentials: false }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: "package.json", run-install: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: editor-extensions, path: editor-extensions }
      - name: Publish to the VS Code Marketplace
        run: node tools/support/release/publish_vscode_extension/main.ts editor-extensions/editors/vscode/dist/vize.vsix

  publish-open-vsx:
    name: Publish Open VSX extension
    needs: [version, tag, publication-quota]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: open-vsx-registry
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      # The publisher runs ovsx through `vp dlx`, whose deps have build scripts.
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
      # Release 0.598.0 took over 12 min to expose every target after upload.
      # Allow 20 min of scans plus maintenance backoff within the job timeout.
      PUBLISH_RESOLUTION_RETRY_LIMIT: "120"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ needs.version.outputs.tag }}", persist-credentials: false }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: "package.json", run-install: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: editor-extensions, path: editor-extensions }
      - name: Publish to Open VSX
        run: node tools/support/release/publish_open_vsx_extension/main.ts editor-extensions/editors/vscode/dist/vize.vsix

  # Platform VSIXes publish only after every provider package exists. They
  # never gate the tag, npm or the universal extension.
  publish-vscode-platforms:
    if: needs.version.outputs.ref != ''
    name: Publish VS Code extension - ${{ matrix.settings.target }}
    needs: [version, tag, build-editor-platforms, publication-quota]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: vscode-marketplace
    strategy:
      fail-fast: false
      matrix:
        settings: ${{ fromJSON(needs.version.outputs.editor_matrix) }}
    env:
      VIZE_EXTENSION_TARGET: ${{ matrix.settings.target }}
      VSIX_SOURCE_PATH: ${{ matrix.settings.sourcePath }}
      VSCE_DLX_BIN: npx
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      # The Marketplace validates a platform upload before listing it: 0.584.0
      # took 6.5-9 min. Wait up to 20 min (120 x 10 s).
      PUBLISH_RESOLUTION_RETRY_LIMIT: "120"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ needs.version.outputs.tag }}", persist-credentials: false }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: "package.json", run-install: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: "${{ matrix.settings.artifact }}", path: editor-extensions }
      - name: Publish to the VS Code Marketplace
        run: node tools/support/release/publish_vscode_extension/main.ts "editor-extensions/$VSIX_SOURCE_PATH"

  publish-open-vsx-platforms:
    if: needs.version.outputs.ref != ''
    name: Publish Open VSX extension - ${{ matrix.settings.target }}
    needs: [version, tag, build-editor-platforms, publication-quota]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: open-vsx-registry
    strategy:
      fail-fast: false
      matrix:
        settings: ${{ fromJSON(needs.version.outputs.editor_matrix) }}
    env:
      VIZE_EXTENSION_TARGET: ${{ matrix.settings.target }}
      VSIX_SOURCE_PATH: ${{ matrix.settings.sourcePath }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      # The publisher runs ovsx through `vp dlx`, whose deps have build scripts.
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
      # Release 0.598.0 took over 12 min to expose every target after upload.
      # Allow 20 min of scans plus maintenance backoff within the job timeout.
      PUBLISH_RESOLUTION_RETRY_LIMIT: "120"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ needs.version.outputs.tag }}", persist-credentials: false }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: "package.json", run-install: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: "${{ matrix.settings.artifact }}", path: editor-extensions }
      - name: Publish to Open VSX
        run: node tools/support/release/publish_open_vsx_extension/main.ts "editor-extensions/$VSIX_SOURCE_PATH"

  github-release:
    name: Create GitHub Release
    needs: [version, tag, publish-npm, build-editor-platforms, publication-quota]
    if: ${{ always() && needs.publication-quota.result == 'success' && needs.version.result == 'success' && needs.publish-npm.result == 'success' && (inputs.npm_resume_run != '' || needs.tag.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # id-token mints the keyless cosign certificate.
    permissions: { actions: read, contents: write, id-token: write }
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_SHA: ${{ needs.version.outputs.sha }}
      # A failed platform build releases without its files rather than blocking.
      EDITOR_PLATFORMS: ${{ inputs.npm_resume_run != '' && needs.version.outputs.editor_platform_artifacts || needs.build-editor-platforms.result == 'success' && '1' || '0' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ needs.version.outputs.tag }}", persist-credentials: false }
      - if: inputs.npm_resume_run == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { pattern: cli-*, path: cli-artifacts, merge-multiple: true }
      - if: inputs.npm_resume_run != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: cli-artifacts
          merge-multiple: true
          run-id: ${{ inputs.npm_resume_run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - if: inputs.npm_resume_run == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: editor-extensions, path: editor-extension-artifacts }
      - if: inputs.npm_resume_run != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: editor-extensions
          path: editor-extension-artifacts
          run-id: ${{ inputs.npm_resume_run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - if: inputs.npm_resume_run == '' && env.EDITOR_PLATFORMS == '1'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: editor-extension-platform-*
          path: editor-extension-artifacts/platform
          merge-multiple: true
      - if: inputs.npm_resume_run != '' && env.EDITOR_PLATFORMS == '1'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: editor-extension-platform-*
          path: editor-extension-artifacts/platform
          merge-multiple: true
          run-id: ${{ inputs.npm_resume_run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - uses: anchore/sbom-action@61119d458adab75f756bc0b9e4bde25725f86a7a # v0.17.8
        with:
          artifact-name: vize-${{ needs.version.outputs.tag }}-cyclonedx.sbom.json
          format: cyclonedx-json
          output-file: vize-${{ needs.version.outputs.tag }}-cyclonedx.sbom.json
          upload-artifact: false
      - uses: anchore/sbom-action@61119d458adab75f756bc0b9e4bde25725f86a7a # v0.17.8
        with:
          artifact-name: vize-${{ needs.version.outputs.tag }}-spdx.sbom.json
          format: spdx-json
          output-file: vize-${{ needs.version.outputs.tag }}-spdx.sbom.json
          upload-artifact: false
      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        with: { cosign-release: v2.4.1 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: "package.json", package-manager-cache: false }
      - name: Checksum and sign release artifacts
        env:
          COSIGN_YES: "true"
          VIZE_EDITOR_PLATFORM_ARTIFACTS: ${{ env.EDITOR_PLATFORMS }}
        run: |
          shopt -s nullglob
          for artifact in cli-artifacts/*.tar.gz cli-artifacts/*.zip editor-extension-artifacts/editors/vscode/dist/*.vsix editor-extension-artifacts/platform/*.vsix editor-extension-artifacts/platform/*.receipt.json editor-extension-artifacts/*.tar.gz; do
            ( cd "$(dirname "$artifact")" && sha256sum "$(basename "$artifact")" ) > "$artifact.sha256"
          done
          node tools/support/release/sign_release_artifacts.ts "$RELEASE_TAG"
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          CRATES_PUBLICATION: ${{ needs.publication-quota.outputs.crates }}
          CRATES_PUBLICATION_REASON: ${{ needs.publication-quota.outputs.crates_reason }}
        run: node tools/support/release/github_release_notes.ts "$RELEASE_TAG" "$RELEASE_SHA" "$RUNNER_TEMP/release-notes.md"
      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: false
          make_latest: true
          overwrite_files: true
          files: |
            cli-artifacts/*.tar.gz
            cli-artifacts/*.zip
            editor-extension-artifacts/editors/vscode/dist/*.vsix
            editor-extension-artifacts/platform/*.vsix
            editor-extension-artifacts/platform/*.receipt.json
            editor-extension-artifacts/*.tar.gz
            vize-${{ needs.version.outputs.tag }}-*.sbom.json
            cli-artifacts/*.sha256
            cli-artifacts/*.sig
            cli-artifacts/*.pem
            cli-artifacts/*.cosign.bundle
            editor-extension-artifacts/**/*.sha256
            editor-extension-artifacts/**/*.sig
            editor-extension-artifacts/**/*.pem
            editor-extension-artifacts/**/*.cosign.bundle
            vize-${{ needs.version.outputs.tag }}-*.sig
            vize-${{ needs.version.outputs.tag }}-*.pem
            vize-${{ needs.version.outputs.tag }}-*.cosign.bundle

  # Post-publish checks and JSR run in release-verify.yml, so this run, and
  # with it the cadence, ends once every registry has the version.
  dispatch-verify:
    name: Dispatch the release verification
    needs: [version, publish-npm]
    if: ${{ always() && needs.version.result == 'success' && needs.publish-npm.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # release-verify.yml dispatches JSR, which only accepts OIDC publishes
    # whose actor is a scope member, never github-actions[bot].
    environment: release-operator
    steps:
      - name: Dispatch release-verify.yml
        env:
          GH_TOKEN: ${{ secrets.RELEASE_OPERATOR_TOKEN }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
          RELEASE_PACKAGES: ${{ needs.publish-npm.outputs.packages }}
        run: |
          gh workflow run release-verify.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f version="$RELEASE_VERSION" -f tag="$RELEASE_TAG" -f sha="$RELEASE_SHA" \
            -f packages="$RELEASE_PACKAGES"
