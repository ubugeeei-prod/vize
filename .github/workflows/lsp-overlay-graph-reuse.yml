name: LSP independent overlay graphs

on:
  pull_request:
    paths:
      - .github/workflows/lsp-overlay-graph-reuse.yml
      - crates/vize_canon/src/corsa_bridge/vue_dependencies_alias/context/cache/**
      - crates/vize_canon/src/corsa_bridge/vue_dependencies_alias/context/cache.rs
      - crates/vize_canon/src/corsa_bridge/vue_dependencies_alias/context/prepare.rs
      - crates/vize_canon/src/corsa_bridge/vue_dependencies_alias/context/prepare_materialize.rs
      - crates/vize_canon/src/corsa_bridge/source_catalog.rs
      - crates/vize_canon/src/corsa_bridge/source_catalog/**
      - crates/vize_canon/src/corsa_bridge/vue_document/model.rs
      - crates/vize_canon/src/lsp_client/canon_file_cache.rs
      - crates/vize_canon/src/lsp_client.rs
      - crates/vize_canon/src/lsp_client/bootstrap.rs
      - crates/vize_canon/src/lsp_client/session_paths.rs
      - crates/vize_canon/src/lsp_client/immutable_batch.rs
      - crates/vize_canon/src/lsp_client/immutable_batch/**
      - crates/vize_canon/src/corsa_bridge/bridge/documents.rs
      - crates/vize_canon/src/lsp_client/tracked_documents.rs
      - crates/vize_canon/src/lsp_client/tracked_documents/**
      - crates/vize_canon/src/lsp_client/session/replay.rs
      - crates/vize_canon/src/lsp_client/workspace_project.rs
      - crates/vize_canon/src/lsp_client/lifecycle.rs
      - tests/tooling/lsp-overlay-graph-reuse.test.ts
  workflow_dispatch:
    inputs:
      compare_ref:
        description: Exact parent source SHA for the paired preparation observation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lsp-overlay-graph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paired:
    name: Complete overlay custody and paired graph observations
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.compare_ref }}
      OBSERVATION_ROOT: ${{ github.workspace }}/target/differential/overlay-graphs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile --prefer-offline
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: "1.99.1"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: test-scripts
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Capture identical test-only instrumentation at the exact parent source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$OBSERVATION_ROOT"
          profile=crates/vize_canon/src/corsa_bridge/vue_dependencies_alias/context/cache/overlay_profile.rs
          cp "$profile" "$OBSERVATION_ROOT/overlay_profile.rs"
          git checkout --detach "$BASE_SHA"
          cp "$OBSERVATION_ROOT/overlay_profile.rs" "$profile"
          if ! git show "$BASE_SHA:crates/vize_canon/src/corsa_bridge/vue_dependencies_alias/context/cache.rs" | rg -q '^mod overlay_profile;'; then
            printf '\n#[cfg(test)]\nmod overlay_profile;\n' >> crates/vize_canon/src/corsa_bridge/vue_dependencies_alias/context/cache.rs
          fi
          git rev-parse HEAD > "$OBSERVATION_ROOT/before-source.txt"
          git diff --binary > "$OBSERVATION_ROOT/before-instrumentation.patch"
          sha256sum "$profile" > "$OBSERVATION_ROOT/before-instrumentation.sha256"
          cargo test --locked --profile ci -p vize_canon --lib --no-run --message-format=json > "$OBSERVATION_ROOT/before-build.jsonl" 2> "$OBSERVATION_ROOT/before-build.stderr"
          node --input-type=module -e 'import fs from "node:fs"; const rows=fs.readFileSync(process.env.OBSERVATION_ROOT+"/before-build.jsonl","utf8").trim().split("\n").map(JSON.parse); const executable=rows.findLast(row=>row.reason==="compiler-artifact" && row.target.name==="vize_canon" && row.profile.test && row.executable)?.executable; if(!executable) throw new Error("missing exact parent test executable"); fs.writeFileSync(process.env.OBSERVATION_ROOT+"/before-executable.txt",executable);'
          executable=$(cat "$OBSERVATION_ROOT/before-executable.txt")
          sha256sum "$executable" > "$OBSERVATION_ROOT/before-executable.sha256"
          for round in 1 2 3; do
            VIZE_OVERLAY_PROFILE_OUTPUT="$OBSERVATION_ROOT/before-$round.json" "$executable" corsa_bridge::vue_dependencies_alias::context::cache::overlay_profile::profile_unrelated_overlays --exact --ignored --test-threads=1 > "$OBSERVATION_ROOT/before-$round.stdout" 2> "$OBSERVATION_ROOT/before-$round.stderr"
          done
          # Only this disposable Actions checkout contains the disclosed test
          # injection. Restore it before returning to the literal candidate.
          git restore crates/vize_canon/src/corsa_bridge/vue_dependencies_alias/context/cache.rs
          if ! git cat-file -e "$BASE_SHA:$profile" 2>/dev/null; then rm "$profile"; else git restore "$profile"; fi
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Assert all cache, source map and lifecycle regressions at the literal candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cargo test --locked --profile ci -p vize_canon --lib --no-run --message-format=json > "$OBSERVATION_ROOT/after-build.jsonl" 2> "$OBSERVATION_ROOT/after-build.stderr"
          cargo test --locked --profile ci -p vize_canon --lib -- corsa_bridge::vue_dependencies_alias::context::cache:: corsa_bridge::vue_document::build::tests::native_union:: corsa_bridge::vue_document::build::tests::shared_payload:: corsa_bridge::vue_document_package_tests::union:: corsa_bridge::vue_document_package_tests::symlink_workspace:: corsa_bridge::source_catalog:: lsp_client::canon_file_cache:: lsp_client::tracked_documents:: lsp_client::immutable_batch:: --test-threads=1 > "$OBSERVATION_ROOT/cache.stdout" 2> "$OBSERVATION_ROOT/cache.stderr"
          node --input-type=module -e 'import fs from "node:fs"; const rows=fs.readFileSync(process.env.OBSERVATION_ROOT+"/after-build.jsonl","utf8").trim().split("\n").map(JSON.parse); const executable=rows.findLast(row=>row.reason==="compiler-artifact" && row.target.name==="vize_canon" && row.profile.test && row.executable)?.executable; if(!executable) throw new Error("missing exact candidate test executable"); fs.writeFileSync(process.env.OBSERVATION_ROOT+"/after-executable.txt",executable);'
          executable=$(cat "$OBSERVATION_ROOT/after-executable.txt")
          sha256sum "$executable" > "$OBSERVATION_ROOT/after-executable.sha256"
          for round in 1 2 3; do
            VIZE_OVERLAY_PROFILE_OUTPUT="$OBSERVATION_ROOT/after-$round.json" "$executable" corsa_bridge::vue_dependencies_alias::context::cache::overlay_profile::profile_unrelated_overlays --exact --ignored --test-threads=1 > "$OBSERVATION_ROOT/after-$round.stdout" 2> "$OBSERVATION_ROOT/after-$round.stderr"
          done
      - name: Require all six complete paired observation packets
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";
          const root = process.env.OBSERVATION_ROOT;
          const records = [];
          for (const variant of ["before", "after"]) {
            for (let round = 1; round <= 3; round++) {
              const prefix = path.join(root, `${variant}-${round}`);
              const stdout = fs.readFileSync(prefix + ".stdout", "utf8");
              assert.match(stdout, /^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; \d+ filtered out; finished in [0-9.]+s$/m);
              const packet = JSON.parse(fs.readFileSync(prefix + ".json", "utf8"));
              assert.equal(packet.schema, "vize.lsp.overlay-graph-profile.v1");
              assert.deepEqual(packet.scenarios.map(row => row.mode), ["query-edited-sibling-first", "query-unchanged-host-first"]);
              for (const scenario of packet.scenarios) {
                assert.equal(scenario.files, 302);
                assert.equal(scenario.warm_ms.length, 5);
                assert.equal(scenario.edits.length, 8);
                assert.ok(scenario.complete_unchanged_sources.length > 300);
                assert.ok(scenario.complete_final_native_documents.length > 300);
                for (const elapsed of [scenario.cold_ms, ...scenario.warm_ms, ...scenario.edits.map(row => row.elapsed_ms)]) assert.ok(Number.isFinite(elapsed) && elapsed >= 0);
                for (const [index, row] of scenario.edits.entries()) {
                  assert.equal(row.cycle, index + 1);
                  assert.equal(typeof row.host_context_reused, "boolean");
                  assert.ok(Number.isInteger(row.host_source_registrations));
                  assert.ok(row.residency.rss_kib > 0 && row.residency.high_water_kib >= row.residency.rss_kib);
                }
                records.push({variant, round, ...scenario});
              }
            }
          }
          const normalize = scenario => {
            const hosts = scenario.complete_unchanged_sources.filter(([,packet]) => path.basename(packet.source_path) === "A.vue");
            assert.equal(hosts.length, 1);
            const authored = path.dirname(hosts[0][1].source_path);
            const mirror = path.dirname(hosts[0][1].materialized_path);
            const visit = value => typeof value === "string" ? value.split(mirror).join("<mirror>").split(authored).join("<authored>")
              : Array.isArray(value) ? value.map(visit)
              : value && typeof value === "object" ? Object.fromEntries(Object.entries(value).map(([key,value]) => [key,visit(value)])) : value;
            assert.equal(path.basename(scenario.complete_final_sibling.source_path), "B.vue");
            return visit({sources:scenario.complete_unchanged_sources,sibling:scenario.complete_final_sibling,native:scenario.complete_final_native_documents});
          };
          for (const mode of ["query-edited-sibling-first", "query-unchanged-host-first"]) {
            const sameInput = records.filter(row => row.mode === mode);
            const reference = normalize(sameInput[0]);
            for (const observation of sameInput) assert.deepEqual(normalize(observation), reference, `complete parent/candidate code, mappings and native batch: ${mode}/${observation.variant}/${observation.round}`);
          }
          const median = values => { const sorted = values.toSorted((a,b) => a-b); return sorted[Math.floor(sorted.length/2)]; };
          const summaries = [];
          for (const mode of ["query-edited-sibling-first", "query-unchanged-host-first"]) {
            for (const variant of ["before", "after"]) {
              const rows = records.filter(row => row.mode === mode && row.variant === variant);
              assert.equal(rows.length, 3);
              summaries.push({mode, variant, cold_ms: median(rows.map(row => row.cold_ms)), warm_ms: median(rows.flatMap(row => row.warm_ms)), edit_ms: median(rows.flatMap(row => row.edits.map(edit => edit.elapsed_ms))), rust_rss_kib: median(rows.map(row => row.edits.at(-1).residency.rss_kib)), reused: rows.flatMap(row => row.edits).filter(row => row.host_context_reused).length, samples:24});
            }
          }
          fs.writeFileSync(path.join(root,"summary.json"), JSON.stringify({schema:"vize.lsp.overlay-graph-summary.v1",buildProfile:"ci",scope:"Rust editor preparation with one retained original query; not whole-editor paired RSS",summaries}, null, 2)+"\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### Paired Rust editor preparation observations\n\nProfile ci, same runner and identical instrumentation. Fresh editor sessions; filesystem caches uncontrolled. RSS covers the Rust test process with one retained original query. Native editor process-tree RSS is observed separately at the candidate only.\n\n| Mode | Source | Cold ms | Warm ms | Edit ms | Rust RSS KiB | Graph reuse |\n|---|---|---:|---:|---:|---:|---:|\n"+summaries.map(row=>`| ${row.mode} | ${row.variant} | ${row.cold_ms.toFixed(2)} | ${row.warm_ms.toFixed(2)} | ${row.edit_ms.toFixed(2)} | ${row.rust_rss_kib} | ${row.reused}/${row.samples} |`).join("\n")+"\n");
          NODE
      - name: Build and receipt the exact source server
        run: |
          cargo build --locked --profile ci -p vize
          node tests/differential/build-receipt.ts
          npm install --prefix "$RUNNER_TEMP/native-lsp-provider" --ignore-scripts --no-package-lock --no-audit --no-fund vue@3.5.43
      - name: Preserve complete real-native protocol packets and imported-type negative controls
        env:
          VIZE_LSP_BIN: ${{ github.workspace }}/target/ci/vize
          VIZE_LSP_REQUIRE_SOURCE_BUILD: "1"
          VIZE_TEST_REQUIRE_TSGO: "1"
          VIZE_EDITOR_CONFIG_VUE_ROOT: ${{ runner.temp }}/native-lsp-provider/node_modules/vue
          VIZE_TRACE_EDITOR_PREPARATION: "1"
          VIZE_PROJECT_NAVIGATION_VUE_ROOT: ${{ runner.temp }}/native-lsp-provider/node_modules/vue
        run: node --test --test-concurrency=1 tests/tooling/lsp-overlay-graph-reuse.test.ts tests/tooling/lsp-implementation-capability.test.ts
      - name: Preserve successful and failed complete paired observations
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: overlay-graphs-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/differential/overlay-graphs/
            target/differential/lsp-overlay-graph-reuse/
            target/differential/lsp-sessions/
            target/differential/implementation-canon/
            target/ci/vize.differential-build.json
          if-no-files-found: error
          retention-days: 7
