name: LSP independent overlay graphs

on:
  pull_request:
    paths:
      - .github/workflows/lsp-overlay-graph-reuse.yml
      - crates/vize_canon/src/corsa_bridge/vue_dependencies_alias/context/cache/**
      - crates/vize_canon/src/corsa_bridge/vue_dependencies_alias/context/cache.rs
      - crates/vize_canon/src/corsa_bridge/vue_dependencies_alias/context/prepare.rs
      - crates/vize_canon/src/corsa_bridge/vue_dependencies_alias/context/prepare_materialize.rs
      - crates/vize_canon/src/corsa_bridge/source_catalog.rs
      - tests/tooling/lsp-overlay-graph-reuse.test.ts
  workflow_dispatch:
    inputs:
      compare_ref:
        description: Exact parent source SHA for the paired preparation observation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lsp-overlay-graph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paired:
    name: Complete overlay custody and paired graph observations
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.compare_ref }}
      OBSERVATION_ROOT: ${{ runner.temp }}/overlay-graphs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile --prefer-offline
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: "1.99.1"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: test-scripts
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Capture identical test-only instrumentation at the exact parent source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$OBSERVATION_ROOT"
          profile=crates/vize_canon/src/corsa_bridge/vue_dependencies_alias/context/cache/overlay_profile.rs
          cp "$profile" "$OBSERVATION_ROOT/overlay_profile.rs"
          git checkout --detach "$BASE_SHA"
          cp "$OBSERVATION_ROOT/overlay_profile.rs" "$profile"
          if ! git show "$BASE_SHA:crates/vize_canon/src/corsa_bridge/vue_dependencies_alias/context/cache.rs" | rg -q '^mod overlay_profile;'; then
            printf '\n#[cfg(test)]\nmod overlay_profile;\n' >> crates/vize_canon/src/corsa_bridge/vue_dependencies_alias/context/cache.rs
          fi
          git rev-parse HEAD > "$OBSERVATION_ROOT/before-source.txt"
          git diff --binary > "$OBSERVATION_ROOT/before-instrumentation.patch"
          sha256sum "$profile" > "$OBSERVATION_ROOT/before-instrumentation.sha256"
          cargo test --locked --profile ci -p vize_canon --lib --no-run --message-format=json > "$OBSERVATION_ROOT/before-build.jsonl" 2> "$OBSERVATION_ROOT/before-build.stderr"
          node --input-type=module -e 'import fs from "node:fs"; const rows=fs.readFileSync(process.env.OBSERVATION_ROOT+"/before-build.jsonl","utf8").trim().split("\n").map(JSON.parse); const executable=rows.findLast(row=>row.reason==="compiler-artifact" && row.target.name==="vize_canon" && row.profile.test && row.executable)?.executable; if(!executable) throw new Error("missing exact parent test executable"); fs.writeFileSync(process.env.OBSERVATION_ROOT+"/before-executable.txt",executable);'
          executable=$(cat "$OBSERVATION_ROOT/before-executable.txt")
          sha256sum "$executable" > "$OBSERVATION_ROOT/before-executable.sha256"
          for round in 1 2 3; do
            VIZE_OVERLAY_PROFILE_OUTPUT="$OBSERVATION_ROOT/before-$round.json" "$executable" corsa_bridge::vue_dependencies_alias::context::cache::overlay_profile::profile_unrelated_overlays --exact --ignored --test-threads=1 > "$OBSERVATION_ROOT/before-$round.stdout" 2> "$OBSERVATION_ROOT/before-$round.stderr"
          done
          # Only this disposable Actions checkout contains the disclosed test
          # injection. Restore it before returning to the literal candidate.
          git restore crates/vize_canon/src/corsa_bridge/vue_dependencies_alias/context/cache.rs
          if ! git cat-file -e "$BASE_SHA:$profile" 2>/dev/null; then rm "$profile"; else git restore "$profile"; fi
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Assert all cache, source map and lifecycle regressions at the literal candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cargo test --locked --profile ci -p vize_canon --lib --no-run --message-format=json > "$OBSERVATION_ROOT/after-build.jsonl" 2> "$OBSERVATION_ROOT/after-build.stderr"
          cargo test --locked --profile ci -p vize_canon --lib corsa_bridge::vue_dependencies_alias::context::cache:: -- --test-threads=1 > "$OBSERVATION_ROOT/cache.stdout" 2> "$OBSERVATION_ROOT/cache.stderr"
          node --input-type=module -e 'import fs from "node:fs"; const rows=fs.readFileSync(process.env.OBSERVATION_ROOT+"/after-build.jsonl","utf8").trim().split("\n").map(JSON.parse); const executable=rows.findLast(row=>row.reason==="compiler-artifact" && row.target.name==="vize_canon" && row.profile.test && row.executable)?.executable; if(!executable) throw new Error("missing exact candidate test executable"); fs.writeFileSync(process.env.OBSERVATION_ROOT+"/after-executable.txt",executable);'
          executable=$(cat "$OBSERVATION_ROOT/after-executable.txt")
          sha256sum "$executable" > "$OBSERVATION_ROOT/after-executable.sha256"
          for round in 1 2 3; do
            VIZE_OVERLAY_PROFILE_OUTPUT="$OBSERVATION_ROOT/after-$round.json" "$executable" corsa_bridge::vue_dependencies_alias::context::cache::overlay_profile::profile_unrelated_overlays --exact --ignored --test-threads=1 > "$OBSERVATION_ROOT/after-$round.stdout" 2> "$OBSERVATION_ROOT/after-$round.stderr"
          done
      - name: Build and receipt the exact source server
        run: |
          cargo build --locked --profile ci -p vize
          node tests/differential/build-receipt.ts
          npm install --prefix "$RUNNER_TEMP/native-lsp-provider" --ignore-scripts --no-package-lock --no-audit --no-fund vue@3.5.43
      - name: Preserve complete real-native protocol packets and imported-type negative controls
        env:
          VIZE_LSP_BIN: ${{ github.workspace }}/target/ci/vize
          VIZE_LSP_REQUIRE_SOURCE_BUILD: "1"
          VIZE_TEST_REQUIRE_TSGO: "1"
          VIZE_EDITOR_CONFIG_VUE_ROOT: ${{ runner.temp }}/native-lsp-provider/node_modules/vue
        run: node --test tests/tooling/lsp-overlay-graph-reuse.test.ts
      - name: Preserve successful and failed complete paired observations
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: overlay-graphs-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/overlay-graphs/
            target/differential/lsp-overlay-graph-reuse/
            target/differential/lsp-sessions/
            target/ci/vize.differential-build.json
          if-no-files-found: error
          retention-days: 7
