name: Shared client and server template decisions
on:
  pull_request:
    paths:
      - ".github/workflows/client-server-decisions.yml"
      - ".github/scripts/workflows/client-server-decisions/**"
      - "davinci/vize_l2/src/artifact*"
      - "davinci/vize_l2/src/walk*"
      - "davinci/vize_l2/src/walk/**"
      - "davinci/vize_l2/src/lang/js/**"
      - "davinci/vize_l1_to_l2/src/native_file*"
      - "davinci/vize_l1_to_l2/src/native_file/**"
      - "davinci/vize_l3/Cargo.toml"
      - "davinci/vize_l3/src/decision/**"
      - "davinci/vize_l4/Cargo.toml"
      - "davinci/vize_l4/src/targets/dom*"
      - "davinci/vize_l4/src/targets/dom/**"
      - "davinci/vize_l4/src/targets/ssr*"
      - "davinci/vize_l4/src/targets/ssr/**"
      - "davinci/vize_l4/tests/fixtures/native-*"
      - "crates/vize_atelier_sfc/Cargo.toml"
      - "crates/vize_atelier_sfc/tests/client_server_decisions/**"
permissions: { contents: read }
concurrency:
  group: client-server-decisions-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  target-products:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "24"
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "16777216"
      RUSTUP_TOOLCHAIN: "1.100.0"
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/client-server-decisions/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.100.0", components: clippy }
      - uses: ./.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: target-products-cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Verify original artifacts, decisions, emitted bytes and authored links
        run: . "${{ env.VIZE_CI_FILES }}/verify-original-artifacts-decisions-emitted-bytes-and-authored-links.sh"
