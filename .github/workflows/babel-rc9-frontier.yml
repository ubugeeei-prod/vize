name: Babel rc9 ABI frontier
on:
  workflow_dispatch:
  push:
    branches: [ci/babel-rc9-frontier-evidence]
permissions: { contents: read }
concurrency:
  group: babel-rc9-frontier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  unsupported-frontier:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/babel-rc9-frontier/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ env.SOURCE_SHA }}", fetch-depth: 0, persist-credentials: false }
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: latest
          node-version: 24.14.0
          run-install: false
          cache: true
          cache-save: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with: { key: babel-plugin-hosts, cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}" }
      - uses: ./.github/actions/setup-rust-script
      - name: Install frozen source and exact isolated host graphs
        run: . "${{ env.VIZE_CI_FILES }}/install-frozen-source-and-exact-isolated-host-graphs.sh"
      - name: Build the actual source compiler and both public package entrypoints
        run: . "${{ env.VIZE_CI_FILES }}/build-the-actual-source-compiler-and-both-public-package-entrypoints.sh"
      - name: Retain four strict unsupported rc9 functional frontier rows
        if: always()
        env:
          VIZE_BABEL_NATIVE_ROOT: ${{ github.workspace }}/npm/native
          VIZE_BABEL_RUNTIME_OUTPUT: ${{ runner.temp }}/babel-plugin/runtime
          VIZE_BABEL_RUNTIME_ROLE: frontier
        run: . "${{ env.VIZE_CI_FILES }}/retain-four-strict-unsupported-rc9-functional-frontier-rows.sh"
      - name: Check package source and declarations
        if: always()
        run: vp run --filter './npm/builder/babel' check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: babel-rc9-unsupported-frontier-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/babel-plugin
            !${{ runner.temp }}/babel-plugin/**/node_modules/**
            npm/native/.artifacts/native/build-token-receipt.json
            npm/native/*.node
            npm/builder/babel/test/hosts/fixtures/babel7/package-lock.json
            npm/builder/babel/test/hosts/fixtures/babel8/package-lock.json
          if-no-files-found: error
          retention-days: 14
