name: Text boundary benchmark

on:
  pull_request:
    paths:
      - "davinci/vize_l0/src/source_io/**"
      - "davinci/vize_l0/src/source_io.rs"
      - "crates/vize_carton/src/source_io/**"
      - "crates/vize_carton/src/source_io.rs"
      - "crates/vize_carton/examples/source_io_bench.rs"
      - ".github/workflows/text-boundary-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: text-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  paired-read:
    name: UTF-8 correctness and paired file reads
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: text-boundary
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Verify exact UTF-8 and filesystem contracts
        run: cargo test --locked -p vize_l0 -p vize_carton source_io
      - name: Check the source boundary and benchmark with Clippy
        run: cargo clippy --locked -p vize_carton --lib --tests --examples -- -D warnings
      - name: Measure validation and actual file reads separately
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: cargo run --locked --profile ci-opt -p vize_carton --example source_io_bench -- source-io-bench.json
      - name: Upload exact timings and input sizes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-io-bench
          path: source-io-bench.json
          if-no-files-found: error
          retention-days: 14
