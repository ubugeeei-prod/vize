name: Release integration catalog
on: { workflow_call: null }
permissions: { contents: read, pull-requests: read }
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  release-integration-catalog:
    name: Release integration catalog
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - name: Select the official integration candidate
        id: candidate
        env: { GH_TOKEN: "${{ github.token }}" }
        run: node tools/support/compat/github/release-integration-event.ts
      - name: Fetch exact integration history
        if: ${{ steps.candidate.outputs.integration != '' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with: { toolchain: stable }
        if: ${{ steps.candidate.outputs.integration != '' }}
      - uses: ./.github/actions/setup-rust-script
        if: ${{ steps.candidate.outputs.integration != '' }}
      - name: Authenticate metadata and the complete pinned catalog before merge
        if: ${{ steps.candidate.outputs.integration != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          INTEGRATION_PR: ${{ steps.candidate.outputs.integration }}
        run: rust-script tools/commands/release/pr.rs check-integration-candidate "$INTEGRATION_PR"
      - name: Retain complete integration event and current body snapshots
        if: ${{ always() && steps.candidate.outputs.integration != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-integration-body-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vize-release-integration-catalog/
          if-no-files-found: error
          retention-days: 30
