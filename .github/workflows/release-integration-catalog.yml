name: Release integration catalog
on:
  workflow_call:
    outputs:
      integration:
        description: Official integration selected from this workflow event
        value: ${{ jobs.release-integration-catalog.outputs.integration }}
      qualification:
        description: Bounded successful qualification of this exact integration and Q/R attempts
        value: ${{ jobs.release-integration-catalog.outputs.qualification }}
permissions: { contents: read, pull-requests: read, actions: read }
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  release-integration-catalog:
    name: Release integration catalog
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions: { contents: read, pull-requests: read, actions: read }
    outputs:
      integration: ${{ steps.candidate.outputs.integration }}
      qualification: ${{ steps.qualification.outputs.qualification }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - name: Select the official integration candidate
        id: candidate
        env: { GH_TOKEN: "${{ github.token }}" }
        run: node tools/support/compat/github/release-integration-event.ts
      - name: Fetch exact integration history
        if: ${{ steps.candidate.outputs.integration != '' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with: { toolchain: stable }
        if: ${{ steps.candidate.outputs.integration != '' }}
      - uses: ./.github/actions/setup-rust-script
        if: ${{ steps.candidate.outputs.integration != '' }}
      - name: Authenticate metadata and the complete pinned catalog before merge
        if: ${{ steps.candidate.outputs.integration != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          INTEGRATION_PR: ${{ steps.candidate.outputs.integration }}
        run: |
          directory="$RUNNER_TEMP/vize-release-integration-catalog"
          mkdir -p "$directory"
          rust-script tools/commands/release/pr.rs check-integration-candidate "$INTEGRATION_PR" > "$directory/candidate-context.json"
          cat "$directory/candidate-context.json"
      - name: Require the exact existing source and release readiness before queue success
        id: qualification
        if: ${{ github.event_name == 'merge_group' && steps.candidate.outputs.integration != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VIZE_RELEASE_INTEGRATION_EVIDENCE: ${{ runner.temp }}/vize-release-integration-catalog/qualification-observations.jsonl
        run: |
          directory="$RUNNER_TEMP/vize-release-integration-catalog"
          node tools/support/release/qualify_check/integration.ts --wait < "$directory/candidate-context.json" > "$directory/qualification-q.json"
          node tools/support/release/qualify_check/integration-release.ts --wait < "$directory/qualification-q.json" > "$directory/qualification.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const raw = fs.readFileSync(`${process.env.RUNNER_TEMP}/vize-release-integration-catalog/qualification.json`, 'utf8');
          assert.ok(Buffer.byteLength(raw) <= 16384, 'qualification output exceeds 16 KiB');
          const receipt = JSON.parse(raw);
          assert.ok(receipt && typeof receipt === 'object' && !Array.isArray(receipt));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `qualification=${JSON.stringify(receipt)}\n`);
          NODE
      - name: Retain complete integration event and current body snapshots
        if: ${{ always() && steps.candidate.outputs.integration != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-integration-body-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vize-release-integration-catalog/
          if-no-files-found: error
          retention-days: 30
