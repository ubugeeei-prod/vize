name: Rust frontend threads benchmark
run-name: Rust frontend threads @ ${{ github.sha }}
# Measures rustc's nightly parallel frontend (`--jobs-frontend=N`) against the
# pinned stable toolchain on the CI runner class. Release builds stay on stable;
# this workflow only produces evidence. Driver:
# tools/support/github/rust-frontend-threads-bench.ts
on:
  workflow_dispatch:
    inputs:
      nightly:
        description: Nightly toolchain to compare (parallel frontend is on by default since nightly-2026-11-14)
        type: string
        default: nightly-2026-11-16
      rounds:
        description: Rounds per configuration (each round visits every configuration in rotated order)
        type: string
        default: "3"
permissions: { contents: read }
concurrency:
  group: rust-frontend-threads-${{ github.sha }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: never
  BENCH_STABLE_TOOLCHAIN: "1.99.1"
  BENCH_NIGHTLY_TOOLCHAIN: ${{ inputs.nightly || 'nightly-2026-11-16' }}
  BENCH_ROUNDS: ${{ inputs.rounds || '3' }}
jobs:
  measure:
    name: Measure (${{ matrix.name }})
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ws-check, scenario: ws-check, configs: "stable,j1,j2,j8,j32" }
          - { name: ws-clippy, scenario: ws-clippy, configs: "stable,j1,j2,j8,j32" }
          - { name: ws-build, scenario: ws-build, configs: "stable,j1,j2,j8,j32" }
          - { name: ws-test, scenario: ws-test, configs: "stable,j1,j2,j8,j32" }
          - { name: canon, scenario: "crate:vize_canon", configs: "stable,j1,j2,j4,j8,j16,j32" }
          - { name: canon-opt, scenario: "crate:vize_canon:opt", configs: "stable,j1,j2,j4,j8,j32" }
          - { name: patina, scenario: "crate:vize_patina", configs: "stable,j1,j2,j4,j8,j16,j32" }
          - { name: maestro, scenario: "crate:vize_maestro", configs: "stable,j1,j2,j4,j8,j16,j32" }
          - { name: vize, scenario: "crate:vize", configs: "stable,j1,j2,j4,j8,j16,j32" }
          - { name: incremental, scenario: incremental, configs: "stable,j1,j2,j4,j8" }
          - { name: determinism, scenario: determinism, configs: "j8,j8,j1" }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with: { toolchain: "1.99.1", components: clippy }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with: { toolchain: "${{ env.BENCH_NIGHTLY_TOOLCHAIN }}", components: clippy }
      - uses: ./.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - name: Require GNU time
        run: test -x /usr/bin/time || { sudo apt-get update -qq && sudo apt-get install -y -qq time; }
      - name: Measure
        env:
          BENCH_SCENARIO: ${{ matrix.scenario }}
          BENCH_CONFIGS: ${{ matrix.configs }}
          BENCH_NAME: ${{ matrix.name }}
        run: >-
          BENCH_TARGET_DIR="$RUNNER_TEMP/frontend-bench-target"
          node tools/support/github/rust-frontend-threads-bench.ts run
          --scenario "$BENCH_SCENARIO" --configs "$BENCH_CONFIGS" --rounds "$BENCH_ROUNDS"
          --out "$RUNNER_TEMP/frontend-bench/$BENCH_NAME.json"
      - name: Summarize
        if: ${{ always() }}
        env: { BENCH_NAME: "${{ matrix.name }}" }
        run: >-
          test ! -s "$RUNNER_TEMP/frontend-bench/$BENCH_NAME.json" ||
          node tools/support/github/rust-frontend-threads-bench.ts summarize
          "$RUNNER_TEMP/frontend-bench/$BENCH_NAME.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: rust-frontend-threads-${{ matrix.name }}
          path: ${{ runner.temp }}/frontend-bench/
          if-no-files-found: ignore
          retention-days: 30
  summary:
    name: Summarize all scenarios
    needs: measure
    if: ${{ always() }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          {
            pattern: "rust-frontend-threads-*",
            path: "${{ runner.temp }}/frontend-bench",
            merge-multiple: true,
          }
      - name: Summarize
        run: node tools/support/github/rust-frontend-threads-bench.ts summarize "$RUNNER_TEMP"/frontend-bench/*.json >> "$GITHUB_STEP_SUMMARY"
