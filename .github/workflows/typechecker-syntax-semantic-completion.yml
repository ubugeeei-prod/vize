name: Native syntax and semantic completion
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Complete immutable commit SHA for the composed source
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: typechecker-syntax-completion-${{ inputs.source_ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  QUALIFIER_SHA: ${{ inputs.source_ref }}
jobs:
  native-syntax-completion:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 105
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/typechecker-syntax-semantic-completion/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.QUALIFIER_SHA }}
          persist-credentials: false
      - name: Authenticate the complete source
        run: . "${{ env.VIZE_CI_FILES }}/authenticate-the-complete-source.sh"
      - name: Original complete App E2E check row, sharing its native build
        env:
          VIZE_APP_CHECK_CAPTURE_DIR: ${{ github.workspace }}/target/native-syntax-completion/original-app-packets
        uses: ./.github/actions/app-e2e-row
        with:
          profile: full
          suite: check
          shard: all
          task: test:check
          timeout: 75m
          needs-playwright: "false"
          cache-key: app-e2e-full-check-all
          worktree-id: ci-app-e2e-full-check-all
          artifact-stem: full-check-all
      - name: Actual generator and native completion controls
        if: ${{ !cancelled() }}
        env:
          VIZE_TEST_REQUIRE_TSGO: "1"
          VIZE_TEST_REQUIRE_PIN_INPUT_FIXTURE: "1"
          VIZE_NATIVE_SYNTAX_CAPTURE_DIR: ${{ github.workspace }}/target/native-syntax-completion/packets
        run: . "${{ env.VIZE_CI_FILES }}/actual-generator-and-native-completion-controls.sh"
      - name: Retain all whole-source qualification packets
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-syntax-completion-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.QUALIFIER_SHA }}
          path: |
            target/native-syntax-completion/
            target/app-e2e-logs/
            tests/app/results/
            tests/snapshots/check/**/__snapshots__/*.snap.actual
          if-no-files-found: error
          retention-days: 7
