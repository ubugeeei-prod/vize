name: Native syntax and semantic completion
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Complete immutable commit SHA for the composed source
        required: true
        type: string
      handoff_only:
        description: Replay the unchanged native handoff test at an exact baseline and source
        required: false
        default: false
        type: boolean
      baseline_ref:
        description: Complete immutable baseline SHA required by handoff_only
        required: false
        default: ""
        type: string
      shutdown_controls:
        description: Run exact-source shutdown controls and an isolated old-close negative control
        required: false
        default: false
        type: boolean
      provider_contract_only:
        description: Capture the exact foreign mapper physical image and complete wire contract
        required: false
        default: false
        type: boolean
      provider_runtime_controls:
        description: Also require actual product-client DTO and owned close controls for the pinned provider
        required: false
        default: false
        type: boolean
      contextual_anchor_controls:
        description: Require the external contextual-prop native and published beta mapper replay
        required: false
        default: false
        type: boolean
      generic_route_controls:
        description: Require the unchanged 144 generic host packets and producer-owned diagnostic route controls
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: typechecker-syntax-completion-${{ inputs.source_ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  QUALIFIER_SHA: ${{ inputs.source_ref }}
jobs:
  native-syntax-completion:
    if: ${{ !inputs.handoff_only && !inputs.provider_contract_only && !inputs.contextual_anchor_controls }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.QUALIFIER_SHA }}
          persist-credentials: false
      - name: Authenticate the complete source
        run: |
          [[ "$QUALIFIER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$QUALIFIER_SHA"
          mkdir -p target/native-syntax-completion
          git rev-parse HEAD > target/native-syntax-completion/source.sha
          git ls-files -s > target/native-syntax-completion/whole-source-index.txt
      - name: Original complete App E2E check row, sharing its native build
        env:
          VIZE_APP_CHECK_CAPTURE_DIR: ${{ github.workspace }}/target/native-syntax-completion/original-app-packets
        uses: ./.github/actions/app-e2e-row
        with:
          profile: full
          suite: check
          shard: all
          task: test:check
          timeout: 75m
          needs-playwright: "false"
          cache-key: app-e2e-full-check-all
          worktree-id: ci-app-e2e-full-check-all
          artifact-stem: full-check-all
      - name: Actual generator and native completion controls
        if: ${{ !cancelled() }}
        env:
          VIZE_TEST_REQUIRE_TSGO: "1"
          VIZE_TEST_REQUIRE_PIN_INPUT_FIXTURE: "1"
          VIZE_NATIVE_SYNTAX_CAPTURE_DIR: ${{ github.workspace }}/target/native-syntax-completion/packets
        run: |
          set -euo pipefail
          unset VIZE_TEST_DISABLE_TSGO
          qualifier_status=0
          for control in anchors malformed-setup generic jsx native; do
            case "$control" in
              anchors) control_args=(--lib anchors::tests:: -- --nocapture) ;;
              malformed-setup) control_args=(--lib vue_codegen::malformed_setup_tests:: -- --nocapture --test-threads=1) ;;
              generic) control_args=(--lib vue_codegen::generic_component_tests:: -- --nocapture --test-threads=1) ;;
              jsx) control_args=(--lib jsx_codegen::nested_tests:: -- --nocapture) ;;
              native) control_args=(--test native_syntax_semantics -- --nocapture --test-threads=1) ;;
            esac
            set +e
            cargo test --locked --profile ci -p vize_canon "${control_args[@]}" 2>&1 | tee "target/native-syntax-completion/$control.log"
            control_status=("${PIPESTATUS[@]}")
            set -e
            printf '%s %s\n' "${control_status[0]}" "${control_status[1]}" > "target/native-syntax-completion/$control.status"
            if (( control_status[0] != 0 || control_status[1] != 0 )); then qualifier_status=1; fi
          done
          exit "$qualifier_status"
      - name: Retain all whole-source qualification packets
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-syntax-completion-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.QUALIFIER_SHA }}
          path: |
            target/native-syntax-completion/
            target/app-e2e-logs/
            tests/app/results/
            tests/snapshots/check/**/__snapshots__/*.snap.actual
          if-no-files-found: error
          retention-days: 7

  native-handoff-replay:
    if: ${{ inputs.handoff_only && !inputs.provider_contract_only }}
    name: Native shutdown baseline (${{ matrix.side }})
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: baseline
            source: ${{ inputs.baseline_ref }}
          - side: head
            source: ${{ inputs.source_ref }}
    env:
      SOURCE_SHA: ${{ matrix.source }}
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "12"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      VIZE_TEST_REQUIRE_TSGO: "1"
      VIZE_TEST_REQUIRE_PIN_INPUT_FIXTURE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Authenticate the immutable source input
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$RUNNER_TEMP/native-handoff-replay"
          git rev-parse HEAD > "$RUNNER_TEMP/native-handoff-replay/driver.sha"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - name: Authenticate the complete original source
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git ls-files -s > "$RUNNER_TEMP/native-handoff-replay/whole-source-index.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/native-handoff-replay/source.sha"
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: nextest-ci
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/cache-vp-bootstrap
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: latest
          node-version-file: source/package.json
          cache: true
          cache-save: false
          run-install: false
      - name: Install the source's locked runtime and Vue dependency
        working-directory: source
        run: node tools/support/github/vp-install.ts --filter vize-workspace --filter './npm/builder/vite...'
      - name: Build the unchanged original test binary
        working-directory: source
        run: |
          set -euo pipefail
          unset VIZE_TEST_DISABLE_TSGO
          cargo test --locked --profile ci -p vize_canon --test native_syntax_semantics --no-run --message-format=json > "$RUNNER_TEMP/native-handoff-replay/build.stdout" 2> "$RUNNER_TEMP/native-handoff-replay/build.stderr"
      - name: Replay the original handoff with whole output custody
        working-directory: source
        env:
          VIZE_NATIVE_SYNTAX_CAPTURE_DIR: ${{ runner.temp }}/native-handoff-replay/packets
        run: node ../tools/support/github/native-handoff-replay.mjs "$RUNNER_TEMP/native-handoff-replay"
      - name: Capture the complete actual known-provider handshake
        if: ${{ inputs.shutdown_controls }}
        working-directory: source
        run: node ../tools/support/github/native-shutdown-handshake.mjs "$RUNNER_TEMP/native-handoff-replay"
      - name: Verify strict owned shutdown controls and old-close rejection
        if: ${{ inputs.shutdown_controls && matrix.side == 'head' }}
        working-directory: source
        run: node ../tools/support/github/native-shutdown-controls.mjs "$RUNNER_TEMP/native-handoff-replay"
      - name: Retain original source, provider, executable and whole packets
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-handoff-replay-${{ matrix.side }}-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-handoff-replay/
          if-no-files-found: error
          retention-days: 14

  native-provider-contract:
    if: ${{ inputs.provider_contract_only }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ inputs.source_ref }}
      PROVIDER_SOURCE: d6c4afddb2c55f4a9dea7b59293a99a8fdea1799
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "12"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - name: Authenticate source and driver without changing product admission
        working-directory: source
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/native-provider-contract/provider"
          git rev-parse HEAD > "$RUNNER_TEMP/native-provider-contract/source.sha"
          git ls-files -s > "$RUNNER_TEMP/native-provider-contract/whole-source-index.txt"
          git -C .. rev-parse HEAD > "$RUNNER_TEMP/native-provider-contract/driver.sha"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: microsoft/TypeScript
          ref: ${{ env.PROVIDER_SOURCE }}
          path: typescript-content-mapper
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: typescript-content-mapper/tsc/go.mod
          cache-dependency-path: typescript-content-mapper/tsc/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: source/package.json, package-manager-cache: false }
      - name: Build the exact physical upstream image with the existing flags
        working-directory: typescript-content-mapper/tsc
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PROVIDER_SOURCE"
          go version > "$RUNNER_TEMP/native-provider-contract/go-version.txt"
          go build -tags=noembed -trimpath -o "$RUNNER_TEMP/tsgo" ./cmd/tsc > "$RUNNER_TEMP/native-provider-contract/build.stdout" 2> "$RUNNER_TEMP/native-provider-contract/build.stderr"
          cp internal/bundled/libs/*.d.ts "$RUNNER_TEMP/"
          cp "$RUNNER_TEMP/tsgo" "$RUNNER_TEMP/native-provider-contract/provider/tsgo"
          cp internal/bundled/libs/*.d.ts "$RUNNER_TEMP/native-provider-contract/provider/"
          go version -m "$RUNNER_TEMP/tsgo" > "$RUNNER_TEMP/native-provider-contract/go-build-info.txt"
      - name: Authenticate the complete physical provider and declared version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { spawnSync } from 'node:child_process';
          const binary=join(process.env.RUNNER_TEMP,'tsgo');
          const sha256=createHash('sha256').update(readFileSync(binary)).digest('hex');
          assert.equal(sha256,'77dd575e73107c00cc95cbccc3764ab7210089b5634f75e219b61632bd5d230b');
          const version=spawnSync(binary,['--version'],{encoding:'utf8',timeout:10000});
          assert.equal(version.status,0);
          assert.equal(version.stdout,'Version 7.1.0-dev\n');
          assert.equal(version.stderr,'');
          writeFileSync(join(process.env.RUNNER_TEMP,'native-provider-contract/provider.json'),JSON.stringify({binary,sha256,version:'7.1.0-dev',serverName:'typescript',upstream:process.env.PROVIDER_SOURCE},null,2)+'\n');
          JS
      - name: Capture complete Initialize ACK completion EOF and raw stderr
        working-directory: source
        run: node ../tools/support/github/native-shutdown-handshake.mjs "$RUNNER_TEMP/native-provider-contract" "$RUNNER_TEMP/native-provider-contract/provider.json"
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        if: ${{ inputs.provider_runtime_controls }}
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        if: ${{ inputs.provider_runtime_controls }}
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        if: ${{ inputs.provider_runtime_controls }}
        with:
          key: nextest-ci
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        if: ${{ inputs.generic_route_controls }}
        with:
          version: latest
          node-version-file: source/package.json
          cache: true
          cache-save: false
          run-install: false
      - name: Install the composed source's unchanged locked host dependencies
        if: ${{ inputs.generic_route_controls }}
        working-directory: source
        run: vp install --frozen-lockfile --prefer-offline
      - name: Require all owned wire laws and the actual product-client provider lifecycle
        if: ${{ inputs.provider_runtime_controls }}
        working-directory: source
        env:
          VIZE_TEST_NATIVE_MAPPER_TSGO: ${{ runner.temp }}/tsgo
          VIZE_NATIVE_PROVIDER_CAPTURE_DIR: ${{ runner.temp }}/native-provider-contract/product-client
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/native-provider-contract"
          rustc -Vv > "$directory/rustc-version.txt"
          cargo --version > "$directory/cargo-version.txt"
          cargo test --locked --profile ci -p vize_canon --lib lsp_client::editor_lsp::native_shutdown:: -- --nocapture --test-threads=1 > "$directory/wire-controls.stdout" 2> "$directory/wire-controls.stderr"
          cargo test --locked --profile ci -p vize_canon --lib lsp_client::editor_lsp::native_shutdown::tests::native_provider::pinned_mapper_sessions_keep_complete_diagnostics_and_clean_owned_shutdown -- --ignored --exact --nocapture --test-threads=1 > "$directory/product-client.stdout" 2> "$directory/product-client.stderr"
          node --input-type=module - "$directory" <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {join} from 'node:path';
          const directory=process.argv[2];
          const stdout=readFileSync(join(directory,'product-client.stdout'),'utf8');
          assert(stdout.includes('test lsp_client::editor_lsp::native_shutdown::tests::native_provider::pinned_mapper_sessions_keep_complete_diagnostics_and_clean_owned_shutdown ... ok'));
          assert(/^test result: ok\. 1 passed; 0 failed; 0 ignored; /m.test(stdout));
          for(const phase of ['valid','error','repaired']) {
            const packet=JSON.parse(readFileSync(join(directory,'product-client',`${phase}.json`),'utf8'));
            assert.equal(packet.status,0);
            assert.deepEqual(packet.wholeStderr,[]);
            assert.equal(packet.result.admitted,true);
          }
          JS
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
      - name: Require diagnostic route ownership refusal repair and ordinary fallback controls
        if: ${{ !cancelled() && inputs.generic_route_controls }}
        working-directory: source
        run: |
          set -euo pipefail
          unset VIZE_TEST_DISABLE_TSGO
          directory="$RUNNER_TEMP/native-provider-contract"
          failed=0
          for control in route-owners route-refusal ordinary-fallback config-refusal batch-fixture; do
            case "$control" in
              route-owners) arguments=(--lib batch::virtual_project::diagnostic_route::tests::) ;;
              route-refusal) arguments=(--lib batch::executor::tests::planned_syntax_route::) ;;
              ordinary-fallback) arguments=(--lib batch::executor::tests::incremental_fallback::incremental_session_fallback_is_counted_per_check) ;;
              config-refusal) arguments=(--lib batch::executor::session::tests::unsupported_explicit_editor_selection_uses_only_the_exact_internal_fallback_reason) ;;
              batch-fixture) arguments=(--test fix_history_diagnostics planned_generic_syntax_keeps_independent_body_errors_through_repairs) ;;
            esac
            set +e
            if [[ "$control" == batch-fixture ]]; then
              CORSA_PATH="$RUNNER_TEMP/tsgo" cargo test --locked --profile ci -p vize_canon "${arguments[@]}" -- --nocapture --test-threads=1 > "$directory/$control.stdout" 2> "$directory/$control.stderr"
            else
              cargo test --locked --profile ci -p vize_canon "${arguments[@]}" -- --nocapture --test-threads=1 > "$directory/$control.stdout" 2> "$directory/$control.stderr"
            fi
            status=$?
            set -e
            printf '%s\n' "$status" > "$directory/$control.status"
            if (( status != 0 )); then failed=1; fi
          done
          exit "$failed"
      - name: Require all unchanged generic native mapper and plain-session whole outcomes
        if: ${{ !cancelled() && inputs.generic_route_controls }}
        working-directory: source
        env:
          VIZE_TEST_CONTENT_MAPPER_TSGO: ${{ runner.temp }}/tsgo
        run: |
          set -euo pipefail
          unset VIZE_TEST_DISABLE_TSGO
          directory="$RUNNER_TEMP/native-provider-contract"
          set +e
          cargo test --locked --profile ci -p vize --test integration -- content_mapper_tsgo_cli::quoted_generic_parameters:: --nocapture --test-threads=1 > "$directory/generic-hosts.stdout" 2> "$directory/generic-hosts.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$directory/generic-hosts.status"
          exit "$status"
      - name: Authenticate every whole host packet and exact executed control
        if: ${{ !cancelled() && inputs.generic_route_controls }}
        working-directory: source
        run: node ../tools/support/github/native-generic-route-proof.mjs "$RUNNER_TEMP/native-provider-contract"
      - name: Retain every generic host packet even after a strict failure
        if: ${{ always() && inputs.generic_route_controls }}
        run: |
          if [[ -d source/target/vize-tests/content-mapper-quoted-generic-parameters ]]; then
            cp -a source/target/vize-tests/content-mapper-quoted-generic-parameters "$RUNNER_TEMP/native-provider-contract/"
          fi
      - name: Retain physical image and complete contract regardless of outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-provider-contract-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/native-provider-contract/
          if-no-files-found: error
          retention-days: 14

  actual-native-and-beta-mapper:
    if: ${{ inputs.contextual_anchor_controls }}
    env:
      SOURCE_SHA: ${{ inputs.source_ref }}
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "12"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: naitokosuke/vize-from-prop-template-repro
          ref: 8195df603650e88e61381f4878bd8ac89ed1953a
          path: reporter
          persist-credentials: false
      - name: Authenticate immutable source and inspected public scripts
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C reporter rev-parse HEAD)" = 8195df603650e88e61381f4878bd8ac89ed1953a
          mkdir -p "$RUNNER_TEMP/contextual-prop-anchors"
          git -C source ls-files -s > "$RUNNER_TEMP/contextual-prop-anchors/whole-source-index.txt"
          git -C source rev-parse HEAD > "$RUNNER_TEMP/contextual-prop-anchors/source.sha"
          git rev-parse HEAD > "$RUNNER_TEMP/contextual-prop-anchors/driver.sha"
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: nextest-ci
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: latest
          node-version-file: source/package.json
          cache: true
          cache-save: false
          run-install: false
      - name: Install frozen source dependencies
        working-directory: source
        run: vp install --frozen-lockfile --prefer-offline
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "26.12.1", package-manager-cache: false }
      - name: Inspect reporter scripts and install the exact published lock without hooks
        working-directory: reporter
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync('package.json','utf8'));
          assert.deepEqual(p.scripts,{check:'tsc --runExternalCode --noEmit -p tsconfig.json'});
          assert.deepEqual(p.dependencies,{vue:'3.5.44'});
          assert.deepEqual(p.devDependencies,{typescript:'7.1.0-beta',vize:'0.569.0'});
          JS
          npm exec --yes --ignore-scripts --package=pnpm@12.9.0 -- pnpm install --frozen-lockfile --ignore-scripts
          git diff --exit-code
      - name: Preserve exact public failure and authenticate both physical providers
        run: node tools/support/github/contextual-prop-anchor-replay.mjs prepare "$RUNNER_TEMP/contextual-prop-anchors"
      - name: Require generator regressions and complete batch fixture diagnostics
        working-directory: source
        run: |
          set -euo pipefail
          unset VIZE_TEST_DISABLE_TSGO
          directory="$RUNNER_TEMP/contextual-prop-anchors"
          cargo test --locked --profile ci -p vize_canon --lib virtual_ts::generator::anchors:: -- --nocapture --test-threads=1 > "$directory/generator.stdout" 2> "$directory/generator.stderr"
          cargo test --locked --profile ci -p vize_canon --test fix_history_diagnostics contextual_prop_anchors_preserve_authored_diagnostics -- --exact --nocapture --test-threads=1 > "$directory/batch.stdout" 2> "$directory/batch.stderr"
      - name: Require complete real native and beta mapper outputs across all source variants
        if: ${{ !cancelled() }}
        working-directory: source
        run: |
          set -euo pipefail
          unset VIZE_TEST_DISABLE_TSGO
          directory="$RUNNER_TEMP/contextual-prop-anchors"
