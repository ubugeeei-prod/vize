name: Davinci unused bindings

on:
  pull_request:
    paths:
      - "davinci/vize_l0/**"
      - "crates/vize_croquis/**"
      - "crates/vize_atelier_sfc/src/croquis/**"
      - "crates/vize_atelier_sfc/src/croquis.rs"
      - "crates/vize_patina/**"
      - "tools/commands/davinci/seed-defects.rs"
      - "tools/support/davinci/**"
      - "tests/tooling/davinci-unused-setup-bindings.test.ts"
      - "tests/_fixtures/davinci-fpfn/**"
      - ".github/workflows/davinci-unused-bindings.yml"
      - "tools/support/compat/github/compare-unused-bindings-profiles.ts"
      - "tests/tooling/unused-bindings-profiles.test.mjs"
  workflow_dispatch:
    inputs:
      compare-profiles:
        description: Compare the old test profile and ci profile on this exact source, old first
        type: boolean
        default: false

concurrency:
  group: davinci-unused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unused-bindings:
    name: Unused bindings fact specs and seeded recall
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: true
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: unused-bindings
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      - name: Hydrate the pinned P0-13 shard
        run: git submodule update --init --depth 1 -- tests/_fixtures/_git/splitpanes tests/_fixtures/_git/layoutit-grid tests/_fixtures/_git/cssgridgenerator
      - name: Check independent specs and real rule dispatch
        if: ${{ !inputs.compare-profiles }}
        env:
          VIZE_DAVINCI_FACT_CORPUS: tests/_fixtures/_git/splitpanes,tests/_fixtures/_git/layoutit-grid,tests/_fixtures/_git/cssgridgenerator
        run: |
          cargo test --profile ci -p vize_l0 --test fact_demand
          cargo test --profile ci -p vize_croquis --test fact_spec
          cargo test --profile ci -p vize_patina unused_setup_bindings
      - name: Compare the same complete fact specs under both profiles
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.compare-profiles }}
        env:
          VIZE_DAVINCI_FACT_CORPUS: tests/_fixtures/_git/splitpanes,tests/_fixtures/_git/layoutit-grid,tests/_fixtures/_git/cssgridgenerator
        run: node tools/support/compat/github/compare-unused-bindings-profiles.ts
      - name: Build the real CLI
        run: cargo build --profile ci -p vize
      - name: Recall every class-b mutation and reject wrong diagnostic identities
        run: VIZE_BIN="$PWD/target/ci/vize" vp exec node --test tests/tooling/davinci-unused-setup-bindings.test.ts tests/tooling/davinci-fpfn-pilots.test.ts
      - name: Preserve complete profile comparison output
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.compare-profiles }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unused-bindings-profiles-${{ github.sha }}
          path: target/unused-bindings-profiles/
          if-no-files-found: error
          retention-days: 14
