name: LSP config startup diagnostics
run-name: Vben startup trace @ ${{ github.event.pull_request.head.sha }}

# One instrumented original performance case, not full Check qualification.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/lsp-config-diagnostics.yml
      - .github/scripts/workflows/lsp-config-diagnostics/**
      - tools/support/compat/github/run-lsp-config-diagnostics.ts
      - tests/tooling/lsp-config-diagnostics-workflow.test.ts

permissions:
  contents: read

concurrency:
  group: lsp-config-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
  RAYON_NUM_THREADS: "4"
  VIZE_PERF_BUDGET_SCALE: "1"
  VIZE_TRACE_EDITOR_PREPARATION: "1"
  VIZE_LSP_BIN: target/ci/vize
  EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}

jobs:
  vben-startup:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/lsp-config-diagnostics/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: "1.100.0"
          components: clippy
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: vue-parity
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Hydrate only the original pinned Vben fixture
        run: git submodule update --init --depth 1 tests/_fixtures/_git/vue-vben-admin
      - name: Install the frozen workspace dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Build and receipt the same Vue parity producer
        id: producer
        run: . "${{ env.VIZE_CI_FILES }}/build-and-receipt-the-same-vue-parity-producer.sh"
      - name: Run the unchanged original performance case with native phase tracing
        run: node tools/support/compat/github/run-lsp-config-diagnostics.ts
      - name: Protect cold local responses and existing initial diagnostic controls
        if: ${{ !cancelled() && steps.producer.outcome == 'success' }}
        run: . "${{ env.VIZE_CI_FILES }}/protect-cold-local-responses-and-existing-initial-diagnostic-controls.sh"
      - name: Verify native preparation and request freshness laws
        if: ${{ !cancelled() && steps.producer.outcome == 'success' }}
        run: . "${{ env.VIZE_CI_FILES }}/verify-native-preparation-and-request-freshness-laws.sh"
      - name: Verify real union ownership and reverse open-order regressions
        if: ${{ !cancelled() && steps.producer.outcome == 'success' }}
        run: . "${{ env.VIZE_CI_FILES }}/verify-real-union-ownership-and-reverse-open-order-regressions.sh"
      - name: Verify whole native views and issued candidate freshness with nonzero tests
        if: ${{ !cancelled() && steps.producer.outcome == 'success' }}
        run: . "${{ env.VIZE_CI_FILES }}/verify-whole-native-views-and-issued-candidate-freshness-with-nonzero-te.sh"
      - name: Resolve the original native candidate after unchanged sibling diagnostics
        if: ${{ !cancelled() && steps.producer.outcome == 'success' }}
        run: . "${{ env.VIZE_CI_FILES }}/resolve-the-original-native-candidate-after-unchanged-sibling-diagnostic.sh"
      - name: Preserve the original atomic rename and unsafe-name refusal contract
        if: ${{ !cancelled() && steps.producer.outcome == 'success' }}
        run: . "${{ env.VIZE_CI_FILES }}/preserve-the-original-atomic-rename-and-unsafe-name-refusal-contract.sh"
      - name: Observe the original six symlink workspace layouts
        if: ${{ !cancelled() && steps.producer.outcome == 'success' }}
        run: . "${{ env.VIZE_CI_FILES }}/observe-the-original-six-symlink-workspace-layouts.sh"
      - name: Retain source, binary, raw process output, native phases, and metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lsp-config-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha }}
          path: |
            target/vize-tests/lsp-config-diagnostics/
            target/vize-tests/metrics/vben-lsp-incremental/
            target/ci/vize
            target/ci/vize.differential-build.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
