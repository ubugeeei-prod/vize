name: Volar Plugin

on:
  # Off the PR tier: main runs it nightly.
  schedule:
    - cron: "7 4 * * *"
  workflow_dispatch: {}

permissions: { contents: read }
concurrency:
  group: volar-plugin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  native-volar-service:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      VIZE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /tools/ci/lib/scripts/
            /tools/ci/workflows/05-volar-plugin/scripts/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ env.VIZE_SOURCE_SHA }}", persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: ./.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: test-js-packages
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Install exact official Volar and TypeScript service providers
        working-directory: ${{ runner.temp }}
        run: . "${{ env.VIZE_CI_FILES }}/install-exact-official-volar-and-typescript-service-providers.sh"
      - name: Build the actual reviewed native source
        run: . "${{ env.VIZE_CI_FILES }}/build-the-actual-reviewed-native-source.sh"
      - name: Retain immutable source and actual loaded native identity
        run: node npm/volar/test/source-receipt.js
      - name: Check portable native projection boundaries
        run: node --test npm/native/test/language-projection.test.cjs
      - name: Exercise actual Volar context and TypeScript language service
        run: node --test npm/volar/test/service.test.js
      - name: Check public package declarations
        run: . "${{ env.VIZE_CI_FILES }}/check-public-package-declarations.sh"
      - name: Exercise fresh packed consumers without source loader overrides
        run: node npm/volar/test/packed-consumer.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: volar-plugin-${{ env.VIZE_SOURCE_SHA }}
          path: ${{ runner.temp }}/volar-plugin-evidence
          if-no-files-found: error
          compression-level: 0
          overwrite: true
