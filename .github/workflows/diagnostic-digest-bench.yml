name: Diagnostic digest benchmark
run-name: "Diagnostic digest ${{ inputs.head }} vs ${{ inputs.base }}"
# Base vs head cost of the `vize check` / `vize build` diagnostic digest on
# pinned real corpora (elk, misskey), interleaved per round on one runner,
# with an A/A control (a second copy of the base binary). Also checks that
# zero-digest runs print exactly base's output and that `--verbose` restores
# it where a digest prints. Driver:
# tools/benchmarks/scripts/diagnostic-digest-bench.ts
on:
  workflow_dispatch:
    inputs:
      base:
        description: Full 40-hex base commit
        type: string
        required: true
      head:
        description: Full 40-hex head commit
        type: string
        required: true
      rounds:
        description: Measured rounds per scenario (each round runs every variant once, rotated)
        type: string
        default: "7"
  # Registers the dispatch-only workflow from its PR; only the tests run there.
  pull_request:
    paths:
      - .github/workflows/diagnostic-digest-bench.yml
      - tools/benchmarks/scripts/diagnostic-digest-bench.ts
      - tests/tooling/diagnostic-digest-bench.test.ts
permissions: { contents: read }
concurrency:
  group: diagnostic-digest-bench-${{ github.event.pull_request.number || inputs.head }}-${{ inputs.base }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  ELK_SHA: 6b956a6d4a89a676059d83a0b0e59d7165d5f266
  MISSKEY_SHA: ec27657bf51af0d9dcb3539623f107ee35f66e6e
jobs:
  test:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - run: node --test tests/tooling/diagnostic-digest-bench.test.ts

  measure:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 150
    env:
      BASE: ${{ inputs.base }}
      HEAD: ${{ inputs.head }}
      ROUNDS: ${{ inputs.rounds }}
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROUNDS" =~ ^[1-9][0-9]?$ ]]
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.100.0" }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - name: Build both commits
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/pair-target"
          for side in base head; do
            sha=$BASE; [[ $side == head ]] && sha=$HEAD
            git fetch --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$sha"
            git worktree add --detach "$RUNNER_TEMP/src-$side" "$sha"
            # One target directory: the second build recompiles only what differs.
            (cd "$RUNNER_TEMP/src-$side" && CARGO_TARGET_DIR="$target" cargo build --profile ci-opt -p vize --bin vize)
            mkdir -p "pair-bin/$side"
            cp "$target/ci-opt/vize" "pair-bin/$side/"
          done
          # The A/A control: the base binary again, measured as its own variant.
          mkdir -p pair-bin/base-aa && cp pair-bin/base/vize pair-bin/base-aa/
          ls -l pair-bin/*
      - name: Install GNU time and perf
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends time
          # Instruction counts are optional: the driver notes their absence.
          sudo apt-get install -y --no-install-recommends linux-tools-common "linux-tools-$(uname -r)" || true
          sudo sysctl -w kernel.perf_event_paranoid=1 || true
      - name: Fetch the pinned corpora
        shell: bash
        run: |
          set -euo pipefail
          corpora="$RUNNER_TEMP/corpora"
          mkdir -p "$corpora"
          curl --fail --silent --show-error --location --retry 5 \
            "https://codeload.github.com/elk-zone/elk/tar.gz/$ELK_SHA" | tar -xz -C "$corpora"
          curl --fail --silent --show-error --location --retry 5 \
            "https://codeload.github.com/misskey-dev/misskey/tar.gz/$MISSKEY_SHA" | tar -xz -C "$corpora"
          cd "$corpora/misskey-$MISSKEY_SHA"
          pnpm_spec=$(jq -r .packageManager package.json)
          [[ "$pnpm_spec" =~ ^pnpm@[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npx --yes "$pnpm_spec" install --filter "./packages/frontend..." --ignore-scripts
      - name: Measure
        shell: bash
        run: |
          set -euo pipefail
          chmod +x pair-bin/*/vize
          corpora="$RUNNER_TEMP/corpora"
          node tools/benchmarks/scripts/diagnostic-digest-bench.ts \
            --bin base=pair-bin/base/vize --bin head=pair-bin/head/vize --bin base-aa=pair-bin/base-aa/vize \
            --elk "$corpora/elk-$ELK_SHA" --misskey "$corpora/misskey-$MISSKEY_SHA/packages/frontend" \
            --rounds "$ROUNDS" --out "$RUNNER_TEMP/digest-bench" > /dev/null
      - name: Summarize
        if: always()
        shell: bash
        run: test ! -s "$RUNNER_TEMP/digest-bench/report.md" || cat "$RUNNER_TEMP/digest-bench/report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: diagnostic-digest-bench
          path: |
            ${{ runner.temp }}/digest-bench/report.md
            ${{ runner.temp }}/digest-bench/results.json
          if-no-files-found: warn
          retention-days: 14
