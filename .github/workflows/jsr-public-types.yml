name: Public JSR types and runtime capabilities
on:
  pull_request:
    paths:
      - .github/workflows/jsr-public-types.yml
      - .github/scripts/workflows/jsr-public-types/**
      - tools/support/release/jsr/consumer-types.ts.fixture
      - tools/support/release/jsr/consumer.ts
      - tools/support/release/jsr/consumer-deno.json
  workflow_dispatch:
    inputs:
      version:
        description: An already published immutable JSR version (no publication)
        type: string
        default: "0.571.0"
        required: true
permissions: { contents: read }
jobs:
  consumer:
    name: Public JSR types and runtime (${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, deno, bun]
    env:
      PUBLIC_JSR_VERSION: ${{ inputs.version || '0.571.0' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/jsr-public-types/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/support/release/jsr
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24", package-manager-cache: false }
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with: { deno-version: "2.9.7" }
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.3.14" }
      - name: Prepare the isolated public consumer
        working-directory: ${{ github.workspace }}
        run: . "${{ env.VIZE_CI_FILES }}/prepare-the-isolated-public-consumer.sh"
      - name: Install the public JSR package (Node)
        working-directory: ${{ runner.temp }}/jsr-public-consumer
        if: matrix.runtime == 'node'
        run: . "${{ env.VIZE_CI_FILES }}/install-the-public-jsr-package-node.sh"
      - name: Check the public types and execute every entry point (Node)
        working-directory: ${{ runner.temp }}/jsr-public-consumer
        if: matrix.runtime == 'node'
        run: . "${{ env.VIZE_CI_FILES }}/check-the-public-types-and-execute-every-entry-point-node.sh"
      - name: Install the public JSR package (Bun)
        working-directory: ${{ runner.temp }}/jsr-public-consumer
        if: matrix.runtime == 'bun'
        run: . "${{ env.VIZE_CI_FILES }}/install-the-public-jsr-package-bun.sh"
      - name: Check the public types and execute every entry point (Bun)
        working-directory: ${{ runner.temp }}/jsr-public-consumer
        if: matrix.runtime == 'bun'
        run: . "${{ env.VIZE_CI_FILES }}/check-the-public-types-and-execute-every-entry-point-bun.sh"
      - name: Check the public types and execute every entry point (Deno)
        working-directory: ${{ runner.temp }}/jsr-public-consumer
        if: matrix.runtime == 'deno'
        run: . "${{ env.VIZE_CI_FILES }}/check-the-public-types-and-execute-every-entry-point-deno.sh"
      - name: Preserve public metadata and dependency locks
        working-directory: ${{ runner.temp }}/jsr-public-consumer
        if: always()
        run: . "${{ env.VIZE_CI_FILES }}/preserve-public-metadata-and-dependency-locks.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: jsr-public-types-${{ matrix.runtime }}
          path: |
            ${{ runner.temp }}/jsr-public-consumer/*.log
            ${{ runner.temp }}/jsr-public-consumer/*.json
            ${{ runner.temp }}/jsr-public-consumer/*.lock
            ${{ runner.temp }}/jsr-public-consumer/*.txt
          if-no-files-found: error
