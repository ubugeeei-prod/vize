name: Vite+ configuration consumers

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: source
        options: [source, published-startup-75-76]
      version: { type: string, required: false }
      authority-blob: { type: string, required: false }
  pull_request:
    paths:
      - "tools/support/release/verify_published/vite_startup.ts"
      - "tools/support/release/verify_published/vite_startup_authority.ts"
      - "tools/support/release/verify_published/vite-startup-reports.json"
      - "tests/tooling/release/published-vite-startup.test.ts"
      - "crates/vize_carton/src/config/**"
      - "levels/vize_l0/src/config/**"
      - "crates/vize/src/commands/fmt/**"
      - "crates/vize/src/commands/fmt.rs"
      - "npm/cli/pkl/**"
      - "npm/cli/schemas/vize.config.schema.json"
      - "tests/tooling/viteplus-formatter-*.test.*"
      - "tests/tooling/support/lsp/launch.ts"
      - "tests/differential/build-receipt.ts"
      - ".github/workflows/full-source-cli.yml"
      - ".github/actions/restore-source-cli/**"
      - ".github/workflows/viteplus-config-consumers.yml"

permissions: { contents: read }

concurrency:
  group: viteplus-config-consumers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'published-startup-75-76'
    uses: ./.github/workflows/full-source-cli.yml
  consumers:
    needs: cli
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      VIZE_SOURCE_CLI_RECEIPT_SHA256: ${{ needs.cli.outputs.receipt-sha256 }}
      VIZE_LSP_REQUIRE_SOURCE_BUILD: "1"
      VIZE_LSP_BIN: ${{ github.workspace }}/target/ci/vize
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: package.json, cache: true, run-install: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: ./.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - run: vp install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/restore-source-cli
        with: { producer: "${{ toJSON(needs.cli.outputs) }}" }
      - name: Verify source CLI configuration transport and file custody
        run: node --test tests/tooling/viteplus-formatter-settings.test.ts tests/tooling/viteplus-formatter-cli.test.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: viteplus-config-consumers-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/differential/viteplus-formatter-settings
          if-no-files-found: error
          retention-days: 14
  published-contracts:
    if: github.event_name == 'pull_request' || inputs.mode == 'published-startup-75-76'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: 26.12.1, package-manager-cache: false }
      - name: Check the closed installed role without installing or executing product packages
        run: node --test tests/tooling/release/published-vite-startup.test.ts
  published-startup:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'published-startup-75-76'
    needs: published-contracts
    permissions: { contents: read, actions: read }
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: 26.12.1, package-manager-cache: false }
      - name: Provision the explicit manager separately from original pnpm install
        run: npm install --prefix "$RUNNER_TEMP/vite-startup-manager" pnpm@12.16.1 --ignore-scripts --no-audit --no-fund
      - name: Retain original and derived installed public build results before assessment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STARTUP_VERSION: ${{ inputs.version }}
          STARTUP_AUTHORITY: ${{ inputs.authority-blob }}
        run: node tools/support/release/verify_published/vite_startup.ts "$STARTUP_VERSION" "$STARTUP_AUTHORITY" "$RUNNER_TEMP/vite-startup-manager/node_modules/pnpm"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: published-vite-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vite-startup-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
