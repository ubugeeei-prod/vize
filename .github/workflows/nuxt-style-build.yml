name: Nuxt scoped style build
on:
  pull_request:
    branches: [main, davinci]
  push:
    branches: [main, davinci]
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuxt-style-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  nuxt-style-build:
    name: Nuxt 4 scoped CSS build and SSR
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install workspace tooling
        run: vp install --frozen-lockfile --prefer-offline
      - name: Build the candidate JavaScript adapter
        working-directory: npm/builder/vite
        run: vp pack
      - name: Install the exact published Nuxt reproduction
        working-directory: tests/_fixtures/_projects/nuxt-scoped-style-build
        run: npm ci --no-audit --no-fund
      - name: Verify released failure and candidate build and scoped SSR CSS
        run: vp exec node tools/support/compat/nuxt/style-build.mjs "$RUNNER_TEMP/nuxt-style-proof"
      - name: Upload build and SSR evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuxt-style-proof-${{ github.sha }}
          path: ${{ runner.temp }}/nuxt-style-proof
          if-no-files-found: ignore
