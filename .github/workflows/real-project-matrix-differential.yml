name: Real Project Matrix differential
# Writes one shared-format result per product from each completed full Real
# Project Matrix run on main (#6891). Scoped diagnostics cover one project.

on:
  workflow_run:
    workflows:
      - Real Project Matrix
    types:
      - completed
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: read
  contents: read

jobs:
  results:
    name: per-product differential results
    if: ${{ !contains(github.event.workflow_run.display_title, 'scoped-diagnostic') }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: "package.json", package-manager-cache: false }
      - name: Download shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: real-project-matrix-*
          path: real-project-shards
      - name: Download canonical DOM corpus evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: real-project-davinci-dom-corpus
          path: dom-corpus
      - name: Download canonical SSR corpus evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: canonical-corpus-ssr-pug-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-${{ github.event.workflow_run.head_sha }}
          path: ssr-corpus
      - name: Write per-product results and acceptance
        env:
          SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: >-
          node tests/differential/real-project.ts
          real-project-shards real-project-differential dom-corpus ssr-corpus
      - name: Upload per-product results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-project-differential
          path: real-project-differential
          if-no-files-found: error
          retention-days: 30
