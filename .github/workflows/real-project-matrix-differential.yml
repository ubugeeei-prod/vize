# DO NOT EDIT. Generated from tools/config/pkl/workflows/checks/real-project-matrix-differential.pkl.
# Edit the Pkl source and run `node tools/commands/generate/repository-config.ts`.
name: Real Project Matrix differential
# Writes one shared-format result per product from each completed full Real
# Project Matrix run on main (#6891), then publishes the native-only acceptance
# census and zero-fallback verdict over it (#6853, #6854). Scoped diagnostics
# cover one project. A dispatch republishes an earlier full matrix run.

on:
  workflow_run:
    workflows:
      - Real Project Matrix
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      matrix_run_id:
        description: Completed full Real Project Matrix run on main to publish
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: read
  contents: read

jobs:
  results:
    name: per-product differential results
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.workflow_run.display_title, 'scoped-diagnostic') }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /tools/ci/lib/scripts/
            /.github/scripts/workflows/real-project-matrix-differential/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - name: Resolve the matrix run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.matrix_run_id || github.event.workflow_run.id }}
        run: . "${{ env.VIZE_CI_FILES }}/resolve-the-matrix-run.sh"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.run.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: "package.json", package-manager-cache: false }
      - name: Download shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          pattern: real-project-matrix-*
          path: real-project-shards
      - name: Download canonical DOM corpus evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          name: real-project-davinci-dom-corpus
          path: dom-corpus
      - name: Download canonical SSR corpus evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          name: canonical-corpus-ssr-pug-${{ steps.run.outputs.id }}-${{ steps.run.outputs.attempt }}-${{ steps.run.outputs.sha }}
          path: ssr-corpus
      - name: Write per-product results and acceptance
        env:
          SOURCE_REVISION: ${{ steps.run.outputs.sha }}
        run: >-
          node tests/differential/real-project.ts
          real-project-shards real-project-differential dom-corpus ssr-corpus
      # The census tool and policy come from this workflow's revision, so a
      # matrix run that predates the tool can still be published.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          path: census-tool
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /tests/differential/
            /docs/davinci/plan/deletion-readiness-policy.json
      - name: Publish native-only acceptance and zero-fallback census
        run: >-
          node census-tool/tests/differential/native-acceptance.ts
          --out real-project-differential/acceptance real-project-differential
      - name: Upload per-product results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-project-differential
          path: real-project-differential
          if-no-files-found: error
          retention-days: 30
