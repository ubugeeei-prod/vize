name: Canonical corpus objects
# Seeds the immutable fixture object cache that the PR and queue canonical
# observers restore. Only trusted default-branch runs write it; pull requests
# and merge groups only read it (exact pins first, then the same .gitmodules
# prefix) and still verify every checked-out byte against the committed tree.
on:
  push:
    branches: [main]
    paths:
      - .gitmodules
      - "tests/_fixtures/_git/**"
      - .github/workflows/canonical-corpus-objects.yml
  schedule:
    # Daily, so the entry is never evicted as unused.
    - cron: "41 2 * * *"
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: canonical-corpus-objects-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  seed:
    name: Seed canonical fixture objects
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false, ref: "${{ github.sha }}" }
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: "package.json", package-manager-cache: false }
      - name: Plan canonical corpus identity
        id: corpus-plan
        run: node tools/support/compat/github/canonical-corpus-observer.mjs plan
      - name: Require a trusted cache writer
        if: ${{ steps.corpus-plan.outputs.cache-trusted != 'true' }}
        run: echo 'Only trusted default-branch runs seed canonical fixture objects.' >&2; exit 1
      - name: Cache immutable trusted fixture objects
        id: objects
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .git/modules/tests/_fixtures/_git
          key: ${{ steps.corpus-plan.outputs.cache-key }}
          restore-keys: ${{ steps.corpus-plan.outputs.cache-restore-key }}
      - name: Fetch pinned fixture objects
        if: ${{ steps.objects.outputs.cache-hit != 'true' }}
        run: git submodule update --init --checkout --depth 1 --jobs 32 -- tests/_fixtures/_git
