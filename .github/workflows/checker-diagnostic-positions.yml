name: Checker diagnostic positions
on:
  pull_request:
    paths:
      - ".github/workflows/checker-diagnostic-positions.yml"
      - ".github/scripts/workflows/checker-diagnostic-positions/**"
      - "davinci/vize_l0/Cargo.toml"
      - "davinci/vize_l0/src/line_index.rs"
      - "davinci/vize_l0/src/line_index/**"
      - "davinci/vize_l4/Cargo.toml"
      - "davinci/vize_l4/src/targets/ts.rs"
      - "davinci/vize_l4/src/targets/ts/**"
      - "davinci/vize_l4/src/framework/vue.rs"
      - "davinci/vize_l4/src/framework/vue/**"
      - "davinci/vize_l4/tests/program_projection/**"
      - "davinci/vize_l4/tests/vue_projection/**"
      - "davinci/vize_l4/tests/jsx_module_projection/**"
permissions: { contents: read }
concurrency:
  group: checker-diagnostic-positions-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  diagnostic-positions:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "24"
      CARGO_INCREMENTAL: "0"
      RUSTUP_TOOLCHAIN: "1.100.0"
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/checker-diagnostic-positions/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false }
      - uses: ./.github/actions/cache-vp-bootstrap
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          version: latest
          node-version-file: package.json
          cache: true
          cache-save: false
          run-install: false
      - name: Install the pinned checker used by the original projection suites
        run: node tools/support/github/vp-install.ts --filter vize-workspace --filter './npm/ui...' --filter './npm/cli'
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.100.0", components: clippy }
      - uses: ./.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - name: Compare complete original projection outcomes and repeated queries
        run: . "${{ env.VIZE_CI_FILES }}/compare-complete-original-projection-outcomes-and-repeated-queries.sh"
