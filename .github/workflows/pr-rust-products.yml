name: Rust product checks
on:
  workflow_call:
    inputs:
      run-rust:
        type: boolean
        required: true
      rust-plan:
        type: string
        required: true
      product-qualification:
        type: string
        required: false
        default: ""
      release-qualification:
        type: string
        required: false
        default: ""
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # PR and queue cohorts build the same affected test binaries from the warm
  # read-only `nextest-ci` clone and start beside Clippy, instead of waiting
  # for one serial build and moving a multi-GB archive.
  pr-rust-shard:
    permissions: { contents: read, actions: read }
    name: Rust tests (${{ matrix.name }})
    if: ${{ inputs.run-rust && inputs.product-qualification == '' }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.rust-plan).testMatrix }}
    env:
      CARGO_BUILD_JOBS: "24"
      VIZE_NUXT_CONFIG_ITERATIONS: "100"
      RUST_TEST_THREADS: "4"
      NEXTEST_PROFILE: ${{ github.event_name == 'merge_group' && 'full' || 'pr' }}
      VIZE_TEMPLATE_EMIT_TS40_CAPTURE: ${{ github.workspace }}/target/nextest/${{ github.event_name == 'merge_group' && 'full' || 'pr' }}/template-emit-ts40-projection
      COHORT: ${{ matrix.cohort }}
      NEXTEST_FILTER: ${{ matrix.filter }}
      RUST_PLAN_JSON: ${{ inputs.rust-plan }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.99.1"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: nextest-ci
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/cache-vp-bootstrap
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: latest
          node-version-file: "package.json"
          cache: true
          cache-save: false
          run-install: true
      - uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        with:
          tool: cargo-nextest@0.9.146
      - name: Test complete Inspector production and descriptor oracles
        if: ${{ matrix.cohort == 'cli-and-integrations' && contains(fromJSON(inputs.rust-plan).packages, 'vize') }}
        run: >-
          node --test tests/tooling/inspector-production-mode.test.ts
          tests/tooling/inspector-ssr-css-vars.test.ts
      - name: Test canonical native content classification
        if: ${{ matrix.cohort == 'lint-and-format' && contains(fromJSON(inputs.rust-plan).packages, 'vize_patina') }}
        run: node --test tests/tooling/patina-native-svg-content-oracle.test.ts
      - name: Select Rust runtime envelope
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) printf 'VIZE_TEST_DISABLE_TSGO=1\n' >> "$GITHUB_ENV" ;;
            merge_group) printf 'VIZE_TEST_REQUIRE_TSGO=1\n' >> "$GITHUB_ENV" ;;
            *) exit 1 ;;
          esac
      - name: Install Pkl CLI
        run: npm install --global @pkl-community/pkl@0.27.2
      - name: Hydrate the required ElementPlus projection fixture
        if: ${{ github.event_name == 'merge_group' && contains(fromJSON(inputs.rust-plan).packages, 'vize_canon') }}
        uses: ./.github/actions/hydrate-pinned-fixture
        with: { fixture: tests/_fixtures/_git/element-plus }
      - name: Build and run the affected Rust test cohort
        # Preserve affected package feature unification; the shared cohort
        # registry partitions test binaries by their actual product surface.
        run: |
          node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/rust-plan.json", process.env.RUST_PLAN_JSON)'
          evidence="$RUNNER_TEMP/rust-build-evidence"
          node tools/support/compat/github/rust-build-evidence.ts before "$evidence"
          set -o pipefail
          phase_started=$SECONDS
          if node tools/support/compat/github/run-affected-rust.ts "$RUNNER_TEMP/rust-plan.json" cargo nextest run @packages@ --cargo-profile ci --timings --cargo-message-format=json-render-diagnostics --profile "$NEXTEST_PROFILE" -E "$NEXTEST_FILTER" --no-tests=pass | tee "$evidence/cargo.jsonl"; then phase_exit=0; else phase_exit=$?; fi
          mkdir -p "target/nextest/$NEXTEST_PROFILE"
          printf '{"phase":"workspace-cohort","cohort":"%s","elapsed_seconds":%d,"exit_code":%d}\n' "$COHORT" "$((SECONDS - phase_started))" "$phase_exit" > "target/nextest/$NEXTEST_PROFILE/timing.json"
          exit "$phase_exit"
      - name: Preserve actual Rust build units and fresh timing HTML
        if: ${{ always() }}
        run: node tools/support/compat/github/rust-build-evidence.ts collect "$RUNNER_TEMP/rust-build-evidence"
      - name: Upload Rust build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-build-evidence-${{ matrix.cohort }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/rust-build-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Upload Rust cohort results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-test-cohort-${{ matrix.cohort }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/nextest/${{ env.NEXTEST_PROFILE }}/
          if-no-files-found: error
          retention-days: 7

  rust-product-report:
    name: Rust product report
    permissions: { contents: read, actions: read, pull-requests: read }
    # A superseded run reports nothing: its required check fails in test-report.
    if: ${{ always() && !contains(needs.*.result, 'cancelled') }}
    needs: [pr-rust-shard]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/cache-vp-bootstrap
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          run-install: false
      - name: Require the complete Rust tier
        env:
          RUN_RUST: ${{ inputs.run-rust }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          PRODUCT_QUALIFICATION: ${{ inputs.product-qualification }}
          RELEASE_QUALIFICATION: ${{ inputs.release-qualification }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/support/compat/github/require-rust-tier.ts --products
