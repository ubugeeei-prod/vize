name: LSP native diagnostic coverage
on:
  pull_request:
    paths:
      - ".github/workflows/lsp-native-diagnostic-coverage.yml"
      - "tests/tooling/lsp-diagnostic-capacity*.test.ts"
      - "tests/tooling/support/lsp/diagnostic-capacity*.ts"
      - "crates/vize_maestro/src/server/initial_diagnostics/**"
      - "crates/vize_maestro/src/server/initial_diagnostics.rs"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lsp-native-diagnostic-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  coverage:
    name: Every one of 129 independent native diagnostics and repairs
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      VIZE_TEST_REQUIRE_TSGO: "1"
      VIZE_LSP_REQUIRE_SOURCE_BUILD: "1"
      VIZE_TRACE_EDITOR_PREPARATION: "1"
      VIZE_CAPACITY_FILES: "129"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile --prefer-offline
      - run: rustup toolchain install || rustup show active-toolchain
      - name: Verify exact token, version, UTF16 and duplicate controls
        run: vp exec node --test tests/tooling/lsp-diagnostic-capacity-oracle.test.ts
      - name: Build the exact source once in its own target
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          target_dir="$RUNNER_TEMP/diagnostic-capacity-$SOURCE_SHA"
          test ! -e "$target_dir"
          export CARGO_TARGET_DIR="$target_dir"
          cargo build --locked --profile ci -p vize
          mkdir -p target/ci
          cp "$target_dir/ci/vize" target/ci/vize
          vp exec node tests/differential/build-receipt.ts
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
          echo "VIZE_LSP_BIN=$GITHUB_WORKSPACE/target/ci/vize" >> "$GITHUB_ENV"
      - name: Preserve scheduler/version/cancellation laws
        run: >-
          cargo test --locked --profile ci -p vize_maestro --lib server::initial_diagnostics::
      - name: Observe all native errors, complete repairs and checked idle
        env:
          CORSA_PATH: ${{ github.workspace }}/node_modules/@typescript/typescript-linux-x64/lib/tsc
        run: vp exec node --test --test-concurrency=1 tests/tooling/lsp-diagnostic-capacity.test.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: lsp-native-diagnostic-coverage-${{ github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/ci/vize.differential-build.json
            target/vize-tests/diagnostic-capacity-129/
            target/differential/lsp-sessions/
          if-no-files-found: error
          retention-days: 30
