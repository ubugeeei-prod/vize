name: Versioned diagnostic fix publication
on:
  pull_request:
    paths:
      - ".github/workflows/versioned-fix-publication.yml"
      - ".github/scripts/workflows/versioned-fix-publication/**"
      - "davinci/vize_l0/Cargo.toml"
      - "davinci/vize_l0/src/line_index*"
      - "davinci/vize_l0/src/line_index/**"
      - "davinci/vize_l1/Cargo.toml"
      - "davinci/vize_l1/src/edit.rs"
      - "davinci/vize_l1/src/edit/**"
      - "crates/vize_maestro/Cargo.toml"
      - "crates/vize_maestro/src/document/store*"
      - "crates/vize_maestro/src/document/store/**"
      - "crates/vize_maestro/src/source_project.rs"
      - "crates/vize_maestro/src/source_project/edit*"
      - "crates/vize_maestro/src/source_project/positioned.rs"
      - "crates/vize_maestro/src/source_project/positioned/**"
      - "crates/vize_maestro/src/source_project/snapshot.rs"
      - "crates/vize_maestro/tests/versioned_fix_publication/**"
      - "crates/vize_patina/tests/fixtures/issue-7905*/**"
      - "tests/_fixtures/differential/linter/lint-fix-passes-7906/**"
permissions: { contents: read }
concurrency:
  group: versioned-fix-publication-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  versioned-edits:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "24"
      CARGO_INCREMENTAL: "0"
      RUSTUP_TOOLCHAIN: "1.100.0"
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/versioned-fix-publication/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.100.0", components: clippy }
      - uses: ./.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - name: Compare complete editor changes and every resulting authored byte
        run: . "${{ env.VIZE_CI_FILES }}/compare-complete-editor-changes-and-every-resulting-authored-byte.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: versioned-edit-times-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/versioned-edit-times
          if-no-files-found: warn
          retention-days: 7
