name: PR source checks
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pr-source-plan:
    name: Plan PR source checks
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      js: ${{ steps.plan.outputs.js }}
      tooling: ${{ steps.plan.outputs.tooling }}
      playground: ${{ steps.plan.outputs.playground }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Fetch comparison base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [[ ! "$BASE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
      - name: Plan source checks
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node tools/support/compat/github/plan-source-checks.mjs "$BASE_SHA" "$GITHUB_SHA" "$GITHUB_EVENT_NAME"

  pr-rust-source:
    name: PR Rust Clippy, tests, and fixtures
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    needs: pr-source-plan
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: ${{ github.event_name == 'merge_group' && 45 || 35 }}
    env:
      CARGO_BUILD_JOBS: "12"
      RUST_TEST_THREADS: "4"
      VIZE_NUXT_CONFIG_ITERATIONS: "100"
    steps:
      - name: Explain documentation-only skip
        if: ${{ needs.pr-source-plan.outputs.rust != 'true' }}
        run: echo 'Rust Clippy and tests skipped because this PR changes no Rust or unknown source paths.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ needs.pr-source-plan.outputs.rust == 'true' }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: ${{ needs.pr-source-plan.outputs.rust == 'true' }}
        with:
          components: clippy
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        if: ${{ needs.pr-source-plan.outputs.rust == 'true' }}
        with:
          wild-version: "0.9.0"
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        if: ${{ needs.pr-source-plan.outputs.rust == 'true' }}
        with:
          node-version-file: "package.json"
          cache: true
          run-install: true
      - uses: ./.github/actions/setup-rust-sticky-cache
        if: ${{ needs.pr-source-plan.outputs.rust == 'true' }}
        with:
          cache-key-prefix: ${{ github.event_name == 'pull_request' && format('pr-{0}-', github.event.pull_request.number) || format('merge-{0}-', github.sha) }}
          key: clippy-test
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
        if: ${{ needs.pr-source-plan.outputs.rust == 'true' }}
      - name: Clippy
        if: ${{ needs.pr-source-plan.outputs.rust == 'true' }}
        run: cargo clippy --workspace -- -D warnings -D clippy::wildcard_imports
      - name: Install Pkl CLI
        if: ${{ needs.pr-source-plan.outputs.rust == 'true' }}
        run: npm install --global @pkl-community/pkl@0.27.2
      - name: Build Rust workspace tests
        id: rust-test-build
        if: ${{ needs.pr-source-plan.outputs.rust == 'true' }}
        env: { VIZE_TEST_REQUIRE_TSGO: "1" }
        run: |
          timing_dir="$RUNNER_TEMP/rust-test-timings"
          mkdir -p "$timing_dir"
          rm -f target/cargo-timings/cargo-timing.html
          touch "$timing_dir/build-started"
          phase_started=$SECONDS
          if cargo test --workspace --no-run --timings; then phase_exit=0; else phase_exit=$?; fi
          printf '{"phase":"build","elapsed_seconds":%d,"exit_code":%d}\n' "$((SECONDS - phase_started))" "$phase_exit" > "$timing_dir/build.json"
          exit "$phase_exit"
      - name: Run Rust workspace tests
        id: rust-test-run
        if: ${{ needs.pr-source-plan.outputs.rust == 'true' }}
        env: { VIZE_TEST_REQUIRE_TSGO: "1" }
        run: |
          phase_started=$SECONDS
          if cargo test --workspace; then phase_exit=0; else phase_exit=$?; fi
          printf '{"phase":"execution-and-doctests","elapsed_seconds":%d,"exit_code":%d}\n' "$((SECONDS - phase_started))" "$phase_exit" > "$RUNNER_TEMP/rust-test-timings/run.json"
          exit "$phase_exit"
      - name: Test merge queue differential corpora
        if: ${{ github.event_name == 'merge_group' && needs.pr-source-plan.outputs.rust == 'true' }}
        uses: ./.github/actions/test-rust-workspace-differential
        with:
          workspace-already-tested: "true"
      - name: Check fixture coverage
        if: ${{ needs.pr-source-plan.outputs.rust == 'true' }}
        run: rust-script tools/commands/ci/github/write-coverage-summary.rs
      - name: Summarize Rust test timing evidence
        if: ${{ always() && needs.pr-source-plan.outputs.rust == 'true' }}
        env:
          BUILD_OUTCOME: ${{ steps.rust-test-build.outcome }}
          RUN_OUTCOME: ${{ steps.rust-test-run.outcome }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          CACHE_NAMESPACE: ${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}-', github.event.pull_request.number) || format('merge-{0}-', github.sha) }}clippy-test-target-${{ runner.os }}-${{ runner.arch }}
        run: node tools/support/compat/github/rust-test-timings.mjs
      - name: Upload Rust test timing evidence
        if: ${{ always() && needs.pr-source-plan.outputs.rust == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-test-timings-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/rust-test-timings/
          if-no-files-found: error
          retention-days: 14

  pr-js-packages:
    name: PR JS package build and tests
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    needs: pr-source-plan
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 35
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
      CARGO_BUILD_JOBS: "12"
    steps:
      - name: Explain documentation-only skip
        if: ${{ needs.pr-source-plan.outputs.js != 'true' }}
        run: echo 'JS package checks skipped because this PR changes no package, compiler, or unknown source paths.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ needs.pr-source-plan.outputs.js == 'true' }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        if: ${{ needs.pr-source-plan.outputs.js == 'true' }}
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - uses: ./.github/actions/setup-moonbit
        if: ${{ needs.pr-source-plan.outputs.js == 'true' }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: ${{ needs.pr-source-plan.outputs.js == 'true' }}
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        if: ${{ needs.pr-source-plan.outputs.js == 'true' }}
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        if: ${{ needs.pr-source-plan.outputs.js == 'true' }}
        with:
          cache-key-prefix: ${{ github.event_name == 'pull_request' && format('pr-{0}-', github.event.pull_request.number) || format('merge-{0}-', github.sha) }}
          key: test-js-packages
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Install JS dependencies
        if: ${{ needs.pr-source-plan.outputs.js == 'true' }}
        run: vp install --frozen-lockfile --prefer-offline
      - name: Test JS packages
        if: ${{ needs.pr-source-plan.outputs.js == 'true' }}
        run: vp run --workspace-root test:js
      - name: Check Fresco native declarations and consumer types
        if: ${{ needs.pr-source-plan.outputs.js == 'true' }}
        run: vp run --filter './npm/fresco-native' check:generated && vp run --filter './npm/fresco-native' check:types
      - name: Check UI package conformance in merge queue
        if: ${{ github.event_name == 'merge_group' && needs.pr-source-plan.outputs.js == 'true' }}
        run: vp run --filter './npm/native' build:ci && vp run --filter './npm/ui' check

  pr-tooling-scripts:
    name: PR tooling scripts
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    needs: pr-source-plan
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 35
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
      CARGO_BUILD_JOBS: "12"
    steps:
      - name: Explain unrelated skip
        if: ${{ needs.pr-source-plan.outputs.tooling != 'true' }}
        run: echo 'Tooling scripts skipped because this PR changes no release scripts, tooling tests, or unknown source paths.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ needs.pr-source-plan.outputs.tooling == 'true' }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        if: ${{ needs.pr-source-plan.outputs.tooling == 'true' }}
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - uses: ./.github/actions/setup-moonbit
        if: ${{ needs.pr-source-plan.outputs.tooling == 'true' }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: ${{ needs.pr-source-plan.outputs.tooling == 'true' }}
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        if: ${{ needs.pr-source-plan.outputs.tooling == 'true' }}
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        if: ${{ needs.pr-source-plan.outputs.tooling == 'true' }}
        with:
          cache-key-prefix: ${{ github.event_name == 'pull_request' && format('pr-{0}-', github.event.pull_request.number) || format('merge-{0}-', github.sha) }}
          key: test-scripts
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
        if: ${{ needs.pr-source-plan.outputs.tooling == 'true' }}
      - name: Install fixture and JS dependencies
        if: ${{ needs.pr-source-plan.outputs.tooling == 'true' }}
        run: git submodule update --init --force --depth 1 -- tests/_fixtures/_git/ant-design-vue tests/_fixtures/_git/create-vue tests/_fixtures/_git/vue-select && vp install --frozen-lockfile --prefer-offline
      - name: Build and install vize CLI
        if: ${{ needs.pr-source-plan.outputs.tooling == 'true' }}
        run: cargo build --profile ci -p vize && vp exec node tests/differential/build-receipt.mjs && sudo install -m 0755 target/ci/vize /usr/local/bin/vize
      - name: Prepare the pinned plugin isolation runtime
        if: ${{ needs.pr-source-plan.outputs.tooling == 'true' }}
        run: vp exec node tools/support/compat/davinci/plugin-sandbox-image.mjs
      - name: Test tooling scripts
        if: ${{ needs.pr-source-plan.outputs.tooling == 'true' }}
        run: vp run --workspace-root test:scripts

  pr-playground-test:
    name: PR playground browser tests
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    needs: pr-source-plan
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "12"
      RUN_PLAYGROUND: ${{ needs.pr-source-plan.outputs.playground }}
    steps:
      - name: Explain unrelated skip
        if: ${{ env.RUN_PLAYGROUND != 'true' }}
        run: echo 'Playground browser tests skipped because this PR changes no compiler, Vite, or playground source paths.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ env.RUN_PLAYGROUND == 'true' }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: ${{ env.RUN_PLAYGROUND == 'true' }}
        with:
          targets: wasm32-unknown-unknown
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        if: ${{ env.RUN_PLAYGROUND == 'true' }}
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-moonbit
        if: ${{ env.RUN_PLAYGROUND == 'true' }}
      - uses: ./.github/actions/setup-rust-sticky-cache
        if: ${{ env.RUN_PLAYGROUND == 'true' }}
        with:
          cache-key-prefix: ${{ github.event_name == 'pull_request' && format('pr-{0}-', github.event.pull_request.number) || format('merge-{0}-', github.sha) }}
          key: playground-test
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
        if: ${{ env.RUN_PLAYGROUND == 'true' }}
      - name: Cache WASM build
        if: ${{ env.RUN_PLAYGROUND == 'true' }}
        id: cache-wasm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: playground/src/wasm/vize_vitrine*
          key: ${{ runner.os }}-wasm-v2-${{ hashFiles('crates/**/*.rs', 'crates/**/Cargo.toml', 'Cargo.toml', 'Cargo.lock', 'tools/moon/cmd/github/build_vitrine_wasm/**') }}
      - name: Install wasm-bindgen-cli
        if: ${{ env.RUN_PLAYGROUND == 'true' && steps.cache-wasm.outputs.cache-hit != 'true' }}
        uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        with:
          tool: wasm-bindgen-cli@0.2.127
      - name: Build WASM
        if: ${{ env.RUN_PLAYGROUND == 'true' && steps.cache-wasm.outputs.cache-hit != 'true' }}
        run: moon run --target native tools/moon/cmd/github/build_vitrine_wasm -- playground/src/wasm
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        if: ${{ env.RUN_PLAYGROUND == 'true' }}
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - name: Install JS dependencies
        if: ${{ env.RUN_PLAYGROUND == 'true' }}
        run: vp install --frozen-lockfile --prefer-offline
      - name: Build playground dependencies
        if: ${{ env.RUN_PLAYGROUND == 'true' }}
        run: vp run --filter './npm/native' build:ci && vp run --workspace-root build:packages
      - name: Cache Playwright browsers
        if: ${{ env.RUN_PLAYGROUND == 'true' }}
        id: cache-playwright
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: ${{ env.RUN_PLAYGROUND == 'true' && steps.cache-playwright.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/install-playwright-browsers
      - name: Run playground tests
        if: ${{ env.RUN_PLAYGROUND == 'true' }}
        run: vp run --filter './playground' test:browser
      - name: Run VRT
        if: ${{ env.RUN_PLAYGROUND == 'true' }}
        run: vp run --filter './playground' test:vrt
        continue-on-error: true
        id: vrt
      - name: Upload VRT report
        if: ${{ env.RUN_PLAYGROUND == 'true' && steps.vrt.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-playground-vrt-report
          path: playground/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload VRT diff artifacts
        if: ${{ env.RUN_PLAYGROUND == 'true' && steps.vrt.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-vrt-diff
          path: playground/e2e/vrt/test-results/
          retention-days: 7
      - name: Fail if VRT failed
        if: ${{ env.RUN_PLAYGROUND == 'true' && steps.vrt.outcome == 'failure' }}
        run: exit 1

  source-report:
    name: PR source report
    if: ${{ always() }}
    needs:
      - pr-source-plan
      - pr-rust-source
      - pr-js-packages
      - pr-tooling-scripts
      - pr-playground-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Require every source gate to succeed
        env: { NEEDS_JSON: "${{ toJSON(needs) }}" }
        run: node tools/support/compat/github/require-needs-success.mjs
