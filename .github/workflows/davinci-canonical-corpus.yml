name: Canonical Davinci corpus
on:
  workflow_call:
    inputs:
      davinci_dom_corpus_mode:
        type: string
        required: false
        default: "enforce"
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  davinci-dom-corpus:
    name: s2 dom corpus
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 120
    env:
      VIZE_DAVINCI_DOM_CORPUS_MODE: ${{ inputs.davinci_dom_corpus_mode || 'enforce' }}
    steps:
      - name: Checkout matrix commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: ./.github/actions/setup-rust-script
      - name: Setup Wild linker
        uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with: { key: davinci-dom-corpus, cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}" }
      - name: Select and hydrate full fixture corpus
        run: rust-script tools/commands/fixtures/davinci-dom-corpus-workflow.rs hydrate
      - name: Run L2 DOM differential corpus
        id: davinci_dom_corpus
        continue-on-error: true
        run: rust-script tools/commands/fixtures/davinci-dom-corpus-workflow.rs run
      - name: Run L4 SSR and pug L1 differential corpora
        run: VIZE_DAVINCI_DIFFERENTIAL_CORPUS=tests/_fixtures/_git cargo test -p vize_atelier_ssr --features legacy-differential --test davinci_ssr_corpus -- --nocapture && VIZE_DAVINCI_DIFFERENTIAL_CORPUS=tests/_fixtures/_git cargo test -p vize_l1_to_l2 --features legacy-differential --test davinci_pug_corpus -- --nocapture
      - name: Measure Davinci production reach on the hydrated corpus
        run: VIZE_DAVINCI_DIFFERENTIAL_CORPUS=tests/_fixtures/_git cargo test -p vize_atelier_sfc --features legacy-dom-differential --test davinci_production_reach -- --nocapture
      - name: Finalize L2 DOM corpus evidence
        if: ${{ always() }}
        env:
          VIZE_DAVINCI_DOM_CORPUS_OUTCOME: ${{ steps.davinci_dom_corpus.outcome }}
        run: rust-script tools/commands/fixtures/davinci-dom-corpus-workflow.rs finalize-and-dehydrate
      - name: Upload L2 DOM corpus evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-project-davinci-dom-corpus
          path: real-project-davinci-dom-corpus
          if-no-files-found: error
          retention-days: 30
