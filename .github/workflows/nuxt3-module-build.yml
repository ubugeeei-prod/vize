name: Nuxt 3 module build
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/nuxt3-module-build.yml
      - npm/framework/nuxt/**
      - npm/framework/nuxt-lint-config/**
      - npm/oxlint/**
      - npm/builder/vite/**
      - tools/support/compat/nuxt/fixtures/nuxt3-module-build/**
      - tools/support/compat/nuxt/nuxt3-module-build.mjs
      - tools/support/compat/nuxt/source-binding*
      - tools/support/compat/nuxt/prefetch-manifest-*
      - tools/support/compat/nuxt/lint-config-*
      - tools/support/compat/nuxt/compiler-defaults-*
      - tests/_fixtures/differential/compiler/nuxt-compiler-defaults/**
      - tests/tooling/nuxt-compiler-defaults.test.mjs
      - tests/_fixtures/differential/linter/nuxt-oxlint-config-root/**
      - tests/tooling/nuxt-oxlint-config-root.test.mjs
      - tools/support/compat/nuxt/fixtures/nuxt-prefetch-manifest/**
      - tests/_fixtures/differential/compiler/nuxt-prefetch-manifest/**
      - tests/tooling/nuxt-prefetch-manifest.test.mjs
      - tests/tooling/nuxt-source-binding.test.mjs
      - npm/native/**
      - crates/**
      - davinci/**
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
  push:
    branches: [main]
    paths:
      - .github/workflows/nuxt3-module-build.yml
      - npm/framework/nuxt/**
      - npm/framework/nuxt-lint-config/**
      - npm/oxlint/**
      - npm/builder/vite/**
      - tools/support/compat/nuxt/fixtures/nuxt3-module-build/**
      - tools/support/compat/nuxt/nuxt3-module-build.mjs
      - tools/support/compat/nuxt/source-binding*
      - tools/support/compat/nuxt/prefetch-manifest-*
      - tools/support/compat/nuxt/lint-config-*
      - tools/support/compat/nuxt/compiler-defaults-*
      - tests/_fixtures/differential/compiler/nuxt-compiler-defaults/**
      - tests/tooling/nuxt-compiler-defaults.test.mjs
      - tests/_fixtures/differential/linter/nuxt-oxlint-config-root/**
      - tests/tooling/nuxt-oxlint-config-root.test.mjs
      - tools/support/compat/nuxt/fixtures/nuxt-prefetch-manifest/**
      - tests/_fixtures/differential/compiler/nuxt-prefetch-manifest/**
      - tests/tooling/nuxt-prefetch-manifest.test.mjs
      - tests/tooling/nuxt-source-binding.test.mjs
      - npm/native/**
      - crates/**
      - davinci/**
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuxt3-module-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  nuxt3-module-build:
    name: Nuxt 3 build and SSR
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install workspace tooling
        run: vp install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/setup-moonbit
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.98.0"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: nuxt3-source-native
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      - name: Build and capture the actual source native compiler
        run: vp run --no-cache --filter './npm/native' build:debug
      - name: Build the candidate Vite adapter
        working-directory: npm/builder/vite
        run: vp pack
      - name: Build the candidate Nuxt lint preset
        working-directory: npm/framework/nuxt-lint-config
        run: vp pack
      - name: Build the candidate Oxlint bridge
        working-directory: npm/oxlint
        run: vp pack
      - name: Build the candidate Nuxt integration
        working-directory: npm/framework/nuxt
        run: vp pack
      - name: Verify inherited compiler option precedence
        run: vp env exec node --test npm/framework/nuxt/src/compiler-defaults.test.ts
      - name: Install the pinned Nuxt 3 reproduction
        working-directory: tools/support/compat/nuxt/fixtures/nuxt3-module-build
        run: npm ci --no-audit --no-fund
      - uses: ./.github/actions/setup-ubuntu-archive
      - name: Install Chromium
        working-directory: tests
        run: vize-ci-apt-retry vp exec playwright install --with-deps chromium
      - name: Verify candidate build and SSR routes
        run: vp env exec node tools/support/compat/nuxt/nuxt3-module-build.mjs "$RUNNER_TEMP/nuxt3-module-proof"
      - name: Install the unchanged pinned Nuxt 4 dependency cohort
        working-directory: tests/_fixtures/_projects/nuxt-critical-css-build
        run: npm ci --no-audit --no-fund
      - name: Verify original SPA manifest and physical prefetch with the source compiler
        run: vp env exec node tools/support/compat/nuxt/prefetch-manifest-build.mjs "$RUNNER_TEMP/nuxt-prefetch-proof"
      - name: Verify original Nuxt lint configuration with the source linter
        run: vp env exec node tools/support/compat/nuxt/lint-config-build.mjs "$RUNNER_TEMP/nuxt-lint-config-proof" "$RUNNER_TEMP/nuxt3-module-proof/source-native/custody.json"
      - name: Verify original Nuxt scoped compiler defaults and whole rendered outputs
        run: vp env exec node tools/support/compat/nuxt/compiler-defaults-build.mjs "$RUNNER_TEMP/nuxt-compiler-defaults-proof" "$RUNNER_TEMP/nuxt3-module-proof/source-native/custody.json"
      - name: Upload Nuxt 3 build and SSR evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuxt3-module-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nuxt3-module-proof
            ${{ runner.temp }}/nuxt-prefetch-proof
            ${{ runner.temp }}/nuxt-lint-config-proof
            ${{ runner.temp }}/nuxt-compiler-defaults-proof
          if-no-files-found: ignore
