name: Composable provide public before
run-name: Public 0.602 composable provide before @ ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: composable-provide-before-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-before:
    name: Public package whole packets and actual Vue runtime origins
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.6.0"
      - name: Install only independently published public providers
        shell: bash
        env:
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          workspace="${RUNNER_TEMP}/public-10914-${GITHUB_RUN_ID}"
          mkdir -p "$workspace" "${RUNNER_TEMP}/proof-10914"
          node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({private:true,name:"public-composable-before",version:"0.0.0"}))' "$workspace/package.json"
          npm install --prefix "$workspace" --ignore-scripts --save-exact vize@0.602.0 @vizejs/native@0.602.0 vue@3.5.43 typescript@6.0.3
      - name: Preserve every public CLI native and independent runtime packet
        shell: bash
        env:
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          node tools/support/release/composable-provide-before.ts \
            "${RUNNER_TEMP}/public-10914-${GITHUB_RUN_ID}" \
            "${RUNNER_TEMP}/proof-10914" \
            "${GITHUB_WORKSPACE}/tools/support/release/composable-provide-before.json"
      - name: Retain all complete before packets and provider identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: composable-provide-public-before-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof-10914
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
