name: Native image-alt query source evidence

on:
  pull_request:
    paths:
      - "crates/vize_patina/src/attribute_policy/**"
      - "crates/vize_patina/src/native/img_alt.rs"
      - "crates/vize_patina/src/native/canonical.rs"
      - "crates/vize_patina/src/native/canonical/**"
      - "crates/vize_patina/src/native/tabindex_no_positive.rs"
      - "crates/vize_patina/tests/canonical_rule_group/**"
      - "crates/vize_patina/Cargo.toml"
      - "davinci/vize_l2/Cargo.toml"
      - "davinci/vize_l2/src/artifact.rs"
      - "davinci/vize_l2/src/walk.rs"
      - "davinci/vize_l2/src/walk/**"
      - "crates/vize_patina/examples/native_image_alt_*.rs"
      - "crates/vize_patina/examples/image_alt_measurement/**"
      - ".github/workflows/native-image-alt-query.yml"
      - ".github/scripts/workflows/native-image-alt-query/**"

permissions: { contents: read }
concurrency:
  group: native-image-alt-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-evidence:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "24"
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: ""
      RUSTC_WORKSPACE_WRAPPER: ""
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUSTUP_TOOLCHAIN: "1.100.0"
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/native-image-alt-query/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          {
            ref: "${{ github.event.pull_request.head.sha }}",
            fetch-depth: 0,
            persist-credentials: false,
          }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version-file: "package.json", package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.100.0", components: clippy }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: native-image-alt-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Build immutable source observers before measuring
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/build-immutable-source-observers-before-measuring.sh"
      - name: Observe original-owner before and after, then independent canonical phases
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/observe-original-owner-before-and-after-then-independent-canonical-phase.sh"
      - name: Require full original-owner packet equality and explicit phase custody
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/require-full-original-owner-packet-equality-and-explicit-phase-custody.sh"
      - name: Compare canonical accessibility diagnostics with the original rule pair
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/compare-canonical-accessibility-diagnostics-with-the-original-rule-pair.sh"
      - name: Compare the separately linked original public event and node consumer
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/compare-the-separately-linked-original-public-event-and-node-consumer.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-image-alt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-image-alt
          if-no-files-found: error
          retention-days: 7
