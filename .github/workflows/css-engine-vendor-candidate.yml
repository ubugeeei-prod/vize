name: CSS engine forks
on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "vendor/lightningcss/**"
      - "vendor/parcel_sourcemap/**"
      - ".github/workflows/css-engine-vendor-candidate.yml"
  workflow_dispatch:
permissions: { contents: read }
defaults:
  run: { shell: bash }
concurrency:
  group: css-vendor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "12"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The workspace test archive builds the vendored CSS engine forks with their
  # default features. This job runs their complete upstream suites with every
  # feature enabled, in both the debug-assertion and the release profile, when
  # the forks or the locked dependency graph change.
  engine:
    name: CSS engines (${{ matrix.profile }})
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: { profile: [dev, release] }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with: { toolchain: "1.99.0" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: engines-${{ matrix.profile }}
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Run the complete LightningCSS fork suite
        run: cargo test --locked -p vize_lightningcss --all-features --profile ${{ matrix.profile }} --lib --tests
      - name: Run the source-map fork archive contracts
        if: ${{ !cancelled() }}
        run: cargo test --locked -p vize_parcel_sourcemap --features json --profile ${{ matrix.profile }}
