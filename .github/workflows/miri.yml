name: Miri

on:
  push:
    branches: [main, davinci]
  pull_request:
    branches: [main, davinci]

concurrency:
  group: miri-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MIRIFLAGS: "-Zmiri-ignore-leaks"

jobs:
  miri:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # nightly
        with:
          toolchain: nightly
          components: miri,rust-src

      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: miri
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
          target-path: target/miri

      - name: Setup Miri
        run: cargo +nightly miri setup

      - name: Test VDOM transform with Miri
        run: cargo +nightly miri test -p vize_atelier_core --test scoped_slot_shadowing

      - name: Test DOM transform with Miri
        run: cargo +nightly miri test -p vize_atelier_dom --test setup_component_unref

      - name: Test SFC transform with Miri
        run: cargo +nightly miri test -p vize_atelier_sfc --test setup_component_unref --no-default-features

      # Davinci P1-11: the batch pool hands one arena to file after file, so a
      # value that outlived its compile would read recycled bytes. Miri is the
      # lane that reports that for real — it caught a Stacked Borrows violation
      # in the first draft of `Allocator::alloc_owned`.
      - name: Test the batch arena pool with Miri
        run: cargo +nightly miri test -p vize_carton --lib -- allocator pool

      - name: Test pooled SFC compiles with Miri
        run: cargo +nightly miri test -p vize_atelier_sfc --test davinci_arena_pool --no-default-features
