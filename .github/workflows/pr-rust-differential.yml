name: Required Rust differential checks
on:
  workflow_call:
    inputs:
      run-rust:
        type: boolean
        required: true
permissions: { contents: read }
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  differential:
    name: Rust feature corpora and fixture coverage
    if: ${{ github.event_name == 'merge_group' && inputs.run-rust }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "12"
      RUST_TEST_THREADS: "4"
      VIZE_NUXT_CONFIG_ITERATIONS: "100"
      VIZE_TEST_REQUIRE_TSGO: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          components: clippy
          toolchain: "1.99.0"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: true
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          cache-key-prefix: ${{ github.event_name == 'pull_request' && format('pr-{0}-', github.event.pull_request.number) || format('merge-{0}-', github.sha) }}
          key: clippy-test
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
      - name: Install Pkl CLI
        run: npm install --global @pkl-community/pkl@0.27.2
      - uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        with:
          tool: cargo-nextest@0.9.146
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-test-archive-${{ github.run_id }}-${{ github.sha }}
          path: .artifacts/rust-test-archive
          digest-mismatch: error
      - name: Verify Rust archive identity
        run: node tools/support/compat/github/rust-test-archive.mjs verify .artifacts/rust-test-archive/tests.tar.zst .artifacts/rust-test-archive/receipt.json
      - name: Restore the exact completed workspace archive
        # The producer's ci archive stays distinct from the recipe's feature
        # builds in dev/test profiles. Restore baked paths without running shards.
        run: |
          mkdir -p target/tmp
          cargo nextest list --archive-file .artifacts/rust-test-archive/tests.tar.zst --extract-to "$GITHUB_WORKSPACE" --extract-overwrite --workspace-remap "$GITHUB_WORKSPACE" --profile full --message-format json > "$RUNNER_TEMP/workspace-tests.json"
      - name: Test merge queue differential corpora
        if: ${{ github.event_name == 'merge_group' && inputs.run-rust }}
        uses: ./.github/actions/test-rust-workspace-differential
        with:
          workspace-already-tested: "true"
      - name: Check fixture coverage
        if: ${{ inputs.run-rust }}
        run: rust-script tools/commands/ci/github/write-coverage-summary.rs
