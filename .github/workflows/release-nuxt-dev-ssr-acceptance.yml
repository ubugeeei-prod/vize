name: Released Nuxt dev SSR acceptance
on:
  workflow_dispatch:
    inputs:
      cut: { description: Immutable original source C, required: true, type: string }
      head:
        {
          description: Official versioned source H containing the actual fix,
          required: true,
          type: string,
        }
      tag: { description: Published pinned stable minor tag, required: true, type: string }
      source_pr: { description: Official immutable source PR, required: true, type: string }
      release_run:
        { description: Successful official pinned Release R, required: true, type: string }
permissions: { contents: read, actions: read }
concurrency:
  group: released-nuxt-dev-ssr-${{ inputs.release_run }}
  cancel-in-progress: false
jobs:
  public-cli:
    name: Original Nuxt first-response styles and hydration
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      PUBLIC_CUT: ${{ inputs.cut }}
      PUBLIC_HEAD: ${{ inputs.head }}
      PUBLIC_TAG: ${{ inputs.tag }}
      PUBLIC_SOURCE_PR: ${{ inputs.source_pr }}
      PUBLIC_RELEASE_RUN: ${{ inputs.release_run }}
    steps:
      - name: Require reviewed main and absent runtime overrides before Node startup
        env:
          PUB_CONSUMER: ${{ runner.temp }}/vize-nuxt-dev-ssr-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          PUBLIC_OUTPUT: ${{ runner.temp }}/vize-nuxt-dev-ssr-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ubugeeei-prod/vize
          test "$GITHUB_REF" = refs/heads/main
          for key in NODE_OPTIONS VIZE_BINDING_PATH VIZE_PREFER_WORKSPACE_BINDING NAPI_RS_NATIVE_LIBRARY_PATH NAPI_RS_FORCE_WASI VIZE_ALLOW_NATIVE_VERSION_MISMATCH CORSA_PATH CORSA_EXECUTABLE TSGO_PATH TSGO_EXECUTABLE LD_PRELOAD DYLD_INSERT_LIBRARIES VIZE_PUBLIC_NATIVE_CUSTODY VIZE_OXLINT_NATIVE_CUSTODY CORSA_BIN VIZE_TEST_DISABLE_TSGO VIZE_TEST_REQUIRE_TSGO CARGO_BIN_EXE_vize SOURCE_SHA VIZE_CORSA_DEV_PATHS; do
            if [ -n "${!key:-}" ]; then
              echo "::error::Runtime override must be absent: $key"
              exit 1
            fi
          done
          printf 'PUB_CONSUMER=%s\nPUBLIC_OUTPUT=%s\n' "$PUB_CONSUMER" "$PUBLIC_OUTPUT" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ github.workflow_sha }}", fetch-depth: 1, persist-credentials: false }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: package.json, run-install: false }
      - uses: ./.github/actions/setup-ubuntu-archive
      - name: Authenticate and execute actual public Nuxt adapters and native
        env: { GH_TOKEN: "${{ github.token }}" }
        run: node tools/support/release/nuxt_dev_style/main.mjs
      - name: Retain every complete public process packet and custody receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: released-nuxt-dev-ssr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vize-nuxt-dev-ssr-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
