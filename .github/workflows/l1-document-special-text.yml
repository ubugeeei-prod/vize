# DO NOT EDIT. Generated from tools/config/pkl/workflows/compiler/l1-document-special-text.pkl.
# Edit the Pkl source and run `node tools/commands/generate/repository-config.ts`.
name: L1 document special text
on:
  pull_request:
    paths:
      - .github/workflows/l1-document-special-text.yml
      - .github/scripts/workflows/l1-document-special-text/**
      - .github/actions/install-playwright-browsers/**
      - Cargo.lock
      - Cargo.toml
      - davinci/vize_l0/**
      - davinci/vize_l1/**
      - crates/vize_armature/**
      - crates/vize_relief/**
      - package.json
      - pnpm-lock.yaml
      - tests/package.json
      - tests/tooling/davinci-document-body-elements.test.ts
      - tests/tooling/davinci-document-disclosure-elements.test.ts
      - tests/tooling/davinci-document-embedded-fallback.test.ts
      - tests/tooling/davinci-document-foreign-content.test.ts
      - tests/tooling/davinci-document-phrasing.test.ts
      - tests/tooling/davinci-document-select.test.ts
      - tests/tooling/davinci-document-special-text.test.ts
permissions: { contents: read }
concurrency:
  group: l1-document-special-text-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
jobs:
  differential:
    name: Chromium, legacy and native packets
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/l1-document-special-text/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ env.HEAD_SHA }}", persist-credentials: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.100.0" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: l1-document-special-text
          cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}"
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: latest
          node-version-file: package.json
          run-install: false
          cache: true
          cache-save: false
      - run: vp install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/install-playwright-browsers
        with: { workspace: ./tests }
      - name: Compare the original packet with native and legacy Rust
        run: . "${{ env.VIZE_CI_FILES }}/compare-the-original-packet-with-native-and-legacy-rust.sh"
      - name: Compare the original packet with Chromium
        run: . "${{ env.VIZE_CI_FILES }}/compare-the-original-packet-with-chromium.sh"
