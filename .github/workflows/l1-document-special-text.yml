name: L1 document special text
on:
  pull_request:
    paths:
      - .github/workflows/l1-document-special-text.yml
      - .github/actions/install-playwright-browsers/**
      - Cargo.lock
      - Cargo.toml
      - davinci/vize_l0/**
      - davinci/vize_l1/**
      - crates/vize_armature/**
      - crates/vize_relief/**
      - package.json
      - pnpm-lock.yaml
      - tests/package.json
      - tests/tooling/davinci-document-foreign-content.test.ts
      - tests/tooling/davinci-document-phrasing.test.ts
      - tests/tooling/davinci-document-select.test.ts
      - tests/tooling/davinci-document-special-text.test.ts
permissions: { contents: read }
concurrency:
  group: l1-document-special-text-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
jobs:
  differential:
    name: Chromium, legacy and native packets
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ env.HEAD_SHA }}", persist-credentials: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: l1-document-special-text
          cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}"
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: latest
          node-version-file: package.json
          run-install: false
          cache: true
          cache-save: false
      - run: vp install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/install-playwright-browsers
        with: { workspace: ./tests }
      - name: Compare the original packet with native and legacy Rust
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          cargo test --locked --profile ci -p vize_l1 \
            --test html_foreign_content \
            --test html_foreign_content_legacy_oracle \
            --test html_phrasing \
            --test html_phrasing_legacy_oracle \
            --test html_select \
            --test html_select_legacy_oracle \
            --test html_special_text \
            --test html_special_text_legacy_oracle
      - name: Compare the original packet with Chromium
        run: |
          vp node --test \
            tests/tooling/davinci-document-foreign-content.test.ts \
            tests/tooling/davinci-document-phrasing.test.ts \
            tests/tooling/davinci-document-select.test.ts \
            tests/tooling/davinci-document-special-text.test.ts
