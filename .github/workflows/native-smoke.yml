name: Retain failed parser merge-group evidence
on:
  workflow_dispatch:
permissions: { contents: read, actions: read }
concurrency:
  group: parser-421-failure-custody-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      FAILURE_CUSTODY: /tmp/parser-421-custody-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Preserve complete original artifact bytes and raw failed job logs
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess
          def api(path):
              p=subprocess.run(["gh","api","--allow-escape-sequences","repos/ubugeeei-prod/vize/"+path],capture_output=True,check=True)
              return p.stdout
          def obj(path): return json.loads(api(path))
          out=pathlib.Path(os.environ["FAILURE_CUSTODY"]);out.mkdir(parents=True,exist_ok=False)
          run=obj("actions/runs/40561192257")
          assert run["head_sha"]=="421d19b1d0873c5d3fc6815625a5fe4fe694fe6c"
          commit=obj("git/commits/"+run["head_sha"])
          manifest={"original_run":run,"original_commit":commit,"artifacts":[],"jobs":[],"custody_run":os.environ["GITHUB_RUN_ID"],"custody_recipe":os.environ["GITHUB_SHA"]}
          (out/"original-run.json").write_text(json.dumps(run,indent=2)+"\n")
          (out/"original-commit.json").write_text(json.dumps(commit,indent=2)+"\n")
          for artifact_id,size,digest in [(12760533269,2712348,"1df624f4d0cde61cba6811a27bd979cc7d76fa7804f9a92202c953cfddc1260d"),(12761841575,287112,"29479f45c5c777cdb133a3b43dba27d72d9a9e4b9cb473aa7c2917a44c22deb0")]:
              meta=obj("actions/artifacts/"+str(artifact_id))
              assert not meta["expired"] and meta["workflow_run"]["id"]==run["id"]
              assert meta["workflow_run"]["head_sha"]==run["head_sha"]
              assert meta["size_in_bytes"]==size and meta["digest"]=="sha256:"+digest
              raw=api("actions/artifacts/"+str(artifact_id)+"/zip")
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
              (out/(str(artifact_id)+".zip")).write_bytes(raw)
              (out/(str(artifact_id)+".metadata.json")).write_text(json.dumps(meta,indent=2)+"\n")
              manifest["artifacts"].append({"id":artifact_id,"bytes":size,"sha256":digest,"complete_original_zip":True})
          for job_id in [122390349659,122391427248]:
              meta=obj("actions/jobs/"+str(job_id))
              assert meta["run_id"]==run["id"] and meta["conclusion"]=="failure"
              raw=api("actions/jobs/"+str(job_id)+"/logs")
              (out/(str(job_id)+".raw.log")).write_bytes(raw)
              (out/(str(job_id)+".metadata.json")).write_text(json.dumps(meta,indent=2)+"\n")
              manifest["jobs"].append({"id":job_id,"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest(),"raw_log_complete":True})
          (out/"custody.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print(json.dumps({"source":run["head_sha"],"artifacts":manifest["artifacts"],"jobs":manifest["jobs"]}))
          
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: parser-421-failure-custody-${{ github.run_id }}
          path: /tmp/parser-421-custody-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 90
