name: Optional inject paired native and CLI functional controls
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      INSTA_UPDATE: "no"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 33aa5add7c4d77653497f96adafcf357972b1ed1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with:
          wild-version: "0.9.0"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.14.0"
      - name: Prove the prior guard loses the exact empty-spread finding
        env:
          EXPECTED_BEFORE_SOURCE: 33aa5add7c4d77653497f96adafcf357972b1ed1
        run: |
          mkdir -p "$RUNNER_TEMP/optional-inject-native"
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_BEFORE_SOURCE" ]]
          git rev-parse HEAD > "$RUNNER_TEMP/optional-inject-native/before-source.txt"
          rustc -Vv > "$RUNNER_TEMP/optional-inject-native/rustc.txt"
          set +e
          cargo test --locked --profile ci -p vize_croquis_cf --lib analyzer::tests_provide_inject::defaulted::spread_defaults_keep_unproven_findings -- --exact --nocapture > "$RUNNER_TEMP/optional-inject-native/before-native.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/optional-inject-native/before-native.log"
          [[ "$status" == "101" ]]
          node -e 'const a=require("node:assert/strict"),fs=require("node:fs");const s=fs.readFileSync(process.argv[1],"utf8");a.match(s,/^running 1 test$/m);a.match(s,/^test analyzer::tests_provide_inject::defaulted::spread_defaults_keep_unproven_findings \.\.\. FAILED$/m);a.match(s,/^test result: FAILED\. 0 passed; 1 failed; 0 ignored; 0 measured; 279 filtered out; finished in [0-9.]+s$/m);a.match(s,/assertion .*failed: none: const state = inject\('state', \.\.\.\[\]\)/);' "$RUNNER_TEMP/optional-inject-native/before-native.log"
      - name: Select the actual candidate and require every Croquis and cross-file native control
        env:
          EXPECTED_CANDIDATE_SOURCE: 93721b68f3403ab19416c7a528fcb360639b993f
        run: |
          set -o pipefail
          git fetch --no-tags --depth=1 origin "$EXPECTED_CANDIDATE_SOURCE"
          git checkout --detach FETCH_HEAD
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_CANDIDATE_SOURCE" ]]
          git rev-parse HEAD > "$RUNNER_TEMP/optional-inject-native/source.txt"
          cargo metadata --locked --no-deps --format-version=1 > "$RUNNER_TEMP/optional-inject-native/metadata.json"
          cargo test --locked --profile ci -p vize_croquis -p vize_croquis_cf --lib -- --nocapture 2>&1 | tee "$RUNNER_TEMP/optional-inject-native/controls.log"
          git diff --exit-code
      - name: Build and attest one fresh CLI for this single-job functional replay
        run: |
          set -o pipefail
          cargo build --profile ci -p vize 2>&1 | tee "$RUNNER_TEMP/optional-inject-native/cli-build.log"
          node tests/differential/build-receipt.ts
          cp target/ci/vize.differential-build.json "$RUNNER_TEMP/optional-inject-native/candidate-build.json"
          target/ci/vize --version > "$RUNNER_TEMP/optional-inject-native/candidate-version.txt"
          sha256sum target/ci/vize > "$RUNNER_TEMP/optional-inject-native/candidate-sha256.txt"
      - name: Install the genuine pinned public CLI and independent pinned Vue runtime
        run: |
          npm view --registry=https://registry.npmjs.org vize@0.602.0 --json > "$RUNNER_TEMP/optional-inject-native/before-registry.json"
          npm view --registry=https://registry.npmjs.org vue@3.5.44 --json > "$RUNNER_TEMP/optional-inject-native/vue-registry.json"
          npm install --registry=https://registry.npmjs.org --prefix "$RUNNER_TEMP/defaulted-inject-before" --ignore-scripts --no-audit --no-fund vize@0.602.0 vue@3.5.44 > "$RUNNER_TEMP/optional-inject-native/install.stdout" 2> "$RUNNER_TEMP/optional-inject-native/install.stderr"
          cp "$RUNNER_TEMP/defaulted-inject-before/package-lock.json" "$RUNNER_TEMP/optional-inject-native/before-lock.json"
      - name: Require all14 complete CLI and Doctor pairs plus original history transitions
        env:
          VIZE_DEFAULTED_INJECT_PROOF: ${{ runner.temp }}/optional-inject-native/packets.json
          VIZE_DEFAULTED_INJECT_BEFORE_CLI: ${{ runner.temp }}/defaulted-inject-before/node_modules/.bin/vize
        run: |
          node --test tests/tooling/defaulted-inject-snapshot-transition.test.ts
          node tools/support/compat/defaulted-inject/verify.ts
          git diff --exit-code
      - name: Prove actual pinned Vue argument-count semantics independently
        env:
          NODE_ENV: development
        run: |
          node tools/support/compat/defaulted-inject/runtime.ts "$RUNNER_TEMP/defaulted-inject-before" "$RUNNER_TEMP/optional-inject-native/vue-runtime.json"
          git diff --exit-code
      - name: Preserve all execution and source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: optional-inject-native-functional-controls
          path: ${{ runner.temp }}/optional-inject-native/
          if-no-files-found: error
          retention-days: 30
