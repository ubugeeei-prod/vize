name: Observe existing fatal subproblem production reuse
on:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: parser-production-reuse-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "1"
      CARGO_TARGET_DIR: /tmp/parser-production-reuse-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - name: Run the original focused regression with test-only counters
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          git rev-parse HEAD
          echo '60c49daaab7e06a062b0ffa7dced0eb4ddab9dbee1b52f1657fc4f1c08aa14a5  vendor/oxc_parser/src/speculation/fixtures/issue-10845.input' | sha256sum --check --strict
          mkdir -p /tmp/parser-production-reuse-proof-${{ github.run_id }}
          cargo +1.99.1 test --locked -p vize_oxc_parser --profile ci speculation::tests::overlapping_fatal_subproblems_are_shared_without_changing_recovery -- --nocapture 2>&1 | tee /tmp/parser-production-reuse-proof-${{ github.run_id }}/complete.log
          grep 'PRODUCTION_REUSE ' /tmp/parser-production-reuse-proof-${{ github.run_id }}/complete.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: parser-production-reuse-${{ github.run_id }}
          path: /tmp/parser-production-reuse-proof-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 90
