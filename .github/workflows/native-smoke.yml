name: Native Smoke
run-name: "Urgent Windows config runtime 10988 @ ${{ inputs.source_sha }}"
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source containing the Windows runtime transport fix
        required: true
        type: string
permissions: { contents: read }
concurrency:
  group: urgent-windows-config-10988-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-config:
    name: Windows 2025 Node config runtime
    runs-on: windows-2025-vs2026
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CARGO_TARGET_DIR: ${{ runner.temp }}/vize-config-10988-target
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.99.1" }
      - name: Verify immutable source and required Node
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ "$(node --version)" == v24.22.1 ]]
          mkdir -p "$RUNNER_TEMP/windows-config-runtime"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/windows-config-runtime/source.txt"
          node --version > "$RUNNER_TEMP/windows-config-runtime/node.txt"
          rustc -vV > "$RUNNER_TEMP/windows-config-runtime/rustc.txt"
          git diff --exit-code
      - name: Run all four actual Windows transport regressions
        run: |
          set -euo pipefail
          cargo test --locked --profile ci -p vize_carton \
            config::loader::js::runtime_file::tests:: -- --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/windows-config-runtime/tests.txt"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const root = join(process.env.RUNNER_TEMP, 'windows-config-runtime');
          const text = readFileSync(join(root, 'tests.txt'), 'utf8');
          assert.match(text, /running 4 tests/);
          assert.match(text, /test result: ok\. 4 passed; 0 failed; 0 ignored/);
          const names = [
            'large_evaluator_is_a_private_file_instead_of_a_command_argument',
            'file_execution_preserves_unicode_paths_cache_marker_and_cwd',
            'file_runtime_keeps_stdin_available_for_the_real_observation_handshake',
            'temporary_module_is_removed_after_success_or_child_failure',
          ];
          for (const name of names) assert.ok(text.includes(name + ' ... ok'), name);
          writeFileSync(join(root, 'receipt.json'), JSON.stringify({
            sourceSha: process.env.SOURCE_SHA, node: process.version, platform: process.platform,
            architecture: process.arch, passed: names, tests: 4, skipped: 0,
            scope: 'actual Windows Rust/Node file transport; no original-project or public-release acceptance credit',
          }, null, 2) + '\n');
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-config-runtime-10988-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/windows-config-runtime/
          if-no-files-found: error
          retention-days: 30
