name: Frontend hosted contract replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 26300df89c2a1a01ce686c542c2cdcc3f51a5195
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.14.0"
          package-manager-cache: false
      - name: Pin exact source and the existing YAML dependency
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          mkdir -p "$RUNNER_TEMP/frontend-contract-proof"
          git rev-parse HEAD > "$RUNNER_TEMP/frontend-contract-proof/source.txt"
          [[ "$(git rev-parse HEAD)" == "26300df89c2a1a01ce686c542c2cdcc3f51a5195" ]]
          node --version > "$RUNNER_TEMP/frontend-contract-proof/node.txt"
          npm view yaml@2.9.0 --json > "$RUNNER_TEMP/frontend-contract-proof/yaml-registry.json"
          npm install --prefix "$RUNNER_TEMP/frontend-contract-yaml" --ignore-scripts --no-audit --no-fund --save-exact yaml@2.9.0 > "$RUNNER_TEMP/frontend-contract-proof/install.stdout" 2> "$RUNNER_TEMP/frontend-contract-proof/install.stderr"
          mkdir -p node_modules
          ln -s "$RUNNER_TEMP/frontend-contract-yaml/node_modules/yaml" node_modules/yaml
          cp "$RUNNER_TEMP/frontend-contract-yaml/package-lock.json" "$RUNNER_TEMP/frontend-contract-proof/yaml-lock.json"
      - name: Execute every original source, bootstrap and runner contract
        run: |
          set -o pipefail
          node --test --test-reporter=tap tests/tooling/github-workflows-source-selection.test.ts tests/tooling/vp-bootstrap-cache.test.mjs tests/tooling/ci-report-runners.test.ts tests/tooling/frontend-runner-pool.test.ts | tee "$RUNNER_TEMP/frontend-contract-proof/contracts.tap"
      - name: Retain actual source, commands and full test packets
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontend-hosted-contract-replay
          path: |
            ${{ runner.temp }}/frontend-contract-proof/
            tests/tooling/vp-bootstrap-cache.test.mjs
            tests/tooling/frontend-runner-pool.test.ts
            tests/tooling/fixtures/frontend-runner-pool/
          if-no-files-found: error
          retention-days: 30
