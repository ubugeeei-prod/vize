name: Capture exact official plain-script history boundary
on:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: plain-script-history-official-${{ github.ref }}
  cancel-in-progress: false
jobs:
  official:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      OFFICIAL_PROOF: /tmp/plain-script-history-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: 01775187e97a99382367b7c833b825749185eaae
          path: fixture-source
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "26.6.0" }
      - name: Install only the pinned official compiler on the remote runner
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const host=join(process.env.OFFICIAL_PROOF,"host");
          mkdirSync(host,{recursive:true});
          writeFileSync(join(host,"package.json"),JSON.stringify({private:true,dependencies:{"@vue/compiler-sfc":"3.5.41"}})+"\n");
          NODE
          npm install --prefix "$OFFICIAL_PROOF/host" --registry=https://registry.npmjs.org --ignore-scripts --no-audit --no-fund
      - name: Capture the exact immutable input and both original option boundaries
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import { mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import { createRequire } from "node:module";
          import { join, resolve } from "node:path";
          const proof = process.env.OFFICIAL_PROOF;
          const root = resolve("fixture-source");
          const source = execFileSync("git", ["rev-parse", "HEAD"], { cwd: root, encoding: "utf8" }).trim();
          assert.equal(source, "01775187e97a99382367b7c833b825749185eaae");
          mkdirSync(proof, { recursive: true });
          const fixture = "crates/vize_atelier_sfc/tests/fixtures/fix-history/dual-script-inline-type-only-imports";
          const read = (suffix, blob) => {
            const raw = readFileSync(join(root, fixture + suffix));
            const actual = createHash("sha1").update(Buffer.from("blob " + raw.length + "\0")).update(raw).digest("hex");
            assert.equal(actual, blob);
            return raw;
          };
          const input = read(".input.txt", "92e10c4411502a796d46c528985c8ad9e086be64");
          const optionBytes = read(".options.json", "07b6a946b9420ed40aca54a49a4f666519110f97");
          const archivedBytes = read(".expected.json", "60f002af8c9b73de3f592d76acd29168ea509fe8");
          const options = JSON.parse(optionBytes);
          const archived = JSON.parse(archivedBytes);
          assert.equal(archived.Ok.bindings.bindings.runtimeValue, "setup-const");
          assert.equal(options.effectiveAdapterInputs.templateSyntax, "Standard");
          assert.equal(options.compileOptions.template.dialect, "V3");
          assert.equal(options.effectiveAdapterInputs.scriptOutput, "InlineTemplate");
          const fromHost = createRequire(join(proof, "host/package.json"));
          const vue = fromHost("@vue/compiler-sfc");
          assert.equal(fromHost("@vue/compiler-sfc/package.json").version, "3.5.41");
          const sha = (raw) => createHash("sha256").update(raw).digest("hex");
          const packet = {
            schema: "vize.plain-script-history-official",
            source, recipe: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID,
            input: input.toString(), inputSha256: sha(input),
            authoredOptions: options, optionsSha256: sha(optionBytes),
            archived, archivedSha256: sha(archivedBytes),
            officialVersion: "3.5.41", dialect: "Vue 3 standard SFC",
            mapping: "The original source and options are frozen. Both authored script.inline_template=false and effectiveAdapterInputs.scriptOutput=InlineTemplate are executed. Null optional IDs map to the empty API id; original filename/source_map/is_prod/propsDestructure are retained. Script language is inferred from the unchanged authored lang=ts blocks.",
            observations: [],
          };
          const retain = () => writeFileSync(join(proof, "official-whole-packets.json"), JSON.stringify(packet, null, 2) + "\n");
          retain();
          for (const inlineTemplate of [options.compileOptions.script.inline_template, true]) {
            const warnings = [];
            const previousWarn = console.warn;
            console.warn = (...args) => warnings.push(args.map(String).join(" "));
            try {
              const parseOptions = {
                filename: options.descriptorParseOptions.filename,
                sourceMap: options.descriptorParseOptions.source_map,
                pad: false,
              };
              const parsed = vue.parse(input.toString(), parseOptions);
              const apiOptions = {
                id: options.compileOptions.script.id ?? options.compileOptions.template.id ?? "",
                inlineTemplate,
                sourceMap: options.effectiveAdapterInputs.codegen.source_map,
                isProd: options.compileOptions.template.is_prod,
                propsDestructure: false,
              };
              const script = vue.compileScript(parsed.descriptor, apiOptions);
              packet.observations.push({
                parseOptions, apiOptions, parseErrors: parsed.errors, warnings,
                scriptLang: parsed.descriptor.script.lang,
                setupLang: parsed.descriptor.scriptSetup.lang,
                script,
              });
            } finally { console.warn = previousWarn; }
            retain();
          }
          writeFileSync(join(proof, "original.input.txt"), input);
          writeFileSync(join(proof, "original.options.json"), optionBytes);
          writeFileSync(join(proof, "original.expected.json"), archivedBytes);
          for (const observation of packet.observations) {
            assert.deepEqual(observation.parseErrors, []);
            assert.equal(observation.script.bindings.runtimeValue, "setup-maybe-ref");
            assert(!Object.hasOwn(observation.script.bindings, "Foo"));
            assert(!Object.hasOwn(observation.script.bindings, "Bar"));
          }
          console.log(JSON.stringify({
            normative: "official-vue-3.5.41",
            source, inputBytes: input.length, inputSha256: packet.inputSha256,
            optionsSha256: packet.optionsSha256, archivedSha256: packet.archivedSha256,
            observations: packet.observations.map(({ apiOptions, script }) => ({ apiOptions, bindings: script.bindings })),
            completePacketSha256: sha(readFileSync(join(proof, "official-whole-packets.json"))),
          }));
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: plain-script-history-official-${{ github.run_id }}
          path: |
            /tmp/plain-script-history-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            /tmp/plain-script-history-${{ github.run_id }}-${{ github.run_attempt }}/*.txt
            /tmp/plain-script-history-${{ github.run_id }}-${{ github.run_attempt }}/host/package-lock.json
          if-no-files-found: error
          retention-days: 90
