name: Optional inject native functional controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      INSTA_UPDATE: "no"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: bf30c15a4814ac7536bca87af255ba112fa1f5d1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with:
          wild-version: "0.9.0"
      - name: Record exact source and unchanged compiler profile
        run: |
          mkdir -p "$RUNNER_TEMP/optional-inject-native"
          [[ "$(git rev-parse HEAD)" == "bf30c15a4814ac7536bca87af255ba112fa1f5d1" ]]
          git rev-parse HEAD > "$RUNNER_TEMP/optional-inject-native/source.txt"
          rustc -Vv > "$RUNNER_TEMP/optional-inject-native/rustc.txt"
          cargo metadata --locked --no-deps --format-version=1 > "$RUNNER_TEMP/optional-inject-native/metadata.json"
      - name: Execute the original provide-inject suite and new optionality controls
        run: |
          set -o pipefail
          cargo test --locked --profile ci -p vize_croquis_cf --lib analyzer::tests_provide_inject -- --nocapture 2>&1 | tee "$RUNNER_TEMP/optional-inject-native/controls.log"
          cargo test --locked --profile ci -p vize_croquis_cf --lib analyzer::tests_snapshots::provide_inject -- --nocapture 2>&1 | tee "$RUNNER_TEMP/optional-inject-native/snapshots.log"
          git diff --exit-code
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.14.0"
      - name: Build and attest one fresh CLI for this single-job functional replay
        run: |
          set -o pipefail
          cargo build --profile ci -p vize 2>&1 | tee "$RUNNER_TEMP/optional-inject-native/cli-build.log"
          node tests/differential/build-receipt.ts
          cp target/ci/vize.differential-build.json "$RUNNER_TEMP/optional-inject-native/candidate-build.json"
          target/ci/vize --version > "$RUNNER_TEMP/optional-inject-native/candidate-version.txt"
          sha256sum target/ci/vize > "$RUNNER_TEMP/optional-inject-native/candidate-sha256.txt"
      - name: Install the genuine pinned public before CLI and preserve its lock
        run: |
          npm view --registry=https://registry.npmjs.org vize@0.602.0 --json > "$RUNNER_TEMP/optional-inject-native/before-registry.json"
          npm install --registry=https://registry.npmjs.org --prefix "$RUNNER_TEMP/defaulted-inject-before" --ignore-scripts --no-audit --no-fund vize@0.602.0 > "$RUNNER_TEMP/optional-inject-native/install.stdout" 2> "$RUNNER_TEMP/optional-inject-native/install.stderr"
          cp "$RUNNER_TEMP/defaulted-inject-before/package-lock.json" "$RUNNER_TEMP/optional-inject-native/before-lock.json"
      - name: Preserve original and mutation whole packets and exact history transitions
        env:
          VIZE_DEFAULTED_INJECT_PROOF: ${{ runner.temp }}/optional-inject-native/packets.json
          VIZE_DEFAULTED_INJECT_BEFORE_CLI: ${{ runner.temp }}/defaulted-inject-before/node_modules/.bin/vize
        run: |
          node --test tests/tooling/defaulted-inject-snapshot-transition.test.ts
          node tools/support/compat/defaulted-inject/verify.ts
          git diff --exit-code
      - name: Preserve all execution and source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: optional-inject-native-functional-controls
          path: ${{ runner.temp }}/optional-inject-native/
          if-no-files-found: error
          retention-days: 30
