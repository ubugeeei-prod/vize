name: Capture authenticated plain-script SSR reference
on:
  workflow_dispatch:
permissions: { contents: read, actions: read }
concurrency:
  group: plain-script-ssr-reference-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SSR_CAPTURE_PROOF: /tmp/plain-script-ssr-${{ github.run_id }}-${{ github.run_attempt }}
      SSR_CAPTURE_ARCHIVE: /tmp/plain-script-cli-${{ github.run_id }}/source-cli.tar.gz
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - name: Read the exact original producer tree independently of the capture recipe
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: 3bfe310301328e45bb33ffa56cc3d2fbfe7f3945
          path: producer
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "26.6.0" }
      - name: Fetch only the existing original CLI producer artifact on the remote runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-cli-40528310601-1
          run-id: 40528310601
          github-token: ${{ github.token }}
          path: /tmp/plain-script-cli-${{ github.run_id }}
          digest-mismatch: error
      - name: Authenticate original custody and capture two complete SSR executions
        run: node tools/support/compat/plain-script-ssr-capture.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: plain-script-ssr-reference-${{ github.run_id }}
          path: |
            /tmp/plain-script-ssr-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            /tmp/plain-script-ssr-${{ github.run_id }}-${{ github.run_attempt }}/*.txt
            /tmp/plain-script-ssr-${{ github.run_id }}-${{ github.run_attempt }}/first/Layout.vue
            /tmp/plain-script-ssr-${{ github.run_id }}-${{ github.run_attempt }}/first/out/Layout.json
            /tmp/plain-script-ssr-${{ github.run_id }}-${{ github.run_attempt }}/second/out/Layout.json
          if-no-files-found: error
          retention-days: 90
