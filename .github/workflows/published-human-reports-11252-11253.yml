name: Published human reports 11252 and 11253
on:
  pull_request:
    paths:
      - "tools/support/release/human_reports_11252_11253_public/**"
      - "tests/tooling/release/human-reports-11252-11253*.test.ts"
      - ".github/workflows/published-human-reports-11252-11253.yml"
  workflow_dispatch:
    inputs:
      request_blob:
        description: Reviewed immutable manual-request Git blob
        type: string
        required: true
      role:
        type: choice
        required: true
        options: [runtime-prop-null-11252, imports-vue-ts-11253]
      phase:
        type: choice
        required: true
        options: [before, after]
permissions: { contents: read, actions: read }
concurrency:
  group: published-human-reports-${{ inputs.role }}-${{ inputs.phase }}-${{ inputs.request_blob }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "24.22.1", package-manager-cache: false }
      - run: node --experimental-strip-types --test tests/tooling/release/human-reports-11252-11253*.test.ts
  public-consumer:
    needs: contracts
    if: github.repository == 'ubugeeei-prod/vize' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.role == 'runtime-prop-null-11252' && 'blacksmith-12vcpu-macos-15' || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    env:
      REQUEST_BLOB: ${{ inputs.request_blob }}
      ROLE: ${{ inputs.role }}
      PHASE: ${{ inputs.phase }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs.role == 'runtime-prop-null-11252' && '26.12.1' || '24.22.1' }}
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.16.1"
          run_install: false
          package_json_file: tools/support/release/human_reports_11252_11253_public/pnpm-bootstrap.json
      - name: Validate finite receiver contracts without product execution
        run: node --experimental-strip-types --test tests/tooling/release/human-reports-11252-11253-public.test.ts
      - name: Authenticate manual request and execute original public recipe
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/human-reports-$ROLE-$PHASE"
          pnpm_cli="$(node -p 'require("node:fs").realpathSync(process.argv[1])' "$(command -v pnpm)")"
          node --experimental-strip-types tools/support/release/human_reports_11252_11253_public/bootstrap.ts \
            "$REQUEST_BLOB" "$ROLE" "$PHASE" "$root-request"
          node --experimental-strip-types tools/support/release/human_reports_11252_11253_public/run.ts \
            --execute-public "$root-request/request.json" "$pnpm_cli" "$root-output"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: human-report-${{ inputs.role }}-${{ inputs.phase }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/human-reports-${{ inputs.role }}-${{ inputs.phase }}-output/*.json
            ${{ runner.temp }}/human-reports-${{ inputs.role }}-${{ inputs.phase }}-output/*.txt
            ${{ runner.temp }}/human-reports-${{ inputs.role }}-${{ inputs.phase }}-output/*-native-journal/*.jsonl
            ${{ runner.temp }}/human-reports-${{ inputs.role }}-${{ inputs.phase }}-output/sdk/**
