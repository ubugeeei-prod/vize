name: JSR package checks
on:
  pull_request:
    paths:
      - "jsr/**"
      - "npm/**/package.json"
      - "tools/support/release/jsr/**"
      - "tests/tooling/jsr-package.test.ts"
      - "tests/tooling/release-jsr-workflow.test.ts"
      - "tests/tooling/jsr-fresh-provenance.test.ts"
      - ".github/workflows/jsr-package.yml"
      - ".github/workflows/release-jsr.yml"
  workflow_dispatch:
    inputs:
      published-version:
        description: Optionally verify an existing published JSR version read-only in a fresh Deno cache
        type: string
        required: false
        default: ""
permissions: { contents: read }
concurrency:
  group: jsr-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: JSR publish dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: "package.json", run-install: false }
      - name: Install frozen tooling dependencies
        run: vp install --frozen-lockfile --prefer-offline --filter vize-workspace --filter @vize/tests --ignore-scripts
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with: { deno-version: "2.9.7" }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.3.14" }
      - name: Test package generation
        run: node --test tests/tooling/jsr-package.test.ts tests/tooling/release-jsr-workflow.test.ts tests/tooling/jsr-fresh-provenance.test.ts
      - name: Verify scoped dependency age with the actual Deno runtime
        env:
          JSR_CONSUMER_PUBLISHED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.published-version || '' }}
        run: node tools/support/release/jsr/verify-consumer-age.mjs "$RUNNER_TEMP/jsr-consumer-age"
      - name: Resolve the latest immutable public preview version
        id: preview
        run: echo "version=$(node tools/support/release/jsr/package.ts latest-public)" >> "$GITHUB_OUTPUT"
      - name: Generate a PR preview from that public release
        env: { JSR_PREVIEW_VERSION: "${{ steps.preview.outputs.version }}" }
        run: node tools/support/release/jsr/package.ts prepare-preview-all "$RUNNER_TEMP/jsr-packages" "$JSR_PREVIEW_VERSION"
      - name: Check every publication graph and public type surface
        run: node tools/support/release/jsr/verify-staged.ts dry-run "$RUNNER_TEMP/jsr-packages"
      - name: Import the staged entry points under Deno
        env: { DENO_DIR: "${{ runner.temp }}/staged-jsr-deno" }
        run: |
          cp tools/support/release/jsr/consumer.ts "$RUNNER_TEMP/consumer.ts"
          cp tools/support/release/jsr/consumer-deno.json "$RUNNER_TEMP/consumer-deno.json"
          deno run --config "$RUNNER_TEMP/consumer-deno.json" --lock "$RUNNER_TEMP/staged-jsr-deno.lock" --allow-all "$RUNNER_TEMP/consumer.ts" "file://$RUNNER_TEMP/jsr-packages/vize/"
      - name: Install the public preview in a fresh Bun project and execute the tool APIs
        env: { JSR_PREVIEW_VERSION: "${{ steps.preview.outputs.version }}" }
        run: |
          mkdir "$RUNNER_TEMP/jsr-bun-consumer"
          cp tools/support/release/jsr/consumer.ts "$RUNNER_TEMP/jsr-bun-consumer/consumer.ts"
          echo '{ "name": "vize-jsr-bun-preview", "private": true, "type": "module" }' > "$RUNNER_TEMP/jsr-bun-consumer/package.json"
          cd "$RUNNER_TEMP/jsr-bun-consumer"
          bun add --ignore-scripts --exact "@vizejs/babel-plugin@$JSR_PREVIEW_VERSION" "oxlint-plugin-vize@$JSR_PREVIEW_VERSION" vite@8.2.4 vue@3.5.42 2>&1 | tee install.log
          bunx --bun jsr@0.14.3 add "@vizejs/vize@$JSR_PREVIEW_VERSION" 2>&1 | tee jsr-add.log
          bun run consumer.ts @vizejs/vize --vite --babel-specifier @vizejs/babel-plugin --oxlint-specifier oxlint-plugin-vize 2>&1 | tee runtime.log
      - name: Preserve actual Deno consumer commands and outcomes
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jsr-consumer-age-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jsr-consumer-age/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve the fresh Bun preview install and runtime outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jsr-bun-preview-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/jsr-bun-consumer/*.log
            ${{ runner.temp }}/jsr-bun-consumer/*.json
            ${{ runner.temp }}/jsr-bun-consumer/*.lock
          if-no-files-found: warn
          retention-days: 14
