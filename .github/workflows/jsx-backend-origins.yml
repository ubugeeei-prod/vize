name: JSX backend source origins
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/vize_atelier_jsx/**"
      - "crates/vize_atelier_vapor/src/**"
      - "crates/vize_atelier_ssr/src/**"
      - "crates/vize_atelier_core/src/codegen/**"
      - "tests/_fixtures/differential/jsx/child-values-6890-backend-profile-contracts.json"
      - "tests/tooling/jsx-child-backend-profile-contract.test.ts"
      - "tests/tooling/support/jsx-child-backend-profile-contract.ts"
      - "tests/tooling/jsx-current-backend-profile-contract.test.ts"
      - "tests/tooling/support/jsx-current-backend-profile-contract.ts"
      - ".github/workflows/jsx-backend-origins.yml"
      - ".github/scripts/workflows/jsx-backend-origins/**"
permissions: { contents: read }
concurrency:
  group: jsx-backend-origins-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  origins:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "24"
      CARGO_INCREMENTAL: "0"
      QUALIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      RUSTUP_TOOLCHAIN: "1.100.0"
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/jsx-backend-origins/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with: { toolchain: "1.100.0" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with: { key: test-scripts, cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}" }
      - name: Capture exact backend maps and code equality
        env:
          VIZE_JSX_BACKEND_ORIGIN_CAPTURE: ${{ runner.temp }}/jsx-backend-origins/origins.json
        run: . "${{ env.VIZE_CI_FILES }}/capture-exact-backend-maps-and-code-equality.sh"
      - name: Measure complete default backends before and after the source change
        run: . "${{ env.VIZE_CI_FILES }}/measure-complete-default-backends-before-and-after-the-source-change.sh"
      - name: Compare whole backend outputs and report measured default overhead
        run: . "${{ env.VIZE_CI_FILES }}/compare-whole-backend-outputs-and-report-measured-default-overhead.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: jsx-backend-origins-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jsx-backend-origins
          if-no-files-found: error
          retention-days: 14
