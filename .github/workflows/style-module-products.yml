name: Style module products
on:
  pull_request:
    paths:
      - ".github/workflows/style-module-products.yml"
      - "davinci/vize_l1/Cargo.toml"
      - "davinci/vize_l1/src/container/lang.rs"
      - "davinci/vize_l1/src/css.rs"
      - "davinci/vize_l1/src/css/**"
      - "crates/vize_patina/Cargo.toml"
      - "crates/vize_patina/src/rules/css.rs"
      - "crates/vize_patina/src/rules/css/**"
      - "crates/vize_patina/src/linter/css_rules.rs"
      - "crates/vize_canon/Cargo.toml"
      - "crates/vize_canon/src/batch/virtual_project/build/css_modules.rs"
      - "crates/vize_canon/src/batch/virtual_project/build/css_modules/**"
      - "crates/vize_maestro/Cargo.toml"
      - "crates/vize_maestro/src/document/store.rs"
      - "crates/vize_maestro/src/ide/context.rs"
      - "crates/vize_maestro/src/ide/completion.rs"
      - "crates/vize_maestro/src/ide/completion/template.rs"
      - "crates/vize_maestro/src/ide/completion/template/css_modules.rs"
      - "crates/vize_maestro/src/ide/completion/template/css_modules/**"
      - "davinci/vize_l2/Cargo.toml"
      - "davinci/vize_l2/src/lang/mod.rs"
      - "davinci/vize_l2/src/lang/scss.rs"
      - "davinci/vize_l2/src/lang/scss/**"
      - "davinci/vize_l4/Cargo.toml"
      - "davinci/vize_l4/src/targets.rs"
      - "davinci/vize_l4/src/targets/scss.rs"
      - "crates/vize_atelier_sfc/Cargo.toml"
      - "crates/vize_atelier_sfc/src/lib.rs"
      - "crates/vize_atelier_sfc/src/scss.rs"
      - "crates/vize_atelier_sfc/src/scss/**"
      - "crates/vize_glyph/Cargo.toml"
      - "crates/vize_glyph/src/formatter/blocks.rs"
      - "crates/vize_glyph/src/formatter/blocks/style.rs"
      - "crates/vize_glyph/src/formatter/style_block.rs"
      - "crates/vize_glyph/tests/observed_style.rs"
      - "crates/vize_maestro/src/source_project/style_format.rs"
      - "crates/vize_maestro/src/source_project/style_format/**"
      - "crates/vize_atelier_sfc/src/native.rs"
      - "crates/vize_atelier_sfc/src/native/styles.rs"
      - "crates/vize_atelier_sfc/src/native_scoped_ssr.rs"
      - "crates/vize_atelier_sfc/tests/native_sfc_scss.rs"
      - "crates/vize_atelier_sfc/tests/component_scss/**"
      - "davinci/vize_l4/src/write/document.rs"
      - "crates/vize_atelier_sfc/tests/fixtures/native_sfc_ts_annotation_setup_vue_3_5_35.json"
      - "crates/vize_atelier_sfc/tests/scss_products.rs"
      - "crates/vize_atelier_sfc/tests/observed_scss/**"
      - "crates/vize_maestro/src/source_project.rs"
      - "crates/vize_maestro/src/source_project/scss.rs"
      - "crates/vize_maestro/src/source_project/scss/**"
      - "crates/vize/src/commands/build/runner/preprocess.mjs"
      - "npm/builder/parcel/package.json"
      - "tests/_fixtures/_projects/style-preprocessors/**"
permissions: { contents: read }
concurrency:
  group: style-module-products-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  style-modules:
    name: Style module products ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: [correctness, performance]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "24"
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "16777216"
      RUSTUP_TOOLCHAIN: "1.100.0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.100.0", components: clippy }
      - uses: ./.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: style-module-products-cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Select original Vue sources
        run: git ls-files -z -- '*.vue' '*.vue.txt' > "$RUNNER_TEMP/style-module-sources"
      - name: Compare original checker options and completion responses
        if: matrix.suite == 'correctness'
        run: |
          set -euo pipefail
          flags=(--locked --profile ci-opt)
          editor=(-p vize_maestro --features experimental-style-lint-products,micro-profiling --lib)
          cargo clippy "${flags[@]}" -p vize_patina --features observed-style-rules --lib --no-deps -- -D warnings
          cargo test "${flags[@]}" -p vize_patina --features observed-style-rules --lib rules::css
          cargo clippy "${flags[@]}" -p vize_canon --features observed-style-modules --lib --no-deps -- -D warnings
          cargo clippy "${flags[@]}" "${editor[@]}" --no-deps -- -D warnings
          cargo test "${flags[@]}" -p vize_l1 --features observed-styles --lib css::lang::
          cargo test "${flags[@]}" -p vize_canon --features observed-style-modules --lib css_module
          cargo test "${flags[@]}" "${editor[@]}" css_module
          export VIZE_STYLE_MODULE_INPUTS="$RUNNER_TEMP/style-module-sources"
          cargo test "${flags[@]}" "${editor[@]}" original_style_module_products_match -- --ignored --nocapture --test-threads=1
          cargo test "${flags[@]}" "${editor[@]}" original_style_lint_products_match -- --ignored --nocapture --test-threads=1
      - name: Measure complete original and shared member requests
        if: matrix.suite == 'performance'
        run: |
          export VIZE_STYLE_MODULE_INPUTS="$RUNNER_TEMP/style-module-sources"
          cargo test --locked --profile ci-opt -p vize_maestro --features experimental-style-lint-products,micro-profiling --lib paired_style_module_requests -- --ignored --nocapture --test-threads=1
          cargo test --locked --profile ci-opt -p vize_maestro --features experimental-style-lint-products,micro-profiling --lib paired_style_lint_requests -- --ignored --nocapture --test-threads=1

  scss-products:
    name: Original SCSS compilation and editor definitions
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "24"
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "16777216"
      RUSTUP_TOOLCHAIN: "1.100.0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.100.0", components: clippy }
      - uses: ./.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version-file: package.json, package-manager-cache: false }
      - name: Install the repository's pinned Sass implementation
        run: |
          version=$(node -p "require('./npm/builder/parcel/package.json').devDependencies.sass")
          npm install --prefix "$RUNNER_TEMP/scss-oracle" --no-audit --no-fund --ignore-scripts --save-exact "sass@$version" @vue/compiler-sfc@3.5.35 @jridgewell/sourcemap-codec@1.6.0 postcss-selector-parser@7.1.6 vue@3.5.35
      - name: Compare the original preprocessor, shared products and authored editor locations
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/scss-oracle/node_modules"
          export VIZE_SCSS_MANIFEST="$RUNNER_TEMP/scss-inputs"
          export VIZE_REQUIRE_REPOSITORY_SCSS=1
          git ls-files -z -- '*.vue' '*.vue.txt' '*.scss' > "$VIZE_SCSS_MANIFEST"
          flags=(--locked --profile ci-opt)
          host=(-p vize_atelier_sfc --features native-scoped-scss)
          editor=(-p vize_maestro --features experimental-scss-definitions)
          cargo clippy "${flags[@]}" -p vize_l2 --features scss-rules --lib --no-deps -- -D warnings
          cargo clippy "${flags[@]}" -p vize_l4 --features scoped-scss --lib --no-deps -- -D warnings
          cargo clippy "${flags[@]}" "${host[@]}" --lib --no-deps -- -D warnings
          cargo clippy "${flags[@]}" "${editor[@]}" --lib --no-deps -- -D warnings
          cargo test "${flags[@]}" "${host[@]}" --test scss_products -- --include-ignored --nocapture --test-threads=1
          cargo test "${flags[@]}" "${host[@]}" --test native_sfc_scss -- --include-ignored --nocapture --test-threads=1
          cargo test "${flags[@]}" "${editor[@]}" --lib source_project::scss:: -- --include-ignored --nocapture --test-threads=1

          export VIZE_FORMAT_SCSS_INPUTS="$VIZE_SCSS_MANIFEST"
          cargo test "${flags[@]}" -p vize_glyph --features observed-style --test observed_style -- --include-ignored --nocapture --test-threads=1
          cargo test "${flags[@]}" -p vize_maestro --features experimental-verified-style-format --lib source_project::style_format:: -- --include-ignored --nocapture --test-threads=1
          cargo clippy "${flags[@]}" -p vize_glyph --features observed-style --lib --no-deps -- -D warnings
          cargo clippy "${flags[@]}" -p vize_atelier_sfc --features verified-scss-edits --lib --no-deps -- -D warnings
          cargo clippy "${flags[@]}" -p vize_maestro --features experimental-verified-style-format --lib --no-deps -- -D warnings
          cargo run "${flags[@]}" -p vize_atelier_sfc --features verified-scss-edits --example verified_scss_profile
          cargo test "${flags[@]}" -p vize_maestro --features experimental-verified-style-format,experimental-style-lint-products,micro-profiling --lib source_project::style_format::composition:: -- --include-ignored --nocapture --test-threads=1
