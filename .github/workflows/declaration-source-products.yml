name: Declaration source products
on:
  pull_request:
    paths:
      - ".github/workflows/declaration-source-products.yml"
      - "davinci/vize_l0/src/source_frame.rs"
      - "davinci/vize_l1/Cargo.toml"
      - "davinci/vize_l1/src/embed.rs"
      - "davinci/vize_l1/src/embed/authored_program.rs"
      - "davinci/vize_l1/src/embed/declaration_program.rs"
      - "davinci/vize_l2/Cargo.toml"
      - "davinci/vize_l2/src/query/script.rs"
      - "davinci/vize_l2/src/query/script/**"
      - "crates/vize_croquis/src/sfc/types.rs"
      - "crates/vize_canon/src/virtual_ts.rs"
      - "crates/vize_canon/src/virtual_ts/generated_names.rs"
      - "crates/vize_canon/src/virtual_ts/generator.rs"
      - "crates/vize_canon/src/virtual_ts/generator/script_module.rs"
      - "crates/vize_canon/src/virtual_ts/generator/script_module/**"
      - "crates/vize_canon/src/virtual_ts/text_buf.rs"
      - "crates/vize_canon/Cargo.toml"
      - "crates/vize_canon/src/batch.rs"
      - "crates/vize_canon/src/batch/declaration*.rs"
      - "crates/vize_canon/src/batch/declaration_path/**"
      - "crates/vize_canon/src/batch/vue_template_ref*.rs"
      - "crates/vize_maestro/Cargo.toml"
      - "crates/vize_maestro/src/server.rs"
      - "crates/vize_maestro/src/server/state.rs"
      - "crates/vize_maestro/src/server/state/workspace_project_files.rs"
      - "crates/vize_maestro/src/server/state/workspace_project_files/**"
      - "crates/vize_maestro/src/server/state/global_components*"
      - "crates/vize_maestro/src/server/state/global_components/**"
      - "crates/vize_maestro/src/ide/diagnostics.rs"
      - "crates/vize_maestro/src/ide/diagnostics/corsa*"
      - "crates/vize_maestro/src/ide/diagnostics/corsa/**"
      - "crates/vize_canon/src/corsa_bridge.rs"
      - "crates/vize_canon/src/corsa_bridge/bridge.rs"
      - "crates/vize_canon/src/batch/virtual_project.rs"
      - "crates/vize_canon/src/batch/virtual_project/ambient_declarations*"
      - "crates/vize_canon/src/corsa_bridge/editor_session.rs"
      - "crates/vize_canon/src/corsa_bridge/vue_dependencies_alias/context/build.rs"
      - "tests/_fixtures/differential/typechecker/ambient-global-slot-host-3011/**"
      - "crates/vize_maestro/src/server/state/global_tag_names*"
      - "crates/vize_maestro/src/server/state/global_tag_names/**"
      - "crates/vize_maestro/src/source_project/snapshot.rs"
      - "**/*.d.ts"
      - "**/*.d.mts"
      - "**/*.d.cts"
permissions: { contents: read }
concurrency:
  group: declaration-source-products-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  declarations:
    name: Declaration products ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: [correctness, performance]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "24"
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "16777216"
      RUSTUP_TOOLCHAIN: "1.100.0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.100.0", components: clippy }
      - uses: ./.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: declaration-products-cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Select tracked original TypeScript declarations
        run: git ls-files -z -- '*.d.ts' '*.d.mts' '*.d.cts' > "$RUNNER_TEMP/declaration-inputs"
      - name: Compare the projected TypeScript, provider identity and workspace completion
        if: matrix.suite == 'correctness'
        run: |
          set -euo pipefail
          flags=(--locked --profile ci-opt)
          checker=(-p vize_canon --features authored-declarations --lib)
          editor=(-p vize_maestro --features experimental-declaration-products,micro-profiling --lib)
          export VIZE_DECLARATION_INPUTS="$RUNNER_TEMP/declaration-inputs"
          cargo clippy "${flags[@]}" -p vize_l1 --features authored-declarations --lib --no-deps -- -D warnings
          cargo clippy "${flags[@]}" "${checker[@]}" --no-deps -- -D warnings
          cargo clippy "${flags[@]}" "${editor[@]}" --no-deps -- -D warnings
          cargo test "${flags[@]}" "${checker[@]}" batch::vue_template_ref_module::
          cargo test "${flags[@]}" "${checker[@]}" batch::import_rewriter_dts_tests::
          cargo test "${flags[@]}" "${editor[@]}" server::state::global_tag_names::
          cargo test "${flags[@]}" "${editor[@]}" original_declaration_products_match -- --ignored --nocapture --test-threads=1
      - name: Measure complete products for each original declaration
        if: matrix.suite == 'performance'
        run: |
          set -euo pipefail
          export VIZE_DECLARATION_INPUTS="$RUNNER_TEMP/declaration-inputs"
          cargo test --locked --profile ci-opt -p vize_maestro --features experimental-declaration-products,micro-profiling --lib paired_declaration_products -- --ignored --nocapture --test-threads=1

  plain-script-bridges:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "24"
      CARGO_INCREMENTAL: "0"
      RUSTUP_TOOLCHAIN: "1.100.0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.100.0", components: clippy }
      - uses: ./.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - name: Compare original plain-script projections and editor links
        run: |
          set -euo pipefail
          export VIZE_BRIDGE_INPUTS="$RUNNER_TEMP/original-plain-bridge-inputs"
          git ls-files -z -- '*.vue' '*.vue.txt' > "$VIZE_BRIDGE_INPUTS"
          flags=(--locked --profile ci-opt -p vize_canon --lib --features plain-script-bridges)
          cargo clippy "${flags[@]}" --no-deps -- -D warnings
          cargo test --locked --profile ci-opt --lib -p vize_l2 --features script-declaration-queries query::script::declaration::
          cargo test "${flags[@]}" plain_exports::observed:: -- --include-ignored --nocapture --test-threads=1

  ambient-component-project:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "24"
      CARGO_INCREMENTAL: "0"
      RUSTUP_TOOLCHAIN: "1.100.0"
      VIZE_TEST_REQUIRE_TSGO: "1"
      VIZE_TEST_TSGO_PATH: ${{ github.workspace }}/node_modules/@typescript/typescript-linux-x64/lib/tsc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.100.0", components: clippy }
      - uses: ./.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          { node-version-file: package.json, cache: true, run-install: false, cache-save: false }
      - run: vp install --frozen-lockfile --prefer-offline
      - name: Check authored ambient components in live native editor sessions
        run: |
          set -euo pipefail
          "$VIZE_TEST_TSGO_PATH" --version
          flags=(--locked --profile ci-opt -p vize_maestro --features experimental-ambient-project --lib)
          cargo clippy --locked --profile ci-opt -p vize_canon --features ambient-project-declarations --lib --no-deps -- -D warnings
          cargo clippy "${flags[@]}" --no-deps -- -D warnings
          cargo test --locked --profile ci-opt -p vize_canon --features ambient-project-declarations --lib virtual_project::ambient_declarations::
          cargo test "${flags[@]}" corsa::ambient_project:: -- --include-ignored --nocapture --test-threads=1
