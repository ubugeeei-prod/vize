name: Released Vapor HMR acceptance
on:
  pull_request:
    paths:
      - ".github/workflows/release-vapor-hmr-acceptance.yml"
      - "tools/support/release/vapor_hmr_acceptance/**"
  workflow_dispatch:
    inputs:
      cut: { description: Official immutable source C, required: true, type: string }
      head:
        {
          description: Published source H containing the Vapor HMR source fix,
          required: true,
          type: string,
        }
      tag: { description: Published stable minor tag, required: true, type: string }
      source_pr: { description: Official source PR, required: true, type: string }
      release_run: { description: Successful official Release R, required: true, type: string }
permissions: { contents: read }
concurrency:
  group: released-vapor-hmr-${{ inputs.release_run || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  public-browser:
    if: github.event_name == 'workflow_dispatch'
    name: Installed child HMR on Vue 3.6.0-rc.11
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PUBLIC_CUT: ${{ inputs.cut }}
      PUBLIC_HEAD: ${{ inputs.head }}
      PUBLIC_TAG: ${{ inputs.tag }}
      PUBLIC_SOURCE_PR: ${{ inputs.source_pr }}
      PUBLIC_RELEASE_RUN: ${{ inputs.release_run }}
    steps:
      - name: Require reviewed main and absent runtime overrides
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = ubugeeei-prod/vize
          test "$GITHUB_REF" = refs/heads/main
          for key in NODE_OPTIONS VIZE_BINDING_PATH VIZE_PREFER_WORKSPACE_BINDING NAPI_RS_NATIVE_LIBRARY_PATH NAPI_RS_FORCE_WASI VIZE_ALLOW_NATIVE_VERSION_MISMATCH CORSA_PATH CORSA_EXECUTABLE TSGO_PATH TSGO_EXECUTABLE LD_PRELOAD DYLD_INSERT_LIBRARIES VIZE_PUBLIC_NATIVE_CUSTODY VIZE_OXLINT_NATIVE_CUSTODY; do
            if [ -n "${!key:-}" ]; then
              echo "::error::Runtime override must be absent: $key"
              exit 1
            fi
          done
          printf 'PUBLIC_OUTPUT=%s/vize-public-vapor-hmr-evidence-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ github.workflow_sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: package.json, run-install: false }
      - name: Authenticate the release and preserve the HMR acceptance inputs
        run: |
          mkdir -p "$PUBLIC_OUTPUT"
          node tools/support/release/vapor_hmr_acceptance/prepare.ts 2>&1 | tee "$PUBLIC_OUTPUT/prepare.log"
      - name: Install exact public Vize and the supported Vue runtime
        working-directory: ${{ env.PUBLIC_HMR_CONSUMER }}
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org 2>&1 | tee "$PUBLIC_OUTPUT/install.log"
      - uses: ./.github/actions/setup-ubuntu-archive
      - name: Install real Chromium
        working-directory: ${{ env.PUBLIC_HMR_CONSUMER }}
        run: npx --no-install playwright install --with-deps chromium 2>&1 | tee "$PUBLIC_OUTPUT/chromium.log"
      - name: Replay repeated physical child saves with RouterView and KeepAlive
        working-directory: ${{ env.PUBLIC_HMR_CONSUMER }}
        run: node vapor_hmr_acceptance/runtime.ts 2>&1 | tee "$PUBLIC_OUTPUT/runtime.log"
      - name: Retain successful and failed public observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: released-vapor-hmr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vize-public-vapor-hmr-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30

  baseline-control:
    if: github.event_name == 'pull_request'
    name: Reproduce published 0.457.0 HMR failure
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      PUBLIC_OUTPUT: ${{ runner.temp }}/vize-vapor-hmr-baseline
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: package.json, run-install: false }
      - name: Prepare independent installed-package reproduction
        run: node tools/support/release/vapor_hmr_acceptance/prepare.ts baseline
      - name: Install exact public baseline
        working-directory: ${{ env.PUBLIC_HMR_CONSUMER }}
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - uses: ./.github/actions/setup-ubuntu-archive
      - name: Install real Chromium
        working-directory: ${{ env.PUBLIC_HMR_CONSUMER }}
        run: npx --no-install playwright install --with-deps chromium
      - name: Require the exact reported inRoom failure after a physical child save
        working-directory: ${{ env.PUBLIC_HMR_CONSUMER }}
        run: node vapor_hmr_acceptance/runtime.ts
      - name: Retain baseline browser observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vapor-hmr-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PUBLIC_OUTPUT }}
          if-no-files-found: error
          retention-days: 30
