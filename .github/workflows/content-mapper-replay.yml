# DO NOT EDIT. Generated from tools/config/pkl/workflows/typecheck/content-mapper-replay.pkl.
# Edit the Pkl source and run `node tools/commands/generate/repository-config.ts`.
name: Content mapper replay
run-name: "Content mapper replay ${{ inputs.head || github.sha }} vs ${{ inputs.base || 'merge base' }}"
# Two commits answer the request streams tsc sends for real corpora. Replies
# must match byte for byte; the report times the native CLI and the npm
# launcher, counts allocations and syscalls, and profiles the head CLI with perf.
# A push to bench/content-mapper-replay/** measures the pushed commit against
# its merge base with main, or against the commit a `Replay-Base: <sha>`
# trailer of the pushed commit names, on every corpus with every option on.
on:
  push:
    branches: ["bench/content-mapper-replay/**"]
  workflow_dispatch:
    inputs:
      base:
        description: Full 40-hex commit measured first (the "before")
        type: string
        required: true
      head:
        description: Full 40-hex commit compared against it
        type: string
        required: true
      corpora:
        description: Comma-separated corpora (misskey, n8n, reka-ui, nuxt-ui)
        type: string
        default: "misskey,n8n,reka-ui,nuxt-ui"
      runs:
        description: Alternating timed runs per mapper and mode
        type: string
        default: "5"
      launcher:
        description: Also replay through the npm launcher and a release build of @vizejs/native
        type: boolean
        default: true
      profile:
        description: Also perf-profile the head CLI and count allocations (--features profiling) and syscalls
        type: boolean
        default: true
      allow_output_change:
        description: Publish timing even when the builds answer differently
        type: boolean
        default: false
      host_runs:
        description: Alternating tsc and tsrs --fast runs per mapper through a timing proxy (0 skips)
        type: string
        default: "3"
  # Registers the dispatch-only workflow from its PR; only the tests run there.
  pull_request:
    paths:
      - .github/workflows/content-mapper-replay.yml
      - .github/scripts/workflows/content-mapper-replay/**
      - tools/benchmarks/scripts/content-mapper-replay*.ts
      - tests/tooling/content-mapper-replay*.test.ts
permissions: { contents: read }
concurrency:
  group: content-mapper-replay-${{ github.event.pull_request.number || github.ref }}-${{ inputs.head }}-${{ inputs.base }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  test:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - run: node --test tests/tooling/content-mapper-replay.test.ts

  resolve:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      base: ${{ steps.shas.outputs.base }}
      head: ${{ steps.shas.outputs.head }}
    env:
      VIZE_CI_FILES: "${{ github.workspace }}/.github/scripts/workflows/content-mapper-replay"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false, fetch-depth: 0 }
      - id: shas
        env:
          BASE: ${{ inputs.base }}
          HEAD: ${{ inputs.head || github.sha }}
        run: . "${{ env.VIZE_CI_FILES }}/shas.sh"

  # cli: the shipped CLI profile. alloc: the same with --features profiling,
  # which counts allocations. perf: head only, with line tables, symbols and
  # frame pointers (C dependencies included) for perf's frame-pointer unwinder.
  build:
    needs: resolve
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 90
    strategy:
      matrix:
        variant: [cli, alloc, perf]
    env:
      BASE: ${{ needs.resolve.outputs.base }}
      HEAD: ${{ needs.resolve.outputs.head }}
      RUSTUP_TOOLCHAIN: "1.100.0"
      VARIANT: ${{ matrix.variant }}
      PROFILE_INPUT: ${{ github.event_name == 'push' || inputs.profile }}
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/content-mapper-replay/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - name: Validate inputs
        run: . "${{ env.VIZE_CI_FILES }}/validate-inputs.sh"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: env.VARIANT == 'cli' || env.PROFILE_INPUT == 'true'
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        if: env.VARIANT == 'cli' || env.PROFILE_INPUT == 'true'
        with: { toolchain: "1.100.0" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        if: env.VARIANT == 'cli' || env.PROFILE_INPUT == 'true'
        with: { wild-version: "0.9.0" }
      - name: Build
        if: env.VARIANT == 'cli' || env.PROFILE_INPUT == 'true'
        run: . "${{ env.VIZE_CI_FILES }}/build.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.VARIANT == 'cli' || env.PROFILE_INPUT == 'true'
        with:
          name: replay-bin-${{ matrix.variant }}
          path: replay-bin/
          retention-days: 7

  replay:
    needs: [resolve, build]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 120
    env:
      BASE: ${{ needs.resolve.outputs.base }}
      HEAD: ${{ needs.resolve.outputs.head }}
      CORPORA: ${{ inputs.corpora || 'misskey,n8n,reka-ui,nuxt-ui' }}
      RUNS: ${{ inputs.runs || '5' }}
      LAUNCHER: ${{ github.event_name == 'push' || inputs.launcher }}
      PROFILE: ${{ github.event_name == 'push' || inputs.profile }}
      ALLOW: ${{ inputs.allow_output_change && '--allow-output-change' || '' }}
      HOST_RUNS: ${{ inputs.host_runs || '3' }}
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/content-mapper-replay/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - name: Validate inputs
        run: . "${{ env.VIZE_CI_FILES }}/validate-inputs-2.sh"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        if: env.LAUNCHER == 'true'
        with: { toolchain: "1.100.0" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        if: env.LAUNCHER == 'true'
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-script
        if: env.LAUNCHER == 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { pattern: replay-bin-*, path: replay-bin, merge-multiple: true }
      - name: Hydrate the corpora and install the locked hosts and corpus packages
        run: . "${{ env.VIZE_CI_FILES }}/hydrate-the-corpora-and-install-the-locked-hosts-and-corpus-packages.sh"
      - name: Build the npm launcher and the native binding for base and head
        if: env.LAUNCHER == 'true'
        run: . "${{ env.VIZE_CI_FILES }}/build-the-npm-launcher-and-the-native-binding-for-base-and-head.sh"
      - name: Record tsc's request streams
        run: . "${{ env.VIZE_CI_FILES }}/record-tsc-s-request-streams.sh"
      - name: Replay
        run: . "${{ env.VIZE_CI_FILES }}/replay.sh"
      - name: Host runs through a timing proxy
        if: env.HOST_RUNS != '0'
        run: . "${{ env.VIZE_CI_FILES }}/host-runs-through-a-timing-proxy.sh"
      - name: Count allocations
        if: env.PROFILE == 'true'
        run: . "${{ env.VIZE_CI_FILES }}/count-allocations.sh"
      - name: Profile the head CLI and count syscalls
        if: env.PROFILE == 'true'
        run: . "${{ env.VIZE_CI_FILES }}/profile-the-head-cli-and-count-syscalls.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: replay-out, path: "${{ runner.temp }}/replay-out/", if-no-files-found: warn }
