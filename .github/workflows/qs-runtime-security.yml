name: qs runtime security contracts
on:
  pull_request:
    branches: [main]
    paths:
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - npm/mcp-musea/**
      - tools/support/security/qs-runtime-*.ts
      - .github/workflows/qs-runtime-security.yml
  push:
    branches: [main]
    paths:
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - npm/mcp-musea/**
      - tools/support/security/qs-runtime-*.ts
      - .github/workflows/qs-runtime-security.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qs-runtime-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install exact source dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Build and pack the actual MCP server
        run: |
          vp run --filter @vizejs/musea-mcp-server build
          mkdir -p "$RUNNER_TEMP/qs-runtime-pack"
          vp exec pnpm --dir npm/mcp-musea pack --pack-destination "$RUNNER_TEMP/qs-runtime-pack"
      - name: Require original negative, repaired runtime, full upstream and fresh consumer contracts
        run: |
          node tools/support/security/qs-runtime-consumer.ts "$RUNNER_TEMP/qs-runtime-proof" "$RUNNER_TEMP"/qs-runtime-pack/*.tgz
      - name: Preserve full sources, producer identities, graphs and raw process packets
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qs-runtime-security-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/qs-runtime-proof
            ${{ runner.temp }}/qs-runtime-pack
          if-no-files-found: error
          retention-days: 14
