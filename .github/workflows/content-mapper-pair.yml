name: Content mapper pair
run-name: "Content mapper pair ${{ inputs.head }} vs ${{ inputs.base }} (${{ inputs.sizes }})"
# Two commits answer one content-mapper request stream on Linux, WSL2 (ext4 and
# the Windows mount) and native Windows, alternating builds per run.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Full 40-hex commit measured first (the "before")
        type: string
        required: true
      head:
        description: Full 40-hex commit compared against it
        type: string
        required: true
      sizes:
        description: Comma-separated SFC counts of the generated projects
        type: string
        default: "1000,5000"
      runs:
        description: Alternating recorded runs per build
        type: string
        default: "5"
      allow_output_change:
        description: Publish timing even when the builds answer differently
        type: boolean
        default: false
      reference_mapper:
        description: Also time @vue/content-mapper (pinned in tools/benchmarks/typecheck-hosts) as a reference row
        type: boolean
        default: false
      syscall_census:
        description: Also count the Linux filesystem syscalls per transform for both builds (strace)
        type: boolean
        default: false
      memory_probe:
        description: Also time the head build's Linux burst peak RSS by worker count (taskset) and mimalloc options
        type: boolean
        default: false
      windows_probe:
        description: Also time the head build on Windows with stdout to NUL and with a Defender exclusion
        type: boolean
        default: false
  # Registers the dispatch-only workflow from its PR; only the tests run there.
  pull_request:
    paths:
      - .github/workflows/content-mapper-pair.yml
      - tools/benchmarks/scripts/content-mapper-pair*.ts
      - tests/tooling/content-mapper-pair*.test.ts
permissions: { contents: read }
concurrency:
  group: content-mapper-pair-${{ github.event.pull_request.number || inputs.head }}-${{ inputs.base }}-${{ inputs.sizes }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  test:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - run: node --test tests/tooling/content-mapper-pair.test.ts

  # Linux and Windows build separately so the Linux and WSL2 cells start
  # without waiting for the slower Windows build.
  build-linux:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      BASE: ${{ inputs.base }}
      HEAD: ${{ inputs.head }}
      PAIR_OS: linux
      PAIR_EXE: vize
    steps: &build-steps
      - name: Validate inputs
        shell: bash
        run: |
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - name: Setup MSVC toolchain
        if: env.PAIR_OS == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with: { arch: amd64 }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        if: env.PAIR_OS == 'linux'
        with: { wild-version: "0.9.0" }
      - name: Build both commits
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/pair-target"
          for side in base head; do
            sha=$BASE; [[ $side == head ]] && sha=$HEAD
            git fetch --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$sha"
            git worktree add --detach "$RUNNER_TEMP/src-$side" "$sha"
            # One target directory: the second build recompiles only what differs.
            (cd "$RUNNER_TEMP/src-$side" && CARGO_TARGET_DIR="$target" cargo build --profile ci-opt -p vize --bin vize)
            mkdir -p "pair-bin/$side"
            cp "$target/ci-opt/$PAIR_EXE" "pair-bin/$side/"
          done
          ls -l pair-bin/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pair-bin-${{ env.PAIR_OS }}
          path: pair-bin/
          retention-days: 7

  build-windows:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: blacksmith-32vcpu-windows-2025
    timeout-minutes: 90
    env:
      BASE: ${{ inputs.base }}
      HEAD: ${{ inputs.head }}
      PAIR_OS: windows
      PAIR_EXE: vize.exe
    steps: *build-steps

  linux:
    needs: build-linux
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: pair-bin-linux, path: pair-bin }
      - name: Measure
        env:
          SIZES: ${{ inputs.sizes }}
          RUNS: ${{ inputs.runs }}
          ALLOW: ${{ inputs.allow_output_change && '--allow-output-change' || '' }}
          REFERENCE: ${{ inputs.reference_mapper }}
        run: |
          set -euo pipefail
          [[ "$SIZES" =~ ^[0-9]+(,[0-9]+)*$ ]] && [[ "$RUNS" =~ ^[1-9][0-9]?$ ]]
          if ! /usr/bin/time --version 2>&1 | grep -qi 'GNU time'; then
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends time
          fi
          chmod +x pair-bin/*/vize
          reference=()
          if [[ "$REFERENCE" == "true" ]]; then
            npm ci --prefix tools/benchmarks/typecheck-hosts --ignore-scripts --no-audit --no-fund > /dev/null
            hosts=tools/benchmarks/typecheck-hosts/node_modules
            reference=(--reference "vue-mapper=$hosts/@vue/content-mapper/server.js" --typescript "$hosts/typescript")
          fi
          node tools/benchmarks/scripts/content-mapper-pair.ts \
            --bin base=pair-bin/base/vize --bin head=pair-bin/head/vize "${reference[@]}" \
            --root "$RUNNER_TEMP/pair" --sizes "$SIZES" --runs "$RUNS" $ALLOW \
            --label linux-ext4 --out "$RUNNER_TEMP/pair-out" > /dev/null
          cat "$RUNNER_TEMP/pair-out/pair-linux-ext4.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Memory probe
        if: inputs.memory_probe
        env:
          SIZES: ${{ inputs.sizes }}
        run: |
          set -euo pipefail
          size=$(echo "$SIZES" | tr "," "\n" | sort -n | tail -1)
          project="$RUNNER_TEMP/pair/vue-$size"
          stream="$RUNNER_TEMP/pair/stream-$size.bin"
          bin="$PWD/pair-bin/head/vize"
          probe() {
            local label=$1; shift
            local peaks=()
            for _ in 1 2 3; do
              (cd "$project" && env "$@" /usr/bin/time -f "%M %e %U %S" -o "$RUNNER_TEMP/mem.txt" "$bin" content-mapper < "$stream" > /dev/null)
              peaks+=("$(cat "$RUNNER_TEMP/mem.txt")")
            done
            printf '%s\n' "${peaks[@]}" | sort -n | sed -n 2p | awk -v l="$label" '{ printf "| %s | %.1f | %.2f | %.2f |\n", l, $1 / 1024, $2, $3 + $4 }'
          }
          {
            echo "### Linux burst memory probe ($size SFCs, head, median of 3, $(nproc) vCPUs)"
            echo ""
            echo "| variant | peak RSS MiB | wall s | CPU s |"
            echo "|---|---|---|---|"
            probe "all cores, default" X=1
            for cores in 4 8 16; do probe "taskset $cores cores" X=1 taskset -c "0-$((cores - 1))"; done
            probe "MIMALLOC_PURGE_DELAY=0" MIMALLOC_PURGE_DELAY=0
            probe "MIMALLOC_ARENA_EAGER_COMMIT=0" MIMALLOC_ARENA_EAGER_COMMIT=0
            probe "both mimalloc options" MIMALLOC_PURGE_DELAY=0 MIMALLOC_ARENA_EAGER_COMMIT=0
            probe "THP never (madvise off)" MIMALLOC_ALLOW_LARGE_OS_PAGES=0
            echo ""
            cat /sys/kernel/mm/transparent_hugepage/enabled | sed 's/^/THP: /'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Syscall census
        if: inputs.syscall_census
        env:
          SIZES: ${{ inputs.sizes }}
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends strace > /dev/null
          size=$(echo "$SIZES" | tr "," "\n" | sort -n | head -1)
          node tools/benchmarks/scripts/content-mapper-census.ts \
            --bin base=pair-bin/base/vize --bin head=pair-bin/head/vize \
            --project "$RUNNER_TEMP/pair/vue-$size" --stream "$RUNNER_TEMP/pair/stream-$size.bin" \
            --label "linux-ext4, $size SFCs" --out "$RUNNER_TEMP/pair-out/census.md" > /dev/null
          cat "$RUNNER_TEMP/pair-out/census.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: pair-linux, path: "${{ runner.temp }}/pair-out/", if-no-files-found: warn }

  wsl2:
    needs: build-linux
    # WSL2 needs nested virtualization; Blacksmith Windows runners lack it.
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: "2"
          wsl-shell-user: root
          additional-packages: ca-certificates curl time xz-utils
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: pair-bin-linux, path: pair-bin }
      - name: Resolve the Windows mount
        shell: pwsh
        run: |
          $windowsPath = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $drive = $windowsPath.Substring(0, 1).ToLowerInvariant()
          $tail = $windowsPath.Substring(2).Replace('\', '/')
          $mount = "/mnt/$drive$tail"
          wsl.exe test -d $mount
          if ($LASTEXITCODE -ne 0) { throw "WSL mount is unavailable: $mount" }
          "WSL_MOUNT_ROOT=$mount/vize-pair" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install Node 24 in WSL2
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          version=24.14.0
          curl -fsSLO "https://nodejs.org/dist/v$version/node-v$version-linux-x64.tar.xz"
          curl -fsSLO "https://nodejs.org/dist/v$version/SHASUMS256.txt"
          grep " node-v$version-linux-x64.tar.xz$" SHASUMS256.txt | sha256sum --check
          tar -xJf "node-v$version-linux-x64.tar.xz" -C /usr/local --strip-components=1
          node --version
          uname -a
      - name: Measure ext4 and the Windows mount
        shell: wsl-bash {0}
        env:
          SIZES: ${{ inputs.sizes }}
          RUNS: ${{ inputs.runs }}
          ALLOW: ${{ inputs.allow_output_change && '--allow-output-change' || '' }}
          REFERENCE: ${{ inputs.reference_mapper }}
          WSLENV: SIZES/u:RUNS/u:ALLOW/u:REFERENCE/u:WSL_MOUNT_ROOT/u:GITHUB_STEP_SUMMARY/u
        run: |
          set -euo pipefail
          [[ "$SIZES" =~ ^[0-9]+(,[0-9]+)*$ ]] && [[ "$RUNS" =~ ^[1-9][0-9]?$ ]]
          # Binaries run from ext4 in both cells; only the project location differs.
          bin="$HOME/pair-bin"
          mkdir -p "$bin/base" "$bin/head" "$WSL_MOUNT_ROOT"
          cp pair-bin/base/vize "$bin/base/vize" && cp pair-bin/head/vize "$bin/head/vize"
          chmod +x "$bin"/*/vize
          summary_path=$(wslpath "$GITHUB_STEP_SUMMARY")
          reference=()
          if [[ "$REFERENCE" == "true" ]]; then
            # Install on ext4: a node_modules on the Windows mount would also time 9P module loading.
            mkdir -p "$HOME/hosts"
            cp tools/benchmarks/typecheck-hosts/package.json tools/benchmarks/typecheck-hosts/package-lock.json "$HOME/hosts/"
            npm ci --prefix "$HOME/hosts" --ignore-scripts --no-audit --no-fund > /dev/null
            reference=(--reference "vue-mapper=$HOME/hosts/node_modules/@vue/content-mapper/server.js" --typescript "$HOME/hosts/node_modules/typescript")
          fi
          for entry in "wsl2-ext4=$HOME/vize-pair" "wsl2-windows-mount=$WSL_MOUNT_ROOT/projects"; do
            label=${entry%%=*}
            node tools/benchmarks/scripts/content-mapper-pair.ts \
              --bin "base=$bin/base/vize" --bin "head=$bin/head/vize" "${reference[@]}" \
              --root "${entry#*=}" --sizes "$SIZES" --runs "$RUNS" $ALLOW \
              --label "$label" --out "$WSL_MOUNT_ROOT/out" > /dev/null
            cat "$WSL_MOUNT_ROOT/out/pair-$label.md" >> "$summary_path"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: pair-wsl2, path: "${{ runner.temp }}/vize-pair/out/", if-no-files-found: warn }

  windows:
    needs: build-windows
    runs-on: blacksmith-32vcpu-windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: pair-bin-windows, path: pair-bin }
      - name: Measure
        shell: pwsh
        env:
          SIZES: ${{ inputs.sizes }}
          RUNS: ${{ inputs.runs }}
          ALLOW: ${{ inputs.allow_output_change && '--allow-output-change' || '' }}
          REFERENCE: ${{ inputs.reference_mapper }}
        run: |
          if ($env:SIZES -notmatch '^[0-9]+(,[0-9]+)*$' -or $env:RUNS -notmatch '^[1-9][0-9]?$') { throw "invalid inputs" }
          $out = Join-Path $env:RUNNER_TEMP 'pair-out'
          $extra = @(); if ($env:ALLOW) { $extra += $env:ALLOW }
          if ($env:REFERENCE -eq 'true') {
            npm ci --prefix tools/benchmarks/typecheck-hosts --ignore-scripts --no-audit --no-fund | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "hosts install failed" }
            $hosts = "$PWD\tools\benchmarks\typecheck-hosts\node_modules"
            $extra += @('--reference', "vue-mapper=$hosts\@vue\content-mapper\server.js", '--typescript', "$hosts\typescript")
          }
          node tools/benchmarks/scripts/content-mapper-pair.ts `
            --bin "base=$PWD\pair-bin\base\vize.exe" --bin "head=$PWD\pair-bin\head\vize.exe" `
            --root (Join-Path $env:RUNNER_TEMP 'pair') --sizes $env:SIZES --runs $env:RUNS @extra `
            --label windows-ntfs --out $out | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pair failed" }
          Get-Content (Join-Path $out 'pair-windows-ntfs.md') | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Probe Windows burst costs
        if: inputs.windows_probe
        shell: pwsh
        env:
          SIZES: ${{ inputs.sizes }}
        run: |
          $size = ($env:SIZES -split ',' | ForEach-Object { [int]$_ } | Measure-Object -Maximum).Maximum
          $root = Join-Path $env:RUNNER_TEMP 'pair'
          $project = Join-Path $root "vue-$size"
          $stream = Join-Path $root "stream-$size.bin"
          $out = Join-Path $root 'probe.out'
          $exe = "$PWD\pair-bin\head\vize.exe"
          $defender = $null -ne (Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue) -and
            $null -ne (Get-MpComputerStatus -ErrorAction SilentlyContinue)
          "Defender available: $defender" | Write-Output
          function Median([scriptblock]$run) {
            $samples = foreach ($i in 1..5) {
              $w = [System.Diagnostics.Stopwatch]::StartNew(); & $run; $w.Stop(); $w.Elapsed.TotalMilliseconds
            }
            [math]::Round(($samples | Sort-Object)[2])
          }
          function StartProcess([string]$target) {
            Start-Process -FilePath $exe -ArgumentList 'content-mapper' -WorkingDirectory $project `
              -RedirectStandardInput $stream -RedirectStandardOutput $target -NoNewWindow -Wait
          }
          $rows = @("### Windows burst probe ($size SFCs, head, median of 5)", '', '| launch | stdout | wall ms |', '|---|---|---|')
          $rows += "| Start-Process redirect | file | $(Median { StartProcess $out }) |"
          $rows += "| Start-Process redirect | NUL | $(Median { StartProcess 'NUL' }) |"
          if ($defender) {
            Add-MpPreference -ExclusionPath $root, (Split-Path $exe)
            Start-Sleep -Seconds 2
            $rows += "| Start-Process redirect, Defender exclusion | file | $(Median { StartProcess $out }) |"
          }
          $rows | Write-Output
          $rows + '' | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: pair-windows, path: "${{ runner.temp }}/pair-out/", if-no-files-found: warn }
