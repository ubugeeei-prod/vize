name: Content mapper pair
run-name: "Content mapper pair ${{ inputs.head }} vs ${{ inputs.base }} (${{ inputs.sizes }})"
# Two commits answer one content-mapper request stream on Linux, WSL2 (ext4 and
# the Windows mount) and native Windows, balancing both build orders per replicate.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Full 40-hex commit measured first (the "before")
        type: string
        required: true
      head:
        description: Full 40-hex commit compared against it
        type: string
        required: true
      sizes:
        description: Comma-separated SFC counts of the generated projects
        type: string
        default: "1000,5000"
      runs:
        description: Balanced AB+BA replicates per build
        type: string
        default: "5"
      allow_output_change:
        description: Publish timing even when the builds answer differently
        type: boolean
        default: false
      reference_mapper:
        description: Also time @vue/content-mapper (pinned in tools/benchmarks/typecheck-hosts) as a reference row
        type: boolean
        default: false
      syscall_census:
        description: Also count the Linux filesystem syscalls per transform for both builds (strace)
        type: boolean
        default: false
      memory_probe:
        description: Also time the head build's Linux burst peak RSS by worker count (taskset) and mimalloc options
        type: boolean
        default: false
      windows_probe:
        description: Also time the head build on Windows with stdout to NUL and with a Defender exclusion
        type: boolean
        default: false
  # Registers the dispatch-only workflow from its PR; only the tests run there.
  pull_request:
    paths:
      - .github/workflows/content-mapper-pair.yml
      - .github/scripts/workflows/content-mapper-pair/**
      - tools/benchmarks/scripts/content-mapper-pair*.ts
      - tools/benchmarks/scripts/content-mapper-burst-windows.ps1
      - tests/tooling/content-mapper-pair*.test.ts
permissions: { contents: read }
concurrency:
  group: content-mapper-pair-${{ github.event.pull_request.number || inputs.head }}-${{ inputs.base }}-${{ inputs.sizes }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  test:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - run: node --test tests/tooling/content-mapper-pair.test.ts

  # Linux and Windows build separately so the Linux and WSL2 cells start
  # without waiting for the slower Windows build.
  build-linux:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      BASE: ${{ inputs.base }}
      HEAD: ${{ inputs.head }}
      RUSTUP_TOOLCHAIN: "1.100.0"
      PAIR_OS: linux
      PAIR_EXE: vize
    steps: &build-steps
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/content-mapper-pair/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - name: Validate inputs
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/validate-inputs.sh"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - name: Setup MSVC toolchain
        if: env.PAIR_OS == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with: { arch: amd64 }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.100.0" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        if: env.PAIR_OS == 'linux'
        with: { wild-version: "0.9.0" }
      - name: Build both commits
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/build-both-commits.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pair-bin-${{ env.PAIR_OS }}
          path: pair-bin/
          retention-days: 7

  build-windows:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: blacksmith-32vcpu-windows-2025
    timeout-minutes: 90
    env:
      BASE: ${{ inputs.base }}
      HEAD: ${{ inputs.head }}
      PAIR_OS: windows
      PAIR_EXE: vize.exe
    steps: *build-steps

  linux:
    needs: build-linux
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      VIZE_CI_FILES: "${{ github.workspace }}/.github/scripts/workflows/content-mapper-pair"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: pair-bin-linux, path: pair-bin }
      - name: Measure
        env:
          SIZES: ${{ inputs.sizes }}
          RUNS: ${{ inputs.runs }}
          ALLOW: ${{ inputs.allow_output_change && '--allow-output-change' || '' }}
          REFERENCE: ${{ inputs.reference_mapper }}
        run: . "${{ env.VIZE_CI_FILES }}/measure.sh"
      - name: Memory probe
        if: inputs.memory_probe
        env:
          SIZES: ${{ inputs.sizes }}
        run: . "${{ env.VIZE_CI_FILES }}/memory-probe.sh"
      - name: Syscall census
        if: inputs.syscall_census
        env:
          SIZES: ${{ inputs.sizes }}
        run: . "${{ env.VIZE_CI_FILES }}/syscall-census.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: pair-linux, path: "${{ runner.temp }}/pair-out/", if-no-files-found: warn }

  wsl2:
    needs: build-linux
    # WSL2 needs nested virtualization; Blacksmith Windows runners lack it.
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      VIZE_CI_FILES: "${{ github.workspace }}/.github/scripts/workflows/content-mapper-pair"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: "2"
          wsl-shell-user: root
          additional-packages: ca-certificates curl time xz-utils
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: pair-bin-linux, path: pair-bin }
      - name: Resolve the Windows mount
        shell: pwsh
        run: . "${{ env.VIZE_CI_FILES }}/resolve-the-windows-mount.ps1"
      - name: Install Node 24 in WSL2
        shell: wsl-bash {0}
        run: . "$VIZE_CI_FILES/install-node-24-in-wsl2.sh"
        env:
          WSLENV: "VIZE_CI_FILES/p"
      - name: Measure ext4 and the Windows mount
        shell: wsl-bash {0}
        env:
          SIZES: ${{ inputs.sizes }}
          RUNS: ${{ inputs.runs }}
          ALLOW: ${{ inputs.allow_output_change && '--allow-output-change' || '' }}
          REFERENCE: ${{ inputs.reference_mapper }}
          WSLENV: "SIZES/u:RUNS/u:ALLOW/u:REFERENCE/u:WSL_MOUNT_ROOT/u:GITHUB_STEP_SUMMARY/u:VIZE_CI_FILES/p"
        run: . "$VIZE_CI_FILES/measure-ext4-and-the-windows-mount.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pair-wsl2
          path: "${{ runner.temp }}/vize-pair/out/"
          if-no-files-found: warn

  windows:
    needs: build-windows
    runs-on: blacksmith-32vcpu-windows-2025
    timeout-minutes: 90
    env:
      VIZE_CI_FILES: "${{ github.workspace }}/.github/scripts/workflows/content-mapper-pair"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: pair-bin-windows, path: pair-bin }
      - name: Measure
        shell: pwsh
        env:
          SIZES: ${{ inputs.sizes }}
          RUNS: ${{ inputs.runs }}
          ALLOW: ${{ inputs.allow_output_change && '--allow-output-change' || '' }}
          REFERENCE: ${{ inputs.reference_mapper }}
        run: . "${{ env.VIZE_CI_FILES }}/measure.ps1"
      - name: Probe Windows burst costs
        if: inputs.windows_probe
        shell: pwsh
        env:
          SIZES: ${{ inputs.sizes }}
        run: . "${{ env.VIZE_CI_FILES }}/probe-windows-burst-costs.ps1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: pair-windows, path: "${{ runner.temp }}/pair-out/", if-no-files-found: warn }
