name: Rust feature tests
on:
  workflow_call: {}
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  rust-feature-plan:
    name: Plan Rust feature tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: List every feature row
        id: plan
        run: node tools/ci/commands/rust-feature-tests.ts matrix
  rust-feature-tests:
    name: Rust feature tests (${{ matrix.row }})
    if: ${{ success() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.rust-feature-plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: "24"
      CARGO_INCREMENTAL: "0"
      NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
      ROW: ${{ matrix.row }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        if: runner.os == 'Linux'
        with:
          wild-version: 0.9.0
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: rust-feature-tests
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install frozen source dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Run the feature row
        run: node tools/ci/commands/rust-feature-tests.ts run "$ROW"
    needs: rust-feature-plan
