name: Nuxt generated declaration membership
run-name: Nuxt generated declaration membership @ ${{ github.event.pull_request.head.sha || github.sha }}
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/nuxt-generated-membership.yml
      - .github/scripts/workflows/nuxt-generated-membership/**
      - .github/scripts/workflows/shared/**
      - crates/vize/tests/check_cli.rs
      - crates/vize/src/commands/check/nuxt/**
      - crates/vize/src/commands/check/nuxt.rs
      - crates/vize/src/commands/check/tsconfig_inputs.rs
      - crates/vize/src/commands/check/tsconfig_inputs/**
      - crates/vize/src/commands/check/runner/execution.rs
      - crates/vize_canon/src/batch/virtual_project/tsconfig_gen/**
permissions:
  contents: read
concurrency:
  group: nuxt-generated-membership-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "12"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  configured-membership:
    name: Required native and stock Nuxt complete packets
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/nuxt-generated-membership/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: "1.100.0"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: nuxt-generated-membership
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install pinned stock and native providers
        run: vp install --frozen-lockfile --prefer-offline
      - name: Require real backends and preserve source identity
        run: . "${{ env.VIZE_CI_FILES }}/require-real-backends-and-preserve-source-identity.sh"
      - name: Verify original negative and configured reference positive whole packets
        env:
          VIZE_TEST_REQUIRE_TSGO: "1"
          VIZE_TEST_STOCK_VUE_TSC: ${{ github.workspace }}/tests/node_modules/vue-tsc/bin/vue-tsc.js
          VIZE_NUXT_MEMBERSHIP_ARTIFACTS: ${{ runner.temp }}/nuxt-membership-packets
        run: cargo test --locked --profile ci -p vize --test integration check_cli::check_nuxt_generated_computed_map_values_preserve_record_types -- --exact --nocapture
      - name: Require every executed native stock and graph control
        env:
          PACKETS: ${{ runner.temp }}/nuxt-membership-packets
        run: . "${{ env.VIZE_CI_FILES }}/require-every-executed-native-stock-and-graph-control.sh"
      - name: Preserve actual executable and providers
        if: ${{ always() }}
        run: . "${{ env.VIZE_CI_FILES }}/preserve-actual-executable-and-providers.sh"
      - name: Preserve every complete packet and original input
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuxt-membership-whole-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nuxt-membership-packets
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
