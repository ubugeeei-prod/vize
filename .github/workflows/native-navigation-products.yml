name: Native navigation products
on:
  pull_request:
    paths:
      - "davinci/vize_l2/src/query/**"
      - "davinci/vize_l1_to_l2/Cargo.toml"
      - "davinci/vize_l1_to_l2/src/native_file.rs"
      - "davinci/vize_l1_to_l2/src/native_file/**"
      - "crates/vize_maestro/Cargo.toml"
      - "crates/vize_maestro/src/source_project/navigation.rs"
      - "crates/vize_maestro/src/source_project/navigation/**"
      - ".github/workflows/native-navigation-products.yml"
      - ".github/scripts/workflows/native-navigation-products/**"
permissions: { contents: read }
concurrency:
  group: native-navigation-products-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  navigation-products:
    name: Native navigation ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: [correctness, performance]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "24"
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "16777216"
      RUSTUP_TOOLCHAIN: "1.100.0"
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/native-navigation-products/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: matrix.suite == 'correctness'
        with: { node-version-file: "package.json", package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.100.0", components: clippy }
      - uses: ./.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: native-navigation-products-cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Select tracked original Vue inputs
        run: . "${{ env.VIZE_CI_FILES }}/select-tracked-original-vue-inputs.sh"
      - name: Check real File membership and complete editor responses
        if: matrix.suite == 'correctness'
        run: . "${{ env.VIZE_CI_FILES }}/check-real-file-membership-and-complete-editor-responses.sh"
      - name: Measure complete requests through the editor mailbox
        if: matrix.suite == 'performance'
        run: . "${{ env.VIZE_CI_FILES }}/measure-complete-requests-through-the-editor-mailbox.sh"
