name: Release smoke contracts
on:
  pull_request:
    paths:
      - ".github/workflows/release-smoke-contracts.yml"
      - ".github/workflows/release.yml"
      - ".github/actions/release-npm-artifacts/**"
      - ".github/actions/setup-runtime-package-managers/**"
      - "tools/commands/release/npm/smoke-release-install.ts"
      - "tools/support/release/smoke_release_install/**"
      - "tools/support/compat/npm/smoke-*"
      - "tests/tooling/release/release-smoke-*"
      - "tests/tooling/support/release-smoke-*"
      - "tests/tooling/github-workflows-release-build.test.ts"
      - "tests/tooling/release/release-workflow.test.ts"
      - "tests/tooling/native-build-token.test.ts"
      - "tests/tooling/native-binding-identity.test.ts"
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: release-smoke-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  contracts:
    name: Release smoke contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            blacksmith-32vcpu-ubuntu-2404,
            "${{ vars.VIZE_RELEASE_MACOS_RUNNER || 'blacksmith-12vcpu-macos-15' }}",
            blacksmith-32vcpu-windows-2025,
          ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-runtime-package-managers
      - name: Install source contract dependencies
        shell: bash
        run: >-
          vp install --frozen-lockfile --prefer-offline
          --filter vize-workspace --filter '@vize/tests' --filter '@vize/tools' --ignore-scripts
      - name: Require the stable Node release smoke contracts
        shell: bash
        run: node --test tests/tooling/release/release-smoke-parity-peer-copy.test.ts tests/tooling/release/release-smoke-install.test.ts tests/tooling/release/release-smoke-runtime-oracle.test.ts tests/tooling/release/release-smoke-typescript-runtime.test.ts
      - name: Require installed public native image and existing image-token laws
        shell: bash
        run: node --test tests/tooling/release/release-smoke-public-native.test.ts tests/tooling/native-build-token.test.ts tests/tooling/native-binding-identity.test.ts
      - name: Require release caller and fresh-project workflow wiring
        shell: bash
        run: node --test tests/tooling/github-workflows-release-build.test.ts tests/tooling/release/release-workflow.test.ts tests/tooling/release/release-smoke-init-fresh.test.ts tests/tooling/release/release-smoke-init-toolchain.test.ts tests/tooling/release/release-smoke-musl.test.ts
