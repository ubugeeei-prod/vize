name: Prepare npm first-publish handoff

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact candidate version without the v prefix
        required: true
        type: string
      tag_name:
        description: Immutable candidate tag (must be v plus version)
        required: true
        type: string
      release_run_id:
        description: Completed failed Release workflow run ID
        required: true
        type: string
      package_path:
        description: Explicitly approved package from the npm-packages artifact
        required: true
        type: choice
        options:
          - npm/framework/nuxt-lint-config
          - npm/plugin-sdk

run-name: Prepare npm handoff for ${{ inputs.package_path }} from ${{ inputs.tag_name }} run ${{ inputs.release_run_id }}

concurrency:
  group: npm-bootstrap-${{ inputs.package_path }}
  cancel-in-progress: false

permissions: { actions: read, contents: read }

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BOOTSTRAP_PACKAGE_PATH: ${{ inputs.package_path }}
  RELEASE_RUN_ID: ${{ inputs.release_run_id }}
  RELEASE_TAG_NAME: ${{ inputs.tag_name }}
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  handoff:
    name: Prepare credential-free npm CLI handoff
    if: github.repository == 'ubugeeei-prod/vize' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout bootstrap policy from main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { fetch-depth: 1, persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: "package.json", package-manager-cache: false }
      - name: Bind the candidate, failed Release run and exact package artifact
        id: policy
        env:
          BOOTSTRAP_STAGE_ROOT: ${{ runner.temp }}/npm-bootstrap-stage
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/support/release/npm_bootstrap/policy.ts preflight
      - name: Download the exact npm-packages artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.policy.outputs.artifact_id }}
          path: ${{ runner.temp }}/npm-bootstrap-stage/npm
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Validate the allowlisted artifact package
        id: artifact
        env: { BOOTSTRAP_STAGE_ROOT: "${{ runner.temp }}/npm-bootstrap-stage" }
        run: node tools/support/release/npm_bootstrap/policy.ts artifact
      - name: Resolve publish-time workspace and catalog protocols
        env:
          BOOTSTRAP_PACKAGE_ROOT: ${{ steps.artifact.outputs.package_root }}
        run: node tools/support/release/prepare_npm_publish_manifest/main.ts "$BOOTSTRAP_PACKAGE_ROOT"
      - name: Validate the standalone publish manifest
        env: { BOOTSTRAP_STAGE_ROOT: "${{ runner.temp }}/npm-bootstrap-stage" }
        run: node tools/support/release/npm_bootstrap/policy.ts prepared
      - name: Confirm the package is still absent from npm
        run: node tools/support/release/npm_bootstrap/policy.ts registry
      - name: Pack the deterministic local first-publish handoff
        id: handoff
        env:
          BOOTSTRAP_OUTPUT_ROOT: ${{ runner.temp }}/npm-cli-first-publish
          BOOTSTRAP_PACKAGE_ROOT: ${{ steps.artifact.outputs.package_root }}
          EXPECTED_PACKAGE_NAME: ${{ steps.policy.outputs.package_name }}
          ORIGINAL_MANIFEST_SHA512: ${{ steps.artifact.outputs.original_manifest_sha512 }}
          RELEASE_CANDIDATE_SHA: ${{ steps.policy.outputs.candidate_sha }}
          RELEASE_PARENT_SHA: ${{ steps.policy.outputs.parent_sha }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.policy.outputs.artifact_digest }}
          SOURCE_ARTIFACT_ID: ${{ steps.policy.outputs.artifact_id }}
        run: node tools/support/release/npm_bootstrap/handoff.ts
      - name: Upload the exact npm CLI handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.handoff.outputs.artifact_name }}
          path: ${{ runner.temp }}/npm-cli-first-publish
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
