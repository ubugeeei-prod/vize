name: Prepare npm first-publish CLI handoff

on:
  repository_dispatch:
    types: [npm-bootstrap]

run-name: Prepare CLI handoff for ${{ github.event.client_payload.package_path }} from ${{ github.event.client_payload.tag_name }} run ${{ github.event.client_payload.release_run_id }}

concurrency:
  group: npm-bootstrap-${{ github.event.client_payload.package_path }}
  cancel-in-progress: false

permissions: { contents: read }

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  handoff:
    name: Prepare first-publish CLI handoff
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    # actions: read downloads the exact Release run artifact. This job never publishes.
    permissions: { actions: read, contents: read }
    steps:
      - name: Checkout bootstrap controls from main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Validate first-publish request
        id: preflight
        env:
          BOOTSTRAP_PACKAGE_PATH: ${{ github.event.client_payload.package_path }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.event.client_payload.release_run_id }}
          RELEASE_TAG_NAME: ${{ github.event.client_payload.tag_name }}
        run: node tools/github/npm-bootstrap-preflight.mjs preflight
      - name: Setup Vite+ and Node.js
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          cache: true
          node-version-file: ".node-version"
          run-install: false
      - uses: ./.github/actions/setup-moonbit
      - name: Install package build dependencies
        env:
          BOOTSTRAP_PACKAGE_PATH: ${{ steps.preflight.outputs.package_path }}
        run: moon run --target native tools/moon/cmd/github/vp_install -- --filter "./${BOOTSTRAP_PACKAGE_PATH}..."
      - name: Test and build package at the dispatch SHA
        env:
          BOOTSTRAP_PACKAGE_PATH: ${{ steps.preflight.outputs.package_path }}
        run: vp run --filter "./${BOOTSTRAP_PACKAGE_PATH}" test
      - name: Download the smoke-tested Release package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.preflight.outputs.artifact_name }}
          path: bootstrap-package
          run-id: ${{ steps.preflight.outputs.release_run_id }}
          github-token: ${{ github.token }}
      - name: Validate and smoke the exact Release package artifact
        env:
          BOOTSTRAP_ARTIFACT_PATH: bootstrap-package
          EXPECTED_PACKAGE_NAME: ${{ steps.preflight.outputs.package_name }}
          EXPECTED_PACKAGE_VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          node tools/github/npm-bootstrap-preflight.mjs artifact
          node tools/npm/smoke-release-install.mjs --prepare-manifests "$BOOTSTRAP_ARTIFACT_PATH"
      - name: Confirm package is still unpublished
        env:
          BOOTSTRAP_PACKAGE_PATH: ${{ steps.preflight.outputs.package_path }}
          RELEASE_RUN_ID: ${{ steps.preflight.outputs.release_run_id }}
          RELEASE_TAG_NAME: ${{ github.event.client_payload.tag_name }}
        run: node tools/github/npm-bootstrap-preflight.mjs registry-recheck
      - name: Pack deterministic npm CLI first-publish handoff
        id: handoff
        env:
          BOOTSTRAP_ARTIFACT_PATH: bootstrap-package
          BOOTSTRAP_HANDOFF_PATH: npm-cli-first-publish
          EXPECTED_PACKAGE_NAME: ${{ steps.preflight.outputs.package_name }}
          EXPECTED_PACKAGE_VERSION: ${{ steps.preflight.outputs.version }}
          RELEASE_ARTIFACT_NAME: ${{ steps.preflight.outputs.artifact_name }}
          RELEASE_RUN_ID: ${{ steps.preflight.outputs.release_run_id }}
          RELEASE_TAG_NAME: ${{ github.event.client_payload.tag_name }}
          RELEASE_TAG_SHA: ${{ steps.preflight.outputs.tag_sha }}
        run: node tools/github/npm-bootstrap-handoff.mjs
      - name: Upload npm CLI first-publish handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.handoff.outputs.artifact_name }}
          path: npm-cli-first-publish
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
