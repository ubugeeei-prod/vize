name: Native Script CLI Capture
on:
  pull_request:
    types: [opened, synchronize, labeled]
    paths:
      - ".github/workflows/native-script-capture.yml"
      - "crates/vize/src/commands/dump.rs"
      - "crates/vize/src/commands/dump/script/**"
      - "crates/vize/src/commands/dump/script.rs"
      - "crates/vize/tests/dump_script_cli.rs"
      - "crates/vize/tests/fixtures/dump_cli/**"
      - "tools/support/dependencies/capture-native-script-cli.ts"
      - "tools/support/dependencies/export-capture-evidence.ts"
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'native-script-capture')
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          run-install: false
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: native-script-capture
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Build the actual CLI
        run: cargo build --locked --profile ci-opt -p vize
      - name: Capture authored input, source identity and actual CLI help
        run: |
          mkdir -p capture
          git rev-parse HEAD > capture/head.txt
          target/ci-opt/vize dump --help > capture/help.stdout
          printf '%s\n' '/* α */ interface Props { value: number }; export const value: Props = { value: 1 };' > capture/input.ts
          target/ci-opt/vize dump --level l1 --script ts --roundtrip capture/input.ts > capture/program.stdout
          target/ci-opt/vize dump --level l1 --script ts --script-goal script --roundtrip capture/input.ts > capture/script.stdout
      - name: Capture complete four-language and recovering CLI fixture output
        run: vp node tools/support/dependencies/capture-native-script-cli.ts target/ci-opt/vize capture/cases
      - name: Export complete captured bytes through bounded verified log frames
        if: always()
        run: vp node tools/support/dependencies/export-capture-evidence.ts capture capture-export/evidence.json.gz native-script-cli
      - name: Preserve the same lossless transport pack
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-script-transport-${{ github.sha }}
          path: capture-export/evidence.json.gz
          if-no-files-found: error
      - name: Preserve complete actual output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-script-cli-${{ github.sha }}
          path: capture
          if-no-files-found: error
