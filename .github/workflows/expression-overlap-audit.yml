name: Expression overlapping speculation audit
on:
  pull_request:
    paths:
      - .github/workflows/expression-overlap-audit.yml
      - .github/scripts/workflows/expression-overlap-audit/**
      - .github/scripts/workflows/shared/**
      - tools/support/compat/parser/**
      - upstream/forks/oxc_parser/**
      - tests/fuzz/regressions/js_ts_expression/issue-10845*
  workflow_dispatch: {}
permissions: { contents: read }
concurrency:
  group: expression-overlap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Expression overlap ${{ matrix.role }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: { role: [baseline, candidate] }
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      ROLE: ${{ matrix.role }}
      DRIVER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_SHA: ${{ matrix.role == 'baseline' && '9157b9fa83dbdc98100be084be288f21d0d1bc18' || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/expression-overlap-audit/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ env.DRIVER_SHA }}", path: driver, persist-credentials: false }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ env.SOURCE_SHA }}", path: source, persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: "driver/package.json", package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with: { toolchain: nightly-2026-10-23 }
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: expression-overlap-downloads-${{ runner.os }}
      - name: Freeze driver, original cases and source provenance
        run: . "${{ env.VIZE_CI_FILES }}/freeze-driver-original-cases-and-source-provenance.sh"
      - name: Build immutable optimized source and frozen drivers
        id: build
        working-directory: source
        env: { CARGO_PROFILE_CI_OPT_DEBUG: "1" }
        run: . "${{ env.VIZE_CI_FILES }}/build-immutable-optimized-source-and-frozen-drivers.sh"
      - name: Compare complete observable packets and separate admission from parser work
        run: . "${{ env.VIZE_CI_FILES }}/compare-complete-observable-packets-and-separate-admission-from-parser-w.sh"
      - name: Install source profiler
        run: . "${{ env.VIZE_CI_FILES }}/install-source-profiler.sh"
      - name: Count immutable-source instructions with line attribution
        run: . "${{ env.VIZE_CI_FILES }}/count-immutable-source-instructions-with-line-attribution.sh"
      - name: Observe all private source facts and require candidate parser regressions
        working-directory: source
        env:
          VIZE_EXPRESSION_OVERLAP_CASES: ${{ github.workspace }}/evidence/cases
          VIZE_EXPRESSION_OVERLAP_FACTS: ${{ github.workspace }}/evidence/private-source-facts.txt
        run: . "${{ env.VIZE_CI_FILES }}/observe-all-private-source-facts-and-require-candidate-parser-regression.sh"
      - name: Replay original libFuzzer address sanitizer resource regime
        working-directory: source
        run: . "${{ env.VIZE_CI_FILES }}/replay-original-libfuzzer-address-sanitizer-resource-regime.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: expression-overlap-${{ matrix.role }}-${{ env.SOURCE_SHA }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
  acceptance:
    name: Expression overlap complete packets and instruction reduction
    needs: source
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/expression-overlap-audit/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { pattern: expression-overlap-*, path: evidence }
      - name: Require complete packet parity and at least eightfold shared-work reduction
        run: . "${{ env.VIZE_CI_FILES }}/require-complete-packet-parity-and-at-least-eightfold-shared-work-reduct.sh"
