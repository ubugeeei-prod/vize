name: VS Code VSIX validation

on:
  pull_request:
    paths:
      - .github/workflows/vscode-vsix-validation.yml
      - editors/vscode/package.json
      - tools/commands/editors/vscode/assert-vsix-package.rs
      - tools/support/lib.rs
      - tools/support/editors/vsix_configuration.rs
      - tests/tooling/vscode-vsix-configuration.test.ts
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: vscode-vsix-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: { contents: read }

jobs:
  validate:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: latest
          node-version-file: package.json
          run-install: false
          cache: true
      - uses: ./.github/actions/setup-rust-script
      - name: Install locked dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Exercise the real Rust validator and unchanged initialization behavior
        run: vp node --test tests/tooling/vscode-vsix-configuration.test.ts tests/tooling/vscode-extension-core-behavior.test.ts
      - name: Package and validate the production VSIX through rust-script
        run: vp run --workspace-root package:vscode-extension
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-vsix-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            editors/vscode/dist/vize.vsix
            editors/vscode/dist/extension.cjs
          if-no-files-found: error
          retention-days: 7
