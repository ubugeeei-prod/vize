name: Provide type assertion whole packets
run-name: Provide type assertion complete packets @ ${{ github.event.pull_request.head.sha || github.sha }}
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/provide-type-assertion.yml
      - .github/scripts/workflows/provide-type-assertion/**
      - .github/scripts/workflows/shared/**
      - crates/vize/tests/provide_type_assertion_cli.rs
      - crates/vize/tests/provide_type_assertion_expected.json
      - crates/vize_croquis/src/script_parser/extract/provide.rs
      - crates/vize_croquis_cf/src/rules/cross_file_reactivity/provide_helpers.rs
      - crates/vize_croquis_cf/src/rules/cross_file_reactivity/collect.rs
permissions:
  contents: read
concurrency:
  group: provide-type-assertion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "12"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  whole-before:
    name: Native and actual CLI complete packets (${{ matrix.role }})
    strategy:
      fail-fast: false
      matrix:
        role: [baseline, source]
    env:
      ROLE: ${{ matrix.role }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/provide-type-assertion/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ matrix.role == 'baseline' && '98ff4d1ca1ccc2c6ac9ca869177913b90c0da6a1' || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: "1.100.0"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: provide-type-assertion
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Preserve exact product source identity
        env:
          VIZE_PROVIDE_ASSERTION_ARTIFACTS: ${{ runner.temp }}/provide-assertion-packets
        run: . "${{ env.VIZE_CI_FILES }}/preserve-exact-product-source-identity.sh"
      - name: Verify source producer metadata and all classifier controls
        if: ${{ matrix.role == 'source' }}
        run: . "${{ env.VIZE_CI_FILES }}/verify-source-producer-metadata-and-all-classifier-controls.sh"
      - name: Capture whole original and positive negative destructuring controls
        env:
          VIZE_PROVIDE_ASSERTION_ARTIFACTS: ${{ runner.temp }}/provide-assertion-packets
        run: . "${{ env.VIZE_CI_FILES }}/capture-whole-original-and-positive-negative-destructuring-controls.sh"
      - name: Require all twenty seven executed complete packet controls
        env:
          PACKETS: ${{ runner.temp }}/provide-assertion-packets
        run: . "${{ env.VIZE_CI_FILES }}/require-all-twenty-seven-executed-complete-packet-controls.sh"
      - name: Preserve actual executable identity
        if: ${{ always() }}
        run: . "${{ env.VIZE_CI_FILES }}/preserve-actual-executable-identity.sh"
      - name: Preserve every raw report and complete native result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provide-assertion-whole-${{ matrix.role }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provide-assertion-packets
          if-no-files-found: error
          retention-days: 14
