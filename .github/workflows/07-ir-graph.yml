name: Davinci IR graph queries
on:
  pull_request:
    paths:
      - ".github/workflows/07-ir-graph.yml"
      - "tests/formal/ir-graph/**"
      - tests/formal/position-index/**
      - tools/ci/workflows/07-ir-graph/scripts/**
      - crates/vize_maestro/src/document/store.rs
      - crates/vize_maestro/src/source_project/query.rs
      - crates/vize_maestro/src/source_project/scoped_component.rs
      - crates/vize_maestro/src/source_project/snapshot.rs
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ir-graph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  models:
    name: Reachability theory and snapshot publication
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /tools/ci/lib/scripts/
            /tools/ci/workflows/07-ir-graph/scripts/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - name: Install pinned standalone model checkers
        working-directory: ${{ runner.temp }}
        run: . "${{ env.VIZE_CI_FILES }}/install-pinned-standalone-model-checkers.sh"
      - name: Check resident template decisions across source edits
        working-directory: tests/formal/ir-graph
        run: . "${{ env.VIZE_CI_FILES }}/check-resident-template-decisions-across-source-edits.sh"
      - name: Check the unbounded theorem and bounded models
        working-directory: tests/formal/ir-graph
        run: . "${{ env.VIZE_CI_FILES }}/check-the-unbounded-theorem-and-bounded-models.sh"
      - name: Prove cursor windows against individual point containment
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f
        with:
          kani-version: 0.68.0
          command: kani
          args: crates/vize_incremental/providers/graph/src/recovery/positions/kani.rs --output-format=terse
