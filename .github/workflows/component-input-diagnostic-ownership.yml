name: Component input diagnostic ownership

on:
  pull_request:
    paths:
      - "crates/vize_canon/src/virtual_ts/diagnostic_ownership/**"
      - "crates/vize_canon/src/virtual_ts/diagnostic_ownership.rs"
      - "crates/vize_canon/src/virtual_ts/scope/root_owner_packets*"
      - "crates/vize_canon/src/virtual_ts/scope/root_owner_packets/**"
      - "crates/vize_canon/src/virtual_ts/scope/root_callback_owners*"
      - "crates/vize_canon/src/virtual_ts/scope/root_callback_owners/**"
      - "crates/vize_canon/src/virtual_ts/scope/component_prop_checker.rs"
      - "crates/vize_canon/src/virtual_ts/scope/component_prop_checker/**"
      - "crates/vize_canon/src/virtual_ts/scope/component_events/native_fallthrough.rs"
      - "crates/vize_canon/src/virtual_ts/scope/event_scope.rs"
      - "crates/vize_canon/src/virtual_ts/expressions/props_literal.rs"
      - "crates/vize_canon/src/virtual_ts/expressions/props_literal/**"
      - "tools/benchmarks/crates/vize/tests/component_input_ownership_profile.rs"
      - "crates/vize_canon/src/batch/virtual_project/content_mapper/**"
      - "crates/vize_canon/src/virtual_ts/helpers/preamble.rs"
      - "crates/vize_canon/src/virtual_ts/generator/emits.rs"
      - "crates/vize_canon/src/virtual_ts/generator/component_constructors.rs"
      - "crates/vize_canon/src/virtual_ts/generator/component_constructors/emission.rs"
      - "crates/vize_canon/src/virtual_ts/generator/component_constructors/generic_function.rs"
      - "crates/vize_canon/src/virtual_ts/generator/component_export.rs"
      - "crates/vize_canon/src/virtual_ts/scope/component_events/generic_inference.rs"
      - "crates/vize_canon/tests/constructor_emission_projection.rs"
      - "crates/vize_canon/tests/empty_vue_star_exports/membership/constructor_without_args/payload_update/emit_overload_window.rs"
      - "crates/vize_canon/src/virtual_ts/helpers/declarations/emit-overloads.d.ts.txt"
      - "crates/vize_canon/src/virtual_ts/helpers/declarations/emit-props.d.ts.txt"
      - "crates/vize_canon/src/virtual_ts/helpers/shared_types.rs"
      - "crates/vize_canon/src/virtual_ts/helpers/declarations/core-types.d.ts.txt"
      - "crates/vize_canon/src/virtual_ts/helpers/declarations/vue3-types.d.ts.txt"
      - "crates/vize_canon/src/virtual_ts/helpers/declarations/prop-keys.d.ts.txt"
      - "crates/vize_canon/src/virtual_ts/helpers/declarations/content-mapper-type-imports.d.ts.txt"
      - "crates/vize_canon/src/virtual_ts/helpers/declarations/component-global-attributes.d.ts.txt"
      - "crates/vize_canon/src/virtual_ts/component_prop_helpers.txt"
      - "npm/cli/content-mapper-helpers.d.*"
      - "npm/cli/virtual-ts.d.*"
      - "npm/cli/virtual-ts-*.d.ts"
      - "npm/cli/package.json"
      - "npm/cli/generated/content-mapper-types.d.ts"
      - "tools/support/compat/content-mapper/diagnostic-ownership*.ts"
      - "tools/support/compat/content-mapper/callback-owner*.ts"
      - "tools/support/compat/content-mapper/aria-component*.ts"
      - "tools/support/compat/content-mapper/aria-source-package.ts"
      - "tools/support/compat/content-mapper/constructor-projection-parity.ts"
      - "tools/support/compat/content-mapper/constructor-helper-assets.ts"
      - "tools/support/compat/content-mapper/constructor-projection-receipt.ts"
      - "tools/support/compat/content-mapper/projection-byte-relocation.ts"
      - "tools/support/compat/content-mapper/owned-emit-overload-transition.ts"
      - "tools/support/compat/content-mapper/component-constructor-transition.ts"
      - "tools/support/compat/content-mapper/component-export-transition.ts"
      - "tools/support/compat/content-mapper/canonical-helper-transition.ts"
      - "tools/support/compat/content-mapper/producer-unmapped-ignores.ts"
      - "tools/support/release/computed_event_names.ts"
      - "tools/support/release/computed_event_custody.ts"
      - "tests/tooling/_helpers/tool-commands.ts"
      - "tests/tooling/support/generic-event-specialization-source.ts"
      - "tests/tooling/support/static-listener-prop-source.ts"
      - "tests/_fixtures/tooling/static-listener-prop-update-11815.json"
      - "tests/_fixtures/differential/typechecker/empty-vue-star-exports/malformed-membership/generic-event-specialization-update-11815.json"
      - "tests/tooling/public-emit-overload-package.test.ts"
      - "npm/ui/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tools/support/compat/content-mapper/constructor-jsx-witness-transition.ts"
      - "tests/_fixtures/differential/typechecker/tsx-single-required-exact-keys/**"
      - "tests/tooling/constructor-projection-parity.test.ts"
      - "tests/tooling/constructor-projection-emit-overload.test.ts"
      - "tests/tooling/emit-overload-transition-fixture.ts"
      - "tests/tooling/fixtures/emit-overload-transition/**"
      - "tests/tooling/component-input-diagnostic-ownership-workflow.test.ts"
      - "tests/tooling/component-input-diagnostic-ownership-scripts.test.ts"
      - ".github/scripts/component-input-diagnostic-ownership/**"
      - "tests/tooling/callback-owner-certificate.test.ts"
      - "tests/tooling/aria-component-attrs.test.ts"
      - "tests/tooling/aria-source-package.test.ts"
      - "tests/_fixtures/differential/typechecker/aria-propertykey-capture-11153/**"
      - "tests/_fixtures/differential/typechecker/component-input-diagnostic-owners-10607/**"
      - ".github/workflows/component-input-diagnostic-ownership.yml"

permissions: { contents: read }
concurrency:
  group: component-input-diagnostic-ownership-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  packed-emit-overloads:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false }
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: latest
          node-version-file: "package.json"
          cache: true
          cache-save: false
          run-install: true
      - name: Verify the packed public emit helper and missing-module controls
        run: node --test tests/tooling/public-emit-overload-package.test.ts
  published-sdk-packets:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "24"
      CARGO_INCREMENTAL: "0"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HISTORICAL_CALLBACK_BEFORE: 78719553cf550bcffbf1d0fb891fda642f42de3a
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: "package.json", package-manager-cache: false }
      - name: Prove callback comparison custody before building either source
        run: node --test tests/tooling/component-input-diagnostic-ownership-workflow.test.ts tests/tooling/callback-owner-certificate.test.ts tests/tooling/aria-component-attrs.test.ts tests/tooling/aria-source-package.test.ts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: microsoft/TypeScript
          ref: d6c4afddb2c55f4a9dea7b59293a99a8fdea1799
          path: typescript-content-mapper
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: typescript-content-mapper/tsc/go.mod
          cache-dependency-path: typescript-content-mapper/tsc/go.sum
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: ./.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          {
            key: component-input-ownership,
            cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}",
          }
      - name: Build the exact source CLI
        run: source .github/scripts/component-input-diagnostic-ownership/build-source-cli.sh
      - name: Prove actual root scope admission and complete callback mapping laws
        run: source .github/scripts/component-input-diagnostic-ownership/prove-root-scope.sh
      - name: Build the exact authenticated PR base separately
        run: source .github/scripts/component-input-diagnostic-ownership/build-authenticated-base.sh
      - name: Install exact published SDK and baseline packages
        run: source .github/scripts/component-input-diagnostic-ownership/install-sdk-packages.sh
      - name: Build and retain the exact source SDK
        run: source .github/scripts/component-input-diagnostic-ownership/build-source-sdk.sh
      - name: Compare all complete packets on all three physical SDKs
        run: source .github/scripts/component-input-diagnostic-ownership/compare-sdk-packets.sh
      - name: Retain all 144 unchanged generic repair observations
        env:
          VIZE_TEST_CONTENT_MAPPER_TSGO: ${{ runner.temp }}/component-input-d6c4/tsgo
          VIZE_TEST_CONTENT_MAPPER_VUE: ${{ runner.temp }}/component-input-consumer/node_modules/vue
        run: source .github/scripts/component-input-diagnostic-ownership/retain-generic-repair-observations.sh
      - name: Retain every callback-CFA base, head and independent reference packet
        run: source .github/scripts/component-input-diagnostic-ownership/retain-callback-packets.sh
      - name: Audit callback creation order without waiving the separate event frontier
        run: source .github/scripts/component-input-diagnostic-ownership/audit-callback-order.sh
      # The bounded CFA discovery batch is preserved under #10738/#10739.
      # Its manual harness remains available; it is not an acceptance gate.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: component-input-ownership-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/component-input-ownership
            target/vize-tests/content-mapper-quoted-generic-parameters
            ${{ runner.temp }}/component-input-consumer/package.json
            ${{ runner.temp }}/component-input-consumer/package-lock.json
            ${{ runner.temp }}/component-input-beta/package.json
            ${{ runner.temp }}/component-input-beta/package-lock.json
            ${{ runner.temp }}/component-input-beta/provider-metadata.json
            ${{ runner.temp }}/component-input-d6c4/source.txt
            ${{ runner.temp }}/component-input-d6c4/binary.sha256
            !${{ runner.temp }}/component-input-ownership/**/node_modules/**
          if-no-files-found: error
          retention-days: 7

  unchanged-projection-packets:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "24"
      CARGO_INCREMENTAL: "0"
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          {
            ref: "${{ github.event.pull_request.head.sha }}",
            fetch-depth: 0,
            persist-credentials: false,
          }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: "package.json", package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: ./.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with: { key: test-scripts, cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}" }
      - name: Capture exact base and head through the identical observation harness
        shell: bash
        run: source .github/scripts/component-input-diagnostic-ownership/capture-projection-packets.sh
      - name: Prove complete packets under the exact canonical helper relocation
        shell: bash
        run: source .github/scripts/component-input-diagnostic-ownership/prove-constructor-projection.sh
      - name: Observe actual mapper generation and gated parser allocations
        shell: bash
        run: source .github/scripts/component-input-diagnostic-ownership/observe-generation-profile.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: component-input-parity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/component-input-parity
          if-no-files-found: error
          retention-days: 7
