name: Signature Project Authority Capture
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  GIT_NO_REPLACE_OBJECTS: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_BUILD_JOBS: "12"
  RUST_TEST_THREADS: "4"
  VIZE_NUXT_CONFIG_ITERATIONS: "100"
  VIZE_TEST_REQUIRE_TSGO: "1"
jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.label.name == 'signature-project-authority-capture')
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Preserve separately reviewed diagnostic driver
        run: |
          mkdir -p "$RUNNER_TEMP/signature-driver" "$RUNNER_TEMP/signature-capture"
          git rev-parse HEAD > "$RUNNER_TEMP/signature-capture/driver-sha.txt"
          cp tools/support/compat/github/signature-{archive-capture,archive-libdirs,strace,capture-integrity}.mjs "$RUNNER_TEMP/signature-driver/"
          cp .github/workflows/signature-project-authority-capture.yml "$RUNNER_TEMP/signature-capture/driver-workflow.yml"
          cp "$RUNNER_TEMP/signature-driver/"* "$RUNNER_TEMP/signature-capture/"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: 4cc1ef9cbeb3ee33df3ba6086b174b611f8d5681
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.99.0"
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          run-install: true
          cache: true
      - uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        with:
          tool: cargo-nextest@0.9.146
      - name: Authenticate the exact original archive metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/ubugeeei-prod/vize/actions/artifacts/11720466915 > "$RUNNER_TEMP/signature-capture/artifact.json"
          gh api --allow-escape-sequences repos/ubugeeei-prod/vize/actions/artifacts/11720466915/zip > "$RUNNER_TEMP/signature-archive.zip"
          sha256sum "$RUNNER_TEMP/signature-archive.zip" > "$RUNNER_TEMP/signature-capture/archive-zip.sha256"
          read -r archive_sha archive_path < "$RUNNER_TEMP/signature-capture/archive-zip.sha256"
          [[ "$archive_sha" == '3a345f7b956970ebc0474f60d5ef9256463eedcaa46dd90cdd052b22c65c380f' ]]
          mkdir -p .artifacts/rust-test-archive
          unzip -q "$RUNNER_TEMP/signature-archive.zip" -d .artifacts/rust-test-archive
      - name: Verify original archive and extract before syscall observation
        run: |
          node tools/support/compat/github/rust-test-archive.mjs verify .artifacts/rust-test-archive/tests.tar.zst .artifacts/rust-test-archive/receipt.json
          mkdir -p target/tmp
          node "$RUNNER_TEMP/signature-driver/signature-archive-libdirs.mjs" environment "$RUNNER_TEMP/signature-capture"
          cargo nextest list --archive-file .artifacts/rust-test-archive/tests.tar.zst --extract-to "$GITHUB_WORKSPACE" --extract-overwrite --workspace-remap "$GITHUB_WORKSPACE" --profile full --message-format json --filter-expr 'package(=vize_maestro) & binary(=vize_maestro) & test(=ide::signature_help::tests::signature_help_tracks_imported_callable_edits)' > "$RUNNER_TEMP/signature-capture/selected-tests.json"
          node "$RUNNER_TEMP/signature-driver/signature-archive-libdirs.mjs" derive "$RUNNER_TEMP/signature-capture"
          cargo nextest list --cargo-metadata target/nextest/cargo-metadata.json --binaries-metadata "$RUNNER_TEMP/signature-capture/derived-binaries-metadata.json" --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" --profile full --message-format json --filter-expr 'package(=vize_maestro) & binary(=vize_maestro) & test(=ide::signature_help::tests::signature_help_tracks_imported_callable_edits)' > "$RUNNER_TEMP/signature-capture/derived-selected-tests.json"
          node "$RUNNER_TEMP/signature-driver/signature-archive-libdirs.mjs" verify "$RUNNER_TEMP/signature-capture"
          node "$RUNNER_TEMP/signature-driver/signature-archive-capture.mjs" prepare "$RUNNER_TEMP/signature-capture"
      - name: Install passive Linux syscall observer
        run: |
          sudo apt-get update
          sudo apt-get install --yes strace
          strace --version > "$RUNNER_TEMP/signature-capture/strace-version.txt"
      - name: Observe the original archived test without rebuilding
        id: original
        run: |
          phase_started=$SECONDS
          set +e
          strace -ff -ttt -xx -yy -s16777216 -e trace=process,file,fchdir,read,write,readv,writev,pipe,pipe2,close,dup,dup2,dup3 -o "$RUNNER_TEMP/signature-capture/strace" cargo nextest run --cargo-metadata target/nextest/cargo-metadata.json --binaries-metadata "$RUNNER_TEMP/signature-capture/derived-binaries-metadata.json" --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" --profile full --filter-expr 'package(=vize_maestro) & binary(=vize_maestro) & test(=ide::signature_help::tests::signature_help_tracks_imported_callable_edits)' > "$RUNNER_TEMP/signature-capture/test.stdout" 2> "$RUNNER_TEMP/signature-capture/test.stderr"
          original_exit=$?
          set -e
          printf '{"exitCode":%d,"elapsedSeconds":%d,"timing":"instrumented; no acceptance/performance credit"}\n' "$original_exit" "$((SECONDS - phase_started))" > "$RUNNER_TEMP/signature-capture/instrumented-outcome.json"
          cp target/nextest/full/junit.xml "$RUNNER_TEMP/signature-capture/junit.xml"
          node "$RUNNER_TEMP/signature-driver/signature-archive-libdirs.mjs" finish "$RUNNER_TEMP/signature-capture"
          node "$RUNNER_TEMP/signature-driver/signature-archive-capture.mjs" finish "$RUNNER_TEMP/signature-capture"
          exit "$original_exit"
      - name: Require complete retained observation independently of test outcome
        if: ${{ always() }}
        run: node "$RUNNER_TEMP/signature-driver/signature-capture-integrity.mjs" "$RUNNER_TEMP/signature-capture"
      - name: Retain whole raw observation including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signature-project-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signature-capture
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
