name: Type source snapshot benchmark

on:
  pull_request:
    paths:
      - "crates/vize_atelier_sfc/src/script/context/type_world/**"
      - "crates/vize_atelier_sfc/src/script/context/type_world.rs"
      - "crates/vize_atelier_sfc/src/script/context/source_snapshot/**"
      - "crates/vize_atelier_sfc/src/script/context/source_snapshot.rs"
      - "crates/vize_atelier_sfc/src/croquis/resolved.rs"
      - "crates/vize_canon/src/batch/virtual_project/setup_props.rs"
      - "crates/vize_canon/src/batch/virtual_project/setup_props/**"
      - "crates/vize_canon/src/batch/virtual_project/tests/type_source_snapshot.rs"
      - "crates/vize_atelier_sfc/examples/type_snapshot_bench.rs"
      - "tools/benchmarks/scripts/type-snapshot-paired.mjs"
      - "tools/benchmarks/scripts/type-snapshot-cli-*.mjs"
      - "tools/benchmarks/scripts/typecheck-command.mjs"
      - "tools/benchmarks/scripts/benchmark-binary.mjs"
      - "tools/benchmarks/scripts/check-gate-env.mjs"
      - "tools/benchmarks/scripts/check-gate-plants.mjs"
      - "tools/benchmarks/scripts/generate.mjs"
      - ".github/workflows/type-snapshot-bench.yml"

permissions:
  contents: read

concurrency:
  group: type-snapshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  paired-snapshot:
    name: Type source snapshot parity and paired analysis
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: head
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select the exact common ancestor
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "BASE_SHA=$(git -C head merge-base "$PR_BASE_SHA" "$HEAD_SHA")" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: base
          ref: ${{ env.BASE_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with:
          wild-version: "0.9.0"
      - uses: ./head/.github/actions/setup-rust-sticky-cache
        with:
          key: type-snapshot-head
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
          target-path: head/target
          secondary-key: type-snapshot-base
          secondary-target-path: base/target
          secondary-cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with:
          node-version-file: head/package.json
          run-install: false
      - name: Verify scoped types, overlays, root edits and concurrent consumers
        working-directory: head
        run: |
          cargo test --locked -p vize_atelier_sfc script::context::type_world
          cargo test --locked -p vize_atelier_sfc script::context::source_snapshot
          cargo clippy --locked -p vize_atelier_sfc --lib --example type_snapshot_bench -- -D warnings
      - name: Build identical public type-world probes at exact base and head
        run: |
          set -euo pipefail
          [[ "$(git -C head rev-parse HEAD)" == "$HEAD_SHA" ]]
          [[ "$(git -C base rev-parse HEAD)" == "$BASE_SHA" ]]
          mkdir -p base/crates/vize_atelier_sfc/examples
          cp head/crates/vize_atelier_sfc/examples/type_snapshot_bench.rs base/crates/vize_atelier_sfc/examples/
          cmp head/crates/vize_atelier_sfc/examples/type_snapshot_bench.rs base/crates/vize_atelier_sfc/examples/type_snapshot_bench.rs
          cargo build --locked --manifest-path base/Cargo.toml --profile ci-opt -p vize_atelier_sfc --example type_snapshot_bench
          cargo build --locked --manifest-path head/Cargo.toml --profile ci-opt -p vize_atelier_sfc --example type_snapshot_bench
      - name: Compare complete module facts and nine alternating measurement pairs
        run: |
          node head/tools/benchmarks/scripts/type-snapshot-paired.mjs \
            "$GITHUB_WORKSPACE/base/target/ci-opt/examples/type_snapshot_bench" \
            "$GITHUB_WORKSPACE/head/target/ci-opt/examples/type_snapshot_bench" \
            "$GITHUB_WORKSPACE/type-snapshot-bench.json"
      - name: Upload input corpus, complete fact signatures and raw timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: type-snapshot-bench
          path: |
            type-snapshot-bench.json
            type-snapshot-bench.json.samples/
          if-no-files-found: error
          retention-days: 30

  paired-cli:
    name: Type source snapshot actual CLI parity and paired timings
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: head
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select the exact full Stack baseline against main
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          stack_base_sha="$(git -C head merge-base origin/main "$HEAD_SHA")"
          [[ "$stack_base_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "BASE_SHA=$stack_base_sha" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: base
          ref: ${{ env.BASE_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with:
          wild-version: "0.9.0"
      - uses: ./head/.github/actions/setup-rust-sticky-cache
        with:
          key: type-snapshot-cli-head
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
          target-path: head/target
          secondary-key: type-snapshot-cli-base
          secondary-target-path: base/target
          secondary-cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with:
          node-version-file: head/package.json
          run-install: false
      - name: Check timing protocol, diagnostic normalization and input fingerprints
        working-directory: head
        run: node tools/benchmarks/scripts/type-snapshot-cli-paired.mjs --self-test
      - name: Install the shared head Vue and native TypeScript dependencies
        working-directory: head
        run: vp install --frozen-lockfile --prefer-offline
      - name: Verify batch source snapshot integration and frozen prop metadata
        working-directory: head
        env:
          VIZE_TEST_REQUIRE_TSGO: "1"
        run: |
          cargo test --locked -p vize_canon --lib batch::virtual_project::tests::type_source_snapshot
          cargo test --locked -p vize_atelier_sfc --lib croquis::tests
          cargo clippy --locked -p vize_canon --lib -- -D warnings
      - name: Build exact base and head CLIs with identical ci-opt settings
        run: |
          set -euo pipefail
          [[ "$(git -C head rev-parse HEAD)" == "$HEAD_SHA" ]]
          [[ "$(git -C base rev-parse HEAD)" == "$BASE_SHA" ]]
          git -C head diff --exit-code HEAD
          git -C base diff --exit-code HEAD
          for side in base head; do
            cargo build --locked --manifest-path "$side/Cargo.toml" --target-dir "$side/target" --profile ci-opt -p vize \
              --config 'profile.ci-opt.inherits="release"' \
              --config 'profile.ci-opt.lto="thin"' \
              --config 'profile.ci-opt.codegen-units=16' \
              --config 'profile.ci-opt.package.vize.strip="symbols"'
          done
      - name: Gate both 500-SFC corpora and compare max/1T with nine alternating pairs
        env:
          RUNNER_LABEL: blacksmith-32vcpu-ubuntu-2404
        run: |
          node head/tools/benchmarks/scripts/type-snapshot-cli-paired.mjs \
            "$GITHUB_WORKSPACE/base/target/ci-opt/vize" \
            "$GITHUB_WORKSPACE/head/target/ci-opt/vize" \
            "$GITHUB_WORKSPACE/type-snapshot-cli-bench.json"
          cat type-snapshot-cli-bench.json.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload CLI inputs, every process report, profiles and provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: type-snapshot-cli-bench
          path: |
            type-snapshot-cli-bench.json
            type-snapshot-cli-bench.json.md
            type-snapshot-cli-bench.json.samples/provenance.json
            type-snapshot-cli-bench.json.samples/failure.json
            type-snapshot-cli-bench.json.samples/runs.ndjson
            type-snapshot-cli-bench.json.samples/inputs/
            type-snapshot-cli-bench.json.samples/raw/
            type-snapshot-cli-bench.json.samples/profiles/
          if-no-files-found: error
          retention-days: 30
