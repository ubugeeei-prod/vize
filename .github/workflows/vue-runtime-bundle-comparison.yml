name: Vue runtime bundle comparison

on:
  pull_request:
    paths:
      - "tests/tooling/support/runtime-bundle*.ts"
      - "tests/tooling/support/pinned-vue-runtime-bundle.ts"
      - "tests/tooling/support/davinci-mounted-trace.mjs"
      - "tests/tooling/support/vue-vapor-release.mjs"
      - "tools/support/compat/github/compare-vue-runtime-bundles.ts"
      - ".github/workflows/vue-runtime-bundle-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_BUILD_JOBS: "12"
  VIZE_TEST_REQUIRE_TSGO: "1"

jobs:
  compare:
    name: Disabled, cold and warm runtime parity
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.0"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: nextest-ci
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: false
      - name: Install exact pinned dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - name: Build the unchanged Transition parity test once
        run: cargo test --profile ci --package vize_atelier_vapor --test davinci_transition_parity --no-run
      - name: Compare identical inputs and all fresh subprocesses
        run: vp exec node tools/support/compat/github/compare-vue-runtime-bundles.ts "$RUNNER_TEMP/runtime-bundle-comparison"
      - name: Retain complete inputs, parity logs and timing evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-bundle-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-bundle-comparison/
          if-no-files-found: error
          retention-days: 14
