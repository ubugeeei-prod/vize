# DO NOT EDIT. Generated from tools/ci/workflows/09-eslint-plugin/workflow.pkl.
# Edit the Pkl source and run `node tools/commands/generate/repository-config.ts`.
name: ESLint plugin consumer

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "npm/linter/eslint/**"
      - "npm/linter/oxlint/src/eslint*"
      - "npm/linter/oxlint/src/native.ts"
      - "npm/linter/oxlint/src/configs.ts"
      - "npm/linter/oxlint/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/09-eslint-plugin.yml"
      - "tools/ci/workflows/09-eslint-plugin/scripts/**"

permissions: { contents: read }

concurrency:
  group: eslint-plugin-consumer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "12"
      CARGO_TERM_COLOR: always
      VIZE_PREFER_WORKSPACE_BINDING: "1"
      VIZE_ESLINT_EVIDENCE: ${{ github.workspace }}/target/eslint-consumer
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /tools/ci/lib/scripts/
            /tools/ci/workflows/09-eslint-plugin/scripts/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          {
            version: latest,
            node-version-file: package.json,
            cache: true,
            cache-save: false,
            run-install: false,
          }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.100.0" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with: { key: test-scripts, cache-key-suffix: "${{ runner.os }}-${{ runner.arch }}" }
      - run: vp install --frozen-lockfile --prefer-offline
      - name: Build the actual source native addon and shared rule bridge
        run: . "${{ env.VIZE_CI_FILES }}/build-the-actual-source-native-addon-and-shared-rule-bridge.sh"
      - name: Preserve exact source and dependency authority
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/preserve-exact-source-and-dependency-authority.sh"
      - name: Qualify real flat-config consumers, source authority and call counts
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/qualify-real-flat-config-consumers-source-authority-and-call-counts.sh"
      - name: Verify no physical SFC reads, including native code
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/verify-no-physical-sfc-reads-including-native-code.sh"
      - name: Qualify packed public entries in an isolated consumer
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/qualify-packed-public-entries-in-an-isolated-consumer.sh"
      - name: Stage the same source addon for supported Node and TypeScript consumers
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/stage-the-same-source-addon-for-supported-node-and-typescript-consumers.sh"
      - name: Share packed exports and source addon without rebuilding native code
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eslint-packed-source-${{ env.SOURCE_SHA }}
          path: |
            target/eslint-consumer/*.tgz
            target/eslint-consumer/source.json
            target/eslint-consumer/consumer.json
            target/eslint-consumer/native-package/**
          if-no-files-found: error
          retention-days: 14
      - name: Retain complete source-native packets, raw traces and timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eslint-plugin-consumer-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.SOURCE_SHA }}
          path: target/eslint-consumer/**
          if-no-files-found: error
          retention-days: 14

  supported-consumer:
    name: ESLint packed consumer (Node ${{ matrix.node }}, TS ${{ matrix.typescript }})
    needs: consumer
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24.14.0"]
        typescript: ["4.8.4", "5.9.3", "6.0.3"]
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eslint-packed-source-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/eslint-packed-source
      - name: Check installed public exports with the exact supported providers
        run: >-
          node --experimental-strip-types npm/linter/eslint/test/legacy-consumer.ts
          --artifacts "$RUNNER_TEMP/eslint-packed-source"
          --output "$RUNNER_TEMP/eslint-compatibility"
          --node "${{ matrix.node }}"
          --typescript "${{ matrix.typescript }}"
      - name: Retain install logs, exact providers and complete failure/clean packets
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eslint-supported-consumer-node-${{ matrix.node }}-typescript-${{ matrix.typescript }}-${{ env.SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/eslint-compatibility/*.json
            ${{ runner.temp }}/eslint-compatibility/project*/package*.json
            ${{ runner.temp }}/eslint-compatibility/project*/consumer.mjs
          if-no-files-found: error
          retention-days: 14
