name: App E2E

on:
  # Keep PR feedback scoped to surfaces that can affect compiler/package/app
  # behavior. The fast lane below uses focused pinned fixtures; the full
  # App E2E and VRT matrices remain nightly/on-demand release evidence.
  pull_request:
    branches: [main]
  schedule:
    # 02:23 UTC daily (~11:23 JST). Covers every suite including vrt.
    - cron: "23 2 * * *"
  # A dispatch run's GitHub head_sha comes from --ref. Release evidence must
  # therefore use a branch or tag whose tip is target_sha; suite=all validates
  # that invariant before checkout. Existing one-suite and Testbox dispatches
  # may omit target_sha and continue to run at the selected --ref tip.
  workflow_dispatch:
    inputs:
      suite:
        description: App e2e suite to run
        required: true
        default: dev
        type: choice
        options:
          - dev
          - vrt
          - preview
          - check
          - lint
          - build
          - all
      target_sha:
        description: Full lowercase 40-character target SHA; --ref must be a branch or tag at this commit
        required: false
        type: string
      testbox_id:
        description: Blacksmith Testbox session ID
        required: false
        type: string

run-name: App E2E ${{ github.event_name == 'pull_request' && format('readiness-pr-{0}', github.event.pull_request.number) || (github.event_name == 'workflow_dispatch' && (inputs.testbox_id || inputs.suite) || 'nightly') }} @ ${{ inputs.target_sha || github.sha }}

concurrency:
  group: app-e2e-${{ github.event_name == 'workflow_dispatch' && (inputs.testbox_id || inputs.suite) || github.ref }}-${{ github.event_name == 'workflow_dispatch' && (inputs.target_sha || github.sha) || github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  E2E_TARGET_SHA: ${{ inputs.target_sha || github.sha }}

jobs:
  app-readiness:
    name: app-readiness
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read # required by actions/checkout
      pull-requests: read # required by dorny/paths-filter
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
      VIZE_TEST_WORKTREE_ID: ci-readiness
    steps:
      # Keep this job present on every PR so it can be a required context.
      # Irrelevant/docs-only changes stop after this read-only API query.
      - name: Detect app readiness changes
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            readiness:
              - '.github/actions/app-readiness/**'
              - '.cargo/**'
              - '.github/actions/setup-moonbit/**'
              - '.github/actions/setup-rust-sticky-cache/**'
              - '.github/workflows/e2e.yml'
              - '.gitmodules'
              - '.node-version'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/**'
              - 'npm/native/**'
              - 'npm/cli/**'
              - 'npm/builder/vite/**'
              - 'npm/framework/nuxt/**'
              - 'npm/builder/vite-musea/**'
              - 'npm/framework/musea-nuxt/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'rust-toolchain.toml'
              - 'tests/package.json'
              - 'tests/tsconfig.json'
              - 'tests/_fixtures/_git/elk'
              - 'tests/_fixtures/_git/misskey'
              - 'tests/_fixtures/_projects/generic-build/**'
              - 'tests/_fixtures/_projects/compiler-macros/**'
              - 'tests/_helpers/**'
              - 'tests/app/dev/misskey.spec.ts'
              - 'tests/app/playwright.config.ts'
              - 'tests/snapshots/check/compiler-macros.ts'
              - 'tests/snapshots/check/__snapshots__/compiler-macros-check.snap'
              - 'tests/snapshots/build/elk.ts'
              - 'tests/snapshots/build/generic.ts'
              - 'tests/snapshots/build/__snapshots__/generic-*.snap'
              - 'tests/tooling/cli-lint-contract.test.ts'
              - 'tools/moon/**'
              - 'tools/vite-plus/**'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'vite.config.ts'

      - name: Checkout readiness source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: steps.changes.outputs.readiness == 'true'
        with:
          persist-credentials: false

      - name: Run app readiness
        if: steps.changes.outputs.readiness == 'true'
        uses: ./.github/actions/app-readiness

  testbox:
    name: Testbox
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.testbox_id != '' }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"
    steps:
      - name: Validate optional target SHA
        if: ${{ inputs.target_sha != '' }}
        env:
          REQUESTED_TARGET_SHA: ${{ inputs.target_sha }}
          RUN_HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$REQUESTED_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid target_sha::target_sha must be a full lowercase 40-character commit SHA"
            exit 1
          fi
          if [[ "$RUN_HEAD_SHA" != "$REQUESTED_TARGET_SHA" ]]; then
            echo "::error title=Dispatch ref mismatch::run head_sha comes from --ref; dispatch with a branch or tag at $REQUESTED_TARGET_SHA (got $RUN_HEAD_SHA)"
            exit 1
          fi

      - name: Begin Testbox
        id: begin-testbox
        uses: useblacksmith/begin-testbox@233448af4bfdc6fca509a7f0974411ac6d8a8043 # v2
        with:
          testbox_id: ${{ inputs.testbox_id }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.E2E_TARGET_SHA }}

      - uses: ./.github/actions/hydrate-app-fixtures

      - name: Setup Vite+ and Node.js
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: ".node-version"
          cache: true
          run-install: false

      - uses: ./.github/actions/setup-moonbit

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: testbox
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline

      - name: Install Pkl CLI
        run: npm install --global @pkl-community/pkl@0.27.2

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        with:
          tool: wasm-bindgen-cli@0.2.121

      - name: Run Testbox
        uses: useblacksmith/run-testbox@5ca05834db1d3813554d1dd109e5f2087a8d7cbc # v2
        if: ${{ always() && steps.begin-testbox.outcome == 'success' }}

  app-e2e:
    name: app-e2e (${{ matrix.suite }})
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.testbox_id == '') }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # workflow_dispatch: pick one suite, or `all` for release evidence.
        # schedule: run every suite, including vrt, because nothing else
        # exercises the visual regression baselines today.
        suite: ${{ github.event_name == 'workflow_dispatch' && inputs.suite != 'all' && fromJSON(format('["{0}"]', inputs.suite)) || fromJSON('["dev","vrt","preview","build","check","lint"]') }}
    steps:
      - name: Validate target SHA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          REQUESTED_SUITE: ${{ inputs.suite }}
          REQUESTED_TARGET_SHA: ${{ inputs.target_sha }}
          RUN_HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -z "$REQUESTED_TARGET_SHA" ]]; then
            if [[ "$REQUESTED_SUITE" == "all" ]]; then
              echo "::error title=Missing target_sha::target_sha is required when suite=all"
              exit 1
            fi
            exit 0
          fi
          if [[ ! "$REQUESTED_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid target_sha::target_sha must be a full lowercase 40-character commit SHA"
            exit 1
          fi
          if [[ "$RUN_HEAD_SHA" != "$REQUESTED_TARGET_SHA" ]]; then
            echo "::error title=Dispatch ref mismatch::run head_sha comes from --ref; dispatch with a branch or tag at $REQUESTED_TARGET_SHA (got $RUN_HEAD_SHA)"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.E2E_TARGET_SHA }}

      - uses: ./.github/actions/hydrate-app-fixtures

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Setup Wild linker
        uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"

      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: app-e2e-${{ matrix.suite }}
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Setup Vite+ and Node.js
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: ".node-version"
          cache: true
          run-install: false

      - uses: ./.github/actions/setup-moonbit

      - name: Install JS dependencies
        run: |
          vp install --frozen-lockfile --prefer-offline \
            --filter './tests...' \
            --filter './npm/native...' \
            --filter './npm/cli...' \
            --filter './npm/builder/vite...' \
            --filter './npm/framework/nuxt...' \
            --filter './npm/builder/vite-musea...' \
            --filter './npm/framework/musea-nuxt...'

      - name: Build native package
        run: vp run --filter './npm/native' build:ci

      - name: Build vize CLI
        run: cargo build --profile ci -p vize

      - name: Cache Playwright browsers
        id: cache-playwright
        if: ${{ contains(fromJSON('["dev","vrt"]'), matrix.suite) }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: ${{ contains(fromJSON('["dev","vrt"]'), matrix.suite) && steps.cache-playwright.outputs.cache-hit != 'true' }}
        run: vp exec --filter './tests' -- playwright install --with-deps chromium

      - name: Run selected app e2e suite
        run: |
          case "${{ matrix.suite }}" in
            dev)
              vp run --filter './tests' test:dev:ci
              ;;
            vrt)
              vp run --filter './tests' test:vrt
              ;;
            preview)
              RUN_BUILD_TESTS=1 vp run --filter './tests' test:preview
              ;;
            check)
              vp run --filter './tests' test:check
              ;;
            lint)
              vp run --filter './tests' test:lint
              ;;
            build)
              vp run --filter './tests' test:build
              ;;
          esac

      - name: Upload app e2e artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-e2e-artifacts-${{ matrix.suite }}
          path: |
            tests/app/results/
            tests/app/screenshots/
            tests/app/playwright-report/
            tests/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
