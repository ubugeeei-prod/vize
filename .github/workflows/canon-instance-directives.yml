name: Canon instance directive ownership
on:
  pull_request:
    paths:
      - .github/workflows/canon-instance-directives.yml
      - .github/scripts/workflows/canon-instance-directives/**
      - .github/scripts/workflows/shared/**
      - tools/benchmarks/scripts/canon-instance-directives*.ts
      - tools/benchmarks/scripts/canon-instance-directives-observer.js
      - crates/vize_canon/src/projection/assemble/authored_rules.rs
      - crates/vize_canon/src/projection/assemble/authored_rules/**
      - tests/tooling/canon-upstream-diagnostics.test.ts
permissions: { contents: read }
concurrency:
  group: canon-instance-directives-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      VIZE_CI_FILES: "${{ github.workspace }}/.github/scripts/workflows/canon-instance-directives"
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "8"
      GOMAXPROCS: "8"
      RAYON_NUM_THREADS: "8"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false, fetch-depth: 2 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version-file: package.json, package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.100.0" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - name: Verify actual merge parents and immutable product sources
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/verify-actual-merge-parents-and-immutable-product-sources.sh"
      - name: Install fixed real Vue and both independent checker providers
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/install-fixed-real-vue-and-both-independent-checker-providers.sh"
      - name: Build normal base and candidate in separate fresh target directories
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/build-normal-base-and-candidate-in-separate-fresh-target-directories.sh"
      - name: Exercise Rust ownership positive and negative controls
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/exercise-rust-ownership-positive-and-negative-controls.sh"
      - name: Retain real native base red and candidate packets with independent type witnesses
        shell: bash
        timeout-minutes: 12
        run: . "${{ env.VIZE_CI_FILES }}/retain-real-native-base-red-and-candidate-packets-with-independent-type.sh"
      - name: Run the unchanged 230-project authored upstream oracle
        shell: bash
        timeout-minutes: 12
        run: . "${{ env.VIZE_CI_FILES }}/run-the-unchanged-230-project-authored-upstream-oracle.sh"
      - name: Preserve bounded evidence without dereferencing project provider links
        if: always()
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/preserve-bounded-evidence-without-dereferencing-project-provider-links.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: canon-instance-directives-${{ github.sha }}
          path: ${{ runner.temp }}/instance-directives-evidence.tgz
          retention-days: 30
