name: Art source products
on:
  pull_request:
    paths:
      - "crates/vize_musea/**"
      - "crates/vize_croquis/src/sfc/**"
      - "crates/vize_croquis/src/script_parser/**"
      - "davinci/vize_l1/src/container/**"
      - "davinci/vize_l1/src/markup/**"
      - "**/*.art.vue"
      - "**/*.art.vue.txt"
      - ".github/workflows/art-source-products.yml"
permissions: { contents: read }
concurrency:
  group: art-source-products-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  gallery-products:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "24"
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "16777216"
      RUSTUP_TOOLCHAIN: "1.100.0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.100.0", components: clippy }
      - uses: ./.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: art-products-cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Compare original gallery records, generated modules, Markdown and public warnings
        run: |
          set -euo pipefail
          flags=(--locked --profile ci-opt -p vize_musea)
          cargo test "${flags[@]}" --lib
          cargo clippy "${flags[@]}" --features art-source-products --lib --no-deps -- -D warnings
          export VIZE_ART_SOURCE_INPUTS="$RUNNER_TEMP/gallery-sources"
          git ls-files -z -- '*.vue' '*.vue.txt' > "$VIZE_ART_SOURCE_INPUTS"
          cargo test "${flags[@]}" --features art-source-products --test art_source_products -- --include-ignored --nocapture --test-threads=1
