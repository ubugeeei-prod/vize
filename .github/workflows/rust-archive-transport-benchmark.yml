name: Rust archive transport benchmark
on:
  workflow_dispatch:
  workflow_call:
permissions: { contents: read, actions: read }
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
concurrency:
  group: rust-archive-transport-${{ github.ref }}
  cancel-in-progress: false
jobs:
  producer:
    name: Preserve the complete original Rust archive and measure one re-encoding
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: ./.github/actions/measure-rust-archive-window
  consumer:
    name: Original Rust partition ${{ matrix.shard }}/4 (${{ matrix.arm }})
    needs: producer
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, candidate]
        shard: [1, 2, 3, 4]
    env:
      CARGO_BUILD_JOBS: "12"
      VIZE_NUXT_CONFIG_ITERATIONS: "100"
      RUST_TEST_THREADS: "4"
      VIZE_TEST_DISABLE_TSGO: "1"
      NEXTEST_PROFILE: pr
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: ./.github/actions/verify-rust-archive-window
        with: { arm: "${{ matrix.arm }}", shard: "${{ matrix.shard }}" }
  compare:
    name: Require identical complete tar and all four original case vectors
    if: ${{ always() && !cancelled() }}
    needs: [producer, consumer]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rust-window-worker-*-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-window-workers
          digest-mismatch: error
      - name: Refuse missing, mismatched or failed original partitions
        run: python3 -B tools/support/compat/github/rust_archive_workers.py aggregate "$RUNNER_TEMP/rust-window-workers" "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: rust-window-comparison-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-window-workers/aggregate.json
          if-no-files-found: warn
          retention-days: 14
