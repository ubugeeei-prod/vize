name: Rust archive transport benchmark
on:
  workflow_dispatch:
  workflow_call:
permissions: { contents: read, actions: read }
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
concurrency:
  group: rust-archive-transport-${{ github.ref }}
  cancel-in-progress: false
jobs:
  producer:
    name: Preserve the complete original Rust archive and measure one re-encoding
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: ./.github/actions/measure-rust-archive-window
  consumer:
    name: Original Rust partition ${{ matrix.shard }}/4 (${{ matrix.arm }})
    needs: producer
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, candidate]
        shard: [1, 2, 3, 4]
    env:
      CARGO_BUILD_JOBS: "12"
      VIZE_NUXT_CONFIG_ITERATIONS: "100"
      RUST_TEST_THREADS: "4"
      VIZE_TEST_DISABLE_TSGO: "1"
      NEXTEST_PROFILE: pr
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - name: Keep the reviewed driver outside the frozen checkout
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rust-window-driver" "$RUNNER_TEMP/rust-window-worker"
          python3 -B tools/support/compat/github/rust_archive_transport.py driver "$GITHUB_SHA" "$RUNNER_TEMP/rust-window-worker/driver.json"
          cp -p tools/support/compat/github/artifact_payload_files.py tools/support/compat/github/artifact_payload_download.py tools/support/compat/github/rust_archive_*.py "$RUNNER_TEMP/rust-window-driver/"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: e057b3dd9e8ebed0dee7f4239a34daa2b410f7a0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with: { toolchain: "1.99.0" }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: package.json, cache: true, run-install: true }
      - uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        with: { tool: cargo-nextest@0.9.146 }
      - name: Install the unchanged original Pkl fixture runtime
        shell: bash
        run: npm install --global @pkl-community/pkl@0.27.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-window-custody-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-window-custody
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-window-${{ matrix.arm }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-window-body
          digest-mismatch: error
      - name: Authenticate source, original receipt, body and complete decoded inventory
        env: { ARM: "${{ matrix.arm }}" }
        shell: bash
        run: |
          driver="$RUNNER_TEMP/rust-window-driver"
          custody="$RUNNER_TEMP/rust-window-custody/trial"
          built="$GITHUB_WORKSPACE/.artifacts/rust-window/built"
          if [[ "$ARM" == baseline ]]; then
            python3 -B "$driver/rust_archive_transport.py" unpack "$RUNNER_TEMP/rust-window-body/original.zip" "$built"
            node tools/support/compat/github/rust-test-archive.mjs verify "$built/tests.tar.zst" "$built/receipt.json"
          elif [[ "$ARM" == candidate ]]; then
            mkdir -p "$built"
            cp "$RUNNER_TEMP/rust-window-body/tests.tar.zst" "$built/tests.tar.zst"
            cp "$custody/original-receipt.json" "$built/receipt.json"
          else exit 1; fi
          python3 -B "$driver/rust_archive_transport.py" verify "$custody" "$ARM" "$built/tests.tar.zst" "$GITHUB_SHA"
          python3 -B "$driver/rust_archive_workers.py" context "$custody" "$RUNNER_TEMP/rust-window-worker/runtime.json"
          cargo nextest --version > "$RUNNER_TEMP/rust-window-worker/nextest-version.stdout"
          /usr/bin/time -v -o "$RUNNER_TEMP/rust-window-worker/decode.resources" python3 -B "$driver/rust_archive_inventory.py" "$built/tests.tar.zst" "$RUNNER_TEMP/rust-window-worker/inventory.json"
          cmp "$RUNNER_TEMP/rust-window-worker/inventory.json" "$custody/$ARM-inventory.json"
      - name: Capture the complete original partition and run it without rebuilding
        env: { ARM: "${{ matrix.arm }}", SHARD: "${{ matrix.shard }}" }
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/rust-window-worker"
          built="$GITHUB_WORKSPACE/.artifacts/rust-window/built"
          mkdir -p target/tmp
          if [[ "$SHARD" == 1 ]]; then
            python3 -B "$RUNNER_TEMP/rust-window-driver/rust_archive_workers.py" execute "$GITHUB_SHA" cargo nextest list --archive-file "$built/tests.tar.zst" --extract-to "$GITHUB_WORKSPACE" --extract-overwrite --workspace-remap "$GITHUB_WORKSPACE" --profile "$NEXTEST_PROFILE" --message-format json > "$evidence/unpartitioned.json" 2> "$evidence/unpartitioned.stderr"
          fi
          /usr/bin/time -v -o "$evidence/list.resources" python3 -B "$RUNNER_TEMP/rust-window-driver/rust_archive_workers.py" execute "$GITHUB_SHA" cargo nextest list --archive-file "$built/tests.tar.zst" --extract-to "$GITHUB_WORKSPACE" --extract-overwrite --workspace-remap "$GITHUB_WORKSPACE" --profile "$NEXTEST_PROFILE" --partition "hash:$SHARD/4" --message-format json > "$evidence/tests.json" 2> "$evidence/list.stderr"
          if /usr/bin/time -v -o "$evidence/run.resources" python3 -B "$RUNNER_TEMP/rust-window-driver/rust_archive_workers.py" execute "$GITHUB_SHA" cargo nextest run --archive-file "$built/tests.tar.zst" --extract-to "$GITHUB_WORKSPACE" --extract-overwrite --workspace-remap "$GITHUB_WORKSPACE" --profile "$NEXTEST_PROFILE" --partition "hash:$SHARD/4" --no-tests=pass > "$evidence/run.stdout" 2> "$evidence/run.stderr"; then phase_exit=0; else phase_exit=$?; fi
          mkdir -p "$evidence/source-results"
          cp -R target/nextest/pr/. "$evidence/source-results/"
          python3 -B "$RUNNER_TEMP/rust-window-driver/rust_archive_workers.py" record "$evidence" "$ARM" "$SHARD" "$GITHUB_SHA" "$built/tests.tar.zst" "$RUNNER_TEMP/rust-window-custody/trial" "$phase_exit"
          exit "$phase_exit"
      - name: Retain every raw stream, case result, body inventory and resource observation
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-window-worker-${{ matrix.arm }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-window-worker/
          if-no-files-found: error
          retention-days: 14
  compare:
    name: Require identical complete tar and all four original case vectors
    if: ${{ always() && !cancelled() }}
    needs: [producer, consumer]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rust-window-worker-*-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-window-workers
          digest-mismatch: error
      - name: Refuse missing, mismatched or failed original partitions
        run: python3 -B tools/support/compat/github/rust_archive_workers.py aggregate "$RUNNER_TEMP/rust-window-workers" "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: rust-window-comparison-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-window-workers/aggregate.json
          if-no-files-found: warn
          retention-days: 14
