name: Deploy docs

on:
  workflow_run:
    workflows:
      - Docs build
    types:
      - completed
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    name: Deploy completed docs build
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    concurrency:
      group: pages-main
      # Preserve newer pending deploys when an older build finishes late.
      queue: max
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      deployments: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Setup deployment validator runtime
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: false
          run-install: false

      - name: Validate completed build and actual Pages publication floor
        id: main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Preserve trusted main validators when the completed source is older.
          cp tools/support/compat/github/docs-deployment-*.ts "$RUNNER_TEMP/"
          vp node "$RUNNER_TEMP/docs-deployment-entry.ts" prepare

      - name: Checkout docs build
        if: ${{ steps.main.outputs.eligible == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download docs build artifacts
        if: ${{ steps.main.outputs.eligible == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          artifact-ids: ${{ steps.main.outputs.artifact_ids }}
          github-token: ${{ github.token }}
          path: artifacts

      - if: ${{ steps.main.outputs.eligible == 'true' }}
        uses: ./.github/actions/setup-moonbit

      - name: Create site structure
        if: ${{ steps.main.outputs.eligible == 'true' }}
        run: moon run --target native tools/moon/cmd/github/create_site_structure --

      - name: Setup Pages
        if: ${{ steps.main.outputs.eligible == 'true' }}
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload pages artifact
        if: ${{ steps.main.outputs.eligible == 'true' }}
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site

      - name: Record Pages artifact custody
        if: ${{ steps.main.outputs.eligible == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: vp node "$RUNNER_TEMP/docs-deployment-entry.ts" record

      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ steps.main.outputs.eligible == 'true' }}
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Confirm actual Pages publication
        if: ${{ steps.main.outputs.eligible == 'true' && steps.deployment.conclusion == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: vp node "$RUNNER_TEMP/docs-deployment-entry.ts" finish
