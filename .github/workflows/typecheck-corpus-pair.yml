name: Type-check corpus pair
run-name: "Type-check corpus pair ${{ inputs.base_sha }}...${{ inputs.head_sha }}"
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full 40-hex baseline commit
        type: string
        required: true
      head_sha:
        description: Full 40-hex candidate commit
        type: string
        required: true
      runs:
        description: Timed runs per lane (median reported)
        type: string
        default: "5"
      owned_pair:
        description: Lossless source pair including huge Vue/Nuxt, explicit widths and isolated caches
        type: boolean
        default: false
      workloads:
        description: Optional comma-separated owned workload IDs
        type: string
        default: ""
      batch:
        description: Also diff the head build's vize check against its mapper under tsc
        type: boolean
        default: false
permissions: { contents: read }
concurrency:
  group: typecheck-corpus-pair-${{ inputs.base_sha }}-${{ inputs.head_sha }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  measure:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: ${{ inputs.owned_pair && 240 || 120 }}
    env:
      VIZE_PAIR_RUNNER_LABEL: blacksmith-32vcpu-ubuntu-2404
      BASE_SHA: ${{ inputs.base_sha }}
      HEAD_SHA: ${{ inputs.head_sha }}
      RUNS: ${{ inputs.runs }}
      BATCH: ${{ inputs.batch }}
      OWNED_PAIR: ${{ inputs.owned_pair }}
      OWNED_WORKLOADS: ${{ inputs.workloads }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != "$HEAD_SHA" ]]
          [[ "$RUNS" =~ ^[1-9][0-9]?$ ]]
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-script
      - name: Check out base and head beside the driver
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$BASE_SHA" "$HEAD_SHA"
          git worktree add --detach "$RUNNER_TEMP/pair-base" "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/pair-head" "$HEAD_SHA"
      - name: Hydrate the pinned corpora and install the locked hosts and corpus packages
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 -- tests/_fixtures/_git/misskey tests/_fixtures/_git/n8n
          npm ci --prefix tools/benchmarks/typecheck-hosts --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/benchmarks/typecheck-corpora --ignore-scripts --no-audit --no-fund
          if [[ "$OWNED_PAIR" == true ]]; then
            npm ci --prefix tools/benchmarks/nuxt-app --no-audit --no-fund
          fi
          # The vue-tsc reference and its TypeScript 6, as the workspace lockfile pins them.
          vp install --frozen-lockfile --prefer-offline --filter './tools/benchmarks/scripts'
          if ! /usr/bin/time --version 2>&1 | grep -qi 'GNU time'; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends time
          fi
          /usr/bin/time --version
      - name: Test the pair parsers and the byte probe
        run: node --test tests/tooling/typecheck-corpus-pair.test.ts tests/tooling/typecheck-owned-pair.test.ts
      - name: Test the opt-in Linux raw runner
        if: inputs.owned_pair
        env:
          VIZE_PAIR_RUNNER_LABEL: blacksmith-32vcpu-ubuntu-2404
        run: node --test tests/tooling/typecheck-owned-pair-linux.test.ts
      - name: Record fresh owned-pair build boundary
        if: inputs.owned_pair
        run: node tools/benchmarks/scripts/typecheck-owned-pair-build.ts "$RUNNER_TEMP/pair-base" "$BASE_SHA" "$RUNNER_TEMP/pair-head" "$HEAD_SHA" "$RUNNER_TEMP/pair-out"
      - name: Build the native binding and the vize package for base and head
        run: |
          set -euo pipefail
          for role in base head; do
            (
              cd "$RUNNER_TEMP/pair-$role"
              vp install --frozen-lockfile --prefer-offline --filter './npm/cli...' --filter './npm/native...'
              # Install each rust-toolchain.toml toolchain before the parallel builds race on it.
              cargo --version
            )
          done
          pids=()
          for role in base head; do
            (
              cd "$RUNNER_TEMP/pair-$role"
              if [[ "$OWNED_PAIR" == true ]]; then export CARGO_TARGET_DIR="$PWD/target"; fi
              vp run --workspace-root build:native > "$RUNNER_TEMP/build-$role.log" 2>&1
            ) &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          for role in base head; do echo "::group::native build $role"; tail -n 40 "$RUNNER_TEMP/build-$role.log"; echo "::endgroup::"; done
          [[ "$status" == 0 ]]
          for role in base head; do
            (cd "$RUNNER_TEMP/pair-$role" && vp run --filter './npm/cli' build)
            git -C "$RUNNER_TEMP/pair-$role" rev-parse HEAD
          done
      - name: Measure both corpora
        env:
          VIZE_PAIR_RUNNER_LABEL: blacksmith-32vcpu-ubuntu-2404
        run: |
          set -euo pipefail
          if [[ "$OWNED_PAIR" == true ]]; then
            workload_args=()
            if [[ -n "$OWNED_WORKLOADS" ]]; then workload_args+=(--workloads "$OWNED_WORKLOADS"); fi
            node tools/benchmarks/scripts/typecheck-owned-pair.ts \
              --base "$RUNNER_TEMP/pair-base" --head "$RUNNER_TEMP/pair-head" \
              --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
              --work "$RUNNER_TEMP/pair-work" --out "$RUNNER_TEMP/pair-out" \
              "${workload_args[@]}"
            exit
          fi
          extra=()
          if [[ "$BATCH" == true ]]; then extra+=(--batch); fi
          node tools/benchmarks/scripts/typecheck-corpus-pair.ts \
            --base "$RUNNER_TEMP/pair-base" --head "$RUNNER_TEMP/pair-head" \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --runs "$RUNS" \
            --work "$RUNNER_TEMP/pair-work" --out "$RUNNER_TEMP/pair-out" "${extra[@]}"
      - name: Write job summary
        if: always()
        run: |
          for report in summary projection batch-vs-mapper; do
            if [[ -f "$RUNNER_TEMP/pair-out/$report.md" ]]; then cat "$RUNNER_TEMP/pair-out/$report.md" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: typecheck-corpus-pair-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pair-out/
            ${{ runner.temp }}/build-*.log
          if-no-files-found: warn
          retention-days: 30
