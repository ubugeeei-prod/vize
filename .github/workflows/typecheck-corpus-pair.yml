# DO NOT EDIT. Generated from tools/config/pkl/workflows/typecheck/typecheck-corpus-pair.pkl.
# Edit the Pkl source and run `node tools/commands/generate/repository-config.ts`.
name: Type-check corpus pair
run-name: "Type-check corpus pair ${{ inputs.base_sha }}...${{ inputs.head_sha }}"
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full 40-hex baseline commit (the head SHA again for an A/A run)
        type: string
        required: true
      head_sha:
        description: Full 40-hex candidate commit
        type: string
        required: true
      runs:
        description: Timed runs per lane (median reported)
        type: string
        default: "5"
      owned_pair:
        description: Lossless source pair including huge Vue/Nuxt, explicit widths and isolated caches
        type: boolean
        default: false
      workloads:
        description: Optional comma-separated owned workload IDs
        type: string
        default: ""
      lanes:
        description: Optional comma-separated owned pair lane IDs
        type: string
        default: ""
      batch:
        description: Also diff the head build's vize check against its mapper under tsc
        type: boolean
        default: false
      attribution:
        description: Attribute tsc check time and types to helpers and projection families, base vs head
        type: boolean
        default: true
      floors:
        description: Also time the head build's floors (absolute, expressions-only, zero mapper wait)
        type: boolean
        default: false
      corpora:
        description: Optional comma-separated corpora (misskey, n8n, nuxt-ui, reka-ui)
        type: string
        default: ""
permissions: { contents: read }
concurrency:
  group: typecheck-corpus-pair-${{ inputs.base_sha }}-${{ inputs.head_sha }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  measure:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: ${{ inputs.owned_pair && 240 || 120 }}
    env:
      VIZE_PAIR_RUNNER_LABEL: blacksmith-32vcpu-ubuntu-2404
      BASE_SHA: ${{ inputs.base_sha }}
      HEAD_SHA: ${{ inputs.head_sha }}
      RUNS: ${{ inputs.runs }}
      BATCH: ${{ inputs.batch }}
      OWNED_PAIR: ${{ inputs.owned_pair }}
      OWNED_WORKLOADS: ${{ inputs.workloads }}
      OWNED_LANES: ${{ inputs.lanes }}
      FLOORS: ${{ inputs.floors }}
      CORPORA: ${{ inputs.corpora }}
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/typecheck-corpus-pair/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - name: Validate inputs
        run: . "${{ env.VIZE_CI_FILES }}/validate-inputs.sh"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.100.0" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-script
      - name: Check out base and head beside the driver
        run: . "${{ env.VIZE_CI_FILES }}/check-out-base-and-head-beside-the-driver.sh"
      - name: Hydrate the pinned corpora and install the locked hosts and corpus packages
        run: . "${{ env.VIZE_CI_FILES }}/hydrate-the-pinned-corpora-and-install-the-locked-hosts-and-corpus-packa.sh"
      - name: Test the pair parsers and the byte probe
        run: node --test tests/tooling/typecheck-corpus-pair.test.ts tests/tooling/typecheck-corpus-pair-corpora.test.ts tests/tooling/typecheck-corpus-pair-cold.test.ts tests/tooling/typecheck-corpus-pair-floors.test.ts tests/tooling/typecheck-owned-pair.test.ts tests/tooling/typecheck-corpus-mutations.test.ts
      - name: Test the opt-in Linux raw runner
        if: inputs.owned_pair
        env:
          VIZE_PAIR_RUNNER_LABEL: blacksmith-32vcpu-ubuntu-2404
        run: node --test tests/tooling/typecheck-owned-pair-linux.test.ts
      - name: Record fresh owned-pair build boundary
        if: inputs.owned_pair
        run: node tools/benchmarks/scripts/typecheck-owned-pair-build.ts "$RUNNER_TEMP/pair-base" "$BASE_SHA" "$RUNNER_TEMP/pair-head" "$HEAD_SHA" "$RUNNER_TEMP/pair-out"
      - name: Build the native binding and the vize package for base and head
        run: . "${{ env.VIZE_CI_FILES }}/build-the-native-binding-and-the-vize-package-for-base-and-head.sh"
      - name: Measure the corpora
        id: measure
        env:
          VIZE_PAIR_RUNNER_LABEL: blacksmith-32vcpu-ubuntu-2404
        run: . "${{ env.VIZE_CI_FILES }}/measure-the-corpora.sh"
      # Reads the traced probe runs the measure step left behind.
      - name: Attribute check cost to helpers and projection families
        if: always() && !inputs.owned_pair && inputs.attribution
        run: node tools/benchmarks/scripts/typecheck-cost-attribution.ts --pair "$RUNNER_TEMP/pair-work" --out "$RUNNER_TEMP/pair-out"
      # Real components edited to plant one diagnostic per family; the head must report each exactly once.
      - name: Check planted diagnostics in the planted corpora
        if: ${{ !cancelled() && !inputs.owned_pair && steps.measure.outcome != 'skipped' }}
        run: node tools/benchmarks/scripts/typecheck-corpus-mutations-run.ts --base "$RUNNER_TEMP/pair-base" --head "$RUNNER_TEMP/pair-head" --work "$RUNNER_TEMP/pair-work" --out "$RUNNER_TEMP/pair-out" --corpora "$CORPORA"
      - name: Write job summary
        if: always()
        run: . "${{ env.VIZE_CI_FILES }}/write-job-summary.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: typecheck-corpus-pair-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pair-out/
            ${{ runner.temp }}/build-*.log
          if-no-files-found: warn
          retention-days: 30
