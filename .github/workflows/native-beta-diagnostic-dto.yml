    name: ${{ matrix.role == 'before' && matrix.sdk.version == '7.1.0-beta' && 'Baseline DTO refusal observation' || matrix.role == 'before' && matrix.sdk.version == '7.0.2' && 'Baseline registration boundary observation' || 'Functional source control' }} (${{ matrix.role }}, ${{ matrix.sdk.version }})
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        role: [before, after]
        sdk:
          - version: 7.0.2
            sha256: 4f2de678286401759b3fb4475bafe35b8f32b4b3a07d92642bbf37eadc9b34a4
          - version: 7.1.0-beta
            sha256: a183b1956edbe7e7d98f2249858eedf2d8a9790809cc4909db1276e202faaa70
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: 13fa41356d075047a229f580014b637d3bbeb57f
      ROLE: ${{ matrix.role }}
      SDK_VERSION: ${{ matrix.sdk.version }}
      SDK_SHA256: ${{ matrix.sdk.sha256 }}
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/native-beta-diagnostic-dto/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: 1.99.1, components: clippy }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - name: Install exact official SDK into an isolated consumer
        working-directory: ${{ runner.temp }}
        run: . "${{ env.VIZE_CI_FILES }}/install-exact-official-sdk-into-an-isolated-consumer.sh"
      - name: Pin before production bytes and identical observer separately
        run: node tests/tooling/support/native-beta-dto/prepare-role.ts
      - name: Pin actual native image and retain all raw process streams
        run: node tests/tooling/support/native-beta-dto/provider.ts
      - name: Exercise same source and SDK error, repair, hover, refs and foreign-file control
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/exercise-same-source-and-sdk-error-repair-hover-refs-and-foreign-file-co.sh"
      - name: Verify closed raw native frames and exact per-file request shapes
        if: ${{ !cancelled() }}
