name: Native beta diagnostic DTO
on:
  pull_request:
    paths:
      - crates/vize_canon/src/lsp_client/**
      - tests/_fixtures/differential/typechecker/snapshot-source-text/**
      - tests/tooling/support/native-beta-dto/**
      - .github/workflows/native-beta-diagnostic-dto.yml
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch: {}
permissions: { contents: read }
concurrency:
  group: native-beta-dto-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  local-sdk-drain-controls:
    name: Local patched SDK terminal drain controls (not native semantic credit)
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: 1.99.1 }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - name: Verify exact stock source reconstruction and isolated override
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/native-dto-patched-sdk-controls-$GITHUB_SHA" >> "$GITHUB_ENV"
          node tests/tooling/support/native-beta-dto/sdk-split-drain/custody.mjs
      - name: Exercise cached head, cloned leases, idempotence and terminal refusal over real local IPC
        run: |
          test ! -e "$CARGO_TARGET_DIR"
          cargo test --locked --profile ci -p corsa_client --lib api::client::close_drain_tests:: -- --nocapture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-beta-local-sdk-controls-${{ github.sha }}
          path: target/vize-tests/native-beta-dto-composition/**
          if-no-files-found: error
  actual-source-wire:
    name: ${{ matrix.role == 'before' && matrix.sdk.version == '7.1.0-beta' && 'Baseline refusal observation' || matrix.role == 'after' && 'LOCAL patched SDK source control' || 'Stock SDK source control' }} (${{ matrix.role }}, ${{ matrix.sdk.version }})
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        role: [before, after]
        sdk:
          - version: 7.0.2
            sha256: 4f2de678286401759b3fb4475bafe35b8f32b4b3a07d92642bbf37eadc9b34a4
          - version: 7.1.0-beta
            sha256: a183b1956edbe7e7d98f2249858eedf2d8a9790809cc4909db1276e202faaa70
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: 13fa41356d075047a229f580014b637d3bbeb57f
      ROLE: ${{ matrix.role }}
      SDK_VERSION: ${{ matrix.sdk.version }}
      SDK_SHA256: ${{ matrix.sdk.sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: package.json, package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: 1.99.1, components: clippy }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - name: Install exact official SDK into an isolated consumer
        working-directory: ${{ runner.temp }}
        run: |
          sdk_root="$RUNNER_TEMP/native-dto-sdk-$SDK_VERSION"
          npm install --prefix "$sdk_root" --ignore-scripts --no-audit --no-fund "typescript@$SDK_VERSION"
          echo "SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          command -v strace
      - name: Pin before production bytes and identical observer separately
        run: node tests/tooling/support/native-beta-dto/prepare-role.mjs
      - name: Pin actual native image and retain all raw process streams
        run: node tests/tooling/support/native-beta-dto/provider.mjs
      - name: Exercise same source and SDK error, repair, hover, refs and foreign-file control
        shell: bash
        run: |
          set -euo pipefail
          cd "$VIZE_NATIVE_DTO_SOURCE_ROOT"
          test ! -e "$CARGO_TARGET_DIR"
          cargo test --locked --profile ci -p vize_canon --lib lsp_client::editor_lsp::snapshot_source::tests::native_beta::actual_sdk_semantic_error_repair_navigation_and_two_file_scope_are_complete --no-run --message-format=json >"$VIZE_NATIVE_DTO_CAPTURE/build.jsonl" 2>"$VIZE_NATIVE_DTO_CAPTURE/build.stderr"
          node "$GITHUB_WORKSPACE/tests/tooling/support/native-beta-dto/run-source.mjs"
      - name: Verify closed raw native frames and exact per-file request shapes
        if: ${{ !cancelled() }}
        run: node tests/tooling/support/native-beta-dto/audit-wire.mjs
      - name: Keep strict known DTO, unknown fields, source ownership and both envelope controls
        if: ${{ matrix.role == 'after' && matrix.sdk.version == '7.0.2' }}
        run: |
          cargo test --locked --profile ci -p vize_canon --lib lsp_client::initial_diagnostics::
          cargo test --locked --profile ci -p vize_canon --lib lsp_client::editor_lsp::snapshot_source::
          cargo clippy --locked --profile ci -p vize_canon -- -D warnings -D clippy::wildcard_imports
      - name: Preserve separate materialized close topology frontier with actual identities
        if: ${{ matrix.role == 'after' && matrix.sdk.version == '7.1.0-beta' }}
        env:
          VIZE_NATIVE_DTO_SELECTOR: lsp_client::editor_lsp::snapshot_source::tests::native_beta::actual_materialized_close_topology_retains_the_closed_dependency
        run: |
          owned_capture="$VIZE_NATIVE_DTO_CAPTURE"
          frontier_capture="$owned_capture/materialized-close-frontier"
          mkdir -p "$frontier_capture"
          cp "$owned_capture/build.jsonl" "$frontier_capture/build.jsonl"
          cp "$owned_capture/provider.json" "$frontier_capture/provider.json"
          export VIZE_NATIVE_DTO_CAPTURE="$frontier_capture"
          node "$GITHUB_WORKSPACE/tests/tooling/support/native-beta-dto/run-source.mjs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-beta-dto-${{ matrix.role }}-${{ matrix.sdk.version }}-${{ env.HEAD_SHA }}
          path: target/vize-tests/native-beta-dto/
          if-no-files-found: error
          retention-days: 7

  source-workspace:
    uses: ./.github/workflows/full-source-cli.yml
  workspace-front-door:
    needs: source-workspace
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        campaign: [runtime-selection, native-beta-dto-workspace-10731]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with: { node-version-file: package.json, cache: true, run-install: false }
      - run: vp install --frozen-lockfile --prefer-offline
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/restore-source-cli
        with: { producer: "${{ toJSON(needs.source-workspace.outputs) }}" }
      - name: Pin validation composition and observer law controls
        run: |
          git diff --exit-code b3ef5520644577a1a636e1d33026991bb29b0c9c -- crates/vize_canon/src/lsp_client/initial_diagnostics.rs
          node --test tests/tooling/native-runtime-selection-lsp-strace.test.mjs tests/tooling/native-beta-workspace-packets.test.mjs tests/tooling/native-beta-snapshot-drain.test.mjs
          node tests/tooling/support/native-beta-dto/composition.mjs
          node tests/tooling/support/native-beta-dto/sdk-split-drain/custody.mjs
      - name: Install exact independent official providers
        run: |
          command -v strace
          provider_root="$RUNNER_TEMP/native-beta-workspace-providers"
          test ! -e "$provider_root"
          npm install --prefix "$provider_root/beta" --ignore-scripts --no-audit --no-fund --save-exact --registry=https://registry.npmjs.org typescript@7.1.0-beta vue@3.5.44
          npm install --prefix "$provider_root/six" --ignore-scripts --no-audit --no-fund --save-exact --registry=https://registry.npmjs.org typescript@6.0.3
          npm install --prefix "$provider_root/frozen702" --ignore-scripts --no-audit --no-fund --save-exact --registry=https://registry.npmjs.org typescript@7.0.2 vue@3.5.44
      - name: Preserve default eight profiles or observe separate beta workspace role
        env:
          VIZE_REQUIRE_NATIVE_RUNTIME_SELECTION: "1"
          VIZE_SOURCE_CLI: ${{ github.workspace }}/target/ci/vize
          VIZE_NATIVE_BETA_ROOT: ${{ runner.temp }}/native-beta-workspace-providers/beta
          VIZE_TYPESCRIPT_SIX_ROOT: ${{ runner.temp }}/native-beta-workspace-providers/six
          VIZE_NATIVE_702_ROOT: ${{ runner.temp }}/native-beta-workspace-providers/frozen702
          CAMPAIGN: ${{ matrix.campaign }}
        run: |
          export VIZE_NATIVE_STRACE="$(command -v strace)"
          if [ "$CAMPAIGN" = runtime-selection ]; then
            node tests/tooling/support/native-runtime-selection/lsp.mjs
          else
            node tests/tooling/support/native-runtime-selection/lsp-native-beta-workspace.mjs
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-beta-workspace-${{ matrix.campaign }}-${{ github.sha }}
          path: |
            target/vize-tests/native-beta-dto-composition/**
            target/vize-tests/native-runtime-selection-lsp/**
            target/vize-tests/native-beta-dto-workspace-10731/**
            target/ci/vize.differential-build.json
            ${{ runner.temp }}/native-beta-workspace-providers/**/package-lock.json
          if-no-files-found: error
          retention-days: 7
