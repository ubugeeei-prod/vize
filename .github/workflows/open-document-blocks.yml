name: Open document block queries
on:
  pull_request:
    paths:
      - ".github/workflows/open-document-blocks.yml"
      - ".github/scripts/workflows/open-document-blocks/**"
      - "crates/vize_incremental/**"
      - "crates/vize_maestro/Cargo.toml"
      - "crates/vize_maestro/src/document/store*"
      - "crates/vize_maestro/src/document/store/**"
      - "crates/vize_maestro/src/server/state.rs"
      - "crates/vize_maestro/src/server/state/resident*"
      - "crates/vize_maestro/src/source_project.rs"
      - "crates/vize_maestro/src/source_project/blocks*"
      - "crates/vize_maestro/src/source_project/blocks/**"
      - "crates/vize_maestro/src/source_project/snapshot.rs"
      - "crates/vize_croquis/src/sfc/**"
      - "davinci/vize_l1_to_l2/src/style*"
permissions: { contents: read }
concurrency:
  group: open-document-blocks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  named-blocks:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "24"
      CARGO_INCREMENTAL: "0"
      RUSTUP_TOOLCHAIN: "1.100.0"
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/open-document-blocks/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.100.0", components: clippy }
      - name: Compare the original stages on each selected editor block and revision
        shell: bash
        run: . "${{ env.VIZE_CI_FILES }}/compare-the-original-stages-on-each-selected-editor-block-and-revision.sh"
