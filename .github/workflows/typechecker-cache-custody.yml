name: Typechecker source custody admission
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Immutable actual-main parent for source and full packet comparison
        required: true
        type: string
        default: cff28e89578af6af258b7f37693bae58fdae3b07
permissions: { contents: read, actions: read }
concurrency:
  group: source-custody-admission-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tiny:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      GOMAXPROCS: "8"
      RAYON_NUM_THREADS: "8"
      CUSTODY_BASELINE: ${{ inputs.baseline }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { path: carrier, persist-credentials: false }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { path: source, fetch-depth: 2, persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: "26.6.0", package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.99.1" }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - name: Validate exact authority and establish an owned tiny carrier
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == ubugeeei-prod/vize ]]
          [[ "$GITHUB_REF" == refs/heads/test/canon-cache-custody-admission ]]
          [[ "$CUSTODY_BASELINE" =~ ^[a-f0-9]{40}$ ]]
          git -C source merge-base --is-ancestor "$CUSTODY_BASELINE" HEAD
          evidence_root="$RUNNER_TEMP/source-custody-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$evidence_root"
          mkdir -m 700 "$evidence_root"
          printf 'CUSTODY_ROOT=%s\n' "$evidence_root" >> "$GITHUB_ENV"
          mkdir "$evidence_root/provider"
          cat > "$evidence_root/provider/package.json" <<'JSON'
          {"private":true,"type":"module","dependencies":{"vue":"3.5.44","typescript":"6.0.3","typescript-native":"npm:typescript@7.1.0-beta","@types/node":"25.9.2"}}
          JSON
          npm install --prefix "$evidence_root/provider" --ignore-scripts --no-audit --no-fund
      - name: Strictly typecheck the admission harness
        shell: bash
        run: |
          set -euo pipefail
          node "$CUSTODY_ROOT/provider/node_modules/typescript/bin/tsc" --noEmit --strict --noUnusedLocals --noUnusedParameters --noUncheckedIndexedAccess --skipLibCheck --target esnext --module nodenext --moduleResolution nodenext --allowImportingTsExtensions --typeRoots "$CUSTODY_ROOT/provider/node_modules/@types" carrier/tools/benchmarks/scripts/typechecker-cache-admission-build.ts carrier/tools/benchmarks/scripts/typechecker-cache-admission-run.ts 2>&1 | tee "$CUSTODY_ROOT/typecheck.log"
      - name: Build independent fresh normal and opt-in CLIs and source unit controls
        shell: bash
        run: |
          set -euo pipefail
          node carrier/tools/benchmarks/scripts/typechecker-cache-admission-build.ts --source "$GITHUB_WORKSPACE/source" --base "$CUSTODY_BASELINE" --out "$CUSTODY_ROOT/build"
      - name: Admit one SFC with all CLI and emitted TypeScript packets preserved
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y strace
          node carrier/tools/benchmarks/scripts/typechecker-cache-admission-run.ts --provider "$CUSTODY_ROOT/provider" --builds "$CUSTODY_ROOT/build/builds.json" --out "$CUSTODY_ROOT/functional"
      - name: Archive complete bounded metadata without build images
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/source-custody-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$evidence_root/build" "$evidence_root/functional" "$evidence_root/provider"
          tar --exclude='./build/target-*' --exclude='./functional/project' --exclude='./functional/runtime-base' --exclude='./provider/node_modules' -czf "$RUNNER_TEMP/source-custody-metadata.tgz" -C "$evidence_root" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: source-custody-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-custody-metadata.tgz
          retention-days: 90
