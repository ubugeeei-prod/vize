name: Debug Vue slot framework oracle
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
      role:
        required: true
        type: choice
        options: [slot-framework-triage]
permissions: { contents: read, actions: read }
jobs:
  framework:
    if: github.ref == 'refs/heads/debug/canon-slot-framework-11013' && inputs.role == 'slot-framework-triage'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_BASE: ${{ inputs.source_sha }}
      GOMAXPROCS: "2"
      RAYON_NUM_THREADS: "2"
      NODE_DISABLE_COMPILE_CACHE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { fetch-depth: 4, persist-credentials: false }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 190257dbe52a7d4942be4496403a55b32c24426f
          path: .slot-driver
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /tools/benchmarks/scripts/canon-slot-constructor-cases.ts
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: "24.14.0", package-manager-cache: false }
      - name: Install one public framework provider without a Rust build
        run: |
          set -euo pipefail
          [[ "$SOURCE_BASE" == b6127a994f7e2a75eb2c89de44d54cf8a0f17fcd ]]
          [[ "$(git rev-parse HEAD^1)" == aa8c410a22dc2d6ada5309f9f541acea91d78c3e ]]
          [[ "$(git rev-parse HEAD~3)" == "$SOURCE_BASE" ]]
          mkdir "$RUNNER_TEMP/slot-framework-provider"
          cd "$RUNNER_TEMP/slot-framework-provider"
          node --input-type=module -e 'import fs from "node:fs";fs.writeFileSync("package.json",JSON.stringify({private:true,type:"module",dependencies:{vize:"0.602.0","@vizejs/native":"0.602.0",vue:"3.5.42",typescript:"6.0.3","typescript-native":"npm:typescript@7.1.0-beta","vue-tsc":"3.3.13"},overrides:{"@vue/compiler-dom":"3.5.42","@vue/compiler-core":"3.5.42","@vue/compiler-sfc":"3.5.42","@vue/shared":"3.5.42"}}));'
          npm install --ignore-scripts --no-audit --no-fund
      - name: Authenticate the immutable existing normal source image without Cargo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/slot-candidate-image"
          gh api repos/ubugeeei-prod/vize/actions/artifacts/12775046472 > "$RUNNER_TEMP/slot-candidate-image/artifact.json"
          gh api repos/ubugeeei-prod/vize/actions/artifacts/12775046472/zip > "$RUNNER_TEMP/slot-candidate-image/image.zip"
          python3 - <<'PY'
          import pathlib, os, zipfile, tarfile, io, json, hashlib, stat
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'slot-candidate-image'
          archive=(root/'image.zip').read_bytes()
          assert hashlib.sha256(archive).hexdigest()=='cab20e8554547b876e7685f087f6ad0af85d205676665f54b65285f9162591e2'
          metadata=json.loads((root/'artifact.json').read_text())
          assert metadata['id']==12775046472 and metadata['workflow_run']['id']==40591184244 and metadata['expired'] is False
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
            assert z.namelist()==['source-cli.tar.gz']
            with tarfile.open(fileobj=io.BytesIO(z.read('source-cli.tar.gz')),mode='r:gz') as t:
              expected={'target/ci/vize','target/ci/vize.differential-build.json','target/ci/examples/cli_build_result_oracle','source-cli.json'}
              members=t.getmembers()
              assert {m.name for m in members}==expected and len(members)==4 and all(m.isfile() for m in members)
              envelope=json.loads(t.extractfile('source-cli.json').read())
              identity=envelope['identity']
              assert identity['sourceRevision']=='13dad9ef012ea69588d19f557748ad97690f3add' and identity['sourceTree']=='c56feab62abdbc8de95c25674af4d3ec53401cce'
              assert str(identity['runId'])=='40591184244' and str(identity['runAttempt'])=='1'
              assert {m['path'] for m in envelope['members']}==expected-{'source-cli.json'}
              for member in envelope['members']:
                actual=t.getmember(member['path']); content=t.extractfile(actual).read()
                assert len(content)==member['bytes'] and hashlib.sha256(content).hexdigest()==member['sha256'] and stat.S_IMODE(actual.mode)==member['mode']
                if member['path']=='target/ci/vize':
                  (root/'vize').write_bytes(content);(root/'vize').chmod(0o755)
                elif member['path'].endswith('.json'):
                  (root/'differential-build.json').write_bytes(content)
              (root/'source-cli.json').write_text(json.dumps(envelope,indent=2)+'\n')
          sidecar=json.loads((root/'differential-build.json').read_text())
          binary=(root/'vize').read_bytes()
          assert sidecar['sourceRevision']==identity['sourceRevision'] and sidecar['binarySha256']==hashlib.sha256(binary).hexdigest()
          PY
      - name: Compare the official framework oracle with public CLI and mapper
        run: |
          set -euo pipefail
          node tools/benchmarks/scripts/canon-slot-framework-oracle.ts "$RUNNER_TEMP/slot-framework-provider" "$GITHUB_WORKSPACE/.slot-driver" "$RUNNER_TEMP/slot-framework" "$RUNNER_TEMP/slot-candidate-image/vize"
      - name: Preserve the exact provider lock and raw evidence
        if: always()
        run: |
          set -euo pipefail
          if [[ -d "$RUNNER_TEMP/slot-framework" ]]; then
            cp "$RUNNER_TEMP/slot-framework-provider/package.json" "$RUNNER_TEMP/slot-framework-provider/package-lock.json" "$RUNNER_TEMP/slot-framework/"
            if [[ -f "$RUNNER_TEMP/slot-candidate-image/source-cli.json" ]]; then
              cp "$RUNNER_TEMP/slot-candidate-image/"*.json "$RUNNER_TEMP/slot-framework/"
            fi
            cd "$RUNNER_TEMP"
            tar --exclude=project --exclude=node_modules -czf slot-framework-raw.tgz slot-framework
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: slot-framework-summary-${{ github.sha }}
          path: |
            ${{ runner.temp }}/slot-framework/summary.json
            ${{ runner.temp }}/slot-framework/missing-invalid-probes.json
            ${{ runner.temp }}/slot-framework/source-candidate-summary.json
            ${{ runner.temp }}/slot-framework/boundary-summary.json
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: slot-framework-raw-${{ github.sha }}
          path: ${{ runner.temp }}/slot-framework-raw.tgz
          retention-days: 14
