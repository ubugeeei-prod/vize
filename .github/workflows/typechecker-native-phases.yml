name: Type checker native backend phases
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Immutable main ancestor; production/dependency/corpus bytes must equal this main driver"
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/typechecker-native-phases.yml"
      - ".github/actions/check-batch-generated-config/**"
      - "tools/benchmarks/scripts/typechecker-native-*.mjs"
      - "tools/benchmarks/scripts/type-snapshot-cli-corpus.mjs"
      - "tools/benchmarks/scripts/type-snapshot-cli-leaf-corpus.mjs"
      - "tools/benchmarks/scripts/type-snapshot-cli-protocol.mjs"
      - "crates/vize/tests/check_template_emit_cli.rs"
      - "crates/vize/tests/check_canon_define_model_modifiers_cli.rs"
      - "tests/fixtures/typechecker/model-modifier-ranges/**"
      - "crates/vize/tests/check_vue_helper_scope_cli.rs"
      - "crates/vize/tests/lint_unchecked_indexed_access_cli**"
      - "crates/vize_patina/src/linter/corsa_session/paths/**"
      - "tests/_fixtures/differential/linter/unchecked-index-access/**"
      - "crates/vize_maestro/src/ide/diagnostics/editor_typecheck_emit_tests.rs"
      - "tests/_fixtures/differential/typechecker/template-dollar-emit/**"
      - "docs/davinci/decisions/2026-10-04-typechecker-native-phases.md"
      - "docs/davinci/decisions/2026-10-04-typechecker-cold-native-profiles.md"
      - "tools/benchmarks/scripts/generate.mjs"
      - "tools/benchmarks/scripts/check-gate-*.mjs"
      - "tools/benchmarks/scripts/typecheck-command.mjs"
      - "tools/benchmarks/scripts/benchmark-binary.mjs"
      - "crates/vize/tests/check_outside_import_types_cli.rs"
      - "tests/_fixtures/differential/typechecker/**"
      - "crates/vize_canon/**"
      - ".github/actions/check-*/**"
      - "tests/tooling/**"
      - "tests/_fixtures/differential/lsp/**"
      - ".github/actions/check-computed-inlay/**"
      - "crates/vize/tests/lsp_*_cli.rs"
      - "crates/vize_maestro/src/ide/hover/component_prop**"
      - "crates/vize_maestro/src/ide/completion**"
      - "crates/vize_maestro/src/ide/inlay_hint/**"
      - "crates/vize_maestro/src/ide/inlay_hint.rs"
      - "crates/vize_croquis/src/**"
      - "crates/vize/tests/support/**"
      - "crates/vize/src/**"
      - "crates/vize/tests/check_undefined_default_props_cli.rs"
      - "crates/vize_maestro/src/ide/diagnostics/editor_typecheck_defaults_tests.rs"
      - "tests/_fixtures/differential/typechecker/undefined-default-prop/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pnpm-lock.yaml"
permissions:
  contents: read
concurrency:
  group: typechecker-native-phases-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.event.pull_request.head.sha }}
  DRIVER_SHA: ${{ github.event_name == 'workflow_dispatch' && github.workflow_sha || github.event.pull_request.head.sha }}
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
jobs:
  native-phases:
    name: Actual CLI shard native phase evidence
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.DRIVER_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin immutable driver, source and freshly fetched main baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$DRIVER_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$DRIVER_SHA" ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_head_sha="$(git rev-parse refs/remotes/origin/main)"
          [[ "$(git rev-parse --verify "$SOURCE_SHA^{commit}")" == "$SOURCE_SHA" ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REPOSITORY" == ubugeeei-prod/vize && "$GITHUB_REF" == refs/heads/main ]]
            [[ "$DRIVER_SHA" == "$GITHUB_WORKFLOW_SHA" ]]
            git merge-base --is-ancestor "$DRIVER_SHA" "$main_head_sha"
            git merge-base --is-ancestor "$SOURCE_SHA" "$main_head_sha"
            source_base_sha="$SOURCE_SHA"
          else
            [[ "$GITHUB_EVENT_NAME" == pull_request && "$DRIVER_SHA" == "$SOURCE_SHA" ]]
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            source_base_sha="$(git merge-base "$main_head_sha" "$SOURCE_SHA")"
            echo "PR_BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          fi
          echo "MAIN_SOURCE_SHA=$source_base_sha" >> "$GITHUB_ENV"
          echo "MAIN_HEAD_SHA=$main_head_sha" >> "$GITHUB_ENV"
          echo "NATIVE_PHASE_SOURCE_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "NATIVE_PHASE_OUTPUT=$RUNNER_TEMP/typechecker-native-phases.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: .native-phase-source
          fetch-depth: 0
          persist-credentials: false
      - name: Isolate the manual production checkout from driver outputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          [[ ! -e "$RUNNER_TEMP/native-phase-source" ]]
          mv "$GITHUB_WORKSPACE/.native-phase-source" "$RUNNER_TEMP/native-phase-source"
          echo "NATIVE_PHASE_SOURCE_ROOT=$RUNNER_TEMP/native-phase-source" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: typechecker-native-phases
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
          target-path: target
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with:
          node-version-file: package.json
          run-install: false
      - name: Reject source, lock, corpus, workflow and baseline drift before installation
        run: node tools/benchmarks/scripts/typechecker-native-source-custody.mjs "$RUNNER_TEMP/typechecker-native-source-custody.json"
      - name: Install pinned native runtime and shared Vue dependencies
        run: |
          set -euo pipefail
          vp install --frozen-lockfile --prefer-offline
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ ! -e "$NATIVE_PHASE_SOURCE_ROOT/node_modules" ]]
            ln -s "$GITHUB_WORKSPACE/node_modules" "$NATIVE_PHASE_SOURCE_ROOT/node_modules"
          fi
      - name: Qualify declared template emits and config-scoped Vue helpers in the source CLI and editor
        if: github.event_name == 'pull_request'
        env:
          VIZE_TEST_REQUIRE_TSGO: "1"
          VIZE_TEMPLATE_EMIT_CAPTURE: ${{ runner.temp }}/template-dollar-emit
          VIZE_VUE_HELPER_CAPTURE: ${{ runner.temp }}/config-scoped-vue-helpers
          VIZE_TSCONFIG_TYPES_CAPTURE: ${{ runner.temp }}/tsconfig-types-extends
        run: |
          set -euo pipefail
          unset VIZE_TEST_DISABLE_TSGO
          cd "$NATIVE_PHASE_SOURCE_ROOT"
          VIZE_UNCHECKED_INDEX_CAPTURE="$RUNNER_TEMP/unchecked-index-access" cargo test --locked --profile ci-opt -p vize --test check_template_emit_cli --test check_vue_helper_scope_cli --test lint_unchecked_indexed_access_cli --test check_canon_define_model_modifiers_cli --test lsp_generic_prop_hover_cli --test lsp_data_aria_attributes_cli --test tsconfig_diamond --test check_tsconfig_types_extends_cli --config 'profile.ci-opt.inherits="release"' --config 'profile.ci-opt.lto="thin"' --config 'profile.ci-opt.codegen-units=16' --config 'profile.ci-opt.package.vize.strip="symbols"' -- --nocapture
          export VIZE_TEST_TSGO_PATH="$(node --input-type=module -e 'import {readFileSync,readdirSync} from "node:fs";import {join} from "node:path";const root=process.env.VIZE_TEMPLATE_EMIT_CAPTURE;const name=readdirSync(root,{withFileTypes:true}).find(e=>e.isDirectory()).name;process.stdout.write(JSON.parse(readFileSync(join(root,name,"oracle.json"),"utf8")).nativeBinary)')"
          cargo test --locked --profile ci-opt -p vize_maestro --lib editor_typecheck_emit_tests --config 'profile.ci-opt.inherits="release"' --config 'profile.ci-opt.lto="thin"' --config 'profile.ci-opt.codegen-units=16' -- --nocapture
          cargo test --locked --profile ci-opt -p vize_maestro --lib editor_typecheck_vue_helper_tests --config 'profile.ci-opt.inherits="release"' --config 'profile.ci-opt.lto="thin"' --config 'profile.ci-opt.codegen-units=16' -- --nocapture
          export VIZE_TEMPLATE_EMIT_TS40_CAPTURE="$RUNNER_TEMP/template-emit-ts40-projection"
          cargo test --locked --profile ci-opt -p vize_maestro --test davinci_ts40_projection current_projection_matrix_is_exact_and_non_empty --config 'profile.ci-opt.inherits="release"' --config 'profile.ci-opt.lto="thin"' --config 'profile.ci-opt.codegen-units=16' -- --nocapture
          node tools/benchmarks/scripts/typechecker-template-emit-projection-receipt.mjs
          node tools/benchmarks/scripts/typechecker-native-template-emit-receipt.mjs
          node tools/benchmarks/scripts/typechecker-native-vue-helper-receipt.mjs
          bash tools/benchmarks/scripts/typechecker-native-unknown-options.sh && cargo test --locked --profile ci-opt -p vize_patina --test documented_rule_examples documented_type_aware_examples_match_with_the_required_corsa_runtime --config 'profile.ci-opt.inherits="release"' --config 'profile.ci-opt.lto="thin"' --config 'profile.ci-opt.codegen-units=16' -- --nocapture
      - name: Check exact neutral inputs, strict phase parser and projection probe
        run: |
          node tools/benchmarks/scripts/typechecker-native-phases.mjs --self-test
          node --test tools/benchmarks/scripts/typechecker-native-*.test.mjs
          node tools/benchmarks/scripts/typechecker-native-source-custody.mjs "$RUNNER_TEMP/typechecker-native-source-custody.json"
          cd "$NATIVE_PHASE_SOURCE_ROOT"
          cargo clippy --locked -p vize_canon --example native_phase_projection -- -D warnings
      - name: Qualify original outside-import types with the source CLI and official native oracle
        if: github.event_name == 'pull_request'
        env:
          VIZE_TEST_REQUIRE_TSGO: "1"
          VIZE_TYPECHECK_REGRESSION_CAPTURE: ${{ runner.temp }}/outside-import-types
        run: |
          set -euo pipefail
          unset VIZE_TEST_DISABLE_TSGO
          cd "$NATIVE_PHASE_SOURCE_ROOT"
          cargo test --locked --profile ci-opt -p vize --test check_outside_import_types_cli --config 'profile.ci-opt.inherits="release"' --config 'profile.ci-opt.lto="thin"' --config 'profile.ci-opt.codegen-units=16' --config 'profile.ci-opt.package.vize.strip="symbols"' -- --nocapture
          export VIZE_TEST_TSGO_PATH="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; process.stdout.write(JSON.parse(readFileSync(process.env.VIZE_TYPECHECK_REGRESSION_CAPTURE + "/outside_import_preserves_original_type_libraries_and_real_cli_diagnostics/oracle.json", "utf8")).nativeBinary)')"
          export CORSA_PATH="$VIZE_TEST_TSGO_PATH"
          cargo test --locked --profile ci-opt -p vize_canon --test original_program_check process_reuse:: --config 'profile.ci-opt.inherits="release"' --config 'profile.ci-opt.lto="thin"' --config 'profile.ci-opt.codegen-units=16' -- --nocapture || exit $?; cargo test --locked --profile ci-opt -p vize_canon --lib lsp_client::editor_lsp::original_program::process_tests:: --config 'profile.ci-opt.inherits="release"' --config 'profile.ci-opt.lto="thin"' --config 'profile.ci-opt.codegen-units=16' -- --nocapture || exit $?; cargo test --locked --profile ci-opt -p vize_canon original_outside_import_preserves_types_in_native_editor --config 'profile.ci-opt.inherits="release"' --config 'profile.ci-opt.lto="thin"' --config 'profile.ci-opt.codegen-units=16' -- --nocapture
          cargo test --locked --profile ci-opt -p vize_canon native_editor_resolves_package_alias_from_monorepo_root --config 'profile.ci-opt.inherits="release"' --config 'profile.ci-opt.lto="thin"' --config 'profile.ci-opt.codegen-units=16' -- --nocapture
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { existsSync, readFileSync, readdirSync, realpathSync, writeFileSync } from 'node:fs';
          import { dirname, join } from 'node:path';
          import { spawnSync } from 'node:child_process';
          const root = process.env.VIZE_TYPECHECK_REGRESSION_CAPTURE;
          const cases = readdirSync(root, { withFileTypes: true }).filter(e => e.isDirectory() && !['editor-original-script', 'editor-monorepo-alias'].includes(e.name)).map(e => e.name).sort();
          assert.deepEqual(cases, ['outside_import_keeps_direct_scoped_type_packages_at_the_config_anchor', 'outside_import_preserves_original_type_libraries_and_real_cli_diagnostics', 'type_config_anchor_does_not_expose_app_modules_to_sibling_sources']);
          const sha256 = file => createHash('sha256').update(readFileSync(file)).digest('hex');
          const files = dir => readdirSync(dir, { withFileTypes: true }).flatMap(e => e.isDirectory() ? files(join(dir, e.name)) : [join(dir, e.name)]);
          const receipts = cases.map(name => {
            const dir = join(root, name);
            const oracle = JSON.parse(readFileSync(join(dir, 'oracle.json'), 'utf8'));
            const cli = JSON.parse(readFileSync(join(dir, 'cli.json'), 'utf8'));
            const nativeBinary = realpathSync(oracle.nativeBinary);
            let packageDir = dirname(nativeBinary);
            while (!existsSync(join(packageDir, 'package.json')) && dirname(packageDir) !== packageDir) packageDir = dirname(packageDir);
            const packagePath = join(packageDir, 'package.json');
            const nativePackage = JSON.parse(readFileSync(packagePath, 'utf8'));
            assert.equal(nativePackage.name, `@typescript/typescript-${process.platform}-${process.arch}`);
            assert.equal(nativePackage.version, '7.0.2');
            const version = spawnSync(nativeBinary, ['--version'], { encoding: 'utf8' });
            assert.equal(version.status, 0);
            assert.equal(version.stdout.trim(), 'Version 7.0.2');
            assert.equal(version.stderr, '');
            return { name, sourceSha: process.env.SOURCE_SHA, cliBinary: realpathSync(cli.cliBinary), cliSha256: sha256(cli.cliBinary), nativeBinary, nativeSha256: sha256(nativeBinary), nativePackageSha256: sha256(packagePath), nativePackage: { name: nativePackage.name, version: nativePackage.version }, nativeVersion: version.stdout.trim(), completeOutputsAndInputs: files(dir).map(path => ({ path: path.slice(root.length + 1), sha256: sha256(path) })) };
          });
          const editor = JSON.parse(readFileSync(join(root, 'editor-original-script/runtime.json'), 'utf8'));
          assert.equal(realpathSync(editor.nativeBinary), receipts[0].nativeBinary);
          const aliasRuntime = JSON.parse(readFileSync(join(root, 'editor-monorepo-alias/runtime.json'), 'utf8'));
          assert.equal(realpathSync(aliasRuntime.nativeBinary), receipts[0].nativeBinary);
          const editorFiles = ['editor-original-script', 'editor-monorepo-alias'].flatMap(name => files(join(root, name))).map(path => ({ path: path.slice(root.length + 1), sha256: sha256(path) }));
          writeFileSync(join(root, 'receipts.json'), JSON.stringify({ sourceSha: process.env.SOURCE_SHA, fixtureSha256: sha256('tests/_fixtures/differential/typechecker/outside-import-types/input.json'), matchedCompleteExpectations: true, cases: receipts, editor: { nativeBinary: realpathSync(editor.nativeBinary), nativeSha256: sha256(editor.nativeBinary), completeOutputsAndInputs: editorFiles } }, null, 2) + '\n');
          JS
      - name: Verify the original L1 corpus and referenced JavaScript contracts
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 8020
        run: |
          set -euo pipefail
          cd "$NATIVE_PHASE_SOURCE_ROOT"
          unset VIZE_TEST_DISABLE_TSGO
          cargo test --locked --profile ci -p vize_l1_to_l2 --features legacy-differential --test davinci_lowering_corpus -- --nocapture
          cargo test --locked --profile ci -p vize_l1_to_l2 --features legacy-differential --test davinci_dom_corpus -- --nocapture
          cargo test --locked --profile ci -p vize_l1_to_l2 --features legacy-differential --test davinci_remarks_corpus -- --nocapture
          VIZE_TEST_REQUIRE_TSGO=1 cargo test --locked --profile ci -p vize --test check_allowjs_imports_cli referenced_projects_apply_allowjs_to_explicit_and_default_checks -- --nocapture
      - name: Build the actual production CLI and standalone projection example
        run: |
          set -euo pipefail
          node tools/benchmarks/scripts/typechecker-native-source-custody.mjs "$RUNNER_TEMP/typechecker-native-source-custody.json"
          cd "$NATIVE_PHASE_SOURCE_ROOT"
          cargo build --locked --profile ci-opt -p vize \
            --config 'profile.ci-opt.inherits="release"' \
            --config 'profile.ci-opt.lto="thin"' \
            --config 'profile.ci-opt.codegen-units=16' \
            --config 'profile.ci-opt.package.vize.strip="symbols"'
          cargo build --locked --profile ci-opt -p vize_canon --example native_phase_projection \
            --config 'profile.ci-opt.inherits="release"' \
            --config 'profile.ci-opt.lto="thin"' \
            --config 'profile.ci-opt.codegen-units=16'
      - name: Verify the original reference-path project through native, batch and actual CLI checks
        if: github.event_name == 'pull_request'
        env:
          VIZE_TEST_REQUIRE_TSGO: "1"
          VIZE_REFERENCE_PATH_CAPTURE_DIR: ${{ runner.temp }}/reference-path-module
        run: bash .github/actions/check-reference-path/run.sh
      - name: Capture every actual shard with byte, map, diagnostic and freshness gates
        env: { RUNNER_LABEL: blacksmith-32vcpu-ubuntu-2404 }
        run: |
          node tools/benchmarks/scripts/typechecker-native-phases.mjs \
            "$GITHUB_WORKSPACE/target/ci-opt/vize" \
            "$GITHUB_WORKSPACE/target/ci-opt/examples/native_phase_projection" \
            "$NATIVE_PHASE_OUTPUT"
      - name: Qualify optional callable defaults in the source CLI and editor
        if: github.event_name == 'pull_request'
        env:
          VIZE_TEST_REQUIRE_TSGO: "1"
          VIZE_DEFAULT_PROP_CAPTURE: ${{ runner.temp }}/undefined-default-props
        run: |
          set -euo pipefail
          unset VIZE_TEST_DISABLE_TSGO
          cd "$NATIVE_PHASE_SOURCE_ROOT"
          cargo test --locked --profile ci-opt -p vize --test check_undefined_default_props_cli \
            --config 'profile.ci-opt.inherits="release"' \
            --config 'profile.ci-opt.lto="thin"' \
            --config 'profile.ci-opt.codegen-units=16' \
            --config 'profile.ci-opt.package.vize.strip="symbols"' -- --nocapture
          export VIZE_TEST_TSGO_PATH="$(node --input-type=module -e 'import {readFileSync,readdirSync} from "node:fs";import {join} from "node:path";const root=process.env.VIZE_DEFAULT_PROP_CAPTURE;const name=readdirSync(root,{withFileTypes:true}).find(e=>e.isDirectory()).name;process.stdout.write(JSON.parse(readFileSync(join(root,name,"oracle.json"),"utf8")).nativeBinary)')"
          export CORSA_PATH="$VIZE_TEST_TSGO_PATH"
          node --input-type=module -e 'import {writeFileSync} from "node:fs";import {join} from "node:path";writeFileSync(join(process.env.VIZE_DEFAULT_PROP_CAPTURE,"imported-runtime-props.runtime.json"),JSON.stringify({sourceSha:process.env.SOURCE_SHA,nativeBinary:process.env.CORSA_PATH})+"\n")'
          cp crates/vize_canon/src/batch/type_checker/tests/recent_issues/imported_runtime_props.rs "$VIZE_DEFAULT_PROP_CAPTURE/imported-runtime-props.fixture.rs"
          set +e
          cargo test --locked --profile ci-opt -p vize_canon --lib \
            batch::type_checker::tests::recent_issues::imported_runtime_props \
            --config 'profile.ci-opt.inherits="release"' \
            --config 'profile.ci-opt.lto="thin"' \
            --config 'profile.ci-opt.codegen-units=16' -- --nocapture \
            > "$VIZE_DEFAULT_PROP_CAPTURE/imported-runtime-props.stdout.txt" \
            2> "$VIZE_DEFAULT_PROP_CAPTURE/imported-runtime-props.stderr.txt"
          runtime_status=$?
          set -e
          printf '%s\n' "$runtime_status" > "$VIZE_DEFAULT_PROP_CAPTURE/imported-runtime-props.status.txt"
          cat "$VIZE_DEFAULT_PROP_CAPTURE/imported-runtime-props.stdout.txt" "$VIZE_DEFAULT_PROP_CAPTURE/imported-runtime-props.stderr.txt"
          test "$runtime_status" -eq 0
          cargo test --locked --profile ci-opt -p vize_maestro --lib editor_typecheck_defaults_tests \
            --config 'profile.ci-opt.inherits="release"' \
            --config 'profile.ci-opt.lto="thin"' \
            --config 'profile.ci-opt.codegen-units=16' -- --nocapture
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { existsSync, readFileSync, readdirSync, realpathSync, writeFileSync } from 'node:fs';
          import { dirname, join } from 'node:path';
          import { spawnSync } from 'node:child_process';
          const root = process.env.VIZE_DEFAULT_PROP_CAPTURE;
          const cases = readdirSync(root, { withFileTypes: true }).filter(e => e.isDirectory() && !['editor-inputs', 'imported-runtime-controls'].includes(e.name)).map(e => e.name).sort();
          assert.deepEqual(cases, ['imported_callable_default_remains_defined_in_all_template_prop_views', 'undefined_callable_default_keeps_original_cli_conditions_optional', 'undefined_callable_default_still_rejects_unguarded_template_calls']);
          assert.deepEqual(JSON.parse(readFileSync(join(root, 'editor-diagnostics.json'), 'utf8')), []);
          assert(existsSync(join(root, 'editor-hover.json')));
          const editorRuntime = JSON.parse(readFileSync(join(root, 'editor-runtime.json'), 'utf8'));
          const hash = file => createHash('sha256').update(readFileSync(file)).digest('hex');
          assert.equal(hash(join(root, 'imported-runtime-props.fixture.rs')), '73fc6c23f5a91296bb9bce4ef133b5781f27d7b8c0d4f1a5f8d3b10de018aaa8');
          assert.equal(readFileSync(join(root, 'imported-runtime-props.status.txt'), 'utf8'), '0\n');
          const importedRuntime = JSON.parse(readFileSync(join(root, 'imported-runtime-props.runtime.json'), 'utf8'));
          assert.equal(importedRuntime.sourceSha, process.env.SOURCE_SHA);
          assert.equal(realpathSync(importedRuntime.nativeBinary), realpathSync(editorRuntime.nativeBinary));
          const runtimeOutput = readFileSync(join(root, 'imported-runtime-props.stdout.txt'), 'utf8');
          for (const name of ['imported_runtime_define_props_reach_script_and_template', 'type_based_with_defaults_omit_imported_defaults', 'imported_runtime_props_cache_rebinds_local_define_props_name']) assert(runtimeOutput.includes(`test batch::type_checker::tests::recent_issues::imported_runtime_props::${name} ... ok`));
          assert(runtimeOutput.includes('test result: ok. 3 passed; 0 failed;'));
          for (const name of ['imported-runtime-define-props', 'type-with-defaults-imported-omit', 'imported-runtime-props-cache-rebind']) assert.deepEqual(JSON.parse(readFileSync(join(root, 'imported-runtime-controls', name, 'diagnostics.json'), 'utf8')), []);
          const files = dir => readdirSync(dir, { withFileTypes: true }).flatMap(e => e.isDirectory() ? files(join(dir, e.name)) : [join(dir, e.name)]);
          const receipts = cases.map(name => {
            const raw = JSON.parse(readFileSync(join(root, name, 'oracle.json'), 'utf8'));
            const nativeBinary = realpathSync(raw.nativeBinary);
            assert.equal(realpathSync(editorRuntime.nativeBinary), nativeBinary);
            let packageDir = dirname(nativeBinary);
            while (!existsSync(join(packageDir, 'package.json')) && dirname(packageDir) !== packageDir) packageDir = dirname(packageDir);
            const packagePath = join(packageDir, 'package.json');
            const pkg = JSON.parse(readFileSync(packagePath, 'utf8'));
            assert.equal(pkg.name, `@typescript/typescript-${process.platform}-${process.arch}`);
            assert.equal(pkg.version, '7.0.2');
            const version = spawnSync(nativeBinary, ['--version'], { encoding: 'utf8' });
            assert.equal(version.status, 0); assert.equal(version.stdout.trim(), 'Version 7.0.2'); assert.equal(version.stderr, '');
            return { name, sourceSha: process.env.SOURCE_SHA, cliBinary: realpathSync(raw.cliBinary), cliSha256: hash(raw.cliBinary), nativeBinary, nativeSha256: hash(nativeBinary), nativePackageSha256: hash(packagePath), nativeVersion: version.stdout.trim() };
          });
          writeFileSync(join(root, 'receipts.json'), JSON.stringify({ sourceSha: process.env.SOURCE_SHA, matchedCompleteExpectations: true, cases: receipts, fullInputsAndOutputs: files(root).map(path => ({ path: path.slice(root.length + 1), sha256: hash(path) })) }, null, 2) + '\n');
