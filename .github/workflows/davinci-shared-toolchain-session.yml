name: Shared toolchain session
on:
  pull_request:
    paths:
      - ".github/workflows/davinci-shared-toolchain-session.yml"
      - "crates/vize_maestro/src/source_project/scoped_component.rs"
      - "crates/vize_maestro/src/source_project/toolchain_session.rs"
      - "crates/vize_maestro/src/source_project/toolchain_session/**"
      - "crates/vize_incremental/providers/graph/tests/incremental.rs"
      - "crates/vize_atelier_sfc/tests/bundler_toolchain_session.rs"
      - "crates/vize_atelier_sfc/src/native.rs"
      - "crates/vize_atelier_sfc/src/native/styles.rs"
      - "crates/vize_atelier_sfc/tests/component_scss/**"
      - "crates/vize_maestro/Cargo.toml"
      - "tests/fixtures/shared-toolchain/**"
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: shared-toolchain-session-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "24"
  RUST_MIN_STACK: "16777216"
  RUSTUP_TOOLCHAIN: "1.100.0"
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  replay:
    name: Compiler, lint, format, typed editor and incremental graph
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { ref: "${{ env.HEAD_SHA }}", persist-credentials: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.100.0", components: clippy }
      - uses: ./.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version-file: package.json, package-manager-cache: false }
      - name: Replay the original editor revisions in a single feature build and resident graph
        run: |
          set -euo pipefail
          export VIZE_TOOLCHAIN_HISTORY="$RUNNER_TEMP/shared-documents"
          export VIZE_STYLED_SESSION_OUTPUT="$RUNNER_TEMP/styled-session.json"
          export VIZE_SCOPED_SESSION_OUTPUT="$RUNNER_TEMP/scoped-session.json"
          export NODE_PATH="$RUNNER_TEMP/session-oracle/node_modules"
          version=$(node -p "require('./npm/builder/parcel/package.json').devDependencies.sass")
          npm install --prefix "$RUNNER_TEMP/session-oracle" --no-audit --no-fund --ignore-scripts --save-exact "sass@$version" @vue/compiler-sfc@3.5.35 @jridgewell/sourcemap-codec@1.6.0 postcss-selector-parser@7.1.6 vue@3.5.35
          flags=(--locked --profile ci-opt -p vize_maestro --features experimental-lexical-arrow-queries,experimental-recovered-literal-prefix,experimental-scoped-component-session,experimental-style-lint-products,micro-profiling --lib)
          cargo clippy "${flags[@]}" --no-deps -- -D warnings
          cargo test "${flags[@]}" toolchain_session_from_one_open_buffer -- --nocapture
          cargo test "${flags[@]}" current_scoped_compiler_and_lint_publication -- --ignored --nocapture --test-threads=1
          node crates/vize_atelier_sfc/tests/component_scss/oracle.ts < "$VIZE_STYLED_SESSION_OUTPUT"
          node crates/vize_atelier_sfc/tests/component_scss/oracle.ts < "$VIZE_SCOPED_SESSION_OUTPUT"
          node -e "const assert=require('node:assert/strict'); const rows=require('node:fs').readFileSync(process.env.VIZE_TOOLCHAIN_HISTORY,'utf8').split('\0'); assert.equal(rows.length,6); assert.equal(rows[4], require(process.env.VIZE_STYLED_SESSION_OUTPUT)[0].source); assert.equal(rows[5], require(process.env.VIZE_SCOPED_SESSION_OUTPUT)[0].source);"
          cargo test --locked --profile ci-opt -p vize_atelier_sfc --features native-sfc-scss --test native_sfc_scss component_scss::prepared:: -- --include-ignored --nocapture --test-threads=1
          export VIZE_COMPOSED_STYLE_INPUTS="$RUNNER_TEMP/vue-paths"
          git ls-files -z -- '*.vue' '*.vue.txt' > "$VIZE_COMPOSED_STYLE_INPUTS"
          cargo test "${flags[@]}" shared_style_queries_on_repository_documents -- --ignored --nocapture
          cargo test "${flags[@]}" source_project::style_format::composition:: -- --include-ignored --nocapture --test-threads=1
          test -s "$VIZE_TOOLCHAIN_HISTORY"
          cargo test --locked --profile ci-opt -p vize_atelier_sfc --features bundler-block-products --test bundler_toolchain_session -- --ignored --nocapture
          cargo test --locked --profile ci-opt --manifest-path crates/vize_incremental/providers/graph/Cargo.toml --test incremental original_template_graphs_follow_the_same_toolchain_session -- --ignored --nocapture
  stock:
    name: Stock CLI and packaged Node addon (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [default, portable]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      MODE: ${{ matrix.mode }}
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { ref: "${{ env.HEAD_SHA }}", persist-credentials: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with: { toolchain: "1.100.0" }
      - uses: ./.github/actions/setup-wild-http-recovery
        with: { wild-version: "0.9.0" }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: 24 }
      - name: Compare the complete integration to its default-branch ancestor
        run: |
          set -euo pipefail
          base=$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$HEAD_SHA" --jq .merge_base_commit.sha)
          [[ "$base" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$base" "$HEAD_SHA"
          node tools/commands/levels/codegen-equivalence.ts "$base" "$HEAD_SHA" vize bin:vize "$MODE" "$RUNNER_TEMP/cli.json"
          VIZE_CODEGEN_PROBE=1 node --test tests/tooling/native-addon-identity.test.ts
          status=0
          node tools/commands/levels/codegen-equivalence.ts "$base" "$HEAD_SHA" vize_vitrine node-addon "$MODE" "$RUNNER_TEMP/addon.json" --control-plugin-identity || status=$?
          test "$status" = 1
          node tools/commands/levels/native-addon-identity.ts "$RUNNER_TEMP/addon.json" | tee "$RUNNER_TEMP/identity.json"
          node tools/support/compat/npm/bundler-block-products.ts --stock "$RUNNER_TEMP/addon.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: shared-toolchain-stock-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/cli.json
            ${{ runner.temp }}/addon.json
            ${{ runner.temp }}/identity.json
