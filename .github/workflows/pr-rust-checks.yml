name: Rust source checks
on:
  workflow_call:
    inputs:
      run-rust:
        type: boolean
        required: true
      rust-plan:
        type: string
        required: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  merge-rust-source:
    name: PR Rust Clippy, tests, and fixtures
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: ${{ github.event_name == 'merge_group' && 45 || 35 }}
    env:
      CARGO_BUILD_JOBS: "12"
      RUST_TEST_THREADS: "4"
      VIZE_NUXT_CONFIG_ITERATIONS: "100"
    steps:
      - name: Explain documentation-only skip
        if: ${{ !inputs.run-rust }}
        run: echo 'Rust Clippy and tests skipped because this PR changes no Rust or unknown source paths.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ inputs.run-rust }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: ${{ inputs.run-rust }}
        with:
          components: clippy
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        if: ${{ inputs.run-rust }}
        with:
          wild-version: "0.9.0"
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        if: ${{ inputs.run-rust }}
        with:
          node-version-file: "package.json"
          cache: true
          run-install: true
      - uses: ./.github/actions/setup-rust-sticky-cache
        if: ${{ inputs.run-rust }}
        with:
          cache-key-prefix: ${{ github.event_name == 'pull_request' && format('pr-{0}-', github.event.pull_request.number) || format('merge-{0}-', github.sha) }}
          key: clippy-test
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
        if: ${{ inputs.run-rust }}
      - name: Clippy
        if: ${{ inputs.run-rust }}
        run: cargo clippy --workspace -- -D warnings -D clippy::wildcard_imports
      - name: Install Pkl CLI
        if: ${{ inputs.run-rust }}
        run: npm install --global @pkl-community/pkl@0.27.2
      - name: Build Rust workspace tests
        id: rust-test-build
        if: ${{ inputs.run-rust }}
        env: { VIZE_TEST_REQUIRE_TSGO: "1" }
        run: |
          timing_dir="$RUNNER_TEMP/rust-test-timings"
          mkdir -p "$timing_dir"
          rm -f target/cargo-timings/cargo-timing.html
          touch "$timing_dir/build-started"
          phase_started=$SECONDS
          if cargo test --workspace --no-run --timings; then phase_exit=0; else phase_exit=$?; fi
          printf '{"phase":"build","elapsed_seconds":%d,"exit_code":%d}\n' "$((SECONDS - phase_started))" "$phase_exit" > "$timing_dir/build.json"
          exit "$phase_exit"
      - name: Run Rust workspace tests
        id: rust-test-run
        if: ${{ inputs.run-rust }}
        env: { VIZE_TEST_REQUIRE_TSGO: "1" }
        run: |
          phase_started=$SECONDS
          if cargo test --workspace; then phase_exit=0; else phase_exit=$?; fi
          printf '{"phase":"execution-and-doctests","elapsed_seconds":%d,"exit_code":%d}\n' "$((SECONDS - phase_started))" "$phase_exit" > "$RUNNER_TEMP/rust-test-timings/run.json"
          exit "$phase_exit"
      - name: Test merge queue differential corpora
        if: ${{ github.event_name == 'merge_group' && inputs.run-rust }}
        uses: ./.github/actions/test-rust-workspace-differential
        with:
          workspace-already-tested: "true"
      - name: Check fixture coverage
        if: ${{ inputs.run-rust }}
        run: rust-script tools/commands/ci/github/write-coverage-summary.rs
      - name: Summarize Rust test timing evidence
        if: ${{ always() && inputs.run-rust }}
        env:
          BUILD_OUTCOME: ${{ steps.rust-test-build.outcome }}
          RUN_OUTCOME: ${{ steps.rust-test-run.outcome }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          CACHE_NAMESPACE: ${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}-', github.event.pull_request.number) || format('merge-{0}-', github.sha) }}clippy-test-target-${{ runner.os }}-${{ runner.arch }}
        run: node tools/support/compat/github/rust-test-timings.mjs
      - name: Upload Rust test timing evidence
        if: ${{ always() && inputs.run-rust }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-test-timings-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/rust-test-timings/
          if-no-files-found: error
          retention-days: 14

  pr-rust-build:
    name: Build affected Rust tests
    if: ${{ github.event_name == 'pull_request' && inputs.run-rust }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "12"
      VIZE_TEST_DISABLE_TSGO: "1"
      RUST_PLAN_JSON: ${{ inputs.rust-plan }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          cache-key-prefix: ${{ format('pr-{0}-', github.event.pull_request.number) }}
          key: nextest-ci
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        with:
          tool: cargo-nextest@0.9.146
      - name: Materialize affected Rust plan
        run: node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/rust-plan.json", process.env.RUST_PLAN_JSON)'
      - name: Clippy affected crates
        run: node tools/support/compat/github/run-affected-rust.mjs "$RUNNER_TEMP/rust-plan.json" cargo clippy @packages@ --profile ci -- -D warnings -D clippy::wildcard_imports
      - name: Build and archive affected Rust tests once
        run: |
          mkdir -p target/rust-test-archive
          node tools/support/compat/github/run-affected-rust.mjs "$RUNNER_TEMP/rust-plan.json" cargo nextest archive @packages@ --cargo-profile ci --archive-file target/rust-test-archive/tests.tar.zst
          node tools/support/compat/github/rust-test-archive.mjs stamp target/rust-test-archive/tests.tar.zst target/rust-test-archive/receipt.json
      - name: Run affected Rust doctests
        run: node tools/support/compat/github/run-affected-rust.mjs "$RUNNER_TEMP/rust-plan.json" cargo test @packages@ --profile ci --doc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-test-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/rust-test-archive/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  pr-rust-shard:
    name: Rust tests (${{ matrix.shard }}/4)
    if: ${{ github.event_name == 'pull_request' && inputs.run-rust }}
    needs: pr-rust-build
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CARGO_BUILD_JOBS: "12"
      VIZE_NUXT_CONFIG_ITERATIONS: "100"
      VIZE_TEST_DISABLE_TSGO: "1"
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: true
      - uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        with:
          tool: cargo-nextest@0.9.146
      - name: Install Pkl CLI
        run: npm install --global @pkl-community/pkl@0.27.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-test-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/rust-test-archive
      - name: Verify Rust archive identity
        run: node tools/support/compat/github/rust-test-archive.mjs verify .artifacts/rust-test-archive/tests.tar.zst .artifacts/rust-test-archive/receipt.json
      - name: Run Rust test shard without rebuilding
        # Baked env! paths still occur in tests. Extract to the original workspace
        # (checked by the receipt), preserving target/ci and CARGO_BIN_EXE paths.
        # Empty partitions are valid for packages with fewer than four tests.
        run: |
          # Cargo creates this baked CARGO_TARGET_TMPDIR even when it is empty.
          # Archive transfer preserves files, so restore the directory here.
          mkdir -p target/tmp
          cargo nextest run --archive-file .artifacts/rust-test-archive/tests.tar.zst --extract-to "$GITHUB_WORKSPACE" --extract-overwrite --workspace-remap "$GITHUB_WORKSPACE" --profile pr --partition "hash:$SHARD/4" --no-tests=pass
      - name: Upload Rust shard results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-test-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/nextest/pr/junit.xml
          if-no-files-found: error
          retention-days: 7

  rust-source-report:
    name: Rust source report
    if: ${{ always() }}
    needs: [merge-rust-source, pr-rust-build, pr-rust-shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Require the complete Rust tier
        env:
          RUN_RUST: ${{ inputs.run-rust }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node tools/support/compat/github/require-rust-tier.mjs
