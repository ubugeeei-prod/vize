name: Rust source checks
on:
  workflow_call:
    inputs:
      run-rust:
        type: boolean
        required: true
      rust-plan:
        type: string
        required: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  merge-rust-source:
    name: Build affected Rust test archive
    if: ${{ github.event_name == 'merge_group' && inputs.run-rust }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: ${{ github.event_name == 'merge_group' && 45 || 35 }}
    env:
      CARGO_BUILD_JOBS: "12"
      RUST_TEST_THREADS: "4"
      VIZE_NUXT_CONFIG_ITERATIONS: "100"
      VIZE_TEST_REQUIRE_TSGO: "1"
      RUST_PLAN_JSON: ${{ inputs.rust-plan }}
    steps:
      - name: Explain documentation-only skip
        if: ${{ !inputs.run-rust }}
        run: echo 'Rust Clippy and tests skipped because this PR changes no Rust or unknown source paths.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ inputs.run-rust }}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        if: ${{ inputs.run-rust }}
        with:
          components: clippy
          toolchain: "1.99.0"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        if: ${{ inputs.run-rust }}
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/cache-vp-bootstrap
        if: ${{ inputs.run-rust }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        if: ${{ inputs.run-rust }}
        with:
          node-version-file: "package.json"
          cache: true
          run-install: true
      - uses: ./.github/actions/setup-rust-sticky-cache
        if: ${{ inputs.run-rust }}
        with:
          # The disk every main push seeds with these exact ci-profile commands.
          key: nextest-ci
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Materialize affected Rust plan
        if: ${{ inputs.run-rust }}
        run: node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/rust-plan.json", process.env.RUST_PLAN_JSON)'
      - name: Install Pkl CLI
        if: ${{ inputs.run-rust }}
        run: npm install --global @pkl-community/pkl@0.27.2
      - uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        if: ${{ inputs.run-rust }}
        with:
          tool: cargo-nextest@0.9.146
      - name: Build Rust workspace tests
        id: rust-test-build
        if: ${{ inputs.run-rust }}
        env: { VIZE_TEST_REQUIRE_TSGO: "1" }
        run: |
          timing_dir="$RUNNER_TEMP/rust-test-timings"
          mkdir -p "$timing_dir"
          rm -f target/cargo-timings/cargo-timing.html
          touch "$timing_dir/build-started"
          phase_started=$SECONDS
          mkdir -p target/rust-test-archive
          if node tools/support/compat/github/run-affected-rust.ts "$RUNNER_TEMP/rust-plan.json" cargo nextest archive @packages@ --cargo-profile ci --timings --archive-file target/rust-test-archive/tests.tar.zst; then phase_exit=0; else phase_exit=$?; fi
          printf '{"phase":"build","elapsed_seconds":%d,"exit_code":%d}\n' "$((SECONDS - phase_started))" "$phase_exit" > "$timing_dir/build.json"
          if [[ "$phase_exit" == 0 ]]; then
            node tools/support/compat/github/rust-test-archive.mjs stamp target/rust-test-archive/tests.tar.zst target/rust-test-archive/receipt.json
            cp target/rust-test-archive/receipt.json "$timing_dir/archive-receipt.json"
          fi
          exit "$phase_exit"
      - name: List full workspace archive tests
        if: ${{ inputs.run-rust }}
        run: cargo nextest list --archive-file target/rust-test-archive/tests.tar.zst --extract-to "$GITHUB_WORKSPACE" --extract-overwrite --workspace-remap "$GITHUB_WORKSPACE" --profile full --message-format json > "$RUNNER_TEMP/rust-test-timings/workspace-tests.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.run-rust }}
        with:
          name: rust-test-archive-${{ github.run_id }}-${{ github.sha }}
          overwrite: true
          path: target/rust-test-archive/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Summarize Rust test timing evidence
        if: ${{ !cancelled() && inputs.run-rust }}
        env:
          BUILD_OUTCOME: ${{ steps.rust-test-build.outcome }}
          RUN_OUTCOME: skipped
          BUILD_COMMAND: node tools/support/compat/github/run-affected-rust.ts "$RUNNER_TEMP/rust-plan.json" cargo nextest archive @packages@ --cargo-profile ci --timings --archive-file target/rust-test-archive/tests.tar.zst
          RUN_COMMAND: parallel Clippy and doctest job
          RUN_PHASE: doctests
          CARGO_TEST_PROFILE: ci
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          CACHE_NAMESPACE: ${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}-', github.event.pull_request.number) || format('merge-{0}-', github.sha) }}clippy-test-target-${{ runner.os }}-${{ runner.arch }}
        run: node tools/support/compat/github/rust-test-timings.mjs
      - name: Upload Rust test timing evidence
        if: ${{ !cancelled() && inputs.run-rust }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-test-timings-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/rust-test-timings/
          if-no-files-found: error
          retention-days: 14

  # The feature tail compiles its own dev/test-profile binaries and never runs
  # the producer's ci archive, so it starts beside the producer instead of
  # after it. The Rust source report still requires both.
  merge-rust-differential:
    name: Required Rust differential corpora
    if: ${{ github.event_name == 'merge_group' && inputs.run-rust }}
    uses: ./.github/workflows/pr-rust-differential.yml
    with:
      run-rust: ${{ inputs.run-rust }}
      rust-plan: ${{ inputs.rust-plan }}

  pr-rust-build:
    name: Clippy, doctests and feature lanes
    if: ${{ inputs.run-rust }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "12"
      VIZE_NUXT_CONFIG_ITERATIONS: "100"
      RUST_PLAN_JSON: ${{ inputs.rust-plan }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: "package.json", package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          components: clippy
          toolchain: "1.99.0"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: nextest-ci
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Materialize affected Rust plan
        run: node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/rust-plan.json", process.env.RUST_PLAN_JSON)'
      - name: Select Clippy and doctest runtime envelope
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) printf 'VIZE_TEST_DISABLE_TSGO=1\n' >> "$GITHUB_ENV" ;;
            merge_group) printf 'VIZE_TEST_REQUIRE_TSGO=1\n' >> "$GITHUB_ENV" ;;
            *) exit 1 ;;
          esac
      - name: Clippy affected crates
        run: node tools/support/compat/github/run-affected-rust.ts "$RUNNER_TEMP/rust-plan.json" cargo clippy @packages@ --profile ci -- -D warnings -D clippy::wildcard_imports
      - name: Native L1 markup parity
        if: ${{ contains(fromJSON(inputs.rust-plan).packages, 'vize_l1') || contains(fromJSON(inputs.rust-plan).packages, 'vize_armature') }}
        run: cargo test -p vize_armature --features native-lex-parity,legacy --lib --test markup_lex_parity
      - name: Test L1 feature-enabled surface corpus
        if: ${{ github.event_name == 'pull_request' && contains(fromJSON(inputs.rust-plan).packages, 'vize_l1') }}
        run: cargo test -p vize_l1 --features legacy-differential --test surface_corpus -- --nocapture
      - name: Test affected native Program and Vue navigation
        if: ${{ github.event_name == 'pull_request' && contains(fromJSON(inputs.rust-plan).packages, 'vize_maestro') }}
        uses: ./.github/actions/test-native-navigation
      - name: Run affected Rust doctests
        run: node tools/support/compat/github/run-affected-rust.ts "$RUNNER_TEMP/rust-plan.json" cargo test @packages@ --profile ci --doc

  # PR shards build the same affected test binaries from the warm read-only
  # `nextest-ci` clone and start beside Clippy, instead of moving a multi-GB
  # archive. The merge queue keeps its archive: its receipts bind the evidence.
  pr-rust-shard:
    name: Rust tests (${{ matrix.shard }}/4)
    if: ${{ always() && !cancelled() && inputs.run-rust && (github.event_name == 'pull_request' || github.event_name == 'merge_group' && needs.merge-rust-source.result == 'success') }}
    needs: [merge-rust-source]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CARGO_BUILD_JOBS: "12"
      VIZE_NUXT_CONFIG_ITERATIONS: "100"
      RUST_TEST_THREADS: "4"
      NEXTEST_PROFILE: ${{ github.event_name == 'merge_group' && 'full' || 'pr' }}
      SHARD: ${{ matrix.shard }}
      RUST_PLAN_JSON: ${{ inputs.rust-plan }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.99.0"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        if: ${{ github.event_name == 'pull_request' }}
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        if: ${{ github.event_name == 'pull_request' }}
        with:
          key: nextest-ci
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/cache-vp-bootstrap
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          cache: true
          run-install: true
      - uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        with:
          tool: cargo-nextest@0.9.146
      - name: Select Rust runtime envelope
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) printf 'VIZE_TEST_DISABLE_TSGO=1\n' >> "$GITHUB_ENV" ;;
            merge_group) printf 'VIZE_TEST_REQUIRE_TSGO=1\n' >> "$GITHUB_ENV" ;;
            *) exit 1 ;;
          esac
      - name: Install Pkl CLI
        run: npm install --global @pkl-community/pkl@0.27.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ github.event_name == 'merge_group' }}
        with:
          name: rust-test-archive-${{ github.run_id }}-${{ github.sha }}
          path: .artifacts/rust-test-archive
      - name: Verify Rust archive identity
        if: ${{ github.event_name == 'merge_group' }}
        run: node tools/support/compat/github/rust-test-archive.mjs verify .artifacts/rust-test-archive/tests.tar.zst .artifacts/rust-test-archive/receipt.json
      - name: Hydrate the required ElementPlus projection fixture
        if: ${{ github.event_name == 'merge_group' && contains(fromJSON(inputs.rust-plan).packages, 'vize_canon') }}
        run: git submodule update --init --depth 1 -- tests/_fixtures/_git/element-plus
      - name: Prepare required typechecker observations
        if: ${{ github.event_name == 'merge_group' && contains(fromJSON(inputs.rust-plan).packages, 'vize_canon') }}
        run: |
          mkdir -p target/nextest/full/typechecker-fixtures
          printf 'VIZE_TEST_FIX_HISTORY_CAPTURE_DIR=%s\nVIZE_TEST_FIX_HISTORY_ARCHIVE_RECEIPT=%s\n' "$GITHUB_WORKSPACE/target/nextest/full/typechecker-fixtures" "$GITHUB_WORKSPACE/.artifacts/rust-test-archive/receipt.json" >> "$GITHUB_ENV"
      - name: Build and run the affected Rust test shard
        if: ${{ github.event_name == 'pull_request' }}
        # The same affected packages, Cargo profile, nextest profile and hash
        # partition as the former archive; empty partitions remain valid.
        run: |
          node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/rust-plan.json", process.env.RUST_PLAN_JSON)'
          phase_started=$SECONDS
          if node tools/support/compat/github/run-affected-rust.ts "$RUNNER_TEMP/rust-plan.json" cargo nextest run @packages@ --cargo-profile ci --profile "$NEXTEST_PROFILE" --partition "hash:$SHARD/4" --no-tests=pass; then phase_exit=0; else phase_exit=$?; fi
          mkdir -p "target/nextest/$NEXTEST_PROFILE"
          printf '{"phase":"workspace-shard","shard":%s,"elapsed_seconds":%d,"exit_code":%d}\n' "$SHARD" "$((SECONDS - phase_started))" "$phase_exit" > "target/nextest/$NEXTEST_PROFILE/timing.json"
          exit "$phase_exit"
      - name: Run Rust test shard without rebuilding
        if: ${{ github.event_name == 'merge_group' }}
        # Baked env! paths still occur in tests. Extract to the original workspace
        # (checked by the receipt), preserving target/ci and CARGO_BIN_EXE paths.
        # Empty partitions are valid for packages with fewer than four tests.
        run: |
          # Cargo creates this baked CARGO_TARGET_TMPDIR even when it is empty.
          # Archive transfer preserves files, so restore the directory here.
          mkdir -p target/tmp
          phase_started=$SECONDS
          if cargo nextest run --archive-file .artifacts/rust-test-archive/tests.tar.zst --extract-to "$GITHUB_WORKSPACE" --extract-overwrite --workspace-remap "$GITHUB_WORKSPACE" --profile "$NEXTEST_PROFILE" --partition "hash:$SHARD/4" --no-tests=pass; then phase_exit=0; else phase_exit=$?; fi
          printf '{"phase":"workspace-shard","shard":%s,"elapsed_seconds":%d,"exit_code":%d}\n' "$SHARD" "$((SECONDS - phase_started))" "$phase_exit" > "target/nextest/$NEXTEST_PROFILE/timing.json"
          exit "$phase_exit"
      - name: Verify actual typechecker fixture observations
        if: ${{ !cancelled() && github.event_name == 'merge_group' && contains(fromJSON(inputs.rust-plan).packages, 'vize_canon') }}
        run: vp node tests/differential/typechecker-shards.ts worker target/nextest/full/typechecker-fixtures .artifacts/rust-test-archive/receipt.json target/nextest/full/junit.xml "$SHARD"
      - name: Upload Rust shard results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-test-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/nextest/${{ env.NEXTEST_PROFILE }}/
          if-no-files-found: error
          retention-days: 7

  rust-source-report:
    name: Rust source report
    permissions: { contents: read, actions: read }
    # A superseded run reports nothing: its required check fails in test-report.
    if: ${{ always() && !contains(needs.*.result, 'cancelled') }}
    needs: [merge-rust-source, merge-rust-differential, pr-rust-build, pr-rust-shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/cache-vp-bootstrap
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          run-install: false
      - name: Require the complete Rust tier
        env:
          RUN_RUST: ${{ inputs.run-rust }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node tools/support/compat/github/require-rust-tier.ts
      - name: Select latest source-bound Rust workers
        id: rust-workers
        if: ${{ github.event_name == 'merge_group' && inputs.run-rust && needs.pr-rust-shard.result == 'success' && contains(fromJSON(inputs.rust-plan).packages, 'vize_canon') }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: node tools/support/compat/github/select-rust-workers.mjs select target/differential/typechecker/worker-selection.json
      - name: Download the four current full Rust workers
        if: ${{ github.event_name == 'merge_group' && inputs.run-rust && needs.pr-rust-shard.result == 'success' && contains(fromJSON(inputs.rust-plan).packages, 'vize_canon') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.rust-workers.outputs.artifact-ids }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          repository: ${{ github.repository }}
          merge-multiple: false
          digest-mismatch: error
          path: .artifacts/typechecker-workers
      - name: Require all registered typechecker observations
        if: ${{ github.event_name == 'merge_group' && inputs.run-rust && needs.pr-rust-shard.result == 'success' && contains(fromJSON(inputs.rust-plan).packages, 'vize_canon') }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          node tools/support/compat/github/select-rust-workers.mjs verify target/differential/typechecker/worker-selection.json .artifacts/typechecker-workers
          vp node tests/differential/typechecker-shards.ts aggregate .artifacts/typechecker-workers target/differential/typechecker
      - name: Upload typechecker shared corpus evidence
        if: ${{ !cancelled() && github.event_name == 'merge_group' && inputs.run-rust && needs.pr-rust-shard.result == 'success' && contains(fromJSON(inputs.rust-plan).packages, 'vize_canon') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typechecker-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/differential/typechecker/
          if-no-files-found: error
          retention-days: 14
