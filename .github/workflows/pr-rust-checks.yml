name: Rust source checks
on:
  workflow_call:
    inputs:
      run-rust:
        type: boolean
        required: true
      rust-plan:
        type: string
        required: true
      run-source-contracts:
        type: boolean
        required: false
        default: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Feature corpora and Clippy/doctests remain genuine parallel source checks.
  # Their dev/test-profile binaries do not reuse the product workflow's archive;
  # the source report requires both source jobs.
  merge-rust-differential:
    name: Required Rust differential corpora
    if: ${{ github.event_name == 'merge_group' && inputs.run-rust }}
    uses: ./.github/workflows/pr-rust-differential.yml
    with:
      run-rust: ${{ inputs.run-rust }}
      rust-plan: ${{ inputs.rust-plan }}

  pr-rust-build:
    name: Clippy, doctests and feature lanes
    if: ${{ inputs.run-rust }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "12"
      VIZE_NUXT_CONFIG_ITERATIONS: "100"
      RUST_PLAN_JSON: ${{ inputs.rust-plan }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: "package.json", package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          components: clippy
          toolchain: "1.99.1"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: nextest-ci
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
        if: ${{ inputs.run-source-contracts }}
      - name: Require current-tree source, API and reviewed-doc contracts
        if: ${{ inputs.run-source-contracts }}
        run: >-
          node --test --test-concurrency=1
          tests/tooling/davinci-assertion-lint.test.ts
          tests/tooling/davinci-consumer-migration-surfaces.test.mjs
          tests/tooling/docs-reviewed-translations.test.ts
          tests/tooling/typecheck-divergence-report-timeout.test.ts
          tests/tooling/typecheck-divergence-mutation-oracle.test.ts
          tests/tooling/typecheck-fixture-custody.test.ts
      - name: Retain mutation deadline command and fixture evidence
        if: ${{ always() && inputs.run-source-contracts }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-deadline-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: target/differential/typecheck-mutation/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Materialize affected Rust plan
        run: node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/rust-plan.json", process.env.RUST_PLAN_JSON)'
      - name: Select Clippy and doctest runtime envelope
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) printf 'VIZE_TEST_DISABLE_TSGO=1\n' >> "$GITHUB_ENV" ;;
            merge_group) printf 'VIZE_TEST_REQUIRE_TSGO=1\n' >> "$GITHUB_ENV" ;;
            *) exit 1 ;;
          esac
      - name: Clippy affected crates
        run: node tools/support/compat/github/run-affected-rust.ts "$RUNNER_TEMP/rust-plan.json" cargo clippy @packages@ --profile ci -- -D warnings -D clippy::wildcard_imports
      - name: Native L1 markup parity
        if: ${{ contains(fromJSON(inputs.rust-plan).packages, 'vize_l1') || contains(fromJSON(inputs.rust-plan).packages, 'vize_armature') }}
        run: cargo test -p vize_armature --features native-lex-parity,legacy --lib --test markup_lex_parity
      - name: Test L1 feature-enabled surface corpus
        if: ${{ github.event_name == 'pull_request' && contains(fromJSON(inputs.rust-plan).packages, 'vize_l1') }}
        run: cargo test -p vize_l1 --features legacy-differential --test surface_corpus -- --nocapture
      - name: Test affected native Program and Vue navigation
        if: ${{ github.event_name == 'pull_request' && contains(fromJSON(inputs.rust-plan).packages, 'vize_maestro') }}
        uses: ./.github/actions/test-native-navigation
      - name: Run affected Rust doctests
        run: node tools/support/compat/github/run-affected-rust.ts "$RUNNER_TEMP/rust-plan.json" cargo test @packages@ --profile ci --doc

  rust-source-report:
    name: Rust source report
    permissions: { contents: read, actions: read }
    # A superseded run reports nothing: its required check fails in test-report.
    if: ${{ always() && !contains(needs.*.result, 'cancelled') }}
    needs: [merge-rust-differential, pr-rust-build]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/cache-vp-bootstrap
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          run-install: false
      - name: Require the complete Rust tier
        env:
          RUN_RUST: ${{ inputs.run-rust }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node tools/support/compat/github/require-rust-tier.ts --source
