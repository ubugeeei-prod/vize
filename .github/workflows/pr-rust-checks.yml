name: Rust source checks
on:
  workflow_call:
    inputs:
      run-rust:
        type: boolean
        required: true
      rust-plan:
        type: string
        required: true
      run-source-contracts:
        type: boolean
        required: false
        default: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  merge-rust-source:
    name: Build affected Rust test archive
    if: ${{ github.event_name == 'merge_group' && inputs.run-rust }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: ${{ github.event_name == 'merge_group' && 45 || 35 }}
    env:
      CARGO_BUILD_JOBS: "12"
      RUST_TEST_THREADS: "4"
      VIZE_NUXT_CONFIG_ITERATIONS: "100"
      VIZE_TEST_REQUIRE_TSGO: "1"
      RUST_PLAN_JSON: ${{ inputs.rust-plan }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ inputs.run-rust }}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        if: ${{ inputs.run-rust }}
        with:
          components: clippy
          toolchain: "1.99.1"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        if: ${{ inputs.run-rust }}
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/cache-vp-bootstrap
        if: ${{ inputs.run-rust }}
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        if: ${{ inputs.run-rust }}
        with:
          version: latest
          node-version-file: "package.json"
          cache: true
          cache-save: false
          run-install: true
      - uses: ./.github/actions/setup-rust-sticky-cache
        if: ${{ inputs.run-rust }}
        with:
          # The disk every main push seeds with these exact ci-profile commands.
          key: nextest-ci
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Materialize affected Rust plan
        if: ${{ inputs.run-rust }}
        run: node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/rust-plan.json", process.env.RUST_PLAN_JSON)'
      - name: Install Pkl CLI
        if: ${{ inputs.run-rust }}
        run: npm install --global @pkl-community/pkl@0.27.2
      - uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        if: ${{ inputs.run-rust }}
        with:
          tool: cargo-nextest@0.9.146
      - name: Build Rust workspace tests
        id: rust-test-build
        if: ${{ inputs.run-rust }}
        env: { VIZE_TEST_REQUIRE_TSGO: "1" }
        run: |
          timing_dir="$RUNNER_TEMP/rust-test-timings"
          mkdir -p "$timing_dir"
          rm -f target/cargo-timings/cargo-timing.html
          touch "$timing_dir/build-started"
          phase_started=$SECONDS
          mkdir -p target/rust-test-archive
          if node tools/support/compat/github/run-affected-rust.ts "$RUNNER_TEMP/rust-plan.json" cargo nextest archive @packages@ --cargo-profile ci --timings --archive-file target/rust-test-archive/tests.tar.zst; then phase_exit=0; else phase_exit=$?; fi
          printf '{"phase":"build","elapsed_seconds":%d,"exit_code":%d}\n' "$((SECONDS - phase_started))" "$phase_exit" > "$timing_dir/build.json"
          if [[ "$phase_exit" == 0 ]]; then
            node tools/support/compat/github/rust-test-archive.mjs stamp target/rust-test-archive/tests.tar.zst target/rust-test-archive/receipt.json
            cp target/rust-test-archive/receipt.json "$timing_dir/archive-receipt.json"
          fi
          exit "$phase_exit"
      - name: List affected source-built tests
        if: ${{ inputs.run-rust }}
        # This diagnostic inventory reuses the producer's binaries. Each worker
        # independently verifies and extracts the receipt-bound archive it runs.
        run: node tools/support/compat/github/run-affected-rust.ts "$RUNNER_TEMP/rust-plan.json" cargo nextest list @packages@ --cargo-profile ci --profile full --message-format json > "$RUNNER_TEMP/rust-test-timings/workspace-tests.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.run-rust }}
        with:
          name: rust-test-archive-${{ github.run_id }}-${{ github.sha }}
          overwrite: true
          path: target/rust-test-archive/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Summarize Rust test timing evidence
        if: ${{ !cancelled() && inputs.run-rust }}
        env:
          BUILD_OUTCOME: ${{ steps.rust-test-build.outcome }}
          RUN_OUTCOME: skipped
          BUILD_COMMAND: node tools/support/compat/github/run-affected-rust.ts "$RUNNER_TEMP/rust-plan.json" cargo nextest archive @packages@ --cargo-profile ci --timings --archive-file target/rust-test-archive/tests.tar.zst
          RUN_COMMAND: parallel Clippy and doctest job
          RUN_PHASE: doctests
          CARGO_TEST_PROFILE: ci
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          CACHE_NAMESPACE: ${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}-', github.event.pull_request.number) || format('merge-{0}-', github.sha) }}clippy-test-target-${{ runner.os }}-${{ runner.arch }}
        run: node tools/support/compat/github/rust-test-timings.mjs
      - name: Upload Rust test timing evidence
        if: ${{ !cancelled() && inputs.run-rust }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-test-timings-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/rust-test-timings/
          if-no-files-found: error
          retention-days: 14

  # The feature tail compiles its own dev/test-profile binaries and never runs
  # the producer's ci archive, so it starts beside the producer instead of
  # after it. The Rust source report still requires both.
  merge-rust-differential:
    name: Required Rust differential corpora
    if: ${{ github.event_name == 'merge_group' && inputs.run-rust }}
    uses: ./.github/workflows/pr-rust-differential.yml
    with:
      run-rust: ${{ inputs.run-rust }}
      rust-plan: ${{ inputs.rust-plan }}

  pr-rust-build:
    name: Clippy, doctests and feature lanes
    if: ${{ inputs.run-rust }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "12"
      VIZE_NUXT_CONFIG_ITERATIONS: "100"
      RUST_PLAN_JSON: ${{ inputs.rust-plan }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version-file: "package.json", package-manager-cache: false }
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          components: clippy
          toolchain: "1.99.1"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: nextest-ci
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/setup-rust-script
        if: ${{ inputs.run-source-contracts }}
      - name: Require current-tree source, API and reviewed-doc contracts
        if: ${{ inputs.run-source-contracts }}
        run: >-
          node --test --test-concurrency=1
          tests/tooling/davinci-assertion-lint.test.ts
          tests/tooling/davinci-consumer-migration-surfaces.test.mjs
          tests/tooling/docs-reviewed-translations.test.ts
      - name: Materialize affected Rust plan
        run: node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/rust-plan.json", process.env.RUST_PLAN_JSON)'
      - name: Select Clippy and doctest runtime envelope
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) printf 'VIZE_TEST_DISABLE_TSGO=1\n' >> "$GITHUB_ENV" ;;
            merge_group) printf 'VIZE_TEST_REQUIRE_TSGO=1\n' >> "$GITHUB_ENV" ;;
            *) exit 1 ;;
          esac
      - name: Clippy affected crates
        run: node tools/support/compat/github/run-affected-rust.ts "$RUNNER_TEMP/rust-plan.json" cargo clippy @packages@ --profile ci -- -D warnings -D clippy::wildcard_imports
      # Temporary source-only carrier. Remove after the actual complete packets
      # qualify the finite correction; the strict current-tree gate stays below.
      - name: Capture exact binding parser BEFORE and rejected AFTER
        if: ${{ always() && !cancelled() && github.event_name == 'pull_request' && (contains(fromJSON(inputs.rust-plan).packages, 'vize_l1') || contains(fromJSON(inputs.rust-plan).packages, 'vize_armature')) }}
        shell: bash
        run: |
          set -euo pipefail
          binding_output="$GITHUB_WORKSPACE/target/differential/binding-value-history"
          mkdir -p "$binding_output"
          rustc -Vv > "$binding_output/rustc.txt"
          cargo -Vv > "$binding_output/cargo.txt"
          git fetch --no-tags --depth=1 origin 54400c86c8a224777640d9554c220dccf8f53b90 bf006b1c11996197296c4344eeb9153a6289fdad
          binding_contract=0
          for binding_pair in 'before 54400c86c8a224777640d9554c220dccf8f53b90 0' 'after bf006b1c11996197296c4344eeb9153a6289fdad 101'; do
            read -r binding_side binding_revision binding_expected <<< "$binding_pair"
            binding_source="$RUNNER_TEMP/binding-parser-$binding_side"
            binding_target="$RUNNER_TEMP/binding-target-$binding_side"
            mkdir -p "$binding_source"
            git archive "$binding_revision" | tar -x -C "$binding_source"
            git ls-tree -r "$binding_revision" > "$binding_output/$binding_side-source-tree.txt"
            git rev-parse "$binding_revision^{tree}" > "$binding_output/$binding_side-tree.txt"
            for binding_repeat in 1 2; do
              binding_capture="$binding_output/$binding_side-$binding_repeat"
              mkdir -p "$binding_capture"
              if (cd "$binding_source" && VIZE_TOKENIZER_CAPTURE_DIR="$binding_capture" CARGO_TARGET_DIR="$binding_target" cargo test --locked --profile ci -p vize_armature --features native-lex-parity,legacy --lib parser::tokenizer_contract_tests::complete_fixture_asts_and_utf8_cuts_keep_the_frozen_tokenizer_contract -- --exact --nocapture) > "$binding_capture/stdout.bin" 2> "$binding_capture/stderr.bin"; then binding_status=0; else binding_status=$?; fi
              printf '{"source":"%s","repeat":%s,"actualExit":%s,"expectedCaptureExit":%s}\n' "$binding_revision" "$binding_repeat" "$binding_status" "$binding_expected" > "$binding_capture/process.json"
              if ! node --input-type=module - "$binding_capture/fixtures.bin" "$binding_source/crates/vize_armature/tests/_fixtures/tokenizer_parser_fixtures.bin" <<'JS_CAPTURE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const bytes = readFileSync(process.argv[2]);
          const frozen = readFileSync(process.argv[3]);
          assert.equal(frozen.length, 4296 * 16);
          let offset = 0;
          const integer = () => { assert.ok(offset + 8 <= bytes.length); const value = bytes.readBigUInt64LE(offset); offset += 8; return value; };
          const field = () => { const size = integer(); assert.ok(size <= BigInt(bytes.length - offset)); const end = offset + Number(size); const value = bytes.subarray(offset, end); offset = end; return value; };
          for (let index = 0; index < 4296; index++) {
            assert.equal(integer(), BigInt(index));
            assert.equal(integer(), 7n);
            const fields = Array.from({ length: 7 }, field);
            assert.deepEqual(fields[5], frozen.subarray(index * 16, index * 16 + 16));
            assert.equal(fields[6].length, 16);
          }
          assert.equal(integer(), 0xffffffffffffffffn);
          assert.equal(integer(), 1n);
          assert.equal(field().length, 16);
          assert.equal(offset, bytes.length);
          JS_CAPTURE
              then binding_contract=1; fi
              test "$binding_status" = "$binding_expected" || binding_contract=1
            done
          done
          exit "$binding_contract"
      - name: Preserve actual binding parser source-pair captures
        if: ${{ always() && github.event_name == 'pull_request' && (contains(fromJSON(inputs.rust-plan).packages, 'vize_l1') || contains(fromJSON(inputs.rust-plan).packages, 'vize_armature')) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binding-parser-whole-source-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/differential/binding-value-history/
          if-no-files-found: error
          retention-days: 14
      - name: Native L1 markup parity
        if: ${{ contains(fromJSON(inputs.rust-plan).packages, 'vize_l1') || contains(fromJSON(inputs.rust-plan).packages, 'vize_armature') }}
        run: cargo test -p vize_armature --features native-lex-parity,legacy --lib --test markup_lex_parity
      - name: Test L1 feature-enabled surface corpus
        if: ${{ github.event_name == 'pull_request' && contains(fromJSON(inputs.rust-plan).packages, 'vize_l1') }}
        run: cargo test -p vize_l1 --features legacy-differential --test surface_corpus -- --nocapture
      - name: Test affected native Program and Vue navigation
        if: ${{ github.event_name == 'pull_request' && contains(fromJSON(inputs.rust-plan).packages, 'vize_maestro') }}
        uses: ./.github/actions/test-native-navigation
      - name: Run affected Rust doctests
        run: node tools/support/compat/github/run-affected-rust.ts "$RUNNER_TEMP/rust-plan.json" cargo test @packages@ --profile ci --doc

  # Named cohorts build the same affected test binaries from the warm read-only
  # `nextest-ci` clone and start beside Clippy, instead of moving a multi-GB
  # archive. The merge queue keeps its archive: its receipts bind the evidence.
  pr-rust-shard:
    permissions: { contents: read, actions: read }
    name: Rust tests (${{ matrix.name }})
    if: ${{ always() && !cancelled() && inputs.run-rust && (github.event_name == 'pull_request' || github.event_name == 'merge_group' && needs.merge-rust-source.result == 'success') }}
    needs: [merge-rust-source]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.rust-plan).testMatrix }}
    env:
      CARGO_BUILD_JOBS: "12"
      VIZE_NUXT_CONFIG_ITERATIONS: "100"
      RUST_TEST_THREADS: "4"
      NEXTEST_PROFILE: ${{ github.event_name == 'merge_group' && 'full' || 'pr' }}
      VIZE_TEMPLATE_EMIT_TS40_CAPTURE: ${{ github.workspace }}/target/nextest/${{ github.event_name == 'merge_group' && 'full' || 'pr' }}/template-emit-ts40-projection
      COHORT: ${{ matrix.cohort }}
      NEXTEST_FILTER: ${{ matrix.filter }}
      RUST_PLAN_JSON: ${{ inputs.rust-plan }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.99.1"
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        if: ${{ github.event_name == 'pull_request' }}
        with:
          wild-version: "0.9.0"
      - uses: ./.github/actions/setup-rust-sticky-cache
        if: ${{ github.event_name == 'pull_request' }}
        with:
          key: nextest-ci
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/cache-vp-bootstrap
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: latest
          node-version-file: "package.json"
          cache: true
          cache-save: false
          run-install: true
      - uses: taiki-e/install-action@184183c2401be73c3bf42c2e61268aa5855379c1 # v2
        with:
          tool: cargo-nextest@0.9.146
      - name: Test complete Inspector production and descriptor oracles
        if: ${{ matrix.cohort == 'cli-and-integrations' && contains(fromJSON(inputs.rust-plan).packages, 'vize') }}
        run: >-
          node --test tests/tooling/inspector-production-mode.test.ts
          tests/tooling/inspector-ssr-css-vars.test.ts
      - name: Select Rust runtime envelope
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) printf 'VIZE_TEST_DISABLE_TSGO=1\n' >> "$GITHUB_ENV" ;;
            merge_group) printf 'VIZE_TEST_REQUIRE_TSGO=1\n' >> "$GITHUB_ENV" ;;
            *) exit 1 ;;
          esac
      - name: Install Pkl CLI
        run: npm install --global @pkl-community/pkl@0.27.2
      - name: Select immutable Rust test archive
        id: rust-archive
        if: ${{ github.event_name == 'merge_group' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: node tools/support/compat/github/rust-archive-download.ts select
      - name: Download immutable Rust test archive
        id: rust-archive-first
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ github.event_name == 'merge_group' }}
        timeout-minutes: 3
        continue-on-error: true
        with:
          artifact-ids: ${{ steps.rust-archive.outputs.id }}
          path: .artifacts/rust-test-archive
          digest-mismatch: error
      - name: Discard partial Rust archive before the single retry
        id: rust-archive-clean
        if: ${{ !cancelled() && steps.rust-archive-first.outcome == 'failure' }}
        env: { RUST_ARCHIVE_FIRST_OUTCOME: "${{ steps.rust-archive-first.outcome }}" }
        run: node tools/support/compat/github/rust-archive-download.ts clean-retry
      - name: Retry immutable Rust test archive once
        id: rust-archive-retry
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !cancelled() && steps.rust-archive-first.outcome == 'failure' && steps.rust-archive-clean.outcome == 'success' }}
        timeout-minutes: 3
        with:
          artifact-ids: ${{ steps.rust-archive.outputs.id }}
          path: .artifacts/rust-test-archive
          digest-mismatch: error
      - name: Require completed immutable archive download
        if: ${{ !cancelled() && github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUST_ARCHIVE_ID: ${{ steps.rust-archive.outputs.id }}
          RUST_ARCHIVE_DIGEST: ${{ steps.rust-archive.outputs.digest }}
          RUST_ARCHIVE_FIRST_OUTCOME: ${{ steps.rust-archive-first.outcome }}
          RUST_ARCHIVE_RETRY_OUTCOME: ${{ steps.rust-archive-retry.outcome }}
        run: node tools/support/compat/github/rust-archive-download.ts verify
      - name: Verify Rust archive identity
        if: ${{ github.event_name == 'merge_group' }}
        run: node tools/support/compat/github/rust-test-archive.mjs verify .artifacts/rust-test-archive/tests.tar.zst .artifacts/rust-test-archive/receipt.json
      - name: Hydrate the required ElementPlus projection fixture
        if: ${{ github.event_name == 'merge_group' && contains(fromJSON(inputs.rust-plan).packages, 'vize_canon') }}
        uses: ./.github/actions/hydrate-pinned-fixture
        with: { fixture: tests/_fixtures/_git/element-plus }
      - name: Prepare required typechecker observations
        if: ${{ github.event_name == 'merge_group' && contains(fromJSON(inputs.rust-plan).packages, 'vize_canon') }}
        run: |
          mkdir -p target/nextest/full/typechecker-fixtures
          printf 'VIZE_TEST_FIX_HISTORY_CAPTURE_DIR=%s\nVIZE_TEST_FIX_HISTORY_ARCHIVE_RECEIPT=%s\n' "$GITHUB_WORKSPACE/target/nextest/full/typechecker-fixtures" "$GITHUB_WORKSPACE/.artifacts/rust-test-archive/receipt.json" >> "$GITHUB_ENV"
      - name: Build and run the affected Rust test cohort
        if: ${{ github.event_name == 'pull_request' }}
        # Preserve affected package feature unification; the shared cohort
        # registry partitions test binaries by their actual product surface.
        run: |
          node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/rust-plan.json", process.env.RUST_PLAN_JSON)'
          evidence="$RUNNER_TEMP/rust-build-evidence"
          node tools/support/compat/github/rust-build-evidence.ts before "$evidence"
          set -o pipefail
          phase_started=$SECONDS
          if node tools/support/compat/github/run-affected-rust.ts "$RUNNER_TEMP/rust-plan.json" cargo nextest run @packages@ --cargo-profile ci --timings --cargo-message-format=json-render-diagnostics --profile "$NEXTEST_PROFILE" -E "$NEXTEST_FILTER" --no-tests=pass | tee "$evidence/cargo.jsonl"; then phase_exit=0; else phase_exit=$?; fi
          mkdir -p "target/nextest/$NEXTEST_PROFILE"
          printf '{"phase":"workspace-cohort","cohort":"%s","elapsed_seconds":%d,"exit_code":%d}\n' "$COHORT" "$((SECONDS - phase_started))" "$phase_exit" > "target/nextest/$NEXTEST_PROFILE/timing.json"
          exit "$phase_exit"
      - name: Preserve actual PR Rust build units and fresh timing HTML
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: node tools/support/compat/github/rust-build-evidence.ts collect "$RUNNER_TEMP/rust-build-evidence"
      - name: Upload PR Rust build evidence
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-build-evidence-${{ matrix.cohort }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/rust-build-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Run Rust test cohort without rebuilding
        if: ${{ github.event_name == 'merge_group' }}
        # Baked env! paths still occur in tests. Extract to the original workspace
        # (checked by the receipt), preserving target/ci and CARGO_BIN_EXE paths.
        # A selected package can have no tests in an enabled feature profile.
        run: |
          # Cargo creates this baked CARGO_TARGET_TMPDIR even when it is empty.
          # Archive transfer preserves files, so restore the directory here.
          mkdir -p target/tmp
          phase_started=$SECONDS
          if cargo nextest run --archive-file .artifacts/rust-test-archive/tests.tar.zst --extract-to "$GITHUB_WORKSPACE" --extract-overwrite --workspace-remap "$GITHUB_WORKSPACE" --profile "$NEXTEST_PROFILE" -E "$NEXTEST_FILTER" --no-tests=pass; then phase_exit=0; else phase_exit=$?; fi
          printf '{"phase":"workspace-cohort","cohort":"%s","elapsed_seconds":%d,"exit_code":%d}\n' "$COHORT" "$((SECONDS - phase_started))" "$phase_exit" > "target/nextest/$NEXTEST_PROFILE/timing.json"
          exit "$phase_exit"
      - name: Verify actual typechecker fixture observations
        if: ${{ !cancelled() && github.event_name == 'merge_group' && contains(fromJSON(inputs.rust-plan).packages, 'vize_canon') }}
        run: vp node tests/differential/typechecker-shards.ts worker target/nextest/full/typechecker-fixtures .artifacts/rust-test-archive/receipt.json target/nextest/full/junit.xml "$COHORT"
      - name: Upload Rust cohort results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-test-cohort-${{ matrix.cohort }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/nextest/${{ env.NEXTEST_PROFILE }}/
          if-no-files-found: error
          retention-days: 7

  rust-source-report:
    name: Rust source report
    permissions: { contents: read, actions: read }
    # A superseded run reports nothing: its required check fails in test-report.
    if: ${{ always() && !contains(needs.*.result, 'cancelled') }}
    needs: [merge-rust-source, merge-rust-differential, pr-rust-build, pr-rust-shard]
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/cache-vp-bootstrap
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: "package.json"
          run-install: false
      - name: Require the complete Rust tier
        env:
          RUN_RUST: ${{ inputs.run-rust }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node tools/support/compat/github/require-rust-tier.ts
      - name: Select latest source-bound Rust workers
        id: rust-workers
        if: ${{ github.event_name == 'merge_group' && inputs.run-rust && needs.pr-rust-shard.result == 'success' && contains(fromJSON(inputs.rust-plan).packages, 'vize_canon') }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: node tools/support/compat/github/select-rust-workers.mjs select target/differential/typechecker/worker-selection.json
      - name: Download every current Rust test cohort
        if: ${{ github.event_name == 'merge_group' && inputs.run-rust && needs.pr-rust-shard.result == 'success' && contains(fromJSON(inputs.rust-plan).packages, 'vize_canon') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.rust-workers.outputs.artifact-ids }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          repository: ${{ github.repository }}
          merge-multiple: false
          digest-mismatch: error
          path: .artifacts/typechecker-workers
      - name: Require all registered typechecker observations
        if: ${{ github.event_name == 'merge_group' && inputs.run-rust && needs.pr-rust-shard.result == 'success' && contains(fromJSON(inputs.rust-plan).packages, 'vize_canon') }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          node tools/support/compat/github/select-rust-workers.mjs verify target/differential/typechecker/worker-selection.json .artifacts/typechecker-workers
          vp node tests/differential/typechecker-shards.ts aggregate .artifacts/typechecker-workers target/differential/typechecker
      - name: Upload typechecker shared corpus evidence
        if: ${{ !cancelled() && github.event_name == 'merge_group' && inputs.run-rust && needs.pr-rust-shard.result == 'success' && contains(fromJSON(inputs.rust-plan).packages, 'vize_canon') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typechecker-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/differential/typechecker/
          if-no-files-found: error
          retention-days: 14
