name: Vue 2 editor diagnostic context

on:
  pull_request:
    paths:
      - .github/workflows/vue2-editor-diagnostic-context.yml
      - .github/scripts/workflows/vue2-editor-diagnostic-context/**
      - tests/snapshots/check/vue-element-admin-legacy-lsp-oracle.ts
      - tests/snapshots/check/vue-element-admin-unmapped-diagnostic-oracle.ts
      - tests/tooling/vue2-rename-context-custody.test.mjs
      - tests/_fixtures/differential/typechecker/vue2-rename-context-custody/**
  workflow_dispatch: {}

permissions: { contents: read }
concurrency:
  group: vue2-editor-context-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  edit-cycles:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /.github/scripts/workflows/shared/
            /.github/scripts/workflows/vue2-editor-diagnostic-context/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: latest
          node-version-file: package.json
          run-install: false
          cache: true
          cache-save: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: vue-parity
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned provider and Vue 2 fixture
        run: . "${{ env.VIZE_CI_FILES }}/install-pinned-provider-and-vue-2-fixture.sh"
      - name: Build exact source CLI with its receipt
        run: . "${{ env.VIZE_CI_FILES }}/build-exact-source-cli-with-its-receipt.sh"
      - name: Verify whole CLI packets and original editor edit cycles
        env:
          VIZE_TEST_BIN: ${{ github.workspace }}/target/ci/vize
          VIZE_LSP_BIN: ${{ github.workspace }}/target/ci/vize
          VIZE_LSP_REQUIRE_SOURCE_BUILD: "1"
          VIZE_LSP_BUILD_RECIPE: cargo build --profile ci -p vize --features legacy
          RAYON_NUM_THREADS: "4"
        run: . "${{ env.VIZE_CI_FILES }}/verify-whole-cli-packets-and-original-editor-edit-cycles.sh"
      - name: Retain complete source-built editor wires
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vue2-editor-context-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            target/ci/vize.differential-build.json
            target/differential/lsp-sessions/
          if-no-files-found: error
          retention-days: 14
