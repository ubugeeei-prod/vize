name: Vue 2 editor diagnostic context

on:
  pull_request:
    paths:
      - .github/workflows/vue2-editor-diagnostic-context.yml
      - tests/snapshots/check/vue-element-admin-legacy-lsp-oracle.ts
      - tests/snapshots/check/vue-element-admin-unmapped-diagnostic-oracle.ts
      - tests/tooling/vue2-rename-context-custody.test.mjs
      - tests/_fixtures/differential/typechecker/vue2-rename-context-custody/**
  workflow_dispatch: {}

permissions: { contents: read }
concurrency:
  group: vue2-editor-context-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  edit-cycles:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: latest
          node-version-file: package.json
          run-install: false
          cache: true
          cache-save: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with: { toolchain: stable }
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with: { wild-version: "0.9.0" }
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: vue-parity
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned provider and Vue 2 fixture
        run: |
          git submodule update --init --depth 1 -- tests/_fixtures/_git/vue-element-admin
          vp install --frozen-lockfile --prefer-offline
      - name: Build exact source CLI with its receipt
        run: |
          cargo build --locked --profile ci -p vize --features legacy
          node tests/differential/build-receipt.ts --legacy
      - name: Verify whole CLI packets and original editor edit cycles
        env:
          VIZE_TEST_BIN: ${{ github.workspace }}/target/ci/vize
          VIZE_LSP_BIN: ${{ github.workspace }}/target/ci/vize
          VIZE_LSP_REQUIRE_SOURCE_BUILD: "1"
          VIZE_LSP_BUILD_RECIPE: cargo build --profile ci -p vize --features legacy
          RAYON_NUM_THREADS: "4"
        run: |
          node --test --test-concurrency=1 \
            tests/tooling/vue2-rename-context-custody.test.mjs \
            tests/snapshots/check/vue-element-admin-legacy-lsp-oracle.ts \
            tests/snapshots/check/vue-element-admin-unmapped-diagnostic-oracle.ts
      - name: Retain complete source-built editor wires
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vue2-editor-context-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            target/ci/vize.differential-build.json
            target/differential/lsp-sessions/
          if-no-files-found: error
          retention-days: 14
