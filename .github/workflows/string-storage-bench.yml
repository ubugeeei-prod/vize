name: Benchmark - String storage

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full ancestor commit SHA
        required: true
        type: string
      head_sha:
        description: Full candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: string-storage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-storage:
    name: String storage (measurement ${{ matrix.repetition }})
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2, 3]
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.base_sha }}
          path: base
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: head/package.json
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      # The cache action's nested local action resolves from the workspace root,
      # and this job checks the repository out under head/.
      - name: Expose the nested target action at the workspace root
        run: mkdir -p .github/actions && cp -R head/.github/actions/{reuse-rust-target,setup-rust-sticky-cache} .github/actions/
      - uses: ./head/.github/actions/setup-rust-sticky-cache
        with:
          key: string-storage
          cache-key-suffix: ${{ matrix.repetition }}
          target-path: head/target
      - name: Validate exact commits and use identical benchmark harness
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: node head/tools/benchmarks/scripts/string-storage.ts prepare
      - name: Check candidate CF semantics and lints
        working-directory: head
        run: |
          cargo test --profile ci -p vize_croquis_cf
          cargo clippy -p vize_croquis_cf --lib --tests -- -D warnings
      - name: Compare controlled production storage and traversal
        run: node head/tools/benchmarks/scripts/string-storage.ts measure
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: string-storage-${{ matrix.repetition }}
          path: |
            reports/
            head/target/base/criterion/
            head/target/head/criterion/
          if-no-files-found: error
          retention-days: 14
