name: String Storage Bench

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full ancestor commit SHA
        required: true
        type: string
      head_sha:
        description: Full candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: string-storage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-storage:
    name: String storage (measurement ${{ matrix.repetition }})
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2, 3]
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.head_sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.base_sha }}
          path: base
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203 # v0.9.0
        with:
          wild-version: "0.9.0"
      # The cache action's nested local action resolves from the workspace root,
      # and this job checks the repository out under head/.
      - name: Expose the nested target action at the workspace root
        run: mkdir -p .github/actions && cp -R head/.github/actions/reuse-rust-target .github/actions/
      - uses: ./head/.github/actions/setup-rust-sticky-cache
        with:
          key: string-storage
          cache-key-suffix: ${{ matrix.repetition }}
          target-path: head/target
      - name: Validate exact commits and use identical benchmark harness
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" == "$DISPATCH_SHA" ]]
          [[ "$(git -C base rev-parse HEAD)" == "$BASE_SHA" ]]
          [[ "$(git -C head rev-parse HEAD)" == "$HEAD_SHA" ]]
          git -C head merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
          mkdir -p reports
          printf '%s\n' "$BASE_SHA" > reports/base-sha.txt
          printf '%s\n' "$HEAD_SHA" > reports/head-sha.txt
          cp head/crates/vize_croquis_cf/benches/{cross_file,string_storage}.rs base/crates/vize_croquis_cf/benches/
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const path = 'base/crates/vize_croquis_cf/Cargo.toml';
          const source = fs.readFileSync(path, 'utf8');
          const dependency = 'davinci_harness.workspace = true';
          if (!source.includes(dependency))
            fs.writeFileSync(path, source.replaceAll('[dev-dependencies]', `[dev-dependencies]\n${dependency}`));
          JS
      - name: Check candidate CF semantics and lints
        working-directory: head
        run: |
          cargo test --profile ci -p vize_croquis_cf
          cargo clippy -p vize_croquis_cf --lib --tests -- -D warnings
      - name: Compare controlled production storage and traversal
        run: |
          set -euo pipefail
          for side in base head; do
            rm -rf "$GITHUB_WORKSPACE/head/target/$side/criterion"
            (cd "$side" && CRITERION_HOME="$GITHUB_WORKSPACE/head/target/$side/criterion" STRING_STORAGE_REPORT_DIR="$GITHUB_WORKSPACE/reports/$side" cargo bench -p vize_croquis_cf --bench cross_file --target-dir "$GITHUB_WORKSPACE/head/target/$side" -- string_storage --warm-up-time 0.5 --measurement-time 1 --sample-size 30 --save-baseline "$side")
          done
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          for (const name of fs.readdirSync('reports/base')) {
            if (!/^tree_.*\.json$/.test(name)) continue;
            assert.deepEqual(read(`reports/base/${name}`).semantic, read(`reports/head/${name}`).semantic, name);
          }
          for (const side of ['base', 'head']) {
            const root = `head/target/${side}/criterion`;
            const estimates = fs
              .readdirSync(root, { recursive: true })
              .map(String)
              .filter((file) => `/${file}`.endsWith(`/${side}/estimates.json`))
              .map((file) => path.join(root, file));
            assert.equal(estimates.length, 8, `${side}: ${estimates.length}`);
            for (const estimate of estimates) {
              assert.ok(read(estimate).median.point_estimate > 0, estimate);
              assert.ok(fs.statSync(path.join(path.dirname(estimate), 'sample.json')).isFile(), estimate);
            }
          }
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: string-storage-${{ matrix.repetition }}
          path: |
            reports/
            head/target/base/criterion/
            head/target/head/criterion/
          if-no-files-found: error
          retention-days: 14
