name: Level HTML content model

# P4-11a parser oracle: the checker's committed parser-family verdicts
# (crates/vize_patina/tests/html_content_model/checker-verdicts.tsv, kept
# current by `cargo test -p vize_patina --test integration html_content_model_differential::`
# in the Check workflow) must agree exactly with Chromium's HTML parser.
# Charter #36: the checker's walk and verdict rule are sound for every context
# a truncated chain describes. Kani verifies the shipped kernel in the Davinci
# Kani workflow (crates/vize_patina/src/html_content_model/kani.rs).

on:
  push:
    branches: [main, davinci]
    paths:
      - "crates/vize_patina/src/html_content_model/**"
      - "crates/vize_patina/tests/html_content_model/**"
      - "tools/support/compat/davinci/html-content-model-oracle.ts"
      - ".github/workflows/level-html-content-model.yml"
      - .github/scripts/workflows/level-html-content-model/**
      - tools/config/pkl/parts/level-html-content-model/**
  pull_request:
    paths:
      - .github/actions/install-playwright-browsers/**
      - .github/scripts/workflows/level-html-content-model/**
      - .github/workflows/level-html-content-model.yml
      - Cargo.lock
      - Cargo.toml
      - crates/vize_armature/**
      - crates/vize_armature/src/parser/**
      - crates/vize_armature/tests/_fixtures/first_newline_parser_*
      - crates/vize_armature/tests/_fixtures/tokenizer_parser_*.bin
      - crates/vize_atelier_sfc/src/vite_plugin/css_scope.rs
      - crates/vize_atelier_sfc/src/vite_plugin/css_scope/**
      - crates/vize_atelier_sfc/tests/fixtures/scoped_nesting_specificity.json
      - crates/vize_atelier_sfc/tests/scoped_nesting_specificity.rs
      - crates/vize_atelier_vapor/src/lower/element/template.rs
      - crates/vize_atelier_vapor/src/lower/element/template/**
      - crates/vize_relief/**
      - davinci/vize_l0/**
      - davinci/vize_l1/**
      - davinci/vize_l1_to_l2/src/lower/**
      - davinci/vize_l1_to_l2/tests/pre_textarea_first_newline.rs
      - davinci/vize_l1_to_l2/tests/text_pass.rs
      - davinci/vize_l1_to_l2/tests/text_singleton.rs
      - package.json
      - pnpm-lock.yaml
      - tests/_fixtures/differential/compiler/first-newline-runtime.manifest.json
      - tests/_fixtures/differential/compiler/manifest.json
      - tests/_fixtures/differential/compiler/pre-textarea-first-newline/**
      - tests/_fixtures/differential/compiler/scoped-list-nesting-10606/**
      - tests/package.json
      - tests/tooling/davinci-document-body-elements.test.ts
      - tests/tooling/davinci-document-disclosure-elements.test.ts
      - tests/tooling/davinci-document-embedded-fallback.test.ts
      - tests/tooling/davinci-document-foreign-content.test.ts
      - tests/tooling/davinci-document-phrasing.test.ts
      - tests/tooling/davinci-document-select.test.ts
      - tests/tooling/davinci-document-special-text.test.ts
      - tests/tooling/pre-textarea-first-newline.test.mjs
      - tests/tooling/scoped-nesting-specificity.test.mjs
      - tests/tooling/support/first-newline-vapor-oracle.mjs
      - tools/config/pkl/parts/level-html-content-model/**
  workflow_dispatch:

concurrency:
  group: level-html-content-model-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      special-text: ${{ steps.filter.outputs.special-text }}
      first-newline: ${{ steps.filter.outputs.first-newline }}
      scoped-cascade: ${{ steps.filter.outputs.scoped-cascade }}
    steps:
      - name: Select the oracles whose inputs changed
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706
        with:
          filters: |-
            special-text:
              - '.github/actions/install-playwright-browsers/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'davinci/vize_l0/**'
              - 'davinci/vize_l1/**'
              - 'crates/vize_armature/**'
              - 'crates/vize_relief/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tests/package.json'
              - 'tests/tooling/davinci-document-body-elements.test.ts'
              - 'tests/tooling/davinci-document-disclosure-elements.test.ts'
              - 'tests/tooling/davinci-document-embedded-fallback.test.ts'
              - 'tests/tooling/davinci-document-foreign-content.test.ts'
              - 'tests/tooling/davinci-document-phrasing.test.ts'
              - 'tests/tooling/davinci-document-select.test.ts'
              - 'tests/tooling/davinci-document-special-text.test.ts'
              - '.github/workflows/level-html-content-model.yml'
              - '.github/scripts/workflows/level-html-content-model/**'
              - 'tools/config/pkl/parts/level-html-content-model/**'
            first-newline:
              - 'crates/vize_armature/src/parser/**'
              - 'crates/vize_armature/tests/_fixtures/first_newline_parser_*'
              - 'crates/vize_armature/tests/_fixtures/tokenizer_parser_*.bin'
              - 'crates/vize_atelier_vapor/src/lower/element/template.rs'
              - 'crates/vize_atelier_vapor/src/lower/element/template/**'
              - 'davinci/vize_l1_to_l2/src/lower/**'
              - 'davinci/vize_l1_to_l2/tests/pre_textarea_first_newline.rs'
              - 'davinci/vize_l1_to_l2/tests/text_pass.rs'
              - 'davinci/vize_l1_to_l2/tests/text_singleton.rs'
              - 'tests/tooling/pre-textarea-first-newline.test.mjs'
              - 'tests/tooling/support/first-newline-vapor-oracle.mjs'
              - 'tests/_fixtures/differential/compiler/pre-textarea-first-newline/**'
              - 'tests/_fixtures/differential/compiler/first-newline-runtime.manifest.json'
              - 'tests/_fixtures/differential/compiler/manifest.json'
              - '.github/workflows/level-html-content-model.yml'
              - '.github/scripts/workflows/level-html-content-model/**'
              - 'tools/config/pkl/parts/level-html-content-model/**'
            scoped-cascade:
              - 'crates/vize_atelier_sfc/src/vite_plugin/css_scope.rs'
              - 'crates/vize_atelier_sfc/src/vite_plugin/css_scope/**'
              - 'crates/vize_atelier_sfc/tests/scoped_nesting_specificity.rs'
              - 'crates/vize_atelier_sfc/tests/fixtures/scoped_nesting_specificity.json'
              - 'tests/tooling/scoped-nesting-specificity.test.mjs'
              - 'tests/_fixtures/differential/compiler/scoped-list-nesting-10606/**'
              - '.github/workflows/level-html-content-model.yml'
              - '.github/scripts/workflows/level-html-content-model/**'
              - 'tools/config/pkl/parts/level-html-content-model/**'
  chromium-oracle:
    name: HTML content-model parser oracle (Chromium)
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version-file: package.json
          run-install: false
      - name: Install JS dependencies
        run: vp install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/setup-ubuntu-archive
      - name: Install Chromium
        working-directory: tests
        run: vize-ci-apt-retry vp exec playwright install --with-deps chromium
      - name: Compare checker verdicts with Chromium's parser
        run: node tools/support/compat/davinci/html-content-model-oracle.ts --engine chromium
  special-text:
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.special-text == 'true') }}
    needs: changes
    name: Chromium, legacy and native packets
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /tools/ci/lib/scripts/
            /.github/scripts/workflows/level-html-content-model/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.100.0
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with:
          wild-version: 0.9.0
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: l1-document-special-text
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          version: latest
          node-version-file: package.json
          run-install: false
          cache: true
          cache-save: false
      - run: vp install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/install-playwright-browsers
        with:
          workspace: ./tests
      - name: Compare the original packet with native and legacy Rust
        run: . "${{ env.VIZE_CI_FILES }}/special-text-compare-the-original-packet-with-native-and-legacy-rust.sh"
      - name: Compare the original packet with Chromium
        run: . "${{ env.VIZE_CI_FILES }}/special-text-compare-the-original-packet-with-chromium.sh"
  first-newline:
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.first-newline == 'true') }}
    needs: changes
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      VIZE_CI_FILES: ${{ github.workspace }}/.github/scripts/workflows/level-html-content-model
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.100.0
      - uses: ./.github/actions/setup-wild-http-recovery
        with:
          wild-version: 0.9.0
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: first-newline
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa
        with:
          node-version-file: package.json
          run-install: true
      - uses: ./.github/actions/setup-ubuntu-archive
      - name: Install Chromium
        run: vize-ci-apt-retry vp exec --filter './tests' -- playwright install --with-deps chromium
      - name: Build the actual CLI and run source-bound browser observations
        env:
          VIZE_FIRST_NEWLINE_BIN: ${{ github.workspace }}/target/ci/vize
          VIZE_FIRST_NEWLINE_CAPTURE: ${{ runner.temp }}/first-newline-observations.json
        run: . "${{ env.VIZE_CI_FILES }}/first-newline-build-the-actual-cli-and-run-source-bound-browser-observations.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: first-newline-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/first-newline-source.txt
            ${{ runner.temp }}/first-newline-observations.json
            ${{ runner.temp }}/first-newline-tokenizer-*
          if-no-files-found: error
          retention-days: 7
  scoped-cascade:
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.scoped-cascade == 'true') }}
    needs: changes
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - name: Check out the workflow's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          path: .vize-workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/actions/stage-workflow-scripts/
            /tools/ci/lib/scripts/
            /.github/scripts/workflows/level-html-content-model/
      - name: Stage scripts outside the source checkout
        uses: ./.vize-workflow-tools/.github/actions/stage-workflow-scripts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - uses: wild-linker/action@0bbbfa5df4380cab8e63cb8505a1ce65e1d10203
        with:
          wild-version: 0.9.0
      - uses: ./.github/actions/setup-rust-sticky-cache
        with:
          key: scoped-nesting-specificity
          cache-key-suffix: ${{ runner.os }}-${{ runner.arch }}
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af
        with:
          version: latest
          node-version-file: package.json
          run-install: false
          cache: true
          cache-save: false
      - run: vp install --frozen-lockfile --prefer-offline
      - uses: ./.github/actions/install-playwright-browsers
        with:
          workspace: ./tests
      - name: Compile current source and retain all prior scoped CSS oracles
        env:
          VIZE_SCOPED_NESTING_CAPTURE: ${{ runner.temp }}/scoped-nesting-modules.json
        run: . "${{ env.VIZE_CI_FILES }}/scoped-nesting-compile-current-source-and-retain-all-prior-scoped-css-oracles.sh"
      - name: Verify complete scoped CSS and real Chromium cascade and pixels
        env:
          VIZE_SCOPED_NESTING_CAPTURE: ${{ runner.temp }}/scoped-nesting-modules.json
          VIZE_SCOPED_NESTING_REQUIRE_SOURCE: "1"
          VIZE_SCOPED_NESTING_RUNTIME_CAPTURE: ${{ runner.temp }}/scoped-nesting-runtime.json
        run: vp node --test tests/tooling/scoped-nesting-specificity.test.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: scoped-nesting-${{ env.HEAD_SHA }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/scoped-nesting-modules.json
            ${{ runner.temp }}/scoped-nesting-runtime.json
          if-no-files-found: error
          retention-days: 14
