# vize_fuzz is an isolated workspace dedicated to libFuzzer harnesses
# driven by cargo-fuzz. Keeping it out of the root workspace avoids:
# - Forcing every workspace build to pull in libfuzzer-sys (nightly only).
# - Mixing a stable-pinned root toolchain with the nightly toolchain
#   cargo-fuzz requires for libfuzzer.
#
# Run with: `cargo +nightly fuzz run <target>` from the tests/fuzz/ directory.
# Targets are bootstrapped from `corpus/<target>/` (seeded from
# repository fixtures by `tools/fuzz/seed_corpus.mjs`).
[package]
name = "vize_fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
oxc_allocator = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }
oxc_parser = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }
oxc_span = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }
vize_armature = { path = "../../crates/vize_armature" }
vize_atelier_core = { path = "../../crates/vize_atelier_core" }
vize_atelier_sfc = { path = "../../crates/vize_atelier_sfc", default-features = false, features = [
  "native",
] }
vize_atelier_dom = { path = "../../crates/vize_atelier_dom" }
vize_davinci = { path = "../../crates/vize_davinci" }
vize_s0 = { package = "vize_carton", path = "../../crates/vize_carton" }
vize_s1 = { path = "../../crates/vize_s1" }
vize_s1_to_s2 = { package = "vize_ricalco", path = "../../crates/vize_ricalco" }
vize_s2 = { path = "../../crates/vize_disegno" }

[[bin]]
name = "sfc_parse"
path = "fuzz_targets/sfc_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "template_lexer"
path = "fuzz_targets/template_lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "js_ts_expression"
path = "fuzz_targets/js_ts_expression.rs"
test = false
doc = false
bench = false

[[bin]]
name = "css_parse"
path = "fuzz_targets/css_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "template_compile"
path = "fuzz_targets/template_compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "s1_lowering"
path = "fuzz_targets/s1_lowering.rs"
test = false
doc = false
bench = false

[[bin]]
name = "folio_parse"
path = "fuzz_targets/folio_parse.rs"
test = false
doc = false
bench = false

# Isolated workspace — does NOT inherit from the repository root workspace.
[workspace]
