[package]
name = "vize_l2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "L2 - the Davinci semantic IR (codename Disegno): the neutral op family every input dialect lowers into"
metadata.vize.stability = "experimental"

[features]
# Build position indexes on explicit demand in resident analysis tools.
position-index = []
# Attach selected framework facts to the same original File.
observed-queries = []

[dependencies]
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }
oxc_syntax = { workspace = true }
vize_l0 = { workspace = true }
vize_l1.workspace = true

[[test]]
name = "file_program_unwind_alloc"
# Separate fresh modes exclude libtest and the unwind runtime's own allocation.
harness = false

[dev-dependencies]
davinci_test_support.workspace = true
serde_json.workspace = true
vize_armature.workspace = true
vize_croquis.workspace = true
vize_relief.workspace = true

[[example]]
name = "position_index_profile"
required-features = ["position-index"]

[lints]
workspace = true
