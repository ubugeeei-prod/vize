[package]
name = "vize_l2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "L2 - the Davinci semantic IR (codename Disegno): the neutral op family every input dialect lowers into"
metadata.vize.stability = "experimental"

[features]
# Lexical scopes for direct arrow initializers, selected on an original script input.
lexical-arrow-initializers = []
# Original listener operations and method-reference queries for explicit tool requests.
component-listener-queries = ["setup-component-imports"]
scss-rules = ["vize_l1/observed-styles"]
# Read authored props in source order from each resolved component operation.
component-prop-queries = ["setup-component-imports"]
setup-component-imports = []
# Traverse sealed markup preorder without entering leaf regions or recursing for a tail child.
sparse-region-walk = []
# Prepare input-neutral modules for explicit analysis and projection.
module-ir = ["vize_l1/module-ir"]
# Retain original callee and literal ranges for explicit component checks.
component-sites = ["module-ir", "vize_l1/component-sites"]
# Build position indexes on explicit demand in resident analysis tools.
position-index = []
# Read the sealed occurrence tables for all admitted template expressions.
expression-queries = []
# Observe expression roles and lexical scopes at their original resolution factories.
template-operand-queries = ["expression-queries"]
# Attach selected framework facts to the same original File.
observed-queries = []
# Read a descriptor’s retained L1 Programs when producing Vue facts.
script-queries = ["observed-queries", "vize_l1/script-queries"]
# Compute compiler static facts and tooling complexity in a single requested traversal.
composed-template-analysis = []
# Direct declaration names of one original script, including destructuring.
script-declaration-queries = ["vize_l1/authored-script-queries"]

[dependencies]
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }
oxc_syntax = { workspace = true }
vize_l0 = { workspace = true }
vize_l1.workspace = true

[[test]]
name = "file_program_unwind_alloc"
# Separate fresh modes exclude libtest and the unwind runtime's own allocation.
harness = false

[dev-dependencies]
davinci_test_support.workspace = true
serde_json.workspace = true
vize_armature.workspace = true
vize_croquis.workspace = true
vize_relief.workspace = true

[[example]]
name = "position_index_profile"
required-features = ["position-index"]

[lints]
workspace = true
