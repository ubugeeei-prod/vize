[package]
name = "vize-contract-typed-expression-echo-guest"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
vize_guest = { path = "../../../../vize_guest", features = ["typed-expression"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

