# Compiled against the frozen SDK/WIT 0.1.2, independently of the current SDK.
[package]
name = "vize-contract-legacy-expression-guest"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
vize_extension_sdk = { path = "../../fixtures/sdk-0.1.2" }
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros", "realloc"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[workspace]
