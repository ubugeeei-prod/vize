# Standalone manifest for the frozen 0.1.2 SDK source; no current SDK edge.
[package]
name = "vize_extension_sdk"
version = "0.428.1"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
publish = false

[features]
default = ["runtime"]
runtime = ["dep:dlmalloc"]

[dependencies]
dlmalloc = { version = "=0.2.14", features = ["global"], optional = true }
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros", "realloc"] }

[workspace]
