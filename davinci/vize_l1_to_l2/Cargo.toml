# L1→L2 — the Vue lowering (codename Ricalco, Davinci P2-8).
#
# A ricalco is the tracing that transfers a drawing onto a new surface.
# This crate is that act for Davinci: it traces the lossless Vue surface
# tree (L1, vize_l1) into the neutral semantic op family (L2,
# vize_l2); Ricalco remains the codename. This is a total function
# that yields ops or diagnostics, never
# a panic and never a partial-then-abandoned state.
#
# The home decision (recorded in the P2-8 record): a conversion crate
# depending on both stages, the MLIR conversion-library shape, so L2
# never depends on the Vue L1 surface and L1 never learns about L2.
[package]
name = "vize_l1_to_l2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "L1-to-L2 - the Davinci Vue template lowering (codename Ricalco, P2-8)"
autotests = false
metadata.vize.stability = "experimental"

[features]
# Native L1/L2 views for explicit layered graph consumers.
ir-views = ["vize_l1/ir-views", "vize_l2/ir-views"]
# Retain the original L1 syntax alongside both observed L2 analyses.
original-template-queries = ["observed-template-passes", "vize_l1/independent-template-block"]
# Share compiler and lint template analyses on an explicitly selected L2 owner.
observed-template-passes = ["vize_l0/streamed-pass-groups", "vize_l2/composed-template-analysis"]
# Admit Vue 3.4+ same-name binds with an authored identifier operand.
authored-bind-shorthand = []
# Read authored props in source order from each resolved component operation.
component-prop-queries = ["setup-component-imports", "vize_l2/component-prop-queries"]
original-style-bindings = ["vize_l1/original-style-bindings"]
setup-component-imports = ["vize_l2/setup-component-imports"]
native-navigation-products = []
template-operand-queries = ["vize_l2/template-operand-queries"]
# Retain the source Program alongside its canonical region lowering.
retained-tsrx = []
# Prepare input-neutral modules for explicit analysis and projection.
module-ir = ["vize_l2/module-ir"]
# Retain original callee and literal ranges for explicit component checks.
component-sites = ["module-ir", "vize_l2/component-sites"]
# Separate production attribution executable only; absent from timed builds.
davinci-benchmark-profile = []
# Arms the corpus-runnable TS-20 lane (`tests/davinci_lowering_corpus.rs`),
# the P1-6/P1-7 differential-lane shape: committed battery with pinned
# counts, plus `VIZE_DAVINCI_DIFFERENTIAL_CORPUS=<dir>` widening.
legacy-differential = []
# Deprecated published feature spelling; keep as a compatibility alias.
davinci-differential = ["legacy-differential"]

[dependencies]
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_parser = { workspace = true }
oxc_semantic = { workspace = true }
oxc_span = { workspace = true }
oxc_syntax = { workspace = true, features = ["to_js_string"] }
smallvec = { workspace = true }
vize_l0 = { workspace = true }
vize_l1 = { workspace = true }
vize_l2 = { workspace = true }

[dev-dependencies]
vize_l2 = { workspace = true, features = ["composed-template-analysis"] }
serde_json = { workspace = true }
vize_carton.workspace = true
criterion = { workspace = true }
davinci_harness = { workspace = true }
davinci_test_support.workspace = true
insta = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
vize_atelier_core = { workspace = true }
vize_atelier_sfc = { workspace = true }
vize_atelier_dom = { workspace = true, features = ["legacy-differential"] }
vize_croquis = { workspace = true }
vize_l4 = { workspace = true, features = ["legacy-differential"] }

[[bench]]
name = "davinci_storage"
harness = false

[[test]]
name = "davinci_lowering_corpus"
required-features = ["legacy-differential"]

[[test]]
name = "davinci_pug_corpus"
required-features = ["legacy-differential"]

[[test]]
name = "davinci_dom_corpus"
required-features = ["legacy-differential"]

[[test]]
name = "davinci_dom_corpus_prefixed"
required-features = ["legacy-differential"]

[[test]]
name = "davinci_dom_corpus_bindings"
required-features = ["legacy-differential"]

[[test]]
name = "davinci_dom_n8n_diagnosed"
required-features = ["legacy-differential"]

[[test]]
name = "davinci_dom_n8n_default_loops"
required-features = ["legacy-differential"]

[[test]]
name = "davinci_dom_n8n_helper_props"
required-features = ["legacy-differential"]

[[test]]
name = "davinci_dom_n8n_if_key_modes"
required-features = ["legacy-differential"]

[[test]]
name = "davinci_remarks_corpus"
required-features = ["legacy-differential"]

# Ordinary integration tests link as one binary; see tests/main.rs.
[[test]]
name = "integration"
path = "tests/main.rs"

# TS-21 and TS-34 keep their own targets; the corpus shard lanes run them by name.
[[test]]
name = "metamorphic"
path = "tests/metamorphic/main.rs"

[[test]]
name = "composed_template_alloc"
harness = false

[[test]]
name = "expression_queries"
path = "tests/expression_queries/main.rs"
required-features = ["vize_l2/expression-queries", "vize_l2/position-index"]

[[test]]
name = "expression_query_alloc"
path = "tests/expression_queries/alloc.rs"
harness = false
required-features = ["vize_l2/expression-queries", "vize_l2/position-index"]

[[test]]
name = "cfg_complexity_oracle"
path = "tests/cfg_complexity_oracle/main.rs"

[lints]
workspace = true

[[test]]
name = "observed_template_passes"
required-features = ["observed-template-passes"]

[[test]]
name = "original_template_queries"
required-features = ["original-template-queries"]
