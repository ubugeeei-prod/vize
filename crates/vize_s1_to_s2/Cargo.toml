# S1→S2 — the Vue lowering (codename Ricalco, Davinci P2-8).
#
# A ricalco is the tracing that transfers a drawing onto a new surface.
# This crate is that act for Davinci: it traces the lossless Vue surface
# tree (S1, vize_s1) into the neutral semantic op family (S2,
# vize_s2); Ricalco remains the codename. This is a total function
# that yields ops or diagnostics, never
# a panic and never a partial-then-abandoned state.
#
# The home decision (recorded in the P2-8 record): a conversion crate
# depending on both stages, the MLIR conversion-library shape, so S2
# never depends on the Vue S1 surface and S1 never learns about S2.
[package]
name = "vize_s1_to_s2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "S1-to-S2 - the Davinci Vue template lowering (codename Ricalco, P2-8)"
publish = false
metadata.vize.stability = "experimental"

[features]
# Arms the corpus-runnable TS-20 lane (`tests/davinci_lowering_corpus.rs`),
# the P1-6/P1-7 differential-lane shape: committed battery with pinned
# counts, plus `VIZE_DAVINCI_DIFFERENTIAL_CORPUS=<dir>` widening.
davinci-differential = []

[dependencies]
htmlize = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_parser = { workspace = true }
oxc_semantic = { workspace = true }
oxc_span = { workspace = true }
vize_s0 = { workspace = true }
vize_davinci = { workspace = true }
vize_s1 = { workspace = true }
vize_s2 = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
davinci_harness = { workspace = true }
davinci_test_support.workspace = true
insta = { workspace = true }
vize_atelier_sfc = { workspace = true }
vize_atelier_dom = { workspace = true }
vize_croquis = { workspace = true }

[[bench]]
name = "davinci_storage"
harness = false

[[test]]
name = "davinci_lowering_corpus"
required-features = ["davinci-differential"]

[[test]]
name = "davinci_dom_corpus"
required-features = ["davinci-differential"]
