# Ricalco — the S1→S2 Vue lowering (Davinci P2-8).
#
# A ricalco is the tracing that transfers a drawing onto a new surface.
# This crate is that act for Davinci: it traces the lossless Vue surface
# tree (S1, vize_sinopia) into the neutral semantic op family (S2,
# vize_disegno) — a total function that yields ops or diagnostics, never
# a panic and never a partial-then-abandoned state.
#
# The home decision (recorded in the P2-8 record): a conversion crate
# depending on both stages, the MLIR conversion-library shape, so S2
# never depends on the Vue S1 surface and S1 never learns about S2.
[package]
name = "vize_ricalco"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Ricalco - the Davinci S1-to-S2 Vue template lowering (P2-8)"
publish = false
metadata.vize.stability = "experimental"

[features]
# Arms the corpus-runnable TS-20 lane (`tests/davinci_lowering_corpus.rs`),
# the P1-6/P1-7 differential-lane shape: committed battery with pinned
# counts, plus `VIZE_DAVINCI_DIFFERENTIAL_CORPUS=<dir>` widening.
davinci-differential = []
# The P2-9 series-7 legacy port: the Vue 2 template-sugar desugars
# mirrored at lowering (`lower::legacy`), the `vue.filter` dialect op,
# and the legacy pass (`pass::legacy`). Off by default and zero-cost
# when off: every module, hook, field and pipeline entry is cfg-gated,
# so the default build compiles none of it (the plain `TRANSFORM`
# pipeline and `lower` entry are byte-identical in both shapes).
# Forwards only to `vize_disegno/_legacy` (the op vocabulary). The
# dialect capability view is a documented **mirror** of
# `vize_armature::legacy` (`lower::legacy::LegacyVueLine`) rather than a
# dependency: `vize_armature/legacy` forwards to `vize_relief/_legacy`,
# whose cfg-gated AST fields would break every workspace-unified build
# of a crate that constructs relief nodes without its own mirror feature
# (the `vize_atelier_jsx/legacy` hazard its manifest documents). The
# mirror is pinned field-for-field against the armature model by the
# legacy differential witness, and the exit gate deletes the legacy copy
# — the installment-2 splitter precedent.
_legacy = ["vize_disegno/_legacy"]

[dependencies]
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
vize_carton = { workspace = true }
vize_davinci = { workspace = true }
vize_disegno = { workspace = true }
vize_sinopia = { workspace = true }

[dev-dependencies]
insta = { workspace = true }

[[test]]
name = "davinci_lowering_corpus"
required-features = ["davinci-differential"]

[[test]]
name = "legacy_pass"
required-features = ["_legacy"]

[[test]]
name = "legacy_pass_sugar"
required-features = ["_legacy"]

[[test]]
name = "legacy_pass_snapshot"
required-features = ["_legacy"]
