[package]
name = "vize_carton"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Carton - The artist's toolbox for Vize compiler"
metadata.vize.stability = "alpha-supported"

[dependencies]
# Arena allocator: one pool per compile, backing both the template containers
# and the retained-AST parses (Davinci P1-10 collapsed the P1-1 two-pool handle).
oxc_allocator = { workspace = true }
# Identifier classification for the expression guard's `\uXXXX` escape decoding.
oxc_syntax = { workspace = true }
compact_str = { workspace = true }

# Utilities
bitflags = { workspace = true }
phf = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
once_cell = { workspace = true }
smallvec = { workspace = true }
stacker = { workspace = true }
xxhash-rust = { workspace = true }
pklrust = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
which = { workspace = true }

[features]
default = []

[dev-dependencies]
davinci_test_support.workspace = true
insta.workspace = true
tempfile.workspace = true
