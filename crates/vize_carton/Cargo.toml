[package]
name = "vize_carton"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Carton - The artist's toolbox for Vize compiler"
metadata.vize.stability = "alpha-supported"

[dependencies]
# Arena allocators: bumpalo backs the drop-running template containers,
# oxc_allocator the retained-AST pool (Davinci P1-1; collapses at P1-10).
bumpalo = { workspace = true }
oxc_allocator = { workspace = true }
compact_str = { workspace = true }

# Utilities
bitflags = { workspace = true }
phf = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
once_cell = { workspace = true }
smallvec = { workspace = true }
stacker = { workspace = true }
xxhash-rust = { workspace = true }
pklrust = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
which = { workspace = true }

[features]
default = []

[dev-dependencies]
insta.workspace = true
regex-lite.workspace = true
tempfile.workspace = true
