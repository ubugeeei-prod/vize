[package]
name = "vize_davinci"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Davinci - dump/round-trip substrate (Folio) for the Vize compiler rearchitecture"
metadata.vize.stability = "experimental"

[dependencies]
vize_s0 = { workspace = true }
# Proc-macro: a host build dependency (never linked into any target, so the
# wasm32/no_std claims are untouched) - the approved std edge P2-14 audits.
vize_davinci_derive = { workspace = true }
# Terminal display widths for the diagnostic renderer (no_std).
unicode-width = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
davinci_harness = { workspace = true }
davinci_test_support = { workspace = true }
insta = { workspace = true }
serde_json = { workspace = true }
vize_atelier_core = { workspace = true }
vize_atelier_sfc = { workspace = true }
vize_croquis = { workspace = true }
# TS-43 (`tests/artifact_keys.rs`) keys real S1/S2 artifacts; dev-only, so the
# library's tier-1 edge set (S0 alone) is untouched.
vize_s1 = { workspace = true }
vize_s1_to_s2 = { workspace = true }
vize_s2 = { workspace = true }

[[bin]]
name = "davinci-opt"
path = "src/bin/davinci-opt/main.rs"

[[bench]]
name = "davinci"
harness = false

[[bench]]
name = "davinci_fact"
harness = false
