[package]
name = "vize_l0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "L0 - the Davinci foundation level: ids, side tables, keys, dumps, diagnostics, passes and facts"
metadata.vize.stability = "experimental"
readme = "README.md"

[dependencies]
# Until #6834 carves the storage modules out of carton, L0 re-exports carton's
# public API so every `vize_l0::` path keeps resolving.
vize_carton = { workspace = true }

[features]
default = []
# The neutral extension wire (#6976), still owned by carton.
extension = ["vize_carton/extension"]

[lints]
workspace = true
