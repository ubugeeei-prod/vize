[package]
name = "vize_patina"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Patina - The quality checker for Vize code linting"
metadata.vize.stability = "compatibility-preview"
autotests = false

[features]
# Share the original style structure with checker and editor consumers.
observed-style-rules = ["vize_l1/observed-styles"]
plugin-template-facts = []
# Read configured standalone script rules from a physically matched L1 Program.
authored-script-rules = ["vize_l1/authored-script-queries"]
# Explicit consumers of the same parsed TSRX module and sealed regions.
retained-tsrx = ["vize_l1_to_l2/retained-tsrx"]
# Evaluate canonical markup accessibility rules in one explicit L2 traversal.
canonical-rule-group = ["vize_l2/sparse-region-walk"]
# Arms the TS-25 markup lane (`tests/davinci_markup_differential.rs`): the
# facade's full hook trace over Relief vs over L2, exact, on the committed
# battery plus `VIZE_DAVINCI_DIFFERENTIAL_CORPUS=<dir>` widening.
legacy-differential = []
# Deprecated published feature spelling; keep as a compatibility alias.
davinci-differential = ["legacy-differential"]

[dependencies]
vize_l4 = { workspace = true }
vize_carton.workspace = true
# Internal crates
vize_relief.workspace = true
vize_armature.workspace = true
vize_l0.workspace = true
vize_croquis.workspace = true
vize_atelier_sfc.workspace = true
vize_atelier_jsx.workspace = true
# Davinci stages: the markup facade views L2 (P4-7), reading L1 for the
# authored surface L2 normalizes away. Pug templates lower through the
# same L1→L2 dependency.
vize_l1.workspace = true
# The L2 template-complexity pass behind `vue/max-template-complexity`.
vize_l1_to_l2.workspace = true
vize_l2.workspace = true
# Plugin record batches (`plugin_batch`): effect facts.
vize_l3.workspace = true

# OXC for JS/TS parsing and diagnostics
oxc_allocator.workspace = true
oxc_parser.workspace = true
oxc_semantic.workspace = true
# `serialize` gives `vue/no-restricted-syntax` the ESTree shape its selectors match.
oxc_ast = { workspace = true, features = ["serialize"] }
oxc_estree.workspace = true
oxc_ast_visit.workspace = true
oxc_diagnostics.workspace = true
# The miette that `oxc_diagnostics` renders with; its `Diagnostic` trait lets
# the text report render a sourced diagnostic without building a `Report`.
miette = { package = "oxc-miette", version = "=3.0.1" }
oxc_ecmascript.workspace = true
oxc_span.workspace = true
oxc_syntax.workspace = true

# Lightning CSS for CSS parsing
lightningcss.workspace = true
cssparser.workspace = true

# Error handling
thiserror.workspace = true

# Serialization (for config and output)
serde.workspace = true
serde_json.workspace = true

# Utilities
memchr.workspace = true
regex.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
corsa.workspace = true
rayon.workspace = true
# Type-aware rules read the checker virtual TypeScript document (P4-5c).
# `native` exposes the same tsconfig snapshot `vize check` uses for paths.
vize_canon = { workspace = true, features = ["native"] }

[target.'cfg(all(not(target_arch = "wasm32"), unix))'.dependencies]
libc.workspace = true

[dev-dependencies]
insta.workspace = true
vize_glyph.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion.workspace = true
davinci_harness.workspace = true
davinci_test_support.workspace = true
tempfile.workspace = true

[[bench]]
name = "lint_bench"
harness = false

[[bench]]
name = "markup_ir_bench"
harness = false

[[bench]]
name = "davinci_markup"
harness = false

[[test]]
name = "davinci_markup_differential"
required-features = ["legacy-differential"]

[[test]]
name = "davinci_authored_markup_budget"
harness = false

# The custody-pinned native-phase workflow runs this binary by name.
[[test]]
name = "documented_rule_examples"

# Ordinary integration tests link as one binary; see tests/main.rs.
[[test]]
name = "integration"
path = "tests/main.rs"

[[test]]
name = "prepared_tsrx"
path = "tests/prepared_tsrx/main.rs"
required-features = ["retained-tsrx", "vize_l4/retained-tsrx"]

[lints]
workspace = true

[[test]]
name = "canonical_rule_group"
required-features = ["canonical-rule-group"]

[[test]]
name = "authored_script_rules"
required-features = ["authored-script-rules"]
