[package]
name = "vize_curator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Curator - local inspection and reporting utilities for Vize"
publish = false

[dependencies]
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
vize_atelier_core = { workspace = true }
vize_atelier_sfc = { workspace = true }
vize_l0 = { workspace = true }
vize_croquis = { workspace = true }
vize_croquis_cf = { workspace = true }
# The Spolvero feed shape (P2-18) and the L1 surface tree its inspector
# pages are proven through; both `no_std + alloc`, so the wasm consumer
# (`vize_vitrine --features wasm`) is untouched.
vize_davinci = { workspace = true }
vize_l1 = { workspace = true }
# The full stage ladder (L1 -> L2 -> L3) the Spolvero feed pages, produced by
# the real lowerings and the L2 transform pass manager rather than re-derived,
# and the transform pipeline whose optimization remarks (P3-13) it carries.
vize_l1_to_l2 = { workspace = true }
vize_l2 = { workspace = true }
vize_l2_to_l3 = { workspace = true }
vize_l3 = { workspace = true }

[dev-dependencies]
davinci_test_support.workspace = true
insta.workspace = true

[lints]
workspace = true
