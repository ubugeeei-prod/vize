[package]
name = "vize_musea"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Musea - Component gallery and documentation for Vize Vue components"
metadata.vize.stability = "experimental"

[dependencies]
vize_s0.workspace = true
vize_s1.workspace = true
vize_croquis.workspace = true

serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
insta.workspace = true
criterion.workspace = true
davinci_harness.workspace = true
# Only the retained P4-13 differential oracle (`src/parse/legacy*`, test-only)
# still scans bytes; it leaves with that oracle.
memchr.workspace = true

[[bench]]
name = "art_parse"
harness = false

[[bench]]
name = "davinci_art"
harness = false
