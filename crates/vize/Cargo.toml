[package]
name = "vize"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Vize - High-performance Vue.js toolchain in Rust"
publish = false
autotests = false

[[bin]]
name = "vize"
path = "src/main.rs"

[lib]
name = "vize"
path = "src/lib.rs"

[features]
plugin-template-facts = ["vize_patina/plugin-template-facts"]
inspector-template-products = ["vize_curator/inspector-template-products"]
plugin-project-facts = ["plugin-template-facts", "vize_croquis_cf/observed-template-complexity"]
# Untimed source custody only; never enabled by default or in shipping builds.
cache-custody = ["vize_canon/cache-custody"]
default = ["glyph", "maestro"]
glyph = ["dep:vize_glyph", "vize_maestro?/glyph"]
maestro = ["dep:vize_maestro"]
profiling = ["vize_l0/micro-profiling", "vize_carton/micro-profiling", "vize_canon/profiling"]
# Opt-in legacy Vue (v0 / v1 / v2) support. Off by default so the Vue 3 binary
# never activates or compiles it; turns on the legacy feature across the stack.
legacy = ["vize_atelier_core/legacy", "vize_canon/legacy", "vize_maestro?/legacy"]

[dependencies]
vize_carton = { workspace = true, features = ["lint-glob"] }
unicode-width.workspace = true
# Vize crates (re-exported for unified documentation)
vize_l0 = { workspace = true }
vize_relief = { workspace = true }
vize_armature = { workspace = true }
vize_atelier_core = { workspace = true }
vize_atelier_dom = { workspace = true, features = ["legacy-differential"] }
vize_atelier_vapor = { workspace = true }
vize_atelier_sfc = { workspace = true, features = ["native"] }
vize_glyph = { workspace = true, optional = true }
vize_patina = { workspace = true }
vize_canon = { workspace = true, features = ["native"] }
vize_croquis = { workspace = true }
vize_croquis_cf = { workspace = true }
# Davinci ICE machinery (P2-13): repro folio + pass-manager driver. Both
# crates are publish = false, so this edge stays out of every release graph.
# `vize reduce` (P3-14): the L1 surface tree is the deletion vocabulary and
# the L1->L2 pipeline answers the remark / folio / budget oracles.
vize_l1 = { workspace = true }
vize_l1_to_l2 = { workspace = true }
vize_l4 = { workspace = true, features = ["legacy-differential"] }
vize_l2 = { workspace = true }
vize_l3 = { workspace = true }
vize_doctor = { workspace = true, features = ["application-analysis"] }
vize_fresco = { workspace = true }
vize_musea = { workspace = true }
vize_curator = { workspace = true }
vize_maestro = { workspace = true, optional = true }

# CLI
clap.workspace = true
flate2.workspace = true
tar.workspace = true

# Directory walking with .gitignore support
ignore.workspace = true

# Glob pattern matching
glob.workspace = true
globset.workspace = true
libc.workspace = true

# Multithreading
rayon.workspace = true

# Async helpers (for LSP)
futures.workspace = true

# Serialization (for JSON output)
serde = { workspace = true }
serde_json = { workspace = true }

# TypeScript/JSX transpilation
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_diagnostics = { workspace = true }
oxc_parser = { workspace = true }
oxc_codegen = { workspace = true }
oxc_semantic = { workspace = true }
oxc_span = { workspace = true }
oxc_syntax = { workspace = true }
oxc_transformer = { workspace = true }

# Home/config directory detection
dirs.workspace = true

# Process allocator for native CLI hot paths
mimalloc.workspace = true

# Triple-slash directive scans over declaration files
memchr.workspace = true

# Exclusive same-directory temporary files for atomic source replacement
tempfile.workspace = true
sha2.workspace = true

# Unified diffs for `vize lib diff` / `update`
similar.workspace = true

[dev-dependencies]
davinci_harness.workspace = true
# Compare the experimental selector against the actual CLI fix loop in tests.
vize_l1 = { workspace = true, features = ["diagnostic-edit-selection"] }
corsa.workspace = true
corsa_lsp.workspace = true
davinci_test_support = { workspace = true, features = [
  "vue-fixtures",
  "formatter",
  "reference-path",
] }
insta.workspace = true
lsp-types.workspace = true
url.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# Exercise real linked-installation custody without Developer Mode privileges.
junction = "2"

# One integration binary instead of one link per tests/*.rs file.
[[test]]
name = "integration"
path = "tests/main.rs"

[[example]]
name = "css_engine_vendor_observer"
required-features = ["glyph"]

[lints]
workspace = true

[[test]]
name = "plugin_template_baseline"
path = "tests/plugin_template_baseline/main.rs"

[[test]]
name = "plugin_template_products"
path = "tests/plugin_template_products/main.rs"
required-features = ["plugin-template-facts"]

[[test]]
name = "inspector_template_products"
path = "tests/inspector_template_products/main.rs"
required-features = ["inspector-template-products"]
