[package]
name = "vize_glyph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Glyph - The beautiful letterforms for Vize code formatting"
publish = false

[features]
# Share a formatting result for an observed program and immutable settings.
retained-script = []
# Format a complete document from its original single-template observation.
observed-template = []
# Render a selected original style with the stock block writer.
observed-style = []

[dependencies]
# Internal crates
vize_l0.workspace = true
vize_l1.workspace = true

# OXC dependencies
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_span.workspace = true
oxc_formatter.workspace = true
oxc_formatter_core.workspace = true

# CSS
lightningcss.workspace = true

# Serialization
serde = { workspace = true }
serde_json.workspace = true

# Utilities
thiserror.workspace = true
memchr.workspace = true
unicode-width.workspace = true

[dev-dependencies]
vize_l1 = { workspace = true, features = ["program-snapshot"] }
vize_l2.workspace = true
davinci_test_support = { workspace = true, features = ["formatter"] }
criterion.workspace = true
davinci_harness.workspace = true
insta.workspace = true
serde_json.workspace = true
sha2.workspace = true

[[bench]]
name = "formatter"
harness = false

[[bench]]
name = "formatter_instructions"
harness = false

[[test]]
name = "native_vue2_sfc_diagnostics_drop"
harness = false

[lints]
workspace = true

[[test]]
name = "selected_script_programs"
required-features = ["retained-script", "vize_l2/script-queries"]

[[test]]
name = "observed_style"
required-features = ["observed-style"]
