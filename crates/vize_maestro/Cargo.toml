[package]
name = "vize_maestro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Maestro - Language Server Protocol implementation for Vize Vue templates"
publish = false

[features]
default = ["native", "glyph"]
glyph = ["dep:vize_glyph"]
native = ["vize_canon/native"]
# Explicit native Program projection; existing LSP routing stays independent.
experimental-source-folding = ["dep:vize_l1"]
# Original comments from the genuinely admitted producer-owned SFC/File.
experimental-sfc-folding = ["dep:vize_l1", "dep:vize_l1_to_l2"]
# Optional genuine native edit and original Program observation adapters.
experimental-source-project = ["dep:vize_l1"]
# Opt-in same-file JS/TS/Vue queries from original retained native owners.
experimental-source-navigation = ["experimental-source-project", "dep:vize_l1_to_l2"]
# Opt-in legacy Vue (v0.10 / v0.11 / v1 / v2) editor / LSP surface. Not enabled by the
# default Vue 3 build; turns on the type-checker-side legacy feature too.
legacy = ["vize_canon/legacy"]

[dependencies]
vize_carton = { workspace = true, features = ["lint-glob"] }
# LSP Framework
tower-lsp.workspace = true
# lsp-types is re-exported by tower-lsp, use that version

# Async Runtime
futures.workspace = true
tower.workspace = true
async-trait.workspace = true

# Text Processing
ropey.workspace = true
memchr.workspace = true
htmlize.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Utilities
dashmap.workspace = true
parking_lot.workspace = true
ignore.workspace = true
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_parser.workspace = true
oxc_semantic.workspace = true
oxc_span.workspace = true
oxc_syntax.workspace = true
oxc_diagnostics.workspace = true

# Internal crates
vize_l0 = { workspace = true }
vize_l1 = { workspace = true, optional = true }
vize_l1_to_l2 = { workspace = true, optional = true }
vize_relief.workspace = true
vize_armature.workspace = true
vize_atelier_sfc.workspace = true
vize_atelier_jsx.workspace = true
vize_glyph = { workspace = true, optional = true }
vize_patina.workspace = true
vize_canon = { workspace = true }
vize_croquis.workspace = true
vize_croquis_cf.workspace = true
vize_l2.workspace = true
# The resident tier (Davinci P5-6a): request paths read memoized SFC
# descriptors instead of calling `parse_sfc` per request.
vize_incremental.workspace = true
vize_musea.workspace = true

[target.'cfg(unix)'.dependencies]
# Anchored no-follow descriptor observations; no new dependency version.
libc.workspace = true

[dev-dependencies]
insta.workspace = true
sha2.workspace = true
tempfile.workspace = true

[lints]
workspace = true
