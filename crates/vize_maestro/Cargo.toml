[package]
name = "vize_maestro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Maestro - Language Server Protocol implementation for Vize Vue templates"
publish = false

[features]
experimental-style-lint-products = [
  "experimental-style-module-products",
  "vize_patina/observed-style-rules",
]
# Collect required-prop diagnostics from resolved component operations on explicit requests.
experimental-component-props = ["vize_l1_to_l2/component-prop-queries"]
# Share admitted template operands with Canon for explicitly selected editor products.
experimental-template-operand-products = ["vize_canon/template-operand-projection"]
experimental-style-module-products = ["vize_canon/observed-style-modules"]
default = ["native", "glyph"]
glyph = ["dep:vize_glyph"]
native = ["vize_canon/native", "retained-program"]
# Original Program/File providers; this does not select navigation endpoints.
retained-program = []
# Explicit native Program projection; existing LSP routing stays independent.
experimental-source-folding = []
# Original comments from the genuinely admitted producer-owned SFC/File.
experimental-sfc-folding = []
# Optional genuine native edit and original Program observation adapters.
experimental-source-project = []
experimental-ambient-project = ["native", "vize_canon/ambient-project-declarations"]
# Publish an explicitly selected diagnostic fix batch against its original open revision.
experimental-versioned-fixes = [
  "experimental-source-project",
  "vize_l1/diagnostic-edit-selection",
  "vize_l1/positioned-edits",
]
# Read one explicitly requested block stage from the open editor revision.
experimental-resident-blocks = ["vize_incremental/open-block-queries"]
# Read both the editor outline and import specifiers from each original script.
experimental-script-queries = ["vize_l1/authored-script-queries"]
experimental-declaration-products = [
  "native",
  "vize_canon/authored-declarations",
  "vize_l1/authored-declarations",
]
experimental-checker-script-queries = [
  "experimental-script-queries",
  "vize_canon/authored-script-diagnostics",
]
# Run the requested checker, editor, formatter and configured lint products on one open revision.
experimental-script-tools = [
  "experimental-checker-script-queries",
  "vize_patina/authored-script-rules",
  "vize_glyph/observed-template",
  "glyph",
]
# Opt-in same-file JS/TS/Vue queries from original retained native owners.
experimental-source-navigation = ["experimental-source-project", "retained-program"]
# Explicit definition, references and highlights on the same retained File.
experimental-navigation-products = [
  "experimental-source-navigation",
  "vize_l1_to_l2/native-navigation-products",
]
# Opt-in legacy Vue (v0.10 / v0.11 / v1 / v2) editor / LSP surface. Not enabled by the
# default Vue 3 build; turns on the type-checker-side legacy feature too.
legacy = ["vize_canon/legacy"]
# Opt-in source counters for the bounded snapshot carrier.
micro-profiling = ["vize_l0/micro-profiling"]

[dependencies]
vize_carton = { workspace = true, features = ["lint-glob"] }
# LSP Framework
tower-lsp.workspace = true
# lsp-types is re-exported by tower-lsp, use that version

# Async Runtime
futures.workspace = true
tower.workspace = true
async-trait.workspace = true

# Text Processing
ropey.workspace = true
memchr.workspace = true
htmlize.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Utilities
dirs.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
ignore.workspace = true
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_parser.workspace = true
oxc_semantic.workspace = true
oxc_span.workspace = true
oxc_syntax.workspace = true
oxc_diagnostics.workspace = true

# Internal crates
vize_l0 = { workspace = true }
vize_l1 = { workspace = true }
vize_l1_to_l2.workspace = true
vize_relief.workspace = true
vize_armature.workspace = true
vize_atelier_sfc.workspace = true
vize_atelier_jsx.workspace = true
vize_glyph = { workspace = true, optional = true }
vize_patina.workspace = true
vize_canon = { workspace = true }
vize_croquis.workspace = true
vize_croquis_cf.workspace = true
vize_l2.workspace = true
# The resident tier (Davinci P5-6a): request paths read memoized SFC
# descriptors instead of calling `parse_sfc` per request.
vize_incremental.workspace = true
vize_musea.workspace = true

[target.'cfg(unix)'.dependencies]
# Anchored no-follow descriptor observations; no new dependency version.
libc.workspace = true

[dev-dependencies]
davinci_harness.workspace = true
davinci_test_support = { workspace = true, features = ["vue-fixtures"] }
insta.workspace = true
sha2.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[test]]
name = "versioned_fix_publication"
required-features = ["experimental-versioned-fixes"]

[[test]]
name = "original_template_requests"
required-features = ["vize_l1_to_l2/original-template-queries"]
