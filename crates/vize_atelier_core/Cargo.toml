[package]
name = "vize_atelier_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Atelier Core - The core workshop for Vize Vue template parsing, transform lanes, and code generation"
metadata.vize.stability = "alpha-supported"

[features]
# Opt-in support for legacy Vue lines (v0.10 / v0.11 / v1 / v2). Off by default
# so the Vue 3 `vize` binary never compiles it. Enables dialect-gated legacy
# steps such as Vue 2 pipe filters and the Vue 2 template-sugar pre-step
# (`.sync`, `slot-scope`/`scope`). Forwards to the `legacy` features of the AST
# (`vize_relief`) and dialect-capability (`vize_armature`) crates.
legacy = ["vize_relief/_legacy", "vize_armature/legacy"]

# Arms the Davinci P1-7 differential lane: every retained-AST consumption in
# the atelier transform/codegen sites dual-runs the legacy re-parse and panics
# on divergence. `cfg(test)` arms it for this crate's own unit tests; this
# feature arms it for integration/corpus binaries. Off in production builds.
davinci-differential = []

[dependencies]
vize_carton = { workspace = true }
vize_croquis = { workspace = true }
vize_relief = { workspace = true }
vize_armature = { workspace = true }

memoffset = { workspace = true }
compact_str = { workspace = true }

# OXC
oxc_parser = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_span = { workspace = true }
oxc_allocator = { workspace = true }
oxc_syntax = { workspace = true }
oxc_diagnostics = { workspace = true }
oxc_codegen = { workspace = true }
oxc_semantic = { workspace = true }
oxc_transformer = { workspace = true }

# Utilities
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
davinci_harness = { workspace = true }
davinci_test_support = { workspace = true }
insta = { workspace = true }

# The Davinci S2 lane, test-space only (P2-9): dev-dependencies with no
# version requirement are stripped on publish, which is the carve-out the
# release gate (tests/tooling/moonbit-publish-crates.test.ts) encodes for
# published crates exercising unpublished ones.
vize_davinci = { workspace = true }
vize_s2 = { workspace = true }
vize_s1_to_s2 = { workspace = true }
vize_s1 = { workspace = true }

# The P2-9 corpus-runnable differential entry (the P1-6/P1-7 lane shape):
# compiled only when the lane is armed, and its battery pins are mirrored
# by the plain witness (tests/davinci_s2_transform.rs) so a feature-wiring
# regression fails loudly in both lanes.
[[test]]
name = "davinci_s2_transform_corpus"
required-features = ["davinci-differential"]

# Vue 2 dialect dual-run. The shipped `.sync` / `slot-scope` / filter
# expansion lives behind `legacy`, so this witness cannot ride the
# default workspace test; clippy-and-test invokes it explicitly.
[[test]]
name = "davinci_s2_transform_vue2"
required-features = ["legacy"]

[[bench]]
name = "davinci"
harness = false
