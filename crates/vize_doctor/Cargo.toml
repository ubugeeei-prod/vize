[package]
name = "vize_doctor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Whole-application health analysis contracts for Vize"
metadata.vize.stability = "experimental"

[features]
default = []
application-analysis = ["dep:vize_croquis_cf"]

[dependencies]
globset.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
vize_s0.workspace = true
vize_croquis_cf = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[[bench]]
name = "reporter"
harness = false
