[package]
name = "vize_croquis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Croquis - Semantic analysis layer for Vize. Quick sketches of meaning from Vue templates"
metadata.vize.stability = "compatibility-preview"

[dependencies]
vize_carton.workspace = true
vize_relief.workspace = true
phf.workspace = true
once_cell.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
dashmap.workspace = true
regex.workspace = true
memchr.workspace = true

# OXC for high-performance AST parsing
oxc_parser.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_syntax.workspace = true
oxc_span.workspace = true
oxc_allocator.workspace = true

[features]
# Davinci P1-6 differential lane: dual-runs the retained-AST expression reads
# against the legacy re-parse paths and panics on divergence. Also active
# under cfg(test); zero-cost when off. Deleted with the lane at P1-8.
davinci-differential = []

[dev-dependencies]
davinci_test_support.workspace = true
tempfile.workspace = true
vize_armature.workspace = true
insta.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion.workspace = true
davinci_harness.workspace = true
# Dev-only cycle (vize_atelier_sfc depends on this crate normally); cargo
# permits it, and the davinci bench needs the descriptor-level orchestration.
# Path-only on purpose: the workspace entry pins `version = "=x.y.z"`, which
# survives into the published manifest and would demand a vize_atelier_sfc
# release before this crate. Version-less dev-deps are stripped when packaging.
vize_atelier_sfc = { path = "../vize_atelier_sfc" }

[[bench]]
name = "davinci"
harness = false

# The P1-6 differential lane's corpus-runnable entry; skipped unless the lane
# feature is on so the plain workspace suite stays single-sided outside
# vize_croquis's own unit tests.
[[test]]
name = "davinci_differential"
required-features = ["davinci-differential"]
