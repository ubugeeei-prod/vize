[package]
name = "vize_atelier_ssr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Vue SSR compiler for Vize"
metadata.vize.stability = "compatibility-preview"

[features]
default = []
legacy = ["vize_armature/legacy", "vize_atelier_core/legacy"]

[dependencies]
vize_s0 = { workspace = true }
vize_relief = { workspace = true }
vize_armature = { workspace = true }
vize_atelier_core = { workspace = true }
vize_croquis = { workspace = true }
vize_s1 = { workspace = true }
vize_s1_to_s2 = { workspace = true }
vize_s2 = { workspace = true }
vize_s2_to_s3 = { workspace = true }
vize_s3 = { workspace = true }

serde = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
davinci_harness = { workspace = true }
vize_davinci = { workspace = true }
insta = { workspace = true }

[lints.clippy]
all = "warn"

[[bench]]
name = "davinci"
harness = false

[package.metadata.cargo-semver-checks.lints]
# SSR codegen result/options are a compatibility-preview compiler boundary.
# P3-9 extends that opt-in boundary with source-map result fields while keeping
# the default `map: None` behavior unchanged. cargo-semver-checks treats public
# struct fields as externally constructible, so additive preview fields are
# allowed here and still covered by release validation.
constructible_struct_adds_field = "allow"
