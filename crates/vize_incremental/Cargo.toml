# The resident tier (Davinci P5-4a): long-lived processes — Maestro,
# `check-server`, watch modes — run the stages as salsa queries keyed by the
# P5-1a stage artifact keys. The one-shot CLI never links this crate
# (charter #10); `tests/tooling/davinci-resident-salsa.test.ts` proves no
# crate outside the resident tier depends on `salsa`.
[package]
name = "vize_incremental"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Resident tier - salsa query database over Davinci stage artifacts (P5-4a)"
publish = false
metadata.vize.stability = "experimental"

[features]
# Borrow selected stage results for an explicitly requested document view.
block-queries = []
# Share a named open document's descriptor and its selected block stages.
open-block-queries = ["block-queries"]
# TS-42's seeded defect (P5-9): weakens the block firewall's equality so the
# equivalence harness proves it catches the stale artifacts that follow.
# Never enabled in a real build.
seeded-stale-cache = []

[dependencies]
salsa = { workspace = true }
toml = { workspace = true }
vize_croquis = { workspace = true }
vize_l0 = { workspace = true }
vize_l1 = { workspace = true }
vize_l1_to_l2 = { workspace = true }
vize_l2 = { workspace = true }

[dev-dependencies]
davinci_harness = { workspace = true }

[[test]]
name = "resident_block_profile"
path = "tests/block_queries/profile.rs"
required-features = ["block-queries"]

[[example]]
name = "resident_block_alloc"
path = "tests/block_queries/alloc.rs"
required-features = ["block-queries"]

[[example]]
name = "open_block_profile"
path = "tests/block_queries/open_profile.rs"
required-features = ["open-block-queries"]

[lints]
workspace = true
