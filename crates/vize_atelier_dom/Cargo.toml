[package]
name = "vize_atelier_dom"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Atelier DOM - The DOM compiler workshop for Vize"
metadata.vize.stability = "alpha-supported"
autotests = false

[features]
legacy = ["vize_atelier_core/legacy"]

# Arms the Davinci DOM differential lanes by exposing
# `compile_template_legacy_with_options` — the shipped parse/transform/codegen
# lane with the L2 emitter declined. The corpus comparators need it as their
# *old* side: since the P2-11 production switch the ordinary entry points
# route through L2, so a differential built on them compares L2 to itself.
# Adds no dependency and no production code path; off in production builds,
# exactly like `vize_atelier_core`'s feature of the same name.
legacy-differential = []
# Deprecated published feature spelling; keep as a compatibility alias.
davinci-differential = ["legacy-differential"]

[dependencies]
vize_l0 = { workspace = true }
vize_atelier_core = { workspace = true }
vize_croquis = { workspace = true }
# Profiled source-map-free DOM compiles can render through the L2 backend.
# TypeScript expression erasure is part of the public DOM option surface, so
# keep the stage library's opt-in implementation available in the production
# graph.
vize_l1_to_l2 = { workspace = true, features = ["typescript"] }

phf = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Inspection metadata is a dev-only, unpublished oracle; strip it on packaging.
vize_curator = { path = "../vize_curator" }
criterion = { workspace = true }
davinci_harness = { workspace = true }
insta = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# L2 test and benchmark fixtures still use the stage diagnostics/types.

[[bench]]
name = "davinci"
harness = false

[[test]]
name = "l2_filters"
path = "tests/l2_filters.rs"
required-features = ["legacy"]

# The text-family adjacency matrix needs the differential lane's legacy
# entry as its oracle.
[[test]]
name = "text_shape_matrix"
required-features = ["legacy-differential"]

# Both lanes key uppercase native events on branch and item roots alike.
[[test]]
name = "uppercase_native_event_keys"
required-features = ["legacy-differential"]

# The `v-pre` witness compares against the differential lane's legacy
# entry, the same oracle the shape matrix uses.
[[test]]
name = "v_pre_freezes_its_subtree"
required-features = ["legacy-differential"]

# Both lanes cache the full component vnode under `v-once`.
[[test]]
name = "component_v_once"
required-features = ["legacy-differential"]

# Both lanes cache the full native element vnode under `v-once`.
[[test]]
name = "element_v_once"
required-features = ["legacy-differential"]

# These read process-global walk and selector counters, so each keeps its own process under cargo test.
[[test]]
name = "davinci_expr_reparse_floor"

[[test]]
name = "davinci_walk_baseline"

[[test]]
name = "l2_build_profile"

[[test]]
name = "l2_codegen_option_selector"

[[test]]
name = "l2_custom_element_selector"

[[test]]
name = "l2_hoist_static_selector"

[[test]]
name = "l2_legacy_selector"

[[test]]
name = "l2_production_selector"

[[test]]
name = "l2_profile"

[[test]]
name = "l2_profile_unsupported"

[[test]]
name = "l2_runtime_module_profile"

[[test]]
name = "l2_sfc_namespace_selector"

[[test]]
name = "l2_sfc_self_closing_selector"

[[test]]
name = "l2_source_map"

# Ordinary integration tests link as one binary; see tests/main.rs.
[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true
