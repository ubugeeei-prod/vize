[package]
name = "vize_canon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Canon - The standard of correctness for Vize type checking"
metadata.vize.stability = "compatibility-preview"

[features]
default = ["native"]
native = [
  "dep:oxc_sourcemap",
  "dep:walkdir",
  "dep:dirs",
  "dep:corsa",
  "dep:corsa_lsp",
  "dep:lsp-types",
  "dep:tempfile",
  "dep:futures",
  "dep:vize_s1",
  "dep:vize_s2",
  "dep:vize_s1_to_s2",
]
# Opt-in legacy Vue (v0.10 / v0.11 / v1 / v2) type-checking surface. Not enabled by the
# default Vue 3 build; turns on the parser-side legacy feature too.
legacy = ["vize_armature/legacy", "vize_atelier_jsx/legacy"]
# TS-25 lane: the S4 projection compared with the current virtual-TS generator.
davinci-differential = []

[dependencies]
vize_s0.workspace = true
# P5-1b ambient key manifests: the Corsa session key folds through them.
vize_davinci.workspace = true
vize_croquis.workspace = true
vize_relief.workspace = true
vize_armature.workspace = true
vize_atelier_core.workspace = true
vize_atelier_jsx.workspace = true
vize_atelier_sfc.workspace = true
# S2 template expressions, projected through the S4 document (P4-5b).
vize_s1 = { workspace = true, optional = true }
vize_s2 = { workspace = true, optional = true }
vize_s1_to_s2 = { workspace = true, optional = true }

# OXC for parsing and AST manipulation (import rewriting)
oxc_parser.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_span.workspace = true
oxc_allocator.workspace = true
oxc_diagnostics.workspace = true
oxc_semantic.workspace = true
oxc_syntax.workspace = true
oxc_sourcemap = { workspace = true, optional = true }

# File system walking (for batch type checking)
walkdir = { workspace = true, optional = true }

# Serialization
serde.workspace = true
serde_json.workspace = true
lsp-types = { workspace = true, optional = true }

# Utilities
dashmap.workspace = true
rayon.workspace = true
tracing.workspace = true
dirs = { workspace = true, optional = true }
thiserror.workspace = true
corsa = { workspace = true, optional = true }
corsa_lsp = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
sha2.workspace = true
glob.workspace = true
tempfile = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# Directory junctions as a privilege-free fallback for directory links.
junction = "2"

[dev-dependencies]
criterion.workspace = true
insta.workspace = true
tempfile.workspace = true
vize_armature.workspace = true
vize_atelier_sfc.workspace = true
vize_croquis.workspace = true
vize_s0.workspace = true

[[test]]
name = "davinci_projection_differential"
required-features = ["davinci-differential"]

[[bench]]
name = "package_route"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
