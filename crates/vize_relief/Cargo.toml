[package]
name = "vize_relief"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Relief - The sculptured AST surface for Vize Vue templates"
metadata.vize.stability = "alpha-supported"

[features]
# Opt-in support for legacy Vue lines (v0.10 / v0.11 / v1 / v2). Off by default
# so the Vue 3 `vize` binary never compiles it. Gates legacy-only AST surface
# such as the Vue 2 filter asset list on [`crate::ast::RootNode`].
#
# Intentionally underscore-prefixed: `cargo-semver-checks`' default feature
# heuristic enables every non-excluded feature, which would surface the
# legacy-only `RootNode::filters` field and trip the (major) constructible
# struct-adds-field lint. The `_`-prefix is on the heuristic's exclude list, so
# the field stays invisible to SemVer checks while still compiling for real
# legacy builds (`vize_atelier_core/legacy` forwards to it). Treat it as an
# internal feature; depend on `vize_atelier_core/legacy` instead.
_legacy = []

# Gates the upstream custom-element classification carried on
# [`crate::ast::ElementNode`]. Only front ends that classify custom elements
# themselves (the JSX lowerer honoring Babel's `isCustomElement`) set it, and
# only `vize_atelier_core`'s element transform reads it, so the Vue 3 template
# pipeline never needs the field.
#
# Underscore-prefixed for the same reason as `_legacy`: `cargo-semver-checks`'
# feature heuristic enables every non-excluded feature, which would surface the
# added field and trip the (major) constructible struct-adds-field lint. Treat
# it as internal; depend on `vize_atelier_core/_custom_elements` instead.
_custom_elements = []

[dependencies]
vize_carton = { workspace = true }

serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.cargo-semver-checks.lints]
# `ElementNode::is_custom_element` landed unconditionally in #3718 and moves
# behind `_custom_elements` here, before any release carried it: no published
# `vize_relief` ever exposed the field, so no consumer can lose it. The gate
# compares against the base branch rather than the registry, though, so it sees
# the field disappear from main's default surface and reports a (major) pub
# field removal — both on this change and on the push-triggered run once it
# lands on main.
#
# A conventional breaking marker is not the fix: `vize_relief` is
# alpha-supported, a tier whose contract has an API break fixed rather than
# marked, and hiding an unpublished field is exactly that fix. So allow this
# lint the way `vize_armature` allows the field-add lint its unprefixed
# `legacy` feature cannot dodge. Once main's baseline no longer carries the
# field the two surfaces agree again and this allow can be dropped.
struct_pub_field_missing = "allow"
