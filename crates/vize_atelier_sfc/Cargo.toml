[package]
name = "vize_atelier_sfc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Atelier SFC - The Single File Component workshop for Vize"
metadata.vize.stability = "alpha-supported"

[features]
default = ["native"]
native = ["dep:lightningcss", "lightningcss/serde", "dep:parcel_selectors"]
legacy = ["vize_atelier_core/legacy", "vize_atelier_ssr/legacy"]
# Arms the Davinci P1-7 differential lane across the atelier crates: every
# retained-AST consumption dual-runs the legacy re-parse and panics on
# divergence. Off in production builds; the corpus-runnable entry below
# requires it.
davinci-differential = [
  "vize_atelier_core/davinci-differential",
  "vize_atelier_vapor/davinci-differential",
]
# Arms only the DOM legacy-lane override (P3-17) so the production-reach
# gate can compile every `compile_sfc` shape on both DOM lanes and compare
# the complete modules, without the P1-7 retained-AST dual-run panics.
davinci-dom-differential = ["vize_atelier_dom/davinci-differential"]

[dependencies]
vize_s0.workspace = true
vize_croquis = { workspace = true }
vize_atelier_core = { workspace = true }
vize_atelier_dom = { workspace = true }
vize_atelier_ssr = { workspace = true }
vize_atelier_vapor = { workspace = true }
# The Davinci pug dialect: `<template lang="pug">` desugars through S1.
vize_s1_to_s2 = { workspace = true }

# OXC for JavaScript/TypeScript parsing and transformation
oxc_parser = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_span = { workspace = true }
oxc_allocator = { workspace = true }
oxc_syntax = { workspace = true }
oxc_semantic = { workspace = true }
oxc_transformer = { workspace = true }
oxc_codegen = { workspace = true }
oxc_sourcemap = { workspace = true }

memchr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
lightningcss = { workspace = true, optional = true }
parcel_selectors = { workspace = true, optional = true }
regex = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
davinci_test_support = { workspace = true }
insta = { workspace = true }
pklrust = { workspace = true }
toml = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
davinci_harness = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "sfc_parse"
harness = false

[[bench]]
name = "sfc_compile"
harness = false

[[bench]]
name = "output_boundary"
harness = false

[[test]]
name = "davinci_differential"
required-features = ["davinci-differential"]

[[test]]
name = "davinci_production_reach"
required-features = ["davinci-dom-differential"]

[[example]]
name = "css_engine_recovery"
required-features = ["native"]

[lints]
workspace = true
