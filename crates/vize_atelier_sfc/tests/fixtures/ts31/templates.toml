# TS-31 source-map coverage battery: template fixtures (Davinci P3-9).
#
# Every fixture is compiled by the DOM, Vapor and SSR backends with source maps
# on. Each `[[fixture.anchor]]` names one authored token the map must resolve:
#
# - `find` locates the token's context (`nth` picks the occurrence, default 0)
#   and `token` (default: `find`) is the authored token inside that context.
#   The authored span is the token's bytes; the oracle comes from this file,
#   never from the map under test.
# - `static-template` and `text-matching-recovery` anchors are emitted
#   verbatim (override with `generated`).
# - `rewritten-identifier` anchors are emitted as the identifier behind an
#   optional context rewrite (`_ctx.`, `$setup.`, `$props.`, `_unref(` ...).
# - `section-boundary` anchors carry the construct each backend emits where
#   the authored structural unit's code begins (`dom`, `vapor`, `ssr`); the
#   authored token is the unit's opening `<`.

