<script lang="ts">
export const LIMIT: number = 3
</script>

<script setup lang="ts">
import { computed } from 'vue'
const emit = defineEmits<{ (e: 'change', value: number): void }>()
const limit = computed(() => LIMIT)
function notify(value: number) {
  emit('change', value)
}
</script>

<template>
  <button @click="notify(limit)">{{ limit }}</button>
</template>
'''

