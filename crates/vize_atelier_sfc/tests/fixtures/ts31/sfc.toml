[[fixture]]
name = "setup-counter"
source = '''
<template>
  <button @click="bump">{{ label }}</button>
</template>

<script setup>
import { computed, ref } from 'vue'

const count = ref(0)
const step = ref(2)
const label = computed(() => `Count: ${count.value}`)
function bump() {
  count.value += step.value
}
</script>
'''

