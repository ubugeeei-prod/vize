# Standalone Vize fork manifest; original is retained as Cargo.toml.orig.
[package]
edition = "2021"
name = "vize_lightningcss"
version.workspace = true
authors = ["Devon Govett <devongovett@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Vize fork of LightningCSS with bounded parser repairs and validated source-map archives"
readme = "README.md"
keywords = ["CSS", "minifier", "Parcel"]
license = "MPL-2.0"
repository = "https://github.com/ubugeeei-prod/vize"
include = [
  "/src",
  "/tests",
  "/examples",
  "/benches",
  "/UPSTREAM-Cargo.toml",
  "/LICENSE",
  "/README.md",
  "/UPSTREAM.md",
  "/UPSTREAM-IMPORT.json",
  "/rustfmt.toml",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
browserslist = ["browserslist-rs"]
bundler = ["dashmap", "sourcemap", "rayon"]
cli = ["clap", "serde_json", "browserslist", "jemallocator"]
default = ["bundler", "nodejs", "sourcemap"]
into_owned = [
  "static-self",
  "static-self/smallvec",
  "static-self/indexmap",
  "parcel_selectors/into_owned",
]
jsonschema = ["schemars", "serde", "parcel_selectors/jsonschema"]
nodejs = ["dep:serde", "dep:serde-content"]
serde = [
  "dep:serde",
  "dep:serde-content",
  "bitflags/serde",
  "smallvec/serde",
  "cssparser/serde",
  "parcel_selectors/serde",
  "into_owned",
]
sourcemap = ["parcel_sourcemap"]
substitute_variables = ["visitor", "into_owned"]
visitor = []

[lib]
name = "lightningcss"
crate-type = ["rlib"]
path = "src/lib.rs"

[[bin]]
name = "lightningcss"
path = "src/main.rs"
required-features = ["cli"]

[[example]]
name = "custom_at_rule"
path = "examples/custom_at_rule.rs"
required-features = ["visitor"]

[[example]]
name = "schema"
path = "examples/schema.rs"

[[example]]
name = "serialize"
path = "examples/serialize.rs"
required-features = ["serde"]

[[example]]
name = "vize_bundler_before_observer"
path = "examples/vize_bundler_before_observer.rs"
required-features = ["bundler", "sourcemap", "serde"]

[[test]]
name = "cli_integration_tests"
path = "tests/cli_integration_tests.rs"
required-features = ["cli"]

[[test]]
name = "test_cssom"
path = "tests/test_cssom.rs"

[[test]]
name = "test_custom_parser"
path = "tests/test_custom_parser.rs"

[[test]]
name = "test_serde"
path = "tests/test_serde.rs"

[[test]]
name = "vize_engine_exit"
path = "tests/vize_engine_exit.rs"

[[test]]
name = "vize_cli_conflict_contract"
path = "tests/vize_cli_conflict_contract.rs"
required-features = ["cli"]

[[test]]
name = "vize_source_map_contract"
path = "tests/vize_source_map_contract.rs"
required-features = ["bundler", "sourcemap"]

[[bench]]
name = "transform"
path = "benches/transform.rs"
harness = false

[dependencies.ahash]
version = "0.8.7"

[dependencies.bitflags]
version = "2.2.1"

[dependencies.browserslist-rs]
version = "0.19.0"
optional = true

[dependencies.clap]
version = "4.5.0"
features = ["derive"]
optional = true

[dependencies.const-str]
version = "1.1.0"

[dependencies.cssparser]
version = "0.37.0"

[dependencies.cssparser-color]
version = "0.5.0"

[dependencies.dashmap]
version = "5.0.0"
optional = true

[dependencies.data-encoding]
version = "2.3.2"

[dependencies.indexmap]
version = "2.2.6"
features = ["serde"]

[dependencies.itertools]
version = "0.10.1"

[dependencies.lazy_static]
version = "1.4.0"

[dependencies.lightningcss-derive]
version = "=1.0.0-alpha.43"

[dependencies.parcel_selectors]
version = "0.28.3"

[dependencies.parcel_sourcemap]
workspace = true
features = ["json"]
optional = true

[dependencies.pastey]
version = "0.1.0"

[dependencies.pathdiff]
version = "0.2.1"

[dependencies.rayon]
version = "1.5.1"
optional = true

[dependencies.schemars]
version = "0.8.19"
features = ["smallvec", "indexmap2"]
optional = true

[dependencies.serde]
version = "1.0.228"
features = ["derive"]
optional = true

[dependencies.serde-content]
version = "0.1.2"
features = ["serde"]
optional = true

[dependencies.serde_json]
version = "1.0.78"
optional = true

[dependencies.smallvec]
version = "1.7.0"
features = ["union"]

[dependencies.static-self]
version = "0.1.2"
optional = true

[dev-dependencies.assert_cmd]
version = "2.0"

[dev-dependencies.assert_fs]
version = "1.0"

[dev-dependencies.criterion]
version = "4.5.0"
package = "codspeed-criterion-compat"

[dev-dependencies.indoc]
version = "1.0.3"

[dev-dependencies.predicates]
version = "2.1"

[dev-dependencies.pretty_assertions]
version = "1.4.0"

[dev-dependencies.serde_json]
version = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.3"
default-features = false

[target.'cfg(target_os = "macos")'.dependencies.jemallocator]
version = "0.3.2"
features = ["disable_initial_exec_tls"]
optional = true
