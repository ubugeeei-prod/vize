[package]
name = "oxc_parser"
version = "0.142.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
publish = false

[workspace]

[dependencies]
vize_parser_impl = { package = "vize_oxc_parser", path = "../oxc_parser", default-features = false }

[features]
default = ["regular_expression"]
regular_expression = ["vize_parser_impl/regular_expression"]
mutate_tokens = ["vize_parser_impl/mutate_tokens"]
benchmarking = ["vize_parser_impl/benchmarking"]
