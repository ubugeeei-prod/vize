[package]
name = "vize_oxc_parser"
version.workspace = true
authors = ["Boshen <boshenc@gmail.com>", "Oxc contributors"]
categories = ["compilers", "development-tools", "web-programming"]
edition = "2024"
homepage = "https://oxc.rs"
include = ["/examples", "/src", "/LICENSE", "/UPSTREAM.md"]
keywords = ["JavaScript", "TypeScript", "linter", "minifier", "parser"]
license = "MIT"
repository = "https://github.com/ubugeeei-prod/vize"
rust-version = "1.95.0"
description = "Vize's fork of the Oxc parser with admission and observation APIs."

[lib]
name = "oxc_parser"

[dependencies]
oxc_allocator = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }
oxc_ast = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }
oxc_ast_visit = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }
oxc_data_structures = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f", features = [
  "assert_unchecked",
  "branch_hints",
  "fieldless_enum",
] }
oxc_diagnostics = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }
oxc_ecmascript = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }
oxc_regular_expression = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f", optional = true }
oxc_span = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }
oxc_str = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }
oxc_syntax = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }

bitflags = "2.13.0"
compact_str = "=0.10.0"
cow-utils = "0.1.3"
num-bigint = "0.5.0"
num-traits = "0.2.19"
rustc-hash = "2"
seq-macro = "0.3.6"

memchr = "2.8.2"

[dev-dependencies]
oxc_ast = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f", features = [
  "serialize",
] }
oxc_ast_visit = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f", features = [
  "serialize",
] }
pico-args = "0.5.0"

[features]
default = ["regular_expression"]
# Parse regex
regular_expression = ["dep:oxc_regular_expression"]
# Feature to enable mutation of tokens.
# Should not ordinarily be enabled. Only used by ESTree tokens conversion.
mutate_tokens = []
# Expose Lexer for benchmarks
benchmarking = []

# All supporting OXC crates remain at the official pinned revision.
