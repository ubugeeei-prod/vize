[package]
name = "vize_oxc_formatter"
version.workspace = true
authors = ["Boshen <boshenc@gmail.com>", "Oxc contributors"]
categories = ["compilers", "development-tools", "web-programming"]
edition = "2024"
homepage = "https://oxc.rs"
include = ["/src", "/LICENSE", "/UPSTREAM.md"]
keywords = ["JavaScript", "TypeScript", "linter", "minifier", "formatter"]
license = "MIT"
publish = false
repository = "https://github.com/ubugeeei-prod/vize"
rust-version = "1.95.0"
description = "Vize's pinned Oxc formatter with a unary-comment parentheses backport."

[lib]
name = "oxc_formatter"
doctest = false

[dependencies]
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_diagnostics.workspace = true
oxc_formatter_core.workspace = true
oxc_parser.workspace = true
oxc_semantic = { workspace = true, optional = true }
oxc_span.workspace = true
oxc_syntax.workspace = true
oxc_jsdoc = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }
oxc_str = { version = "=0.142.0", git = "https://github.com/oxc-project/oxc", rev = "fc702c1fa9f0412d06ec6908b58cd395b826cf7f" }

cow-utils = "0.1.3"
fast-glob = "1.1.0"
markdown = "1.0.0"
natord = "1.0.9"
nodejs-built-in-modules = "1.0.0"
itoa = "1.0.18"
phf = { version = "0.14.0", features = ["macros"] }
rustc-hash = "2"
smallvec = { version = "1.15.2", features = ["union", "serde"] }
unicode-width = "0.2"

[features]
default = []
detect_code_removal = ["dep:oxc_semantic"]
