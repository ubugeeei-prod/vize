# Assertion-lint allowlist (Davinci P0-12) — consumed by
# tools/commands/davinci/assertion-lint.rs, doctrine in davinci-road/assurance.md
# ("Strict oracles — no partial matching").
#
# Each [[allow]] group carries one justification and one expiry, and lists
# every file path it covers; a listed path suppresses every finding in that
# file until the group expires. Expired groups stop suppressing and the
# findings come back. New test code must never be added here — fix the
# assertion instead. This list only shrinks: a path whose findings are all
# cleaned up must be dropped, or the lint warns about it.
#
# Split a path into its own group when it needs a narrower justification or
# a shorter expiry than the group it currently sits in.
#
# Initial population: the pre-existing violation set found when the lint
# first landed (236 files, captured 2026-08-14 on the davinci branch).

