[mutation]
# cargo-mutants minimum scores per crate. Populated by P0-12.

[traversal]
# Fused compile-path walk-count ceilings per fixture. Populated by P2-12.

[sourcemap]
# Minimum coverage per backend and mapping category. Populated before P3-9
# merges; deletion of the legacy recovery requires new-path coverage >= the
# old heuristic's measured coverage.

[resource]
# Resident-tier ceilings: rss_peak_bytes per machine preset, cold_start_ms,
# idle_cpu_pct (mean over a 60 s idle window), keystroke_p95_ms — with the
# measurement methodology documented next to each number. Populated by P5-11.
