[traversal]
# Fused compile-path traversal ceilings per backend per ladder fixture,
# recorded at Davinci P2-12a from `vize_atelier_core::walk_probe`. Ids are
# `<backend>_<fixture>`; the full record, the reproducing command, the two-run
# determinism proof and — crucially — the two classes the probe deliberately
# does not count are in `walk-baseline.md`.
#
# Fields, both mandatory:
#   walks  — stage traversals of the template tree entered during one fused
#            compile. Two today on every backend: the transform lane, then the
#            backend's own descent.
#   visits — template nodes those traversals dispatched on.
#
# Both are **deterministic and machine-independent** — they depend on the
# fixture and the pipeline shape, not on the machine — so this section gates
# **exactly**, with no tolerance, from day one and does not wait for the
# Blacksmith reference runner. That is the same reasoning that made the
# `[bench] allocs` gate exact at P1-13, and unlike `wall_p50_ns` there is no
# "0 means unrecorded" state here: an id is present with its measured numbers
# or it fails reconciliation.
#
# `tests/tooling/davinci-traversal-budgets.test.ts` reconciles these ids
# against the ladder x the backends that ship a `tests/davinci_walk_baseline.rs`
# recorder, in both directions, and against the tables those recorders pin — so
# a fixture without a ceiling, a ceiling without a fixture, and a ceiling that
# disagrees with the Rust-side pin all fail.

