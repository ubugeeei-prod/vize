# Pass-manager zero-cost pair (P2-3). The claim these two exist to gate is that
# `NoObserver`'s empty bodies inline away, so running a plan through the
# observer driver costs what running it without the driver costs. `allocs` is
# where that is enforced: both entries are a *measured* zero over the same
# four-pass fixture pipeline, and the exact alloc gate fails either one that
# starts allocating. Wall p50 is 6 ns for both locally, which is under
# criterion's resolution for a routine this small and is exactly why the gate
# is on the alloc side.
davinci_pipeline_unobserved = { wall_p50_ns = 0, allocs = 0, rss_peak_bytes = 0, wall_tolerance = 0.05 }
davinci_pipeline_no_observer = { wall_p50_ns = 0, allocs = 0, rss_peak_bytes = 0, wall_tolerance = 0.05 }

# Fact verify zero-cost pair (P4-1b), the same shape one layer up: compute a
# demand, run three passes through `FactManager::after_pass` (keep all / keep
# one / keep none), recompute and query. `unobserved` trusts every
# `Preserved` claim (`NoFactVerify`); `observed` hands in
# `FactVerifyObserver`, whose recompute-and-compare mode exists only under
# `debug_assertions`. Both are a *measured* 19 allocations in the release
# bench profile — tables and their boxes, nothing from the observer — and the
# exact alloc gate fails either one that drifts.
davinci_fact_query_unobserved = { wall_p50_ns = 0, allocs = 19, rss_peak_bytes = 0, wall_tolerance = 0.05 }
davinci_fact_query_observed = { wall_p50_ns = 0, allocs = 19, rss_peak_bytes = 0, wall_tolerance = 0.05 }

