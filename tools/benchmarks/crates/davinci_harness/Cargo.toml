[package]
name = "davinci_harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Davinci bench harness - criterion wrapper with allocation and RSS metrics"
publish = false
autobenches = false
metadata.vize.stability = "experimental"

[features]
# Benchmark-only instrumentation; no production crate enables this feature.
instruction-counts = ["dep:valgrind-requests"]

[dependencies]
criterion = { workspace = true }
davinci_test_support = { workspace = true }
mimalloc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = { workspace = true }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
valgrind-requests = { version = "=1.2.0", optional = true, default-features = false, features = [
  "act",
] }

[dev-dependencies]
tempfile = { workspace = true }
vize_l0 = { workspace = true }
vize_l1 = { workspace = true }
vize_l1_to_l2 = { workspace = true }
vize_l2 = { workspace = true }

[[bench]]
name = "selfcheck"
harness = false

[lints]
workspace = true
