[package]
name = "davinci_harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Davinci bench harness - criterion wrapper with allocation and RSS metrics"
publish = false
autobenches = false
metadata.vize.stability = "experimental"

[features]
# Diagnostic-only ownership ledger; never narrows process-global totals.
allocation-window-diagnostics = []
# Cross-tool qualification of original and printing Programs on the same snapshot.
program-snapshot = ["vize_l1/program-snapshot", "dep:oxc_formatter", "dep:vize_glyph"]
# Benchmark-only instrumentation; no production crate enables this feature.
instruction-counts = ["dep:valgrind-requests", "dep:stacker"]

[dependencies]
criterion = { workspace = true }
davinci_test_support = { workspace = true }
mimalloc = { workspace = true }
oxc_formatter = { workspace = true, optional = true }
vize_glyph = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = { workspace = true }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
valgrind-requests = { version = "=1.2.0", optional = true, default-features = false, features = [
  "act",
] }
stacker = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
vize_l0 = { workspace = true }
vize_l1 = { workspace = true }
vize_l1_to_l2 = { workspace = true }
vize_l2 = { workspace = true }

[[test]]
name = "program_snapshot"
required-features = ["program-snapshot"]

[[bench]]
name = "selfcheck"
harness = false

[lints]
workspace = true
