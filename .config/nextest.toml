# CI uses the same pinned nextest on the archive builder and every shard.
nextest-version = "0.9.146"

# Keep the seven exact allocation vectors for this one case in both PR/full
# JUnit receipts; all other output policies and runtime settings stay unchanged.
[[profile.default.overrides]]
filter = 'package(=vize_atelier_vapor) & binary(=davinci_vapor_native_budget) & test(=native_lane_stays_within_its_allocation_ceilings)'
junit.store-success-output = true

# Preserve complete public #7989 CLI/API observations in both inherited PR/full
# JUnit receipts. Only these exact two laws opt in; runtime policies stay fixed.
[[profile.default.overrides]]
filter = '''(package(=vize) & binary(=lint_call_source_cli) & test(=original_argv_and_complete_comment_string_real_call_vectors_are_checked)) |
(package(=vize_patina) & binary(=call_source_7989) & test(=original_and_controls_keep_complete_configured_service_results))'''
junit.store-success-output = true

[profile.pr]
# Audited real-TSGO cases remain mandatory in the full Cargo T1 lane.
# Exact package, binary and names keep future tests in the PR tier.
default-filter = '''not ((package(=vize_maestro) & (
  test(=ide::rename::corsa_session_tests::concurrent_real_corsa_rename_sessions_are_isolated) |
  test(=ide::rename::corsa_session_tests::direct_first::dependency_change_rearms_the_shared_editor_transport_once) |
  test(=ide::rename::corsa_session_tests::direct_first::direct_first_renames_survive_twenty_session_shutdown_overlap)
)) | (package(=vize_canon) & binary(=fix_history_diagnostics) & (
  test(=inline_event_assignments_preserve_exact_diagnostics) |
  test(=deferred_template_reads_preserve_script_diagnostics) |
  test(=required_props_keep_exact_unicode_diagnostics) |
  test(=unicode_reserved_props_preserve_value_diagnostics) |
  test(=reserved_prop_shapes_preserve_literal_and_member_diagnostics) |
  test(=component_event_tuples_preserve_all_argument_diagnostics) |
  test(=typed_import_meta_preserves_exact_authored_diagnostics) |
  test(=slot_outlet_keys_preserve_complete_project_diagnostics) |
  test(=options_api_any_instance_preserves_complete_original_diagnostics) |
  test(=authored_unused_symbols_preserve_complete_original_diagnostics) |
  test(=split_script_setup_preserves_complete_original_diagnostics) |
  test(=v_for_source_callbacks_preserve_complete_original_diagnostics) |
  test(=declared_prop_names_preserve_complete_original_diagnostics) |
  test(=component_v_for_source_preserves_complete_original_diagnostics) |
  test(=template_suppression_preserves_complete_original_diagnostics)
)))'''
fail-fast = false
retries = 0
test-threads = 16
slow-timeout = "60s"

[profile.pr.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

[test-groups]
# Guest builders share target/contract-guests. Their OnceLocks are process-local,
# so nextest must limit the guest builds across test processes on each runner.
contract-guests = { max-threads = 1 }

[[profile.pr.overrides]]
filter = 'package(=vize_extension_host)'
test-group = "contract-guests"

# Full T1 has no default-filter: every ordinary workspace case remains selected.
[profile.full]
fail-fast = false
retries = 0
test-threads = 16
slow-timeout = "60s"

[profile.full.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

[[profile.full.overrides]]
filter = 'package(=vize_extension_host)'
test-group = "contract-guests"
