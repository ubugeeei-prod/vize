[target.aarch64-apple-darwin]
linker = "clang"

[target.x86_64-apple-darwin]
linker = "clang"

# Git for Windows ships a Unix `link.exe` that can shadow the MSVC linker on
# GitHub-hosted runners. Use the Rust toolchain's bundled linker explicitly for
# Windows MSVC targets so release builds do not depend on PATH ordering.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[target.aarch64-pc-windows-msvc]
linker = "rust-lld"

# LOCAL VALIDATION ONLY: stock corsa_client 2.0.0-beta.1 source custody and patch
# are retained under sdk-split-drain. This is not a production SDK dependency.
[patch.crates-io]
corsa_client = { path = "tests/tooling/support/native-beta-dto/sdk-split-drain/corsa_client" }
