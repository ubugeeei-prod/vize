[env]
# Clippy normally searches the workspace root. Keep its repository policy with
# the other Cargo configuration without requiring callers to pass an option.
CLIPPY_CONF_DIR = { value = ".cargo", relative = true }

[target.aarch64-apple-darwin]
linker = "clang"

[target.x86_64-apple-darwin]
linker = "clang"

# Git for Windows ships a Unix `link.exe` that can shadow the MSVC linker on
# GitHub-hosted runners. Use the Rust toolchain's bundled linker explicitly for
# Windows MSVC targets so release builds do not depend on PATH ordering.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[target.aarch64-pc-windows-msvc]
linker = "rust-lld"
